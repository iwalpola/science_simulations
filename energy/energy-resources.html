<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2.6 Energy resources: a 3D story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--cyan:#19a3dc;--deep:#0a5f8f;--orange:#ef8a22;--ink:#17324d;--paper:#ffffff;--wash:#eaf6fc}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:#bfe6f5}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}

#legend{position:fixed;top:12px;right:12px;width:590px;background:#e8ebff;border:2px solid #aab3d8;border-radius:10px;padding:8px 12px;font-size:13.5px;box-shadow:0 6px 16px rgba(40,50,110,.18)}
#legend .rows{display:grid;grid-template-columns:repeat(3,1fr);column-gap:10px}
#legend .row{display:flex;align-items:center;gap:7px;margin:4px 0;white-space:nowrap}
#legend .note{margin:8px 0 0;font-size:11.5px;line-height:1.35;color:#46507e}

.blk{display:inline-grid;place-items:center;width:23px;height:23px;border-radius:5px;font:800 13px Nunito,sans-serif;border:2px solid rgba(0,0,0,.4);box-shadow:inset 0 3px 0 rgba(255,255,255,.55);vertical-align:middle;flex:none}
.blk.K{background:#d2d2d2;color:#222}.blk.P{background:#9d5cf0;color:#fff}.blk.E{background:#27b0e6;color:#0e2338}
.blk.T{background:#e5531a;color:#fff}.blk.L{background:#f4e409;color:#3a3300}.blk.C{background:#1ed31e;color:#063306}

#panel{position:fixed;left:16px;top:88px;bottom:16px;width:392px;background:var(--paper);border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 14px 40px rgba(10,60,100,.28);transition:bottom .25s ease}
#panel.min{bottom:auto}
#panel.min #body,#panel.min nav{display:none}
.ph{background:var(--cyan);color:#fff;padding:14px 18px 14px;position:relative}
#kicker{font-size:13px;font-weight:700;opacity:.9}
#title{margin:3px 0 0;font:600 25px/1.15 Fredoka,sans-serif;padding-right:86px}
#replay,#minBtn{position:absolute;top:14px;width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:transparent;color:#fff;font-size:18px;cursor:pointer}
#replay{right:12px}
#minBtn{right:54px;font-size:20px;line-height:1}
#replay:hover,#minBtn:hover{background:rgba(255,255,255,.2)}
#body{padding:14px 18px 8px;overflow-y:auto;font-size:15.5px;line-height:1.55;flex:1}
#body p{margin:0 0 11px}
#body .lead{font-size:17px;font-weight:700}
.objectives{background:var(--wash);border-radius:12px;padding:10px 14px;margin:0 0 12px;border-left:5px solid var(--cyan)}
.objectives h4{margin:0 0 4px;font:600 17px Fredoka,sans-serif;color:var(--deep)}
.objectives ol{margin:4px 0 2px;padding-left:20px}
.key{background:#fff4e6;border-left:5px solid var(--orange);border-radius:0 10px 10px 0;padding:9px 12px;margin:0 0 12px;font-size:14.5px}
.chain{display:flex;align-items:flex-start;gap:4px;flex-wrap:wrap;margin:2px 0 11px}
.cstep{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:44px}
.cstep small{font-size:11px;color:#51708a;text-align:center;line-height:1.1}
.arr{font-weight:800;color:#8aa3b8;padding-top:2px}
ol.steps{padding-left:20px;margin:0 0 10px}
ol.steps li{margin-bottom:6px}
ol.steps .chain{margin:4px 0 2px}
.small{font-size:13.5px;color:#4b6780}
.hint{font-size:13.5px;color:#4b6780;background:var(--wash);padding:7px 10px;border-radius:8px}
details.check{border-top:3px solid var(--orange);padding:9px 0 2px;margin:6px 0 10px}
details.check summary{color:#c96a0a;cursor:pointer;font-weight:700;list-style:none}
details.check summary::before{content:'▸ ';}
details.check[open] summary::before{content:'▾ ';}
details.check p{margin:6px 0 0;background:#fff4e6;padding:7px 10px;border-radius:8px}
table.cmp{width:100%;border-collapse:collapse;font-size:13.5px;margin:0 0 14px}
table.cmp th{background:var(--cyan);color:#fff;font-weight:700;padding:6px;text-align:left}
table.cmp td{border-bottom:1px solid #d7e7f0;padding:6px;vertical-align:top}
table.cmp td:first-child{font-weight:700;color:var(--deep)}
.q{background:var(--wash);border-radius:12px;padding:10px 12px;margin:0 0 12px}
.q h4{margin:0 0 6px;font:600 16px Fredoka,sans-serif;color:var(--deep)}
.q select{font:inherit;font-size:14px;border:2px solid #9cc3d8;border-radius:6px;padding:1px 3px;background:#fff}
.q select.good{border-color:#1fa34a;background:#e8f8ec}.q select.bad{border-color:#d33;background:#fdeaea}
.btn{font:700 14px Nunito,sans-serif;border:none;border-radius:999px;padding:7px 14px;background:var(--orange);color:#fff;cursor:pointer}
.btn.ghost{background:transparent;color:var(--deep);border:2px solid #9cc3d8}
.res{font-weight:700;margin-left:8px;font-size:14px}
.opts{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.opt{display:flex;align-items:center;gap:8px;text-align:left;font:inherit;font-size:14px;border:2px solid #9cc3d8;border-radius:10px;padding:6px 9px;background:#fff;cursor:pointer}
.opt:hover{border-color:var(--cyan)}
.opt.done{border-color:#1fa34a;background:#e8f8ec;cursor:default}
.opt .num{font:600 15px Fredoka;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#1fa34a;color:#fff;flex:none}
.shake{animation:shake .35s;border-color:#d33!important}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.selfcheck label{display:flex;gap:8px;align-items:flex-start;margin:5px 0;font-size:14.5px}

nav{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid #e1edf3}
nav button.navb{font:700 15px Nunito,sans-serif;border:none;border-radius:999px;padding:9px 16px;cursor:pointer}
#prev{background:var(--wash);color:var(--deep)}
#next{background:var(--orange);color:#fff;margin-left:auto}
nav button:disabled{opacity:.35;cursor:default}
#dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;flex:1}
#dots button{width:11px;height:11px;border-radius:50%;border:none;background:#c6dce8;padding:0;cursor:pointer}
#dots button.on{background:var(--cyan);transform:scale(1.3)}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

@media (max-width:760px){
  #legend{width:auto;top:8px;right:8px;padding:6px 8px;font-size:10.5px}
  #legend .note{display:none}
  #legend .rows{grid-template-columns:1fr 1fr;column-gap:6px}
  #legend .row{gap:4px;margin:2px 0;white-space:normal}
  #legend .blk{width:17px;height:17px;font-size:10px}
  #panel{left:8px;right:8px;width:auto;top:auto;bottom:8px;max-height:46vh}
  #title{font-size:20px}
  #body{font-size:14.5px}
}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="3D energy resources scene. Drag to rotate, scroll to zoom."></canvas>

<aside id="legend" aria-label="Energy block key">
  <div class="rows">
    <div class="row"><span class="blk K">K</span>Kinetic energy</div>
    <div class="row"><span class="blk T">T</span>Thermal energy</div>
    <div class="row"><span class="blk P">P</span>Gravitational potential energy</div>
    <div class="row"><span class="blk L">L</span>Light energy</div>
    <div class="row"><span class="blk E">E</span>Electrical energy</div>
    <div class="row"><span class="blk C">C</span>Chemical energy</div>
  </div>
</aside>

<aside id="panel">
  <div class="ph">
    <div id="kicker"></div>
    <h2 id="title"></h2>
    <button id="replay" title="Replay this animation" aria-label="Replay this animation">↻</button>
    <button id="minBtn" title="Minimize panel" aria-label="Minimize panel">–</button>
  </div>
  <div id="body"></div>
  <nav>
    <button class="navb" id="prev">Back</button>
    <div id="dots"></div>
    <button class="navb" id="next">Next</button>
  </nav>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const seg01=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const TAU=Math.PI*2;
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Energy types ---------- */
const TYPES={
  K:{n:'Kinetic',c:'#d2d2d2',f:'#222222'},
  P:{n:'Gravitational potential',c:'#9d5cf0',f:'#ffffff'},
  E:{n:'Electrical',c:'#27b0e6',f:'#0e2338'},
  T:{n:'Thermal',c:'#e5531a',f:'#ffffff'},
  L:{n:'Light',c:'#f4e409',f:'#3a3300'},
  C:{n:'Chemical',c:'#1ed31e',f:'#063306'}
};

/* ---------- Renderer / scene ---------- */
const canvas=$('#c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color('#bfe6f5');
scene.fog=new THREE.Fog('#bfe6f5',80,400);
const camera=new THREE.PerspectiveCamera(45,1,0.1,2000);
scene.add(new THREE.HemisphereLight('#ffffff','#6f7f5c',0.8));
const dl=new THREE.DirectionalLight('#fff3dc',0.75); dl.position.set(60,120,90); scene.add(dl);
const dl2=new THREE.DirectionalLight('#cfe8ff',0.25); dl2.position.set(-80,40,-60); scene.add(dl2);

/* ---------- Helpers ---------- */
function M(c,o){return new THREE.MeshStandardMaterial(Object.assign({color:c,flatShading:true,roughness:0.85},o||{}));}
function glass(c,op){return new THREE.MeshStandardMaterial({color:c,transparent:true,opacity:op,depthWrite:false,roughness:0.2,side:THREE.DoubleSide});}
function mat(m){return typeof m==='string'?M(m):m;}
function box(w,h,d,m,x,y,z,p){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(m));o.position.set(x||0,y||0,z||0);if(p)p.add(o);return o;}
function cyl(rt,rb,h,m,x,y,z,p,seg){const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||16),mat(m));o.position.set(x||0,y||0,z||0);if(p)p.add(o);return o;}
function sph(r,m,x,y,z,p){const o=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),mat(m));o.position.set(x,y,z);if(p)p.add(o);return o;}
function rod(a,b,r,m,p){const A=V(...a),B=V(...b);const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,A.distanceTo(B),6),mat(m));o.position.copy(A).add(B).multiplyScalar(0.5);o.quaternion.setFromUnitVectors(V(0,1,0),B.clone().sub(A).normalize());p.add(o);return o;}
function tube(pts,r,m,p){const c=new THREE.CatmullRomCurve3(pts.map(a=>V(...a)),false,'centripetal');const o=new THREE.Mesh(new THREE.TubeGeometry(c,Math.max(8,pts.length*10),r,8,false),mat(m));p.add(o);return o;}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function shade(hex,k){const n=parseInt(hex.slice(1),16);return `rgb(${Math.round((n>>16)*k)},${Math.round((n>>8&255)*k)},${Math.round((n&255)*k)})`;}

/* Energy block materials (canvas textures with letters) */
const blockMats={};
function blockMat(t){
  if(blockMats[t])return blockMats[t];
  const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
  x.fillStyle=shade(TYPES[t].c,0.55);rr(x,0,0,128,128,24);x.fill();
  x.fillStyle=TYPES[t].c;rr(x,9,9,110,110,16);x.fill();
  const g=x.createLinearGradient(0,9,0,60);g.addColorStop(0,'rgba(255,255,255,.55)');g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;rr(x,9,9,110,52,16);x.fill();
  x.fillStyle=TYPES[t].f;x.font='800 70px Nunito, Arial, sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(t,64,70);
  const tex=new THREE.CanvasTexture(c);
  return blockMats[t]=new THREE.MeshStandardMaterial({map:tex,emissive:'#ffffff',emissiveMap:tex,emissiveIntensity:0.45,roughness:0.55});
}
const blockGeo=new THREE.BoxGeometry(1,1,1);
const pool=[];
function getBlock(t){const m=pool.pop()||new THREE.Mesh(blockGeo);m.material=blockMat(t);m.visible=true;return m;}
function freeBlock(m){if(m.parent)m.parent.remove(m);pool.push(m);}
function staticBlock(t,p,x,y,z,s){const m=new THREE.Mesh(blockGeo,blockMat(t));m.position.set(x,y,z);m.scale.setScalar(s||0.6);p.add(m);return m;}

/* Flow: blocks travel along a chain of curves and change type at each boundary */
const flows=[];
class Flow{
  constructor(parent,segs,o){
    o=o||{};this.parent=parent;this.interval=o.interval||0.8;this.size=o.size||0.6;this.fade=!!o.fade;
    this.timer=o.delay||0;this.enabled=true;this.blocks=[];
    this.segs=segs.map(s=>{const c=new THREE.CatmullRomCurve3(s.p.map(a=>V(...a)),false,'centripetal');return{c,len:c.getLength(),t:s.t,v:s.v||o.speed||3};});
    flows.push(this);
  }
  update(dt){
    if(this.enabled){this.timer-=dt;if(this.timer<=0){this.timer+=this.interval;if(this.timer<0)this.timer=this.interval;const m=getBlock(this.segs[0].t);this.parent.add(m);this.blocks.push({m,s:0,d:0,pulse:0,r:Math.random()*6});}}
    const last=this.segs.length-1;
    for(let i=this.blocks.length-1;i>=0;i--){
      const b=this.blocks[i];let sg=this.segs[b.s];b.d+=sg.v*dt;
      while(b.d>=sg.len){b.d-=sg.len;b.s++;if(b.s>last)break;const prev=sg;sg=this.segs[b.s];if(sg.t!==prev.t){b.m.material=blockMat(sg.t);b.pulse=1;}}
      if(b.s>last){freeBlock(b.m);this.blocks.splice(i,1);continue;}
      const u=b.d/sg.len;sg.c.getPointAt(Math.min(u,1),b.m.position);
      b.r+=dt;b.m.rotation.set(b.r*0.8,b.r*1.1,0);
      b.pulse=Math.max(0,b.pulse-dt*2.2);
      let sc=this.size*(1+0.8*Math.sin(b.pulse*Math.PI));
      if(this.fade&&b.s===last)sc*=1-u;
      if(b.s===0&&b.d<0.6)sc*=b.d/0.6;
      b.m.scale.setScalar(Math.max(sc,0.001));
    }
  }
}

/* Text labels */
function textSprite(text,o){
  o=o||{};const size=o.size||1,bg=o.bg||'rgba(255,255,255,0.94)',fg=o.fg||'#15314b',bd=o.border||'#19a3dc';
  const c=document.createElement('canvas'),ctx=c.getContext('2d');
  const tex=new THREE.CanvasTexture(c);tex.minFilter=THREE.LinearFilter;tex.generateMipmaps=false;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
  let last=null;
  sp.userData.set=t=>{
    if(t===last)return;last=t;const font='600 46px Fredoka, Nunito, sans-serif';
    ctx.font=font;const w=Math.ceil(ctx.measureText(t).width)+60;c.width=w;c.height=86;
    ctx.font=font;ctx.fillStyle=bg;rr(ctx,4,4,w-8,78,38);ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=bd;ctx.stroke();
    ctx.fillStyle=fg;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,w/2,46);
    tex.needsUpdate=true;sp.scale.set(size*1.25*w/86,size*1.25,1);
  };
  sp.userData.set(text);return sp;
}
function lab(text,p,x,y,z,o){const s=textSprite(text,o);s.position.set(x,y,z);p.add(s);return s;}
function glow(color,size,p,x,y,z){
  const c=document.createElement('canvas');c.width=c.height=128;const g2=c.getContext('2d');
  const gr=g2.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,color);gr.addColorStop(1,'rgba(255,255,255,0)');
  g2.fillStyle=gr;g2.fillRect(0,0,128,128);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
  s.scale.set(size,size,1);s.position.set(x,y,z);p.add(s);return s;
}

/* ---------- Scenery builders ---------- */
function makeIsland(w,d,p){
  const g=new THREE.Group();p.add(g);
  box(w,0.6,d,'#7cc35a',0,-0.3,0,g);
  box(w,2.2,d,'#9b6b43',0,-1.7,0,g);
  box(w,3.2,d,'#7f7b77',0,-4.4,0,g);
  const mx=Math.max(w,d);const cone=new THREE.Mesh(new THREE.ConeGeometry(mx*0.55,10,7),M('#6d6966'));
  cone.rotation.x=Math.PI;cone.position.y=-11;cone.scale.set(w/mx*1.25,1,d/mx*1.25);g.add(cone);
  return g;
}
function tree(s,col){
  s=s||1;const g=new THREE.Group();
  cyl(0.35*s,0.55*s,5*s,'#6b4a2b',0,2.5*s,0,g,7);
  const f=M(col||'#3f8f3a');
  const a=new THREE.Mesh(new THREE.IcosahedronGeometry(2.2*s,0),f);a.position.y=5.8*s;g.add(a);
  const b=new THREE.Mesh(new THREE.IcosahedronGeometry(1.5*s,0),f);b.position.set(1*s,6.9*s,0.3*s);g.add(b);
  return g;
}
function pylon(p,x,z){
  const g=new THREE.Group();g.position.set(x,0,z);p.add(g);const m=M('#7b8591',{roughness:0.6});const h=9,b=1.1,t=0.3;
  [[1,1],[1,-1],[-1,1],[-1,-1]].forEach(([sx,sz])=>rod([sx*b,0,sz*b],[sx*t,h,sz*t],0.08,m,g));
  for(let k=0;k<3;k++){const y0=k*h/3,y1=(k+1)*h/3,w0=lerp(b,t,y0/h),w1=lerp(b,t,y1/h);
    rod([-w0,y0,w0],[w1,y1,w1],0.045,m,g);rod([w0,y0,w0],[-w1,y1,w1],0.045,m,g);
    rod([w0,y0,-w0],[w1,y1,w1],0.045,m,g);rod([w0,y0,w0],[w1,y1,-w1],0.045,m,g);}
  box(0.25,0.25,3.6,m,0,h-0.6,0,g);box(0.25,0.25,2.8,m,0,h-2,0,g);rod([0,h,0],[0,h+1,0],0.06,m,g);
  return g;
}
function house(p,x,z,o){
  o=o||{};const g=new THREE.Group();g.position.set(x,0,z);p.add(g);const wall=M('#f3e6c8');
  box(4,0.2,4,'#a67c52',0,0.1,0,g);box(4,3,0.2,wall,0,1.6,-1.9,g);box(0.2,3,4,wall,-1.9,1.6,0,g);box(0.2,3,4,wall,1.9,1.6,0,g);
  const win=new THREE.MeshStandardMaterial({color:'#3a3a3a',emissive:'#ffd35a',emissiveIntensity:1});
  if(!o.open){box(4,3,0.2,wall,0,1.6,1.9,g);box(1,0.8,0.05,win,-0.9,2.2,2.02,g);box(1,0.8,0.05,win,0.9,2.2,2.02,g);box(0.8,1.4,0.05,'#7a4a2a',0,0.9,2.02,g);}
  const rm=M('#c0473a');const r1=box(4.4,0.2,2.9,rm,0,3.85,1.05,g);r1.rotation.x=0.6;const r2=box(4.4,0.2,2.9,rm,0,3.85,-1.05,g);r2.rotation.x=-0.6;
  return win;
}
function kettle(p,x,y,z){
  const g=new THREE.Group();g.position.set(x,y,z);p.add(g);const m=M('#d7dde3',{metalness:0.4,roughness:0.35});
  cyl(0.45,0.6,0.9,m,0,0.45,0,g);cyl(0.2,0.35,0.15,m,0,0.95,0,g);
  const s=cyl(0.08,0.14,0.7,m,0.62,0.55,0,g);s.rotation.z=-0.9;
  const h=new THREE.Mesh(new THREE.TorusGeometry(0.35,0.06,6,12,Math.PI),M('#333'));h.position.set(-0.55,0.5,0);h.rotation.z=Math.PI/2;g.add(h);
}
function windTurbine(p,x,z,s){

/* ---------- Island 1: how fossil fuels formed ---------- */
function buildFossil(g){
  makeIsland(34,20,g);
  box(30,0.1,14,'#557f58',0,0.05,0,g);
  sunBall(g,-13,17,-4,1.8);
  const xs=[-7,0,7],dirs=[1,1,-1];
  const trees=xs.map(x=>{const t=tree();t.position.set(x,0,0);g.add(t);return t;});
  const fl=xs.map((x,k)=>new Flow(g,[
    {t:'L',p:[[-13,17,-4],[(x-13)/2,12.5,-0.5],[x,5.8,2.1]],v:8},
    {t:'C',p:[[x,5.8,2.1],[x,4.4,0.9],[x,1.2,0.75]],v:2}
  ],{interval:1.1,delay:k*0.35,fade:true,size:0.5}));
  const matM=M('#4a3222');const seam=box(22,1,6,matM,0,0.5,0,g);seam.visible=false;
  const slabs=['#d8b878','#a88b6c','#8f949b'].map(c=>{const s=box(24,1.2,6,c,0,0,0,g);s.visible=false;return s;});
  const coalBlocks=[-9,-4.5,0,4.5,9].map(x=>{const b=staticBlock('C',g,x,0,3.2,0.5);b.visible=false;return b;});
  const year=lab('300 million years ago',g,8,14,0,{size:1.1,border:'#ef8a22'});
  const cap=lab(' ',g,8,12.2,0,{size:0.85});
  const chris=makeChris();chris.scale.setScalar(0.55);g.add(chris);
  const brown=new THREE.Color('#4a3222'),black=new THREE.Color('#141414');
  return (t)=>{
    const tl=t%21;
    const grow=0.25+0.75*ease(seg01(tl,0,2.5));
    const fall=ease(seg01(tl,6,8))*Math.PI/2*0.97;
    const gone=ease(seg01(tl,8,9));
    trees.forEach((tr,k)=>{tr.rotation.z=fall*dirs[k];tr.scale.setScalar(Math.max(0.001,grow*(1-gone)));tr.visible=gone<1;});
    fl.forEach(f=>f.enabled=tl>2.5&&tl<6);
    const H=tl<8?0:tl<9?2*ease(seg01(tl,8,9)):2-1.5*ease(seg01(tl,13.6,16));
    seam.visible=H>0.01;seam.scale.y=Math.max(H,0.01);seam.position.y=H/2;
    matM.color.copy(brown).lerp(black,seg01(tl,13.6,16));
    slabs.forEach((s,i)=>{const li=10+i*1.2;s.visible=tl>=li-1.2;const u=seg01(tl,li-1.2,li);s.position.y=H+0.6+1.2*i+16*(1-u*u);});
    coalBlocks.forEach((b,i)=>{b.visible=tl>=9;b.position.y=Math.max(H/2,0.25);b.scale.setScalar(Math.min(0.55,H*0.6)+0.05);b.rotation.y=t*0.8+i;});
    let yr;
    if(tl<9.5)yr='300 million years ago';
    else if(tl<16){const m=Math.round(300*(1-seg01(tl,9.5,16)));yr=m>0?m+' million years ago':'Today';}
    else yr='Today';
    year.userData.set(yr);
    cap.userData.set(tl<6?'Trees build up a chemical store':tl<9?'The trees die and sink':tl<13.6?'Layers of mud pile on top':tl<16?'Squashed and heated…':'…into coal: a chemical store');
    if(tl<9){const hh=2.6*(tl<6?grow:1);chris.position.set(-Math.sin(fall)*hh,Math.max(0.5,Math.cos(fall)*hh),0.9);}
    else chris.position.set(-2.6,Math.max(H/2,0.3),3.4);
    chris.position.y+=Math.sin(t*3)*0.08;
  };
}

function setupQuiz(){
  $('#q1check').onclick=()=>{let ok=0;document.querySelectorAll('#q1 select').forEach(s=>{const good=s.value===s.dataset.a;s.className=good?'good':'bad';ok+=good;});
    const r=$('#q1res');r.textContent=ok===3?'All correct. Objective 1 ✓':`${ok} of 3 correct. Try the red ones again.`;r.style.color=ok===3?'#1a8a3f':'#b3261e';};
  const steps=[
    ['Coal burns in the furnace',['C','T']],
    ['Water in the boiler turns into fast-moving steam',['T','K']],
    ['Steam makes the turbine spin',['K']],
    ['The turbine turns the generator',['K','E']],
    ['Current flows through wires to homes',['E']]
  ];
  const box2=$('#q2');let next=0;
  function render(){
    box2.innerHTML='';$('#q2res').textContent='';next=0;
    const order=steps.map((s,i)=>i).sort(()=>Math.random()-0.5);
    order.forEach(i=>{const b=document.createElement('button');b.className='opt';
      b.innerHTML=`<span class="num" style="background:#c6dce8"></span><span style="flex:1">${steps[i][0]}</span>${steps[i][1].map(t=>`<span class="blk ${t}">${t}</span>`).join('')}`;
      b.onclick=()=>{if(b.classList.contains('done'))return;
        if(i===next){b.classList.add('done');const n=b.querySelector('.num');n.textContent=next+1;n.style.background='';next++;box2.appendChild(b);
          if(next===steps.length){const r=$('#q2res');r.textContent='Perfect order. Objective 2 ✓';r.style.color='#1a8a3f';}
          else{const done=[...box2.querySelectorAll('.opt.done')];done.forEach(d=>box2.insertBefore(d,box2.querySelector('.opt:not(.done)')));}}
        else{b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');}};
      box2.appendChild(b);});
  }
  render();$('#q2reset').onclick=render;
}

const ptrs=new Map();let pinch0=0,zoom0=1;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);zoom0=userZoom;}});
canvas.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;
  if(ptrs.size===1){userAz-=(e.clientX-p.x)*0.006;userEl=clamp(userEl+(e.clientY-p.y)*0.004,-0.5,1.1);}
  p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(d>0)userZoom=clamp(zoom0*pinch0/d,0.35,2.5);}});
['pointerup','pointercancel'].forEach(ev=>canvas.addEventListener(ev,e=>ptrs.delete(e.pointerId)));
canvas.addEventListener('wheel',e=>{e.preventDefault();userZoom=clamp(userZoom*(1+e.deltaY*0.001),0.35,2.5);},{passive:false});

const cam={t:V(0,-4,0),r:300,az:0,el:0.62};
function desired(){
  const c=CH[cur],zf=panelMin?0.8:1;
  if(c.view==='overview')return{t:V(0,-4,0),r:250*zf,az:(reduceMotion?0:T*0.05),el:0.62};
  const g=islands[c.i].group;return{t:g.localToWorld(V(...c.target)),r:c.cam.r*zf,az:g.rotation.y+c.cam.az,el:c.cam.el};
}
function updateCamera(dt){
  const d=desired(),k=1-Math.exp(-dt*2.2);
  const dist=cam.t.distanceTo(d.t);cam.t.lerp(d.t,k);
  const aspect=innerWidth/innerHeight;
  const rT=d.r*userZoom*Math.max(1,1.3/aspect)*(1+Math.min(dist/60,1.2));
  cam.r=lerp(cam.r,rT,k);
  const da=(((d.az+userAz-cam.az)%TAU)+3*Math.PI)%TAU-Math.PI;cam.az+=da*k;
  cam.el=lerp(cam.el,clamp(d.el+userEl,-0.3,1.35),k);
  camera.position.set(cam.t.x+cam.r*Math.cos(cam.el)*Math.sin(cam.az),cam.t.y+cam.r*Math.sin(cam.el),cam.t.z+cam.r*Math.cos(cam.el)*Math.cos(cam.az));
  camera.lookAt(cam.t);
  scene.fog.near=cam.r*1.3;scene.fog.far=cam.r*4+80;
}
function resize(){
  const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  let ox=0,oy=0;
  if(w>760)ox=-(Math.min(424,w*0.4))/2;else oy=$('#panel').offsetHeight*0.45;
  camera.setViewOffset(w,h,ox,oy,w,h);camera.updateProjectionMatrix();
}
addEventListener('resize',resize);

/* ---------- Loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,0.05);last=now;T+=dt;localT+=dt;
  islands.forEach((isl,k)=>isl.update(CH[cur].i===k?localT:T+k*3,dt));
  flows.forEach(f=>f.update(dt));
  updateCamera(dt);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
show(0);
requestAnimationFrame(frame);
})();
</script>
