<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Specific heat capacity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--cyan:#19a3dc;--deep:#0a5f8f;--orange:#ef8a22;--ink:#17324d;--paper:#ffffff;--wash:#eaf6fc;--hot:#e5531a;--cold:#2f7fb8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:#dceef7}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}

#key{display:flex;align-items:center;gap:15px;flex-wrap:wrap;font-size:13px;font-weight:700;color:#3d6480}
.kitem{display:flex;align-items:center;gap:6px;white-space:nowrap}

.blk{display:inline-grid;place-items:center;width:23px;height:23px;border-radius:5px;font:800 13px Nunito,sans-serif;border:2px solid rgba(0,0,0,.4);box-shadow:inset 0 3px 0 rgba(255,255,255,.55);vertical-align:middle;flex:none}
.blk.T{background:#e5531a;color:#fff}
.blk.E{background:#27b0e6;color:#0e2338}

#bar{position:fixed;left:12px;right:12px;bottom:12px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  background:rgba(255,255,255,.95);border-radius:16px;padding:9px 16px;box-shadow:0 8px 26px rgba(10,60,100,.22)}
#label{display:flex;flex-direction:column;min-width:0}
#kicker{font-size:11.5px;font-weight:800;color:#5d7f93;letter-spacing:.5px;text-transform:uppercase}
#title{font:600 21px/1.15 Fredoka,sans-serif;color:var(--deep);white-space:nowrap}
#ctrl{display:flex;gap:6px;flex-wrap:wrap}
#navwrap{display:flex;align-items:center;gap:10px;margin-left:auto}
#replay{width:34px;height:34px;border-radius:50%;border:2px solid #9cc3d8;background:transparent;color:var(--deep);font-size:17px;cursor:pointer;flex:none}
#replay:hover{background:var(--wash)}
.btn{font:700 13.5px Nunito,sans-serif;border:none;border-radius:999px;padding:7px 13px;background:var(--orange);color:#fff;cursor:pointer}
.btn.ghost{background:transparent;color:var(--deep);border:2px solid #9cc3d8}
.btn.on{background:var(--deep)}
button.navb{font:700 15px Nunito,sans-serif;border:none;border-radius:999px;padding:8px 16px;cursor:pointer}
#prev{background:var(--wash);color:var(--deep)}
#next{background:var(--orange);color:#fff}
button:disabled{opacity:.35;cursor:default}
#dots{display:flex;gap:5px}
#dots button{width:11px;height:11px;border-radius:50%;border:none;background:#c6dce8;padding:0;cursor:pointer}
#dots button.on{background:var(--cyan);transform:scale(1.3)}
button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

@media (max-width:860px){
  #key{gap:9px;font-size:11px}
  #key .blk{width:17px;height:17px;font-size:10px}
  #bar{left:6px;right:6px;bottom:6px;padding:7px 10px;gap:10px}
  #title{font-size:17px;white-space:normal}
  #navwrap{gap:7px}
  button.navb{padding:7px 12px;font-size:14px}
}
</style>
</head>
<body>
<canvas id="c" aria-label="Animation about specific heat capacity: two saucepans heated on identical hobs to compare mass and material, the equation E = m c ΔT, the required practical with a heater and thermometer inside an aluminium cylinder powered through a joulemeter, and where the energy lost to the air goes."></canvas>

<div id="bar">
  <div id="label"><span id="kicker"></span><span id="title"></span></div>
  <div id="key" aria-label="Key">
    <span class="kitem"><span class="blk E">E</span>Electrical energy</span>
    <span class="kitem"><span class="blk T">T</span>Thermal energy</span>
  </div>
  <div id="ctrl"></div>
  <div id="navwrap">
    <button id="replay" title="Replay this animation" aria-label="Replay this animation">&#8635;</button>
    <button class="navb" id="prev">Back</button>
    <div id="dots"></div>
    <button class="navb" id="next">Next</button>
  </div>
</div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const TAU=Math.PI*2;
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Seeded pseudo-random, so a reload looks identical. */
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
/* A stable hash, used where a value must depend on an index rather than on
   how many times something has been called. */
function hash(n){n=(n^61)^(n>>>16);n=(n+(n<<3))>>>0;n^=n>>>4;n=(n*0x27d4eb2d)>>>0;n^=n>>>15;return(n>>>0)/4294967296;}

/* MODEL:BEGIN
   ===================================================================
   THE PHYSICS. No DOM and no canvas in here: test-energy-scenes.js runs
   this block on its own under node.

   Every number the story quotes comes out of these tables. The saucepans
   ignore losses (and say so on screen); the practical does not -- its
   block loses energy to the air at a rate proportional to how much hotter
   than the room it is (Newton's law of cooling), which has a closed form,
   so the thermometer, the joulemeter and the energy lost are all pure
   functions of time and nothing is integrated frame by frame.
   =================================================================== */
const MAT={
  water:    {name:'water',        c:4200,rho:1000},
  oil:      {name:'sunflower oil',c:2000,rho:920},
  aluminium:{name:'aluminium',    c:900, rho:2700}
};

/* Two identical electric hobs, each supplying the same power, run until
   each pan has been given the same energy. */
const HOB={P:1000,E:84000,T0:20};
const PANS={
  mass:    [{m:0.5,mat:'water'},{m:1.0,mat:'water'}],
  material:[{m:1.0,mat:'water'},{m:1.0,mat:'oil'}]
};
function panRise(p,E){return E/(p.m*MAT[p.mat].c);}
function panTemp(p,E){return HOB.T0+panRise(p,E);}
/* How deep a pan's contents stand: its volume over the pan's base, drawn
   at 88 px per litre. Oil is less dense, so a kilogram of it stands taller. */
const PX_PER_LITRE=88;
function panDepth(p){return PX_PER_LITRE*1000*p.m/MAT[p.mat].rho;}

/* The particle bubbles draw 20 molecules per kilogram of water. How many
   real ones each stands for is worked out, not typed. */
const AVOGADRO=6.022e23,M_WATER=0.018,DRAWN_PER_KG=20;
const REAL_PER_DRAWN=AVOGADRO/M_WATER/DRAWN_PER_KG;
function drawnMolecules(p){return Math.round(DRAWN_PER_KG*p.m);}

/* In the material chapter a block stands for a fixed amount of energy, so
   the height of each pile IS the specific heat capacity. */
const J_PER_BLOCK=200;
function blocksPerDegree(mat){return MAT[mat].c/J_PER_BLOCK;}

/* The required practical: a 1 kg aluminium block, a 12 V heater taking
   4 A, ten minutes. k is how many watts the block loses to the room per
   degree it is above it -- bare, and wrapped in insulation. */
const RIG={V:12,I:4,m:1.0,mat:'aluminium',Troom:20,tRun:600,k:{bare:0.35,lagged:0.08}};
RIG.P=RIG.V*RIG.I;

/* mc dT/dt = P - k (T - Troom), from room temperature, solved exactly. */
function rigState(ts,k){
  ts=Math.max(0,Math.min(RIG.tRun,ts));
  const mc=RIG.m*MAT[RIG.mat].c;
  const rise=k>0?(RIG.P/k)*(1-Math.exp(-k*ts/mc)):RIG.P*ts/mc;
  const E=RIG.P*ts,kept=mc*rise;
  return {ts,T:RIG.Troom+rise,rise,E,kept,lost:E-kept,lossRate:k*rise,ideal:RIG.Troom+E/mc};
}
/* What a pupil writes down at the end: readings rounded as the instruments
   show them, and c worked out FROM those readings. */
function readings(k){
  const s=rigState(RIG.tRun,k);
  const m=RIG.m,Ti=RIG.Troom,Tf=Math.round(s.T*10)/10,E=Math.round(s.E);
  const dT=Math.round((Tf-Ti)*10)/10;
  const c=E/(m*dT);
  return {m,Ti,Tf,E,dT,c,cShown:Math.round(c/10)*10,kept:s.kept,lost:s.lost,
          lostPc:Math.round(100*s.lost/s.E)};
}

/* Numbers the captions quote. */
function sci(x){
  const e=Math.floor(Math.log10(x)),m=(x/Math.pow(10,e)).toFixed(1);
  const sup='⁰¹²³⁴⁵⁶⁷⁸⁹';
  return m+' × 10'+String(e).split('').map(d=>sup[+d]).join('');
}
function num(n){
  const s=String(Math.round(n));
  let o='';for(let i=0;i<s.length;i++){if(i&&(s.length-i)%3===0)o+=' ';o+=s[i];}
  return o;
}
function dp(x){return Number.isInteger(x)?String(x):x.toFixed(1);}
const FACTS={
  kJ:HOB.E/1000,
  massRise:PANS.mass.map(p=>panRise(p,HOB.E)),
  matRise:PANS.material.map(p=>panRise(p,HOB.E)),
  perDrawn:sci(REAL_PER_DRAWN),
  bare:readings(RIG.k.bare),
  lagged:readings(RIG.k.lagged),
  cTrue:MAT[RIG.mat].c,
  minutes:RIG.tRun/60
};
/* MODEL:END */

/* ===================================================================
   DRAWING HELPERS
   The scene is drawn in a fixed stage and scaled to whatever room the
   bar leaves, so everything is laid out in stage coordinates.
   =================================================================== */
const SW=1400,SH=650;
const canvas=$('#c'),ctx=canvas.getContext('2d');
let dpr=1,stage={x:0,y:0,s:1};

function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function shade(hex,k){
  const n=parseInt(hex.slice(1),16);
  return 'rgb('+Math.round((n>>16)*k)+','+Math.round((n>>8&255)*k)+','+Math.round((n&255)*k)+')';
}
function txt(s,x,y,o){
  o=o||{};
  ctx.font=(o.font||'700 15px Nunito, sans-serif');
  ctx.textAlign=o.align||'left';ctx.textBaseline=o.base||'alphabetic';
  if(o.halo){ctx.lineWidth=o.halo;ctx.strokeStyle=o.haloCol||'rgba(255,255,255,.9)';ctx.strokeText(s,x,y);}
  ctx.fillStyle=o.col||'#17324d';ctx.fillText(s,x,y);
}
function pill(s,x,y,o){
  o=o||{};
  const f=o.font||'700 15px Nunito, sans-serif';
  ctx.font=f;
  const w=ctx.measureText(s).width+2*(o.pad||11),h=o.h||27;
  const x0=o.align==='center'?x-w/2:(o.align==='right'?x-w:x);
  ctx.save();ctx.globalAlpha*=(o.alpha===undefined?1:clamp(o.alpha,0,1));
  rr(x0,y-h/2,w,h,h/2);
  ctx.fillStyle=o.bg||'rgba(255,255,255,.94)';ctx.fill();
  ctx.lineWidth=2.5;ctx.strokeStyle=o.bd||'#19a3dc';ctx.stroke();
  txt(s,x0+w/2,y+1,{font:f,align:'center',base:'middle',col:o.col||'#15314b'});
  ctx.restore();
  return {x:x0,y:y-h/2,w,h};
}
/* A pill with a leader line to the thing it names. */
function callout(s,x,y,tx,ty,o){
  o=o||{};
  const a=o.alpha===undefined?1:clamp(o.alpha,0,1);
  if(a<=0.01)return;
  ctx.save();ctx.globalAlpha=a;
  ctx.font=o.font||'700 14px Nunito, sans-serif';
  const w=ctx.measureText(s).width+22;
  const ax=o.align==='center'?x:(o.align==='right'?x-w/2:x+w/2);
  ctx.strokeStyle='#17324d';ctx.lineWidth=2;ctx.setLineDash([3,3]);
  ctx.beginPath();ctx.moveTo(o.align==='right'?x-w:(o.align==='center'?ax:x),y);ctx.lineTo(tx,ty);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#17324d';ctx.beginPath();ctx.arc(tx,ty,3.5,0,TAU);ctx.fill();
  ctx.restore();
  pill(s,x,y,{align:o.align||'left',bd:o.bd||'#7fa8c2',font:o.font||'700 14px Nunito, sans-serif',h:28,alpha:a});
}
function panel(x,y,w,h,title){
  ctx.save();
  rr(x,y,w,h,14);
  ctx.fillStyle='rgba(255,255,255,.88)';ctx.fill();
  ctx.lineWidth=2.5;ctx.strokeStyle='#a9c9dc';ctx.stroke();
  ctx.restore();
  if(title)txt(title,x+16,y+26,{font:'700 16.5px Nunito, sans-serif',col:'#0a5f8f'});
}
/* lines of text, each [string, options] or a bare string */
function lines(arr,x,y,lh,base){
  arr.forEach((l,i)=>{
    const s=Array.isArray(l)?l[0]:l,o=Object.assign({},base||{},Array.isArray(l)?l[1]:{});
    if(o.alpha!==undefined&&o.alpha<=0.01)return;
    ctx.save();ctx.globalAlpha=o.alpha===undefined?1:clamp(o.alpha,0,1);
    txt(s,x,y+i*lh,o);ctx.restore();
  });
}
/* a symbol with a subscript: T + i */
function sym(main,sub,x,y,size,col){
  txt(main,x,y,{font:'600 '+size+'px Fredoka, sans-serif',col});
  ctx.font='600 '+size+'px Fredoka, sans-serif';
  const w=ctx.measureText(main).width;
  if(sub)txt(sub,x+w+1,y+size*0.22,{font:'600 '+Math.round(size*0.6)+'px Fredoka, sans-serif',col});
}

/* Energy blocks, exactly the ones in the energy resources story: a rounded
   square with a letter, a dark rim and a gloss along the top. */
const BLOCK={T:{c:'#e5531a',f:'#ffffff'},E:{c:'#27b0e6',f:'#0e2338'}};
function blk(type,x,y,s,alpha,rot){
  const B=BLOCK[type];
  ctx.save();ctx.globalAlpha=clamp(alpha===undefined?1:alpha,0,1);
  ctx.translate(x,y);if(rot)ctx.rotate(rot);
  rr(-s/2,-s/2,s,s,s*0.19);ctx.fillStyle=shade(B.c,0.5);ctx.fill();
  const i=s*0.86;
  rr(-i/2,-i/2,i,i,i*0.15);ctx.fillStyle=B.c;ctx.fill();
  const g=ctx.createLinearGradient(0,-i/2,0,i*0.05);
  g.addColorStop(0,'rgba(255,255,255,.6)');g.addColorStop(1,'rgba(255,255,255,0)');
  rr(-i/2,-i/2,i,i*0.5,i*0.15);ctx.fillStyle=g;ctx.fill();
  txt(type,0,s*0.045,{font:'800 '+(s*0.58).toFixed(1)+'px Nunito, sans-serif',align:'center',base:'middle',col:B.f});
  ctx.restore();
}

/* A stream of blocks sliding along a polyline. Block k sits at arc length
   (t*speed + k*spacing) mod L, so the stream is a pure function of t. */
function polyline(pts){
  const seg=[];let L=0;
  for(let i=1;i<pts.length;i++){
    const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
    seg.push({a:pts[i-1],b:pts[i],d,s0:L});L+=d;
  }
  return {seg,L};
}
function alongPoly(p,s){
  s=clamp(s,0,p.L);
  for(let i=0;i<p.seg.length;i++){
    const g=p.seg[i];
    if(s<=g.s0+g.d||i===p.seg.length-1){
      const u=g.d>0?(s-g.s0)/g.d:0;
      return [lerp(g.a[0],g.b[0],u),lerp(g.a[1],g.b[1],u)];
    }
  }
}
function stream(pts,t,o){
  o=o||{};
  const p=polyline(pts),sp=o.spacing||58,v=o.speed||120,size=o.size||20;
  if(p.L<1||(o.alpha!==undefined&&o.alpha<=0.01))return;
  const n=Math.max(1,Math.round(p.L/sp));
  const head=t*v+(o.phase||0);
  for(let k=0;k<n;k++){
    let s=(head+k*sp)%p.L;if(s<0)s+=p.L;
    const u=s/p.L,q=alongPoly(p,s);
    let a=1;
    if(o.fadeIn!==false)a*=clamp(u/0.14,0,1);
    if(o.fadeOut!==false)a*=clamp((1-u)/0.14,0,1);
    blk(o.type||'T',q[0],q[1],size,a*(o.alpha===undefined?1:o.alpha),o.spin===false?0:Math.sin(t*1.7+k*1.3)*0.3);
  }
}
/* a cubic Bezier as points, so a wire can be drawn AND carry a stream */
function bez(p0,p1,p2,p3,n){
  const out=[];n=n||24;
  for(let i=0;i<=n;i++){
    const u=i/n,v=1-u;
    out.push([v*v*v*p0[0]+3*v*v*u*p1[0]+3*v*u*u*p2[0]+u*u*u*p3[0],
              v*v*v*p0[1]+3*v*v*u*p1[1]+3*v*u*u*p2[1]+u*u*u*p3[1]]);
  }
  return out;
}
function wire(pts,col){
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle=shade(col,0.55);ctx.lineWidth=7;
  ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();
  ctx.strokeStyle=col;ctx.lineWidth=4.5;ctx.stroke();
  ctx.restore();
}

/* A thermometer: bulb at the bottom, stem, ticks, a coloured column and a
   read-out pill above it. */
function thermo(cx,top,bulbY,tmin,tmax,temp,o){
  o=o||{};
  const w=15,bR=13,stemBot=bulbY-bR+2;
  ctx.save();
  rr(cx-w/2,top,w,stemBot-top+6,w/2);
  ctx.fillStyle='rgba(255,255,255,.94)';ctx.fill();
  ctx.lineWidth=2.2;ctx.strokeStyle='#8aa7bb';ctx.stroke();
  ctx.beginPath();ctx.arc(cx,bulbY,bR,0,TAU);
  ctx.fillStyle='rgba(255,255,255,.94)';ctx.fill();ctx.stroke();
  const y=v=>lerp(stemBot-6,top+10,clamp((v-tmin)/(tmax-tmin),0,1));
  const step=o.tick||10,lab=o.lab||20,side=o.left?-1:1;
  ctx.lineWidth=1.5;ctx.strokeStyle='#9db8c9';
  for(let v=Math.ceil(tmin/step)*step;v<=tmax;v+=step){
    const yy=y(v),big=v%lab===0;
    ctx.beginPath();ctx.moveTo(cx+side*w/2,yy);ctx.lineTo(cx+side*(w/2+(big?9:5)),yy);ctx.stroke();
    if(big)txt(v+'',cx+side*(w/2+12),yy+4,{font:'700 11px Nunito, sans-serif',col:'#5d7f93',align:o.left?'right':'left',halo:3});
  }
  const hot=clamp((temp-15)/50,0,1);
  const col='rgb('+Math.round(lerp(70,229,hot))+','+Math.round(lerp(130,70,hot))+','+Math.round(lerp(205,30,hot))+')';
  const cy=y(temp);
  ctx.beginPath();ctx.arc(cx,bulbY,bR-4,0,TAU);ctx.fillStyle=col;ctx.fill();
  rr(cx-3.5,cy,7,bulbY-cy,3.5);ctx.fillStyle=col;ctx.fill();
  ctx.restore();
  pill(temp.toFixed(o.dp||0)+' °C',cx,top-18,{align:'center',bd:col,font:'800 16px Nunito, sans-serif'});
}

/* One water molecule, in the repo's palette (O #2f47b8, H #d8402f). */
function molecule(x,y,r,ang,o){
  o=o||{};
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  const hr=r*0.62,d=r*0.92;
  [-0.92,0.92].forEach(s=>{
    const hx=Math.sin(s)*d,hy=-Math.cos(s)*d;
    ctx.lineWidth=r*0.42;ctx.strokeStyle='#8f9ba6';
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(hx,hy);ctx.stroke();
  });
  [-0.92,0.92].forEach(s=>{
    const hx=Math.sin(s)*d,hy=-Math.cos(s)*d;
    const g=ctx.createRadialGradient(hx-hr*0.3,hy-hr*0.35,hr*0.1,hx,hy,hr);
    g.addColorStop(0,'#f4948a');g.addColorStop(1,'#d8402f');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(hx,hy,hr,0,TAU);ctx.fill();
  });
  const g=ctx.createRadialGradient(-r*0.3,-r*0.35,r*0.1,0,0,r);
  g.addColorStop(0,'#7a8ddd');g.addColorStop(1,'#2f47b8');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.fill();
  if(o.flash>0.01){
    ctx.globalAlpha=o.flash*0.85;
    ctx.strokeStyle='#ffb04a';ctx.lineWidth=3.5;
    ctx.beginPath();ctx.arc(0,0,r*(1.3+o.flash*0.7),0,TAU);ctx.stroke();
  }
  ctx.restore();
}

/* A temperature-against-something graph. Returns the mapping. */
function axes(G,xmax,ymin,ymax,xstep,ystep,xlab,ylab,xfmt){
  const pad={l:52,r:18,t:40,b:40};
  const ix=G.x+pad.l,iy=G.y+pad.t,iw=G.w-pad.l-pad.r,ih=G.h-pad.t-pad.b;
  const X=v=>ix+iw*v/xmax,Y=v=>iy+ih*(1-(v-ymin)/(ymax-ymin));
  ctx.save();
  ctx.lineWidth=1.2;ctx.strokeStyle='#dbe9f1';
  for(let v=ymin;v<=ymax;v+=ystep){
    ctx.beginPath();ctx.moveTo(ix,Y(v));ctx.lineTo(ix+iw,Y(v));ctx.stroke();
    txt(v+'',ix-8,Y(v)+4,{align:'right',font:'700 12px Nunito, sans-serif',col:'#5d7f93'});
  }
  for(let v=0;v<=xmax+1e-9;v+=xstep)
    txt(xfmt?xfmt(v):v+'',X(v),iy+ih+17,{align:'center',font:'700 12px Nunito, sans-serif',col:'#5d7f93'});
  ctx.lineWidth=2;ctx.strokeStyle='#8fb0c4';

const PAN_X=[210,590];
const PAN_COL={mass:['#19a3dc','#0a5f8f'],material:['#0a5f8f','#c98a0c']};
const LIQ={water:[120,188,232],oil:[234,192,64]};

function hob(on,t){

function pan(cx,p,T,t,side){
  const L=cx-PAN.hw,R=cx+PAN.hw,iL=L+PAN.wall,iR=R-PAN.wall,ib=PAN.bot-PAN.wall;
  const d=panDepth(p),lt=ib-d;
  ctx.save();
  /* handle */
  ctx.lineCap='round';ctx.strokeStyle='#2b2f36';ctx.lineWidth=14;
  const hx=side<0?L:R;
  ctx.beginPath();ctx.moveTo(hx,PAN.top+24);ctx.lineTo(hx+side*70,PAN.top+10);ctx.stroke();
  /* contents, warming in tint as they heat */
  const c=LIQ[p.mat],warm=clamp((T-20)/50,0,1);
  const col=a=>'rgba('+Math.round(lerp(c[0],Math.min(255,c[0]+60),warm))+','+Math.round(lerp(c[1],c[1]-30,warm))+','+Math.round(lerp(c[2],c[2]-60,warm))+','+a+')';
  const g=ctx.createLinearGradient(0,lt,0,ib);
  g.addColorStop(0,col(.75));g.addColorStop(1,col(.92));
  ctx.beginPath();ctx.moveTo(iL,ib);ctx.lineTo(iL,lt);
  for(let x=0;x<=iR-iL;x+=6){
    const w=1.6+2.4*warm;
    ctx.lineTo(iL+x,lt+Math.sin(x*0.06+t*2.2)*w*0.5+Math.sin(x*0.14-t*3)*w*0.25);
  }
  ctx.lineTo(iR,ib);ctx.closePath();ctx.fillStyle=g;ctx.fill();
  /* a little steam once it is warm */
  const st=clamp((T-40)/30,0,1);
  for(let i=0;i<7&&st>0.02;i++){
    const ph=(t*0.3+hash(i+p.m*10+side*5))%1;
    ctx.globalAlpha=st*(1-ph)*0.4;ctx.fillStyle='#ffffff';
    ctx.beginPath();ctx.arc(cx-60+i*20+Math.sin(ph*5+i)*10,lt-6-ph*70,6+ph*14,0,TAU);ctx.fill();
  }
  ctx.globalAlpha=1;
  /* the pan itself */
  const s=ctx.createLinearGradient(L,0,R,0);
  s.addColorStop(0,'#7f8994');s.addColorStop(0.2,'#d5dbe1');s.addColorStop(0.55,'#9aa4ae');s.addColorStop(1,'#6c7680');
  ctx.beginPath();
  ctx.moveTo(L,PAN.top);ctx.lineTo(L,PAN.bot-10);ctx.quadraticCurveTo(L,PAN.bot,L+10,PAN.bot);
  ctx.lineTo(R-10,PAN.bot);ctx.quadraticCurveTo(R,PAN.bot,R,PAN.bot-10);ctx.lineTo(R,PAN.top);
  ctx.lineTo(iR,PAN.top);ctx.lineTo(iR,ib);ctx.lineTo(iL,ib);ctx.lineTo(iL,PAN.top);ctx.closePath();
  ctx.fillStyle=s;ctx.fill();
  ctx.lineWidth=5;ctx.strokeStyle='#c9d0d7';ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(L-3,PAN.top);ctx.lineTo(iL,PAN.top);ctx.moveTo(iR,PAN.top);ctx.lineTo(R+3,PAN.top);ctx.stroke();
  ctx.restore();
  return {lt,ib,d};
}

/* Molecule homes inside each bubble, placed once with a seeded rng. */
const BUB={dx:-38,y:228,r:90};
/* A loose hexagonal pattern sized so that N molecules fill the bubble,
   the N nearest the middle kept, then jittered with a seeded rng. */
const HOMES=PANS.mass.map((p,b)=>{
  const N=drawnMolecules(p),r=rng(9100+b*77),R=BUB.r*0.74;
  const sp=R*Math.sqrt(Math.PI/(0.866*N)),pts=[];
  for(let j=-8;j<=8;j++)for(let i=-8;i<=8;i++){
    const x=(i+(j&1)*0.5)*sp,y=j*sp*0.866;
    if(Math.hypot(x,y)<BUB.r*0.86)pts.push({x,y,d:Math.hypot(x,y)});
  }
  pts.sort((a,c)=>a.d-c.d);
  return pts.slice(0,N).map(q=>({x:q.x+(r()-0.5)*sp*0.25,y:q.y+(r()-0.5)*sp*0.25,
    p1:r()*TAU,p2:r()*TAU,p3:r()*TAU,k:0.8+r()*0.5}));
});
/* The molecules speed up as the pan warms. Their phase is the time
   integral of a speed that rises with temperature, and because the
   temperature is a straight line in t that integral is closed-form too. */
function molPhase(t,dur,rise){
  const I=t<dur?rise*t*t/(2*dur):rise*dur/2+rise*(t-dur);
  return t+0.05*I;
}
function bubble(cx,p,b,lt,d,t,dur,heating){
  const bx=cx+BUB.dx,by=BUB.y,R=BUB.r;
  const rise=panRise(p,HOB.E),T=HOB.T0+rise*clamp(t/dur,0,1);
  const my=lt+d/2;
  ctx.save();
  /* the magnifier: a small circle in the liquid joined to the bubble */
  ctx.strokeStyle='rgba(23,50,77,.45)';ctx.lineWidth=2;
  const a=0.87;
  ctx.beginPath();
  ctx.moveTo(bx-12,my);ctx.lineTo(bx-Math.sin(a)*R,by+Math.cos(a)*R);
  ctx.moveTo(bx+12,my);ctx.lineTo(bx+Math.sin(a)*R,by+Math.cos(a)*R);ctx.stroke();
  ctx.beginPath();ctx.arc(bx,my,12,0,TAU);ctx.lineWidth=2.4;ctx.stroke();
  ctx.beginPath();ctx.arc(bx,by,R,0,TAU);
  ctx.fillStyle='rgba(255,255,255,.95)';ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle=PAN_COL.mass[b];ctx.stroke();
  ctx.clip();
  const N=drawnMolecules(p),ph=molPhase(t,dur,rise);
  const amp=7+0.22*(T-HOB.T0);
  const pos=[];
  for(let i=0;i<N;i++){
    const h=HOMES[b][i];
    pos.push([bx+h.x+Math.sin(ph*2.1*h.k+h.p1)*amp*0.75+Math.sin(ph*3.3+h.p3)*amp*0.3,
              by+h.y+Math.cos(ph*2.4*h.k+h.p2)*amp*0.75+Math.sin(ph*2.9+h.p1)*amp*0.3]);
  }
  /* the SAME number of blocks per second arrives in both bubbles: each
     lands on one molecule, so fewer molecules means each gets more */
  const period=0.5,K=3,flash=new Array(N).fill(0);
  if(heating){
    for(let k=0;k<K;k++){
      const q=t/period+k/K,cyc=Math.floor(q),f=q-cyc;
      const pick=Math.floor(hash(cyc*31+k*7)*N);
      const tg=pos[pick],e=ease(f);
      blk('T',lerp(bx,tg[0],e),lerp(by+R,tg[1],e),16,clamp(f/0.1,0,1)*clamp((1-f)/0.18,0,1),f*2.4);
      if(f>0.8)flash[pick]=Math.max(flash[pick],1-(f-0.8)/0.2);
    }
  }
  pos.forEach((q,i)=>molecule(q[0],q[1],10,Math.sin(ph*1.7+HOMES[b][i].p3)*1.4,{flash:flash[i]}));
  ctx.restore();
  txt(N+' molecules drawn',bx,by-R-12,{align:'center',font:'800 14px Nunito, sans-serif',col:PAN_COL.mass[b],halo:4});
}

/* What it costs to warm 1 kg of this material by 1 °C, as a pile of
   blocks that builds up at the start of the chapter. */
function blockPile(cx,p,i,t){
  const n=blocksPerDegree(p.mat),cols=n>12?7:5,s=26,gap=30;
  const rows=Math.ceil(n/cols),x0=cx-38-(cols-1)*gap/2,y0=338;
  for(let k=0;k<n;k++){
    const a=clamp(t*7-k,0,1);
    if(a<=0)continue;
    const r=Math.floor(k/cols),c=k%cols;
    blk('T',x0+c*gap,y0-r*gap-(1-ease(a))*30,s,a,0);
  }
  pill(MAT[p.mat].c+' J to warm 1 kg by 1 °C',cx-38,y0+30,{align:'center',bd:PAN_COL.material[i],font:'800 14px Nunito, sans-serif',h:28});
  txt('c = '+MAT[p.mat].c+' J/kg °C',cx-38,y0-rows*gap-8,{align:'center',font:'600 20px Fredoka, sans-serif',col:PAN_COL.material[i],halo:4});
}

function equationScene(t){
  backdrop(0);
  const show=(t0)=>clamp((t-t0)/0.7,0,1);
  /* E = m × c × ΔT, laid out by measuring each token */
  const toks=[['E','#27b0e6'],['=',null],['m','#0a5f8f'],['×',null],['c','#a8500b'],['×',null],['ΔT','#e5531a']];
  ctx.font='600 104px Fredoka, sans-serif';
  const gap=26,ws=toks.map(k=>ctx.measureText(k[0]).width);
  const total=ws.reduce((a,b)=>a+b,0)+gap*(toks.length-1);
  let x=SW/2-total/2;const mid=[];
  toks.forEach((k,i)=>{
    txt(k[0],x,170,{font:'600 104px Fredoka, sans-serif',col:k[1]||'#17324d'});
    mid.push(x+ws[i]/2);x+=ws[i]+gap;
  });
  const lab=[
    [0,'energy transferred','joules, J',1,'#27b0e6'],
    [2,'mass','kilograms, kg',2,'#0a5f8f'],
    [4,'specific heat capacity','J/kg °C',1,'#a8500b'],
    [6,'temperature change','°C   (ΔT = Tf − Ti)',2,'#e5531a']
  ];
  lab.forEach((l,j)=>{
    const a=show(0.8+j*0.6);if(a<=0)return;
    const y=l[3]===1?232:296;
    ctx.save();ctx.globalAlpha=a;
    ctx.strokeStyle=l[4];ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(mid[l[0]],190);ctx.lineTo(mid[l[0]],y-18);ctx.stroke();
    ctx.restore();
    pill(l[1],mid[l[0]],y,{align:'center',bd:l[4],font:'800 17px Nunito, sans-serif',h:32,alpha:a});
    txt(l[2],mid[l[0]],y+30,{align:'center',font:'700 14px Nunito, sans-serif',col:'#3d6480',halo:4});
  });
  /* the three pans, worked through the equation */
  const ex=[[PANS.mass[0],PAN_COL.mass[0]],[PANS.mass[1],PAN_COL.mass[1]],[PANS.material[1],PAN_COL.material[1]]];
  const a0=show(4);
  if(a0>0){
    ctx.save();ctx.globalAlpha=a0;panel(300,350,800,170,'The pans, through the equation');ctx.restore();
  }
  ex.forEach((e,j)=>{
    const a=show(4.5+j*0.9);if(a<=0)return;
    const p=e[0],r=panRise(p,HOB.E);
    ctx.save();ctx.globalAlpha=a;
    txt(p.m.toFixed(1)+' kg of '+MAT[p.mat].name+', +'+dp(r)+' °C',330,408+j*36,{font:'800 17px Nunito, sans-serif',col:e[1]});
    txt('E = '+p.m.toFixed(1)+' × '+MAT[p.mat].c+' × '+dp(r)+' = '+num(p.m*MAT[p.mat].c*r)+' J',640,408+j*36,{font:'700 17px Nunito, sans-serif',col:'#17324d'});
    ctx.restore();
  });
  const a1=show(7.5);
  if(a1>0)lines([['All three got the same energy. Mass and material decided how far each one warmed.',{alpha:a1}]],SW/2,550,0,
    {align:'center',font:'700 17px Nunito, sans-serif',col:'#3d6480',halo:4});
  const a2=show(9);
  if(a2>0){
    pill('To MEASURE c, turn it round:   c = E ÷ (m × ΔT)   — so we need m, Ti, Tf and E',SW/2,598,
      {align:'center',bd:'#e5531a',bg:'#fff3e8',col:'#a8500b',font:'800 19px Nunito, sans-serif',h:40,alpha:a2});
  }
}

/* The block: a cylinder, with its front cut away down the middle so the
   heater and the thermometer can be seen in their holes. */
function block(T,lagged,glow){
  const {cx,r,top,bot,ry}=BL;
  ctx.save();
  /* shadow */
  ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(cx+8,bot+4,r+14,ry+4,0,0,TAU);ctx.fill();
  if(lagged){
    /* insulation round the outside, drawn as a wider cylinder of wadding */
    const R=r+LAG;
    ctx.beginPath();ctx.moveTo(cx-R,top-LAG);ctx.lineTo(cx-R,bot);ctx.ellipse(cx,bot,R,ry+4,0,Math.PI,0,true);
    ctx.lineTo(cx+R,top-LAG);ctx.ellipse(cx,top-LAG,R,ry+4,0,0,Math.PI,true);ctx.closePath();
    ctx.fillStyle='#f1ead7';ctx.fill();
    ctx.lineWidth=2;ctx.strokeStyle='#cbbf9d';ctx.stroke();
    for(let i=0;i<70;i++){
      const u=hash(i*3+1),v=hash(i*3+2);
      const x=cx-R+u*2*R,y=top-LAG+v*(bot-top+LAG);
      if(Math.abs(x-cx)<CUT+4)continue;
      ctx.fillStyle='rgba(203,191,157,.55)';ctx.beginPath();ctx.arc(x,y,3+hash(i*3+3)*4,0,TAU);ctx.fill();
    }
    ctx.beginPath();ctx.ellipse(cx,top-LAG,R,ry+4,0,0,TAU);ctx.fillStyle='#f7f1e2';ctx.fill();ctx.stroke();
  }
  /* metal body, warming in tint */
  const w=clamp((T-20)/35,0,1);
  const g=ctx.createLinearGradient(cx-r,0,cx+r,0);
  g.addColorStop(0,'#8c96a0');g.addColorStop(0.25,'rgb('+Math.round(lerp(222,236,w))+','+Math.round(lerp(228,214,w))+','+Math.round(lerp(234,206,w))+')');
  g.addColorStop(0.6,'#aeb7c0');g.addColorStop(1,'#7a848e');
  ctx.beginPath();ctx.moveTo(cx-r,top);ctx.lineTo(cx-r,bot);ctx.ellipse(cx,bot,r,ry,0,Math.PI,0,true);
  ctx.lineTo(cx+r,top);ctx.ellipse(cx,top,r,ry,0,0,Math.PI,true);ctx.closePath();
  ctx.fillStyle=g;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#6b7580';ctx.stroke();
  ctx.beginPath();ctx.ellipse(cx,top,r,ry,0,0,TAU);ctx.fillStyle='#d3d9df';ctx.fill();ctx.stroke();
  /* the cut face */
  const cg=ctx.createLinearGradient(0,top,0,bot);
  cg.addColorStop(0,'rgb('+Math.round(lerp(206,232,w))+','+Math.round(lerp(212,200,w))+','+Math.round(lerp(218,190,w))+')');
  cg.addColorStop(1,'#b9c1c8');
  ctx.fillStyle=cg;ctx.fillRect(cx-CUT,top,2*CUT,bot-top);
  ctx.save();ctx.beginPath();ctx.rect(cx-CUT,top,2*CUT,bot-top);ctx.clip();
  ctx.strokeStyle='rgba(120,130,140,.25)';ctx.lineWidth=1.5;
  for(let k=-10;k<20;k++){ctx.beginPath();ctx.moveTo(cx-CUT+k*16,top);ctx.lineTo(cx-CUT+k*16+(bot-top)*0.5,bot);ctx.stroke();}
  ctx.restore();
  ctx.lineWidth=2;ctx.strokeStyle='#6b7580';ctx.strokeRect(cx-CUT,top,2*CUT,bot-top);
  if(lagged){
    ctx.fillStyle='#e9dfc4';ctx.fillRect(cx-CUT,top-LAG,2*CUT,LAG);
    ctx.strokeStyle='#cbbf9d';ctx.strokeRect(cx-CUT,top-LAG,2*CUT,LAG);
  }
  /* the two holes */
  ctx.fillStyle='#4a525b';
  ctx.fillRect(HX-13,top-(lagged?LAG:0),26,bot-top-30+(lagged?LAG:0));
  ctx.fillRect(TX-10,top-(lagged?LAG:0),20,bot-top-30+(lagged?LAG:0));
  /* the heater: a rod in the first hole, its coil glowing while on */
  ctx.fillStyle='#2b2f36';ctx.fillRect(HX-8,top-36,16,bot-top+2);
  ctx.fillStyle='#1b1e22';rr(HX-12,top-48,24,16,4);ctx.fill();
  if(glow>0.01){
    ctx.strokeStyle='rgba(255,'+Math.round(120+60*glow)+',40,'+(0.9*glow).toFixed(2)+')';ctx.lineWidth=2.5;
    ctx.beginPath();
    for(let y=top+8;y<bot-34;y+=9){ctx.moveTo(HX-6,y);ctx.lineTo(HX+6,y+4.5);ctx.lineTo(HX-6,y+9);}
    ctx.stroke();
  }
  ctx.restore();
}

/* The right-hand card: what has to be measured, filling in as it is. */
function measureCard(o){
  const P={x:1010,y:20,w:375,h:362};
  panel(P.x,P.y,P.w,P.h,'What we need to measure');
  const rows=[
    ['m','','kg','top-pan balance',o.m],
    ['T','i','°C','thermometer, before',o.Ti],
    ['T','f','°C','thermometer, after '+FACTS.minutes+' minutes',o.Tf],
    ['E','','J','joulemeter',o.E]
  ];
  rows.forEach((r,i)=>{
    const y=P.y+76+i*60;
    sym(r[0],r[1],P.x+22,y,30,'#17324d');
    txt('=',P.x+76,y,{font:'600 28px Fredoka, sans-serif',col:'#17324d'});
    const v=r[4];
    if(!v){
      ctx.save();ctx.strokeStyle='#9cb5c6';ctx.lineWidth=2;ctx.setLineDash([6,5]);
      ctx.beginPath();ctx.moveTo(P.x+108,y+4);ctx.lineTo(P.x+258,y+4);ctx.stroke();ctx.restore();
    } else {
      if(v.flash>0.01){
        ctx.save();ctx.globalAlpha=v.flash*0.5;rr(P.x+102,y-28,162,38,8);ctx.fillStyle='#ffd27a';ctx.fill();ctx.restore();
      }
      txt(v.s,P.x+258,y,{align:'right',font:(v.live?'700 ':'800 ')+'26px Nunito, sans-serif',col:v.live?'#8aa1b1':'#0a5f8f'});
    }
    txt(r[2],P.x+268,y,{font:'700 20px Nunito, sans-serif',col:'#3d6480'});
    txt(r[3],P.x+110,y+21,{font:'400 12.5px Nunito, sans-serif',col:'#5d7f93'});
  });
  txt('c = E ÷ (m × (Tf − Ti))',P.x+22,P.y+P.h-48,{font:'800 17px Nunito, sans-serif',col:'#a8500b'});
  if(o.result)txt(o.result,P.x+22,P.y+P.h-20,{font:'800 15px Nunito, sans-serif',col:'#17324d'});
}
function fill(s,t0,t){return {s,flash:clamp(1-(t-t0)/1.2,0,1)*(t>=t0?1:0)};}
function mmss(s){s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}

function rigGraph(c,k,ts,t){
  const G={x:1010,y:394,w:375,h:244};
  panel(G.x,G.y,G.w,G.h,'Temperature of the block');
  const A=axes(G,RIG.tRun/60,10,60,2,10,'time / minutes','temperature / °C');
  const fn=m=>rigState(m*60,k).T,ideal=m=>rigState(m*60,k).ideal;
  const now=ts/60;
  if(c.stage==='loss'||c.stage==='lag'){
    plot(ideal,0,RIG.tRun/60,A,'#c98a0c',{dash:[6,5],w:2.4});
    txt('if no energy escaped',A.X(RIG.tRun/60)-4,A.Y(ideal(RIG.tRun/60))-8,{align:'right',font:'700 12px Nunito, sans-serif',col:'#a8500b',halo:3});
    /* the gap between the two lines is the energy lost */
    if(now>0.05){
      ctx.save();ctx.beginPath();
      for(let i=0;i<=30;i++){const m=now*i/30;i?ctx.lineTo(A.X(m),A.Y(ideal(m))):ctx.moveTo(A.X(m),A.Y(ideal(m)));}
      for(let i=30;i>=0;i--){const m=now*i/30;ctx.lineTo(A.X(m),A.Y(fn(m)));}
      ctx.closePath();ctx.fillStyle='rgba(47,127,184,.22)';ctx.fill();ctx.restore();
    }
    if(c.stage==='lag'){
      const other=k===RIG.k.bare?RIG.k.lagged:RIG.k.bare;
      plot(m=>rigState(m*60,other).T,0,RIG.tRun/60,A,'#9aa9b4',{w:2,alpha:0.7});
    }
  }
  plot(fn,0,RIG.tRun/60,A,'#e4edf3',{w:3});
  plot(fn,0,now,A,'#e5531a');
  dot(A,now,fn(now),'#e5531a');
  return A;
}

/* Thermal blocks leaving the block's outer surface, as many as the rate it
   is losing energy at. That rate is k (T - Troom), so none escape at the
   start and more do as it warms up. */
function escapes(s,t,lagged,P){
  const frac=clamp(s.lossRate/(RIG.k.bare*FACTS.bare.dT),0,1);
  if(frac<=0.01)return frac;
  const R=BL.r+(lagged?LAG:0),top=BL.top-(lagged?LAG:0);
  const o={speed:42,spacing:46,size:18,alpha:frac};
  [380,450,515].forEach((y,i)=>{
    stream([[BL.cx-R+4,y],[BL.cx-R-80,y-30]],t,Object.assign({phase:i*13},o));
    stream([[BL.cx+R-4,y+10],[BL.cx+R+80,y-20]],t,Object.assign({phase:i*17+7},o));
  });
  stream([[BL.cx-58,top-6],[BL.cx-90,top-100]],t,Object.assign({phase:5},o));
  stream([[BL.cx+84,top-6],[BL.cx+118,top-96]],t,Object.assign({phase:19},o));
  /* the warmed air rising off it, out into the room */
  ctx.save();
  for(let i=0;i<14;i++){
    const ph=(t*0.22+hash(i+300))%1;
    const x=BL.cx+(hash(i+330)-0.5)*2*R+Math.sin(ph*6+i)*14;
    const y=top-10-ph*(top-40);
    ctx.globalAlpha=frac*(1-ph)*0.35;ctx.strokeStyle='#e88a5a';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(x,y);ctx.bezierCurveTo(x+8,y-12,x-8,y-24,x,y-36);ctx.stroke();
  }
  ctx.restore();
  return frac;
}

function rigScene(t,c){
  backdrop(1000);
  const stg=c.stage;
  const lagged=stg==='lag'&&!bareMode;
  const k=stg==='setup'?RIG.k.bare:(lagged?RIG.k.lagged:RIG.k.bare);
  const run=stg!=='setup';
  const ts=run?RIG.tRun*clamp(t/c.dur,0,1):0;
  const on=run&&t<c.dur;
  const s=rigState(ts,k);
  const R=readings(k);

  if(stg==='setup')balance(clamp((t-0.6)/1.6,0,1)*RIG.m);else mat();
  powerSupply(on);
  joulemeter(s.E);
  wire(WIRES.inB,'#3a3a3a');wire(WIRES.inR,'#d23a2a');
  block(s.T,lagged,on?0.85+0.15*Math.sin(t*6):0);
  wire(WIRES.outB,'#3a3a3a');wire(WIRES.outR,'#d23a2a');
  if(on){
    stream(WIRES.inR,t,{type:'E',speed:80,spacing:40,size:18,fadeIn:false});
    stream(WIRES.outR,t,{type:'E',speed:80,spacing:46,size:18});
    /* into the metal from the heater */
    [376,436,496].forEach((y,i)=>{
      stream([[HX-8,y],[BL.cx-CUT+6,y+14]],t,{speed:30,spacing:30,size:15,phase:i*9});
      stream([[HX+8,y+20],[TX-12,y+34]],t,{speed:30,spacing:30,size:15,phase:i*11+5});
    });
  }
  thermo(TX,90,BL.bot-44,0,60,s.T,{tick:5,lab:10,dp:1});

  let frac=0;
  if(stg==='loss'||stg==='lag')frac=escapes(s,t,lagged);

  /* --- what the left of the stage says --- */
  const fin=clamp((t-c.dur)/0.6,0,1);
  if(stg==='setup'){
    pill('Measuring c for aluminium',290,46,{align:'center',bd:'#e5531a',bg:'#fff3e8',col:'#a8500b',font:'800 20px Nunito, sans-serif',h:40});
    const a=j=>clamp((t-0.4-j*0.7)/0.5,0,1);
    callout('power supply, '+RIG.V+' V',PS.x+PS.w/2,PS.y-30,PS.x+PS.w/2,PS.y,{align:'center',alpha:a(0)});
    callout('counts every joule into the heater',JM.x+JM.w/2,JM.y-62,JM.x+JM.w/2,JM.y,{align:'center',alpha:a(1)});
    callout('thermometer, in a hole',795,160,TX+8,210,{alpha:a(3)});
    callout('heater, in a second hole',795,300,HX,420,{alpha:a(2)});
    callout('aluminium block, cut away',795,470,BL.cx+BL.r-6,470,{alpha:a(4)});
    callout('top-pan balance',BL.cx-150,622,BL.cx-110,BENCH_Y-6,{align:'center',alpha:a(5)});
    pill('no joulemeter? E = V × I × t with a voltmeter, ammeter and stopwatch',290,104,
      {align:'center',bd:'#a9c9dc',font:'700 13.5px Nunito, sans-serif',h:28,alpha:clamp((t-5)/0.6,0,1)});
  }
  if(stg==='run'){
    pill('Switch on and time '+FACTS.minutes+' minutes',290,46,{align:'center',bd:'#e5531a',bg:'#fff3e8',col:'#a8500b',font:'800 20px Nunito, sans-serif',h:40});
    pill('time '+mmss(ts),JM.x+JM.w/2,JM.y-26,{align:'center',bd:'#27b0e6',font:'800 16px Nunito, sans-serif',h:30});
    if(fin>0){
      pill('c ≈ '+R.cShown+' J/kg °C … but the data book says '+FACTS.cTrue+'. Why?',290,100,
        {align:'center',bd:'#2f7fb8',bg:'#ecf5fc',col:'#1d5f8c',font:'800 16px Nunito, sans-serif',h:34,alpha:fin});
    }
  }
  if(stg==='loss'){
    pill('The joulemeter counts every joule INTO the heater',300,46,{align:'center',bd:'#27b0e6',bg:'#eef9fe',col:'#0e5a7a',font:'800 18px Nunito, sans-serif',h:38});
    pill('… but not every joule STAYS in the block',300,92,{align:'center',bd:'#e5531a',bg:'#fff3e8',col:'#a8500b',font:'800 18px Nunito, sans-serif',h:38,alpha:clamp((t-2)/0.6,0,1)});
    const a=clamp((frac-0.15)/0.2,0,1);
    callout('warm air rises and carries it off',390,190,BL.cx-70,BL.top-70,{align:'center',alpha:a});
    callout('it radiates infrared',795,250,BL.cx+BL.r+50,440,{alpha:a});
    callout('a little conducts into the mat',BL.cx,622,BL.cx-60,BENCH_Y-8,{align:'center',alpha:a});
  }
  if(stg==='lag'){
    pill(lagged?'Insulated: less escapes':'Bare: compare with insulated',300,46,{align:'center',bd:'#e5531a',bg:'#fff3e8',col:'#a8500b',font:'800 20px Nunito, sans-serif',h:40});
    if(lagged)callout('insulation (lagging)',795,250,BL.cx+BL.r+LAG-4,400);
    pill('it still escapes, only more slowly: c always comes out a little high',300,96,
      {align:'center',bd:'#a9c9dc',font:'700 14px Nunito, sans-serif',h:30,alpha:fin});
  }

  /* --- the right column --- */
  if(stg==='setup'){
    measureCard({m:t>2.3?fill(RIG.m.toFixed(3),2.3,t):null,Ti:t>3.6?fill(RIG.Troom.toFixed(1),3.6,t):null});
  } else if(stg==='run'){
    const done=t>=c.dur;
    measureCard({
      m:{s:RIG.m.toFixed(3)},Ti:{s:RIG.Troom.toFixed(1)},
      Tf:done?fill(R.Tf.toFixed(1),c.dur,t):(ts>0?{s:s.T.toFixed(1),live:true}:null),
      E:done?fill(num(R.E),c.dur,t):(ts>0?{s:num(s.E),live:true}:null),
      result:t>c.dur+1?'= '+num(R.E)+' ÷ ('+R.m.toFixed(3)+' × '+R.dT.toFixed(1)+') ≈ '+R.cShown+' J/kg °C':''
    });
  } else if(stg==='loss'){
    lossPanel(s,t,c);
  } else {
    lagPanel(lagged,fin);
  }
  rigGraph(c,k,ts,t);
}

/* Where the joulemeter's joules went, split as they go. */
function lossPanel(s,t,c){
  const P={x:1010,y:20,w:375,h:362};
  panel(P.x,P.y,P.w,P.h,'Where the joulemeter’s joules went');
  txt('into the heater: '+num(s.E)+' J',P.x+18,P.y+62,{font:'800 17px Nunito, sans-serif',col:'#0e5a7a'});
  const bx=P.x+18,bw=P.w-36,by=P.y+78,bh=38;
  rr(bx,by,bw,bh,8);ctx.fillStyle='#e8eef2';ctx.fill();
  if(s.E>0){
    const kw=bw*s.kept/s.E;
    rr(bx,by,kw,bh,8);ctx.fillStyle='#e5531a';ctx.fill();
    ctx.fillStyle='#2f7fb8';ctx.fillRect(bx+kw,by,bw-kw,bh);
    ctx.lineWidth=2;ctx.strokeStyle='#17324d';rr(bx,by,bw,bh,8);ctx.stroke();
  }
  const pc=s.E>0?Math.round(100*s.lost/s.E):0;
  lines([
    ['warmed the block (m c ΔT): '+num(s.kept)+' J',{col:'#c2410c'}],
    ['escaped to the air: '+num(s.lost)+' J ('+pc+'%)',{col:'#1d5f8c'}]
  ],P.x+18,P.y+144,24,{font:'800 15.5px Nunito, sans-serif'});
  const a=clamp((t-c.dur*0.5)/0.8,0,1),b=clamp((t-c.dur)/0.8,0,1);
  lines([
    ['c = E ÷ (m ΔT) assumes ALL of E warmed',{alpha:a}],
    ['the block. Some heated the air instead, so',{alpha:a}],
    ['ΔT is smaller than it should be …',{alpha:a}],
    ['… so c comes out too BIG: '+FACTS.bare.cShown+', not '+FACTS.cTrue,{alpha:b,col:'#a8500b',font:'800 15px Nunito, sans-serif'}],
    ['The energy is not destroyed: it spreads out',{alpha:b}],
    ['into the room, too thinly to be any use.',{alpha:b}]
  ],P.x+18,P.y+206,25,{font:'700 15px Nunito, sans-serif',col:'#17324d'});
}

/* Bare against insulated, against the data book. */
function lagPanel(lagged,fin){
  const P={x:1010,y:20,w:375,h:362};
  panel(P.x,P.y,P.w,P.h,'Measured c, after '+FACTS.minutes+' minutes');
  const rows=[
    ['bare block',FACTS.bare,'#2f7fb8',!lagged],
    ['insulated',FACTS.lagged,'#c98a0c',lagged],
    ['data book',null,'#17324d',false]
  ];
  const max=1200,bx=P.x+130,bw=P.w-150;
  rows.forEach((r,i)=>{
    const y=P.y+76+i*56;
    const v=r[1]?r[1].cShown:FACTS.cTrue;
    const shown=r[1]?(r[3]?fin:1):1;
    txt(r[0],P.x+18,y+6,{font:(r[3]?'800 ':'700 ')+'16px Nunito, sans-serif',col:'#17324d'});
    rr(bx,y-12,bw,26,6);ctx.fillStyle='#eef3f6';ctx.fill();
    if(shown>0.01){
      rr(bx,y-12,bw*v/max*shown,26,6);ctx.fillStyle=r[2];ctx.fill();
      ctx.save();ctx.globalAlpha=shown;
      txt(v+' J/kg °C',bx+6,y+6,{font:'800 15px Nunito, sans-serif',col:'#fff'});
      ctx.restore();
    }
    if(r[1])txt(r[1].lostPc+'% escaped',bx+bw,y+30,{align:'right',font:'700 12.5px Nunito, sans-serif',col:'#5d7f93'});
  });
  lines([
    'Insulation slows the escape, so more of E',
    'stays in the block and ΔT is nearer the truth.',
    'Also: a drop of water in each hole, so the',
    'heater and thermometer touch the metal well.'
  ],P.x+18,P.y+258,24,{font:'700 14.5px Nunito, sans-serif',col:'#3d6480'});
}

/* ===================================================================
   CHAPTERS
   =================================================================== */
const CH=[
 {kick:'What affects the temperature rise?',title:'Mass: how many particles share the energy',view:'pans',set:'mass',dur:12,hold:6},
 {kick:'What affects the temperature rise?',title:'The material: water or oil',view:'pans',set:'material',dur:12,hold:6},
 {kick:'Specific heat capacity',title:'The equation',view:'equation',dur:12},
 {kick:'Required practical',title:'The apparatus, and what to measure',view:'rig',stage:'setup',dur:7},
 {kick:'Required practical',title:'Heat it for ten minutes',view:'rig',stage:'run',dur:20,hold:7},
 {kick:'Heat losses',title:'Where did the energy go?',view:'rig',stage:'loss',dur:20,hold:8},
 {kick:'Heat losses',title:'Cutting the losses',view:'rig',stage:'lag',dur:16,hold:8,toggle:true}
];

/* ===================================================================
   NAVIGATION
   =================================================================== */
let cur=0,localT=0,bareMode=false;
const dots=$('#dots');
CH.forEach((c,i)=>{
  const b=document.createElement('button');
  b.setAttribute('aria-label','Go to '+c.title);b.onclick=()=>show(i);dots.appendChild(b);
});
function show(n){
  cur=clamp(n,0,CH.length-1);
  const c=CH[cur];
  $('#kicker').textContent=c.kick;$('#title').textContent=c.title;
  [...dots.children].forEach((d,i)=>d.classList.toggle('on',i===cur));
  $('#prev').disabled=cur===0;
  $('#next').textContent=cur===CH.length-1?'Start again':'Next';
  localT=0;bareMode=false;
  /* the one per-chapter control: bare or insulated */
  $('#ctrl').innerHTML=c.toggle
    ?'<button class="btn ghost" id="tBare">Bare block</button>'
     +'<button class="btn on" id="tLag">Insulated</button>'
    :'';
  if(c.toggle){
    const bb=$('#tBare'),lb=$('#tLag');
    const set=v=>{bareMode=v;localT=0;
      bb.className='btn'+(v?' on':' ghost');lb.className='btn'+(v?' ghost':' on');};
    bb.onclick=()=>set(true);lb.onclick=()=>set(false);
  }
  resize();
}
$('#prev').onclick=()=>show(cur-1);
$('#next').onclick=()=>show(cur===CH.length-1?0:cur+1);
$('#replay').onclick=()=>{localT=0;};
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')show(Math.min(cur+1,CH.length-1));
  if(e.key==='ArrowLeft')show(cur-1);
});

/* ===================================================================
   LAYOUT AND LOOP
   The bar is measured rather than assumed, so changing its padding or
   letting it wrap cannot crop the stage.
   =================================================================== */
function furniture(sel,fallback){const e=$(sel);return (e&&e.offsetHeight)||fallback;}
function resize(){
  dpr=Math.min(devicePixelRatio||1,2);
  const w=innerWidth,h=innerHeight;
  canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
  canvas.style.width=w+'px';canvas.style.height=h+'px';
  const barH=Math.min(furniture('#bar',66),h*0.4)+18;
  const ax=10,ay=10,aw=w-20,ah=Math.max(140,h-20-barH);
  const s=Math.min(aw/SW,ah/SH);
  stage={s,x:ax+(aw-SW*s)/2,y:ay+(ah-SH*s)/2};
}
addEventListener('resize',resize);

function scene(t){
  const c=CH[cur];
  if(c.view==='pans')pansScene(t,c);
  else if(c.view==='equation')equationScene(t);
  else rigScene(t,c);
}

let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,0.05);last=now;
  localT+=reduceMotion?dt*0.35:dt;
  const c=CH[cur];
  if(c.hold&&localT>c.dur+c.hold)localT=0;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const g=ctx.createLinearGradient(0,0,0,innerHeight);
  g.addColorStop(0,'#e3f1f9');g.addColorStop(1,'#cfe3ef');
  ctx.fillStyle=g;ctx.fillRect(0,0,innerWidth,innerHeight);
  ctx.save();
  ctx.translate(stage.x,stage.y);ctx.scale(stage.s,stage.s);
  ctx.beginPath();ctx.rect(-4,-4,SW+8,SH+8);ctx.clip();
  scene(localT);
  ctx.restore();
  requestAnimationFrame(frame);
}
resize();show(0);requestAnimationFrame(frame);
})();
</script>
