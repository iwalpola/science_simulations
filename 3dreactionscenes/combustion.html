<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combustion</title>
<style>
  :root{
    --ink:#eef2f7;
    --dim:#93a2b6;
    --panel:rgba(10,14,21,.72);
    --line:rgba(147,162,182,.22);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:#080b11;color:var(--ink);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden;}
  #stage{position:fixed;inset:0;}
  canvas{display:block;}

  #fade{position:fixed;inset:0;background:#080b11;pointer-events:none;opacity:0;}

  .title{position:fixed;top:22px;left:26px;max-width:min(46ch,60vw);pointer-events:none;}
  .title h1{
    margin:0;
    font-family:"Iowan Old Style","Charter","Palatino Linotype",Georgia,serif;
    font-weight:600;font-size:23px;letter-spacing:.2px;line-height:1.25;
  }
  .title p{margin:6px 0 0;font-size:13px;line-height:1.5;color:var(--dim);}
  .eq{font-variant-numeric:tabular-nums;}
  .title a{pointer-events:auto;color:var(--dim);text-decoration:none;font-size:12px;
    border-bottom:1px solid rgba(147,162,182,.3);}
  .title a:hover{color:var(--ink);}

  #caption{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:112px;width:min(690px,92vw);text-align:center;pointer-events:none;
    font-family:"Iowan Old Style","Charter","Palatino Linotype",Georgia,serif;
    font-size:19px;line-height:1.45;
    text-shadow:0 2px 18px rgba(0,0,0,.85);
    transition:opacity .35s ease;
  }
  /* the energy ledger, during the bond-breaking act */
  #ledger{
    position:fixed;right:24px;bottom:150px;width:188px;pointer-events:none;
    font-size:12px;color:var(--dim);opacity:0;transition:opacity .4s ease;
  }
  #ledger .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
  #ledger .bar{height:7px;border-radius:4px;margin-bottom:9px;transition:width .3s ease;}
  #ledger .in .bar{background:linear-gradient(90deg,#6f9cff,#9fc4ff);}
  #ledger .out .bar{background:linear-gradient(90deg,#ff9a3c,#ffd08a);}
  #ledger b{color:var(--ink);font-weight:600;}

  #bar{
    position:fixed;left:50%;transform:translateX(-50%);bottom:20px;
    width:min(740px,94vw);
    background:var(--panel);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;display:flex;align-items:center;gap:12px;
  }
  button{
    font:inherit;font-size:13px;color:var(--ink);
    background:rgba(255,255,255,.06);border:1px solid var(--line);
    border-radius:9px;padding:7px 13px;cursor:pointer;
    transition:background .15s ease,border-color .15s ease;
  }
  button:hover{background:rgba(255,255,255,.12);}
  button:focus-visible{outline:2px solid #7fb0ff;outline-offset:2px;}
  #play{min-width:74px;}
  #gear{padding:7px 11px;font-size:15px;line-height:1;}
  #gear.open{background:rgba(127,176,255,.2);border-color:rgba(127,176,255,.5);}
  #scrub{
    flex:1;appearance:none;height:4px;border-radius:4px;
    background:linear-gradient(90deg,var(--hl,#6f9cff) 0%,var(--hl,#6f9cff) var(--p,0%),rgba(255,255,255,.14) var(--p,0%));
    cursor:pointer;
  }
  #scrub::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;
    background:var(--ink);border:none;box-shadow:0 0 0 3px rgba(8,11,17,.6);}
  #scrub::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ink);border:none;}
  #clock{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:74px;text-align:right;}

  #key{
    position:fixed;right:24px;top:22px;
    background:var(--panel);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:12px;padding:11px 13px;
    font-size:12.5px;line-height:1.9;color:var(--dim);
  }
  #key div{display:flex;align-items:center;gap:8px;}
  .dot{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:inset -2px -2px 3px rgba(0,0,0,.45);}
  #key b{color:var(--ink);font-weight:600;}
  #hint{position:fixed;bottom:90px;right:24px;font-size:11.5px;color:var(--dim);opacity:.75;}

  /* ---- menu ---- */
  #menu{
    position:fixed;left:50%;transform:translateX(-50%);bottom:86px;
    width:min(740px,94vw);
    background:var(--panel);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;display:none;gap:18px;
  }
  #menu.open{display:flex;flex-wrap:wrap;}
  #menu fieldset{border:none;margin:0;padding:0;flex:1;min-width:210px;}
  #menu legend{
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:#64748b;padding:0 0 8px;
  }
  .opts{display:flex;flex-wrap:wrap;gap:6px;}
  .opt{
    font:inherit;font-size:12.5px;padding:6px 11px;border-radius:8px;
    background:rgba(255,255,255,.05);border:1px solid var(--line);
    color:var(--dim);cursor:pointer;
  }
  .opt:hover{background:rgba(255,255,255,.1);color:var(--ink);}
  .opt.on{background:rgba(127,176,255,.18);border-color:rgba(127,176,255,.5);color:#dce9ff;}
  .opt.off{opacity:.34;cursor:not-allowed;text-decoration:line-through;}
  .opt.off:hover{background:rgba(255,255,255,.05);color:var(--dim);}
  .opt .f{font-family:"Iowan Old Style","Charter",Georgia,serif;font-variant-numeric:tabular-nums;}
  #menuEq{
    flex-basis:100%;border-top:1px solid var(--line);padding-top:12px;margin:0;
    font-family:"Iowan Old Style","Charter",Georgia,serif;font-size:16px;
    color:var(--ink);font-variant-numeric:tabular-nums;
  }
  #menuEq span{color:#64748b;font-size:12px;display:block;margin-top:5px;
    font-family:ui-sans-serif,system-ui,sans-serif;line-height:1.5;}
  #menuEq b.warn{color:#e89a8a;font-weight:600;}
  #menuEq i{color:#a8c9ff;font-style:normal;}

  @media (max-width:640px){
    .title h1{font-size:18px;} .title p{display:none;}
    #key{right:14px;top:14px;padding:8px 10px;font-size:11px;line-height:1.7;}
    #caption{font-size:16px;bottom:100px;}
    #hint,#ledger{display:none;}
    #clock{display:none;}
    #menu{bottom:82px;padding:13px 14px;}
  }
  @media (prefers-reduced-motion:reduce){#caption,#ledger{transition:none;}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="fade"></div>

<div class="title">
  <h1 id="h1">Burning methane</h1>
  <p class="eq" id="subtitle">CH₄ + 2O₂ → CO₂ + 2H₂O</p>
  <p><a href="index.html">← All fourteen reactions</a></p>
</div>

<div id="key"></div>

<div id="ledger">
  <div class="in">
    <div class="row"><span>breaking bonds</span><b>energy in</b></div>
    <div class="bar" id="barIn" style="width:0%"></div>
  </div>
  <div class="out">
    <div class="row"><span>making bonds</span><b>energy out</b></div>
    <div class="bar" id="barOut" style="width:0%"></div>
  </div>
</div>

<div id="caption"></div>
<div id="hint">Drag to look around</div>

<div id="menu">
  <fieldset>
    <legend>Fuel</legend>
    <div class="opts" id="fuelOpts"></div>
  </fieldset>
  <fieldset>
    <legend>Air supply</legend>
    <div class="opts" id="airOpts"></div>
  </fieldset>
  <p id="menuEq"></p>
</div>

<div id="bar">
  <button id="play">Pause</button>
  <button id="restart">Restart</button>
  <input id="scrub" type="range" min="0" max="62" step="0.01" value="0" aria-label="Timeline">
  <span id="clock">0.0 / 62.0s</span>
  <button id="gear" title="Change the fuel" aria-label="Change the fuel">⚙</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------------------------------------------------------------------------
   SCENE 12 — combustion,  fuel + O₂ → CO₂ + H₂O

   The odd one out: not a single ion anywhere. Nothing gains or loses an
   electron — every bond is a shared pair, and all that happens is that the
   sharing is rearranged. So micro world 2 is built round the one idea that
   actually explains a flame:

     every bond in the reactants breaks     — which costs energy, in
     new bonds form in the products         — which releases energy, out
     and out is bigger than in              — and the difference IS the flame

   The atoms are never created or destroyed, and the scene proves it: micro 2
   builds its cast from the balanced equation, so every carbon, hydrogen and
   oxygen that goes in is accounted for in a product when it comes out.

   Air supply matters. Starve it and the carbon cannot all reach CO₂, so you
   get carbon monoxide and soot instead — which the macro act shows as a
   yellow, sooty flame, and the micro act shows as carbon leaving with one
   oxygen instead of two.

   Acts:
     0  – 7   macro: the flame, the funnel, the cold tube, the limewater
     7  – 15  micro 1: the fuel molecule
    15  – 30  macro: light it and collect the products
    30  – end micro 2: break everything, then build the products

   Everything is a closed-form function of t — no particle sim.
--------------------------------------------------------------------------- */

/* ======================= the species tables ======================= */

const EL = {               // the same palette as every other scene here
  O: {name:'oxygen',   col:0x2f47b8, r:0.50},
  H: {name:'hydrogen', col:0xd8402f, r:0.34},
  C: {name:'carbon',   col:0x4d5560, r:0.58}
};
const O_ATOM_R = 0.42;

/* Each fuel carries its composition and its balanced coefficients, so the
   equations and the cast in micro 2 both come from the same numbers — and the
   test suite can check they balance. */
const FUELS = {
  CH4: {
    name:'methane', formula:'CH₄', desc:'one carbon, four hydrogens, and every bond identical',
    comp:{C:1,H:4,O:0},
    complete:   {fuel:1, o2:2, co2:1, co:0, h2o:2},
    incomplete: {fuel:2, o2:3, co2:0, co:2, h2o:4},
    burner:'gas'
  },
  C3H8: {
    name:'propane', formula:'C₃H₈', desc:'a chain of three carbons, wrapped in hydrogens',
    comp:{C:3,H:8,O:0},
    complete:   {fuel:1, o2:5, co2:3, co:0, h2o:4},
    incomplete: {fuel:2, o2:7, co2:0, co:6, h2o:8},
    burner:'gas'
  },
  C2H5OH: {
    name:'ethanol', formula:'C₂H₅OH', desc:'two carbons, and an oxygen already built in',
    comp:{C:2,H:6,O:1},
    complete:   {fuel:1, o2:3, co2:2, co:0, h2o:3},
    incomplete: {fuel:1, o2:2, co2:0, co:2, h2o:3},
    burner:'spirit'
  },
  H2: {
    name:'hydrogen', formula:'H₂', desc:'two atoms, one shared pair, and no carbon at all',
    comp:{C:0,H:2,O:0},
    complete:   {fuel:2, o2:1, co2:0, co:0, h2o:2},
    incomplete: null,            // no carbon, so nothing to burn incompletely
    burner:'gas'
  }
};

/* hydrogen cannot burn incompletely — there is no carbon to leave behind */
function forbidden(fk, air){ return air === 'low' && FUELS[fk].incomplete === null; }
const FORBID_REASON = 'hydrogen has no carbon, so there is no carbon monoxide or soot it could make';

const qs = new URLSearchParams(location.search);
let fuelKey = FUELS[qs.get('fuel')] ? qs.get('fuel') : 'CH4';
let airKey  = qs.get('air') === 'low' ? 'low' : 'full';
if(forbidden(fuelKey, airKey)) airKey = 'full';
let FU, CO, FULL;

function derive(){
  FU = FUELS[fuelKey];
  FULL = airKey === 'full';
  CO = FULL ? FU.complete : FU.incomplete;
}

const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
const n = k => k > 1 ? String(k) : '';
function equation(){
  const left = `${n(CO.fuel)}${FU.formula} + ${n(CO.o2)}O₂`;
  const parts = [];
  if(CO.co2) parts.push(`${n(CO.co2)}CO₂`);
  if(CO.co)  parts.push(`${n(CO.co)}CO`);
  if(CO.h2o) parts.push(`${n(CO.h2o)}H₂O`);
  return `${left} → ${parts.join(' + ')}`;
}
const makesCO2 = () => CO.co2 > 0;
const hasCarbon = () => FU.comp.C > 0;

/* the atom inventory, straight from the coefficients */
function inventory(){
  return {
    C: CO.fuel*FU.comp.C,
    H: CO.fuel*FU.comp.H,
    O: CO.fuel*FU.comp.O + 2*CO.o2
  };
}

const MICRO1_Y =  400;   // the fuel molecule
const MICRO2_Y = -400;   // bonds broken and remade

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
/* Colour management. Without outputEncoding the render is never converted back
   to sRGB, so every colour comes out darker and flatter than it was chosen to
   be. r128 spelling — this became outputColorSpace in later versions. */
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080b11);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.05, 2000);

scene.add(new THREE.HemisphereLight(0x9fb4d0, 0x0a0d13, 0.6));
const keyL = new THREE.DirectionalLight(0xffffff, 0.95); keyL.position.set(6,11,8); scene.add(keyL);
const fillL = new THREE.DirectionalLight(0x9ec3ff, 0.4); fillL.position.set(-8,4,-6); scene.add(fillL);
const rimL  = new THREE.DirectionalLight(0xffd9b0, 0.35); rimL.position.set(0,3,-10); scene.add(rimL);
const flameLight = new THREE.PointLight(0x8fb4ff, 0, 8); scene.add(flameLight);

(function environment(){
  const env = new THREE.Scene();
  const box = new THREE.BoxGeometry(1,1,1);
  env.add(new THREE.Mesh(new THREE.BoxGeometry(24,14,24),
    new THREE.MeshBasicMaterial({color:0x1d2634, side:THREE.BackSide})));
  const panel=(hex,gain,x,y,z,sx,sy,sz)=>{
    const m=new THREE.Mesh(box,new THREE.MeshBasicMaterial({color:hex}));
    m.material.color.multiplyScalar(gain);
    m.position.set(x,y,z); m.scale.set(sx,sy,sz); env.add(m);
  };
  panel(0xffffff,1.1,  0, 6.6,  0, 11,0.1,11);
  panel(0xbcd6ff,1.3, -9, 1.0,  0, 0.1,9,16);
  panel(0xffd7b0,0.9,  9, 1.0,  2, 0.1,9,16);
  panel(0x8fb0e0,0.5,  0, 0.0,-10, 18,9,0.1);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(env, 0.04).texture;
  pmrem.dispose();
})();

/* ---------- shared helpers ---------- */
const SPH = new THREE.SphereGeometry(1,32,24);
const SPH_LO = new THREE.SphereGeometry(1,16,12);
const CYL = new THREE.CylinderGeometry(1,1,1,20,1,false);

function atom(color, radius, opts={}){
  const mat = new THREE.MeshStandardMaterial({
    color, roughness: opts.rough ?? 0.35, metalness: opts.metal ?? 0.2,
    emissive: new THREE.Color(color).multiplyScalar(opts.glow ?? 0.06)
  });
  if(opts.op !== undefined && opts.op < 1){ mat.transparent = true; mat.opacity = opts.op; }
  const m = new THREE.Mesh(opts.lo?SPH_LO:SPH, mat);
  m.scale.setScalar(radius);
  return m;
}

function bond(color=0xa9b6c6, radius=0.11){
  const m = new THREE.Mesh(CYL, new THREE.MeshStandardMaterial({
    color, roughness:0.5, metalness:0.1, transparent:true, opacity:1
  }));
  m.userData.radius = radius;
  return m;
}
const _v1=new THREE.Vector3(), _up=new THREE.Vector3(0,1,0);
function placeBond(mesh, a, b, shrink=0){
  const dir = new THREE.Vector3().subVectors(b,a);
  const len = Math.max(dir.length()-shrink*2, 0.001);
  mesh.position.copy(a).addScaledVector(dir,0.5);
  mesh.scale.set(mesh.userData.radius, len, mesh.userData.radius);
  mesh.quaternion.setFromUnitVectors(_up, dir.normalize());
}
function tubeSeg(a, b, r, mat){
  const m = new THREE.Mesh(CYL, mat);
  m.userData.radius = r;
  placeBond(m, a, b, 0);
  return m;
}

function label(text, color='#eef2f7', size=54){
  const pad=16, c=document.createElement('canvas'), ctx=c.getContext('2d');
  const font = `600 ${size}px "Iowan Old Style", Charter, Georgia, serif`;
  ctx.font=font; const w=Math.ceil(ctx.measureText(text).width)+pad*2;
  c.width=w; c.height=size+pad*2;
  ctx.font=font; ctx.textBaseline='middle'; ctx.textAlign='center';
  ctx.shadowColor='rgba(0,0,0,.9)'; ctx.shadowBlur=14;
  ctx.fillStyle=color; ctx.fillText(text, c.width/2, c.height/2);
  const tex = new THREE.CanvasTexture(c); tex.anisotropy=4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false, opacity:0}));
  sp.renderOrder = 10;
  sp.scale.set(c.width/c.height*0.62, 0.62, 1);
  return sp;
}

const GLOW_TEX = (function(){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,   'rgba(255,255,255,1)');
  g.addColorStop(0.3, 'rgba(235,240,255,.55)');
  g.addColorStop(1,   'rgba(160,190,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
})();

function lerp(a,b,t){ return a+(b-a)*t; }
function clamp01(x){ return Math.max(0,Math.min(1,x)); }
function smooth(x){ x=clamp01(x); return x*x*(3-2*x); }
function ramp(t,a,b){ return smooth((t-a)/(b-a)); }

/* The other half of colour management. r128 uses a material colour in the
   lighting maths as if it were already linear, but hex codes are picked by eye
   and so are sRGB. Setting outputEncoding WITHOUT this leaves everything too
   light and desaturated. The flag keeps it idempotent, so rebuilding on a
   species change cannot double-convert. Colours rewritten every frame convert
   at the point of assignment instead. */
function linearise(root){
  root.traverse(o=>{
    if(!o.material) return;
    (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{
      if(!m || m.userData.__lin) return;
      m.userData.__lin = true;
      if(m.color)    m.color.convertSRGBToLinear();
      if(m.emissive) m.emissive.convertSRGBToLinear();
    });
  });
}

function clearGroup(g){
  for(let i=g.children.length-1;i>=0;i--){
    const c = g.children[i];
    g.remove(c);
    c.traverse(o=>{
      if(o.material){
        if(o.material.map && o.material.map !== GLOW_TEX) o.material.map.dispose();
        o.material.dispose();
      }
    });
  }
}
function rng(seed){
  let s = seed>>>0;
  return ()=>{ s = (s*1664525 + 1013904223)>>>0; return s/4294967296; };
}

/* =====================================================================
   MACRO WORLD — a flame under a funnel, a cold tube, and limewater
===================================================================== */
const macro = new THREE.Group(); scene.add(macro);

/* The bench gets a radial falloff painted into its colour map. Once the output
   is correctly sRGB-encoded even a near-black albedo lifts to a visible grey,
   and a flat 18-metre disc then sweeps across the lower frame as a pale dome.
   Darkening it further is not the fix; making it a pool of light is. A
   cylinder's cap UVs are a circle inscribed in the 0..1 square, so a radial
   gradient lands exactly on the disc. */
const benchMap = (function(){
  const S = 512, c = document.createElement('canvas');
  c.width = c.height = S;
  const x = c.getContext('2d');
  x.fillStyle = '#000'; x.fillRect(0,0,S,S);
  const g = x.createRadialGradient(S/2,S/2,0, S/2,S/2,S*0.5);
  g.addColorStop(0.00, 'rgba(255,255,255,1)');
  g.addColorStop(0.11, 'rgba(226,232,242,0.80)');
  g.addColorStop(0.24, 'rgba(140,152,172,0.26)');
  g.addColorStop(0.36, 'rgba(56,64,78,0.06)');
  g.addColorStop(0.50, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0,0,S,S);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  return t;
})();
const bench = new THREE.Mesh(
  new THREE.CylinderGeometry(9,9,0.35,64),
  new THREE.MeshStandardMaterial({color:0x4a515d, map:benchMap,
    roughness:0.94, metalness:0, envMapIntensity:0.10})
);
bench.position.y=-0.175; macro.add(bench);

const glassMat = new THREE.MeshStandardMaterial({
  color:0xbfd6e8, roughness:0.07, metalness:0.0,
  transparent:true, opacity:0.20, side:THREE.DoubleSide
});
const steel = new THREE.MeshStandardMaterial({color:0xb9c3cf, metalness:0.9, roughness:0.24});

/* the burner */
const BURN_X = -2.45;
let burner = null;
function buildBurner(){
  if(burner){ macro.remove(burner); clearGroup(burner); }
  burner = new THREE.Group(); macro.add(burner);
  if(FU.burner === 'gas'){
    const b = new THREE.Mesh(new THREE.CylinderGeometry(0.30,0.34,0.09,26),
      new THREE.MeshStandardMaterial({color:0x252c38, metalness:0.6, roughness:0.45}));
    b.position.set(BURN_X,0.045,0); burner.add(b);
    const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.09,0.82,18), steel);
    barrel.position.set(BURN_X,0.50,0); burner.add(barrel);
    const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.10,0.10,0.18,18), steel);
    collar.position.set(BURN_X,0.22,0); burner.add(collar);
  } else {
    /* a spirit burner for ethanol */
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.34,24,16),

const GEOM = {
  CH4: {atoms:[['C',0,0,0],['H',0.63,0.63,0.63],['H',0.63,-0.63,-0.63],
               ['H',-0.63,0.63,-0.63],['H',-0.63,-0.63,0.63]],
        bonds:[[0,1],[0,2],[0,3],[0,4]]},
  H2:  {atoms:[['H',-0.37,0,0],['H',0.37,0,0]], bonds:[[0,1]]},
  C3H8:{atoms:[['C',-1.28,0.18,0],['C',0,-0.18,0],['C',1.28,0.18,0],
               ['H',-1.92,0.95,0.30],['H',-1.92,0.02,-0.75],['H',-1.74,-0.45,0.66],
               ['H',0.05,-0.86,0.78],['H',0.05,-0.86,-0.78],
               ['H',1.92,0.95,-0.30],['H',1.92,0.02,0.75],['H',1.74,-0.45,-0.66]],
        bonds:[[0,1],[1,2],[0,3],[0,4],[0,5],[1,6],[1,7],[2,8],[2,9],[2,10]]},
  C2H5OH:{atoms:[['C',-1.30,0.05,0],['C',0.02,-0.22,0],['O',1.22,0.52,0],['H',1.96,0.10,0],
                 ['H',-1.95,0.86,0.35],['H',-1.95,0.02,-0.72],['H',-1.55,-0.48,0.68],
                 ['H',0.10,-0.92,0.76],['H',0.10,-0.92,-0.76]],
          bonds:[[0,1],[1,2],[2,3],[0,4],[0,5],[0,6],[1,7],[1,8]]}
};

function buildFuelMolecule(scale, op){
  const g = new THREE.Group();
  const G = GEOM[fuelKey], pts = [];
  G.atoms.forEach(([e,x,y,z])=>{
    const r = (e==='O' ? O_ATOM_R : EL[e].r) * scale;
    const a = atom(EL[e].col, r, {rough:0.3, op, lo: scale < 1});
    a.position.set(x*scale, y*scale, z*scale);
    g.add(a); pts.push(a.position);
  });
  G.bonds.forEach(([i,j])=>{
    const b = bond(0xa9b6c6, 0.10*scale);
    if(op !== undefined && op < 1){ b.material.opacity = op; }
    placeBond(b, pts[i], pts[j], 0.05*scale);
    g.add(b);
  });
  return g;
}

  clearGroup(micro1);

/* =====================================================================
   MICRO 2 — every bond breaks, then the products are built.  The cast is
   generated from the balanced equation, so nothing is created or lost.
===================================================================== */
const micro2 = new THREE.Group(); micro2.position.y=MICRO2_Y; scene.add(micro2);
let M2 = {};

const V = (x,y,z)=>new THREE.Vector3(x,y,z);
const CO2_LEN = 1.16, CO_LEN = 1.10, OH_LEN = 0.80;

function buildMicro2(){
  clearGroup(micro2);
  const inv = inventory();
  const rand = rng(20240942);

  /* --- the atoms.  One mesh per atom, for the whole equation. --- */
  const Cs = [], Hs = [], Os = [];
  for(let i=0;i<inv.C;i++) Cs.push(atom(EL.C.col, EL.C.r, {rough:0.4}));
  for(let i=0;i<inv.H;i++) Hs.push(atom(EL.H.col, EL.H.r, {rough:0.3}));
  for(let i=0;i<inv.O;i++) Os.push(atom(EL.O.col, O_ATOM_R, {rough:0.3}));
  [...Cs,...Hs,...Os].forEach(a=>micro2.add(a));

  /* --- where each atom starts: inside its reactant molecule --- */
  const start = new Map();
  const G = GEOM[fuelKey];
  let ci = 0, hi = 0, oi = 0;
  const rBonds = [];          // reactant bonds, by atom mesh pair
  for(let m=0;m<CO.fuel;m++){
    const base = V(-5.2, (m - (CO.fuel-1)/2) * 3.4, 0);
    const local = [];
    G.atoms.forEach(([e,x,y,z])=>{
      const mesh = e==='C' ? Cs[ci++] : e==='H' ? Hs[hi++] : Os[oi++];
      const p = V(base.x + x, base.y + y, base.z + z);
      start.set(mesh, p);
      local.push(mesh);
    });
    G.bonds.forEach(([i,j])=> rBonds.push([local[i], local[j]]));
  }
  /* the oxygen molecules */
  for(let m=0;m<CO.o2;m++){
    const base = V(5.0, (m - (CO.o2-1)/2) * 2.0, (m%2?0.6:-0.6));
    const a = Os[oi++], b = Os[oi++];
    start.set(a, V(base.x, base.y + 0.60, base.z));
    start.set(b, V(base.x, base.y - 0.60, base.z));
    rBonds.push([a,b]);
  }

  /* --- where each atom ends: inside its product molecule --- */
  const end = new Map();
  const pBonds = [];
  const carbonProducts = CO.co2 + CO.co;        // one per carbon
  let usedO = 0, usedH = 0;
  for(let k=0;k<carbonProducts;k++){
    const c = Cs[k];
    const base = V(-4.3, (k - (carbonProducts-1)/2) * 2.6, -0.3);
    end.set(c, base);
    if(CO.co2){                                  // CO₂: two oxygens, opposite
      const o1 = Os[usedO++], o2 = Os[usedO++];
      end.set(o1, V(base.x - CO2_LEN, base.y, base.z));
      end.set(o2, V(base.x + CO2_LEN, base.y, base.z));
      pBonds.push([c,o1],[c,o2]);
    } else {                                     // CO: only one to go round
      const o1 = Os[usedO++];
      end.set(o1, V(base.x + CO_LEN, base.y, base.z));
      pBonds.push([c,o1]);
    }
  }
  for(let k=0;k<CO.h2o;k++){
    const o = Os[usedO++], h1 = Hs[usedH++], h2 = Hs[usedH++];
    const base = V(4.4, (k - (CO.h2o-1)/2) * 2.2, 0.3);
    end.set(o, base);
    const ang = 104.5*Math.PI/360;
    end.set(h1, V(base.x + Math.sin(ang)*OH_LEN, base.y + Math.cos(ang)*OH_LEN, base.z));
    end.set(h2, V(base.x - Math.sin(ang)*OH_LEN, base.y + Math.cos(ang)*OH_LEN, base.z));
    pBonds.push([o,h1],[o,h2]);
  }

  /* --- the loose cloud in between --- */
  const mid = new Map();
  [...Cs,...Hs,...Os].forEach(a=>{
    const s = start.get(a), e = end.get(a);
    mid.set(a, V(lerp(s.x,e.x,0.5) + (rand()-0.5)*3.4,
                 lerp(s.y,e.y,0.5) + (rand()-0.5)*3.4,
                 (rand()-0.5)*2.2));
  });

  /* --- bond meshes --- */
  const rMesh = rBonds.map(()=>{ const b = bond(0xa9b6c6,0.10); micro2.add(b); return b; });
  const pMesh = pBonds.map(()=>{ const b = bond(0xa9b6c6,0.10); b.material.opacity=0; micro2.add(b); return b; });

  const lbl = {
    fuel: label(FU.formula,'#dfe7f2',48),
    o2:   label('O₂','#9db4ff',46),
    loose:label('loose atoms — nothing is bonded to anything','#ffe9a8',38),
    co2:  label(CO.co2?'CO₂':'CO', '#a9c4ff', 48),
    h2o:  label('H₂O','#a9c4ff',48),
    co_w: label('carbon monoxide — toxic, and you cannot see or smell it','#e89a8a',36)
  };
  Object.values(lbl).forEach(l=>micro2.add(l));

  M2 = {Cs,Hs,Os,start,mid,end,rBonds,pBonds,rMesh,pMesh,lbl,
        all:[...Cs,...Hs,...Os]};
}

const barIn = document.getElementById('barIn');
const barOut = document.getElementById('barOut');
const ledgerEl = document.getElementById('ledger');

function updateMicro2(t){
  const {all,start,mid,end,rBonds,pBonds,rMesh,pMesh,lbl} = M2;

  const breakOn = ramp(t, 33.6, 37.4);    // every bond goes
  const scatter = ramp(t, 36.0, 41.0);    // the atoms drift apart
  const gather  = ramp(t, 43.4, 48.4);    // and then find their partners
  const makeOn  = ramp(t, 46.8, 50.2);    // new bonds appear
  const apart   = ramp(t, 52.6, 60.0);    // products drift away

  /* every atom: reactant site → loose cloud → product site */
  all.forEach((a,i)=>{
    const s = start.get(a), m = mid.get(a), e = end.get(a);
    if(gather > 0){
      _v1.lerpVectors(m, e, gather);
    } else {
      _v1.lerpVectors(s, m, scatter);
    }
    if(scatter > 0 && gather < 1){
      _v1.x += Math.sin(t*2.2+i)*0.10*scatter*(1-gather);
      _v1.y += Math.cos(t*2.0+i*1.3)*0.10*scatter*(1-gather);
    }
    if(apart > 0){
      // carbon products go left, water goes right — they separate
      _v1.x += apart * (e.x < 0 ? -3.0 : 3.0);
      _v1.y += Math.sin(t*0.8+i)*0.08;
    }
    a.position.copy(_v1);
  });

  /* the reactant bonds fade as they break; the product bonds fade in */
  rBonds.forEach(([a,b],i)=>{
    const m = rMesh[i];
    m.material.opacity = 1 - breakOn;
    m.visible = breakOn < 0.99;
    if(m.visible) placeBond(m, a.position, b.position, 0.05);
  });
  pBonds.forEach(([a,b],i)=>{
    const m = pMesh[i];
    m.material.opacity = makeOn;
    m.visible = makeOn > 0.01;
    if(m.visible) placeBond(m, a.position, b.position, 0.05);
  });

  /* the energy ledger: in while breaking, out while making, out bigger */
  const showLedger = ramp(t,34.6,35.6) * (1 - ramp(t,55.0,56.2));
  ledgerEl.style.opacity = showLedger.toFixed(3);
  barIn.style.width  = (breakOn*62).toFixed(1) + '%';
  barOut.style.width = (makeOn*100).toFixed(1) + '%';

  /* labels */
  const L = lbl;
  L.fuel.material.opacity = ramp(t,30.6,31.6)*(1-ramp(t,34.4,35.2));
  L.fuel.position.set(-5.2, 2.6, 0);
  L.o2.material.opacity = ramp(t,30.6,31.6)*(1-ramp(t,34.4,35.2));
  L.o2.position.set(5.0, 2.6, 0);
  L.loose.material.opacity = ramp(t,40.6,41.6)*(1-ramp(t,44.0,44.8));
  L.loose.position.set(0, 4.2, 0);
  L.co2.material.opacity = ramp(t,50.4,51.4)*(1-ramp(t,59.0,60.0));
  L.co2.position.copy(M2.Cs.length ? M2.Cs[0].position : V(-4.3,0,0)).add(_v1.set(0,1.5,0));
  L.h2o.material.opacity = ramp(t,50.4,51.4)*(1-ramp(t,59.0,60.0));
  L.h2o.position.set(M2.Os.length ? M2.Os[M2.Os.length-1].position.x : 4.4,
                     (CO.h2o-1)*1.1 + 1.5, 0.3);
  L.co_w.material.opacity = (!FULL && hasCarbon())
    ? ramp(t,52.0,53.0)*(1-ramp(t,58.6,59.6)) : 0;
  L.co_w.position.set(-4.3, -((carbonCount()-1)*1.3) - 2.0, 0);
}
function carbonCount(){ return CO.co2 + CO.co; }

}

const TRANSITIONS = [7.0, 15.0, 30.0];
const FADE = 0.55;

function worldAt(t){
  if(t < 7.0)  return 'macro';
  if(t < 15.0) return 'micro1';
  if(t < 30.0) return 'macro';
  return 'micro2';
}

const CAM = {
  macro:[
    {t:0,    p:[-0.6,3.2,6.4],  l:[0.0,1.7,0]},
    {t:3.5,  p:[-2.3,1.9,2.1],  l:[-2.45,1.1,0]},
    {t:7.0,  p:[-2.5,1.6,1.3],  l:[-2.45,1.05,0]},
    {t:15.0, p:[-0.4,2.9,5.6],  l:[0.0,1.6,0]},
    {t:18.2, p:[-1.9,1.6,2.4],  l:[-2.4,1.2,0]},
    {t:21.6, p:[0.3,1.7,2.0],   l:[0.35,1.4,0]},
    {t:25.0, p:[2.7,1.6,2.0],   l:[2.75,1.1,0]},
    {t:27.8, p:[-1.7,2.7,2.8],  l:[-2.3,2.3,0]},
    {t:30.0, p:[-2.0,1.8,2.0],  l:[-2.45,1.3,0]}
  ],
  micro1:[
    {t:7.0,  p:[0,0.6,9.4],   l:[0,0,0]},
    {t:10.8, p:[2.4,1.4,8.2], l:[0,0,0]},
    {t:13.0, p:[1.6,2.2,11.6],l:[0,0,0]},
    {t:15.0, p:[0,5.0,24.0],  l:[0,0,0]}
  ],
  micro2:[
    {t:30.0, p:[0,1.0,17.0],    l:[0,0,0]},
    {t:33.6, p:[-2.4,0.8,12.0], l:[-2.6,0.2,0]},
    {t:37.2, p:[0,1.0,13.6],    l:[0,0.2,0]},
    {t:40.8, p:[0,1.4,14.6],    l:[0,0.4,0]},
    {t:44.0, p:[0,0.8,13.0],    l:[0,0.2,0]},
    {t:47.4, p:[-2.0,0.6,11.4], l:[-3.2,0.1,0]},
    {t:51.0, p:[0,1.2,14.0],    l:[0,0.3,0]},
    {t:55.2, p:[0,1.6,16.4],    l:[0,0.3,0]},
    {t:57.6, p:[-3.0,1.0,14.0], l:[-4.0,0.2,0]},
    {t:62.0, p:[0,1.4,19.0],    l:[0,0.2,0]}
  ]
};

const camPos=new THREE.Vector3(), camTgt=new THREE.Vector3();
function sampleCam(t){
  const w = worldAt(t), keys = CAM[w];
  let i=0; while(i<keys.length-2 && t>=keys[i+1].t) i++;
  const a=keys[i], b=keys[Math.min(i+1,keys.length-1)];
  const u = b.t===a.t?0:smooth((t-a.t)/(b.t-a.t));
  const off = w==='micro1'?MICRO1_Y : w==='micro2'?MICRO2_Y : 0;
  camPos.set(lerp(a.p[0],b.p[0],u), lerp(a.p[1],b.p[1],u)+off, lerp(a.p[2],b.p[2],u));
  camTgt.set(lerp(a.l[0],b.l[0],u), lerp(a.l[1],b.l[1],u)+off, lerp(a.l[2],b.l[2],u));
}

/* ---------- macro animation ---------- */
const LIGHT_A = 15.0, LIGHT_B = 15.9;
function updateMacro(t){
  const on = ramp(t, LIGHT_A, LIGHT_B);
  const flick = 0.88 + Math.sin(t*19)*0.08 + Math.sin(t*31)*0.05;

  /* a starved flame is taller, yellower and lazier */
  const oCol = FULL ? 0x6f9cff : 0xffaa38;
  const iCol = FULL ? 0x9fe8ff : 0xffd87a;
  flameOuter.material.color.setHex(oCol);
  flameInner.material.color.setHex(iCol);
  flameGlow.material.color.setHex(FULL ? 0x9fc4ff : 0xffc070);
  const h = FULL ? 1.0 : 1.5;
  flameOuter.scale.set(FULL?1:1.25, flick*h, FULL?1:1.25);
  flameInner.scale.set(1, flick*(FULL?1.05:0.6), 1);
  flameOuter.position.set(BURN_X, FLAME_BASE + 0.625*flick*h, 0);
  flameInner.position.set(BURN_X, FLAME_BASE + 0.26*flick*(FULL?1.05:0.6), 0);
  flameOuter.material.opacity = on*(FULL?0.55:0.75)*flick;
  flameInner.material.opacity = on*(FULL?0.82:0.55)*flick;
  flameGlow.position.set(BURN_X, FLAME_BASE+0.8, 0);
  flameGlow.scale.setScalar((FULL?1.5:2.1)*on*flick);
  flameGlow.material.opacity = on*0.45*flick;
  flameLight.position.set(BURN_X, FLAME_BASE+0.7, 0);
  flameLight.color.setHex(FULL ? 0x9fc4ff : 0xffb060);
  flameLight.intensity = on*(FULL?1.9:2.4)*flick;

  /* water condensing in the cold tube */
  drops.forEach(d=>{
    const a = ramp(t, d.at, d.at+1.1);
    d.m.material.opacity = a*0.85;
    d.m.visible = a > 0.02;
  });

  /* limewater: milky only if there really is CO₂ */
  const milky = makesCO2() ? ramp(t, 22.6, 28.6) : 0;
  limeMat.color.setRGB(lerp(0.89,0.97,milky), lerp(0.93,0.97,milky), lerp(0.97,0.96,milky));
    limeMat.color.convertSRGBToLinear();   // rewritten each frame, so convert here
  limeMat.opacity = lerp(0.34, 0.92, milky);

  updateSoot(t);
}

/* =====================================================================
   ORBIT-ISH DRAG
===================================================================== */
let yaw=0, pitch=0, dragging=false, lx=0, ly=0;
const el = renderer.domElement;
function down(x,y){dragging=true;lx=x;ly=y;el.style.cursor='grabbing';}
function move(x,y){
  if(!dragging) return;
  yaw   -= (x-lx)*0.005;
  pitch  = Math.max(-0.9, Math.min(0.9, pitch + (y-ly)*0.004));
  lx=x; ly=y;
}
function up(){dragging=false; el.style.cursor='grab';}
el.style.cursor='grab';
el.addEventListener('mousedown',e=>down(e.clientX,e.clientY));
addEventListener('mousemove',e=>move(e.clientX,e.clientY));
addEventListener('mouseup',up);
el.addEventListener('touchstart',e=>{down(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
el.addEventListener('touchmove',e=>{move(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
addEventListener('touchend',up);

const _sph = new THREE.Spherical();
function applyCamera(){
  const dir = camPos.clone().sub(camTgt);
  _sph.setFromVector3(dir);
  _sph.theta += yaw;
  _sph.phi = Math.max(0.12, Math.min(Math.PI-0.12, _sph.phi - pitch));
  dir.setFromSpherical(_sph);
  camera.position.copy(camTgt).add(dir);
  camera.lookAt(camTgt);
}

/* =====================================================================
   UI
===================================================================== */
const capEl  = document.getElementById('caption');
const fadeEl = document.getElementById('fade');
const playBtn= document.getElementById('play');
const scrub  = document.getElementById('scrub');
const clock  = document.getElementById('clock');
const keyEl  = document.getElementById('key');
const menuEl = document.getElementById('menu');
const gearEl = document.getElementById('gear');

let t = 0, playing = true, lastFrame = performance.now(), curSeg = -1;

playBtn.onclick = ()=>{ playing=!playing; playBtn.textContent = playing?'Pause':'Play'; };
document.getElementById('restart').onclick = ()=>{ t=0; curSeg=-1; playing=true; playBtn.textContent='Pause'; };
scrub.oninput = ()=>{ t = parseFloat(scrub.value); curSeg=-1; };
addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault(); playBtn.click(); }
  if(e.code==='ArrowRight'){ t = Math.min(TOTAL, t+2); curSeg=-1; }
  if(e.code==='ArrowLeft'){  t = Math.max(0, t-2);     curSeg=-1; }
  if(e.code==='Escape') setMenu(false);
});

function captionFor(time){
  let i=0; for(let k=0;k<SEGS.length;k++) if(time>=SEGS[k].t) i=k;
  return i;
}
function fadeAmount(time){
  let f=0;
  for(const T of TRANSITIONS) f = Math.max(f, 1 - Math.min(1, Math.abs(time-T)/FADE));
  return f;
}

const hexCss = k => '#'+k.toString(16).padStart(6,'0');

function buildLegend(){
  const rows = [];
  if(hasCarbon()) rows.push({sym:'C', name:'carbon', col:EL.C.col});
  rows.push({sym:'H', name:'hydrogen', col:EL.H.col});
  rows.push({sym:'O', name:'oxygen', col:EL.O.col});
  keyEl.innerHTML = rows.map(r=>
    `<div><span class="dot" style="background:${hexCss(r.col)}"></span><b>${r.sym}</b> ${r.name}</div>`
  ).join('');
}

function buildMenu(){
  document.getElementById('fuelOpts').innerHTML = Object.keys(FUELS).map(k=>{
    const off = forbidden(k, airKey);
    return `<button class="opt ${k===fuelKey?'on':''} ${off?'off':''}" data-group="fuel" data-key="${k}"` +
           (off?` title="${FORBID_REASON}" disabled`:``) +
           `><span class="f">${FUELS[k].formula}</span> · ${FUELS[k].name}</button>`;
  }).join('');
  document.getElementById('airOpts').innerHTML =
    [['full','plenty of air'],['low','not enough air']].map(([v,lab])=>{
      const off = forbidden(fuelKey, v);
      return `<button class="opt ${v===airKey?'on':''} ${off?'off':''}" data-group="air" data-key="${v}"` +
             (off?` title="${FORBID_REASON}" disabled`:``) + `>${lab}</button>`;
    }).join('');

  const inv = inventory();
  document.getElementById('menuEq').innerHTML =
    `${equation()}<span>` +
    `In: ${inv.C?inv.C+' C, ':''}${inv.H} H, ${inv.O} O. Out: the same atoms, in different molecules — ` +
    `which is what micro 2 is built from.<br>` +
    (FULL
      ? `Every bond breaks (energy in), every new bond forms (energy out), and out wins. That is the flame.`
      : `<b class="warn">Not enough oxygen.</b> The carbon can only reach CO, not CO₂ — less energy released, ` +
        `soot on the glass, and carbon monoxide coming off.`) +
    (FU.incomplete === null ? `<br>Hydrogen is only offered with plenty of air: ${FORBID_REASON}.` : ``) +
    `</span>`;

  menuEl.querySelectorAll('.opt:not(.off)').forEach(b=>{
    b.onclick = ()=>{
      if(b.dataset.group==='fuel') fuelKey = b.dataset.key; else airKey = b.dataset.key;
      if(forbidden(fuelKey, airKey)) airKey = 'full';
      build();
      playing = true; playBtn.textContent = 'Pause';
    };
  });
}

function setMenu(open){
  menuEl.classList.toggle('open', open);
  gearEl.classList.toggle('open', open);
  if(open) buildMenu();
}
gearEl.onclick = ()=> setMenu(!menuEl.classList.contains('open'));

/* ---------- rebuild everything that depends on the choices ---------- */
function build(){
  derive();
  buildBurner();
  buildDrops();
  buildSoot();
  buildMicro1();
  buildMicro2();
  buildCaptions();
  buildLegend();
  linearise(scene);      // authored colours are sRGB; the renderer wants linear

  document.title = `Burning ${FU.name}`;
  document.getElementById('h1').textContent =
    FULL ? `Burning ${FU.name}` : `Burning ${FU.name} — starved of air`;
  document.getElementById('subtitle').textContent = equation();
  scrub.style.setProperty('--hl', FULL ? '#6f9cff' : '#ffaa38');

  if(menuEl.classList.contains('open')) buildMenu();
  history.replaceState(null,'',`?fuel=${fuelKey}&air=${airKey}`);

  t = 0; curSeg = -1;
}
build();

/* =====================================================================
   LOOP
===================================================================== */
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min((now-lastFrame)/1000, 1/24);
  lastFrame = now;

  if(playing){
    t += dt;
    if(t >= TOTAL){ t = TOTAL; playing=false; playBtn.textContent='Play'; }
  }

  updateMacro(t);
  updateMicro1(t);
  updateMicro2(t);
  sampleCam(t);
  applyCamera();

  const f = fadeAmount(t);
  fadeEl.style.opacity = f;
  const seg = captionFor(t);
  if(seg !== curSeg){ curSeg = seg; capEl.textContent = SEGS[seg].c; }
  capEl.style.opacity = 1 - f;
  scrub.value = t;
  scrub.style.setProperty('--p', (t/TOTAL*100)+'%');
  clock.textContent = t.toFixed(1)+' / '+TOTAL.toFixed(1)+'s';

  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
