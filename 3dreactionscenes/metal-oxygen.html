<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metal + oxygen</title>
<style>
  :root{
    --ink:#eef2f7;
    --dim:#93a2b6;
    --panel:rgba(10,14,21,.72);
    --line:rgba(147,162,182,.22);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:#080b11;color:var(--ink);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden;}
  #stage{position:fixed;inset:0;}
  canvas{display:block;}

  #fade{position:fixed;inset:0;background:#080b11;pointer-events:none;opacity:0;}
  /* the glare of a burning metal, over the top of everything */
  #glare{position:fixed;inset:0;background:#fff;pointer-events:none;opacity:0;}

  .title{position:fixed;top:22px;left:26px;max-width:min(46ch,60vw);pointer-events:none;}
  .title h1{
    margin:0;
    font-family:"Iowan Old Style","Charter","Palatino Linotype",Georgia,serif;
    font-weight:600;font-size:23px;letter-spacing:.2px;line-height:1.25;
  }
  .title p{margin:6px 0 0;font-size:13px;line-height:1.5;color:var(--dim);}
  .eq{font-variant-numeric:tabular-nums;}
  .title a{pointer-events:auto;color:var(--dim);text-decoration:none;font-size:12px;
    border-bottom:1px solid rgba(147,162,182,.3);}
  .title a:hover{color:var(--ink);}

  #caption{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:112px;width:min(670px,92vw);text-align:center;pointer-events:none;
    font-family:"Iowan Old Style","Charter","Palatino Linotype",Georgia,serif;
    font-size:19px;line-height:1.45;
    text-shadow:0 2px 18px rgba(0,0,0,.85);
    transition:opacity .35s ease;
  }

  #bar{
    position:fixed;left:50%;transform:translateX(-50%);bottom:20px;
    width:min(720px,94vw);
    background:var(--panel);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;display:flex;align-items:center;gap:12px;
  }
  button{
    font:inherit;font-size:13px;color:var(--ink);
    background:rgba(255,255,255,.06);border:1px solid var(--line);
    border-radius:9px;padding:7px 13px;cursor:pointer;
    transition:background .15s ease,border-color .15s ease;
  }
  button:hover{background:rgba(255,255,255,.12);}
  button:focus-visible{outline:2px solid #7fb0ff;outline-offset:2px;}
  #play{min-width:74px;}
  #gear{padding:7px 11px;font-size:15px;line-height:1;}
  #gear.open{background:rgba(127,176,255,.2);border-color:rgba(127,176,255,.5);}
  #scrub{
    flex:1;appearance:none;height:4px;border-radius:4px;
    background:linear-gradient(90deg,var(--hl,#c3cbd6) 0%,var(--hl,#c3cbd6) var(--p,0%),rgba(255,255,255,.14) var(--p,0%));
    cursor:pointer;
  }
  #scrub::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;
    background:var(--ink);border:none;box-shadow:0 0 0 3px rgba(8,11,17,.6);}
  #scrub::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ink);border:none;}
  #clock{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:74px;text-align:right;}

  #key{
    position:fixed;right:24px;top:22px;
    background:var(--panel);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:12px;padding:11px 13px;
    font-size:12.5px;line-height:1.9;color:var(--dim);
  }
  #key div{display:flex;align-items:center;gap:8px;}
  .dot{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:inset -2px -2px 3px rgba(0,0,0,.45);}
  #key b{color:var(--ink);font-weight:600;}
  #hint{position:fixed;bottom:90px;right:24px;font-size:11.5px;color:var(--dim);opacity:.75;}

  /* ---- species menu ---- */
  #menu{
    position:fixed;left:50%;transform:translateX(-50%);bottom:86px;
    width:min(700px,94vw);
    background:var(--panel);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;display:none;gap:18px;
  }
  #menu.open{display:flex;flex-wrap:wrap;}
  #menu fieldset{border:none;margin:0;padding:0;flex:1;min-width:230px;}
  #menu legend{
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:#64748b;padding:0 0 8px;
  }
  .opts{display:flex;flex-wrap:wrap;gap:6px;}
  .opt{
    font:inherit;font-size:12.5px;padding:6px 11px;border-radius:8px;
    background:rgba(255,255,255,.05);border:1px solid var(--line);
    color:var(--dim);cursor:pointer;
  }
  .opt:hover{background:rgba(255,255,255,.1);color:var(--ink);}
  .opt.on{background:rgba(127,176,255,.18);border-color:rgba(127,176,255,.5);color:#dce9ff;}
  .opt .f{font-family:"Iowan Old Style","Charter",Georgia,serif;font-variant-numeric:tabular-nums;}
  .swatch{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;
    vertical-align:-1px;border:1px solid rgba(255,255,255,.3);}
  #menuEq{
    flex-basis:100%;border-top:1px solid var(--line);padding-top:12px;margin:0;
    font-family:"Iowan Old Style","Charter",Georgia,serif;font-size:16px;
    color:var(--ink);font-variant-numeric:tabular-nums;
  }
  #menuEq span{color:#64748b;font-size:12px;display:block;margin-top:5px;
    font-family:ui-sans-serif,system-ui,sans-serif;line-height:1.5;}
  #menuEq i{color:#a8c9ff;font-style:normal;}

  @media (max-width:640px){
    .title h1{font-size:18px;} .title p{display:none;}
    #key{right:14px;top:14px;padding:8px 10px;font-size:11px;line-height:1.7;}
    #caption{font-size:16px;bottom:100px;}
    #hint{display:none;}
    #clock{display:none;}
    #menu{bottom:82px;padding:13px 14px;}
  }
  @media (prefers-reduced-motion:reduce){#caption{transition:none;} #glare{display:none;}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="fade"></div>
<div id="glare"></div>

<div class="title">
  <h1 id="h1">Burning magnesium</h1>
  <p class="eq" id="subtitle">2Mg + O₂ → 2MgO</p>
  <p><a href="index.html">← All fourteen reactions</a></p>
</div>

<div id="key"></div>

<div id="caption"></div>
<div id="hint">Drag to look around</div>

<div id="menu">
  <fieldset>
    <legend>Metal — the flame colour is its own</legend>
    <div class="opts" id="metalOpts"></div>
  </fieldset>
  <p id="menuEq"></p>
</div>

<div id="bar">
  <button id="play">Pause</button>
  <button id="restart">Restart</button>
  <input id="scrub" type="range" min="0" max="62" step="0.01" value="0" aria-label="Timeline">
  <span id="clock">0.0 / 62.0s</span>
  <button id="gear" title="Change the metal" aria-label="Change the metal">⚙</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------------------------------------------------------------------------
   SCENE 10 — metal + oxygen,  2M + O₂ → 2MO

   This is where ionic bonding gets built from nothing. Two neutral things go
   in — a metal and a gas — and an ionic compound comes out, so every step of
   how that happens has to be visible:

     the O=O double bond breaks          (that is what the heat is for)
     each oxygen atom is two short       and each metal atom has two spare
     two electrons cross, per pair       the metal shrinks, the oxygen grows
     now charged, they pull              and not just in pairs — into a lattice

   Micro world 1 is the oxygen molecule, because the double bond is the thing
   standing in the way, and it is worth a good look before it breaks.

   Acts:
     0  – 7   macro: the metal, the Bunsen
     7  – 15  micro 1: O₂ and its double bond
    15  – 30  macro: hold it in the flame — and look away
    30  – end micro 2: electrons cross, and a lattice builds

   Everything is a closed-form function of t — no particle sim.
--------------------------------------------------------------------------- */

/* ======================= the species tables ======================= */

const EL = {               // the same palette as every other scene here
  O:  {name:'oxygen',   col:0x2f47b8, r:0.50}     // r is the OXIDE ION
};
const O_ATOM_R = 0.42;     // a neutral oxygen atom is smaller than O²⁻
const E_COL = 0xffe070;

/* Every metal here is M²⁺, so the formula is always MO and every atom hands
   over exactly two electrons.  `flame` null means it does not burn with a
   flame at all — copper just oxidises. */
const METALS = {
  Mg: {sym:'Mg', name:'magnesium', full:'magnesium', ion:'Mg²⁺',
       col:0xc3cbd6, r:0.62, lblCol:'#dde6f0', ionR:0.50,
       oxide:'MgO', oxideName:'magnesium oxide',
       form:'ribbon', flame:0xffffff, flameWord:'a blinding white', power:1.00,
       ash:0xf2f4f6, ashWord:'white', glare:0.72},
  Ca: {sym:'Ca', name:'calcium', full:'calcium', ion:'Ca²⁺',
       col:0xd6d9c2, r:0.72, lblCol:'#e6e8d8', ionR:0.58,
       oxide:'CaO', oxideName:'calcium oxide',
       form:'piece', flame:0xe85a34, flameWord:'brick red', power:0.80,
       ash:0xf2f2ee, ashWord:'white', glare:0.34},
  Zn: {sym:'Zn', name:'zinc', full:'zinc', ion:'Zn²⁺',
       col:0x9fb0c2, r:0.64, lblCol:'#cfe0f0', ionR:0.52,
       oxide:'ZnO', oxideName:'zinc oxide',
       form:'strip', flame:0x7fe0c8, flameWord:'blue-green', power:0.62,
       ash:0xf4ead0, ashWord:'pale yellow while hot, white when cold', glare:0.26},
  Cu: {sym:'Cu', name:'copper', full:'copper(II)', ion:'Cu²⁺',
       col:0xc8763c, r:0.66, lblCol:'#f0b07a', ionR:0.54,
       oxide:'CuO', oxideName:'copper(II) oxide',
       form:'foil', flame:null, flameWord:'no flame at all', power:0.0,
       ash:0x14161a, ashWord:'black', glare:0.0}
};

const qs = new URLSearchParams(location.search);
let metalKey = METALS[qs.get('metal')] ? qs.get('metal') : 'Mg';
let MT, FLAMES;
function derive(){ MT = METALS[metalKey]; FLAMES = MT.flame !== null; }

const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
const equation = () => `2${MT.sym} + O₂ → 2${MT.oxide}`;
const halves   = () => `${MT.sym} → ${MT.ion} + 2e⁻     ·     O + 2e⁻ → O²⁻`;

const MICRO1_Y =  400;   // the oxygen molecule
const MICRO2_Y = -400;   // the bonding

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080b11);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.05, 2000);

scene.add(new THREE.HemisphereLight(0x9fb4d0, 0x0a0d13, 0.6));
const keyL = new THREE.DirectionalLight(0xffffff, 0.95); keyL.position.set(6,11,8); scene.add(keyL);
const fill = new THREE.DirectionalLight(0x9ec3ff, 0.4); fill.position.set(-8,4,-6); scene.add(fill);
const rim  = new THREE.DirectionalLight(0xffd9b0, 0.35); rim.position.set(0,3,-10); scene.add(rim);
const bunsenLight = new THREE.PointLight(0x8fb4ff, 0, 7); scene.add(bunsenLight);
const burnLight   = new THREE.PointLight(0xffffff, 0, 16); scene.add(burnLight);

(function environment(){
  const env = new THREE.Scene();
  const box = new THREE.BoxGeometry(1,1,1);
  env.add(new THREE.Mesh(new THREE.BoxGeometry(24,14,24),
    new THREE.MeshBasicMaterial({color:0x1d2634, side:THREE.BackSide})));
  const panel=(hex,gain,x,y,z,sx,sy,sz)=>{
    const m=new THREE.Mesh(box,new THREE.MeshBasicMaterial({color:hex}));
    m.material.color.multiplyScalar(gain);
    m.position.set(x,y,z); m.scale.set(sx,sy,sz); env.add(m);
  };
  panel(0xffffff,3.2,  0, 6.6,  0, 11,0.1,11);
  panel(0xbcd6ff,1.3, -9, 1.0,  0, 0.1,9,16);
  panel(0xffd7b0,0.9,  9, 1.0,  2, 0.1,9,16);
  panel(0x8fb0e0,0.5,  0, 0.0,-10, 18,9,0.1);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(env, 0.04).texture;
  pmrem.dispose();
})();

/* ---------- shared helpers ---------- */
const SPH = new THREE.SphereGeometry(1,32,24);
const SPH_LO = new THREE.SphereGeometry(1,16,12);
const CYL = new THREE.CylinderGeometry(1,1,1,20,1,false);

function atom(color, radius, opts={}){
  const mat = new THREE.MeshStandardMaterial({
    color, roughness: opts.rough ?? 0.35, metalness: opts.metal ?? 0.25,
    emissive: new THREE.Color(color).multiplyScalar(opts.glow ?? 0.06)
  });
  if(opts.op !== undefined && opts.op < 1){ mat.transparent = true; mat.opacity = opts.op; }
  const m = new THREE.Mesh(opts.lo?SPH_LO:SPH, mat);
  m.scale.setScalar(radius);
  return m;
}

function electron(){
  const g = new THREE.Group();
  const core = new THREE.Mesh(SPH_LO, new THREE.MeshStandardMaterial({
    color:0xfff6d0, emissive:E_COL, roughness:0.3, metalness:0,
    transparent:true, opacity:1
  }));
  core.scale.setScalar(0.16);
  const halo = new THREE.Mesh(SPH_LO, new THREE.MeshBasicMaterial({
    color:E_COL, transparent:true, opacity:0.20,
    blending:THREE.AdditiveBlending, depthWrite:false
  }));
  halo.scale.setScalar(0.38);
  g.add(core, halo);
  g.userData.core = core; g.userData.halo = halo;
  return g;
}
function electronFade(e, a){
  e.userData.core.material.opacity = a;
  e.userData.halo.material.opacity = 0.20*a;
  e.visible = a > 0.02;
}

function bond(color=0xa9b6c6, radius=0.13){
  const m = new THREE.Mesh(CYL, new THREE.MeshStandardMaterial({
    color, roughness:0.5, metalness:0.1, transparent:true, opacity:1
  }));
  m.userData.radius = radius;
  return m;
}
const _v1=new THREE.Vector3(), _up=new THREE.Vector3(0,1,0);
function placeBond(mesh, a, b, shrink=0){
  const dir = new THREE.Vector3().subVectors(b,a);
  const len = Math.max(dir.length()-shrink*2, 0.001);
  mesh.position.copy(a).addScaledVector(dir,0.5);
  mesh.scale.set(mesh.userData.radius, len, mesh.userData.radius);
  mesh.quaternion.setFromUnitVectors(_up, dir.normalize());
}

function label(text, color='#eef2f7', size=54){
  const pad=16, c=document.createElement('canvas'), ctx=c.getContext('2d');
  const font = `600 ${size}px "Iowan Old Style", Charter, Georgia, serif`;
  ctx.font=font; const w=Math.ceil(ctx.measureText(text).width)+pad*2;
  c.width=w; c.height=size+pad*2;
  ctx.font=font; ctx.textBaseline='middle'; ctx.textAlign='center';
  ctx.shadowColor='rgba(0,0,0,.9)'; ctx.shadowBlur=14;
  ctx.fillStyle=color; ctx.fillText(text, c.width/2, c.height/2);
  const tex = new THREE.CanvasTexture(c); tex.anisotropy=4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false, opacity:0}));
  sp.renderOrder = 10;
  sp.scale.set(c.width/c.height*0.62, 0.62, 1);
  return sp;
}

const GLOW_TEX = (function(){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,   'rgba(255,255,255,1)');
  g.addColorStop(0.25,'rgba(255,250,240,.75)');
  g.addColorStop(0.6, 'rgba(240,230,220,.26)');
  g.addColorStop(1,   'rgba(220,210,200,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
})();

function lerp(a,b,t){ return a+(b-a)*t; }
function clamp01(x){ return Math.max(0,Math.min(1,x)); }
function smooth(x){ x=clamp01(x); return x*x*(3-2*x); }
function ramp(t,a,b){ return smooth((t-a)/(b-a)); }

function clearGroup(g){
  for(let i=g.children.length-1;i>=0;i--){
    const c = g.children[i];
    g.remove(c);
    c.traverse(o=>{
      if(o.material){
        if(o.material.map && o.material.map !== GLOW_TEX) o.material.map.dispose();
        o.material.dispose();
      }
    });
  }
}
function rng(seed){
  let s = seed>>>0;
  return ()=>{ s = (s*1664525 + 1013904223)>>>0; return s/4294967296; };
}

/* =====================================================================
   MACRO WORLD — bench, Bunsen, tongs, and a dish to catch the ash
===================================================================== */
const macro = new THREE.Group(); scene.add(macro);

const bench = new THREE.Mesh(
  new THREE.CylinderGeometry(9,9,0.35,64),
  new THREE.MeshStandardMaterial({color:0x11151d, roughness:0.95, metalness:0})
);
bench.position.y=-0.175; macro.add(bench);

const steel = new THREE.MeshStandardMaterial({color:0xb9c3cf, metalness:0.9, roughness:0.24});

/* the Bunsen */
const BUNSEN_X = 0.0;
const bBase = new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.38,0.1,28),
  new THREE.MeshStandardMaterial({color:0x252c38, metalness:0.6, roughness:0.45}));
bBase.position.set(BUNSEN_X,0.05,0); macro.add(bBase);
const bBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.085,0.10,1.00,20), steel);
bBarrel.position.set(BUNSEN_X,0.58,0); macro.add(bBarrel);
const bCollar = new THREE.Mesh(new THREE.CylinderGeometry(0.115,0.115,0.2,20), steel);
bCollar.position.set(BUNSEN_X,0.24,0); macro.add(bCollar);

const flameOuter = new THREE.Mesh(new THREE.ConeGeometry(0.17,1.25,20,1,true),
  new THREE.MeshBasicMaterial({color:0x6f9cff, transparent:true, opacity:0,
    blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide}));
flameOuter.position.set(BUNSEN_X,1.69,0); macro.add(flameOuter);
const flameInner = new THREE.Mesh(new THREE.ConeGeometry(0.075,0.55,16,1,true),
  new THREE.MeshBasicMaterial({color:0x9fe8ff, transparent:true, opacity:0,
    blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide}));
flameInner.position.set(BUNSEN_X,1.355,0); macro.add(flameInner);

/* the heatproof dish the ash drops into */
const DISH_X = 1.45;
const dish = new THREE.Mesh(new THREE.CylinderGeometry(0.80,0.62,0.26,36,1,true),
  new THREE.MeshStandardMaterial({color:0xcfcabd, roughness:0.9, metalness:0.05,
    side:THREE.DoubleSide}));
dish.position.set(DISH_X,0.13,0); macro.add(dish);
const dishFloor = new THREE.Mesh(new THREE.CircleGeometry(0.64,36),
  new THREE.MeshStandardMaterial({color:0xb9b4a6, roughness:0.92, metalness:0.04}));
dishFloor.rotation.x = -Math.PI/2; dishFloor.position.set(DISH_X,0.015,0); macro.add(dishFloor);

/* the tongs */
const tongs = new THREE.Group(); macro.add(tongs);
const armGeo = new THREE.BoxGeometry(0.055,1.9,0.13);
const armL = new THREE.Mesh(armGeo, steel), armR = new THREE.Mesh(armGeo, steel);
const ARM_TILT = 0.075;
[[armL,-1],[armR,1]].forEach(([a,s])=>{
  a.position.set(s*0.085, 0.95, 0);
  a.rotation.z = -s*ARM_TILT;
  tongs.add(a);
});
const yoke = new THREE.Mesh(new THREE.TorusGeometry(0.14,0.038,8,20,Math.PI), steel);
yoke.position.y = 1.9; tongs.add(yoke);

/* the piece of metal, and the light it burns with */
let piece = null, burnGlow = null;
const PIECE_H = 0.95;
function buildPiece(){
  if(piece){ tongs.remove(piece); piece.geometry.dispose(); piece.material.dispose(); }
  piece = new THREE.Mesh(new THREE.BoxGeometry(0.05,PIECE_H,0.26),
    new THREE.MeshStandardMaterial({color:MT.col, metalness:0.82, roughness:0.3}));
  /* a child of the tongs, hanging from the grip — the jaws close at the group's
     own origin, so anything held has to live in tongs space, not world space */
  tongs.add(piece);
  if(burnGlow){ macro.remove(burnGlow); burnGlow.material.dispose(); }
  burnGlow = new THREE.Sprite(new THREE.SpriteMaterial({
    map:GLOW_TEX, color: MT.flame || 0xff7a30, transparent:true, opacity:0,
    blending:THREE.AdditiveBlending, depthWrite:false, depthTest:false}));
  burnGlow.scale.setScalar(2.0);
  macro.add(burnGlow);
}

const TONGS_REST = new THREE.Vector3(-2.1, 2.35, 0.35);
const TONGS_FLAME = new THREE.Vector3(BUNSEN_X, 2.05, 0);
const IGNITE = 19.2, BURN_END = 25.4;

/* --- flakes of oxide, falling into the dish --- */
const ashGrp = new THREE.Group(); macro.add(ashGrp);
const ashGeo = new THREE.IcosahedronGeometry(0.042,0);
let ash = [];
function buildAsh(){
  clearGroup(ashGrp);
  ash = [];
  const rand = rng(20240910);
  const n = Math.round(18 + 26*Math.max(MT.power,0.4));
  for(let i=0;i<n;i++){
    const m = new THREE.Mesh(ashGeo, new THREE.MeshStandardMaterial({
      color:new THREE.Color(MT.ash).offsetHSL(0,0,(rand()-0.5)*0.06),
      roughness:0.95, metalness:0.03
    }));
    m.scale.setScalar(0.6+rand()*0.9);
    const a = rand()*Math.PI*2, r = Math.sqrt(rand())*0.5;
    ash.push({m, birth: IGNITE+0.6 + rand()*(BURN_END-IGNITE-1.0),
              y0: 1.9 + rand()*0.6,
              xr: DISH_X + Math.cos(a)*r, zr: Math.sin(a)*r,
              drift:(rand()-0.5)*0.4, spin:rand()*6.283, fall:0.8+rand()*0.7});
    ashGrp.add(m);
  }
}
function updateAsh(t){
  for(const f of ash){
    const age = t - f.birth;
    if(age < 0){ f.m.visible = false; continue; }
    f.m.visible = true;
    const u = smooth(Math.min(1, age/f.fall));
    f.m.position.set(
      lerp(TONGS_FLAME.x + f.drift, f.xr, u),
      lerp(f.y0, 0.07, u*u),
      lerp(0, f.zr, u)
    );
    f.m.rotation.set(f.spin + age*1.1, f.spin*1.7 + age*0.8, f.spin);
  }
}

/* =====================================================================
   MICRO 1 — the oxygen molecule, and the double bond in the way
===================================================================== */
const micro1 = new THREE.Group(); micro1.position.y=MICRO1_Y; scene.add(micro1);
let M1 = {};

function buildMicro1(){
  clearGroup(micro1);
  const SC = 2.1, d = O_ATOM_R*SC*1.05;
  const a1 = atom(EL.O.col, O_ATOM_R*SC, {rough:0.3, metal:0.1});
  const a2 = atom(EL.O.col, O_ATOM_R*SC, {rough:0.3, metal:0.1});
  a1.position.set(-d,0,0); a2.position.set(d,0,0);
  micro1.add(a1,a2);
  /* two lines, because it is a double bond */
  const b1 = bond(0xa9b6c6, 0.105), b2 = bond(0xa9b6c6, 0.105);
  placeBond(b1, new THREE.Vector3(-d,0, 0.17), new THREE.Vector3(d,0, 0.17), 0.1);
  placeBond(b2, new THREE.Vector3(-d,0,-0.17), new THREE.Vector3(d,0,-0.17), 0.1);
  micro1.add(b1,b2);

  /* two shared pairs — four electrons in between */
  const shared = [];
  for(let i=0;i<4;i++){
    const e = electron(); electronFade(e, 0.92);
    e.userData = {ph: i*Math.PI/2, tilt: i<2 ? 1 : -1};
    micro1.add(e); shared.push(e);
  }

  const lblMol = label('O₂','#9db4ff',58);  lblMol.position.set(0, d+1.7, 0);
  const lblDb  = label('a double bond — two shared pairs','#ffe9a8',40);
  lblDb.position.set(0, -d-1.5, 0);
  const lblStrong = label('strong, and it has to break first','#dfe7f2',38);
  lblStrong.position.set(0, -d-2.3, 0);
  micro1.add(lblMol,lblDb,lblStrong);

  M1 = {a1,a2,b1,b2,shared,lblMol,lblDb,lblStrong,d};
}

function updateMicro1(t){
  const {shared, lblMol, lblDb, lblStrong} = M1;
  const u = t - 7.0;
  micro1.rotation.y = Math.sin(u*0.26)*0.5;
  micro1.rotation.x = Math.sin(u*0.19)*0.14;
  shared.forEach(e=>{
    const a = u*1.4 + e.userData.ph;
    e.position.set(Math.sin(a)*0.26, Math.cos(a)*0.55, e.userData.tilt*0.30 + Math.sin(a)*0.22);
  });
  const off = 1-ramp(t,12.8,13.8);
  lblMol.material.opacity    = ramp(t,8.0,9.0)*off;
  lblDb.material.opacity     = ramp(t,9.4,10.4)*off;
  lblStrong.material.opacity = ramp(t,10.8,11.8)*off;
}

/* =====================================================================
   MICRO 2 — the double bond breaks, four electrons cross, and a lattice
   assembles out of the pairs that result
===================================================================== */
const micro2 = new THREE.Group(); micro2.position.y=MICRO2_Y; scene.add(micro2);
let M2 = {};

const V = (x,y,z)=>new THREE.Vector3(x,y,z);
const P = {
  oA0: V(-0.62, 0.00, 0.00),   // the O₂ molecule, before it breaks
  oB0: V( 0.62, 0.00, 0.00),
  oA1: V(-2.20, 0.55, 0.10),   // and after
  oB1: V( 2.20,-0.55,-0.10),
  mA0: V(-6.40, 2.90, 0.90),   // the two metal atoms come in
  mB0: V( 6.60,-3.00, 0.70),
  mA1: V(-3.90, 1.10, 0.20),
  mB1: V( 3.90,-1.10,-0.20),
  pairA: V(-2.95, 0.80, 0.15), // where each ion pair settles
  pairB: V( 2.95,-0.80,-0.15)
};

function buildMicro2(){
  clearGroup(micro2);

  const oA = atom(EL.O.col, O_ATOM_R, {rough:0.3, metal:0.1});
  const oB = atom(EL.O.col, O_ATOM_R, {rough:0.3, metal:0.1});
  const db1 = bond(0xa9b6c6, 0.10), db2 = bond(0xa9b6c6, 0.10);
  const mA = atom(MT.col, MT.r, {rough:0.3, metal:0.62});
  const mB = atom(MT.col, MT.r, {rough:0.3, metal:0.62});
  const linkA = bond(0x9aa8bb, 0.11), linkB = bond(0x9aa8bb, 0.11);
  linkA.material.opacity = 0; linkB.material.opacity = 0;
  micro2.add(oA,oB,db1,db2,mA,mB,linkA,linkB);

  /* four electrons — two from each metal atom */
  const es = [];
  for(let i=0;i<4;i++){ const e = electron(); electronFade(e,0); micro2.add(e); es.push(e); }

  /* the lattice that assembles at the end: pairs that converge on a grid */
  const latt = new THREE.Group(); micro2.add(latt);
  const cells = [];
  const rand = rng(20240920);
  for(let ix=-1;ix<=1;ix++) for(let iy=-1;iy<=1;iy++) for(let iz=-1;iz<=0;iz++){
    if(ix===0 && iy===0 && iz===0) continue;
    const u = new THREE.Group();
    const m = atom(MT.col, MT.ionR, {rough:0.3, metal:0.5, lo:true, op:0.001});
    const o = atom(EL.O.col, EL.O.r, {rough:0.28, metal:0.1, lo:true, op:0.001});
    m.position.x = -0.78; o.position.x = 0.78;
    const b = bond(0x9aa8bb, 0.10); b.material.opacity = 0;
    placeBond(b, m.position, o.position, 0.05);
    u.add(m,o,b);
    const home = V(ix*2.6, iy*2.4, iz*2.5 - 1.4);
    u.userData = {home, from:V(home.x*2.6+(rand()-0.5)*4, home.y*2.6+(rand()-0.5)*4, home.z*2.0-5),
                  ph:rand()*6.283, m, o, b};
    latt.add(u); cells.push(u);
  }

  const lbl = {
    o2:   label('O₂','#9db4ff',48),
    oat:  label('O','#9db4ff',46),
    mat:  label(MT.sym, MT.lblCol, 46),
    mion: label(MT.ion, MT.lblCol, 46),
    oion: label('O²⁻','#9db4ff',46),
    e:    label('2e⁻','#ffe9a8',44),
    pull: label('opposite charges — they pull','#ffd9a0',40),
    latt: label(`${MT.oxideName}, ${MT.oxide}`,'#dfe7f2',42)
  };
  Object.values(lbl).forEach(l=>micro2.add(l));

  M2 = {oA,oB,db1,db2,mA,mB,linkA,linkB,es,latt,cells,lbl};
}

const _pa=new THREE.Vector3(), _pb=new THREE.Vector3(), _gw=new THREE.Vector3();

function updateMicro2(t){
  const {oA,oB,db1,db2,mA,mB,linkA,linkB,es,latt,cells,lbl} = M2;

  const snap   = ramp(t, 33.0, 36.2);   // the O=O bond breaks
  const close  = ramp(t, 30.0, 39.0);   // the metals come in
  const cross  = [ramp(t,42.5,45.6), ramp(t,42.9,46.0), ramp(t,43.3,46.4), ramp(t,43.7,46.8)];
  const charged= ramp(t, 45.4, 48.2);   // ion sizes change
  const pull   = ramp(t, 48.6, 52.0);   // and they snap together
  const build  = ramp(t, 52.8, 58.4);   // the lattice assembles

  /* the two oxygens: a molecule, then two atoms, then two oxide ions */
  _pa.lerpVectors(P.oA0, P.oA1, snap);
  _pa.y += Math.sin(t*1.1)*0.08;
  _pb.lerpVectors(P.oB0, P.oB1, snap);
  _pb.y += Math.cos(t*1.05)*0.08;
  // once charged they are pulled in to their metal partner
  _pa.lerp(_v1.copy(P.pairA).add(V(0.80,0,0)), pull);
  _pb.lerp(_v1.copy(P.pairB).add(V(-0.80,0,0)), pull);
  oA.position.copy(_pa); oB.position.copy(_pb);
  // an oxide ion is bigger than an oxygen atom
  const oR = lerp(O_ATOM_R, EL.O.r, charged);
  oA.scale.setScalar(oR); oB.scale.setScalar(oR);

  /* the double bond: two lines, both going at once */
  const dbOn = 1 - snap;
  [[db1, 0.17],[db2,-0.17]].forEach(([d,z])=>{
    d.material.opacity = dbOn;
    d.visible = dbOn > 0.01;
    if(d.visible){
      placeBond(d, _v1.copy(oA.position).add(V(0,0,z)),
                   _pa.copy(oB.position).add(V(0,0,z)), 0.08);
    }
  });

  /* the two metal atoms, which become ions and shrink */
  _pa.lerpVectors(P.mA0, P.mA1, close);
  _pa.y += Math.sin(t*0.9)*0.10;
  _pa.lerp(_v1.copy(P.pairA).add(V(-0.80,0,0)), pull);
  mA.position.copy(_pa);
  _pb.lerpVectors(P.mB0, P.mB1, close);
  _pb.y += Math.cos(t*0.95)*0.10;
  _pb.lerp(_v1.copy(P.pairB).add(V(0.80,0,0)), pull);
  mB.position.copy(_pb);
  const mR = lerp(MT.r, MT.ionR, charged);
  mA.scale.setScalar(mR); mB.scale.setScalar(mR);

  /* the ionic attraction, once there is charge to attract */
  const linkOn = ramp(t, 48.2, 50.4);
  [[linkA, mA, oA],[linkB, mB, oB]].forEach(([l,m,o])=>{
    l.material.opacity = linkOn*0.8;
    l.visible = linkOn > 0.01;
    if(l.visible) placeBond(l, m.position, o.position, 0.42);
  });

  /* four electrons: two off each metal, onto the oxygen facing it */
  for(let i=0;i<4;i++){
    const fromM = i<2 ? mA : mB;
    const toO   = i<2 ? oA : oB;
    const k = i%2;
    _v1.copy(fromM.position).add(V(k?0.55:-0.2, k?0.5:-0.55, 0.28));
    _v1.x += Math.sin(t*2.4+i)*0.05; _v1.y += Math.cos(t*2.2+i)*0.05;
    _v1.lerp(toO.position, cross[i]);
    es[i].position.copy(_v1);
    electronFade(es[i], ramp(t, 39.8+i*0.25, 41.0+i*0.25) * (1 - ramp(t, 45.2+i*0.3, 46.2+i*0.3)));
  }

  /* the lattice: pairs drifting in from nowhere onto a grid */
  cells.forEach(u=>{
    const d = u.userData;
    _v1.lerpVectors(d.from, d.home, build);
    _v1.y += Math.sin(t*1.2+d.ph)*0.05;
    u.position.copy(_v1);
    u.rotation.y = lerp(d.ph, 0, build);
    const op = build*0.95;
    d.m.material.opacity = op; d.o.material.opacity = op;
    d.m.visible = d.o.visible = op > 0.02;
    d.b.material.opacity = op*0.8;
    d.b.visible = op > 0.02;
  });
  latt.rotation.y = 0.1 + (t-52.8)*0.02;

  /* labels */
  const L = lbl;
  L.o2.material.opacity = ramp(t,30.6,31.6)*(1-ramp(t,33.6,34.4));
  L.o2.position.copy(oA.position).add(_v1.set(0.6,1.1,0));
  L.oat.material.opacity = ramp(t,36.4,37.4)*(1-charged);
  L.oat.position.copy(oA.position).add(_v1.set(0,0.95,0));
  L.mat.material.opacity = ramp(t,39.4,40.4)*(1-charged);
  L.mat.position.copy(mA.position).add(_v1.set(0,MT.r+0.8,0));
  L.mion.material.opacity = charged*(1-ramp(t,53.4,54.2));
  L.mion.position.copy(mA.position).add(_v1.set(-0.2,MT.r+0.8,0));
  L.oion.material.opacity = charged*(1-ramp(t,53.4,54.2));
  L.oion.position.copy(oA.position).add(_v1.set(0.3,0.95,0));
  L.e.material.opacity = ramp(t,41.0,42.0)*(1-ramp(t,44.8,45.6));
  L.e.position.copy(es[0].position).add(_v1.set(0.2,0.6,0));
  L.pull.material.opacity = ramp(t,49.4,50.4)*(1-ramp(t,53.0,53.8));
  L.pull.position.copy(P.pairA).add(_v1.set(0.2,-1.35,0));
  L.latt.material.opacity = ramp(t,57.0,58.0)*(1-ramp(t,61.2,62.0));
  L.latt.position.set(0, -4.2, 0);
}

const camPos=new THREE.Vector3(), camTgt=new THREE.Vector3();
function sampleCam(t){
  const w = worldAt(t), keys = CAM[w];
  let i=0; while(i<keys.length-2 && t>=keys[i+1].t) i++;
  const a=keys[i], b=keys[Math.min(i+1,keys.length-1)];
  const u = b.t===a.t?0:smooth((t-a.t)/(b.t-a.t));
  const off = w==='micro1'?MICRO1_Y : w==='micro2'?MICRO2_Y : 0;
  camPos.set(lerp(a.p[0],b.p[0],u), lerp(a.p[1],b.p[1],u)+off, lerp(a.p[2],b.p[2],u));
  camTgt.set(lerp(a.l[0],b.l[0],u), lerp(a.l[1],b.l[1],u)+off, lerp(a.l[2],b.l[2],u));
}

/* ---------- macro animation ---------- */
const LIGHT_A = 15.0, LIGHT_B = 15.7;
const glareEl = document.getElementById('glare');

function updateMacro(t){
  /* the Bunsen */
  const on = ramp(t, LIGHT_A, LIGHT_B);
  const flick = 0.9 + Math.sin(t*21)*0.07 + Math.sin(t*34)*0.04;
  flameOuter.material.opacity = on*0.55*flick;
  flameInner.material.opacity = on*0.8*flick;
  flameOuter.scale.y = flick; flameInner.scale.y = flick*1.05;
  bunsenLight.position.set(BUNSEN_X, 1.7, 0);
  bunsenLight.intensity = on*1.8*flick;

  /* the tongs carry the metal into the flame, then over the dish */
  const inTo = ramp(t, 16.4, 18.6);
  const over = ramp(t, 25.6, 27.4);
  tongs.position.lerpVectors(TONGS_REST, TONGS_FLAME, inTo);
  tongs.position.lerp(V(DISH_X, 2.5, 0.1), over);
  tongs.rotation.z = lerp(0.2, 0, inTo) + over*0.35;

  /* how much is left, and where that leaves it.  It is eaten away from the
     free end upwards, so the gripped end stays against the jaws — 0.03 of
     overlap so it reads as held rather than merely touching. */
  const eaten = ramp(t, IGNITE+0.2, BURN_END);
  const sy = 1-eaten*0.82;
  piece.scale.set(1, sy, 1-eaten*0.25);
  piece.position.set(0, -PIECE_H*0.5*sy + 0.03, 0);
  /* settled for this frame, so the glow can follow it in world space */
  tongs.updateMatrixWorld(true);
  piece.getWorldPosition(_gw);

  /* the burn */
  const burn = ramp(t, IGNITE, IGNITE+0.7) * (1 - ramp(t, BURN_END-0.9, BURN_END));
  const bflick = 0.8 + Math.sin(t*26)*0.12 + Math.sin(t*41)*0.08;
  burnGlow.position.copy(_gw).add(V(0,-0.1,0));
  burnGlow.scale.setScalar((FLAMES ? 2.4 : 1.1) * burn * bflick * (0.5+MT.power));
  burnGlow.material.opacity = burn*(FLAMES?0.95:0.5)*bflick;
  burnLight.position.copy(burnGlow.position);
  burnLight.color.setHex(MT.flame || 0xff7a30);
  burnLight.intensity = burn*(2.0 + 7.0*MT.power)*bflick;
  /* the glare on the screen itself, for the ones that really are too bright */
  glareEl.style.opacity = (burn * MT.glare * bflick).toFixed(3);

  /* and it turns into its oxide as it goes */
  piece.material.color.copy(new THREE.Color(MT.col)).lerp(new THREE.Color(MT.ash), eaten*0.85);
  piece.material.metalness = lerp(0.82, 0.1, eaten);
  piece.material.roughness = lerp(0.30, 0.92, eaten);
  piece.material.emissive.setRGB(burn*0.8*MT.power, burn*0.5*MT.power, burn*0.3*MT.power);

  updateAsh(t);
}

let yaw=0, pitch=0, dragging=false, lx=0, ly=0;
const el = renderer.domElement;
function down(x,y){dragging=true;lx=x;ly=y;el.style.cursor='grabbing';}
function move(x,y){
  if(!dragging) return;
  yaw   -= (x-lx)*0.005;
  pitch  = Math.max(-0.9, Math.min(0.9, pitch + (y-ly)*0.004));
  lx=x; ly=y;
}
function up(){dragging=false; el.style.cursor='grab';}
el.style.cursor='grab';
el.addEventListener('mousedown',e=>down(e.clientX,e.clientY));
addEventListener('mousemove',e=>move(e.clientX,e.clientY));
addEventListener('mouseup',up);
el.addEventListener('touchstart',e=>{down(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
el.addEventListener('touchmove',e=>{move(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
addEventListener('touchend',up);

const _sph = new THREE.Spherical();
function applyCamera(){
  const dir = camPos.clone().sub(camTgt);
  _sph.setFromVector3(dir);
  _sph.theta += yaw;
  _sph.phi = Math.max(0.12, Math.min(Math.PI-0.12, _sph.phi - pitch));
  dir.setFromSpherical(_sph);
  camera.position.copy(camTgt).add(dir);
  camera.lookAt(camTgt);
}

/* =====================================================================
   UI
===================================================================== */
const capEl  = document.getElementById('caption');
const fadeEl = document.getElementById('fade');
const playBtn= document.getElementById('play');
const scrub  = document.getElementById('scrub');
const clock  = document.getElementById('clock');
const keyEl  = document.getElementById('key');
const menuEl = document.getElementById('menu');
const gearEl = document.getElementById('gear');

let t = 0, playing = true, lastFrame = performance.now(), curSeg = -1;

playBtn.onclick = ()=>{ playing=!playing; playBtn.textContent = playing?'Pause':'Play'; };
document.getElementById('restart').onclick = ()=>{ t=0; curSeg=-1; playing=true; playBtn.textContent='Pause'; };
scrub.oninput = ()=>{ t = parseFloat(scrub.value); curSeg=-1; };
addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault(); playBtn.click(); }
  if(e.code==='ArrowRight'){ t = Math.min(TOTAL, t+2); curSeg=-1; }
  if(e.code==='ArrowLeft'){  t = Math.max(0, t-2);     curSeg=-1; }
  if(e.code==='Escape') setMenu(false);
});

function captionFor(time){
  let i=0; for(let k=0;k<SEGS.length;k++) if(time>=SEGS[k].t) i=k;
  return i;
}
function fadeAmount(time){
  let f=0;
  for(const T of TRANSITIONS) f = Math.max(f, 1 - Math.min(1, Math.abs(time-T)/FADE));
  return f;
}

const hexCss = n => '#'+n.toString(16).padStart(6,'0');

function buildLegend(){
  const rows = [
    {sym:MT.sym, name:MT.name, col:MT.col},
    {sym:'O', name:'oxygen', col:EL.O.col},
    {sym:'e⁻', name:'electron', col:E_COL}
  ];
  keyEl.innerHTML = rows.map(r=>
    `<div><span class="dot" style="background:${hexCss(r.col)}"></span><b>${r.sym}</b> ${r.name}</div>`
  ).join('');
}

function buildMenu(){
  document.getElementById('metalOpts').innerHTML = Object.keys(METALS).map(k=>{
    const m = METALS[k];
    const sw = m.flame ? `<span class="swatch" style="background:${hexCss(m.flame)}"></span>` : '';
    return `<button class="opt ${k===metalKey?'on':''}" data-key="${k}">` +
           `${sw}<span class="f">${m.sym}</span> · ${m.name}</button>`;
  }).join('');
  document.getElementById('menuEq').innerHTML =
    `${equation()}<span>` +
    (FLAMES
      ? `${cap1(MT.name)} burns with ${MT.flameWord} flame — that colour is the metal itself, which is what a flame test uses.`
      : `${cap1(MT.name)} does not burn with a flame; it just oxidises to a ${MT.ashWord} coating when heated.`) +
    ` Every one of these is M²⁺, so two electrons cross per atom and the formula is always MO: ` +
    `<i>${halves()}</i></span>`;
  menuEl.querySelectorAll('.opt').forEach(b=>{
    b.onclick = ()=>{ metalKey = b.dataset.key; build(); playing = true; playBtn.textContent = 'Pause'; };
  });
}

function setMenu(open){
  menuEl.classList.toggle('open', open);
  gearEl.classList.toggle('open', open);
  if(open) buildMenu();
}
gearEl.onclick = ()=> setMenu(!menuEl.classList.contains('open'));

/* ---------- rebuild everything that depends on the species ---------- */
function build(){
  derive();
  buildPiece();
  buildAsh();
  buildMicro1();
  buildMicro2();
  buildCaptions();
  buildLegend();

  document.title = `Burning ${MT.name}`;
  document.getElementById('h1').textContent = FLAMES
    ? `Burning ${MT.name}` : `Heating ${MT.name} in air`;
  document.getElementById('subtitle').textContent = equation();
  scrub.style.setProperty('--hl', hexCss(MT.col));

  if(menuEl.classList.contains('open')) buildMenu();
  history.replaceState(null,'',`?metal=${metalKey}`);

  t = 0; curSeg = -1;
}
build();

/* =====================================================================
   LOOP
===================================================================== */
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min((now-lastFrame)/1000, 1/24);
  lastFrame = now;

  if(playing){
    t += dt;
    if(t >= TOTAL){ t = TOTAL; playing=false; playBtn.textContent='Play'; }
  }

  updateMacro(t);
  updateMicro1(t);
  updateMicro2(t);
  sampleCam(t);
  applyCamera();

  const f = fadeAmount(t);
  fadeEl.style.opacity = f;
  const seg = captionFor(t);
  if(seg !== curSeg){ curSeg = seg; capEl.textContent = SEGS[seg].c; }
  capEl.style.opacity = 1 - f;
  scrub.value = t;
  scrub.style.setProperty('--p', (t/TOTAL*100)+'%');
  clock.textContent = t.toFixed(1)+' / '+TOTAL.toFixed(1)+'s';

  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
