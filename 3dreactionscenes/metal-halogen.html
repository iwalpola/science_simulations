<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metal + halogen</title>
<style>
  :root{
    --ink:#eef2f7;
    --dim:#93a2b6;
    --panel:rgba(10,14,21,.72);
    --line:rgba(147,162,182,.22);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:#080b11;color:var(--ink);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden;}
  #stage{position:fixed;inset:0;}
  canvas{display:block;}

  #fade{position:fixed;inset:0;background:#080b11;pointer-events:none;opacity:0;}
  #glare{position:fixed;inset:0;background:#fff;pointer-events:none;opacity:0;}

  .title{position:fixed;top:22px;left:26px;max-width:min(46ch,60vw);pointer-events:none;}
  .title h1{
    margin:0;
    font-family:"Iowan Old Style","Charter","Palatino Linotype",Georgia,serif;
    font-weight:600;font-size:23px;letter-spacing:.2px;line-height:1.25;
  }
  .title p{margin:6px 0 0;font-size:13px;line-height:1.5;color:var(--dim);}
  .eq{font-variant-numeric:tabular-nums;}
  .title a{pointer-events:auto;color:var(--dim);text-decoration:none;font-size:12px;
    border-bottom:1px solid rgba(147,162,182,.3);}
  .title a:hover{color:var(--ink);}

  #caption{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:112px;width:min(680px,92vw);text-align:center;pointer-events:none;
    font-family:"Iowan Old Style","Charter","Palatino Linotype",Georgia,serif;
    font-size:19px;line-height:1.45;

    transition:opacity .35s ease;
  }

  #bar{
    position:fixed;left:50%;transform:translateX(-50%);bottom:20px;
    width:min(720px,94vw);
    background:var(--panel);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;display:flex;align-items:center;gap:12px;

  button{
    font:inherit;font-size:13px;color:var(--ink);
    background:rgba(255,255,255,.06);border:1px solid var(--line);

  }
  button:hover{background:rgba(255,255,255,.12);}
  button:focus-visible{outline:2px solid #7fb0ff;outline-offset:2px;}
  #play{min-width:74px;}
  #gear{padding:7px 11px;font-size:15px;line-height:1;}
  #gear.open{background:rgba(127,176,255,.2);border-color:rgba(127,176,255,.5);}
  #scrub{
    flex:1;appearance:none;height:4px;border-radius:4px;
    background:linear-gradient(90deg,var(--hl,#d9cbb0) 0%,var(--hl,#d9cbb0) var(--p,0%),rgba(255,255,255,.14) var(--p,0%));
    cursor:pointer;
  }
  #scrub::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;
    background:var(--ink);border:none;box-shadow:0 0 0 3px rgba(8,11,17,.6);}
  #scrub::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ink);border:none;}
  #clock{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:74px;text-align:right;}

  #key{
    position:fixed;right:24px;top:22px;
    background:var(--panel);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:12px;padding:11px 13px;
    font-size:12.5px;line-height:1.9;color:var(--dim);
  }
  #key div{display:flex;align-items:center;gap:8px;}
  .dot{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:inset -2px -2px 3px rgba(0,0,0,.45);}
  #key b{color:var(--ink);font-weight:600;}
  #hint{position:fixed;bottom:90px;right:24px;font-size:11.5px;color:var(--dim);opacity:.75;}

  /* ---- species menu ---- */
  #menu{
    position:fixed;left:50%;transform:translateX(-50%);bottom:86px;
    width:min(720px,94vw);
    background:var(--panel);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;display:none;gap:18px;
  }
  #menu.open{display:flex;flex-wrap:wrap;}
  #menu fieldset{border:none;margin:0;padding:0;flex:1;min-width:210px;}
  #menu legend{
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:#64748b;padding:0 0 8px;
  }
  .opts{display:flex;flex-wrap:wrap;gap:6px;}
  .opt{
    font:inherit;font-size:12.5px;padding:6px 11px;border-radius:8px;
    background:rgba(255,255,255,.05);border:1px solid var(--line);
    color:var(--dim);cursor:pointer;
  }
  .opt:hover{background:rgba(255,255,255,.1);color:var(--ink);}
  .opt.on{background:rgba(127,176,255,.18);border-color:rgba(127,176,255,.5);color:#dce9ff;}
  .opt .f{font-family:"Iowan Old Style","Charter",Georgia,serif;font-variant-numeric:tabular-nums;}
  .swatch{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;
    vertical-align:-1px;border:1px solid rgba(255,255,255,.3);}
  #menuEq{
    flex-basis:100%;border-top:1px solid var(--line);padding-top:12px;margin:0;
    font-family:"Iowan Old Style","Charter",Georgia,serif;font-size:16px;
    color:var(--ink);font-variant-numeric:tabular-nums;
  }
  #menuEq span{color:#64748b;font-size:12px;display:block;margin-top:5px;
    font-family:ui-sans-serif,system-ui,sans-serif;line-height:1.5;}
  #menuEq i{color:#a8c9ff;font-style:normal;}

  @media (max-width:640px){
    .title h1{font-size:18px;} .title p{display:none;}
    #key{right:14px;top:14px;padding:8px 10px;font-size:11px;line-height:1.7;}
    #caption{font-size:16px;bottom:100px;}
    #hint{display:none;}
    #clock{display:none;}
    #menu{bottom:82px;padding:13px 14px;}
  }
  @media (prefers-reduced-motion:reduce){#caption{transition:none;} #glare{display:none;}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="fade"></div>
<div id="glare"></div>

<div class="title">
  <h1 id="h1">Sodium in chlorine</h1>
  <p class="eq" id="subtitle">2Na + Cl₂ → 2NaCl</p>
  <p><a href="index.html">← All fourteen reactions</a></p>
</div>

<div id="key"></div>

<div id="caption"></div>
<div id="hint">Drag to look around</div>

<div id="menu">
  <fieldset>
    <legend>Metal — its flame colour is its own</legend>
    <div class="opts" id="metalOpts"></div>
  </fieldset>
  <fieldset>
    <legend>Halogen in the jar</legend>
    <div class="opts" id="halOpts"></div>
  </fieldset>
  <p id="menuEq"></p>
</div>

<div id="bar">
  <button id="play">Pause</button>
  <button id="restart">Restart</button>
  <input id="scrub" type="range" min="0" max="60" step="0.01" value="0" aria-label="Timeline">
  <span id="clock">0.0 / 60.0s</span>
  <button id="gear" title="Change the species" aria-label="Change the species">⚙</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------------------------------------------------------------------------
   SCENE 11 — metal + halogen,  2M + X₂ → 2MX

   The cleanest ionic bond in the set, because the arithmetic is as simple as
   it gets: a group 1 atom has exactly one electron too many, a halogen atom is
   exactly one short. One electron crosses, one bond forms, and the formula is
   one to one.

   It is the same story as scene 10 with a different count — two electrons per
   atom there, one here — which is exactly why the formula was MO there and is
   MX here. Micro world 1 puts the two reactants side by side so you can see
   the spare and the gap before anything moves.

   Acts:
     0  – 7   macro: the jar of halogen, the metal on a spoon
     7  – 15  micro 1: one spare electron, one gap
    15  – 30  macro: lower it in — flame, then white smoke
    30  – end micro 2: one electron across, and a lattice

   Everything is a closed-form function of t — no particle sim.
--------------------------------------------------------------------------- */

/* ======================= the species tables ======================= */

const EL = {               // the same palette as every other scene here
  Cl: {name:'chlorine', col:0x4fbf72, r:0.62}
};
const E_COL = 0xffe070;

/* group 1: one outer electron each, so every salt here is MX */
const METALS = {
  Li: {sym:'Li', name:'lithium', ion:'Li⁺',
       col:0xdde3e8, r:0.60, lblCol:'#e8eef2', ionR:0.40,
       form:'piece', flame:0xd8304a, flameWord:'a deep crimson', power:0.80, glare:0.30},
  Na: {sym:'Na', name:'sodium', ion:'Na⁺',
       col:0xd9cbb0, r:0.66, lblCol:'#ece0c8', ionR:0.48,
       form:'piece', flame:0xffb020, flameWord:'a fierce orange-yellow', power:1.00, glare:0.42},
  K:  {sym:'K',  name:'potassium', ion:'K⁺',
       col:0xcbb8d4, r:0.74, lblCol:'#e0d0e8', ionR:0.56,
       form:'piece', flame:0xc9a0f0, flameWord:'lilac', power:1.00, glare:0.38}
};

/* the same halogen numbers as scene 07 — an ion is bigger than its atom */
const HALOGENS = {
  Cl: {sym:'Cl', name:'chlorine', mol:'Cl₂', ion:'Cl⁻', halide:'chloride',
       col:0x4fbf72, r:0.62, lblCol:'#8fe0a8', ionR:0.78,
       gas:[0.78,0.85,0.38], gasWord:'a pale yellow-green gas', state:'gas'},
  Br: {sym:'Br', name:'bromine', mol:'Br₂', ion:'Br⁻', halide:'bromide',
       col:0xa8412a, r:0.72, lblCol:'#e09080', ionR:0.88,
       gas:[0.66,0.30,0.12], gasWord:'a heavy brown vapour', state:'vapour'},
  I:  {sym:'I',  name:'iodine', mol:'I₂', ion:'I⁻', halide:'iodide',
       col:0x7a4fa8, r:0.82, lblCol:'#c0a0e0', ionR:0.98,
       gas:[0.42,0.26,0.52], gasWord:'a violet vapour', state:'vapour'}
};

const qs = new URLSearchParams(location.search);
let metalKey = METALS[qs.get('metal')] ? qs.get('metal') : 'Na';
let halKey   = HALOGENS[qs.get('halogen')] ? qs.get('halogen') : 'Cl';
let MT, HX;
function derive(){ MT = METALS[metalKey]; HX = HALOGENS[halKey]; }

const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
const saltFormula = () => `${MT.sym}${HX.sym}`;
const saltName    = () => `${MT.name} ${HX.halide}`;
const equation    = () => `2${MT.sym} + ${HX.mol} → 2${saltFormula()}`;
const halves      = () => `${MT.sym} → ${MT.ion} + e⁻     ·     ${HX.sym} + e⁻ → ${HX.ion}`;
const isTableSalt = () => metalKey === 'Na' && halKey === 'Cl';

const MICRO1_Y =  400;   // the spare and the gap
const MICRO2_Y = -400;   // the bonding

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080b11);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.05, 2000);

scene.add(new THREE.HemisphereLight(0x9fb4d0, 0x0a0d13, 0.6));
const keyL = new THREE.DirectionalLight(0xffffff, 0.95); keyL.position.set(6,11,8); scene.add(keyL);
const fill = new THREE.DirectionalLight(0x9ec3ff, 0.4); fill.position.set(-8,4,-6); scene.add(fill);
const rim  = new THREE.DirectionalLight(0xffd9b0, 0.35); rim.position.set(0,3,-10); scene.add(rim);
const burnLight = new THREE.PointLight(0xffffff, 0, 14); scene.add(burnLight);

(function environment(){
  const env = new THREE.Scene();
  const box = new THREE.BoxGeometry(1,1,1);
  env.add(new THREE.Mesh(new THREE.BoxGeometry(24,14,24),
    new THREE.MeshBasicMaterial({color:0x1d2634, side:THREE.BackSide})));
  const panel=(hex,gain,x,y,z,sx,sy,sz)=>{
    const m=new THREE.Mesh(box,new THREE.MeshBasicMaterial({color:hex}));
    m.material.color.multiplyScalar(gain);
    m.position.set(x,y,z); m.scale.set(sx,sy,sz); env.add(m);
  };
  panel(0xffffff,3.2,  0, 6.6,  0, 11,0.1,11);
  panel(0xbcd6ff,1.3, -9, 1.0,  0, 0.1,9,16);
  panel(0xffd7b0,0.9,  9, 1.0,  2, 0.1,9,16);
  panel(0x8fb0e0,0.5,  0, 0.0,-10, 18,9,0.1);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(env, 0.04).texture;
  pmrem.dispose();
})();

/* ---------- shared helpers ---------- */
const SPH = new THREE.SphereGeometry(1,32,24);
const SPH_LO = new THREE.SphereGeometry(1,16,12);
const CYL = new THREE.CylinderGeometry(1,1,1,20,1,false);

function atom(color, radius, opts={}){
  const mat = new THREE.MeshStandardMaterial({
    color, roughness: opts.rough ?? 0.35, metalness: opts.metal ?? 0.25,
    emissive: new THREE.Color(color).multiplyScalar(opts.glow ?? 0.06)
  });
  if(opts.op !== undefined && opts.op < 1){ mat.transparent = true; mat.opacity = opts.op; }
  const m = new THREE.Mesh(opts.lo?SPH_LO:SPH, mat);
  m.scale.setScalar(radius);
  return m;
}

function electron(){
  const g = new THREE.Group();
  const core = new THREE.Mesh(SPH_LO, new THREE.MeshStandardMaterial({
    color:0xfff6d0, emissive:E_COL, roughness:0.3, metalness:0,
    transparent:true, opacity:1
  }));
  core.scale.setScalar(0.16);
  const halo = new THREE.Mesh(SPH_LO, new THREE.MeshBasicMaterial({
    color:E_COL, transparent:true, opacity:0.20,
    blending:THREE.AdditiveBlending, depthWrite:false
  }));
  halo.scale.setScalar(0.38);
  g.add(core, halo);
  g.userData.core = core; g.userData.halo = halo;
  return g;
}
function electronFade(e, a){
  e.userData.core.material.opacity = a;
  e.userData.halo.material.opacity = 0.20*a;
  e.visible = a > 0.02;
}

function bond(color=0xa9b6c6, radius=0.13){
  const m = new THREE.Mesh(CYL, new THREE.MeshStandardMaterial({
    color, roughness:0.5, metalness:0.1, transparent:true, opacity:1
  }));
  m.userData.radius = radius;
  return m;
}
const _v1=new THREE.Vector3(), _up=new THREE.Vector3(0,1,0);
function placeBond(mesh, a, b, shrink=0){
  const dir = new THREE.Vector3().subVectors(b,a);
  const len = Math.max(dir.length()-shrink*2, 0.001);
  mesh.position.copy(a).addScaledVector(dir,0.5);
  mesh.scale.set(mesh.userData.radius, len, mesh.userData.radius);
  mesh.quaternion.setFromUnitVectors(_up, dir.normalize());
}

function label(text, color='#eef2f7', size=54){
  const pad=16, c=document.createElement('canvas'), ctx=c.getContext('2d');
  const font = `600 ${size}px "Iowan Old Style", Charter, Georgia, serif`;
  ctx.font=font; const w=Math.ceil(ctx.measureText(text).width)+pad*2;
  c.width=w; c.height=size+pad*2;
  ctx.font=font; ctx.textBaseline='middle'; ctx.textAlign='center';
  ctx.shadowColor='rgba(0,0,0,.9)'; ctx.shadowBlur=14;
  ctx.fillStyle=color; ctx.fillText(text, c.width/2, c.height/2);
  const tex = new THREE.CanvasTexture(c); tex.anisotropy=4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false, opacity:0}));
  sp.renderOrder = 10;
  sp.scale.set(c.width/c.height*0.62, 0.62, 1);
  return sp;
}

const GLOW_TEX = (function(){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,   'rgba(255,255,255,1)');
  g.addColorStop(0.25,'rgba(255,248,235,.75)');
  g.addColorStop(0.6, 'rgba(245,235,225,.26)');
  g.addColorStop(1,   'rgba(230,220,210,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
})();

function lerp(a,b,t){ return a+(b-a)*t; }
function clamp01(x){ return Math.max(0,Math.min(1,x)); }
function smooth(x){ x=clamp01(x); return x*x*(3-2*x); }
function ramp(t,a,b){ return smooth((t-a)/(b-a)); }

function clearGroup(g){
  for(let i=g.children.length-1;i>=0;i--){
    const c = g.children[i];
    g.remove(c);
    c.traverse(o=>{
      if(o.material){
        if(o.material.map && o.material.map !== GLOW_TEX) o.material.map.dispose();
        o.material.dispose();
      }
    });
  }
}
function rng(seed){
  let s = seed>>>0;
  return ()=>{ s = (s*1664525 + 1013904223)>>>0; return s/4294967296; };
}

/* =====================================================================
   MACRO WORLD — a gas jar of the halogen, and a deflagrating spoon
===================================================================== */
const macro = new THREE.Group(); scene.add(macro);

const bench = new THREE.Mesh(
  new THREE.CylinderGeometry(9,9,0.35,64),
  new THREE.MeshStandardMaterial({color:0x11151d, roughness:0.95, metalness:0})
);
bench.position.y=-0.175; macro.add(bench);

const steel = new THREE.MeshStandardMaterial({color:0xb9c3cf, metalness:0.9, roughness:0.24});
const glassMat = new THREE.MeshStandardMaterial({
  color:0xbfd6e8, roughness:0.07, metalness:0.0,
  transparent:true, opacity:0.17, side:THREE.DoubleSide
});

/* the jar */
const JAR_X = 0.55, JAR_R = 1.02, JAR_TOP = 2.60;
const jar = new THREE.Group(); jar.position.set(JAR_X,0,0); macro.add(jar);
const jWall = new THREE.Mesh(new THREE.CylinderGeometry(JAR_R,JAR_R,JAR_TOP,48,1,true), glassMat);
jWall.position.y = JAR_TOP/2; jar.add(jWall);
const jFloor = new THREE.Mesh(new THREE.CylinderGeometry(JAR_R,JAR_R,0.07,48), glassMat);
jFloor.position.y = 0.035; jar.add(jFloor);
const jLip = new THREE.Mesh(new THREE.TorusGeometry(JAR_R,0.035,10,56),
  new THREE.MeshStandardMaterial({color:0xd8e6f2, roughness:0.15, metalness:0.1,
    transparent:true, opacity:0.5}));
jLip.rotation.x = Math.PI/2; jLip.position.y = JAR_TOP; jar.add(jLip);
/* the lid, which slides aside */
const lid = new THREE.Mesh(new THREE.CylinderGeometry(JAR_R+0.06,JAR_R+0.06,0.06,48),
  new THREE.MeshStandardMaterial({color:0xccd8e4, roughness:0.2, metalness:0.15,
    transparent:true, opacity:0.55}));
macro.add(lid);

/* the halogen itself, filling the jar */
const gasMat = new THREE.MeshStandardMaterial({
  color:0xc8d860, roughness:0.9, metalness:0.0, transparent:true, opacity:0.30,
  depthWrite:false
});
const gas = new THREE.Mesh(new THREE.CylinderGeometry(JAR_R-0.03,JAR_R-0.03,JAR_TOP-0.1,40), gasMat);
gas.position.set(JAR_X,(JAR_TOP-0.1)/2+0.05,0); macro.add(gas);

/* the white solid that settles in the bottom */
const solidMat = new THREE.MeshStandardMaterial({
  color:0xf4f6f8, roughness:0.95, metalness:0.02, transparent:true, opacity:0
});
const solid = new THREE.Mesh(new THREE.CylinderGeometry(JAR_R-0.05,JAR_R-0.05,1,40), solidMat);
macro.add(solid);

/* the deflagrating spoon: a rod down the middle with a little cup on the end */
const spoon = new THREE.Group(); macro.add(spoon);
const sRod = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,2.4,14), steel);
sRod.position.y = 1.2; spoon.add(sRod);
const sCup = new THREE.Mesh(new THREE.CylinderGeometry(0.17,0.13,0.12,20), steel);
spoon.add(sCup);
const sHandle = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.5,12),
  new THREE.MeshStandardMaterial({color:0x3a3026, roughness:0.8, metalness:0.05}));
sHandle.position.y = 2.6; spoon.add(sHandle);

/* the piece of metal in the cup, and the light it burns with */
let piece = null, burnGlow = null;
function buildPiece(){
  if(piece){ spoon.remove(piece); piece.geometry.dispose(); piece.material.dispose(); }
  piece = new THREE.Mesh(new THREE.IcosahedronGeometry(0.115,1),
    new THREE.MeshStandardMaterial({color:MT.col, metalness:0.8, roughness:0.32}));
  piece.position.y = 0.10;
  spoon.add(piece);
  if(burnGlow){ macro.remove(burnGlow); burnGlow.material.dispose(); }
  burnGlow = new THREE.Sprite(new THREE.SpriteMaterial({
    map:GLOW_TEX, color: MT.flame, transparent:true, opacity:0,
    blending:THREE.AdditiveBlending, depthWrite:false, depthTest:false}));
  burnGlow.scale.setScalar(2.0);
  macro.add(burnGlow);
}

const SPOON_REST = new THREE.Vector3(-1.9, 3.30, 0.45);
const SPOON_OVER = new THREE.Vector3(JAR_X, 3.30, 0);
const SPOON_IN   = new THREE.Vector3(JAR_X, 1.30, 0);
const IGNITE = 18.4, BURN_END = 26.6;

/* --- the white smoke of the salt --- */
const smokeGrp = new THREE.Group(); macro.add(smokeGrp);
let smoke = [];
function buildSmoke(){
  clearGroup(smokeGrp);
  smoke = [];
  const rand = rng(20240911);
  for(let i=0;i<46;i++){
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map:GLOW_TEX, color:0xf6f8fa, transparent:true, opacity:0,
      blending:THREE.NormalBlending, depthWrite:false}));
    smoke.push({s, birth: IGNITE+0.3 + rand()*(BURN_END-IGNITE-0.6),
                life:1.8+rand()*1.6,
                x:(rand()-0.5)*1.3, z:(rand()-0.5)*1.3,
                y0:0.9+rand()*0.9, rise:0.20+rand()*0.3, sz:0.5+rand()*0.6});
    smokeGrp.add(s);
  }
}
function updateSmoke(t){
  for(const p of smoke){
    const age = t - p.birth;
    if(age < 0 || age > p.life){ p.s.visible = false; continue; }
    p.s.visible = true;
    const u = age/p.life;
    p.s.position.set(JAR_X + p.x*(0.5+u*0.6), p.y0 + u*p.rise, p.z*(0.5+u*0.6));
    p.s.scale.setScalar(p.sz*(0.7+u*1.1));
    p.s.material.opacity = 0.42*Math.sin(u*Math.PI);
  }
}

/* =====================================================================
   MICRO 1 — one spare electron on the left, one gap on the right
===================================================================== */
const micro1 = new THREE.Group(); micro1.position.y=MICRO1_Y; scene.add(micro1);
let M1 = {};

function buildMicro1(){
  clearGroup(micro1);
  const SC = 1.8;

  /* the metal atom, with its single outer electron on a ring */
  const mAt = atom(MT.col, MT.r*SC, {rough:0.3, metal:0.6});
  mAt.position.set(-4.4, 0, 0);
  micro1.add(mAt);
  const orbit = MT.r*SC + 1.25;
  const mRing = new THREE.Mesh(new THREE.TorusGeometry(orbit,0.012,6,64),
    new THREE.MeshBasicMaterial({color:0xffe070, transparent:true, opacity:0.3, depthWrite:false}));
  mRing.position.copy(mAt.position); mRing.rotation.x = Math.PI*0.42;
  micro1.add(mRing);
  const spare = electron(); electronFade(spare, 0.95); micro1.add(spare);

  /* the halogen molecule, with a visible gap on each atom */
  const hal = new THREE.Group(); hal.position.set(4.2, 0, 0); micro1.add(hal);
  const d = HX.r*SC*0.95;
  const h1 = atom(HX.col, HX.r*SC, {rough:0.3, metal:0.12});
  const h2 = atom(HX.col, HX.r*SC, {rough:0.3, metal:0.12});
  h1.position.set(0, d, 0); h2.position.set(0, -d, 0);
  const hb = bond(0xa9b6c6, 0.13); placeBond(hb, h1.position, h2.position, 0.1);
  hal.add(h1,h2,hb);
  /* the gaps: hollow rings where an electron is missing */
  const gaps = [];
  [[h1,+1],[h2,-1]].forEach(([h,s])=>{
    const g = new THREE.Mesh(new THREE.TorusGeometry(0.30,0.035,8,22),
      new THREE.MeshBasicMaterial({color:0xffe070, transparent:true, opacity:0.55,
        depthWrite:false}));
    g.position.set(HX.r*SC*0.92, s*HX.r*SC*0.55 + h.position.y, 0.25);
    hal.add(g); gaps.push(g);
  });

  const lblM = label(MT.sym, MT.lblCol, 50);   lblM.position.set(-4.4, -orbit-0.9, 0);
  const lblSpare = label('one electron too many','#ffe9a8',38);
  lblSpare.position.set(-4.4, -orbit-1.7, 0);
  const lblH = label(HX.mol, HX.lblCol, 50);   lblH.position.set(4.2, -d-1.3, 0);
  const lblGap = label('one electron short, each','#ffe9a8',38);
  lblGap.position.set(4.2, -d-2.1, 0);
  const lblFit = label('which is a very good fit','#dfe7f2',40);
  lblFit.position.set(0, 3.9, 0);
  micro1.add(lblM,lblSpare,lblH,lblGap,lblFit);

  M1 = {mAt, mRing, spare, hal, gaps, orbit,
        lblM, lblSpare, lblH, lblGap, lblFit};
}

function updateMicro1(t){
  const {mAt, spare, hal, gaps, orbit, lblM, lblSpare, lblH, lblGap, lblFit} = M1;
  const u = t - 7.0;
  const a = u*1.0;
  spare.position.set(
    mAt.position.x + Math.cos(a)*orbit,
    Math.sin(a)*orbit*0.42,
    Math.sin(a)*orbit*0.8
  );
  hal.rotation.y = Math.sin(u*0.3)*0.5;
  hal.rotation.z = Math.sin(u*0.22)*0.12;
  gaps.forEach((g,i)=>{
    g.material.opacity = 0.40 + 0.22*Math.sin(u*2.2 + i*Math.PI);
  });
  const off = 1-ramp(t,12.8,13.8);
  lblM.material.opacity     = ramp(t,8.0,9.0)*off;
  lblSpare.material.opacity = ramp(t,8.6,9.6)*off;
  lblH.material.opacity     = ramp(t,10.0,11.0)*off;
  lblGap.material.opacity   = ramp(t,10.6,11.6)*off;
  lblFit.material.opacity   = ramp(t,11.8,12.6)*off;
}

/* =====================================================================
   MICRO 2 — one electron across, per pair, and a lattice
===================================================================== */
const micro2 = new THREE.Group(); micro2.position.y=MICRO2_Y; scene.add(micro2);
let M2 = {};

const V = (x,y,z)=>new THREE.Vector3(x,y,z);
const P = {
  xA0: V( 0.00, 0.68, 0.00),   // the X₂ molecule, stood on end
  xB0: V( 0.00,-0.68, 0.00),
  xA1: V( 0.80, 2.30, 0.10),   // and the two atoms after it breaks
  xB1: V( 0.80,-2.30,-0.10),
  mA0: V(-6.60, 3.40, 0.90),   // the two metal atoms come in
  mB0: V(-6.90,-3.50, 0.70),
  mA1: V(-3.10, 2.35, 0.20),
  mB1: V(-3.30,-2.35,-0.20),
  pairA: V(-0.80, 2.30, 0.10), // where each ion pair settles
  pairB: V(-0.80,-2.30,-0.10)
};

function buildMicro2(){
  clearGroup(micro2);

  const xA = atom(HX.col, HX.r, {rough:0.3, metal:0.12});
  const xB = atom(HX.col, HX.r, {rough:0.3, metal:0.12});
  const xx = bond(0xa9b6c6, 0.12);
  const mA = atom(MT.col, MT.r, {rough:0.3, metal:0.62});
  const mB = atom(MT.col, MT.r, {rough:0.3, metal:0.62});
  const linkA = bond(0x9aa8bb, 0.11), linkB = bond(0x9aa8bb, 0.11);
  linkA.material.opacity = 0; linkB.material.opacity = 0;
  micro2.add(xA,xB,xx,mA,mB,linkA,linkB);

  /* one electron per metal atom — that is the whole point */
  const e1 = electron(), e2 = electron();
  electronFade(e1,0); electronFade(e2,0);
  micro2.add(e1,e2);

  /* the lattice: alternating ions converging on a grid */
  const latt = new THREE.Group(); micro2.add(latt);
  const cells = [];
  const rand = rng(20240921);
  for(let ix=-1;ix<=1;ix++) for(let iy=-1;iy<=1;iy++) for(let iz=-1;iz<=0;iz++){
    if(ix===0 && iy===0 && iz===0) continue;
    const u = new THREE.Group();
    /* alternate which ion sits where, because that is what a rock-salt
       lattice actually does */
    const flip = ((ix+iy+iz)%2===0) ? 1 : -1;
    const m = atom(MT.col, MT.ionR, {rough:0.3, metal:0.5, lo:true, op:0.001});
    const x = atom(HX.col, HX.ionR, {rough:0.3, metal:0.12, lo:true, op:0.001});
    m.position.x = -0.92*flip; x.position.x = 0.92*flip;
    const b = bond(0x9aa8bb, 0.09); b.material.opacity = 0;
    placeBond(b, m.position, x.position, 0.05);
    u.add(m,x,b);
    const home = V(ix*3.0, iy*2.8, iz*2.9 - 1.6);
    u.userData = {home, from:V(home.x*2.4+(rand()-0.5)*5, home.y*2.4+(rand()-0.5)*5, home.z*2.0-6),
                  ph:rand()*6.283, m, x, b};
    latt.add(u); cells.push(u);
  }

  const lbl = {
    mol:  label(HX.mol, HX.lblCol, 48),
    xat:  label(HX.sym, HX.lblCol, 46),
    mat:  label(MT.sym, MT.lblCol, 46),
    mion: label(MT.ion, MT.lblCol, 46),
    xion: label(HX.ion, HX.lblCol, 46),
    e:    label('e⁻','#ffe9a8',44),
    pull: label('opposite charges — nothing shared','#ffd9a0',40),
    latt: label(`${saltName()}, ${saltFormula()}`,'#dfe7f2',42)
  };
  Object.values(lbl).forEach(l=>micro2.add(l));

  M2 = {xA,xB,xx,mA,mB,linkA,linkB,e1,e2,latt,cells,lbl};
}

const _pa=new THREE.Vector3(), _pb=new THREE.Vector3();

function updateMicro2(t){
  const {xA,xB,xx,mA,mB,linkA,linkB,e1,e2,latt,cells,lbl} = M2;

  const snap    = ramp(t, 33.0, 36.0);   // the X–X bond breaks
  const close   = ramp(t, 30.0, 38.6);   // the metals come in
  const cross   = [ramp(t,39.4,42.4), ramp(t,39.8,42.8)];
  const charged = ramp(t, 42.2, 45.0);   // ion sizes change
  const pull    = ramp(t, 45.6, 49.0);   // and they snap together
  const build   = ramp(t, 49.8, 55.6);   // the lattice assembles

  /* the halogen: a molecule, then two atoms, then two halide ions */
  _pa.lerpVectors(P.xA0, P.xA1, snap);
  _pa.x += Math.sin(t*1.1)*0.08;
  _pb.lerpVectors(P.xB0, P.xB1, snap);
  _pb.x += Math.cos(t*1.05)*0.08;
  _pa.lerp(_v1.copy(P.pairA).add(V(0.92,0,0)), pull);
  _pb.lerp(_v1.copy(P.pairB).add(V(0.92,0,0)), pull);
  xA.position.copy(_pa); xB.position.copy(_pb);
  // a halide ion is BIGGER than the atom — it gained an electron
  const xR = lerp(HX.r, HX.ionR, charged);
  xA.scale.setScalar(xR); xB.scale.setScalar(xR);

  xx.material.opacity = 1 - snap;
  xx.visible = snap < 0.99;
  if(xx.visible) placeBond(xx, xA.position, xB.position, 0.1);

  /* the metals, which become ions and shrink */
  _pa.lerpVectors(P.mA0, P.mA1, close);
  _pa.y += Math.sin(t*0.9)*0.10;
  _pa.lerp(_v1.copy(P.pairA).add(V(-0.92,0,0)), pull);
  mA.position.copy(_pa);
  _pb.lerpVectors(P.mB0, P.mB1, close);
  _pb.y += Math.cos(t*0.95)*0.10;
  _pb.lerp(_v1.copy(P.pairB).add(V(-0.92,0,0)), pull);
  mB.position.copy(_pb);
  const mR = lerp(MT.r, MT.ionR, charged);
  mA.scale.setScalar(mR); mB.scale.setScalar(mR);

  /* the attraction, once there is charge */
  const linkOn = ramp(t, 45.2, 47.4);
  [[linkA, mA, xA],[linkB, mB, xB]].forEach(([l,m,x])=>{
    l.material.opacity = linkOn*0.8;
    l.visible = linkOn > 0.01;
    if(l.visible) placeBond(l, m.position, x.position, 0.48);
  });

  /* one electron each way */
  [[e1, mA, xA, 0],[e2, mB, xB, 1]].forEach(([e,m,x,i])=>{
    _v1.copy(m.position).add(V(0.55, i?-0.5:0.5, 0.3));
    _v1.x += Math.sin(t*2.4+i)*0.05; _v1.y += Math.cos(t*2.2+i)*0.05;
    _v1.lerp(x.position, cross[i]);
    e.position.copy(_v1);
    electronFade(e, ramp(t, 36.6+i*0.3, 37.8+i*0.3) * (1 - ramp(t, 42.0+i*0.3, 43.0+i*0.3)));
  });

  /* the lattice */
  cells.forEach(u=>{
    const d = u.userData;
    _v1.lerpVectors(d.from, d.home, build);
    _v1.y += Math.sin(t*1.2+d.ph)*0.05;
    u.position.copy(_v1);
    u.rotation.y = lerp(d.ph, 0, build);
    const op = build*0.95;
    d.m.material.opacity = op; d.x.material.opacity = op;
    d.m.visible = d.x.visible = op > 0.02;
    d.b.material.opacity = op*0.75;
    d.b.visible = op > 0.02;
  });
  latt.rotation.y = 0.1 + (t-49.8)*0.02;

  /* labels */
  const L = lbl;
  L.mol.material.opacity = ramp(t,30.6,31.6)*(1-ramp(t,33.6,34.4));
  L.mol.position.copy(P.xA0).add(_v1.set(1.3,-0.7,0));
  L.xat.material.opacity = ramp(t,36.2,37.2)*(1-charged);
  L.xat.position.copy(xA.position).add(_v1.set(1.0,0.3,0));
  L.mat.material.opacity = ramp(t,36.8,37.8)*(1-charged);
  L.mat.position.copy(mA.position).add(_v1.set(-0.3,MT.r+0.8,0));
  L.mion.material.opacity = charged*(1-ramp(t,50.6,51.4));
  L.mion.position.copy(mA.position).add(_v1.set(-0.4,MT.r+0.8,0));
  L.xion.material.opacity = charged*(1-ramp(t,50.6,51.4));
  L.xion.position.copy(xA.position).add(_v1.set(1.1,0.3,0));
  L.e.material.opacity = ramp(t,37.8,38.8)*(1-ramp(t,41.6,42.4));
  L.e.position.copy(e1.position).add(_v1.set(0.2,0.6,0));
  L.pull.material.opacity = ramp(t,46.6,47.6)*(1-ramp(t,50.2,51.0));
  L.pull.position.copy(P.pairA).add(_v1.set(0.1,1.35,0));
  L.latt.material.opacity = ramp(t,54.4,55.4)*(1-ramp(t,59.2,60.0));
  L.latt.position.set(0, -4.6, 0);
}

  if(t < 15.0) return 'micro1';
  if(t < 30.0) return 'macro';
  return 'micro2';

const camPos=new THREE.Vector3(), camTgt=new THREE.Vector3();
function sampleCam(t){
  const w = worldAt(t), keys = CAM[w];
  let i=0; while(i<keys.length-2 && t>=keys[i+1].t) i++;
  const a=keys[i], b=keys[Math.min(i+1,keys.length-1)];
  const u = b.t===a.t?0:smooth((t-a.t)/(b.t-a.t));
  const off = w==='micro1'?MICRO1_Y : w==='micro2'?MICRO2_Y : 0;
  camPos.set(lerp(a.p[0],b.p[0],u), lerp(a.p[1],b.p[1],u)+off, lerp(a.p[2],b.p[2],u));
  camTgt.set(lerp(a.l[0],b.l[0],u), lerp(a.l[1],b.l[1],u)+off, lerp(a.l[2],b.l[2],u));
}

/* ---------- macro animation ---------- */
const glareEl = document.getElementById('glare');

function updateMacro(t){
  /* the lid comes off, the spoon goes over and then down into the jar */
  const open = ramp(t, 15.2, 16.4);
  lid.position.set(JAR_X - open*2.0, JAR_TOP + 0.04 + open*0.06, open*0.7);
  lid.rotation.z = open*0.5;

  const over = ramp(t, 15.6, 17.0), down = ramp(t, 17.0, 18.4);
  const out  = ramp(t, 27.4, 29.0);
  spoon.position.lerpVectors(SPOON_REST, SPOON_OVER, over);
  spoon.position.lerp(SPOON_IN, down);
  spoon.position.lerp(V(JAR_X+0.4, 3.7, 0.5), out);
  spoon.rotation.z = lerp(0.22, 0, over) + out*0.3;

  /* the burn */
  const burn = ramp(t, IGNITE, IGNITE+0.6) * (1 - ramp(t, BURN_END-1.0, BURN_END));
  const bflick = 0.8 + Math.sin(t*25)*0.12 + Math.sin(t*39)*0.08;
  _v1.copy(spoon.position).add(V(0,0.18,0));
  burnGlow.position.copy(_v1);
  burnGlow.scale.setScalar(2.3*burn*bflick*(0.55+MT.power*0.6));
  burnGlow.material.opacity = burn*0.92*bflick;
  burnLight.position.copy(_v1);
  burnLight.color.setHex(MT.flame);
  burnLight.intensity = burn*(2.2+6.0*MT.power)*bflick;
  glareEl.style.opacity = (burn * MT.glare * bflick).toFixed(3);

  /* the metal is consumed */
  const eaten = ramp(t, IGNITE+0.2, BURN_END);
  piece.scale.setScalar(Math.max(1-eaten*0.95, 0.02));
  piece.material.emissive.setRGB(burn*0.9, burn*0.6, burn*0.35);
  piece.visible = eaten < 0.97;

  /* the halogen is used up, so its colour drains out of the jar */
  const used = ramp(t, IGNITE+0.4, BURN_END+1.4);
  gasMat.color.setRGB(
    lerp(HX.gas[0], 0.88, used), lerp(HX.gas[1], 0.92, used), lerp(HX.gas[2], 0.96, used));
  gasMat.opacity = lerp(0.30, 0.05, used);

  /* and the salt settles in the bottom */
  const settled = ramp(t, IGNITE+1.2, 29.5);
  const h = Math.max(settled*0.20, 0.001);
  solid.scale.y = h;
  solid.position.set(JAR_X, 0.07 + h/2, 0);
  solidMat.opacity = settled*0.95;
  solid.visible = settled > 0.02;

  updateSmoke(t);
}

let yaw=0, pitch=0, dragging=false, lx=0, ly=0;
const el = renderer.domElement;
function down(x,y){dragging=true;lx=x;ly=y;el.style.cursor='grabbing';}
function move(x,y){
  if(!dragging) return;
  yaw   -= (x-lx)*0.005;
  pitch  = Math.max(-0.9, Math.min(0.9, pitch + (y-ly)*0.004));
  lx=x; ly=y;
}
function up(){dragging=false; el.style.cursor='grab';}
el.style.cursor='grab';
el.addEventListener('mousedown',e=>down(e.clientX,e.clientY));
addEventListener('mousemove',e=>move(e.clientX,e.clientY));
addEventListener('mouseup',up);
el.addEventListener('touchstart',e=>{down(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
el.addEventListener('touchmove',e=>{move(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
addEventListener('touchend',up);

const _sph = new THREE.Spherical();
function applyCamera(){
  const dir = camPos.clone().sub(camTgt);
  _sph.setFromVector3(dir);
  _sph.theta += yaw;
  _sph.phi = Math.max(0.12, Math.min(Math.PI-0.12, _sph.phi - pitch));
  dir.setFromSpherical(_sph);
  camera.position.copy(camTgt).add(dir);
  camera.lookAt(camTgt);
}

/* =====================================================================
   UI
===================================================================== */
const capEl  = document.getElementById('caption');
const fadeEl = document.getElementById('fade');
const playBtn= document.getElementById('play');
const scrub  = document.getElementById('scrub');
const clock  = document.getElementById('clock');
const keyEl  = document.getElementById('key');
const menuEl = document.getElementById('menu');
const gearEl = document.getElementById('gear');

let t = 0, playing = true, lastFrame = performance.now(), curSeg = -1;

playBtn.onclick = ()=>{ playing=!playing; playBtn.textContent = playing?'Pause':'Play'; };
document.getElementById('restart').onclick = ()=>{ t=0; curSeg=-1; playing=true; playBtn.textContent='Pause'; };
scrub.oninput = ()=>{ t = parseFloat(scrub.value); curSeg=-1; };
addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault(); playBtn.click(); }
  if(e.code==='ArrowRight'){ t = Math.min(TOTAL, t+2); curSeg=-1; }
  if(e.code==='ArrowLeft'){  t = Math.max(0, t-2);     curSeg=-1; }
  if(e.code==='Escape') setMenu(false);
});

function captionFor(time){
  let i=0; for(let k=0;k<SEGS.length;k++) if(time>=SEGS[k].t) i=k;
  return i;
}
function fadeAmount(time){
  let f=0;
  for(const T of TRANSITIONS) f = Math.max(f, 1 - Math.min(1, Math.abs(time-T)/FADE));
  return f;
}

const hexCss = n => '#'+n.toString(16).padStart(6,'0');

function buildLegend(){
  const rows = [
    {sym:MT.sym, name:MT.name, col:MT.col},
    {sym:HX.sym, name:HX.name, col:HX.col},
    {sym:'e⁻', name:'electron', col:E_COL}
  ];
  keyEl.innerHTML = rows.map(r=>
    `<div><span class="dot" style="background:${hexCss(r.col)}"></span><b>${r.sym}</b> ${r.name}</div>`
  ).join('');
}

function buildMenu(){
  document.getElementById('metalOpts').innerHTML = Object.keys(METALS).map(k=>{
    const m = METALS[k];
    return `<button class="opt ${k===metalKey?'on':''}" data-group="metal" data-key="${k}">` +
           `<span class="swatch" style="background:${hexCss(m.flame)}"></span>` +
           `<span class="f">${m.sym}</span> · ${m.name}</button>`;
  }).join('');
  document.getElementById('halOpts').innerHTML = Object.keys(HALOGENS).map(k=>{
    const h = HALOGENS[k];
    const g = `rgb(${h.gas.map(v=>Math.round(v*255)).join(',')})`;
    return `<button class="opt ${k===halKey?'on':''}" data-group="hal" data-key="${k}">` +
           `<span class="swatch" style="background:${g}"></span>` +
           `<span class="f">${h.mol}</span> · ${h.name}</button>`;
  }).join('');
  document.getElementById('menuEq').innerHTML =
    `${equation()}<span>One electron crosses per atom, so the formula is one to one — ` +
    `compare that with burning in oxygen, where two cross and you still get MO. ` +
    `<i>${halves()}</i><br>${cap1(MT.name)} burns ${MT.flameWord}; that colour is the metal, not the halogen.` +
    (isTableSalt() ? ' And this particular pair makes the salt on your table.' : '') +
    `</span>`;
  menuEl.querySelectorAll('.opt').forEach(b=>{
    b.onclick = ()=>{
      if(b.dataset.group==='metal') metalKey = b.dataset.key; else halKey = b.dataset.key;
      build();
      playing = true; playBtn.textContent = 'Pause';
    };
  });
}

function setMenu(open){
  menuEl.classList.toggle('open', open);
  gearEl.classList.toggle('open', open);
  if(open) buildMenu();
}
gearEl.onclick = ()=> setMenu(!menuEl.classList.contains('open'));

/* ---------- rebuild everything that depends on the species ---------- */
function build(){
  derive();
  buildPiece();
  buildSmoke();
  buildMicro1();
  buildMicro2();
  buildCaptions();
  buildLegend();

  document.title = `${cap1(MT.name)} + ${HX.name}`;
  document.getElementById('h1').textContent = `${cap1(MT.name)} in ${HX.name}`;
  document.getElementById('subtitle').textContent = equation();
  scrub.style.setProperty('--hl', hexCss(MT.col));

  if(menuEl.classList.contains('open')) buildMenu();
  history.replaceState(null,'',`?metal=${metalKey}&halogen=${halKey}`);

  t = 0; curSeg = -1;
}
build();

/* =====================================================================
   LOOP
===================================================================== */
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min((now-lastFrame)/1000, 1/24);
  lastFrame = now;

  if(playing){
    t += dt;
    if(t >= TOTAL){ t = TOTAL; playing=false; playBtn.textContent='Play'; }
  }

  updateMacro(t);
  updateMicro1(t);
  updateMicro2(t);
  sampleCam(t);
  applyCamera();

  const f = fadeAmount(t);
  fadeEl.style.opacity = f;
  const seg = captionFor(t);
  if(seg !== curSeg){ curSeg = seg; capEl.textContent = SEGS[seg].c; }
  capEl.style.opacity = 1 - f;
  scrub.value = t;
  scrub.style.setProperty('--p', (t/TOTAL*100)+'%');
  clock.textContent = t.toFixed(1)+' / '+TOTAL.toFixed(1)+'s';

  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
