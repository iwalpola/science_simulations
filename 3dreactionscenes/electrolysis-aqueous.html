<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Electrolysis, aqueous</title>
<style>
  :root{
    --ink:#eef2f7;
    --dim:#93a2b6;
    --panel:rgba(10,14,21,.72);
    --line:rgba(147,162,182,.22);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:#080b11;color:var(--ink);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

  #stage{position:fixed;inset:0;}
  canvas{display:block;}

  #fade{position:fixed;inset:0;background:#080b11;pointer-events:none;opacity:0;}

  .title{position:fixed;top:22px;left:26px;max-width:min(46ch,60vw);pointer-events:none;}
  .title h1{
    margin:0;
    font-family:"Iowan Old Style","Charter","Palatino Linotype",Georgia,serif;
    font-weight:600;font-size:23px;letter-spacing:.2px;line-height:1.25;
  }
  .title p{margin:6px 0 0;font-size:13px;line-height:1.5;color:var(--dim);}
  .eq{font-variant-numeric:tabular-nums;}
  .title a{pointer-events:auto;color:var(--dim);text-decoration:none;font-size:12px;
    border-bottom:1px solid rgba(147,162,182,.3);}
  .title a:hover{color:var(--ink);}

  #caption{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:112px;width:min(690px,92vw);text-align:center;pointer-events:none;
    font-family:"Iowan Old Style","Charter","Palatino Linotype",Georgia,serif;
    font-size:19px;line-height:1.45;

  }
  #poles{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .4s ease;}
  #poles span{position:absolute;top:50%;transform:translateY(-50%);
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;}
  #poles .neg{left:26px;color:#9fc0ff;}
  #poles .pos{right:26px;color:#ffb08a;text-align:right;}
  #poles b{display:block;font-size:26px;letter-spacing:0;margin-bottom:2px;}

  /* the two rules, shown while the contests happen */
  #rules{
    position:fixed;left:50%;transform:translateX(-50%);bottom:158px;
    width:min(690px,92vw);pointer-events:none;opacity:0;transition:opacity .4s ease;
    display:flex;gap:10px;justify-content:center;
  }
  #rules div{
    flex:1;max-width:300px;padding:7px 11px;border-radius:9px;
    background:rgba(10,14,21,.8);border:1px solid var(--line);
    font-size:11.5px;line-height:1.45;color:var(--dim);
  }
  #rules .on{border-color:rgba(255,200,140,.6);color:var(--ink);}
  #rules b{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:#64748b;margin-bottom:3px;}

  #bar{
    position:fixed;left:50%;transform:translateX(-50%);bottom:20px;
    width:min(740px,94vw);
    background:var(--panel);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;display:flex;align-items:center;gap:12px;
  }
  button{
    font:inherit;font-size:13px;color:var(--ink);
    background:rgba(255,255,255,.06);border:1px solid var(--line);
    border-radius:9px;padding:7px 13px;cursor:pointer;
    transition:background .15s ease,border-color .15s ease;
  }
  button:hover{background:rgba(255,255,255,.12);}
  button:focus-visible{outline:2px solid #7fb0ff;outline-offset:2px;}
  #play{min-width:74px;}
  #gear{padding:7px 11px;font-size:15px;line-height:1;}
  #gear.open{background:rgba(127,176,255,.2);border-color:rgba(127,176,255,.5);}
  #scrub{
    flex:1;appearance:none;height:4px;border-radius:4px;
    background:linear-gradient(90deg,var(--hl,#d9cbb0) 0%,var(--hl,#d9cbb0) var(--p,0%),rgba(255,255,255,.14) var(--p,0%));
    cursor:pointer;
  }
  #scrub::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;
    background:var(--ink);border:none;box-shadow:0 0 0 3px rgba(8,11,17,.6);}
  #scrub::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ink);border:none;}
  #clock{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:74px;text-align:right;}

  #key{
    position:fixed;right:24px;top:22px;
    background:var(--panel);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:12px;padding:11px 13px;
    font-size:12.5px;line-height:1.9;color:var(--dim);
  }
  #key div{display:flex;align-items:center;gap:8px;}
  .dot{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:inset -2px -2px 3px rgba(0,0,0,.45);}
  #key b{color:var(--ink);font-weight:600;}
  #hint{position:fixed;bottom:90px;right:24px;font-size:11.5px;color:var(--dim);opacity:.75;}

  /* ---- menu ---- */
  #menu{
    position:fixed;left:50%;transform:translateX(-50%);bottom:86px;
    width:min(760px,94vw);
    background:var(--panel);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;display:none;gap:18px;
  }
  #menu.open{display:flex;flex-wrap:wrap;}
  #menu fieldset{border:none;margin:0;padding:0;flex:1;min-width:240px;}
  #menu legend{
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:#64748b;padding:0 0 8px;
  }
  .opts{display:flex;flex-wrap:wrap;gap:6px;}
  .opt{
    font:inherit;font-size:12.5px;padding:6px 11px;border-radius:8px;
    background:rgba(255,255,255,.05);border:1px solid var(--line);
    color:var(--dim);cursor:pointer;
  }
  .opt:hover{background:rgba(255,255,255,.1);color:var(--ink);}
  .opt.on{background:rgba(127,176,255,.18);border-color:rgba(127,176,255,.5);color:#dce9ff;}
  .opt .f{font-family:"Iowan Old Style","Charter",Georgia,serif;font-variant-numeric:tabular-nums;}
  #menuEq{
    flex-basis:100%;border-top:1px solid var(--line);padding-top:12px;margin:0;
    font-family:"Iowan Old Style","Charter",Georgia,serif;font-size:15.5px;
    color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.9;
  }
  #menuEq .el{display:inline-block;min-width:128px;font-size:11px;letter-spacing:.08em;
    text-transform:uppercase;font-family:ui-sans-serif,system-ui,sans-serif;}
  #menuEq .neg{color:#9fc0ff;} #menuEq .pos{color:#ffb08a;}
  #menuEq span{color:#64748b;font-size:12px;display:block;margin-top:7px;
    font-family:ui-sans-serif,system-ui,sans-serif;line-height:1.5;}
  #menuEq i{color:#a8c9ff;font-style:normal;}

  @media (max-width:640px){
    .title h1{font-size:18px;} .title p{display:none;}
    #key{right:14px;top:14px;padding:8px 10px;font-size:11px;line-height:1.7;}
    #caption{font-size:16px;bottom:100px;}
    #hint,#rules{display:none;}
    #clock{display:none;}
    #menu{bottom:82px;padding:13px 14px;}
    #poles span{font-size:10px;} #poles b{font-size:20px;}
  }
  @media (prefers-reduced-motion:reduce){#caption,#poles,#rules{transition:none;}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="fade"></div>

<div class="title">
  <h1 id="h1">Electrolysis of brine</h1>
  <p class="eq" id="subtitle">2NaCl + 2H₂O → 2NaOH + H₂ + Cl₂</p>
  <p><a href="index.html">← All fourteen reactions</a></p>
</div>

<div id="key"></div>

<div id="poles">
  <span class="neg"><b>−</b>cathode</span>
  <span class="pos"><b>+</b>anode</span>
</div>

<div id="rules">
  <div id="ruleCat"><b>rule at the cathode</b></div>
  <div id="ruleAn"><b>rule at the anode</b></div>
</div>

<div id="caption"></div>
<div id="hint">Drag to look around</div>

<div id="menu">
  <fieldset>
    <legend>Solution in the cell</legend>
    <div class="opts" id="solOpts"></div>
  </fieldset>
  <p id="menuEq"></p>
</div>

<div id="bar">
  <button id="play">Pause</button>
  <button id="restart">Restart</button>
  <input id="scrub" type="range" min="0" max="64" step="0.01" value="0" aria-label="Timeline">
  <span id="clock">0.0 / 64.0s</span>
  <button id="gear" title="Change the solution" aria-label="Change the solution">⚙</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------------------------------------------------------------------------
   SCENE 14 — electrolysis of a solution,  and which ion wins

   The hardest of the fourteen, because the water joins in. A solution of any
   salt contains FOUR kinds of ion: the two from the salt, plus H⁺ and OH⁻ from
   the water. Two of them get discharged and two do not, and which is which is
   decided by two rules:

     at the cathode  the LESS reactive of the metal and hydrogen wins
     at the anode    a halide wins if there is one; otherwise OH⁻ gives oxygen

   So micro world 2 stages it as a contest. Two candidates arrive at each
   electrode, one is discharged, and the other is turned away and drifts back
   into solution — which is the part that makes the rule memorable, and the
   part a static diagram cannot show.

   The six solutions on offer exercise both rules in all their combinations:
   brine (H₂ and Cl₂), potassium iodide (H₂ and I₂) and potassium bromide
   (H₂ and Br₂), copper sulfate (Cu and O₂), copper chloride (Cu and Cl₂) —
   where both ions from the salt ARE discharged, so all that is left is water —
   and sodium sulfate, where neither ion from the salt is discharged at all and
   all you are really doing is splitting the water.

   Acts:
     0  – 7   macro: the cell, tubes over each electrode, power off
     7  – 16  micro 1: the four kinds of ion
    16  – 32  macro: switch on, and collect what comes off
    32  – end micro 2: migration, the two contests, and what is left behind

   Everything is a closed-form function of t — the migration included.
--------------------------------------------------------------------------- */

/* ======================= the species tables ======================= */

const EL = {               // the same palette as every other scene here
  O:  {name:'oxygen',   col:0x2f47b8, r:0.50},
  H:  {name:'hydrogen', col:0xd8402f, r:0.34},
  S:  {name:'sulfur',   col:0xe8c33a, r:0.60},
  C:  {name:'carbon',   col:0x4d5560, r:0.58}
};
const O_ATOM_R = 0.42, H_ATOM_R = 0.42;
const E_COL = 0xffe070;

/* `beatsH` means the metal is LESS reactive than hydrogen, so the metal is the
   one that gets discharged.  `halide` decides the anode. */
const SOLUTIONS = {
  NaCl: {
    formula:'NaCl', name:'sodium chloride', common:'brine', conc:'concentrated',
    cat:{sym:'Na', name:'sodium', ion:'Na⁺', col:0xd9cbb0, r:0.66, lblCol:'#ece0c8',
         ionR:0.48, beatsH:false},
    an:{label:'Cl⁻', name:'chloride', halide:true, sym:'Cl', mol:'Cl₂', molName:'chlorine',
        col:0x4fbf72, lblCol:'#8fe0a8', r:0.62, ionR:0.78},
    sol:null, solWord:'colourless',
    leftName:'sodium hydroxide', leftFormula:'NaOH',
    overall:'2NaCl + 2H₂O → 2NaOH + H₂ + Cl₂'
  },
  KI: {
    formula:'KI', name:'potassium iodide', common:null, conc:'concentrated',
    cat:{sym:'K', name:'potassium', ion:'K⁺', col:0xcbb8d4, r:0.74, lblCol:'#e0d0e8',
         ionR:0.56, beatsH:false},
    an:{label:'I⁻', name:'iodide', halide:true, sym:'I', mol:'I₂', molName:'iodine',
        col:0x7a4fa8, lblCol:'#c0a0e0', r:0.82, ionR:0.98},
    sol:null, solWord:'colourless',
    leftName:'potassium hydroxide', leftFormula:'KOH',
    overall:'2KI + 2H₂O → 2KOH + H₂ + I₂'
  },
  KBr: {
    formula:'KBr', name:'potassium bromide', common:null, conc:'concentrated',
    cat:{sym:'K', name:'potassium', ion:'K⁺', col:0xcbb8d4, r:0.74, lblCol:'#e0d0e8',
         ionR:0.56, beatsH:false},
    an:{label:'Br⁻', name:'bromide', halide:true, sym:'Br', mol:'Br₂', molName:'bromine',
        col:0xa8412a, lblCol:'#e09080', r:0.72, ionR:0.88},
    sol:null, solWord:'colourless',
    leftName:'potassium hydroxide', leftFormula:'KOH',
    overall:'2KBr + 2H₂O → 2KOH + H₂ + Br₂'
  },
  CuSO4: {
    formula:'CuSO₄', name:'copper(II) sulfate', common:null, conc:'dilute',
    cat:{sym:'Cu', name:'copper', ion:'Cu²⁺', col:0xc8763c, r:0.66, lblCol:'#f0b07a',
         ionR:0.54, beatsH:true},
    an:{label:'SO₄²⁻', name:'sulfate', halide:false, sym:null, mol:'O₂', molName:'oxygen',
        col:0xe8c33a, lblCol:'#f0dc86', r:0.60, ionR:0.60},
    sol:[0.17,0.47,0.85], solWord:'blue',
    leftName:'sulfuric acid', leftFormula:'H₂SO₄',
    overall:'2CuSO₄ + 2H₂O → 2Cu + O₂ + 2H₂SO₄'
  },
  CuCl2: {
    formula:'CuCl₂', name:'copper(II) chloride', common:null, conc:'concentrated',
    cat:{sym:'Cu', name:'copper', ion:'Cu²⁺', col:0xc8763c, r:0.66, lblCol:'#f0b07a',
         ionR:0.54, beatsH:true},
    an:{label:'Cl⁻', name:'chloride', halide:true, sym:'Cl', mol:'Cl₂', molName:'chlorine',
        col:0x4fbf72, lblCol:'#8fe0a8', r:0.62, ionR:0.78},
    sol:[0.17,0.47,0.85], solWord:'blue',
    leftName:'just water again', leftFormula:'H₂O',
    overall:'CuCl₂ → Cu + Cl₂'
  },
  Na2SO4: {
    formula:'Na₂SO₄', name:'sodium sulfate', common:null, conc:'dilute',
    cat:{sym:'Na', name:'sodium', ion:'Na⁺', col:0xd9cbb0, r:0.66, lblCol:'#ece0c8',
         ionR:0.48, beatsH:false},
    an:{label:'SO₄²⁻', name:'sulfate', halide:false, sym:null, mol:'O₂', molName:'oxygen',
        col:0xe8c33a, lblCol:'#f0dc86', r:0.60, ionR:0.60},
    sol:null, solWord:'colourless',
    leftName:'the sodium sulfate you started with', leftFormula:'Na₂SO₄',
    overall:'2H₂O → 2H₂ + O₂'
  }
};

const qs = new URLSearchParams(location.search);
let solKey = SOLUTIONS[qs.get('solution')] ? qs.get('solution') : 'NaCl';
let SO, CT, AN, METAL_WINS, HALIDE_WINS;

function derive(){
  SO = SOLUTIONS[solKey];
  CT = SO.cat; AN = SO.an;
  METAL_WINS  = CT.beatsH;     // the cathode contest
  HALIDE_WINS = AN.halide;     // the anode contest
}

const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
const atCathode = () => METAL_WINS ? `${CT.ion} + 2e⁻ → ${CT.sym}` : '2H⁺ + 2e⁻ → H₂';
const atAnode   = () => HALIDE_WINS
  ? `2${AN.label} → ${AN.mol} + 2e⁻`
  : '4OH⁻ → O₂ + 2H₂O + 4e⁻';
const cathProduct = () => METAL_WINS ? CT.name : 'hydrogen';
const anProduct   = () => AN.molName;
const equation    = () => SO.overall;
/* the two losers, which stay dissolved.  The cathode and the anode decide
   separately, so these have to be worked out separately — for sodium sulfate
   the metal ion loses at one electrode AND the sulfate loses at the other, so
   nothing from the salt is discharged at all. */
const cathLoser = () => METAL_WINS ? 'H⁺' : CT.ion;
const anLoser   = () => HALIDE_WINS ? 'OH⁻' : AN.label;
const leftovers = () => `${cathLoser()} and ${anLoser()}`;

const MICRO1_Y =  400;   // the four ions
const MICRO2_Y = -400;   // the cell

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
/* Colour management. Without outputEncoding the render is never converted back
   to sRGB, so every colour comes out darker and flatter than it was chosen to
   be. r128 spelling — this became outputColorSpace in later versions. */
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080b11);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.05, 2000);

scene.add(new THREE.HemisphereLight(0x9fb4d0, 0x0a0d13, 0.6));
const keyL = new THREE.DirectionalLight(0xffffff, 0.92); keyL.position.set(6,11,8); scene.add(keyL);
const fillL = new THREE.DirectionalLight(0x9ec3ff, 0.4); fillL.position.set(-8,4,-6); scene.add(fillL);
const rimL  = new THREE.DirectionalLight(0xffd9b0, 0.35); rimL.position.set(0,3,-10); scene.add(rimL);
const lampLight = new THREE.PointLight(0xffe9a0, 0, 5); scene.add(lampLight);

(function environment(){
  const env = new THREE.Scene();
  const box = new THREE.BoxGeometry(1,1,1);
  env.add(new THREE.Mesh(new THREE.BoxGeometry(24,14,24),
    new THREE.MeshBasicMaterial({color:0x1d2634, side:THREE.BackSide})));
  const panel=(hex,gain,x,y,z,sx,sy,sz)=>{
    const m=new THREE.Mesh(box,new THREE.MeshBasicMaterial({color:hex}));
    m.material.color.multiplyScalar(gain);
    m.position.set(x,y,z); m.scale.set(sx,sy,sz); env.add(m);
  };
  panel(0xffffff,1.1,  0, 6.6,  0, 11,0.1,11);
  panel(0xbcd6ff,1.3, -9, 1.0,  0, 0.1,9,16);
  panel(0xffd7b0,0.9,  9, 1.0,  2, 0.1,9,16);
  panel(0x8fb0e0,0.5,  0, 0.0,-10, 18,9,0.1);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(env, 0.04).texture;
  pmrem.dispose();
})();

/* ---------- shared helpers ---------- */
const SPH = new THREE.SphereGeometry(1,32,24);
const SPH_LO = new THREE.SphereGeometry(1,16,12);
const CYL = new THREE.CylinderGeometry(1,1,1,20,1,false);

function atom(color, radius, opts={}){
  const mat = new THREE.MeshStandardMaterial({
    color, roughness: opts.rough ?? 0.35, metalness: opts.metal ?? 0.25,
    emissive: new THREE.Color(color).multiplyScalar(opts.glow ?? 0.06)
  });
  if(opts.op !== undefined && opts.op < 1){ mat.transparent = true; mat.opacity = opts.op; }
  const m = new THREE.Mesh(opts.lo?SPH_LO:SPH, mat);
  m.scale.setScalar(radius);
  return m;
}

function electron(){
  const g = new THREE.Group();
  const core = new THREE.Mesh(SPH_LO, new THREE.MeshStandardMaterial({
    color:0xfff6d0, emissive:E_COL, roughness:0.3, metalness:0,
    transparent:true, opacity:1
  }));
  core.scale.setScalar(0.15);
  const halo = new THREE.Mesh(SPH_LO, new THREE.MeshBasicMaterial({
    color:E_COL, transparent:true, opacity:0.20,
    blending:THREE.AdditiveBlending, depthWrite:false
  }));
  halo.scale.setScalar(0.36);
  g.add(core, halo);
  g.userData.core = core; g.userData.halo = halo;
  return g;
}
function electronFade(e, a){
  e.userData.core.material.opacity = a;
  e.userData.halo.material.opacity = 0.20*a;
  e.visible = a > 0.02;
}

function bond(color=0xa9b6c6, radius=0.11){
  const m = new THREE.Mesh(CYL, new THREE.MeshStandardMaterial({
    color, roughness:0.5, metalness:0.1, transparent:true, opacity:1
  }));
  m.userData.radius = radius;
  return m;
}
const _v1=new THREE.Vector3(), _up=new THREE.Vector3(0,1,0);
function placeBond(mesh, a, b, shrink=0){
  const dir = new THREE.Vector3().subVectors(b,a);
  const len = Math.max(dir.length()-shrink*2, 0.001);
  mesh.position.copy(a).addScaledVector(dir,0.5);
  mesh.scale.set(mesh.userData.radius, len, mesh.userData.radius);
  mesh.quaternion.setFromUnitVectors(_up, dir.normalize());
}
function tubeSeg(a, b, r, mat){
  const m = new THREE.Mesh(CYL, mat);
  m.userData.radius = r;
  placeBond(m, a, b, 0);
  return m;
}

function label(text, color='#eef2f7', size=54){
  const pad=16, c=document.createElement('canvas'), ctx=c.getContext('2d');
  const font = `600 ${size}px "Iowan Old Style", Charter, Georgia, serif`;
  ctx.font=font; const w=Math.ceil(ctx.measureText(text).width)+pad*2;
  c.width=w; c.height=size+pad*2;
  ctx.font=font; ctx.textBaseline='middle'; ctx.textAlign='center';
  ctx.shadowColor='rgba(0,0,0,.9)'; ctx.shadowBlur=14;
  ctx.fillStyle=color; ctx.fillText(text, c.width/2, c.height/2);
  const tex = new THREE.CanvasTexture(c); tex.anisotropy=4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false, opacity:0}));
  sp.renderOrder = 10;
  sp.scale.set(c.width/c.height*0.62, 0.62, 1);
  return sp;
}

const GLOW_TEX = (function(){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(0.3,'rgba(240,240,240,.5)');
  g.addColorStop(1,'rgba(200,200,200,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
})();

function lerp(a,b,t){ return a+(b-a)*t; }
function clamp01(x){ return Math.max(0,Math.min(1,x)); }
function smooth(x){ x=clamp01(x); return x*x*(3-2*x); }
function ramp(t,a,b){ return smooth((t-a)/(b-a)); }

/* The other half of colour management. r128 uses a material colour in the
   lighting maths as if it were already linear, but hex codes are picked by eye
   and so are sRGB. Setting outputEncoding WITHOUT this leaves everything too
   light and desaturated. The flag keeps it idempotent, so rebuilding on a
   species change cannot double-convert. Colours rewritten every frame convert
   at the point of assignment instead. */
function linearise(root){
  root.traverse(o=>{
    if(!o.material) return;
    (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{
      if(!m || m.userData.__lin) return;
      m.userData.__lin = true;
      if(m.color)    m.color.convertSRGBToLinear();
      if(m.emissive) m.emissive.convertSRGBToLinear();
    });
  });
}

function clearGroup(g){
  for(let i=g.children.length-1;i>=0;i--){
    const c = g.children[i];
    g.remove(c);
    c.traverse(o=>{
      if(o.material){
        if(o.material.map && o.material.map !== GLOW_TEX) o.material.map.dispose();
        o.material.dispose();
      }
    });
  }
}
function rng(seed){
  let s = seed>>>0;
  return ()=>{ s = (s*1664525 + 1013904223)>>>0; return s/4294967296; };
}

===================================================================== */
const macro = new THREE.Group(); scene.add(macro);

/* The bench gets a radial falloff painted into its colour map. Once the output
   is correctly sRGB-encoded even a near-black albedo lifts to a visible grey,
   and a flat 18-metre disc then sweeps across the lower frame as a pale dome.
   Darkening it further is not the fix; making it a pool of light is. A
   cylinder's cap UVs are a circle inscribed in the 0..1 square, so a radial
   gradient lands exactly on the disc. */
const benchMap = (function(){
  const S = 512, c = document.createElement('canvas');
  c.width = c.height = S;
  const x = c.getContext('2d');
  x.fillStyle = '#000'; x.fillRect(0,0,S,S);
  const g = x.createRadialGradient(S/2,S/2,0, S/2,S/2,S*0.5);
  g.addColorStop(0.00, 'rgba(255,255,255,1)');
  g.addColorStop(0.11, 'rgba(226,232,242,0.80)');
  g.addColorStop(0.24, 'rgba(140,152,172,0.26)');
  g.addColorStop(0.36, 'rgba(56,64,78,0.06)');
  g.addColorStop(0.50, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0,0,S,S);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  return t;
})();
const bench = new THREE.Mesh(
  new THREE.CylinderGeometry(9,9,0.35,64),
  new THREE.MeshStandardMaterial({color:0x4a515d, map:benchMap,
    roughness:0.94, metalness:0, envMapIntensity:0.10})
);
bench.position.y=-0.175; macro.add(bench);

/* Transparent surfaces are the one thing WebGL cannot sort for you. Three.js
   orders them back-to-front by the distance to each object's ORIGIN, which is
   useless here: the beaker, its liquid and the two tubes all sit on the same
   axis at z = 0, so their origins are all about the same distance away and the
   order comes out arbitrary — and, worse, stable enough to look deliberate.
   Whichever shell won the toss wrote depth and stamped the tubes out of the
   picture wherever they lay behind the liquid.

   So the glass and the liquid stop writing depth (nothing inside a beaker
   should be hidden by the beaker), and every transparent piece of the cell
   gets an explicit RENDER_ORDER, innermost first. Painting from the inside out
   means each outer shell tints what is already on screen, which is what
   looking through glass into a liquid actually does. Opaque things — the
   electrodes, the bench — still draw first and still occlude properly, because
   depth TESTING is untouched. */
const RENDER_ORDER = {
  bubble:   1,   // gas in the liquid, and the copper on the cathode
  tubeLiq:  2,   // the liquid standing inside each collecting tube
  tubeWall: 3,   // the tube itself
  liquid:   4,   // the bulk of the solution, and its surface
  beaker:   5    // the outermost wall
};

const glassMat = new THREE.MeshStandardMaterial({

const beakerBase = new THREE.Mesh(new THREE.CylinderGeometry(BK_R,BK_R,0.07,48), glassMat);
beakerBase.position.y = 0.035; beakerBase.renderOrder = RENDER_ORDER.beaker; macro.add(beakerBase);

liquid.position.y = LIQ_TOP/2; liquid.renderOrder = RENDER_ORDER.liquid; macro.add(liquid);

[[new THREE.Vector3(EL_X,EL_TOP,0), new THREE.Vector3(EL_X,EL_TOP+0.28,0), leadPos],
 [new THREE.Vector3(EL_X,EL_TOP+0.28,0), new THREE.Vector3(SUP_X+0.1,EL_TOP+0.28,0), leadPos],

/* bubbles off each electrode — only where a gas is actually made */
const bubbleGrp = new THREE.Group(); macro.add(bubbleGrp);
const ON_AT = 17.2;
let bubbles = [];
function buildBubbles(){
  clearGroup(bubbleGrp);
  bubbles = [];
  const rand = rng(20240914);
  /* hydrogen comes off twice as fast as oxygen, which is the 2:1 you see */
  const rate = {cath: METAL_WINS ? 0 : 1.0, an: HALIDE_WINS ? 0.85 : 0.5};
  [['cath',-EL_X,rate.cath],['an',EL_X,rate.an]].forEach(([which,x,r])=>{
    const n = Math.round(110*r);
    for(let i=0;i<n;i++){
      const m = new THREE.Mesh(SPH_LO, new THREE.MeshStandardMaterial({
        color:0xeaf4ff, roughness:0.05, metalness:0.1, transparent:true, opacity:0.5}));
      m.renderOrder = RENDER_ORDER.bubble;
      const b = {m, x, birth: ON_AT+0.5 + rand()*13.0,
                 ox:(rand()-0.5)*0.16, oz:(rand()-0.5)*0.16,
                 y0: EL_BOT + 0.25 + rand()*0.5,
                 sz:0.028+rand()*0.04, speed:0.7+rand()*0.5, ph:rand()*6.283};
      b.life = (TUBE_TOP-0.3 - b.y0)/b.speed;
      bubbleGrp.add(m); bubbles.push(b);
    }
  });
}
function updateBubbles(t){
  for(const b of bubbles){
    const age = t - b.birth;
    if(age < 0 || age > b.life + 0.2){ b.m.visible = false; continue; }
    b.m.visible = true;
    const rise = Math.min(age, b.life);
    b.m.position.set(b.x + b.ox + Math.sin(age*3+b.ph)*0.04,
                     b.y0 + b.speed*rise,
                     b.oz + Math.cos(age*2.6+b.ph)*0.04);
    b.m.scale.setScalar(b.sz);
    b.m.material.opacity = 0.5*(1 - clamp01((age-b.life)/0.2));
  }
}

/* =====================================================================
   MICRO 1 — what is actually in the solution: four kinds of ion
===================================================================== */
const micro1 = new THREE.Group(); micro1.position.y=MICRO1_Y; scene.add(micro1);
let M1 = {};

function makeSulfate(scale, op){
  const g = new THREE.Group();
  g.add(atom(EL.S.col, EL.S.r*scale, {rough:0.4, metal:0.2, op}));
  const d=1.28*scale, k=d/Math.sqrt(3);
  [[k,k,k],[k,-k,-k],[-k,k,-k],[-k,-k,k]].forEach(p=>{
    const o = atom(EL.O.col, 0.46*scale, {rough:0.28, metal:0.1, op});
    o.position.set(p[0],p[1],p[2]);
    const b = bond(0xa9b6c6, 0.12*scale);
    if(op !== undefined && op < 1) b.material.opacity = op;
    placeBond(b, new THREE.Vector3(), o.position, 0.05*scale);
    g.add(o,b);
  });
  return g;
}
function makeAnion(scale, op){
  if(AN.halide){
    const g = new THREE.Group();
    g.add(atom(AN.col, AN.ionR*scale, {rough:0.3, metal:0.12, op}));
    return g;
  }
  return makeSulfate(scale, op);
}
function makeHydroxide(scale, op){
  const g = new THREE.Group();
  g.add(atom(EL.O.col, EL.O.r*scale, {rough:0.3, op}));
  const h = atom(EL.H.col, EL.H.r*scale, {rough:0.3, op});
  h.position.set(0.62*scale, 0.46*scale, 0);
  const b = bond(0xa9b6c6, 0.10*scale);
  if(op !== undefined && op < 1) b.material.opacity = op;
  placeBond(b, new THREE.Vector3(), h.position, 0.05*scale);
  g.add(h,b);
  return g;
}
function makeWater(op){
  const g = new THREE.Group();
  g.add(atom(EL.O.col, 0.40, {rough:0.3, op}));
  const ang = 104.5*Math.PI/360;
  [-1,1].forEach(s=>{
    const h = atom(EL.H.col, 0.24, {rough:0.3, op, lo:true});
    h.position.set(Math.sin(ang)*s*0.78, Math.cos(ang)*0.78, 0);
    const b = bond(0x8c99aa, 0.07);
    b.material.transparent = true; b.material.opacity = op;
    placeBond(b, new THREE.Vector3(), h.position, 0.04);
    g.add(h,b);
  });
  return g;
}

function buildMicro1(){
  clearGroup(micro1);
  /* the four, held out in a row and named */
  const slots = [];
  const mk = (obj, x, text, col)=>{
    obj.position.set(x, 0, 0);
    micro1.add(obj);
    const lb = label(text, col, 46); lb.position.set(x, -2.3, 0);
    micro1.add(lb);
    slots.push({obj, lb, x});
  };
  const cg = new THREE.Group();
  cg.add(atom(CT.col, CT.ionR*1.5, {rough:0.3, metal:0.5}));
  mk(cg, -5.4, CT.ion, CT.lblCol);
  mk(makeAnion(1.2), -1.8, AN.label, AN.lblCol);
  const hg = new THREE.Group();
  hg.add(atom(EL.H.col, EL.H.r*1.5, {rough:0.3}));
  mk(hg, 1.8, 'H⁺', '#ff9c8e');
  mk(makeHydroxide(1.2), 5.2, 'OH⁻', '#9db4ff');

  const drifters = [];
  for(let i=0;i<10;i++){
    const w = makeWater(0.14); w.scale.setScalar(0.8);
    w.userData = {c:new THREE.Vector3((Math.random()-0.5)*14,(Math.random()-0.5)*8,-4-Math.random()*6),
                  a:0.8+Math.random()*0.8, ph:Math.random()*6.283, sp:0.3+Math.random()*0.5};
    micro1.add(w); drifters.push(w);
  }

  const lblFrom1 = label(`from the ${SO.formula}`,'#8c97a6',34);
  lblFrom1.position.set(-3.6, -3.1, 0);
  const lblFrom2 = label('from the water','#8c97a6',34);
  lblFrom2.position.set(3.5, -3.1, 0);
  const lblFour = label('four kinds of ion — and only two get discharged','#ffe9a8',38);
  lblFour.position.set(0, 3.2, 0);
  micro1.add(lblFrom1,lblFrom2,lblFour);

  M1 = {slots, drifters, lblFrom1, lblFrom2, lblFour};
}

function updateMicro1(t){
  const {slots, drifters, lblFrom1, lblFrom2, lblFour} = M1;
  const u = t - 7.0;
  slots.forEach((s,i)=>{
    s.obj.position.y = Math.sin(u*0.7 + i*1.4)*0.18;
    s.obj.rotation.y = u*(0.25 + i*0.05);
    s.obj.rotation.x = Math.sin(u*0.3+i)*0.25;
  });
  drifters.forEach(o=>{
    const d = o.userData;
    o.position.set(
      d.c.x + Math.sin(t*0.4*d.sp+d.ph)*d.a*1.5,
      d.c.y + Math.cos(t*0.34*d.sp+d.ph*1.3)*d.a*1.2,
      d.c.z + Math.sin(t*0.29*d.sp+d.ph*0.7)*d.a
    );
    o.rotation.y = t*0.2*d.sp;
  });
  const off = 1-ramp(t,15.0,15.8);
  slots.forEach((s,i)=> s.lb.material.opacity = ramp(t, 8.0+i*0.35, 9.0+i*0.35)*off);
  lblFrom1.material.opacity = ramp(t,10.4,11.4)*off*0.9;
  lblFrom2.material.opacity = ramp(t,11.0,12.0)*off*0.9;
  lblFour.material.opacity  = ramp(t,13.2,14.2)*off;
}

/* =====================================================================
   MICRO 2 — the cell, and the two contests
===================================================================== */
const micro2 = new THREE.Group(); micro2.position.y=MICRO2_Y; scene.add(micro2);
let M2 = {};

const V = (x,y,z)=>new THREE.Vector3(x,y,z);
const CATH_X = -7.4, AN_X = 7.4, FACE = 1.5;

function buildMicro2(){
  clearGroup(micro2);

  /* the electrodes */
  [[CATH_X],[AN_X]].forEach(([x])=>{
    const slab = new THREE.Mesh(new THREE.BoxGeometry(1.5, 9.5, 3.0), graphite.clone());
    slab.position.set(x,0,0); micro2.add(slab);
  });

  /* the external circuit */
  const wireMat = new THREE.MeshStandardMaterial({color:0x8b94a2, roughness:0.5, metalness:0.6});
  const WIRE = [V(AN_X,4.9,0), V(AN_X,7.6,0), V(0,9.0,0), V(CATH_X,7.6,0), V(CATH_X,4.9,0)];
  for(let i=0;i<WIRE.length-1;i++) micro2.add(tubeSeg(WIRE[i],WIRE[i+1],0.075,wireMat));
  const segLen = [];
  let total = 0;
  for(let i=0;i<WIRE.length-1;i++){ const l = WIRE[i].distanceTo(WIRE[i+1]); segLen.push(l); total += l; }
  const wireEs = [];
  for(let i=0;i<7;i++){ const e = electron(); electronFade(e,0); micro2.add(e); wireEs.push({e, off:i/7}); }

  /* the migrating crowd — all four kinds, going whichever way their charge says */
  const rand = rng(20240924);
  const crowd = [];
  for(let i=0;i<30;i++){
    const kind = i % 4;                 // cation, anion, H⁺, OH⁻
    const positive = (kind === 0 || kind === 2);
    let s;
    if(kind === 0){ s = new THREE.Group(); s.add(atom(CT.col, CT.ionR, {rough:0.3, metal:0.5, lo:true})); }
    else if(kind === 1){ s = makeAnion(0.85); }
    else if(kind === 2){ s = new THREE.Group(); s.add(atom(EL.H.col, EL.H.r, {rough:0.3, lo:true})); }
    else { s = makeHydroxide(0.85); }
    const x0 = (rand()-0.5)*9.5, y0 = (rand()-0.5)*7.0, z0 = (rand()-0.5)*2.4;
    const targetX = positive ? CATH_X + FACE : AN_X - FACE;
    const t0 = 35.0 + rand()*3.5;
    s.userData = {positive, start:V(x0,y0,z0), targetX, t0,
                  t1: t0 + Math.abs(targetX-x0)/1.4 + 1.0,
                  ph:rand()*6.283, sp:0.6+rand()*0.8, yEnd:y0+(rand()-0.5)*1.4};
    micro2.add(s); crowd.push(s);
  }

  /* ---- the cathode contest: a metal ion and two H⁺ both arrive ---- */
  const cCat = atom(CT.col, CT.ionR, {rough:0.3, metal:0.5});
  const cH   = [atom(EL.H.col, EL.H.r, {rough:0.3}), atom(EL.H.col, EL.H.r, {rough:0.3})];
  const cE   = [electron(), electron()];
  cE.forEach(e=>{ electronFade(e,0); micro2.add(e); });
  const hhBond = bond(0xd89a90, 0.09); hhBond.material.opacity = 0;
  micro2.add(cCat, cH[0], cH[1], hhBond);
  const deposit = [];
  for(let i=0;i<5;i++){
    const d = atom(CT.col, CT.r*0.8, {rough:0.35, metal:0.8, lo:true, op:0.001});
    d.position.set(CATH_X + 0.95 + (i%2)*0.45, -2.4 + Math.floor(i/2)*0.8, (i%3-1)*0.7);
    micro2.add(d); deposit.push(d);
  }

  /* ---- the anode contest: the salt's anion, and OH⁻ ---- */
  const aAn = [makeAnion(1.0), makeAnion(1.0)];
  aAn.forEach(a=>micro2.add(a));
  const xxBond = bond(0xa9b6c6, 0.12); xxBond.material.opacity = 0; micro2.add(xxBond);
  /* four hydroxides, for the oxygen route: 4OH⁻ → O₂ + 2H₂O + 4e⁻ */
  const ohO = [], ohH = [], ohB = [];
  for(let i=0;i<4;i++){
    ohO.push(atom(EL.O.col, O_ATOM_R, {rough:0.3}));
    ohH.push(atom(EL.H.col, EL.H.r, {rough:0.3}));
    const b = bond(0xa9b6c6, 0.09); ohB.push(b);
    micro2.add(ohO[i], ohH[i], b);
  }
  const ooBond = bond(0xa9b6c6, 0.11); ooBond.material.opacity = 0; micro2.add(ooBond);
  const wB = [bond(0xa9b6c6,0.09), bond(0xa9b6c6,0.09)];
  wB.forEach(b=>{ b.material.opacity = 0; micro2.add(b); });
  const aE = [];
  for(let i=0;i<4;i++){ const e = electron(); electronFade(e,0); micro2.add(e); aE.push(e); }

  const lbl = {
    cat:   label(CT.ion, CT.lblCol, 46),
    hp:    label('H⁺','#ff9c8e',46),
    an:    label(AN.label, AN.lblCol, 46),
    oh:    label('OH⁻','#9db4ff',46),
    win1:  label('discharged','#8fd3a8',40),
    lose1: label('turned away — stays in solution','#e89a8a',36),
    win2:  label('discharged','#8fd3a8',40),
    lose2: label('turned away — stays in solution','#e89a8a',36),
    prod1: label(METAL_WINS ? CT.sym : 'H₂', METAL_WINS?CT.lblCol:'#ffb7ab', 48),
    prod2: label(HALIDE_WINS ? AN.mol : 'O₂', HALIDE_WINS?AN.lblCol:'#9db4ff', 48),
    water: label('H₂O','#a9c4ff',42),
    left:  label(`left in solution: ${leftovers()}`,'#dfe7f2',38)
  };
  Object.values(lbl).forEach(l=>micro2.add(l));

  M2 = {WIRE,segLen,total,wireEs,crowd,cCat,cH,cE,hhBond,deposit,
        aAn,xxBond,ohO,ohH,ohB,ooBond,wB,aE,lbl};
}

const _wp = new THREE.Vector3();
function alongWire(u){
  const {WIRE,segLen,total} = M2;
  let d = clamp01(u)*total;
  for(let i=0;i<segLen.length;i++){
    if(d <= segLen[i] || i === segLen.length-1)
      return _wp.lerpVectors(WIRE[i], WIRE[i+1], clamp01(d/segLen[i]));
    d -= segLen[i];
  }
  return _wp.copy(WIRE[0]);
}

const _pa=new THREE.Vector3(), _pb=new THREE.Vector3();

function updateMicro2(t){
  const {wireEs,crowd,cCat,cH,cE,hhBond,deposit,
         aAn,xxBond,ohO,ohH,ohB,ooBond,wB,aE,lbl} = M2;

  /* --- the crowd, pulled by the field --- */
  crowd.forEach(s=>{
    const d = s.userData;
    const u = smooth((t - d.t0)/(d.t1 - d.t0));
    _pa.set(lerp(d.start.x, d.targetX, u), lerp(d.start.y, d.yEnd, u), d.start.z);
    _pa.x += Math.sin(t*0.9*d.sp + d.ph)*0.30*(1-u*0.7);
    _pa.y += Math.cos(t*0.8*d.sp + d.ph*1.3)*0.34;
    _pa.z += Math.sin(t*0.7*d.sp + d.ph*0.7)*0.28;
    s.position.copy(_pa);
    if(s.type === 'Group') s.rotation.y = t*0.3*d.sp;
  });

  /* ================= the cathode contest ================= */
  const arrive1 = ramp(t, 34.6, 39.4);
  const decided1= ramp(t, 40.0, 41.6);
  const reject1 = ramp(t, 41.4, 46.0);
  const took1   = ramp(t, 42.2, 44.4);
  const pair1   = ramp(t, 43.6, 46.0);
  const rise1   = Math.max(0, t - 46.6);
  const settle1 = ramp(t, 44.6, 47.6);

  /* the metal ion */
  _pa.set(lerp(5.0, CATH_X + FACE, arrive1), lerp(2.6, 1.35, arrive1), 0.5);
  _pa.y += Math.cos(t*0.8)*0.2*(1-decided1);
  if(METAL_WINS){
    if(settle1 > 0) _pa.lerp(V(CATH_X + 0.95, -1.2, 0.3), settle1);
  } else {
    /* turned away: back out into the solution */
    if(reject1 > 0) _pa.lerp(V(2.0, 3.4, 1.0), reject1);
  }
  cCat.position.copy(_pa);
  cCat.scale.setScalar(METAL_WINS ? lerp(CT.ionR, CT.r, took1) : CT.ionR);
  cCat.material.metalness = METAL_WINS ? lerp(0.5, 0.85, took1) : 0.5;

  /* the two H⁺ */
  const hPos = [];
  cH.forEach((h,k)=>{
    _pb.set(lerp(4.2 + k*0.8, CATH_X + FACE, arrive1),
            lerp(k? -2.8 : -1.2, k? -0.9 : 0.1, arrive1), k? -0.5 : 0.45);
    _pb.y += Math.sin(t*0.9 + k*2)*0.2*(1-decided1);
    if(METAL_WINS){
      if(reject1 > 0) _pb.lerp(V(2.6 + k*0.8, k? -3.6 : -2.8, 1.1), reject1);
    } else {
      const c = V(CATH_X + FACE - 0.4, 0.0, 0.4);
      c.y += rise1*0.95; c.x += rise1*0.3;
      _pb.lerp(_v1.copy(c).add(V(0, k? -0.37 : 0.37, 0)), pair1);
    }
    h.position.copy(_pb);
    h.scale.setScalar(METAL_WINS ? EL.H.r : lerp(EL.H.r, H_ATOM_R, took1));
    hPos.push(_pb.clone());
  });
  const hhOn = !METAL_WINS ? ramp(t, 45.0, 46.4) : 0;
  hhBond.material.opacity = hhOn;
  hhBond.visible = hhOn > 0.01;
  if(hhBond.visible) placeBond(hhBond, hPos[0], hPos[1], 0.05);

  /* two electrons out of the cathode, into whichever won */
  cE.forEach((e,k)=>{
    _v1.set(CATH_X + 0.78, 1.1 + (k? -0.6 : 0.6), 0.2);
    const target = METAL_WINS ? cCat.position : hPos[k];
    _v1.lerp(target, ramp(t, 41.8+k*0.3, 43.8+k*0.3));
    e.position.copy(_v1);
    electronFade(e, ramp(t, 41.2+k*0.3, 42.0+k*0.3) * (1 - ramp(t, 43.6+k*0.3, 44.4+k*0.3)));
  });
  deposit.forEach((d,i)=>{
    const on = METAL_WINS ? ramp(t, 47.0 + i*0.5, 48.2 + i*0.5) : 0;
    d.material.opacity = on*0.95;
    d.visible = on > 0.02;
  });

  /* ================= the anode contest ================= */
  const arrive2 = ramp(t, 44.6, 49.2);
  const decided2= ramp(t, 49.6, 51.0);
  const reject2 = ramp(t, 50.8, 55.4);
  const gave2   = ramp(t, 51.4, 53.6);
  const pair2   = ramp(t, 53.0, 55.6);
  const rise2   = Math.max(0, t - 56.0);

  /* the salt's anion — two of them, for the halide route */
  const anPos = [];
  aAn.forEach((a,k)=>{
    _pb.set(lerp(-4.6 - k*0.9, AN_X - FACE, arrive2),
            lerp(k? -2.6 : 2.8, k? -0.8 : 0.8, arrive2), k? -0.45 : 0.5);
    _pb.y += Math.sin(t*0.85 + k*2.2)*0.2*(1-decided2);
    if(HALIDE_WINS){
      const c = V(AN_X - FACE - 0.5, 0.1, 0.2);
      c.y += rise2*0.95; c.x -= rise2*0.3;
      _pb.lerp(_v1.copy(c).add(V(0, k? -0.66 : 0.66, 0)), pair2);
    } else {
      if(reject2 > 0) _pb.lerp(V(-2.4 - k*0.9, k? -3.4 : 3.4, 1.1), reject2);
    }
    a.position.copy(_pb);
    a.rotation.y = t*0.3 + k;
    a.scale.setScalar(HALIDE_WINS ? lerp(1, AN.r/AN.ionR, gave2) : 1);
    anPos.push(_pb.clone());
  });
  const xxOn = HALIDE_WINS ? ramp(t, 54.4, 56.0) : 0;
  xxBond.material.opacity = xxOn;
  xxBond.visible = xxOn > 0.01;
  if(xxBond.visible) placeBond(xxBond, anPos[0], anPos[1], 0.1);

  /* the four hydroxides.  If they win: two of them give up their hydrogens and
     pair as O₂, and the other two each take one of those hydrogens, making
     two waters.  4OH⁻ → O₂ + 2H₂O, with nothing left over. */
  const ohVisible = !HALIDE_WINS;
  for(let i=0;i<4;i++){
    const o = ohO[i], h = ohH[i];
    o.visible = h.visible = ohVisible;
    ohB[i].visible = ohVisible;
    if(!ohVisible) continue;
    const lane = (i - 1.5) * 1.5;
    _pa.set(lerp(-5.0 - i*0.5, AN_X - FACE, arrive2), lerp(lane*2.0, lane, arrive2), (i%2?0.4:-0.4));
    _pa.y += Math.sin(t*0.8 + i*1.7)*0.18*(1-decided2);
    /* i<2 give their hydrogen away and become the O₂; i>=2 keep theirs and
       collect a second one to become water */
    if(i < 2 && pair2 > 0){
      const c = V(AN_X - FACE - 0.6, 0.2, 0.25);
      c.y += rise2*0.95; c.x -= rise2*0.3;
      _pa.lerp(_v1.copy(c).add(V(0, i? -0.58 : 0.58, 0)), pair2);
    } else if(i >= 2 && pair2 > 0){
      _pa.lerp(V(AN_X - FACE - 1.2, (i===2? 2.6 : -2.6), 0.5), pair2*0.85);
    }
    o.position.copy(_pa);
    /* the hydrogen: stays put for i>=2; for i<2 it crosses to its partner */
    _pb.copy(_pa).add(V(0.58, 0.44, 0));
    if(i < 2 && pair2 > 0){
      const hostO = ohO[i + 2];
      _v1.copy(hostO.position).add(V(-0.58, 0.44, 0));
      _pb.lerp(_v1, pair2);
    }
    h.position.copy(_pb);
    /* its own O–H bond survives only if it keeps its hydrogen */
    const keep = (i >= 2) ? 1 : (1 - pair2);
    ohB[i].material.opacity = keep;
    ohB[i].visible = keep > 0.02;
    if(ohB[i].visible) placeBond(ohB[i], _pa, _pb, 0.05);
  }
  if(ohVisible){
    const ooOn = ramp(t, 54.6, 56.0);
    ooBond.material.opacity = ooOn;
    ooBond.visible = ooOn > 0.01;
    if(ooBond.visible) placeBond(ooBond, ohO[0].position, ohO[1].position, 0.06);
    /* the two new O–H bonds, on the waters */
    [0,1].forEach(k=>{
      const on = ramp(t, 54.2, 55.8);
      wB[k].material.opacity = on;
      wB[k].visible = on > 0.01;
      if(wB[k].visible) placeBond(wB[k], ohO[k+2].position, ohH[k].position, 0.05);
    });
  } else {
    ooBond.visible = false; wB.forEach(b=>b.visible = false);
  }

  /* electrons out of whichever won, into the anode */
  const nE = HALIDE_WINS ? 2 : 4;
  aE.forEach((e,k)=>{
    if(k >= nE){ electronFade(e, 0); return; }
    const src = HALIDE_WINS ? anPos[k] : ohO[k].position;
    _v1.copy(src).add(V(0.5, 0.3, 0.25));
    _v1.lerp(V(AN_X - 0.78, 0.4 + (k-1.5)*0.6, 0.2), ramp(t, 51.6+k*0.3, 53.8+k*0.3));
    e.position.copy(_v1);
    electronFade(e, ramp(t, 51.0+k*0.3, 51.8+k*0.3) * (1 - ramp(t, 53.6+k*0.3, 54.4+k*0.3)));
  });

  /* the current round the outside */
  const flowing = ramp(t, 41.0, 42.6);
  wireEs.forEach((w,i)=>{
    const u = ((t - 41.0)*0.13 + w.off) % 1;
    w.e.position.copy(alongWire(u));
    electronFade(w.e, flowing*0.95);
  });

  /* ================= labels ================= */
  const L = lbl;
  L.cat.material.opacity = ramp(t,35.4,36.4)*(1-(METAL_WINS?took1:reject1));
  L.cat.position.copy(cCat.position).add(_v1.set(0, CT.ionR+0.85, 0));
  L.hp.material.opacity = ramp(t,35.8,36.8)*(1-(METAL_WINS?reject1:took1));
  L.hp.position.copy(hPos[0]).add(_v1.set(0, 0.8, 0));
  L.win1.material.opacity = decided1*(1-ramp(t,47.0,48.0));
  L.win1.position.copy(METAL_WINS ? cCat.position : hPos[0]).add(_v1.set(-1.7,-0.1,0));
  L.lose1.material.opacity = decided1*(1-ramp(t,46.6,47.6));
  L.lose1.position.copy(METAL_WINS ? hPos[1] : cCat.position).add(_v1.set(1.9,-0.55,0));
  L.prod1.material.opacity = ramp(t,47.2,48.2)*(1-ramp(t,52.0,53.0));
  L.prod1.position.copy(METAL_WINS ? cCat.position : hPos[0]).add(_v1.set(0.3,1.1,0));

  L.an.material.opacity = ramp(t,45.6,46.6)*(1-(HALIDE_WINS?gave2:reject2));
  L.an.position.copy(anPos[0]).add(_v1.set(0, AN.ionR+0.85, 0));
  L.oh.material.opacity = ramp(t,46.0,47.0)*(1-(HALIDE_WINS?reject2:gave2));
  L.oh.position.copy(ohVisible ? ohO[0].position : anPos[1]).add(_v1.set(-1.0,0.9,0));
  L.win2.material.opacity = decided2*(1-ramp(t,56.6,57.6));
  L.win2.position.copy(HALIDE_WINS ? anPos[0] : ohO[0].position).add(_v1.set(1.8,-0.1,0));
  L.lose2.material.opacity = decided2*(1-ramp(t,56.2,57.2));
  L.lose2.position.copy(HALIDE_WINS ? (ohVisible?ohO[0].position:anPos[1]) : anPos[1])
    .add(_v1.set(-2.0,-0.55,0));
  L.prod2.material.opacity = ramp(t,56.4,57.4)*(1-ramp(t,61.0,62.0));
  L.prod2.position.copy(HALIDE_WINS ? anPos[0] : ohO[0].position).add(_v1.set(0.3,1.2,0));
  L.water.material.opacity = (!HALIDE_WINS) ? ramp(t,56.0,57.0)*(1-ramp(t,61.0,62.0)) : 0;
  L.water.position.copy(ohVisible ? ohO[2].position : V(0,0,0)).add(_v1.set(0.9,0.9,0));
  L.left.material.opacity = ramp(t,58.0,59.0)*(1-ramp(t,63.2,64.0));
  L.left.position.set(0, -5.0, 0);
}

const TRANSITIONS = [7.0, 16.0, 32.0];
const FADE = 0.55;

function worldAt(t){
  if(t < 7.0)  return 'macro';
  if(t < 16.0) return 'micro1';
  if(t < 32.0) return 'macro';
  return 'micro2';
}

const CAM = {

const camPos=new THREE.Vector3(), camTgt=new THREE.Vector3();
function sampleCam(t){
  const w = worldAt(t), keys = CAM[w];
  let i=0; while(i<keys.length-2 && t>=keys[i+1].t) i++;
  const a=keys[i], b=keys[Math.min(i+1,keys.length-1)];
  const u = b.t===a.t?0:smooth((t-a.t)/(b.t-a.t));
  const off = w==='micro1'?MICRO1_Y : w==='micro2'?MICRO2_Y : 0;
  camPos.set(lerp(a.p[0],b.p[0],u), lerp(a.p[1],b.p[1],u)+off, lerp(a.p[2],b.p[2],u));
  camTgt.set(lerp(a.l[0],b.l[0],u), lerp(a.l[1],b.l[1],u)+off, lerp(a.l[2],b.l[2],u));
}

/* ---------- macro animation ---------- */
function updateMacro(t){
  /* the lamp, on from the moment the supply is switched on */
  const lit = ramp(t, ON_AT-0.4, ON_AT+0.3);
  lamp.material.emissive.setRGB(lit*1.0, lit*0.85, lit*0.45);
    lamp.material.emissive.convertSRGBToLinear();   // rewritten each frame, so convert here
  lamp.material.color.setRGB(lerp(0.48,1.0,lit), lerp(0.42,0.95,lit), lerp(0.26,0.7,lit));
    lamp.material.color.convertSRGBToLinear();   // rewritten each frame, so convert here
  lampLight.position.copy(lamp.position);
  lampLight.intensity = lit*1.5;

  /* gas pushing the liquid down inside each tube */
  const run = ramp(t, ON_AT+0.4, 31.0);
  const fill = [METAL_WINS ? 0 : 1.0, HALIDE_WINS ? 0.92 : 0.5];
  tubes.forEach((tb,i)=>{
    const collected = run*fill[i]*1.55;
    const top = TUBE_TOP - 0.22 - collected;
    const h = Math.max(top - TUBE_BOT, 0.02);
    tb.inner.scale.y = h;
    tb.inner.position.y = TUBE_BOT + h/2;
  });

  /* the solution: copper sulfate loses its blue as the copper is taken out */
  const used = ramp(t, ON_AT+0.6, 30.0);
  if(SO.sol){
    liqMat.color.setRGB(
      lerp(SO.sol[0],0.87,used), lerp(SO.sol[1],0.91,used), lerp(SO.sol[2],0.96,used));
    liqMat.color.convertSRGBToLinear();   // rewritten each frame, so convert here
    liqMat.opacity = lerp(0.62,0.40,used);
  } else {
    liqMat.color.setRGB(0.58,0.72,0.84);
    liqMat.color.convertSRGBToLinear();   // rewritten each frame, so convert here
    liqMat.opacity = 0.40;
  }

  /* and a copper coating on the cathode, where copper is what is deposited */
  plate.material.opacity = METAL_WINS ? used*0.96 : 0;
  plate.material.color.setHex(CT.col);

  updateBubbles(t);
}

let yaw=0, pitch=0, dragging=false, lx=0, ly=0;
const el = renderer.domElement;
function down(x,y){dragging=true;lx=x;ly=y;el.style.cursor='grabbing';}
function move(x,y){
  if(!dragging) return;
  yaw   -= (x-lx)*0.005;
  pitch  = Math.max(-0.9, Math.min(0.9, pitch + (y-ly)*0.004));
  lx=x; ly=y;
}
function up(){dragging=false; el.style.cursor='grab';}
el.style.cursor='grab';
el.addEventListener('mousedown',e=>down(e.clientX,e.clientY));
addEventListener('mousemove',e=>move(e.clientX,e.clientY));
addEventListener('mouseup',up);
el.addEventListener('touchstart',e=>{down(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
el.addEventListener('touchmove',e=>{move(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
addEventListener('touchend',up);

const _sph = new THREE.Spherical();
function applyCamera(){
  const dir = camPos.clone().sub(camTgt);
  _sph.setFromVector3(dir);
  _sph.theta += yaw;
  _sph.phi = Math.max(0.12, Math.min(Math.PI-0.12, _sph.phi - pitch));
  dir.setFromSpherical(_sph);
  camera.position.copy(camTgt).add(dir);
  camera.lookAt(camTgt);
}

   UI
===================================================================== */
const capEl  = document.getElementById('caption');
const fadeEl = document.getElementById('fade');
const polesEl= document.getElementById('poles');
const rulesEl= document.getElementById('rules');
const ruleCat= document.getElementById('ruleCat');
const ruleAn = document.getElementById('ruleAn');
const playBtn= document.getElementById('play');
const scrub  = document.getElementById('scrub');
const clock  = document.getElementById('clock');
const keyEl  = document.getElementById('key');
const menuEl = document.getElementById('menu');
const gearEl = document.getElementById('gear');

let t = 0, playing = true, lastFrame = performance.now(), curSeg = -1;

playBtn.onclick = ()=>{ playing=!playing; playBtn.textContent = playing?'Pause':'Play'; };
document.getElementById('restart').onclick = ()=>{ t=0; curSeg=-1; playing=true; playBtn.textContent='Pause'; };
scrub.oninput = ()=>{ t = parseFloat(scrub.value); curSeg=-1; };
addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault(); playBtn.click(); }
  if(e.code==='ArrowRight'){ t = Math.min(TOTAL, t+2); curSeg=-1; }
  if(e.code==='ArrowLeft'){  t = Math.max(0, t-2);     curSeg=-1; }
  if(e.code==='Escape') setMenu(false);
});

function captionFor(time){
  let i=0; for(let k=0;k<SEGS.length;k++) if(time>=SEGS[k].t) i=k;
  return i;
}
function fadeAmount(time){
  let f=0;
  for(const T of TRANSITIONS) f = Math.max(f, 1 - Math.min(1, Math.abs(time-T)/FADE));
  return f;
}

const hexCss = k => '#'+k.toString(16).padStart(6,'0');

function buildLegend(){
  const rows = [{sym:CT.sym, name:CT.name, col:CT.col}];
  if(AN.halide) rows.push({sym:AN.sym, name:AN.name, col:AN.col});
  else rows.push({sym:'S', name:'sulfur', col:EL.S.col});
  rows.push({sym:'O', name:'oxygen', col:EL.O.col});
  rows.push({sym:'H', name:'hydrogen', col:EL.H.col});
  rows.push({sym:'e⁻', name:'electron', col:E_COL});
  keyEl.innerHTML = rows.map(r=>
    `<div><span class="dot" style="background:${hexCss(r.col)}"></span><b>${r.sym}</b> ${r.name}</div>`
  ).join('');
}

function buildRules(){
  ruleCat.innerHTML = '<b>rule at the cathode</b>' +
    (METAL_WINS
      ? `${cap1(CT.name)} is below hydrogen in the reactivity series, so the metal is discharged.`
      : `${cap1(CT.name)} is above hydrogen, so hydrogen is discharged and ${CT.ion} stays put.`);
  ruleAn.innerHTML = '<b>rule at the anode</b>' +
    (HALIDE_WINS
      ? `A concentrated halide solution gives the halogen — here, ${AN.molName}.`
      : `No halide, so OH⁻ from the water is discharged, giving oxygen.`);
}

function buildMenu(){
  document.getElementById('solOpts').innerHTML = Object.keys(SOLUTIONS).map(k=>
    `<button class="opt ${k===solKey?'on':''}" data-key="${k}">` +
    `<span class="f">${SOLUTIONS[k].formula}</span> · ${SOLUTIONS[k].name}</button>`
  ).join('');
  document.getElementById('menuEq').innerHTML =
    `<span class="el neg">at the cathode (−)</span>${atCathode()}<br>` +
    `<span class="el pos">at the anode (+)</span>${atAnode()}<br>` +
    `<span class="el">overall</span>${equation()}` +
    `<span>Four ions are present: ${CT.ion}, ${AN.label}, H⁺ and OH⁻. ` +
    `<i>Cathode:</i> the less reactive of the metal and hydrogen wins — ` +
    (METAL_WINS ? `${CT.name} is below hydrogen, so you get ${CT.name}.`
                : `${CT.name} is above hydrogen, so you get hydrogen.`) +
    ` <i>Anode:</i> ` +
    (HALIDE_WINS ? `a concentrated halide wins, so you get ${AN.molName}.`
                 : `no halide, so OH⁻ is discharged and you get oxygen.`) +
    ` Left in solution: ${leftovers()}.</span>`;
  menuEl.querySelectorAll('.opt').forEach(b=>{
    b.onclick = ()=>{ solKey = b.dataset.key; build(); playing = true; playBtn.textContent = 'Pause'; };
  });
}

function setMenu(open){
  menuEl.classList.toggle('open', open);
  gearEl.classList.toggle('open', open);
  if(open) buildMenu();
}
gearEl.onclick = ()=> setMenu(!menuEl.classList.contains('open'));

/* ---------- rebuild everything that depends on the solution ---------- */
function build(){
  derive();
  buildElectrodes();
  buildBubbles();
  buildMicro1();
  buildMicro2();
  buildCaptions();
  buildLegend();
  linearise(scene);      // authored colours are sRGB; the renderer wants linear
  buildRules();

  document.title = solKey === 'NaCl' ? 'Electrolysis of brine'
                                     : `Electrolysis of ${SO.name} solution`;
  document.getElementById('h1').textContent = solKey === 'NaCl'
    ? 'Electrolysis of brine' : `Electrolysis of ${SO.name} solution`;
  document.getElementById('subtitle').textContent = equation();
  scrub.style.setProperty('--hl', hexCss(CT.col));

  if(menuEl.classList.contains('open')) buildMenu();
  history.replaceState(null,'',`?solution=${solKey}`);

  t = 0; curSeg = -1;
}
build();

/* =====================================================================
   LOOP
===================================================================== */
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min((now-lastFrame)/1000, 1/24);
  lastFrame = now;

  if(playing){
    t += dt;
    if(t >= TOTAL){ t = TOTAL; playing=false; playBtn.textContent='Play'; }
  }

  updateMacro(t);
  updateMicro1(t);
  updateMicro2(t);
  sampleCam(t);
  applyCamera();

  const f = fadeAmount(t);
  fadeEl.style.opacity = f;
  const seg = captionFor(t);
  if(seg !== curSeg){ curSeg = seg; capEl.textContent = SEGS[seg].c; }
  capEl.style.opacity = 1 - f;
  const inCell = worldAt(t)==='micro2';
  polesEl.style.opacity = (inCell ? (1-f)*0.95 : 0).toFixed(3);
  /* the rules card comes up while each contest is being decided */
  const showRules = inCell ? Math.max(ramp(t,38.8,39.8)*(1-ramp(t,44.4,45.4)),
                                      ramp(t,49.0,50.0)*(1-ramp(t,55.8,56.8))) : 0;
  rulesEl.style.opacity = (showRules*(1-f)).toFixed(3);
  ruleCat.classList.toggle('on', t >= 38.8 && t < 45.4);
  ruleAn.classList.toggle('on', t >= 49.0 && t < 56.8);
  scrub.value = t;
  scrub.style.setProperty('--p', (t/TOTAL*100)+'%');
  clock.textContent = t.toFixed(1)+' / '+TOTAL.toFixed(1)+'s';

  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
