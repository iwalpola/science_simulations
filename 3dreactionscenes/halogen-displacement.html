<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halogen displacement</title>
<style>
  :root{
    --ink:#eef2f7;
    --dim:#93a2b6;
    --panel:rgba(10,14,21,.72);
    --line:rgba(147,162,182,.22);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:#080b11;color:var(--ink);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden;}
  #stage{position:fixed;inset:0;}
  canvas{display:block;}

  #fade{position:fixed;inset:0;background:#080b11;pointer-events:none;opacity:0;}

  .title{position:fixed;top:22px;left:26px;max-width:min(46ch,60vw);pointer-events:none;}
  .title h1{
    margin:0;
    font-family:"Iowan Old Style","Charter","Palatino Linotype",Georgia,serif;
    font-weight:600;font-size:23px;letter-spacing:.2px;line-height:1.25;
  }
  .title p{margin:6px 0 0;font-size:13px;line-height:1.5;color:var(--dim);}
  .eq{font-variant-numeric:tabular-nums;}
  .title a{pointer-events:auto;color:var(--dim);text-decoration:none;font-size:12px;
    border-bottom:1px solid rgba(147,162,182,.3);}
  .title a:hover{color:var(--ink);}

  #caption{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:112px;width:min(670px,92vw);text-align:center;pointer-events:none;
    font-family:"Iowan Old Style","Charter","Palatino Linotype",Georgia,serif;
    font-size:19px;line-height:1.45;
    text-shadow:0 2px 18px rgba(0,0,0,.85);
    transition:opacity .35s ease;
  }

  #bar{
    position:fixed;left:50%;transform:translateX(-50%);bottom:20px;
    width:min(720px,94vw);
    background:var(--panel);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;display:flex;align-items:center;gap:12px;
  }
  button{
    font:inherit;font-size:13px;color:var(--ink);
    background:rgba(255,255,255,.06);border:1px solid var(--line);
    border-radius:9px;padding:7px 13px;cursor:pointer;
    transition:background .15s ease,border-color .15s ease;
  }
  button:hover{background:rgba(255,255,255,.12);}
  button:focus-visible{outline:2px solid #7fb0ff;outline-offset:2px;}
  #play{min-width:74px;}
  #gear{padding:7px 11px;font-size:15px;line-height:1;}
  #gear.open{background:rgba(127,176,255,.2);border-color:rgba(127,176,255,.5);}
  #scrub{
    flex:1;appearance:none;height:4px;border-radius:4px;
    background:linear-gradient(90deg,var(--hl,#4fbf72) 0%,var(--hl,#4fbf72) var(--p,0%),rgba(255,255,255,.14) var(--p,0%));
    cursor:pointer;
  }
  #scrub::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;
    background:var(--ink);border:none;box-shadow:0 0 0 3px rgba(8,11,17,.6);}
  #scrub::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ink);border:none;}
  #clock{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:74px;text-align:right;}

  #key{
    position:fixed;right:24px;top:22px;
    background:var(--panel);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:12px;padding:11px 13px;
    font-size:12.5px;line-height:1.9;color:var(--dim);
  }
  #key div{display:flex;align-items:center;gap:8px;}
  .dot{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:inset -2px -2px 3px rgba(0,0,0,.45);}
  #key b{color:var(--ink);font-weight:600;}
  #hint{position:fixed;bottom:90px;right:24px;font-size:11.5px;color:var(--dim);opacity:.75;}

  /* ---- species menu ---- */
  #menu{
    position:fixed;left:50%;transform:translateX(-50%);bottom:86px;
    width:min(720px,94vw);
    background:var(--panel);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;display:none;gap:18px;
  }
  #menu.open{display:flex;flex-wrap:wrap;}
  #menu fieldset{border:none;margin:0;padding:0;flex:1;min-width:210px;}
  #menu legend{
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:#64748b;padding:0 0 8px;
  }
  .opts{display:flex;flex-wrap:wrap;gap:6px;}
  .opt{
    font:inherit;font-size:12.5px;padding:6px 11px;border-radius:8px;
    background:rgba(255,255,255,.05);border:1px solid var(--line);
    color:var(--dim);cursor:pointer;
  }
  .opt:hover{background:rgba(255,255,255,.1);color:var(--ink);}
  .opt.on{background:rgba(127,176,255,.18);border-color:rgba(127,176,255,.5);color:#dce9ff;}
  .opt .f{font-family:"Iowan Old Style","Charter",Georgia,serif;font-variant-numeric:tabular-nums;}
  #menuEq{
    flex-basis:100%;border-top:1px solid var(--line);padding-top:12px;margin:0;
    font-family:"Iowan Old Style","Charter",Georgia,serif;font-size:16px;
    color:var(--ink);font-variant-numeric:tabular-nums;
  }
  #menuEq span{color:#64748b;font-size:12px;display:block;margin-top:5px;
    font-family:ui-sans-serif,system-ui,sans-serif;line-height:1.5;}
  #menuEq b.no{color:#e89a8a;font-weight:600;}
  #menuEq b.yes{color:#8fd3a8;font-weight:600;}
  #menuEq i{color:#a8c9ff;font-style:normal;}

  @media (max-width:640px){
    .title h1{font-size:18px;} .title p{display:none;}
    #key{right:14px;top:14px;padding:8px 10px;font-size:11px;line-height:1.7;}
    #caption{font-size:16px;bottom:100px;}
    #hint{display:none;}
    #clock{display:none;}
    #menu{bottom:82px;padding:13px 14px;}
  }
  @media (prefers-reduced-motion:reduce){#caption{transition:none;}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="fade"></div>

<div class="title">
  <h1 id="h1">Chlorine in potassium bromide</h1>
  <p class="eq" id="subtitle">Cl₂ + 2KBr → 2KCl + Br₂</p>
  <p><a href="index.html">← All fourteen reactions</a></p>
</div>

<div id="key"></div>

<div id="caption"></div>
<div id="hint">Drag to look around</div>

<div id="menu">
  <fieldset>
    <legend>Halogen you add — most reactive first</legend>
    <div class="opts" id="halOpts"></div>
  </fieldset>
  <fieldset>
    <legend>Halide in the tube</legend>
    <div class="opts" id="salOpts"></div>
  </fieldset>
  <p id="menuEq"></p>
</div>

<div id="bar">
  <button id="play">Pause</button>
  <button id="restart">Restart</button>
  <input id="scrub" type="range" min="0" max="57" step="0.01" value="0" aria-label="Timeline">
  <span id="clock">0.0 / 57.0s</span>
  <button id="gear" title="Change the species" aria-label="Change the species">⚙</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------------------------------------------------------------------------
   SCENE 07 — halogen displacement,  X₂ + 2KY → 2KX + Y₂

   The mirror image of scene 06. There, a metal atom gave electrons away and a
   metal ion took them. Here a covalent molecule takes electrons and becomes
   two ions, while two ions give theirs up and become a covalent molecule. The
   electrons cross over in plain sight, and both species change size as they
   go: the halogen grows as it gains, the halide shrinks as it loses.

   Like scene 06 this has two paths. A halogen lower in the group cannot take
   electrons from a halide above it, so choosing that way round runs a shorter
   timeline in which the ions come up to the molecule, are refused, and drift
   away. That refusal is the lesson, so it is animated rather than hidden.

   Acts:
     0  – 7   macro: the tube of halide solution, the pipette
     7  – 15  micro 1: the halogen molecule and its shared pair
    15  – 28  macro: add it, and a colour comes up
    28  – end micro 2: the swap    (or the refusal)

   Everything is a closed-form function of t — no particle sim.
--------------------------------------------------------------------------- */

/* ======================= the species tables ======================= */

const EL = {               // the same palette as every other scene here
  O:  {name:'oxygen',   col:0x2f47b8, r:0.50},
  H:  {name:'hydrogen', col:0xd8402f, r:0.34},
  Cl: {name:'chlorine', col:0x4fbf72, r:0.62}
};
const E_COL = 0xffe070;
const COLOURLESS = [0.88,0.92,0.96];

/* react: position in the group — higher displaces lower.  An atom is smaller
   than its ion, because the extra electron pushes the shell out. */
const HALOGENS = {
  Cl: {sym:'Cl', name:'chlorine', mol:'Cl₂', ion:'Cl⁻', halide:'chloride',
       col:0x4fbf72, r:0.62, lblCol:'#8fe0a8', ionR:0.78, react:3,
       sol:[0.86,0.92,0.70], solWord:'very pale green'},
  Br: {sym:'Br', name:'bromine', mol:'Br₂', ion:'Br⁻', halide:'bromide',
       col:0xa8412a, r:0.72, lblCol:'#e09080', ionR:0.88, react:2,
       sol:[0.80,0.43,0.16], solWord:'orange'},
  I:  {sym:'I',  name:'iodine', mol:'I₂', ion:'I⁻', halide:'iodide',
       col:0x7a4fa8, r:0.82, lblCol:'#c0a0e0', ionR:0.98, react:1,
       sol:[0.42,0.27,0.22], solWord:'brown'}
};

/* potassium is the spectator throughout — it is in the tube at the start and
   still in the tube at the end */
const CATION = {sym:'K', name:'potassium', ion:'K⁺', col:0xcbb8d4, r:0.74, lblCol:'#e0d0e8'};

const qs = new URLSearchParams(location.search);
let halKey = HALOGENS[qs.get('halogen')] ? qs.get('halogen') : 'Cl';
let salKey = HALOGENS[qs.get('halide')]  ? qs.get('halide')  : 'Br';
let HX, HY, REACTS, SAME;

function derive(){
  HX = HALOGENS[halKey];          // the halogen you add
  HY = HALOGENS[salKey];          // the halide already in the tube
  SAME   = halKey === salKey;
  REACTS = HX.react > HY.react;
}

const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
const saltOf = h => `K${h.sym}`;
const equation = () => REACTS
  ? `${HX.mol} + 2${saltOf(HY)} → 2${saltOf(HX)} + ${HY.mol}`
  : `${HX.mol} + 2${saltOf(HY)} → no reaction`;
const ionicEq = () => `${HX.mol} + 2${HY.ion} → 2${HX.ion} + ${HY.mol}`;
const halves  = () =>
  `${HX.mol} + 2e⁻ → 2${HX.ion}     ·     2${HY.ion} → ${HY.mol} + 2e⁻`;

const MICRO1_Y =  400;   // the halogen molecule
const MICRO2_Y = -400;   // the swap

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080b11);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.05, 2000);

scene.add(new THREE.HemisphereLight(0x9fb4d0, 0x0a0d13, 0.6));
const keyL = new THREE.DirectionalLight(0xffffff, 0.95); keyL.position.set(6,11,8); scene.add(keyL);
const fill = new THREE.DirectionalLight(0x9ec3ff, 0.4); fill.position.set(-8,4,-6); scene.add(fill);
const rim  = new THREE.DirectionalLight(0xffd9b0, 0.35); rim.position.set(0,3,-10); scene.add(rim);

(function environment(){
  const env = new THREE.Scene();
  const box = new THREE.BoxGeometry(1,1,1);
  env.add(new THREE.Mesh(new THREE.BoxGeometry(24,14,24),
    new THREE.MeshBasicMaterial({color:0x1d2634, side:THREE.BackSide})));
  const panel=(hex,gain,x,y,z,sx,sy,sz)=>{
    const m=new THREE.Mesh(box,new THREE.MeshBasicMaterial({color:hex}));
    m.material.color.multiplyScalar(gain);
    m.position.set(x,y,z); m.scale.set(sx,sy,sz); env.add(m);
  };
  panel(0xffffff,3.2,  0, 6.6,  0, 11,0.1,11);
  panel(0xbcd6ff,1.3, -9, 1.0,  0, 0.1,9,16);
  panel(0xffd7b0,0.9,  9, 1.0,  2, 0.1,9,16);
  panel(0x8fb0e0,0.5,  0, 0.0,-10, 18,9,0.1);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(env, 0.04).texture;
  pmrem.dispose();
})();

/* ---------- shared helpers ---------- */
const SPH = new THREE.SphereGeometry(1,32,24);
const SPH_LO = new THREE.SphereGeometry(1,16,12);
const CYL = new THREE.CylinderGeometry(1,1,1,20,1,false);

function atom(color, radius, opts={}){
  const mat = new THREE.MeshStandardMaterial({
    color, roughness: opts.rough ?? 0.35, metalness: opts.metal ?? 0.25,
    emissive: new THREE.Color(color).multiplyScalar(0.06)
  });
  if(opts.op !== undefined && opts.op < 1){ mat.transparent = true; mat.opacity = opts.op; }
  const m = new THREE.Mesh(opts.lo?SPH_LO:SPH, mat);
  m.scale.setScalar(radius);
  return m;
}

function electron(){
  const g = new THREE.Group();
  const core = new THREE.Mesh(SPH_LO, new THREE.MeshStandardMaterial({
    color:0xfff6d0, emissive:E_COL, roughness:0.3, metalness:0,
    transparent:true, opacity:1
  }));
  core.scale.setScalar(0.17);
  const halo = new THREE.Mesh(SPH_LO, new THREE.MeshBasicMaterial({
    color:E_COL, transparent:true, opacity:0.20,
    blending:THREE.AdditiveBlending, depthWrite:false
  }));
  halo.scale.setScalar(0.40);
  g.add(core, halo);
  g.userData.core = core; g.userData.halo = halo;
  return g;
}
function electronFade(e, a){
  e.userData.core.material.opacity = a;
  e.userData.halo.material.opacity = 0.20*a;
  e.visible = a > 0.02;
}

function bond(color=0xa9b6c6, radius=0.13){
  const m = new THREE.Mesh(CYL, new THREE.MeshStandardMaterial({
    color, roughness:0.5, metalness:0.1, transparent:true, opacity:1
  }));
  m.userData.radius = radius;
  return m;
}
const _v1=new THREE.Vector3(), _up=new THREE.Vector3(0,1,0);
function placeBond(mesh, a, b, shrink=0){
  const dir = new THREE.Vector3().subVectors(b,a);
  const len = Math.max(dir.length()-shrink*2, 0.001);
  mesh.position.copy(a).addScaledVector(dir,0.5);
  mesh.scale.set(mesh.userData.radius, len, mesh.userData.radius);
  mesh.quaternion.setFromUnitVectors(_up, dir.normalize());
}

function label(text, color='#eef2f7', size=54){
  const pad=16, c=document.createElement('canvas'), ctx=c.getContext('2d');
  const font = `600 ${size}px "Iowan Old Style", Charter, Georgia, serif`;
  ctx.font=font; const w=Math.ceil(ctx.measureText(text).width)+pad*2;
  c.width=w; c.height=size+pad*2;
  ctx.font=font; ctx.textBaseline='middle'; ctx.textAlign='center';
  ctx.shadowColor='rgba(0,0,0,.9)'; ctx.shadowBlur=14;
  ctx.fillStyle=color; ctx.fillText(text, c.width/2, c.height/2);
  const tex = new THREE.CanvasTexture(c); tex.anisotropy=4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false, opacity:0}));
  sp.renderOrder = 10;
  sp.scale.set(c.width/c.height*0.62, 0.62, 1);
  return sp;
}
function lerp(a,b,t){ return a+(b-a)*t; }
function clamp01(x){ return Math.max(0,Math.min(1,x)); }
function smooth(x){ x=clamp01(x); return x*x*(3-2*x); }
function ramp(t,a,b){ return smooth((t-a)/(b-a)); }

function clearGroup(g){
  for(let i=g.children.length-1;i>=0;i--){
    const c = g.children[i];
    g.remove(c);
    c.traverse(o=>{
      if(o.material){
        if(o.material.map) o.material.map.dispose();
        o.material.dispose();
      }
    });
  }
}
function rng(seed){
  let s = seed>>>0;
  return ()=>{ s = (s*1664525 + 1013904223)>>>0; return s/4294967296; };
}

/* =====================================================================
   MACRO WORLD — bench, a test tube in a rack, a pipette above it
===================================================================== */
const macro = new THREE.Group(); scene.add(macro);

const bench = new THREE.Mesh(
  new THREE.CylinderGeometry(9,9,0.35,64),
  new THREE.MeshStandardMaterial({color:0x11151d, roughness:0.95, metalness:0})
);
bench.position.y=-0.175; macro.add(bench);

const TUBE_X = 0.9, TUBE_R = 0.42, LIQ_BOT = 0.42, LIQ_TOP = 1.86, TUBE_TOP = 2.95;
const tube = new THREE.Group(); tube.position.set(TUBE_X,0,0); macro.add(tube);

const glassMat = new THREE.MeshStandardMaterial({
  color:0xbfd6e8, roughness:0.07, metalness:0.0,
  transparent:true, opacity:0.20, side:THREE.DoubleSide
});
const tWall = new THREE.Mesh(
  new THREE.CylinderGeometry(TUBE_R,TUBE_R,TUBE_TOP-LIQ_BOT+0.1,40,1,true), glassMat);
tWall.position.y = LIQ_BOT + (TUBE_TOP-LIQ_BOT+0.1)/2 - 0.05; tube.add(tWall);
const tFoot = new THREE.Mesh(new THREE.SphereGeometry(TUBE_R,32,20,0,Math.PI*2,Math.PI/2,Math.PI/2), glassMat);
tFoot.position.y = LIQ_BOT; tube.add(tFoot);
const tLip = new THREE.Mesh(new THREE.TorusGeometry(TUBE_R,0.026,8,40),
  new THREE.MeshStandardMaterial({color:0xd8e6f2, roughness:0.15, metalness:0.1, transparent:true, opacity:0.5}));
tLip.rotation.x = Math.PI/2; tLip.position.y = TUBE_TOP; tube.add(tLip);

const liqMat = new THREE.MeshStandardMaterial({
  color:0xe0ebf6, roughness:0.1, metalness:0.0, transparent:true, opacity:0.45
});
const liq = new THREE.Mesh(new THREE.CylinderGeometry(TUBE_R-0.03,TUBE_R-0.03,LIQ_TOP-LIQ_BOT,40), liqMat);
liq.position.y = LIQ_BOT + (LIQ_TOP-LIQ_BOT)/2; tube.add(liq);
const liqFoot = new THREE.Mesh(
  new THREE.SphereGeometry(TUBE_R-0.03,28,18,0,Math.PI*2,Math.PI/2,Math.PI/2), liqMat);
liqFoot.position.y = LIQ_BOT; tube.add(liqFoot);
const liqTop = new THREE.Mesh(new THREE.CircleGeometry(TUBE_R-0.03,40),
  new THREE.MeshStandardMaterial({color:0xeaf3ff, roughness:0.05, metalness:0.2, transparent:true, opacity:0.4}));
liqTop.rotation.x = -Math.PI/2; liqTop.position.y = LIQ_TOP; tube.add(liqTop);

/* the rack it stands in */
const wood = new THREE.MeshStandardMaterial({color:0x3a3026, roughness:0.8, metalness:0.05});
const rackBase = new THREE.Mesh(new THREE.BoxGeometry(1.5,0.12,1.0), wood);
rackBase.position.set(TUBE_X,0.06,0); macro.add(rackBase);
const rackCollar = new THREE.Mesh(new THREE.TorusGeometry(TUBE_R+0.07,0.07,8,28), wood);
rackCollar.rotation.x = Math.PI/2; rackCollar.position.set(TUBE_X,1.05,0);
macro.add(rackCollar);
[[-0.62],[0.62]].forEach(([dx])=>{
  const post = new THREE.Mesh(new THREE.BoxGeometry(0.09,1.05,0.09), wood);
  post.position.set(TUBE_X+dx, 0.58, 0); macro.add(post);
});
const rackTop = new THREE.Mesh(new THREE.BoxGeometry(1.5,0.08,0.28), wood);
rackTop.position.set(TUBE_X,1.05,-0.36); macro.add(rackTop);

/* the pipette */
const pipette = new THREE.Group(); macro.add(pipette);
const pipStem = new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.018,1.1,16), glassMat);
pipStem.position.y = 0.55; pipette.add(pipStem);
const pipBulb = new THREE.Mesh(new THREE.SphereGeometry(0.17,20,14),
  new THREE.MeshStandardMaterial({color:0xd8e2ee, roughness:0.45, metalness:0.05,
    transparent:true, opacity:0.55}));
pipBulb.scale.set(1,1.3,1); pipBulb.position.y = 1.28; pipette.add(pipBulb);
const pipFill = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.7,14),
  new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.1, transparent:true, opacity:0.6}));
pipFill.position.y = 0.62; pipette.add(pipFill);

const PIP_REST = new THREE.Vector3(-1.5, 2.6, 0.4);
const PIP_OVER = new THREE.Vector3(TUBE_X, 3.25, 0);

/* drops of halogen water, each a closed-form function of t */
const dropGrp = new THREE.Group(); macro.add(dropGrp);
const DROP_A = 18.2, DROP_B = 21.4;
let drops = [];
function buildDrops(){
  clearGroup(dropGrp);
  drops = [];
  const rand = rng(20240907);
  for(let i=0;i<18;i++){
    const m = new THREE.Mesh(SPH_LO, new THREE.MeshStandardMaterial({
      color:new THREE.Color(HX.sol[0],HX.sol[1],HX.sol[2]),
      roughness:0.06, metalness:0.1, transparent:true, opacity:0.8
    }));
    m.scale.set(0.05,0.068,0.05);
    drops.push({m, birth: DROP_A + (i/18)*(DROP_B-DROP_A) + rand()*0.05, fall:0.34});
    dropGrp.add(m);
  }
}
function updateDrops(t){
  for(const d of drops){
    const age = t - d.birth;
    if(age < 0 || age > d.fall){ d.m.visible = false; continue; }
    d.m.visible = true;
    const u = age/d.fall;
    d.m.position.set(TUBE_X, lerp(PIP_OVER.y-0.08, LIQ_TOP, u*u), 0);
    d.m.material.opacity = 0.8*(1-u*u*0.35);
  }
}

/* =====================================================================
   MICRO 1 — the halogen molecule, and the pair it shares
===================================================================== */
const micro1 = new THREE.Group(); micro1.position.y=MICRO1_Y; scene.add(micro1);
let M1 = {};

function buildMicro1(){
  clearGroup(micro1);
  const SC = 1.9, d = HX.r*SC*0.95;
  const a1 = atom(HX.col, HX.r*SC, {rough:0.3, metal:0.15});
  const a2 = atom(HX.col, HX.r*SC, {rough:0.3, metal:0.15});
  a1.position.set(-d,0,0); a2.position.set(d,0,0);
  const b = bond(0xa9b6c6, 0.14);
  placeBond(b, a1.position, a2.position, 0.1);
  micro1.add(a1,a2,b);

  // the shared pair, circling the bond between them
  const shared = [];
  for(let i=0;i<2;i++){
    const e = electron(); electronFade(e, 0.95);
    e.userData = {ph: i*Math.PI};
    micro1.add(e); shared.push(e);
  }

  const lblMol = label(HX.mol, HX.lblCol, 58);  lblMol.position.set(0, d+1.5, 0);
  const lbl1 = label(HX.sym, HX.lblCol, 44);    lbl1.position.set(-d, -d-1.0, 0);
  const lbl2 = label(HX.sym, HX.lblCol, 44);    lbl2.position.set( d, -d-1.0, 0);
  const lblPair = label('one shared pair of electrons','#ffe9a8',40);
  lblPair.position.set(0, -d-2.1, 0);
  const lblShort= label('each atom is one electron short of a full shell','#dfe7f2',38);
  lblShort.position.set(0, d+2.6, 0);
  micro1.add(lblMol,lbl1,lbl2,lblPair,lblShort);

  M1 = {a1,a2,b,shared,lblMol,lbl1,lbl2,lblPair,lblShort,d};
}

function updateMicro1(t){
  const {shared, lblMol, lbl1, lbl2, lblPair, lblShort} = M1;
  const u = t - 7.0;
  micro1.rotation.y = Math.sin(u*0.24)*0.45;
  micro1.rotation.x = Math.sin(u*0.18)*0.12;
  shared.forEach(e=>{
    const a = u*1.5 + e.userData.ph;
    e.position.set(Math.sin(a)*0.22, Math.cos(a)*0.62, Math.sin(a)*0.62);
  });
  const off = 1-ramp(t,12.8,13.8);
  lblMol.material.opacity  = ramp(t,8.0,9.0)*off;
  lbl1.material.opacity    = ramp(t,8.0,9.0)*off;
  lbl2.material.opacity    = ramp(t,8.0,9.0)*off;
  lblPair.material.opacity = ramp(t,9.2,10.2)*off;
  lblShort.material.opacity= ramp(t,10.6,11.6)*off;
}

/* =====================================================================
   MICRO 2 — the swap, or the refusal
===================================================================== */
const micro2 = new THREE.Group(); micro2.position.y=MICRO2_Y; scene.add(micro2);
let M2 = {};

const V = (x,y,z)=>new THREE.Vector3(x,y,z);
const P = {
  molCentre: V( 1.20, 0.00, 0.00),   // the X₂ molecule, stood on end
  xEndA:     V( 3.70, 2.50,-0.30),   // where the two X⁻ ions go afterwards
  xEndB:     V( 3.90,-2.30,-0.40),
  yStartA:   V(-6.20, 3.30, 0.90),   // the two Y⁻ ions come in from the left
  yStartB:   V(-6.60,-3.50, 0.70),
  yFaceA:    V(-0.70, 1.90, 0.50),   // right up against the molecule
  yFaceB:    V(-0.70,-1.90, 0.40),
  yAwayA:    V(-5.40, 2.80, 1.40),   // where they go if they are refused
  yAwayB:    V(-5.80,-3.00, 1.20),
  yPair:     V(-2.00, 0.00, 0.60),   // where the two Y atoms join up
  kStartA:   V( 5.60, 2.60,-2.40),
  kStartB:   V( 6.00,-2.40,-2.20)
};
const Y_PAIR_OFF = 0.52;

function buildMicro2(){
  clearGroup(micro2);

  /* the X₂ molecule, stood vertically so both ends are reachable */
  const xA = atom(HX.col, HX.r, {rough:0.3, metal:0.15});
  const xB = atom(HX.col, HX.r, {rough:0.3, metal:0.15});
  const xx = bond(0xa9b6c6, 0.12);
  micro2.add(xA,xB,xx);

  /* the two halide ions, each carrying the spare electron it will hand over */
  const yA = atom(HY.col, HY.ionR, {rough:0.3, metal:0.12});
  const yB = atom(HY.col, HY.ionR, {rough:0.3, metal:0.12});
  const e1 = electron(), e2 = electron();
  electronFade(e1,0); electronFade(e2,0);
  const yy = bond(0xa9b6c6, 0.12); yy.material.opacity = 0;
  micro2.add(yA,yB,e1,e2,yy);

  /* potassium, which does nothing at all */
  const kA = atom(CATION.col, CATION.r, {rough:0.3, metal:0.5});
  const kB = atom(CATION.col, CATION.r, {rough:0.3, metal:0.5});
  micro2.add(kA,kB);
  const lblK = label(CATION.ion, CATION.lblCol);
  const lblSpect = label('spectator — takes no part','#7f8ca0',38);
  micro2.add(lblK,lblSpect);

  /* background crowd */
  const crowd = [];
  for(let i=0;i<4;i++){
    const g = new THREE.Group();
    const m1 = atom(HX.col, HX.r*0.9, {rough:0.3, lo:true});
    const m2 = atom(HX.col, HX.r*0.9, {rough:0.3, lo:true});
    m1.position.x = -HX.r*0.86; m2.position.x = HX.r*0.86;
    const bb = bond(0xa9b6c6, 0.10);
    placeBond(bb, m1.position, m2.position, 0.08);
    g.add(m1,m2,bb);
    g.userData = {base:V((Math.random()-0.5)*14,(Math.random()-0.5)*9,-5-Math.random()*6),
                  ph:Math.random()*6.283, sp:0.35+Math.random()*0.6};
    micro2.add(g); crowd.push(g);
  }
  for(let i=0;i<5;i++){
    const a = atom(HY.col, HY.ionR*0.9, {rough:0.3, lo:true});
    a.userData = {base:V((Math.random()-0.5)*14,(Math.random()-0.5)*9,-4-Math.random()*6),
                  ph:Math.random()*6.283, sp:0.4+Math.random()*0.7};
    micro2.add(a); crowd.push(a);
  }

  /* labels that cross-fade as identities change */
  const lblMol   = label(HX.mol, HX.lblCol, 50);
  const lblXionA = label(HX.ion, HX.lblCol), lblXionB = label(HX.ion, HX.lblCol);
  const lblYionA = label(HY.ion, HY.lblCol), lblYionB = label(HY.ion, HY.lblCol);
  const lblYmol  = label(HY.mol, HY.lblCol, 50);
  const lblE1 = label('e⁻','#ffe9a8',44), lblE2 = label('e⁻','#ffe9a8',44);
  const lblKept = label(`${HY.sym}⁻ keeps its electron`, HY.lblCol, 40);
  micro2.add(lblMol,lblXionA,lblXionB,lblYionA,lblYionB,lblYmol,lblE1,lblE2,lblKept);

  M2 = {xA,xB,xx,yA,yB,e1,e2,yy,kA,kB,lblK,lblSpect,crowd,
        lblMol,lblXionA,lblXionB,lblYionA,lblYionB,lblYmol,lblE1,lblE2,lblKept};
}

function path3(out, A,B,C, t, t0,t1,t2){
  if(t<=t1) out.lerpVectors(A,B,smooth((t-t0)/(t1-t0)));
  else out.lerpVectors(B,C,smooth((t-t1)/(t2-t1)));
}
const _pa=new THREE.Vector3(), _pb=new THREE.Vector3();

/* the bits that happen whichever way it goes */
function updateMicro2Common(t){
  const {kA,kB,lblK,lblSpect,crowd} = M2;
  [[kA,P.kStartA,0],[kB,P.kStartB,1]].forEach(([k,base,i])=>{
    k.position.set(
      base.x - (t-28)*0.10 + Math.sin(t*0.45+i*1.7)*0.8,
      base.y + Math.cos(t*0.38+i*1.3)*0.7,
      base.z + Math.sin(t*0.3+i)*0.6
    );
  });
  lblK.material.opacity = ramp(t,29.2,30.2)*(1-ramp(t, REACTS?51.0:37.0, REACTS?52.0:38.0));
  lblK.position.copy(kA.position).add(_v1.set(0,CATION.r+0.8,0));
  const specOn = ramp(t,30.4,31.4)*(1-ramp(t,35.0,36.0));
  lblSpect.material.opacity = specOn*0.9;
  lblSpect.position.copy(kA.position).add(_v1.set(1.3,-0.9,0));

  crowd.forEach(o=>{
    const u = o.userData;
    o.position.set(
      u.base.x + Math.sin(t*0.42*u.sp+u.ph)*1.5,
      u.base.y + Math.cos(t*0.35*u.sp+u.ph)*1.2,
      u.base.z + Math.sin(t*0.28*u.sp+u.ph*1.7)*1.2
    );
    if(o.type==='Group'){ o.rotation.y = t*0.25*u.sp; o.rotation.z = Math.sin(t*0.3+u.ph)*0.6; }
  });
}

/* ---- the swap ---- */
function updateSwap(t){
  const {xA,xB,xx,yA,yB,e1,e2,yy,
         lblMol,lblXionA,lblXionB,lblYionA,lblYionB,lblYmol,lblE1,lblE2} = M2;

  const gained   = ramp(t,40.5,43.0);     // X atoms become X⁻
  const bondGone = ramp(t,43.5,45.4);     // and so the X–X bond goes
  const apart    = ramp(t,44.6,50.0);     // the two X⁻ drift off
  const lost     = ramp(t,46.2,48.6);     // Y⁻ become Y atoms
  const pairUp   = ramp(t,47.4,51.0);     // and pair up
  const yyOn     = ramp(t,50.0,51.6);
  const drift    = Math.max(0, t-52.0);

  /* the halogen molecule, stood on end, opening out as it becomes two ions */
  const d = lerp(HX.r*0.95, HX.r*1.15, gained);
  _pa.copy(P.molCentre);
  _pa.y += Math.sin(t*0.7)*0.10;
  _pa.set(_pa.x, _pa.y + d, _pa.z);
  _pa.lerp(P.xEndA, apart);
  xA.position.copy(_pa);
  _pb.copy(P.molCentre);
  _pb.y += Math.sin(t*0.7)*0.10;
  _pb.set(_pb.x, _pb.y - d, _pb.z);
  _pb.lerp(P.xEndB, apart);
  xB.position.copy(_pb);
  // an ion is bigger than the atom it came from: the extra electron pushes out
  xA.scale.setScalar(lerp(HX.r, HX.ionR, gained));
  xB.scale.setScalar(lerp(HX.r, HX.ionR, gained));

  xx.material.opacity = 1 - bondGone;
  xx.visible = bondGone < 0.99;
  if(xx.visible) placeBond(xx, xA.position, xB.position, 0.1);

  /* the two halide ions: in, hand over, then pair up as a molecule */
  const yPos = [];
  [[yA,P.yStartA,P.yFaceA,+1,0],[yB,P.yStartB,P.yFaceB,-1,1]].forEach(([y,s,f,side,i])=>{
    path3(_pa, s, V(-3.2, f.y*1.2, f.z), f, t, 28, 32.5, 37.0);
    if(t > 37.0) _pa.y += Math.sin(t*2.6+i)*0.06*(1-pairUp);
    // once neutral they are drawn together instead
    const c = P.yPair.clone();
    c.x -= drift*0.22; c.y += Math.sin(t*1.3)*0.05*pairUp;
    _pa.lerp(_v1.copy(c).add(V(0, side*Y_PAIR_OFF, 0)), pairUp);
    y.position.copy(_pa);
    y.scale.setScalar(lerp(HY.ionR, HY.r, lost));   // loses its extra electron
    yPos.push(_pa.clone());
  });

  yy.material.opacity = yyOn;
  yy.visible = yyOn > 0.01;
  if(yy.visible) placeBond(yy, yPos[0], yPos[1], 0.1);

  /* the electrons: on the halide ions from the start, then handed over */
  const show   = ramp(t,31.0,32.0);
  const cross  = [ramp(t,37.2,40.6), ramp(t,37.6,41.0)];
  const eA = yPos[0].clone().add(V(HY.ionR*0.8, HY.ionR*0.7, 0.25));
  eA.x += Math.sin(t*2.2)*0.07; eA.y += Math.cos(t*2.0)*0.07;
  eA.lerp(xA.position, cross[0]);
  const eB = yPos[1].clone().add(V(HY.ionR*0.8,-HY.ionR*0.7, 0.25));
  eB.x += Math.cos(t*2.1)*0.07; eB.y += Math.sin(t*1.9)*0.07;
  eB.lerp(xB.position, cross[1]);
  e1.position.copy(eA); e2.position.copy(eB);
  electronFade(e1, show*(1-ramp(t,40.2,41.2)));
  electronFade(e2, show*(1-ramp(t,40.6,41.6)));

  /* labels */
  const molOn = ramp(t,28.8,29.8);
  lblMol.material.opacity = molOn*(1-gained);
  lblMol.position.set(P.molCentre.x + 1.3, P.molCentre.y + 0.1, P.molCentre.z);
  lblXionA.material.opacity = gained*(1-ramp(t,54.0,55.0));
  lblXionB.material.opacity = gained*(1-ramp(t,54.0,55.0));
  lblXionA.position.copy(xA.position).add(_v1.set(0.95,0.55,0));
  lblXionB.position.copy(xB.position).add(_v1.set(0.95,-0.55,0));

  const yOn = ramp(t,30.0,31.0);
  lblYionA.material.opacity = yOn*(1-lost);
  lblYionB.material.opacity = yOn*(1-lost);
  lblYionA.position.copy(yA.position).add(_v1.set(-0.95,0.5,0));
  lblYionB.position.copy(yB.position).add(_v1.set(-0.95,-0.5,0));
  lblYmol.material.opacity = ramp(t,51.4,52.4)*(1-ramp(t,55.6,56.6));
  lblYmol.position.copy(yPos[0]).add(_v1.set(-1.45,-0.45,0));

  const eLbl = ramp(t,32.0,33.0)*(1-ramp(t,39.4,40.2));
  lblE1.material.opacity = eLbl; lblE2.material.opacity = eLbl;
  lblE1.position.copy(eA).add(_v1.set(0.1,0.6,0));
  lblE2.position.copy(eB).add(_v1.set(0.1,0.6,0));
}

/* ---- the refusal: the ions come up, keep their electrons, and leave ---- */
function updateRefusal(t){
  const {xA,xB,xx,yA,yB,e1,e2,yy,
         lblMol,lblXionA,lblXionB,lblYionA,lblYionB,lblYmol,lblE1,lblE2,lblKept} = M2;

  /* the molecule is untouched throughout */
  const d = HX.r*0.95;
  const bob = Math.sin(t*0.7)*0.10;
  xA.position.set(P.molCentre.x, P.molCentre.y + bob + d, P.molCentre.z);
  xB.position.set(P.molCentre.x, P.molCentre.y + bob - d, P.molCentre.z);
  xA.scale.setScalar(HX.r); xB.scale.setScalar(HX.r);
  xx.material.opacity = 1; xx.visible = true;
  placeBond(xx, xA.position, xB.position, 0.1);

  /* the ions come right up, wait, and go back unchanged */
  const yPos = [];
  [[yA,P.yStartA,P.yFaceA,P.yAwayA,0],[yB,P.yStartB,P.yFaceB,P.yAwayB,1]].forEach(([y,s,f,away,i])=>{
    path3(_pa, s, V(-3.2, f.y*1.2, f.z), f, t, 28, 30.8, 33.4);
    if(t > 33.4 && t < 36.2) _pa.y += Math.sin(t*3.2+i)*0.07;
    if(t > 35.8) _pa.lerp(away, ramp(t,35.8,41.0));
    y.position.copy(_pa);
    y.scale.setScalar(HY.ionR);            // still an ion at the end
    yPos.push(_pa.clone());
  });

  /* the electrons stay exactly where they were */
  const show = ramp(t,30.6,31.6);
  const eA = yPos[0].clone().add(V(HY.ionR*0.8, HY.ionR*0.7, 0.25));
  const eB = yPos[1].clone().add(V(HY.ionR*0.8,-HY.ionR*0.7, 0.25));
  eA.x += Math.sin(t*2.2)*0.07; eB.x += Math.cos(t*2.1)*0.07;
  e1.position.copy(eA); e2.position.copy(eB);
  electronFade(e1, show*(1-ramp(t,39.5,40.5)));
  electronFade(e2, show*(1-ramp(t,39.5,40.5)));

  yy.visible = false;
  lblXionA.material.opacity = 0; lblXionB.material.opacity = 0;
  lblYmol.material.opacity = 0;

  lblMol.material.opacity = ramp(t,28.8,29.8)*(1-ramp(t,39.5,40.5));
  lblMol.position.set(P.molCentre.x + 1.3, P.molCentre.y + 0.1, P.molCentre.z);
  const yOn = ramp(t,30.0,31.0)*(1-ramp(t,39.5,40.5));
  lblYionA.material.opacity = yOn; lblYionB.material.opacity = yOn;
  lblYionA.position.copy(yA.position).add(_v1.set(-0.95,0.5,0));
  lblYionB.position.copy(yB.position).add(_v1.set(-0.95,-0.5,0));
  const eLbl = ramp(t,31.6,32.6)*(1-ramp(t,39.5,40.5));
  lblE1.material.opacity = eLbl; lblE2.material.opacity = eLbl;
  lblE1.position.copy(eA).add(_v1.set(0.1,0.6,0));
  lblE2.position.copy(eB).add(_v1.set(0.1,0.6,0));

  lblKept.material.opacity = ramp(t,35.4,36.4)*(1-ramp(t,39.5,40.5));
  lblKept.position.copy(yPos[0]).add(_v1.set(-0.4,1.25,0));
}

function updateMicro2(t){
  updateMicro2Common(t);
  if(REACTS) updateSwap(t); else updateRefusal(t);
}

  {t:37.2, p:[0.4,0.4,7.4],   l:[0.4,0.4,0.2]},
  {t:40.6, p:[1.0,0.3,7.8],   l:[1.2,0.2,0]},
  {t:43.6, p:[1.2,0.4,8.6],   l:[1.2,0.1,0]},
  {t:46.4, p:[-0.8,0.4,8.4],  l:[-1.2,0.1,0.3]},
  {t:49.6, p:[-1.4,0.5,7.8],  l:[-2.0,0.0,0.5]},
  {t:52.4, p:[-0.2,1.2,11.2], l:[-0.4,0.3,0.2]},
  {t:57.0, p:[0.8,1.6,13.6],  l:[0.2,0.2,0]}
];
const CAM_REFUSE = [
  {t:28.0, p:[0,0.6,13.4],    l:[0.2,0,0]},
  {t:30.6, p:[-2.0,1.2,10.0], l:[-1.2,1.0,0.3]},
  {t:33.2, p:[-0.4,0.5,8.2],  l:[0.2,0.3,0.3]},
  {t:35.8, p:[-0.6,0.5,7.8],  l:[-0.2,0.2,0.4]},
  {t:38.4, p:[-1.2,1.0,10.4], l:[-1.0,0.2,0.4]},
  {t:41.0, p:[0.2,1.4,12.8],  l:[0,0.2,0]}
];
let CAM = {macro:CAM_MACRO, micro1:CAM_MICRO1, micro2:CAM_SWAP};

const camPos=new THREE.Vector3(), camTgt=new THREE.Vector3();
function sampleCam(t){
  const w = worldAt(t), keys = CAM[w];
  let i=0; while(i<keys.length-2 && t>=keys[i+1].t) i++;
  const a=keys[i], b=keys[Math.min(i+1,keys.length-1)];
  const u = b.t===a.t?0:smooth((t-a.t)/(b.t-a.t));
  const off = w==='micro1'?MICRO1_Y : w==='micro2'?MICRO2_Y : 0;
  camPos.set(lerp(a.p[0],b.p[0],u), lerp(a.p[1],b.p[1],u)+off, lerp(a.p[2],b.p[2],u));
  camTgt.set(lerp(a.l[0],b.l[0],u), lerp(a.l[1],b.l[1],u)+off, lerp(a.l[2],b.l[2],u));
}

/* ---------- macro animation ---------- */
function updateMacro(t){
  const over = ramp(t,16.4,18.0);
  pipette.position.lerpVectors(PIP_REST, PIP_OVER, over);
  pipette.rotation.z = lerp(0.35, 0.0, over);
  const back = ramp(t,21.8,23.4);
  pipette.position.y += back*0.9;
  pipette.position.x -= back*2.2;
  pipette.rotation.z += back*0.4;
  // the pipette empties as it delivers
  const given = clamp01((t-DROP_A)/(DROP_B-DROP_A));
  pipFill.scale.y = lerp(1, 0.18, given);
  pipFill.position.y = 0.62 - (1-pipFill.scale.y)*0.35;
  pipFill.material.color.setRGB(HX.sol[0],HX.sol[1],HX.sol[2]);

  /* the colour in the tube: first what you added, then what was displaced */
  const added = ramp(t,18.2,21.4);
  const made  = REACTS ? ramp(t,21.8,26.6) : 0;
  const a = COLOURLESS, b = HX.sol, c = HY.sol;
  const r1 = lerp(a[0],b[0],added), g1 = lerp(a[1],b[1],added), b1 = lerp(a[2],b[2],added);
  liqMat.color.setRGB(lerp(r1,c[0],made), lerp(g1,c[1],made), lerp(b1,c[2],made));
  liqMat.opacity = lerp(lerp(0.42,0.52,added), 0.78, made);
  liqTop.material.opacity = lerp(0.4, 0.26, Math.max(added*0.5, made));

  updateDrops(t);
}

/* =====================================================================
   ORBIT-ISH DRAG
===================================================================== */
let yaw=0, pitch=0, dragging=false, lx=0, ly=0;
const el = renderer.domElement;
function down(x,y){dragging=true;lx=x;ly=y;el.style.cursor='grabbing';}
function move(x,y){
  if(!dragging) return;
  yaw   -= (x-lx)*0.005;
  pitch  = Math.max(-0.9, Math.min(0.9, pitch + (y-ly)*0.004));
  lx=x; ly=y;
}
function up(){dragging=false; el.style.cursor='grab';}
el.style.cursor='grab';
el.addEventListener('mousedown',e=>down(e.clientX,e.clientY));
addEventListener('mousemove',e=>move(e.clientX,e.clientY));
addEventListener('mouseup',up);
el.addEventListener('touchstart',e=>{down(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
el.addEventListener('touchmove',e=>{move(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
addEventListener('touchend',up);

const _sph = new THREE.Spherical();
function applyCamera(){
  const dir = camPos.clone().sub(camTgt);
  _sph.setFromVector3(dir);
  _sph.theta += yaw;
  _sph.phi = Math.max(0.12, Math.min(Math.PI-0.12, _sph.phi - pitch));
  dir.setFromSpherical(_sph);
  camera.position.copy(camTgt).add(dir);
  camera.lookAt(camTgt);
}

/* =====================================================================
   UI
===================================================================== */
const capEl  = document.getElementById('caption');
const fadeEl = document.getElementById('fade');
const playBtn= document.getElementById('play');
const scrub  = document.getElementById('scrub');
const clock  = document.getElementById('clock');
const keyEl  = document.getElementById('key');
const menuEl = document.getElementById('menu');
const gearEl = document.getElementById('gear');

let t = 0, playing = true, lastFrame = performance.now(), curSeg = -1;

playBtn.onclick = ()=>{ playing=!playing; playBtn.textContent = playing?'Pause':'Play'; };
document.getElementById('restart').onclick = ()=>{ t=0; curSeg=-1; playing=true; playBtn.textContent='Pause'; };
scrub.oninput = ()=>{ t = parseFloat(scrub.value); curSeg=-1; };
addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault(); playBtn.click(); }
  if(e.code==='ArrowRight'){ t = Math.min(TOTAL, t+2); curSeg=-1; }
  if(e.code==='ArrowLeft'){  t = Math.max(0, t-2);     curSeg=-1; }
  if(e.code==='Escape') setMenu(false);
});

function captionFor(time){
  let i=0; for(let k=0;k<SEGS.length;k++) if(time>=SEGS[k].t) i=k;
  return i;
}
function fadeAmount(time){
  let f=0;
  for(const T of TRANSITIONS) f = Math.max(f, 1 - Math.min(1, Math.abs(time-T)/FADE));
  return f;
}

const hexCss = n => '#'+n.toString(16).padStart(6,'0');

function buildLegend(){
  const rows = [{sym:HX.sym, name:HX.name, col:HX.col}];
  if(HY !== HX) rows.push({sym:HY.sym, name:HY.name, col:HY.col});
  rows.push({sym:CATION.sym, name:CATION.name, col:CATION.col});
  rows.push({sym:'e⁻', name:'electron', col:E_COL});
  keyEl.innerHTML = rows.map(r=>
    `<div><span class="dot" style="background:${hexCss(r.col)}"></span><b>${r.sym}</b> ${r.name}</div>`
  ).join('');
}

const byReactivity = Object.keys(HALOGENS).sort((a,b)=>HALOGENS[b].react-HALOGENS[a].react);

function buildMenu(){
  const mk = (cur, group, fmt) => byReactivity.map(k=>
    `<button class="opt ${k===cur?'on':''}" data-group="${group}" data-key="${k}">${fmt(HALOGENS[k])}</button>`
  ).join('');
  document.getElementById('halOpts').innerHTML =
    mk(halKey, 'hal', h=>`<span class="f">${h.mol}</span> · ${h.name}`);
  document.getElementById('salOpts').innerHTML =
    mk(salKey, 'sal', h=>`<span class="f">${saltOf(h)}</span> · ${h.halide}`);

  const verdict = REACTS
    ? `<b class="yes">Reacts.</b> ${cap1(HX.name)} is above ${HY.name} in the group, so it takes the electrons and pushes ${HY.name} out.`
    : SAME
      ? `<b class="no">No reaction.</b> The same halogen is on both sides — there is nothing to displace.`
      : `<b class="no">No reaction.</b> ${cap1(HX.name)} is below ${HY.name} in the group, so it cannot take the electrons off it.`;
  document.getElementById('menuEq').innerHTML =
    `${equation()}<span>${verdict}` +
    (REACTS? ` As ions: <i>${ionicEq()}</i>. The K⁺ never takes part.` : ``) +
    `</span>`;

  menuEl.querySelectorAll('.opt').forEach(b=>{
    b.onclick = ()=>{
      if(b.dataset.group==='hal') halKey = b.dataset.key; else salKey = b.dataset.key;
      build();
      playing = true; playBtn.textContent = 'Pause';
    };
  });
}

function setMenu(open){
  menuEl.classList.toggle('open', open);
  gearEl.classList.toggle('open', open);
  if(open) buildMenu();
}
gearEl.onclick = ()=> setMenu(!menuEl.classList.contains('open'));

/* ---------- rebuild everything that depends on the species ---------- */
function build(){
  derive();
  buildDrops();
  buildMicro1();
  buildMicro2();
  buildCaptions();                      // sets TOTAL too
  buildLegend();
  CAM = {macro:CAM_MACRO, micro1:CAM_MICRO1, micro2: REACTS?CAM_SWAP:CAM_REFUSE};

  document.title = `${cap1(HX.name)} + potassium ${HY.halide}`;
  document.getElementById('h1').textContent = `${cap1(HX.name)} in potassium ${HY.halide}`;
  document.getElementById('subtitle').textContent = equation();
  scrub.style.setProperty('--hl', hexCss(HX.col));
  scrub.max = TOTAL;

  if(menuEl.classList.contains('open')) buildMenu();
  history.replaceState(null,'',`?halogen=${halKey}&halide=${salKey}`);

  t = 0; curSeg = -1;
}
build();

/* =====================================================================
   LOOP
===================================================================== */
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min((now-lastFrame)/1000, 1/24);
  lastFrame = now;

  if(playing){
    t += dt;
    if(t >= TOTAL){ t = TOTAL; playing=false; playBtn.textContent='Play'; }
  }

  updateMacro(t);
  updateMicro1(t);
  updateMicro2(t);
  sampleCam(t);
  applyCamera();

  const f = fadeAmount(t);
  fadeEl.style.opacity = f;
  const seg = captionFor(t);
  if(seg !== curSeg){ curSeg = seg; capEl.textContent = SEGS[seg].c; }
  capEl.style.opacity = 1 - f;
  scrub.value = t;
  scrub.style.setProperty('--p', (t/TOTAL*100)+'%');
  clock.textContent = t.toFixed(1)+' / '+TOTAL.toFixed(1)+'s';

  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
