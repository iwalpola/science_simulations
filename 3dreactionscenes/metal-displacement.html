<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metal displacement</title>
<style>
  :root{
    --ink:#eef2f7;
    --dim:#93a2b6;
    --panel:rgba(10,14,21,.72);
    --line:rgba(147,162,182,.22);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:#080b11;color:var(--ink);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden;}
  #stage{position:fixed;inset:0;}
  canvas{display:block;}

  #fade{position:fixed;inset:0;background:#080b11;pointer-events:none;opacity:0;}

  .title{position:fixed;top:22px;left:26px;max-width:min(46ch,60vw);pointer-events:none;}
  .title h1{
    margin:0;
    font-family:"Iowan Old Style","Charter","Palatino Linotype",Georgia,serif;
    font-weight:600;font-size:23px;letter-spacing:.2px;line-height:1.25;
  }
  .title p{margin:6px 0 0;font-size:13px;line-height:1.5;color:var(--dim);}
  .eq{font-variant-numeric:tabular-nums;}
  .title a{pointer-events:auto;color:var(--dim);text-decoration:none;font-size:12px;
    border-bottom:1px solid rgba(147,162,182,.3);}
  .title a:hover{color:var(--ink);}

  #caption{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:112px;width:min(660px,92vw);text-align:center;pointer-events:none;
    font-family:"Iowan Old Style","Charter","Palatino Linotype",Georgia,serif;
    font-size:19px;line-height:1.45;
    text-shadow:0 2px 18px rgba(0,0,0,.85);
    transition:opacity .35s ease;
  }

  #bar{
    position:fixed;left:50%;transform:translateX(-50%);bottom:20px;
    width:min(720px,94vw);
    background:var(--panel);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;display:flex;align-items:center;gap:12px;
  }
  button{
    font:inherit;font-size:13px;color:var(--ink);
    background:rgba(255,255,255,.06);border:1px solid var(--line);
    border-radius:9px;padding:7px 13px;cursor:pointer;
    transition:background .15s ease,border-color .15s ease;
  }
  button:hover{background:rgba(255,255,255,.12);}
  button:focus-visible{outline:2px solid #7fb0ff;outline-offset:2px;}
  #play{min-width:74px;}
  #gear{padding:7px 11px;font-size:15px;line-height:1;}
  #gear.open{background:rgba(127,176,255,.2);border-color:rgba(127,176,255,.5);}
  #scrub{
    flex:1;appearance:none;height:4px;border-radius:4px;
    background:linear-gradient(90deg,var(--hl,#9fb0c2) 0%,var(--hl,#9fb0c2) var(--p,0%),rgba(255,255,255,.14) var(--p,0%));
    cursor:pointer;
  }
  #scrub::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;
    background:var(--ink);border:none;box-shadow:0 0 0 3px rgba(8,11,17,.6);}
  #scrub::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ink);border:none;}
  #clock{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:74px;text-align:right;}

  #key{
    position:fixed;right:24px;top:22px;
    background:var(--panel);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:12px;padding:11px 13px;
    font-size:12.5px;line-height:1.9;color:var(--dim);
  }
  #key div{display:flex;align-items:center;gap:8px;}
  .dot{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:inset -2px -2px 3px rgba(0,0,0,.45);}
  #key b{color:var(--ink);font-weight:600;}
  #hint{position:fixed;bottom:90px;right:24px;font-size:11.5px;color:var(--dim);opacity:.75;}

  /* ---- species menu ---- */
  #menu{
    position:fixed;left:50%;transform:translateX(-50%);bottom:86px;
    width:min(720px,94vw);
    background:var(--panel);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;display:none;gap:18px;
  }
  #menu.open{display:flex;flex-wrap:wrap;}
  #menu fieldset{border:none;margin:0;padding:0;flex:1;min-width:210px;}
  #menu legend{
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:#64748b;padding:0 0 8px;
  }
  .opts{display:flex;flex-wrap:wrap;gap:6px;}
  .opt{
    font:inherit;font-size:12.5px;padding:6px 11px;border-radius:8px;
    background:rgba(255,255,255,.05);border:1px solid var(--line);
    color:var(--dim);cursor:pointer;
  }
  .opt:hover{background:rgba(255,255,255,.1);color:var(--ink);}
  .opt.on{background:rgba(127,176,255,.18);border-color:rgba(127,176,255,.5);color:#dce9ff;}
  .opt .f{font-family:"Iowan Old Style","Charter",Georgia,serif;font-variant-numeric:tabular-nums;}
  #menuEq{
    flex-basis:100%;border-top:1px solid var(--line);padding-top:12px;margin:0;
    font-family:"Iowan Old Style","Charter",Georgia,serif;font-size:16px;
    color:var(--ink);font-variant-numeric:tabular-nums;
  }
  #menuEq span{color:#64748b;font-size:12px;display:block;margin-top:5px;
    font-family:ui-sans-serif,system-ui,sans-serif;line-height:1.5;}
  #menuEq b.no{color:#e89a8a;font-weight:600;}
  #menuEq b.yes{color:#8fd3a8;font-weight:600;}

  @media (max-width:640px){
    .title h1{font-size:18px;} .title p{display:none;}
    #key{right:14px;top:14px;padding:8px 10px;font-size:11px;line-height:1.7;}
    #caption{font-size:16px;bottom:100px;}
    #hint{display:none;}
    #clock{display:none;}
    #menu{bottom:82px;padding:13px 14px;}
  }
  @media (prefers-reduced-motion:reduce){#caption{transition:none;}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="fade"></div>

<div class="title">
  <h1 id="h1">Zinc in copper sulfate</h1>
  <p class="eq" id="subtitle">Zn + CuSO₄ → ZnSO₄ + Cu</p>
  <p><a href="index.html">← All fourteen reactions</a></p>
</div>

<div id="key"></div>

<div id="caption"></div>
<div id="hint">Drag to look around</div>

<div id="menu">
  <fieldset>
    <legend>Metal you put in — most reactive first</legend>
    <div class="opts" id="metalOpts"></div>
  </fieldset>
  <fieldset>
    <legend>Solution it goes into</legend>
    <div class="opts" id="saltOpts"></div>
  </fieldset>
  <p id="menuEq"></p>
</div>

<div id="bar">
  <button id="play">Pause</button>
  <button id="restart">Restart</button>
  <input id="scrub" type="range" min="0" max="58" step="0.01" value="0" aria-label="Timeline">
  <span id="clock">0.0 / 58.0s</span>
  <button id="gear" title="Change the species" aria-label="Change the species">⚙</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------------------------------------------------------------------------
   SCENE 06 — metal displacement,  M + XSO₄ → MSO₄ + X

   The same electron machinery as scene 04, pointed somewhere new: instead of
   going to H⁺ and leaving as a gas, the two electrons go to a metal ion, which
   becomes an atom and joins the solid. One metal goes into solution, the other
   comes out of it.

   This scene has a second path. Whether anything happens at all depends on the
   reactivity series, so picking a metal that is LOWER than the one in solution
   runs a shorter timeline in which the ion comes to the surface, is refused,
   and drifts away. That refusal is the lesson, so it is animated rather than
   hidden behind a disabled menu option.

   Acts:
     0  – 7   macro: the strip, the coloured solution
     7  – 15  micro 1: the solution — metal ions and sulfate ions in water
    15  – 28  macro: lower it in; the colour fades and a coating appears
    28  – end micro 2: the swap, atom by atom     (or the refusal)

   Everything is a closed-form function of t, as in scene 04 — no particle sim,
   so scrubbing is instant and any frame is reproducible.
--------------------------------------------------------------------------- */

/* ======================= the species tables ======================= */

const EL = {               // the same palette as every other scene here
  O:  {name:'oxygen',   col:0x2f47b8, r:0.50},
  H:  {name:'hydrogen', col:0xd8402f, r:0.34},
  S:  {name:'sulfur',   col:0xe8c33a, r:0.60},
  Cl: {name:'chlorine', col:0x4fbf72, r:0.62}
};
const E_COL = 0xffe070;                 // electrons
const COLOURLESS = [0.87,0.91,0.96];    // what the liquid looks like with no ion colour

/* Every metal here is M²⁺, so one atom always trades exactly two electrons.
   `react` is position in the reactivity series — higher displaces lower. */
const METALS = {
  Mg: {sym:'Mg', name:'magnesium', full:'magnesium', ion:'Mg²⁺',
       col:0xc3cbd6, r:0.62, lblCol:'#dde6f0', react:4,
       sol:null,                solWord:'colourless', deposit:'silvery grey'},
  Zn: {sym:'Zn', name:'zinc', full:'zinc', ion:'Zn²⁺',
       col:0x9fb0c2, r:0.64, lblCol:'#cfe0f0', react:3,
       sol:null,                solWord:'colourless', deposit:'dull grey'},
  Fe: {sym:'Fe', name:'iron', full:'iron(II)', ion:'Fe²⁺',
       col:0x8f9298, r:0.64, lblCol:'#c8cdd4', react:2,
       sol:[0.45,0.72,0.52],    solWord:'pale green', deposit:'dark grey'},
  Cu: {sym:'Cu', name:'copper', full:'copper(II)', ion:'Cu²⁺',
       col:0xc8763c, r:0.66, lblCol:'#f0b07a', react:1,
       sol:[0.17,0.47,0.85],    solWord:'blue', deposit:'pink-brown'}
};

/* the anion is a spectator from beginning to end — it is the same sulfate
   before and after, and it never bonds to anything */
const ANION = {label:'SO₄²⁻', name:'sulfate', charge:-2, lblCol:'#f0dc86', labelY:2.1};

const qs = new URLSearchParams(location.search);
let metalKey = METALS[qs.get('metal')] ? qs.get('metal') : 'Zn';
let saltKey  = METALS[qs.get('salt')]  ? qs.get('salt')  : 'Cu';
let MT, SM, REACTS, SAME, GAP, RATE;

function derive(){
  MT = METALS[metalKey];          // the strip
  SM = METALS[saltKey];           // the metal ion in solution
  SAME   = metalKey === saltKey;
  REACTS = MT.react > SM.react;
  GAP    = MT.react - SM.react;
  RATE   = clamp01(GAP/3);        // how fast it plates out
}

const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
const saltOf = m => `${m.sym}SO₄`;
const saltName = m => `${m.full} sulfate`;
const equation = () => REACTS
  ? `${MT.sym} + ${saltOf(SM)} → ${saltOf(MT)} + ${SM.sym}`
  : `${MT.sym} + ${saltOf(SM)} → no reaction`;
const halves = () =>
  `${MT.sym} → ${MT.ion} + 2e⁻     ·     ${SM.ion} + 2e⁻ → ${SM.sym}`;
const solRGB = m => m.sol || COLOURLESS;
const colourChanges = () => {
  const a = solRGB(SM), b = solRGB(MT);
  return Math.abs(a[0]-b[0]) + Math.abs(a[1]-b[1]) + Math.abs(a[2]-b[2]) > 0.15;
};

const MICRO1_Y =  400;   // the solution
const MICRO2_Y = -400;   // the surface where it happens

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080b11);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.05, 2000);

scene.add(new THREE.HemisphereLight(0x9fb4d0, 0x0a0d13, 0.6));
const keyL = new THREE.DirectionalLight(0xffffff, 0.95); keyL.position.set(6,11,8); scene.add(keyL);
const fill = new THREE.DirectionalLight(0x9ec3ff, 0.4); fill.position.set(-8,4,-6); scene.add(fill);
const rim  = new THREE.DirectionalLight(0xffd9b0, 0.35); rim.position.set(0,3,-10); scene.add(rim);

(function environment(){
  const env = new THREE.Scene();
  const box = new THREE.BoxGeometry(1,1,1);
  env.add(new THREE.Mesh(new THREE.BoxGeometry(24,14,24),
    new THREE.MeshBasicMaterial({color:0x1d2634, side:THREE.BackSide})));
  const panel=(hex,gain,x,y,z,sx,sy,sz)=>{
    const m=new THREE.Mesh(box,new THREE.MeshBasicMaterial({color:hex}));
    m.material.color.multiplyScalar(gain);
    m.position.set(x,y,z); m.scale.set(sx,sy,sz); env.add(m);
  };
  panel(0xffffff,3.2,  0, 6.6,  0, 11,0.1,11);
  panel(0xbcd6ff,1.3, -9, 1.0,  0, 0.1,9,16);
  panel(0xffd7b0,0.9,  9, 1.0,  2, 0.1,9,16);
  panel(0x8fb0e0,0.5,  0, 0.0,-10, 18,9,0.1);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(env, 0.04).texture;
  pmrem.dispose();
})();

/* ---------- shared helpers ---------- */
const SPH = new THREE.SphereGeometry(1,32,24);
const SPH_LO = new THREE.SphereGeometry(1,16,12);
const CYL = new THREE.CylinderGeometry(1,1,1,20,1,false);

function atom(color, radius, opts={}){
  const mat = new THREE.MeshStandardMaterial({
    color, roughness: opts.rough ?? 0.35, metalness: opts.metal ?? 0.25,
    emissive: new THREE.Color(color).multiplyScalar(0.06)
  });
  if(opts.op !== undefined && opts.op < 1){ mat.transparent = true; mat.opacity = opts.op; }
  const m = new THREE.Mesh(opts.lo?SPH_LO:SPH, mat);
  m.scale.setScalar(radius);
  return m;
}

/* an electron: a bright core with an additive halo */
function electron(){
  const g = new THREE.Group();
  const core = new THREE.Mesh(SPH_LO, new THREE.MeshStandardMaterial({
    color:0xfff6d0, emissive:E_COL, roughness:0.3, metalness:0,
    transparent:true, opacity:1
  }));
  core.scale.setScalar(0.17);
  const halo = new THREE.Mesh(SPH_LO, new THREE.MeshBasicMaterial({
    color:E_COL, transparent:true, opacity:0.20,
    blending:THREE.AdditiveBlending, depthWrite:false
  }));
  halo.scale.setScalar(0.40);
  g.add(core, halo);
  g.userData.core = core; g.userData.halo = halo;
  return g;
}
function electronFade(e, a){
  e.userData.core.material.opacity = a;
  e.userData.halo.material.opacity = 0.20*a;
  e.visible = a > 0.02;
}

/* a soft coloured glow, used to show that a dissolved ion is what colours
   the water around it */
function glow(rgb, radius){
  const m = new THREE.Mesh(SPH_LO, new THREE.MeshBasicMaterial({
    color:new THREE.Color(rgb[0],rgb[1],rgb[2]), transparent:true, opacity:0.16,
    blending:THREE.AdditiveBlending, depthWrite:false
  }));
  m.scale.setScalar(radius);
  return m;
}

function bond(color=0xa9b6c6, radius=0.13){
  const m = new THREE.Mesh(CYL, new THREE.MeshStandardMaterial({
    color, roughness:0.5, metalness:0.1, transparent:true, opacity:1
  }));
  m.userData.radius = radius;
  return m;
}
const _v1=new THREE.Vector3(), _up=new THREE.Vector3(0,1,0);
function placeBond(mesh, a, b, shrink=0){
  const dir = new THREE.Vector3().subVectors(b,a);
  const len = Math.max(dir.length()-shrink*2, 0.001);
  mesh.position.copy(a).addScaledVector(dir,0.5);
  mesh.scale.set(mesh.userData.radius, len, mesh.userData.radius);
  mesh.quaternion.setFromUnitVectors(_up, dir.normalize());
}

function label(text, color='#eef2f7', size=54){
  const pad=16, c=document.createElement('canvas'), ctx=c.getContext('2d');
  const font = `600 ${size}px "Iowan Old Style", Charter, Georgia, serif`;
  ctx.font=font; const w=Math.ceil(ctx.measureText(text).width)+pad*2;
  c.width=w; c.height=size+pad*2;
  ctx.font=font; ctx.textBaseline='middle'; ctx.textAlign='center';
  ctx.shadowColor='rgba(0,0,0,.9)'; ctx.shadowBlur=14;
  ctx.fillStyle=color; ctx.fillText(text, c.width/2, c.height/2);
  const tex = new THREE.CanvasTexture(c); tex.anisotropy=4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false, opacity:0}));
  sp.renderOrder = 10;
  sp.scale.set(c.width/c.height*0.62, 0.62, 1);
  return sp;
}
function lerp(a,b,t){ return a+(b-a)*t; }
function clamp01(x){ return Math.max(0,Math.min(1,x)); }
function smooth(x){ x=clamp01(x); return x*x*(3-2*x); }
function ramp(t,a,b){ return smooth((t-a)/(b-a)); }

function clearGroup(g){
  for(let i=g.children.length-1;i>=0;i--){
    const c = g.children[i];
    g.remove(c);
    c.traverse(o=>{
      if(o.material){
        if(o.material.map) o.material.map.dispose();
        o.material.dispose();
      }
    });
  }
}

function rng(seed){
  let s = seed>>>0;
  return ()=>{ s = (s*1664525 + 1013904223)>>>0; return s/4294967296; };
}

/* =====================================================================
   MACRO WORLD — bench, beaker of coloured solution, tongs and the strip
===================================================================== */
const macro = new THREE.Group(); scene.add(macro);

const bench = new THREE.Mesh(
  new THREE.CylinderGeometry(9,9,0.35,64),
  new THREE.MeshStandardMaterial({color:0x11151d, roughness:0.95, metalness:0})
);
bench.position.y=-0.175; macro.add(bench);

const BEAKER_X = 1.7, R_IN = 1.18, LIQ_TOP = 1.75;
const beaker = new THREE.Group(); beaker.position.set(BEAKER_X,0,0); macro.add(beaker);

const glassMat = new THREE.MeshStandardMaterial({
  color:0xbfd6e8, roughness:0.08, metalness:0.0,
  transparent:true, opacity:0.2, side:THREE.DoubleSide
});
const wall = new THREE.Mesh(new THREE.CylinderGeometry(1.25,1.25,2.7,56,1,true), glassMat);
wall.position.y=1.35; beaker.add(wall);
const base = new THREE.Mesh(new THREE.CylinderGeometry(1.25,1.25,0.07,56), glassMat);
base.position.y=0.035; beaker.add(base);
const rimRing = new THREE.Mesh(new THREE.TorusGeometry(1.25,0.035,10,60),
  new THREE.MeshStandardMaterial({color:0xd8e6f2, roughness:0.15, metalness:0.1, transparent:true, opacity:0.5}));
rimRing.rotation.x=Math.PI/2; rimRing.position.y=2.7; beaker.add(rimRing);

const liquidMat = new THREE.MeshStandardMaterial({
  color:0xdfe9f5, roughness:0.12, metalness:0.0, transparent:true, opacity:0.4
});
const liquid = new THREE.Mesh(new THREE.CylinderGeometry(R_IN,R_IN,LIQ_TOP,56), liquidMat);
liquid.position.y=LIQ_TOP/2; beaker.add(liquid);
const surface = new THREE.Mesh(new THREE.CircleGeometry(R_IN,56),
  new THREE.MeshStandardMaterial({color:0xeaf3ff, roughness:0.05, metalness:0.2, transparent:true, opacity:0.42}));
surface.rotation.x=-Math.PI/2; surface.position.y=LIQ_TOP; beaker.add(surface);

/* --- tongs --- */
const tongs = new THREE.Group(); macro.add(tongs);
const steel = new THREE.MeshStandardMaterial({color:0xb9c3cf, metalness:0.9, roughness:0.22});
const armGeo = new THREE.BoxGeometry(0.065,2.2,0.16);
const armL = new THREE.Mesh(armGeo, steel), armR = new THREE.Mesh(armGeo, steel);
const ARM_TILT = 0.085;
[[armL,-1],[armR,1]].forEach(([a,s])=>{
  a.position.set(s*0.105, 1.1, 0);
  a.rotation.z = -s*ARM_TILT;
  tongs.add(a);
});
const yoke = new THREE.Mesh(new THREE.TorusGeometry(0.17,0.045,8,20,Math.PI), steel);
yoke.position.y = 2.2; tongs.add(yoke);

/* --- the strip, plus the coating that grows on it --- */
const STRIP_DIMS = [0.09, 1.30, 0.34];
let strip = null, coat = null;
function buildStrip(){
  [strip,coat].forEach(m=>{ if(m){ macro.remove(m); m.geometry.dispose(); m.material.dispose(); } });
  strip = new THREE.Mesh(
    new THREE.BoxGeometry(...STRIP_DIMS),
    new THREE.MeshStandardMaterial({color:MT.col, metalness:0.82, roughness:0.3})
  );
  macro.add(strip);
  // the displaced metal plates on as a slightly larger, matter shell
  coat = new THREE.Mesh(
    new THREE.BoxGeometry(STRIP_DIMS[0]+0.05, STRIP_DIMS[1]+0.02, STRIP_DIMS[2]+0.05),
    new THREE.MeshStandardMaterial({color:SM.col, metalness:0.45, roughness:0.72,
      transparent:true, opacity:0})
  );
  macro.add(coat);
}

/* --- flakes of the displaced metal that fall off and settle --- */
const flakeGrp = new THREE.Group(); beaker.add(flakeGrp);
const flakeGeo = new THREE.IcosahedronGeometry(0.05,0);
let flakes = [];
function buildFlakes(){
  clearGroup(flakeGrp);
  flakes = [];
  if(!REACTS) return;
  const n = Math.round(8 + 22*RATE);
  const rand = rng(20240906);
  for(let i=0;i<n;i++){
    const m = new THREE.Mesh(flakeGeo, new THREE.MeshStandardMaterial({
      color:SM.col, roughness:0.8, metalness:0.35
    }));
    m.scale.setScalar(0.5 + rand()*0.8);
    const a = rand()*Math.PI*2, r = Math.sqrt(rand())*R_IN*0.74;
    flakes.push({
      m,
      birth: 22.0 + rand()*5.2,
      y0: 0.45 + rand()*0.8,            // where on the strip it lets go
      x0: -0.30 + (rand()-0.5)*0.22,
      z0: (rand()-0.5)*0.26,
      xr: Math.cos(a)*r, zr: Math.sin(a)*r,   // where it lands
      spin: rand()*6.283, fall: 0.9 + rand()*0.7
    });
    flakeGrp.add(m);
  }
}
function updateFlakes(t){
  for(const f of flakes){
    const age = t - f.birth;
    if(age < 0){ f.m.visible = false; continue; }
    f.m.visible = true;
    const u = smooth(Math.min(1, age/f.fall));
    f.m.position.set(
      lerp(f.x0, f.xr, u),
      lerp(f.y0, 0.10, u*u),            // accelerating, then resting
      lerp(f.z0, f.zr, u)
    );
    f.m.rotation.set(f.spin + age*1.4, f.spin*2 + age*0.9, f.spin);
  }
}

/* =====================================================================
   MOLECULE BUILDERS
===================================================================== */
function makeSulfate(){
  const g = new THREE.Group();
  g.add(atom(EL.S.col, EL.S.r, {rough:0.4, metal:0.2}));
  const d=1.28, k=d/Math.sqrt(3);
  [[k,k,k],[k,-k,-k],[-k,k,-k],[-k,-k,k]].forEach(p=>{
    const o = atom(EL.O.col, 0.46, {rough:0.28, metal:0.1});
    o.position.set(p[0],p[1],p[2]);
    const b = bond(0xa9b6c6, 0.12); placeBond(b, new THREE.Vector3(), o.position, 0.05);
    g.add(o,b);
  });
  return g;
}

/* a water molecule, drawn faintly — enough to say "this is a solution" */
function makeWater(op){
  const g = new THREE.Group();
  g.add(atom(EL.O.col, 0.40, {rough:0.3, op}));
  const ang = 104.5*Math.PI/360;          // half the bond angle
  [[-1],[1]].forEach(([s])=>{
    const h = atom(EL.H.col, 0.24, {rough:0.3, op, lo:true});
    h.position.set(Math.sin(ang)*s*0.78, Math.cos(ang)*0.78, 0);
    const b = bond(0x8c99aa, 0.07);
    b.material.transparent = true; b.material.opacity = op;
    placeBond(b, new THREE.Vector3(), h.position, 0.04);
    g.add(h,b);
  });
  return g;
}

/* =====================================================================
   MICRO 1 — the solution: metal ions and sulfate ions, in water
===================================================================== */
const micro1 = new THREE.Group(); micro1.position.y=MICRO1_Y; scene.add(micro1);
let M1 = {};

function buildMicro1(){
  clearGroup(micro1);
  const drifters = [];

  // background water, so the ions are clearly dissolved in something
  for(let i=0;i<12;i++){
    const w = makeWater(0.16);
    w.scale.setScalar(0.8);
    w.userData = {c:new THREE.Vector3((Math.random()-0.5)*13,(Math.random()-0.5)*9,-3-Math.random()*7),
                  a:0.9+Math.random()*0.9, ph:Math.random()*6.283, sp:0.3+Math.random()*0.5};
    micro1.add(w); drifters.push(w);
  }
  // the ions that are actually in solution
  for(let i=0;i<7;i++){
    const ion = new THREE.Group();
    ion.add(atom(SM.col, SM.r*0.82, {rough:0.3, metal:0.5}));
    if(SM.sol) ion.add(glow(SM.sol, SM.r*2.4));
    ion.userData = {c:new THREE.Vector3((Math.random()-0.5)*12,(Math.random()-0.5)*8,-1-Math.random()*6),
                    a:0.7+Math.random()*0.9, ph:Math.random()*6.283, sp:0.35+Math.random()*0.5};
    micro1.add(ion); drifters.push(ion);
  }
  for(let i=0;i<5;i++){
    const s = makeSulfate(); s.scale.setScalar(0.8);
    s.userData = {c:new THREE.Vector3((Math.random()-0.5)*13,(Math.random()-0.5)*8,-2-Math.random()*7),
                  a:0.7+Math.random()*0.8, ph:Math.random()*6.283, sp:0.3+Math.random()*0.5};
    micro1.add(s); drifters.push(s);
  }

  // the two it is worth naming, held out in front
  const heroIon = new THREE.Group();
  heroIon.add(atom(SM.col, SM.r, {rough:0.28, metal:0.55}));
  if(SM.sol) heroIon.add(glow(SM.sol, SM.r*3.0));
  heroIon.position.set(-1.7, 0.1, 4.4);
  micro1.add(heroIon);

  const heroS = makeSulfate();
  heroS.position.set(1.9, -0.1, 4.2);
  micro1.add(heroS);

  const lblIon = label(SM.ion, SM.lblCol);          lblIon.position.set(-1.7, 1.5, 4.4);
  const lblS   = label(ANION.label, ANION.lblCol);  lblS.position.set(1.9, 1.9, 4.2);
  const lblSol = label(`${saltName(SM)} solution`,'#dfe7f2',42); lblSol.position.set(0, -2.1, 4.3);
  micro1.add(lblIon,lblS,lblSol);

  M1 = {drifters, heroIon, heroS, lblIon, lblS, lblSol};
}

function updateMicro1(t){
  const {drifters, heroIon, heroS, lblIon, lblS, lblSol} = M1;
  drifters.forEach(o=>{
    const d = o.userData;
    o.position.set(
      d.c.x + Math.sin(t*0.4*d.sp+d.ph)*d.a*1.6,
      d.c.y + Math.cos(t*0.34*d.sp+d.ph*1.3)*d.a*1.3,
      d.c.z + Math.sin(t*0.29*d.sp+d.ph*0.7)*d.a
    );
    o.rotation.y = t*0.22*d.sp;
    o.rotation.x = Math.sin(t*0.26+d.ph)*0.4;
  });
  const u = t - 7.0;
  heroIon.position.y = 0.1 + Math.sin(u*0.8)*0.12;
  heroIon.rotation.y = u*0.3;
  heroS.position.y = -0.1 + Math.cos(u*0.7)*0.12;
  heroS.rotation.y = u*0.34; heroS.rotation.x = Math.sin(u*0.4)*0.3;

  const off = 1-ramp(t,12.6,13.6);
  lblIon.material.opacity = ramp(t,8.0,9.0)*off;
  lblS.material.opacity   = ramp(t,8.6,9.6)*off;
  lblSol.material.opacity = ramp(t,10.4,11.4)*off;
}

/* =====================================================================
   MICRO 2 — the surface. Either the swap, or the refusal.
===================================================================== */
const micro2 = new THREE.Group(); micro2.position.y=MICRO2_Y; scene.add(micro2);
let M2 = {};

const V = (x,y,z)=>new THREE.Vector3(x,y,z);
const P = {
  heroHome: V(-4.95, 0.55, 0.85),     // the strip atom that leaves
  eParkA:   V(-6.10, 0.95, 0.40),     // where its electrons wait, in the metal
  eParkB:   V(-6.00,-0.30, 0.75),
  ionMid:   V(-2.30, 1.20,-0.50),
  ionEnd:   V( 2.20, 0.50, 0.20),
  inStart:  V( 5.80,-1.90, 1.70),     // the incoming ion from solution
  inMid:    V( 0.60,-1.30, 1.10),
  inFace:   V(-4.30,-0.58, 0.80),     // right up against the surface
  inSeat:   V(-5.00,-0.58, 0.78),     // the site it settles into
  inAway:   V( 4.20,-1.70, 1.90),     // where it goes if it is refused
  s4Start:  V( 6.40, 2.00,-2.30),
  s4Mid:    V( 1.60, 2.40,-2.70),
  s4End:    V(-1.80, 1.60,-2.50)
};

function buildMicro2(){
  clearGroup(micro2);

  // --- the strip, as a packed slab with its electrons inside ---
  const slab = new THREE.Group(); micro2.add(slab);
  for(let ix=0;ix<3;ix++) for(let iy=-2;iy<=2;iy++) for(let iz=-1;iz<=1;iz++){
    const a = atom(MT.col, MT.r, {rough:0.28, metal:0.72, lo:true});
    a.position.set(-7.4 + ix*0.9, iy*1.2 + (ix%2?0.25:0), iz*1.3 + (iy%2?0.3:0));
    slab.add(a);
  }
  const slabE = [];
  for(let i=0;i<16;i++){
    const e = electron(); electronFade(e, 0.8);
    e.userData = {...e.userData,
      c:V(-6.4 + (Math.random()-0.5)*1.8, (Math.random()-0.5)*4.4, (Math.random()-0.5)*2.6),
      ax:0.5+Math.random()*0.6, ay:0.7+Math.random()*1.1, az:0.4+Math.random()*0.6,
      fx:0.6+Math.random()*0.8, fy:0.5+Math.random()*0.8, fz:0.5+Math.random()*0.7,
      ph:Math.random()*6.283};
    slab.add(e); slabE.push(e);
  }

  // --- the cast ---
  const hero = atom(MT.col, MT.r, {rough:0.26, metal:0.75});      // strip atom → ion
  const e1 = electron(), e2 = electron();
  electronFade(e1,0); electronFade(e2,0);
  const inc = atom(SM.col, SM.r*0.82, {rough:0.28, metal:0.55});  // ion → atom
  const incGlow = SM.sol ? glow(SM.sol, SM.r*2.4) : null;
  micro2.add(hero,e1,e2,inc);
  if(incGlow) micro2.add(incGlow);

  // --- the spectator ---
  const s4 = makeSulfate(); micro2.add(s4);
  const lblS4 = label(ANION.label, ANION.lblCol); micro2.add(lblS4);
  const lblSpect = label('spectator — takes no part','#7f8ca0',38); micro2.add(lblSpect);

  // --- background crowd ---
  const crowd = [];
  for(let i=0;i<5;i++){
    const g = new THREE.Group();
    g.add(atom(SM.col, SM.r*0.82, {rough:0.3, metal:0.5, lo:true}));
    if(SM.sol) g.add(glow(SM.sol, SM.r*2.0));
    g.userData = {base:V(1+Math.random()*7,(Math.random()-0.5)*8,-4-Math.random()*6),
                  ph:Math.random()*6.283, sp:0.45+Math.random()*0.8};
    micro2.add(g); crowd.push(g);
  }
  for(let i=0;i<2;i++){
    const s = makeSulfate(); s.scale.setScalar(0.8);
    s.userData = {base:V(2+Math.random()*7,(Math.random()-0.5)*8,-6-Math.random()*5),
                  ph:Math.random()*6.283, sp:0.3+Math.random()*0.5};
    micro2.add(s); crowd.push(s);
  }

  // --- labels that cross-fade as identities change ---
  const lblMatom = label(MT.sym, MT.lblCol);
  const lblMion  = label(MT.ion, MT.lblCol);
  const lblXion  = label(SM.ion, SM.lblCol);
  const lblXatom = label(SM.sym, SM.lblCol);
  const lblE1 = label('e⁻','#ffe9a8',44), lblE2 = label('e⁻','#ffe9a8',44);
  const lblPlated = label(`${SM.name} metal — now part of the solid`, SM.lblCol, 40);
  const lblKept   = label(`${MT.sym} keeps its electrons`, MT.lblCol, 42);
  micro2.add(lblMatom,lblMion,lblXion,lblXatom,lblE1,lblE2,lblPlated,lblKept);

  M2 = {slab,slabE,hero,e1,e2,inc,incGlow,s4,lblS4,lblSpect,crowd,
        lblMatom,lblMion,lblXion,lblXatom,lblE1,lblE2,lblPlated,lblKept};
}

function path3(out, A,B,C, t, t0,t1,t2){
  if(t<=t1) out.lerpVectors(A,B,smooth((t-t0)/(t1-t0)));
  else out.lerpVectors(B,C,smooth((t-t1)/(t2-t1)));
}
const _pa=new THREE.Vector3();

/* the parts that are the same whichever way it goes */
function updateMicro2Common(t){
  const {slabE,s4,lblS4,lblSpect,crowd} = M2;
  slabE.forEach(e=>{
    const d = e.userData;
    e.position.set(d.c.x + Math.sin(t*d.fx+d.ph)*d.ax,
                   d.c.y + Math.cos(t*d.fy+d.ph*1.3)*d.ay,
                   d.c.z + Math.sin(t*d.fz+d.ph*0.7)*d.az);
  });
  path3(_pa, P.s4Start, P.s4Mid, P.s4End, t, 28, 40, REACTS?58:41);
  _pa.y += Math.sin(t*0.5)*0.18;
  s4.position.copy(_pa);
  s4.rotation.y = t*0.3; s4.rotation.x = Math.sin(t*0.35)*0.3;
  lblS4.position.set(_pa.x, _pa.y+ANION.labelY, _pa.z);
  lblS4.material.opacity = ramp(t,28.6,29.6);
  const specOn = ramp(t,29.8,30.8)*(1-ramp(t,35.0,36.0));
  lblSpect.material.opacity = specOn*0.9;
  lblSpect.position.copy(_pa).add(_v1.set(0,-ANION.labelY*0.8,0));

  crowd.forEach(o=>{
    const u = o.userData;
    o.position.set(
      u.base.x + Math.sin(t*0.42*u.sp+u.ph)*1.5,
      u.base.y + Math.cos(t*0.35*u.sp+u.ph)*1.2,
      u.base.z + Math.sin(t*0.28*u.sp+u.ph*1.7)*1.2
    );
    o.rotation.y = t*0.25*u.sp;
    o.rotation.x = Math.sin(t*0.3+u.ph)*0.5;
  });
}

/* ---- the swap ---- */
function updateSwap(t){
  const {hero,e1,e2,inc,incGlow,lblMatom,lblMion,lblXion,lblXatom,
         lblE1,lblE2,lblPlated} = M2;

  // the strip atom: sits, sheds two electrons at 33.8, leaves as an ion
  if(t < 36.4){
    hero.position.copy(P.heroHome);
    hero.position.y += Math.sin(t*2.2)*0.05;
    if(t>33.8) hero.position.x += Math.sin(t*22)*0.035*(1-ramp(t,33.8,36.2));
  } else {
    path3(_pa, P.heroHome, P.ionMid, P.ionEnd, t, 36.4, 38.8, 41.4);
    hero.position.copy(_pa);
    hero.position.y += Math.sin(t*0.9)*0.07*ramp(t,36.4,41.4);
  }
  hero.scale.setScalar(MT.r * lerp(1, 0.72, ramp(t,34.4,36.2)));   // an ion is smaller

  // the incoming ion comes to the surface, then settles into the vacancy
  path3(_pa, P.inStart, P.inMid, P.inFace, t, 28, 35, 41.8);
  if(t > 46.8) _pa.lerp(P.inSeat, ramp(t,46.8,50.0));
  if(t > 41.8 && t < 47.5) _pa.y += Math.sin(t*3.4)*0.05;          // jostling
  if(t > 50.0) _pa.y += Math.sin(t*3.0)*0.025;                     // now in the lattice
  inc.position.copy(_pa);
  // a metal atom is bigger than its ion, and it loses its colour in the water
  const became = ramp(t,45.0,46.6);
  inc.scale.setScalar(lerp(SM.r*0.82, SM.r, became));
  if(incGlow){
    incGlow.position.copy(_pa);
    incGlow.material.opacity = 0.16*(1-became);
  }

  // the two electrons: out of the atom, parked in the metal, then to the ion
  const outA = ramp(t,33.8,35.6), outB = ramp(t,34.1,35.9);
  const travelA = ramp(t,42.0,44.8), travelB = ramp(t,42.4,45.2);
  const jit = (v,f,a,ph)=>v.add(_v1.set(Math.sin(t*f+ph)*a, Math.cos(t*f*0.8+ph)*a, Math.sin(t*f*1.3+ph)*a*0.6));
  const eA = P.heroHome.clone().lerp(P.eParkA, outA); jit(eA, 3.2, 0.10*outA, 0.4);
  eA.lerp(inc.position, travelA);
  const eB = P.heroHome.clone().lerp(P.eParkB, outB); jit(eB, 2.8, 0.10*outB, 2.1);
  eB.lerp(inc.position, travelB);
  e1.position.copy(eA); e2.position.copy(eB);
  electronFade(e1, ramp(t,33.8,34.6) * (1-ramp(t,44.5,45.3)));
  electronFade(e2, ramp(t,34.1,34.9) * (1-ramp(t,44.9,45.7)));

  // labels
  const swap = ramp(t,34.6,35.6);
  lblMatom.material.opacity = ramp(t,31.6,32.6)*(1-swap);
  lblMion.material.opacity  = swap*(1-ramp(t,51.5,52.5));
  lblMatom.position.copy(hero.position).add(_v1.set(0,MT.r+0.85,0));
  lblMion.position.copy(lblMatom.position);

  lblXion.material.opacity  = ramp(t,39.4,40.4)*(1-became);
  lblXatom.material.opacity = became*(1-ramp(t,51.5,52.5));
  lblXion.position.copy(inc.position).add(_v1.set(0,-SM.r-0.85,0));
  lblXatom.position.copy(lblXion.position);

  const eLbl = ramp(t,34.8,35.8)*(1-ramp(t,43.4,44.2));
  lblE1.material.opacity = eLbl; lblE2.material.opacity = eLbl;
  lblE1.position.copy(eA).add(_v1.set(0.1,0.62,0));
  lblE2.position.copy(eB).add(_v1.set(0.1,0.62,0));

  lblPlated.material.opacity = ramp(t,48.4,49.4)*(1-ramp(t,53.0,54.0));
  lblPlated.position.copy(inc.position).add(_v1.set(1.9,-1.15,0));
}

/* ---- the refusal: the ion arrives, is given nothing, and leaves ---- */
function updateRefusal(t){
  const {hero,e1,e2,inc,incGlow,lblMatom,lblMion,lblXion,lblXatom,
         lblE1,lblE2,lblPlated,lblKept} = M2;

  // the strip atom never changes
  hero.position.copy(P.heroHome);
  hero.position.y += Math.sin(t*2.2)*0.05;
  hero.scale.setScalar(MT.r);

  // the ion comes right up to the surface, waits, and drifts back
  path3(_pa, P.inStart, P.inMid, P.inFace, t, 28, 31.5, 34.0);
  if(t > 35.8) _pa.lerp(P.inAway, ramp(t,35.8,41.0));
  if(t > 34.0 && t < 36.4) _pa.y += Math.sin(t*3.6)*0.06;
  inc.position.copy(_pa);
  inc.scale.setScalar(SM.r*0.82);                 // still an ion at the end
  if(incGlow){ incGlow.position.copy(_pa); incGlow.material.opacity = 0.16; }

  // the electrons stay resolutely where they are
  electronFade(e1, 0); electronFade(e2, 0);
  lblE1.material.opacity = 0; lblE2.material.opacity = 0;
  lblMion.material.opacity = 0; lblXatom.material.opacity = 0;
  lblPlated.material.opacity = 0;

  lblMatom.material.opacity = ramp(t,30.2,31.2)*(1-ramp(t,39.5,40.5));
  lblMatom.position.copy(hero.position).add(_v1.set(0,MT.r+0.85,0));
  lblXion.material.opacity = ramp(t,32.6,33.6)*(1-ramp(t,39.5,40.5));
  lblXion.position.copy(inc.position).add(_v1.set(0,-SM.r-0.85,0));

  lblKept.material.opacity = ramp(t,35.6,36.6)*(1-ramp(t,39.5,40.5));
  lblKept.position.copy(P.heroHome).add(_v1.set(-0.2,-1.45,0));
}

function updateMicro2(t){
  updateMicro2Common(t);
  if(REACTS) updateSwap(t); else updateRefusal(t);
}

const CAM_MACRO = [
  {t:0,    p:[2.6,4.4,4.2],   l:[-1.5,3.05,0]},
  {t:3.5,  p:[0.5,3.6,2.0],   l:[-1.5,3.15,0]},
  {t:7.0,  p:[-0.95,3.4,0.8], l:[-1.5,3.2,0]},
  {t:15.0, p:[1.0,5.6,10.5],  l:[0.7,2.0,0]},
  {t:18.5, p:[3.0,4.2,6.8],   l:[1.2,2.2,0]},
  {t:21.5, p:[2.6,3.2,5.0],   l:[1.6,1.6,0]},
  {t:24.5, p:[2.2,2.6,4.0],   l:[1.7,1.3,0]},
  {t:28.0, p:[1.9,1.8,1.6],   l:[1.7,1.2,0]}
];
const CAM_MICRO1 = [
  {t:7.0,  p:[0,0.6,9.0],   l:[0,0,3.2]},
  {t:10.4, p:[2.4,1.6,9.4], l:[0,0,1.4]},
  {t:13.0, p:[1.6,2.6,12.0],l:[0,0,0]},
  {t:15.0, p:[0,5.0,22.0],  l:[0,0,0]}
];
const CAM_SWAP = [
  {t:28.0, p:[1.4,1.2,12.4],  l:[0.8,0,0]},
  {t:31.0, p:[-2.2,1.0,9.8],  l:[-4.0,0.3,0.1]},
  {t:33.8, p:[-2.6,0.8,7.4],  l:[-4.7,0.5,0.5]},
  {t:36.6, p:[-2.0,0.9,8.4],  l:[-3.4,0.6,0.2]},
  {t:39.4, p:[-2.4,0.6,8.0],  l:[-4.2,-0.2,0.4]},
  {t:42.0, p:[-2.8,0.5,6.8],  l:[-4.6,-0.4,0.6]},
  {t:45.2, p:[-2.9,0.5,6.4],  l:[-4.8,-0.5,0.7]},
  {t:47.6, p:[-3.0,0.6,6.6],  l:[-5.0,-0.5,0.7]},
  {t:50.6, p:[-2.2,1.2,9.4],  l:[-4.6,0.0,0.4]},
  {t:53.4, p:[-0.6,2.0,11.4], l:[-2.4,0.4,0.2]},
  {t:58.0, p:[0.8,2.2,13.0],  l:[-1.2,0.2,0]}
];
const CAM_REFUSE = [
  {t:28.0, p:[1.4,1.2,12.4],  l:[0.8,0,0]},
  {t:30.2, p:[-2.2,1.0,9.8],  l:[-4.0,0.3,0.1]},
  {t:32.6, p:[-2.8,0.6,7.2],  l:[-4.6,-0.3,0.6]},
  {t:35.6, p:[-2.9,0.6,6.8],  l:[-4.8,-0.4,0.7]},
  {t:38.4, p:[-1.6,1.2,9.6],  l:[-4.0,0.1,0.4]},
  {t:41.0, p:[0.4,1.8,12.2],  l:[-1.8,0.2,0]}
];
let CAM = {macro:CAM_MACRO, micro1:CAM_MICRO1, micro2:CAM_SWAP};

const camPos=new THREE.Vector3(), camTgt=new THREE.Vector3();
function sampleCam(t){
  const w = worldAt(t), keys = CAM[w];
  let i=0; while(i<keys.length-2 && t>=keys[i+1].t) i++;
  const a=keys[i], b=keys[Math.min(i+1,keys.length-1)];
  const u = b.t===a.t?0:smooth((t-a.t)/(b.t-a.t));
  const off = w==='micro1'?MICRO1_Y : w==='micro2'?MICRO2_Y : 0;
  camPos.set(lerp(a.p[0],b.p[0],u), lerp(a.p[1],b.p[1],u)+off, lerp(a.p[2],b.p[2],u));
  camTgt.set(lerp(a.l[0],b.l[0],u), lerp(a.l[1],b.l[1],u)+off, lerp(a.l[2],b.l[2],u));
}

/* ---------- macro animation, all of it a function of t ---------- */
const TONGS_START = new THREE.Vector3(-1.45, 3.15, 0);
const TONGS_OVER  = new THREE.Vector3(BEAKER_X-0.30, 2.95, 0);
const TONGS_DOWN  = new THREE.Vector3(BEAKER_X-0.30, 1.35, 0);
const STRIP_REST  = new THREE.Vector3(BEAKER_X-0.32, 0.66, 0);
const OPEN_A = 19.8, OPEN_B = 20.4;

function updateMacro(t){
  // across 16.0 → 18.2, down 18.2 → 19.6, let go 19.8 → 20.4, away 20.6 → 22.4
  const across = ramp(t,16.0,18.2), down = ramp(t,18.2,19.6);
  tongs.position.lerpVectors(TONGS_START, TONGS_OVER, across);
  tongs.position.lerp(TONGS_DOWN, down);
  const open = ramp(t,OPEN_A,OPEN_B);
  armL.rotation.z =  ARM_TILT + open*0.16;
  armR.rotation.z = -ARM_TILT - open*0.16;
  const away = ramp(t,20.6,22.4);
  tongs.position.y += away*2.9;
  tongs.position.x -= away*1.7;
  tongs.rotation.z = away*0.5;
  if(t<16.0) tongs.rotation.y = Math.sin(t*0.5)*0.18;

  // the strip: held, then let go, then leaning on the bottom
  if(t < OPEN_B){
    strip.position.copy(tongs.position);
    strip.rotation.set(0, tongs.rotation.y, 0.05);
  } else {
    const settle = ramp(t, OPEN_B, 21.4);
    strip.position.lerpVectors(TONGS_DOWN, STRIP_REST, settle);
    strip.rotation.set(0, 0, lerp(0.05, 0.30, settle));
  }
  coat.position.copy(strip.position);
  coat.rotation.copy(strip.rotation);

  // the displaced metal plates onto it
  const plateEnd = lerp(28.0, 23.5, RATE);
  const plated = REACTS ? ramp(t, 20.8, plateEnd) : 0;
  coat.material.opacity = plated*0.94;

  // the solution loses one ion's colour and gains the other's
  const mix = REACTS ? ramp(t,20.8,27.6) : 0;
  const a = solRGB(SM), b = solRGB(MT);
  liquidMat.color.setRGB(lerp(a[0],b[0],mix), lerp(a[1],b[1],mix), lerp(a[2],b[2],mix));
  const opA = SM.sol?0.60:0.34, opB = MT.sol?0.60:0.34;
  liquidMat.opacity = lerp(opA, opB, mix);
  surface.material.opacity = lerp(SM.sol?0.32:0.45, MT.sol?0.32:0.45, mix);

  updateFlakes(t);
}

/* =====================================================================
   ORBIT-ISH DRAG
===================================================================== */
let yaw=0, pitch=0, dragging=false, lx=0, ly=0;
const el = renderer.domElement;
function down(x,y){dragging=true;lx=x;ly=y;el.style.cursor='grabbing';}
function move(x,y){
  if(!dragging) return;
  yaw   -= (x-lx)*0.005;
  pitch  = Math.max(-0.9, Math.min(0.9, pitch + (y-ly)*0.004));
  lx=x; ly=y;
}
function up(){dragging=false; el.style.cursor='grab';}
el.style.cursor='grab';
el.addEventListener('mousedown',e=>down(e.clientX,e.clientY));
addEventListener('mousemove',e=>move(e.clientX,e.clientY));
addEventListener('mouseup',up);
el.addEventListener('touchstart',e=>{down(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
el.addEventListener('touchmove',e=>{move(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
addEventListener('touchend',up);

const _sph = new THREE.Spherical();
function applyCamera(){
  const dir = camPos.clone().sub(camTgt);
  _sph.setFromVector3(dir);
  _sph.theta += yaw;
  _sph.phi = Math.max(0.12, Math.min(Math.PI-0.12, _sph.phi - pitch));
  dir.setFromSpherical(_sph);
  camera.position.copy(camTgt).add(dir);
  camera.lookAt(camTgt);
}

/* =====================================================================
   UI
===================================================================== */
const capEl  = document.getElementById('caption');
const fadeEl = document.getElementById('fade');
const playBtn= document.getElementById('play');
const scrub  = document.getElementById('scrub');
const clock  = document.getElementById('clock');
const keyEl  = document.getElementById('key');
const menuEl = document.getElementById('menu');
const gearEl = document.getElementById('gear');

let t = 0, playing = true, lastFrame = performance.now(), curSeg = -1;

playBtn.onclick = ()=>{ playing=!playing; playBtn.textContent = playing?'Pause':'Play'; };
document.getElementById('restart').onclick = ()=>{ t=0; curSeg=-1; playing=true; playBtn.textContent='Pause'; };
scrub.oninput = ()=>{ t = parseFloat(scrub.value); curSeg=-1; };
addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault(); playBtn.click(); }
  if(e.code==='ArrowRight'){ t = Math.min(TOTAL, t+2); curSeg=-1; }
  if(e.code==='ArrowLeft'){  t = Math.max(0, t-2);     curSeg=-1; }
  if(e.code==='Escape') setMenu(false);
});

function captionFor(time){
  let i=0; for(let k=0;k<SEGS.length;k++) if(time>=SEGS[k].t) i=k;
  return i;
}
function fadeAmount(time){
  let f=0;
  for(const T of TRANSITIONS) f = Math.max(f, 1 - Math.min(1, Math.abs(time-T)/FADE));
  return f;
}

const hexCss = n => '#'+n.toString(16).padStart(6,'0');

function buildLegend(){
  const rows = [{sym:MT.sym, name:MT.name, col:MT.col}];
  if(SM !== MT) rows.push({sym:SM.sym, name:SM.name, col:SM.col});
  rows.push({sym:'S', name:EL.S.name, col:EL.S.col});
  rows.push({sym:'O', name:EL.O.name, col:EL.O.col});
  rows.push({sym:'e⁻', name:'electron', col:E_COL});
  keyEl.innerHTML = rows.map(r=>
    `<div><span class="dot" style="background:${hexCss(r.col)}"></span><b>${r.sym}</b> ${r.name}</div>`
  ).join('');
}

/* metals listed most reactive first, so the menu is itself the series */
const byReactivity = Object.keys(METALS).sort((a,b)=>METALS[b].react-METALS[a].react);

function buildMenu(){
  const mk = (cur, group, fmt) => byReactivity.map(k=>
    `<button class="opt ${k===cur?'on':''}" data-group="${group}" data-key="${k}">${fmt(METALS[k])}</button>`
  ).join('');
  document.getElementById('metalOpts').innerHTML =
    mk(metalKey, 'metal', m=>`<span class="f">${m.sym}</span> · ${m.name}`);
  document.getElementById('saltOpts').innerHTML =
    mk(saltKey, 'salt', m=>`<span class="f">${saltOf(m)}</span>`);

  const verdict = REACTS
    ? `<b class="yes">Reacts.</b> ${cap1(MT.name)} is above ${SM.name} in the reactivity series, so it pushes ${SM.name} out of solution.`
    : SAME
      ? `<b class="no">No reaction.</b> The same metal is on both sides — there is nothing to displace.`
      : `<b class="no">No reaction.</b> ${cap1(MT.name)} is below ${SM.name} in the reactivity series, so it cannot displace it.`;
  document.getElementById('menuEq').innerHTML = `${equation()}<span>${verdict}</span>`;

  menuEl.querySelectorAll('.opt').forEach(b=>{
    b.onclick = ()=>{
      if(b.dataset.group==='metal') metalKey = b.dataset.key; else saltKey = b.dataset.key;
      build();
      playing = true; playBtn.textContent = 'Pause';
    };
  });
}

function setMenu(open){
  menuEl.classList.toggle('open', open);
  gearEl.classList.toggle('open', open);
  if(open) buildMenu();
}
gearEl.onclick = ()=> setMenu(!menuEl.classList.contains('open'));

/* ---------- rebuild everything that depends on the species ---------- */
function build(){
  derive();
  buildStrip();
  buildFlakes();
  buildMicro1();
  buildMicro2();
  buildCaptions();                       // sets TOTAL too
  buildLegend();
  CAM = {macro:CAM_MACRO, micro1:CAM_MICRO1, micro2: REACTS?CAM_SWAP:CAM_REFUSE};

  document.title = `${cap1(MT.name)} + ${saltName(SM)}`;
  document.getElementById('h1').textContent = `${cap1(MT.name)} in ${saltName(SM)}`;
  document.getElementById('subtitle').textContent = equation();
  scrub.style.setProperty('--hl', hexCss(MT.col));
  scrub.max = TOTAL;

  if(menuEl.classList.contains('open')) buildMenu();
  history.replaceState(null,'',`?metal=${metalKey}&salt=${saltKey}`);

  t = 0; curSeg = -1;
}
build();

/* =====================================================================
   LOOP
===================================================================== */
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min((now-lastFrame)/1000, 1/24);
  lastFrame = now;

  if(playing){
    t += dt;
    if(t >= TOTAL){ t = TOTAL; playing=false; playBtn.textContent='Play'; }
  }

  updateMacro(t);
  updateMicro1(t);
  updateMicro2(t);
  sampleCam(t);
  applyCamera();

  const f = fadeAmount(t);
  fadeEl.style.opacity = f;
  const seg = captionFor(t);
  if(seg !== curSeg){ curSeg = seg; capEl.textContent = SEGS[seg].c; }
  capEl.style.opacity = 1 - f;
  scrub.value = t;
  scrub.style.setProperty('--p', (t/TOTAL*100)+'%');
  clock.textContent = t.toFixed(1)+' / '+TOTAL.toFixed(1)+'s';

  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
