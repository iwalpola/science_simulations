<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metal + water</title>
<style>
  :root{
    --ink:#eef2f7;
    --dim:#93a2b6;
    --panel:rgba(10,14,21,.72);
    --line:rgba(147,162,182,.22);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:#080b11;color:var(--ink);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

  #stage{position:fixed;inset:0;}
  canvas{display:block;}

  #fade{position:fixed;inset:0;background:#080b11;pointer-events:none;opacity:0;}

  .title{position:fixed;top:22px;left:26px;max-width:min(46ch,60vw);pointer-events:none;}
  .title h1{

    font-family:"Iowan Old Style","Charter","Palatino Linotype",Georgia,serif;

  }
  .title p{margin:6px 0 0;font-size:13px;line-height:1.5;color:var(--dim);}
  .eq{font-variant-numeric:tabular-nums;}
  .title a{pointer-events:auto;color:var(--dim);text-decoration:none;font-size:12px;

  #caption{
    position:fixed;left:50%;transform:translateX(-50%);

  }

  #bar{
    position:fixed;left:50%;transform:translateX(-50%);bottom:20px;

  button{

  }
  button:hover{background:rgba(255,255,255,.12);}
  button:focus-visible{outline:2px solid #7fb0ff;outline-offset:2px;}
  #play{min-width:74px;}

  #scrub{
    flex:1;appearance:none;height:4px;border-radius:4px;
    background:linear-gradient(90deg,var(--hl,#d9cbb0) 0%,var(--hl,#d9cbb0) var(--p,0%),rgba(255,255,255,.14) var(--p,0%));

  }
  #scrub::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;
    background:var(--ink);border:none;box-shadow:0 0 0 3px rgba(8,11,17,.6);}

  #key{
    position:fixed;right:24px;top:22px;

  #key div{display:flex;align-items:center;gap:8px;}
  .dot{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:inset -2px -2px 3px rgba(0,0,0,.45);}
  #key b{color:var(--ink);font-weight:600;}
  #hint{position:fixed;bottom:90px;right:24px;font-size:11.5px;color:var(--dim);opacity:.75;}

  /* ---- species menu ---- */
  #menu{
    position:fixed;left:50%;transform:translateX(-50%);bottom:86px;
    width:min(700px,94vw);
    background:var(--panel);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;display:none;gap:18px;
  }
  #menu.open{display:flex;flex-wrap:wrap;}
  #menu fieldset{border:none;margin:0;padding:0;flex:1;min-width:220px;}
  #menu legend{
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:#64748b;padding:0 0 8px;
  }
  .opts{display:flex;flex-wrap:wrap;gap:6px;}
  .opt{
    font:inherit;font-size:12.5px;padding:6px 11px;border-radius:8px;

    color:var(--dim);cursor:pointer;
  }
  .opt:hover{background:rgba(255,255,255,.1);color:var(--ink);}
  .opt.on{background:rgba(127,176,255,.18);border-color:rgba(127,176,255,.5);color:#dce9ff;}
  .opt .f{font-family:"Iowan Old Style","Charter",Georgia,serif;font-variant-numeric:tabular-nums;}
  #menuEq{
    flex-basis:100%;border-top:1px solid var(--line);padding-top:12px;margin:0;
    font-family:"Iowan Old Style","Charter",Georgia,serif;font-size:16px;
    color:var(--ink);font-variant-numeric:tabular-nums;
  }
  #menuEq span{color:#64748b;font-size:12px;display:block;margin-top:5px;
    font-family:ui-sans-serif,system-ui,sans-serif;line-height:1.5;}
  #menuEq i{color:#a8c9ff;font-style:normal;}

  @media (max-width:640px){
    .title h1{font-size:18px;} .title p{display:none;}
    #key{right:14px;top:14px;padding:8px 10px;font-size:11px;line-height:1.7;}
    #caption{font-size:16px;bottom:100px;}
    #hint{display:none;}
    #clock{display:none;}
    #menu{bottom:82px;padding:13px 14px;}
  }
  @media (prefers-reduced-motion:reduce){#caption{transition:none;}}
</style>

<body>
<div id="stage"></div>
<div id="fade"></div>

<div class="title">
  <h1 id="h1">Sodium on water</h1>
  <p class="eq" id="subtitle">2Na + 2H₂O → 2NaOH + H₂</p>
  <p><a href="index.html">← All fourteen reactions</a></p>
</div>

<div id="key"></div>

<div id="caption"></div>
<div id="hint">Drag to look around</div>

<div id="menu">
  <fieldset>
    <legend>Group 1 metal — least reactive first</legend>
    <div class="opts" id="metalOpts"></div>
  </fieldset>
  <p id="menuEq"></p>
</div>

<div id="bar">
  <button id="play">Pause</button>
  <button id="restart">Restart</button>
  <input id="scrub" type="range" min="0" max="60" step="0.01" value="0" aria-label="Timeline">
  <span id="clock">0.0 / 60.0s</span>
  <button id="gear" title="Change the metal" aria-label="Change the metal">⚙</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------------------------------------------------------------------------
   SCENE 05 — metal + water,  2M + 2H₂O → 2MOH + H₂

   Group 1 on water. Two things to get across, and the scene is built round
   them rather than round the bang:

     1. Why the trend exists. Micro world 1 puts lithium, sodium and potassium
        side by side, each with its single outer electron, and you can see that
        the bigger the atom the further out that electron sits — which is why
        it is easier to lose, and why potassium is the fiercest of the three.

     2. Where the alkali comes from. Water does not simply "give up hydrogen":
        each water molecule takes one electron and BREAKS, into a hydrogen atom
        and a hydroxide ion. The two hydrogen atoms leave as H₂; the hydroxide
        ions stay behind, and they are the reason the indicator turns purple.

   Acts:
     0  – 7   macro: the metal, the trough of water
     7  – 15  micro 1: all three metals, and their one loose electron
    15  – 30  macro: drop it in — fizzing, skating, and for potassium a flame
    30  – 60  micro 2: two atoms, two waters, and where everything ends up

   Everything is a closed-form function of t — no particle sim.
--------------------------------------------------------------------------- */

/* ======================= the species tables ======================= */

const EL = {               // the same palette as every other scene here
  O:  {name:'oxygen',   col:0x2f47b8, r:0.50},
  H:  {name:'hydrogen', col:0xd8402f, r:0.34}
};
const E_COL = 0xffe070;

/* react: position in the reactivity series. eGap: how far out the single
   outer electron sits, which is the reason for the trend. */
const METALS = {
  Li: {sym:'Li', name:'lithium', full:'lithium', ion:'Li⁺', formula:'LiOH',
       col:0xdde3e8, r:0.60, lblCol:'#e8eef2', react:1, eGap:0.90,
       vigour:0.45, melts:false, flame:null, skate:0.55,
       where:'closest in',        hold:'the most tightly held',
       rank:'the least reactive of the three',
       fizzLine:'It fizzes steadily and drifts slowly about the surface.'},
  Na: {sym:'Na', name:'sodium', full:'sodium', ion:'Na⁺', formula:'NaOH',
       col:0xd9cbb0, r:0.66, lblCol:'#ece0c8', react:2, eGap:1.35,
       vigour:0.75, melts:true, flame:null, skate:1.00,
       where:'further out',       hold:'held more loosely',
       rank:'in the middle',
       fizzLine:'It melts into a silver ball and races around the surface, fizzing.'},
  K:  {sym:'K',  name:'potassium', full:'potassium', ion:'K⁺', formula:'KOH',
       col:0xcbb8d4, r:0.74, lblCol:'#e0d0e8', react:3, eGap:1.80,
       vigour:1.00, melts:true, flame:0xc9a0f0, skate:1.25,
       where:'furthest out of the three', hold:'the most loosely held of all',
       rank:'the most reactive',
       fizzLine:'It catches fire the moment it lands. That lilac flame is the potassium itself.'}
};

/* universal indicator, because the whole point is that the water turns alkaline */
const IND_NEUTRAL = [0.38,0.72,0.42];     // green
const IND_ALKALI  = [0.42,0.26,0.68];     // purple

const qs = new URLSearchParams(location.search);
let metalKey = METALS[qs.get('metal')] ? qs.get('metal') : 'Na';
let MT;
function derive(){ MT = METALS[metalKey]; }

const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
const equation = () => `2${MT.sym} + 2H₂O → 2${MT.formula} + H₂`;
const halves   = () => `${MT.sym} → ${MT.ion} + e⁻     ·     2H₂O + 2e⁻ → H₂ + 2OH⁻`;

const MICRO1_Y =  400;   // the three atoms compared
const MICRO2_Y = -400;   // the reaction

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
/* Colour management. Without outputEncoding the render is never converted back
   to sRGB, so every colour comes out darker and flatter than it was chosen to
   be. r128 spelling — this became outputColorSpace in later versions. */
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080b11);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.05, 2000);

scene.add(new THREE.HemisphereLight(0x9fb4d0, 0x0a0d13, 0.6));
const keyL = new THREE.DirectionalLight(0xffffff, 0.95); keyL.position.set(6,11,8); scene.add(keyL);
const fill = new THREE.DirectionalLight(0x9ec3ff, 0.4); fill.position.set(-8,4,-6); scene.add(fill);
const rim  = new THREE.DirectionalLight(0xffd9b0, 0.35); rim.position.set(0,3,-10); scene.add(rim);
const flameLight = new THREE.PointLight(0xc9a0f0, 0, 9); scene.add(flameLight);

(function environment(){
  const env = new THREE.Scene();
  const box = new THREE.BoxGeometry(1,1,1);
  env.add(new THREE.Mesh(new THREE.BoxGeometry(24,14,24),
    new THREE.MeshBasicMaterial({color:0x1d2634, side:THREE.BackSide})));
  const panel=(hex,gain,x,y,z,sx,sy,sz)=>{
    const m=new THREE.Mesh(box,new THREE.MeshBasicMaterial({color:hex}));
    m.material.color.multiplyScalar(gain);
    m.position.set(x,y,z); m.scale.set(sx,sy,sz); env.add(m);
  };
  panel(0xffffff,1.1,  0, 6.6,  0, 11,0.1,11);
  panel(0xbcd6ff,1.3, -9, 1.0,  0, 0.1,9,16);
  panel(0xffd7b0,0.9,  9, 1.0,  2, 0.1,9,16);
  panel(0x8fb0e0,0.5,  0, 0.0,-10, 18,9,0.1);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(env, 0.04).texture;
  pmrem.dispose();
})();

/* ---------- shared helpers ---------- */
const SPH = new THREE.SphereGeometry(1,32,24);
const SPH_LO = new THREE.SphereGeometry(1,16,12);
const CYL = new THREE.CylinderGeometry(1,1,1,20,1,false);

function atom(color, radius, opts={}){
  const mat = new THREE.MeshStandardMaterial({
    color, roughness: opts.rough ?? 0.35, metalness: opts.metal ?? 0.25,
    emissive: new THREE.Color(color).multiplyScalar(0.06)
  });
  if(opts.op !== undefined && opts.op < 1){ mat.transparent = true; mat.opacity = opts.op; }
  const m = new THREE.Mesh(opts.lo?SPH_LO:SPH, mat);
  m.scale.setScalar(radius);
  return m;
}

function electron(){
  const g = new THREE.Group();
  const core = new THREE.Mesh(SPH_LO, new THREE.MeshStandardMaterial({
    color:0xfff6d0, emissive:E_COL, roughness:0.3, metalness:0,
    transparent:true, opacity:1
  }));
  core.scale.setScalar(0.17);
  const halo = new THREE.Mesh(SPH_LO, new THREE.MeshBasicMaterial({
    color:E_COL, transparent:true, opacity:0.20,
    blending:THREE.AdditiveBlending, depthWrite:false
  }));
  halo.scale.setScalar(0.40);
  g.add(core, halo);
  g.userData.core = core; g.userData.halo = halo;
  return g;
}
function electronFade(e, a){
  e.userData.core.material.opacity = a;
  e.userData.halo.material.opacity = 0.20*a;
  e.visible = a > 0.02;
}

function bond(color=0xa9b6c6, radius=0.13){
  const m = new THREE.Mesh(CYL, new THREE.MeshStandardMaterial({
    color, roughness:0.5, metalness:0.1, transparent:true, opacity:1
  }));
  m.userData.radius = radius;
  return m;
}
const _v1=new THREE.Vector3(), _up=new THREE.Vector3(0,1,0);
function placeBond(mesh, a, b, shrink=0){
  const dir = new THREE.Vector3().subVectors(b,a);
  const len = Math.max(dir.length()-shrink*2, 0.001);
  mesh.position.copy(a).addScaledVector(dir,0.5);
  mesh.scale.set(mesh.userData.radius, len, mesh.userData.radius);
  mesh.quaternion.setFromUnitVectors(_up, dir.normalize());
}

function label(text, color='#eef2f7', size=54){
  const pad=16, c=document.createElement('canvas'), ctx=c.getContext('2d');
  const font = `600 ${size}px "Iowan Old Style", Charter, Georgia, serif`;
  ctx.font=font; const w=Math.ceil(ctx.measureText(text).width)+pad*2;
  c.width=w; c.height=size+pad*2;
  ctx.font=font; ctx.textBaseline='middle'; ctx.textAlign='center';
  ctx.shadowColor='rgba(0,0,0,.9)'; ctx.shadowBlur=14;
  ctx.fillStyle=color; ctx.fillText(text, c.width/2, c.height/2);
  const tex = new THREE.CanvasTexture(c); tex.anisotropy=4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false, opacity:0}));
  sp.renderOrder = 10;
  sp.scale.set(c.width/c.height*0.62, 0.62, 1);
  return sp;
}

/* a soft round glow, for the flame */
const GLOW_TEX = (function(){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,   'rgba(255,255,255,1)');
  g.addColorStop(0.25,'rgba(255,235,255,.72)');
  g.addColorStop(0.6, 'rgba(200,160,240,.26)');
  g.addColorStop(1,   'rgba(160,120,220,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
})();

function lerp(a,b,t){ return a+(b-a)*t; }
function clamp01(x){ return Math.max(0,Math.min(1,x)); }
function smooth(x){ x=clamp01(x); return x*x*(3-2*x); }
function ramp(t,a,b){ return smooth((t-a)/(b-a)); }

/* The other half of colour management. r128 uses a material colour in the
   lighting maths as if it were already linear, but hex codes are picked by eye
   and so are sRGB. Setting outputEncoding WITHOUT this leaves everything too
   light and desaturated. The flag keeps it idempotent, so rebuilding on a
   species change cannot double-convert. Colours rewritten every frame convert
   at the point of assignment instead. */
function linearise(root){
  root.traverse(o=>{
    if(!o.material) return;
    (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{
      if(!m || m.userData.__lin) return;
      m.userData.__lin = true;
      if(m.color)    m.color.convertSRGBToLinear();
      if(m.emissive) m.emissive.convertSRGBToLinear();
    });
  });
}

function clearGroup(g){
  for(let i=g.children.length-1;i>=0;i--){
    const c = g.children[i];
    g.remove(c);
    c.traverse(o=>{
      if(o.material){
        if(o.material.map && o.material.map !== GLOW_TEX) o.material.map.dispose();
        o.material.dispose();
      }
    });
  }
}

function rng(seed){
  let s = seed>>>0;
  return ()=>{ s = (s*1664525 + 1013904223)>>>0; return s/4294967296; };
}

/* =====================================================================
   MACRO WORLD — bench, a wide trough of water, tongs holding the metal
===================================================================== */
const macro = new THREE.Group(); scene.add(macro);

/* The bench gets a radial falloff painted into its colour map. Once the output
   is correctly sRGB-encoded even a near-black albedo lifts to a visible grey,
   and a flat 18-metre disc then sweeps across the lower frame as a pale dome.
   Darkening it further is not the fix; making it a pool of light is. A
   cylinder's cap UVs are a circle inscribed in the 0..1 square, so a radial
   gradient lands exactly on the disc. */
const benchMap = (function(){
  const S = 512, c = document.createElement('canvas');
  c.width = c.height = S;
  const x = c.getContext('2d');
  x.fillStyle = '#000'; x.fillRect(0,0,S,S);
  const g = x.createRadialGradient(S/2,S/2,0, S/2,S/2,S*0.5);
  g.addColorStop(0.00, 'rgba(255,255,255,1)');
  g.addColorStop(0.11, 'rgba(226,232,242,0.80)');
  g.addColorStop(0.24, 'rgba(140,152,172,0.26)');
  g.addColorStop(0.36, 'rgba(56,64,78,0.06)');
  g.addColorStop(0.50, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0,0,S,S);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  return t;
})();
const bench = new THREE.Mesh(
  new THREE.CylinderGeometry(9,9,0.35,64),
  new THREE.MeshStandardMaterial({color:0x4a515d, map:benchMap,
    roughness:0.94, metalness:0, envMapIntensity:0.10})
);
bench.position.y=-0.175; macro.add(bench);

const TR_X = 0.8, TR_R = 2.30, R_IN = 2.22, WATER_TOP = 0.62;
const trough = new THREE.Group(); trough.position.set(TR_X,0,0); macro.add(trough);

const glassMat = new THREE.MeshStandardMaterial({
  color:0xbfd6e8, roughness:0.08, metalness:0.0,
  transparent:true, opacity:0.18, side:THREE.DoubleSide
});
const tWall = new THREE.Mesh(new THREE.CylinderGeometry(TR_R,TR_R,0.86,64,1,true), glassMat);
tWall.position.y=0.43; trough.add(tWall);
const tBase = new THREE.Mesh(new THREE.CylinderGeometry(TR_R,TR_R,0.06,64), glassMat);
tBase.position.y=0.03; trough.add(tBase);
const tRim = new THREE.Mesh(new THREE.TorusGeometry(TR_R,0.035,10,72),
  new THREE.MeshStandardMaterial({color:0xd8e6f2, roughness:0.15, metalness:0.1, transparent:true, opacity:0.5}));
tRim.rotation.x=Math.PI/2; tRim.position.y=0.86; trough.add(tRim);

const waterMat = new THREE.MeshStandardMaterial({
  color:0x61b86b, roughness:0.1, metalness:0.0, transparent:true, opacity:0.58
});
const water = new THREE.Mesh(new THREE.CylinderGeometry(R_IN,R_IN,WATER_TOP,64), waterMat);
water.position.y=WATER_TOP/2; trough.add(water);
const wSurface = new THREE.Mesh(new THREE.CircleGeometry(R_IN,64),
  new THREE.MeshStandardMaterial({color:0x8fd6a0, roughness:0.04, metalness:0.25, transparent:true, opacity:0.35}));
wSurface.rotation.x=-Math.PI/2; wSurface.position.y=WATER_TOP+0.006; trough.add(wSurface);

/* --- tongs --- */
const tongs = new THREE.Group(); macro.add(tongs);
const steel = new THREE.MeshStandardMaterial({color:0xb9c3cf, metalness:0.9, roughness:0.22});
const armGeo = new THREE.BoxGeometry(0.06,2.0,0.14);
const armL = new THREE.Mesh(armGeo, steel), armR = new THREE.Mesh(armGeo, steel);
const ARM_TILT = 0.08;
[[armL,-1],[armR,1]].forEach(([a,s])=>{
  a.position.set(s*0.09, 1.0, 0);
  a.rotation.z = -s*ARM_TILT;
  tongs.add(a);
});
const yoke = new THREE.Mesh(new THREE.TorusGeometry(0.15,0.04,8,20,Math.PI), steel);
yoke.position.y = 2.0; tongs.add(yoke);

/* --- the lump of metal, and the flame it may burn with --- */
let lump = null, flame = null;
function buildLump(){
  if(lump){ macro.remove(lump); lump.geometry.dispose(); lump.material.dispose(); }
  lump = new THREE.Mesh(new THREE.IcosahedronGeometry(0.17,1),
    new THREE.MeshStandardMaterial({color:MT.col, metalness:0.8, roughness:0.34}));
  macro.add(lump);
  if(flame){ macro.remove(flame); flame.material.dispose(); }
  flame = new THREE.Sprite(new THREE.SpriteMaterial({
    map:GLOW_TEX, color: MT.flame || 0xffffff, transparent:true, opacity:0,
    blending:THREE.AdditiveBlending, depthWrite:false, depthTest:false
  }));
  flame.scale.setScalar(1.2);
  macro.add(flame);
}

/* --- where the lump is, as a pure function of t --- */
const TONGS_START = new THREE.Vector3(-1.9, 2.75, 0);
const TONGS_OVER  = new THREE.Vector3(TR_X-0.55, 2.55, 0);
const OPEN_A = 18.9, OPEN_B = 19.4;
const LAND = 20.0;
const SKATE_A = 20.0, SKATE_B = 29.2;

/* the skate path: a slow Lissajous wander across the surface */
const _sk = new THREE.Vector3();
function skatePos(t){
  const u = (t - SKATE_A) * MT.skate;
  const shrink = 1 - 0.45*ramp(t, SKATE_A, SKATE_B);
  const r = 1.30 * shrink;
  _sk.set(
    TR_X + Math.sin(u*0.78)*r + Math.sin(u*1.9)*0.18,
    WATER_TOP + 0.07,
    Math.cos(u*0.61)*r*0.78 + Math.cos(u*1.7)*0.16
  );
  return _sk;
}

/* --- bubbles of hydrogen, born wherever the lump happens to be --- */
const bubbleGrp = new THREE.Group(); trough.add(bubbleGrp);
const FIZZ_A = 20.1, FIZZ_B = 29.0;
let bubbles = [];
function buildBubbles(){
  clearGroup(bubbleGrp);
  bubbles = [];
  const n = Math.round(70 + 200*MT.vigour);
  const rand = rng(20240905);
  for(let i=0;i<n;i++){
    const m = new THREE.Mesh(SPH_LO, new THREE.MeshStandardMaterial({
      color:0xe8f4ff, roughness:0.05, metalness:0.1, transparent:true, opacity:0.45
    }));
    const birth = FIZZ_A + rand()*(FIZZ_B-FIZZ_A);
    // the lump's position at that instant is where this bubble starts
    const p = skatePos(birth);
    bubbles.push({
      m, birth,
      x0: p.x - TR_X + (rand()-0.5)*0.22,
      z0: p.z + (rand()-0.5)*0.22,
      y0: WATER_TOP - 0.12 - rand()*0.2,
      sz: 0.03 + rand()*0.05,
      speed: 0.8 + rand()*0.9,
      ph: rand()*6.283
    });
    bubbleGrp.add(m);
  }
  bubbles.forEach(b=> b.life = Math.max(0.12,(WATER_TOP - b.y0)/b.speed));
}
function updateBubbles(t){
  for(const b of bubbles){
    const age = t - b.birth;
    if(age < 0 || age > b.life + 0.3){ b.m.visible = false; continue; }
    b.m.visible = true;
    const rise = Math.min(age, b.life);
    b.m.position.set(
      b.x0 + Math.sin(age*3.0+b.ph)*0.05,
      b.y0 + b.speed*rise,
      b.z0 + Math.cos(age*2.6+b.ph)*0.05
    );
    b.m.scale.setScalar(b.sz*(1+0.35*(rise/b.life)));
    b.m.material.opacity = 0.45*(1 - clamp01((age-b.life)/0.3));
  }
}

   MOLECULE BUILDERS
===================================================================== */
/* a water molecule drawn as one rigid group, for the background */
function makeWater(op){
  const g = new THREE.Group();
  g.add(atom(EL.O.col, 0.42, {rough:0.3, op}));
  const ang = 104.5*Math.PI/360;
  [-1,1].forEach(s=>{
    const h = atom(EL.H.col, 0.26, {rough:0.3, op, lo:true});
    h.position.set(Math.sin(ang)*s*0.80, Math.cos(ang)*0.80, 0);
    const b = bond(0x8c99aa, 0.075);
    b.material.transparent = true; b.material.opacity = op;
    placeBond(b, new THREE.Vector3(), h.position, 0.04);
    g.add(h,b);
  });
  return g;
}

/* the two water molecules that actually react are built loose, because one
   of their O–H bonds has to break */
const W_OFF_KEEP = 0.617, W_OFF_UP = 0.477, W_LEN = 0.80;

/* =====================================================================
   MICRO 1 — all three metals side by side, and their one outer electron
===================================================================== */
const micro1 = new THREE.Group(); micro1.position.y=MICRO1_Y; scene.add(micro1);
let M1 = {};

function buildMicro1(){
  clearGroup(micro1);
  const SCALE = 1.7;
  const order = ['Li','Na','K'];
  const slots = [];
  order.forEach((k,i)=>{
    const m = METALS[k];
    const chosen = (k === metalKey);
    const x = (i-1)*4.3;
    const core = atom(m.col, m.r*SCALE, {rough:0.3, metal:0.6, op: chosen?1:0.30});
    core.position.set(x, 0, 0);
    micro1.add(core);
    const orbit = m.r*SCALE + m.eGap;
    const e = electron();
    electronFade(e, chosen?0.95:0.3);
    micro1.add(e);
    // a faint ring showing where that electron runs
    const ring = new THREE.Mesh(new THREE.TorusGeometry(orbit,0.012,6,64),
      new THREE.MeshBasicMaterial({color:0xffe070, transparent:true,
        opacity: chosen?0.3:0.1, depthWrite:false}));
    ring.position.set(x,0,0); ring.rotation.x = Math.PI*0.42;
    micro1.add(ring);
    const lb = label(m.sym, m.lblCol, chosen?54:44);
    lb.position.set(x, -orbit-0.85, 0);
    micro1.add(lb);
    slots.push({core, e, ring, lb, x, orbit, chosen, sp:0.9+i*0.12});
  });
  const lblTrend = label('the further out, the easier to lose','#ffe9a8',40);
  lblTrend.position.set(0, 3.5, 0);
  const lblPick = label(`${cap1(METALS[metalKey].name)} — ${METALS[metalKey].rank}`,
                        METALS[metalKey].lblCol, 42);
  lblPick.position.set(0, -4.3, 0);
  micro1.add(lblTrend, lblPick);
  M1 = {slots, lblTrend, lblPick};
}

function updateMicro1(t){
  const {slots, lblTrend, lblPick} = M1;
  const u = t - 7.0;
  slots.forEach(s=>{
    const a = u*s.sp*0.9;
    s.e.position.set(
      s.x + Math.cos(a)*s.orbit,
      Math.sin(a)*s.orbit*0.42,
      Math.sin(a)*s.orbit*0.80
    );
    s.core.position.y = Math.sin(u*0.7+s.x)*0.06;
    s.lb.material.opacity = ramp(t,8.0,9.0)*(1-ramp(t,12.8,13.8)) * (s.chosen?1:0.7);
  });
  lblTrend.material.opacity = ramp(t,10.4,11.4)*(1-ramp(t,12.8,13.8));
  lblPick.material.opacity  = ramp(t,11.2,12.2)*(1-ramp(t,12.8,13.8));
}

/* =====================================================================
   MICRO 2 — two metal atoms, two waters.  The metal is below, the water
   above, because that is how it really sits.
===================================================================== */
const micro2 = new THREE.Group(); micro2.position.y=MICRO2_Y; scene.add(micro2);
let M2 = {};

const V = (x,y,z)=>new THREE.Vector3(x,y,z);
const P = {
  heroA:  V(-1.60,-2.25, 0.60),   // the two atoms that go
  heroB:  V( 1.70,-2.25, 0.50),
  eParkA: V(-1.30,-3.05, 0.35),   // their electrons, waiting in the metal
  eParkB: V( 1.40,-3.05, 0.45),
  ionA:   V(-3.60, 1.70,-0.40),   // where the metal ions end up
  ionB:   V( 3.70, 1.50,-0.30),
  wAstart:V(-2.70, 3.00, 0.90), wAend: V(-1.55,-1.05, 0.62),
  wBstart:V( 2.90, 3.30, 0.60), wBend: V( 1.75,-1.05, 0.52),
  ohAend: V(-3.20,-0.20, 1.10),   // the hydroxides drift off sideways
  ohBend: V( 3.30,-0.30, 1.00),
  pair:   V( 0.10, 0.35, 0.70)    // where the two H atoms meet
};
const H_PAIR_OFF = 0.37;

function buildMicro2(){
  clearGroup(micro2);

  /* the metal below, as a packed slab with its electrons inside */
  const slab = new THREE.Group(); micro2.add(slab);
  for(let ix=-3;ix<=3;ix++) for(let iy=0;iy<2;iy++) for(let iz=-1;iz<=1;iz++){
    const a = atom(MT.col, MT.r, {rough:0.28, metal:0.72, lo:true});
    a.position.set(ix*1.25 + (iy?0.6:0), -2.85 - iy*1.1, iz*1.3 + (ix%2?0.3:0));
    slab.add(a);
  }
  const slabE = [];
  for(let i=0;i<14;i++){
    const e = electron(); electronFade(e, 0.75);
    e.userData = {...e.userData,
      c:V((Math.random()-0.5)*7.5, -3.3 + (Math.random()-0.5)*1.1, (Math.random()-0.5)*2.4),
      ax:0.9+Math.random()*1.1, ay:0.3+Math.random()*0.4, az:0.4+Math.random()*0.6,
      fx:0.6+Math.random()*0.8, fy:0.5+Math.random()*0.8, fz:0.5+Math.random()*0.7,
      ph:Math.random()*6.283};
    slab.add(e); slabE.push(e);
  }

  /* the cast: two metal atoms, their two electrons, two waters */
  const mA = atom(MT.col, MT.r, {rough:0.26, metal:0.75});
  const mB = atom(MT.col, MT.r, {rough:0.26, metal:0.75});
  const e1 = electron(), e2 = electron();
  electronFade(e1,0); electronFade(e2,0);
  micro2.add(mA,mB,e1,e2);

  // each reacting water: an oxygen, the hydrogen it keeps, the hydrogen it loses
  const waters = [];
  [[P.wAstart,P.wAend,P.ohAend,+1],[P.wBstart,P.wBend,P.ohBend,-1]].forEach(([s,e,oh,side],i)=>{
    const o  = atom(EL.O.col, 0.42, {rough:0.3});
    const hk = atom(EL.H.col, 0.28, {rough:0.3});      // stays — becomes OH⁻
    const hl = atom(EL.H.col, 0.28, {rough:0.3});      // leaves — becomes ½H₂
    const bk = bond(0x8c99aa, 0.075), bl = bond(0x8c99aa, 0.075);
    micro2.add(o,hk,hl,bk,bl);
    waters.push({o,hk,hl,bk,bl, start:s, end:e, ohEnd:oh, side,
                 lblW: label('H₂O','#a9c4ff',46),
                 lblOH: label('OH⁻','#9db4ff',48)});
  });
  waters.forEach(w=> micro2.add(w.lblW, w.lblOH));

  const hh = bond(0xd89a90, 0.095); hh.material.opacity = 0; micro2.add(hh);

  /* background water, so the space above the metal is obviously water */
  const crowd = [];
  for(let i=0;i<14;i++){
    const w = makeWater(0.16); w.scale.setScalar(0.8);
    w.userData = {base:V((Math.random()-0.5)*15, 0.5+Math.random()*5, -4-Math.random()*7),
                  ph:Math.random()*6.283, sp:0.3+Math.random()*0.6};
    micro2.add(w); crowd.push(w);
  }

  const lblAtomA = label(MT.sym, MT.lblCol), lblAtomB = label(MT.sym, MT.lblCol);
  const lblIonA  = label(MT.ion, MT.lblCol), lblIonB  = label(MT.ion, MT.lblCol);
  const lblE1 = label('e⁻','#ffe9a8',44), lblE2 = label('e⁻','#ffe9a8',44);
  const lblH2 = label('hydrogen, H₂','#ffb7ab',44);
  const lblAlk= label('hydroxide ions — this is the alkali','#b9a8e8',40);
  micro2.add(lblAtomA,lblAtomB,lblIonA,lblIonB,lblE1,lblE2,lblH2,lblAlk);

  M2 = {slab,slabE,mA,mB,e1,e2,waters,hh,crowd,
        lblAtomA,lblAtomB,lblIonA,lblIonB,lblE1,lblE2,lblH2,lblAlk};
}

function path3(out, A,B,C, t, t0,t1,t2){
  if(t<=t1) out.lerpVectors(A,B,smooth((t-t0)/(t1-t0)));
  else out.lerpVectors(B,C,smooth((t-t1)/(t2-t1)));
}
const _pa=new THREE.Vector3(), _pb=new THREE.Vector3();

function updateMicro2(t){
  const {slabE,mA,mB,e1,e2,waters,hh,crowd,
         lblAtomA,lblAtomB,lblIonA,lblIonB,lblE1,lblE2,lblH2,lblAlk} = M2;

  slabE.forEach(e=>{
    const d = e.userData;
    e.position.set(d.c.x + Math.sin(t*d.fx+d.ph)*d.ax,
                   d.c.y + Math.cos(t*d.fy+d.ph*1.3)*d.ay,
                   d.c.z + Math.sin(t*d.fz+d.ph*0.7)*d.az);
  });

  /* --- the two metal atoms.  A goes at 33, B copies it at 38.5. --- */
  const pairs = [
    {m:mA, home:P.heroA, park:P.eParkA, ion:P.ionA, e:e1, lbA:lblAtomA, lbI:lblIonA,
     lose:33.0, shed:[33.0,34.8], shrink:[33.6,35.4], go:[35.6,40.0]},
    {m:mB, home:P.heroB, park:P.eParkB, ion:P.ionB, e:e2, lbA:lblAtomB, lbI:lblIonB,
     lose:38.5, shed:[38.5,40.2], shrink:[39.1,40.8], go:[41.0,45.0]}
  ];
  pairs.forEach((p,i)=>{
    if(t < p.go[0]){
      p.m.position.copy(p.home);
      p.m.position.y += Math.sin(t*2.2+i)*0.05;
      if(t > p.lose) p.m.position.x += Math.sin(t*22)*0.03*(1-ramp(t,p.shed[0],p.shrink[1]));
    } else {
      _pa.lerpVectors(p.home, p.ion, smooth((t-p.go[0])/(p.go[1]-p.go[0])));
      _pa.y += Math.sin(t*0.8+i)*0.10*ramp(t,p.go[0],p.go[1]);
      p.m.position.copy(_pa);
    }
    p.m.scale.setScalar(MT.r * lerp(1, 0.70, ramp(t, p.shrink[0], p.shrink[1])));

    const swap = ramp(t, p.shrink[0]+0.2, p.shrink[1]);
    p.lbA.material.opacity = ramp(t,30.8,31.8)*(1-swap);
    p.lbI.material.opacity = swap*(1-ramp(t,55.5,56.5));
    p.lbA.position.copy(p.m.position).add(_v1.set(0,MT.r+0.8,0));
    p.lbI.position.copy(p.lbA.position);
  });

  /* --- the waters come down, take an electron each, and break --- */
  const take = [ramp(t,44.0,46.4), ramp(t,44.6,47.0)];
  const broke= [ramp(t,46.2,48.2), ramp(t,46.8,48.8)];
  const pairUp = ramp(t,48.6,51.0);
  const rise = Math.max(0, t-52.4);

  const hPos = [];
  waters.forEach((w,i)=>{
    // the oxygen: down from above, then away sideways as hydroxide
    _pa.lerpVectors(w.start, w.end, ramp(t, 41.0, 44.2));
    if(t > 48.0) _pa.lerp(w.ohEnd, ramp(t,48.0,54.0));
    _pa.y += Math.sin(t*0.9+i*2)*0.09;
    w.o.position.copy(_pa);

    // the hydrogen it keeps
    w.hk.position.set(_pa.x - w.side*W_OFF_KEEP, _pa.y + W_OFF_UP, _pa.z);
    placeBond(w.bk, _pa, w.hk.position, 0.04);

    // the hydrogen it loses: held, then drawn to the meeting point
    _pb.set(_pa.x + w.side*W_OFF_KEEP, _pa.y + W_OFF_UP, _pa.z);
    const c = P.pair.clone();
    c.y += rise*0.95; c.x += rise*0.12;
    _pb.lerp(_v1.copy(c).add(new THREE.Vector3(w.side*H_PAIR_OFF, i?-0.06:0.06, 0)), pairUp);
    w.hl.position.copy(_pb);
    hPos.push(_pb.clone());

    // the O–H bond to the leaving hydrogen fades as it goes
    w.bl.material.opacity = 1 - broke[i];
    w.bl.visible = broke[i] < 0.99;
    if(w.bl.visible) placeBond(w.bl, _pa, _pb, 0.04);

    // and it is water until it breaks, hydroxide afterwards
    const named = ramp(t,41.8,42.8);
    w.lblW.material.opacity  = named*(1-broke[i]);
    w.lblOH.material.opacity = broke[i]*(1-ramp(t,57.0,58.0));
    w.lblW.position.copy(_pa).add(_v1.set(0,1.15,0));
    w.lblOH.position.copy(_pa).add(_v1.set(0,1.15,0));
  });

  // the H–H bond
  const hhOn = ramp(t,50.0,51.4);
  hh.material.opacity = hhOn;
  hh.visible = hhOn > 0.01;
  if(hh.visible) placeBond(hh, hPos[0], hPos[1], 0.05);

  /* --- the two electrons: out of the metal, waiting, then to the waters --- */
  const out1 = ramp(t,33.0,34.8), out2 = ramp(t,38.5,40.2);
  const jit = (v,f,a,ph)=>v.add(_v1.set(Math.sin(t*f+ph)*a, Math.cos(t*f*0.8+ph)*a*0.5, Math.sin(t*f*1.3+ph)*a*0.6));
  const eA = P.heroA.clone().lerp(P.eParkA, out1); jit(eA, 3.2, 0.09*out1, 0.4);
  eA.lerp(waters[0].o.position, take[0]);
  const eB = P.heroB.clone().lerp(P.eParkB, out2); jit(eB, 2.8, 0.09*out2, 2.1);
  eB.lerp(waters[1].o.position, take[1]);
  e1.position.copy(eA); e2.position.copy(eB);
  electronFade(e1, ramp(t,33.0,33.8)*(1-ramp(t,46.0,46.8)));
  electronFade(e2, ramp(t,38.5,39.3)*(1-ramp(t,46.6,47.4)));

  const eLbl1 = ramp(t,34.0,35.0)*(1-ramp(t,45.0,45.8));
  const eLbl2 = ramp(t,39.5,40.5)*(1-ramp(t,45.6,46.4));
  lblE1.material.opacity = eLbl1; lblE2.material.opacity = eLbl2;
  lblE1.position.copy(eA).add(_v1.set(0.1,0.6,0));
  lblE2.position.copy(eB).add(_v1.set(0.1,0.6,0));

  lblH2.material.opacity = ramp(t,51.4,52.4)*(1-ramp(t,56.0,57.0));
  lblH2.position.copy(hPos[0]).add(_v1.set(0.35,0.95,0));
  lblAlk.material.opacity = ramp(t,53.8,54.8)*(1-ramp(t,58.4,59.4));
  lblAlk.position.set(0, waters[0].o.position.y - 1.5, 0.6);

  crowd.forEach(o=>{
    const u = o.userData;
    o.position.set(
      u.base.x + Math.sin(t*0.42*u.sp+u.ph)*1.5,
      u.base.y + Math.cos(t*0.35*u.sp+u.ph)*1.0,
      u.base.z + Math.sin(t*0.28*u.sp+u.ph*1.7)*1.2
    );
    o.rotation.y = t*0.25*u.sp;
    o.rotation.x = Math.sin(t*0.3+u.ph)*0.5;
  });
}

    {t:35.8, p:[-1.8,-0.4,9.4], l:[-2.0,-0.9,0]},

    {t:41.4, p:[0,-0.4,9.8],    l:[0,-1.6,0.4]},
    {t:44.2, p:[-1.3,0.0,8.2],  l:[-1.4,-1.0,0.6]},
    {t:46.6, p:[-1.0,0.3,7.8],  l:[-1.2,-0.6,0.6]},
    {t:49.4, p:[0.2,0.5,7.4],   l:[0.1,0.1,0.6]},
    {t:52.4, p:[0.3,1.2,8.8],   l:[0.1,0.8,0.5]},
    {t:54.8, p:[0,0.8,11.4],    l:[0,0.0,0.4]},
    {t:60.0, p:[1.4,1.4,13.8],  l:[0.2,0.2,0]}
  ]
};

const camPos=new THREE.Vector3(), camTgt=new THREE.Vector3();
function sampleCam(t){
  const w = worldAt(t), keys = CAM[w];
  let i=0; while(i<keys.length-2 && t>=keys[i+1].t) i++;
  const a=keys[i], b=keys[Math.min(i+1,keys.length-1)];
  const u = b.t===a.t?0:smooth((t-a.t)/(b.t-a.t));
  const off = w==='micro1'?MICRO1_Y : w==='micro2'?MICRO2_Y : 0;
  camPos.set(lerp(a.p[0],b.p[0],u), lerp(a.p[1],b.p[1],u)+off, lerp(a.p[2],b.p[2],u));
  camTgt.set(lerp(a.l[0],b.l[0],u), lerp(a.l[1],b.l[1],u)+off, lerp(a.l[2],b.l[2],u));
}

/* ---------- macro animation ---------- */
function updateMacro(t){
  const move = ramp(t,16.2,18.6);
  tongs.position.lerpVectors(TONGS_START, TONGS_OVER, move);
  const open = ramp(t,OPEN_A,OPEN_B);
  armL.rotation.z =  ARM_TILT + open*0.15;
  armR.rotation.z = -ARM_TILT - open*0.15;
  const away = ramp(t,19.6,21.6);
  tongs.position.y += away*2.6;
  tongs.position.x -= away*1.8;
  tongs.rotation.z = away*0.45;
  if(t<16.2) tongs.rotation.y = Math.sin(t*0.5)*0.18;

  /* the lump: held, dropped, then skating about on the surface */
  if(t < OPEN_B){
    lump.position.copy(tongs.position);
  } else if(t < LAND){
    const u = clamp01((t-OPEN_B)/(LAND-OPEN_B));
    lump.position.set(
      lerp(TONGS_OVER.x, skatePos(LAND).x, u),
      lerp(TONGS_OVER.y, WATER_TOP+0.07, u*u),
      lerp(0, skatePos(LAND).z, u)
    );
  } else {
    lump.position.copy(skatePos(t));
  }
  lump.rotation.set(t*0.7, t*0.9, t*0.4);
  // it melts into a ball (sodium and potassium do), and is eaten away
  const melted = MT.melts ? ramp(t, 20.3, 21.8) : 0;
  const eaten  = ramp(t, 20.4, SKATE_B) * (0.55 + 0.45*MT.vigour);
  const s = 1 - eaten*0.92;
  lump.scale.set(s*lerp(1.12,1,melted), s*lerp(0.78,1,melted), s*lerp(0.95,1,melted));
  lump.material.roughness = lerp(0.34, 0.12, melted);
  lump.visible = s > 0.05 && t > 0;

  /* the flame, for potassium */
  if(MT.flame){
    const on = ramp(t,20.3,21.0)*(1-ramp(t,27.6,29.0));
    const flick = 0.82 + Math.sin(t*17)*0.1 + Math.sin(t*29)*0.06;
    flame.position.copy(lump.position).add(_v1.set(0,0.34,0));
    flame.scale.setScalar(1.5*on*flick);
    flame.material.opacity = on*0.95;
    flameLight.position.copy(flame.position);
    flameLight.intensity = on*2.6*flick;
  } else {
    flame.material.opacity = 0;
    flameLight.intensity = 0;
  }

  /* the indicator: neutral green to alkaline purple */
  const alk = ramp(t,21.0,29.2);
  waterMat.color.setRGB(
    lerp(IND_NEUTRAL[0],IND_ALKALI[0],alk),
    lerp(IND_NEUTRAL[1],IND_ALKALI[1],alk),
    lerp(IND_NEUTRAL[2],IND_ALKALI[2],alk));
    waterMat.color.convertSRGBToLinear();   // rewritten each frame, so convert here
  wSurface.material.color.setRGB(
    lerp(0.56,0.52,alk), lerp(0.84,0.42,alk), lerp(0.63,0.80,alk));
    wSurface.material.color.convertSRGBToLinear();   // rewritten each frame, so convert here

  updateBubbles(t);
}

/* =====================================================================
   ORBIT-ISH DRAG
===================================================================== */
let yaw=0, pitch=0, dragging=false, lx=0, ly=0;
const el = renderer.domElement;
function down(x,y){dragging=true;lx=x;ly=y;el.style.cursor='grabbing';}
function move(x,y){
  if(!dragging) return;
  yaw   -= (x-lx)*0.005;
  pitch  = Math.max(-0.9, Math.min(0.9, pitch + (y-ly)*0.004));
  lx=x; ly=y;
}
function up(){dragging=false; el.style.cursor='grab';}
el.style.cursor='grab';
el.addEventListener('mousedown',e=>down(e.clientX,e.clientY));
addEventListener('mousemove',e=>move(e.clientX,e.clientY));
addEventListener('mouseup',up);
el.addEventListener('touchstart',e=>{down(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
el.addEventListener('touchmove',e=>{move(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
addEventListener('touchend',up);

const _sph = new THREE.Spherical();
function applyCamera(){
  const dir = camPos.clone().sub(camTgt);
  _sph.setFromVector3(dir);
  _sph.theta += yaw;
  _sph.phi = Math.max(0.12, Math.min(Math.PI-0.12, _sph.phi - pitch));
  dir.setFromSpherical(_sph);
  camera.position.copy(camTgt).add(dir);
  camera.lookAt(camTgt);
}

/* =====================================================================
   UI
===================================================================== */
const capEl  = document.getElementById('caption');
const fadeEl = document.getElementById('fade');
const playBtn= document.getElementById('play');
const scrub  = document.getElementById('scrub');
const clock  = document.getElementById('clock');
const keyEl  = document.getElementById('key');
const menuEl = document.getElementById('menu');
const gearEl = document.getElementById('gear');

let t = 0, playing = true, lastFrame = performance.now(), curSeg = -1;

playBtn.onclick = ()=>{ playing=!playing; playBtn.textContent = playing?'Pause':'Play'; };
document.getElementById('restart').onclick = ()=>{ t=0; curSeg=-1; playing=true; playBtn.textContent='Pause'; };
scrub.oninput = ()=>{ t = parseFloat(scrub.value); curSeg=-1; };
addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault(); playBtn.click(); }
  if(e.code==='ArrowRight'){ t = Math.min(TOTAL, t+2); curSeg=-1; }
  if(e.code==='ArrowLeft'){  t = Math.max(0, t-2);     curSeg=-1; }
  if(e.code==='Escape') setMenu(false);
});

function captionFor(time){
  let i=0; for(let k=0;k<SEGS.length;k++) if(time>=SEGS[k].t) i=k;
  return i;
}
function fadeAmount(time){
  let f=0;
  for(const T of TRANSITIONS) f = Math.max(f, 1 - Math.min(1, Math.abs(time-T)/FADE));
  return f;
}

const hexCss = n => '#'+n.toString(16).padStart(6,'0');

function buildLegend(){
  const rows = [
    {sym:MT.sym, name:MT.name, col:MT.col},
    {sym:'O', name:'oxygen',   col:EL.O.col},
    {sym:'H', name:'hydrogen', col:EL.H.col},
    {sym:'e⁻', name:'electron', col:E_COL}
  ];
  keyEl.innerHTML = rows.map(r=>
    `<div><span class="dot" style="background:${hexCss(r.col)}"></span><b>${r.sym}</b> ${r.name}</div>`
  ).join('');
}

const byReactivity = Object.keys(METALS).sort((a,b)=>METALS[a].react-METALS[b].react);

function buildMenu(){
  document.getElementById('metalOpts').innerHTML = byReactivity.map(k=>
    `<button class="opt ${k===metalKey?'on':''}" data-key="${k}">` +
    `<span class="f">${METALS[k].sym}</span> · ${METALS[k].name}</button>`
  ).join('');
  document.getElementById('menuEq').innerHTML =
    `${equation()}<span>All three do the same thing, and all three make an alkali — ` +
    `only the speed changes. ${cap1(MT.name)} is ${MT.rank}, because its outer electron sits ` +
    `${MT.where} and is ${MT.hold}. The reaction is <i>${halves()}</i>.</span>`;
  menuEl.querySelectorAll('.opt').forEach(b=>{
    b.onclick = ()=>{ metalKey = b.dataset.key; build(); playing = true; playBtn.textContent = 'Pause'; };
  });
}

function setMenu(open){
  menuEl.classList.toggle('open', open);
  gearEl.classList.toggle('open', open);
  if(open) buildMenu();
}
gearEl.onclick = ()=> setMenu(!menuEl.classList.contains('open'));

/* ---------- rebuild everything that depends on the species ---------- */
function build(){
  derive();
  buildLump();
  buildBubbles();
  buildMicro1();
  buildMicro2();
  buildCaptions();
  buildLegend();
  linearise(scene);      // authored colours are sRGB; the renderer wants linear

  document.title = `${cap1(MT.name)} + water`;
  document.getElementById('h1').textContent = `${cap1(MT.name)} on water`;
  document.getElementById('subtitle').textContent = equation();
  scrub.style.setProperty('--hl', hexCss(MT.col));

  if(menuEl.classList.contains('open')) buildMenu();
  history.replaceState(null,'',`?metal=${metalKey}`);

  t = 0; curSeg = -1;
}
build();

/* =====================================================================
   LOOP
===================================================================== */
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min((now-lastFrame)/1000, 1/24);
  lastFrame = now;

  if(playing){
    t += dt;
    if(t >= TOTAL){ t = TOTAL; playing=false; playBtn.textContent='Play'; }
  }

  updateMacro(t);
  updateMicro1(t);
  updateMicro2(t);
  sampleCam(t);
  applyCamera();

  const f = fadeAmount(t);
  fadeEl.style.opacity = f;
  const seg = captionFor(t);
  if(seg !== curSeg){ curSeg = seg; capEl.textContent = SEGS[seg].c; }
  capEl.style.opacity = 1 - f;
  scrub.value = t;
  scrub.style.setProperty('--p', (t/TOTAL*100)+'%');
  clock.textContent = t.toFixed(1)+' / '+TOTAL.toFixed(1)+'s';

  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
