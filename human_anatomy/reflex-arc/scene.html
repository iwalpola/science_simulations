<style>
:root{--cyan:#19a3dc;--deep:#0a5f8f;--orange:#ef8a22;--ink:#17324d;--paper:#ffffff;--wash:#eaf6fc}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:#dceef7}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}

#key{display:flex;align-items:center;gap:15px;flex-wrap:wrap;font-size:13px;font-weight:700;color:#3d6480}
.kitem{display:flex;align-items:center;gap:6px;white-space:nowrap}
.ln{width:24px;height:6px;border-radius:3px;flex:none}
.imp{width:14px;height:14px;border-radius:50%;flex:none;background:radial-gradient(circle,#fff 0 22%,#ff3d9a 45%,rgba(255,45,138,0) 72%)}
.blk{display:inline-grid;place-items:center;width:23px;height:23px;border-radius:5px;font:800 13px Nunito,sans-serif;border:2px solid rgba(0,0,0,.4);box-shadow:inset 0 3px 0 rgba(255,255,255,.55);vertical-align:middle;flex:none}
.blk.T{background:#e5531a;color:#fff}

#bar{position:fixed;left:12px;right:12px;bottom:12px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  background:rgba(255,255,255,.95);border-radius:16px;padding:9px 16px;box-shadow:0 8px 26px rgba(10,60,100,.22)}
#label{display:flex;flex-direction:column;min-width:0}
#kicker{font-size:11.5px;font-weight:800;color:#5d7f93;letter-spacing:.5px;text-transform:uppercase}
#title{font:600 21px/1.15 Fredoka,sans-serif;color:var(--deep);white-space:nowrap}
#ctrl{display:flex;gap:6px;flex-wrap:wrap}
#navwrap{display:flex;align-items:center;gap:10px;margin-left:auto}
#replay{width:34px;height:34px;border-radius:50%;border:2px solid #9cc3d8;background:transparent;color:var(--deep);font-size:17px;cursor:pointer;flex:none}
#replay:hover{background:var(--wash)}
.btn{font:700 13.5px Nunito,sans-serif;border:none;border-radius:999px;padding:7px 13px;background:var(--orange);color:#fff;cursor:pointer}
.btn.ghost{background:transparent;color:var(--deep);border:2px solid #9cc3d8}
.btn.on{background:var(--deep)}
button.navb{font:700 15px Nunito,sans-serif;border:none;border-radius:999px;padding:8px 16px;cursor:pointer}
#prev{background:var(--wash);color:var(--deep)}
#next{background:var(--orange);color:#fff}
button:disabled{opacity:.35;cursor:default}
#dots{display:flex;gap:5px}
#dots button{width:11px;height:11px;border-radius:50%;border:none;background:#c6dce8;padding:0;cursor:pointer}
#dots button.on{background:var(--cyan);transform:scale(1.3)}
button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

@media (max-width:860px){
  #key{gap:9px;font-size:11px}
  #bar{left:6px;right:6px;bottom:6px;padding:7px 10px;gap:10px}
  #title{font-size:17px;white-space:normal}
  #navwrap{gap:7px}
  button.navb{padding:7px 12px;font-size:14px}
}
</style>

/* A stable hash, used where a value must depend on an index rather than on
   how many times something has been called. */
function hash(n){n=(n^61)^(n>>>16);n=(n+(n<<3))>>>0;n^=n>>>4;n=(n*0x27d4eb2d)>>>0;n^=n>>>15;return(n>>>0)/4294967296;}

/* ===================================================================
   THE REFLEX ARC, AS DATA
   The flow chart, the highlighting and the synapse count all come out of
   this one list. A synapse is wherever one neurone hands on to the next,
   so the count is worked out, not typed.
   =================================================================== */
const ARC=[
  {id:'stimulus',name:'Stimulus',what:'heat from the hot plate',kind:'event'},
  {id:'receptor',name:'Receptor',what:'nerve endings in the skin detect it',kind:'cell'},
  {id:'sensory',name:'Sensory neurone',what:'carries the impulse to the spinal cord',kind:'neurone'},
  {id:'relay',name:'Relay neurone',what:'passes it on, inside the spinal cord',kind:'neurone'},
  {id:'motor',name:'Motor neurone',what:'carries the impulse to the muscle',kind:'neurone'},
  {id:'effector',name:'Effector',what:'the biceps muscle contracts',kind:'cell'},
  {id:'response',name:'Response',what:'the hand is pulled away',kind:'event'}
];
function synapsesOf(arc){
  const out=[];
  for(let i=1;i<arc.length;i++)
    if(arc[i-1].kind==='neurone'&&arc[i].kind==='neurone')out.push([arc[i-1].id,arc[i].id]);
  return out;
}
const SYNAPSES=synapsesOf(ARC);

/* ===================================================================
   THE TIMELINE
   One run of the reflex is a chain of phases, each starting when the one
   before it ends. The phases along a neurone last as long as the impulse
   takes to cover that neurone's length on screen, at the chapter's speed,
   so a longer neurone takes longer. The message to the brain leaves from
   the first synapse, at the same moment as the relay neurone fires.
   =================================================================== */
const PHASES=['heat','sensory','syn1','relay','syn2','motor','contract'];
function mkRun(o,len){
  const d={heat:o.heat,sensory:len.sensory/o.vs,syn1:o.syn,relay:o.relay,syn2:o.syn,motor:len.motor/o.vm,contract:o.contract};
  const ph={};let t=0;
  PHASES.forEach(k=>{ph[k]={t0:t,t1:t+d[k],d:d[k]};t+=d[k];});
  const u0=ph.syn1.t1,du=len.up/o.vu;
  ph.up={t0:u0,t1:u0+du,d:du};
  ph.feel={t0:ph.up.t1,t1:ph.up.t1+o.feel,d:o.feel};
  return {ph,o,end:Math.max(ph.contract.t1,ph.feel.t1)+o.hold};
}
function prog(run,k,t){
  const p=run.ph[k];
  return p.d>0?clamp((t-p.t0)/p.d,0,1):(t>=p.t1?1:0);
}
/* The forearm only moves once the muscle has the impulse: the elbow angle
   is zero until the contraction phase starts. */
const TH_MAX=70*Math.PI/180;
function elbow(run,t){return TH_MAX*ease(prog(run,'contract',t));}
/* Which step of the arc is happening now, as an index into ARC. */
function stepAt(run,t){
  const p=k=>prog(run,k,t);
  if(p('heat')<0.72)return 0;
  if(p('heat')<1)return 1;
  if(p('syn1')<=0)return 2;
  if(p('syn2')<=0)return 3;
  if(p('contract')<=0)return 4;
  if(p('contract')<0.5)return 5;
  return 6;
}

/* ===================================================================
   DRAWING HELPERS
   The scene is drawn in a fixed stage and scaled to fit whatever room the
   bar leaves, so nothing has to be re-laid out.
   =================================================================== */
const SW=1400,SH=650;
const canvas=$('#c'),ctx=canvas.getContext('2d');
let dpr=1,stage={x:0,y:0,s:1};

function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function shade(hex,k){
  const n=parseInt(hex.slice(1),16);
  const c=v=>Math.min(255,Math.round(v*k));
  return 'rgb('+c(n>>16)+','+c(n>>8&255)+','+c(n&255)+')';
}
function txt(s,x,y,o){
  o=o||{};

  ctx.textAlign=o.align||'left';ctx.textBaseline=o.base||'alphabetic';
  if(o.halo){ctx.lineWidth=o.halo;ctx.strokeStyle=o.haloCol||'rgba(255,255,255,.9)';ctx.strokeText(s,x,y);}
  ctx.fillStyle=o.col||'#17324d';ctx.fillText(s,x,y);
}
function pill(s,x,y,o){
  o=o||{};
  const f=o.font||'700 15px Nunito, sans-serif';
  ctx.font=f;
  const w=ctx.measureText(s).width+2*(o.pad||11),h=o.h||27;
  const x0=o.align==='center'?x-w/2:(o.align==='right'?x-w:x);

  ctx.fillStyle=o.bg||'rgba(255,255,255,.94)';ctx.fill();
  ctx.lineWidth=2.5;ctx.strokeStyle=o.bd||'#19a3dc';ctx.stroke();
  txt(s,x0+w/2,y+1,{font:f,align:'center',base:'middle',col:o.col||'#15314b'});

}
function line(pts,col,w,o){
  o=o||{};

  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  if(o.alpha!==undefined)ctx.globalAlpha=clamp(o.alpha,0,1);

}
function dot(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}
function leader(x0,y0,x1,y1,col){line([[x0,y0],[x1,y1]],col||'#5d7f93',2,{dash:[4,4]});dot(x1,y1,3.5,col||'#5d7f93');}

/* An energy block, exactly the one used in the energy stories: a rounded
   square with a letter, a dark rim and a gloss along the top. */
const BLOCK={T:{c:'#e5531a',f:'#ffffff'}};
function blk(type,x,y,s,alpha,rot){
  const Bk=BLOCK[type];
  ctx.save();ctx.globalAlpha=clamp(alpha===undefined?1:alpha,0,1);
  ctx.translate(x,y);if(rot)ctx.rotate(rot);
  rr(-s/2,-s/2,s,s,s*0.19);ctx.fillStyle=shade(Bk.c,0.5);ctx.fill();
  const i=s*0.86;
  rr(-i/2,-i/2,i,i,i*0.15);ctx.fillStyle=Bk.c;ctx.fill();
  const g=ctx.createLinearGradient(0,-i/2,0,i*0.05);
  g.addColorStop(0,'rgba(255,255,255,.6)');g.addColorStop(1,'rgba(255,255,255,0)');
  rr(-i/2,-i/2,i,i*0.5,i*0.15);ctx.fillStyle=g;ctx.fill();
  txt(type,0,s*0.045,{font:'800 '+(s*0.58).toFixed(1)+'px Nunito, sans-serif',align:'center',base:'middle',col:Bk.f});
  ctx.restore();

/* Polylines with arc length, so anything that travels along one is a pure
   function of how far along it is. */
function polyline(pts){
  const seg=[];let L=0;
  for(let i=1;i<pts.length;i++){
    const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
    seg.push({a:pts[i-1],b:pts[i],d,s0:L});L+=d;
  }
  return {pts,seg,L};
}
function alongPoly(p,s){
  if(!p.seg.length)return p.pts[0];
  s=clamp(s,0,p.L);
  for(let i=0;i<p.seg.length;i++){
    const g=p.seg[i];
    if(s<=g.s0+g.d||i===p.seg.length-1){
      const u=g.d>0?(s-g.s0)/g.d:0;
      return [lerp(g.a[0],g.b[0],u),lerp(g.a[1],g.b[1],u)];
    }
  }
}
/* the stretch of a polyline between two arc lengths */
function slice(p,s0,s1){
  s0=clamp(s0,0,p.L);s1=clamp(s1,0,p.L);
  const out=[alongPoly(p,s0)];
  p.seg.forEach(g=>{if(g.s0>s0&&g.s0<s1)out.push(g.a);});
  out.push(alongPoly(p,s1));
  return out;
}
/* Catmull-Rom through a handful of points, so a nerve curves instead of
   kinking at every landmark. */
function spline(pts,n){
  n=n||8;
  if(pts.length<3)return pts.slice();
  const out=[];
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
    for(let k=0;k<n;k++){
      const t=k/n,t2=t*t,t3=t2*t;
      out.push([0,1].map(j=>0.5*((2*p1[j])+(-p0[j]+p2[j])*t+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3)));
    }
  }
  out.push(pts[pts.length-1]);
  return out;
}
const curve=pts=>polyline(spline(pts));

/* A stream of blocks sliding along a polyline. Block k sits at arc
   length (t*speed + k*spacing) mod L, so the stream is a pure function of t. */
function stream(pts,t,o){
  o=o||{};
  const p=polyline(pts),sp=o.spacing||58,v=o.speed||120,size=o.size||20;
  if(p.L<1)return;
  const n=Math.max(1,Math.round(p.L/sp));
  const head=t*v+(o.phase||0);
  for(let k=0;k<n;k++){
    let s=(head+k*sp)%p.L;if(s<0)s+=p.L;
    const u=s/p.L,q=alongPoly(p,s);
    const a=clamp(u/0.18,0,1)*clamp((1-u)/0.18,0,1);
    blk('T',q[0],q[1],size,a*(o.alpha===undefined?1:o.alpha),Math.sin(t*1.7+k*1.3)*0.3);
  }
}

/* The impulse: a bright point with a short tail behind it. Not an
   electron and not a block -- its own colour, used for nothing else. */
const IMP='#ff3d9a';
function glow(x,y,r,a){
  a=a===undefined?1:a;
  if(!(a>0.01))return;
  ctx.save();ctx.globalAlpha=clamp(a,0,1);
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(0.26,'rgba(255,92,172,.95)');g.addColorStop(1,'rgba(255,61,154,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
  ctx.restore();
}
function impulse(p,u,r,o){
  o=o||{};
  if(!(u>0)||u>=1||p.L<=0)return;
  const s=u*p.L;
  /* the stretch already travelled, lit faintly */
  if(o.trail!==false)line(slice(p,Math.max(0,s-(o.trail||p.L)),s),IMP,r*0.32,{alpha:0.45});
  for(let k=4;k>=0;k--){
    const sk=s-k*r*0.5;if(sk<0)continue;
    const q=alongPoly(p,sk);
    glow(q[0],q[1],r*(1-k*0.12),1-k*0.18);
  }

/* A neurone's fibre: the line itself, with the myelin sheath laid over it
   in sections so the gaps between them show. */
function fibre(p,col,w,o){
  o=o||{};
  line(p.pts,col,w,{halo:o.halo});
  if(!o.myelin)return;
  const seg=o.seg||46,gap=o.gap||9,a=o.from||0,b=o.to===undefined?p.L:o.to;
  for(let s=a;s<b-6;s+=seg+gap){
    const q=slice(p,s,Math.min(s+seg,b));
    line(q,shade(col,0.75),w+11);
    line(q,'#fbf3e4',w+6);

/* a neurone's cell body, with its nucleus */
function soma(x,y,r,col){
  ctx.save();
  const g=ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.1,x,y,r);
  g.addColorStop(0,'#ffffff');g.addColorStop(0.35,shade(col,1.15));g.addColorStop(1,col);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
  ctx.lineWidth=2.5;ctx.strokeStyle=shade(col,0.6);ctx.stroke();
  dot(x+r*0.08,y+r*0.05,r*0.36,shade(col,0.5));
  ctx.restore();
}
/* a little break in a long fibre: it is far longer than it is drawn */
function breakMark(x,y,h){
  ctx.save();ctx.fillStyle='rgba(255,255,255,.96)';
  ctx.beginPath();ctx.moveTo(x-8,y+h);ctx.lineTo(x+2,y+h);ctx.lineTo(x+12,y-h);ctx.lineTo(x+2,y-h);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#8aa7bb';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x-8,y+h);ctx.lineTo(x+2,y-h);ctx.moveTo(x+2,y+h);ctx.lineTo(x+12,y-h);ctx.stroke();
  ctx.restore();
}

/* ===================================================================
   THE BODY
   Baked out of the 3D model by bake-backdrop.js: bones, nerves and brain,
   side on, with the forearm as a layer of its own. Everything the page
   lays on top -- the cord, the neurones, the biceps, the hot plate -- is
   placed from the landmarks the bake found in the model.
   Screen-plane coordinates are (y, z) in metres: y across, with the front
   of the body on the left, and z up.
   =================================================================== */
const B=BAKED;
const S=520;                                  /* stage units per metre */
const YL=-0.40,ZT=1.78,FX=26,FY=18;           /* the figure's frame */
const FX_=y=>FX+(y-YL)*S, FY_=z=>FY+(ZT-z)*S;
const P=v=>[FX_(v[0]),FY_(v[1])];
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]];
const mix=(a,b,u)=>[lerp(a[0],b[0],u),lerp(a[1],b[1],u)];
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const dist3=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
const PV=P(B.pivot);
function rot(q,th){
  const dx=q[0]-PV[0],dy=q[1]-PV[1],c=Math.cos(th),s=Math.sin(th);
  return [PV[0]+dx*c-dy*s,PV[1]+dx*s+dy*c];
}
/* the spinal canal, top to bottom: y at a given height */
function canalAt(z){
  const C=B.canal;
  if(z>=C[0][1])return C[0][0];
  for(let i=1;i<C.length;i++)
    if(z>=C[i][1])return lerp(C[i][0],C[i-1][0],(z-C[i][1])/(C[i-1][1]-C[i][1]));
  return C[C.length-1][0];
}
/* where the arm's nerves join the cord: low in the neck, a little above
   the shoulder joint */
const CORD_Z=B.shoulder[1]+0.09;
const CORD=[canalAt(CORD_Z),CORD_Z];
const HOB_Z=B.skinTip[1];                     /* the fingertip rests exactly on it */
const BICEPS_W=0.034;                         /* thickness at rest, metres */
let REST_L=0;                                 /* biceps length at rest, set below */

/* Everything drawn on the figure, at a given elbow angle. The forearm
   points are worked out hanging, then swung about the elbow with it. */
function figure(th){
  const f=v=>rot(P(v),th);
  const O=P(add(B.shoulder,[-0.016,0.018]));                /* biceps origin, above the shoulder joint */
  const I=f(add(B.pivot,[-0.016,-0.038]));                  /* insertion, just below the elbow */
  const L=dist(O,I);
  const n=(()=>{const dx=I[0]-O[0],dy=I[1]-O[1],l=Math.hypot(dx,dy)||1;let nx=-dy/l,ny=dx/l;if(nx>0){nx=-nx;ny=-ny;}return [nx,ny];})();
  const L0=REST_L||L;
  const w=BICEPS_W*S*Math.sqrt(L0/L);                      /* same volume, shorter and fatter */
  const entry=add(mix(O,I,0.42),[n[0]*w*0.25,n[1]*w*0.25]);
  const tipIn=f([B.skinTip[0],B.skinTip[1]+0.012]);
  const sens=[
    tipIn,
    f(add(mix(B.tip,B.wrist,0.5),[-0.012,0])),
    f(add(B.wrist,[-0.016,0])),
    f(add(mix(B.wrist,B.pivot,0.5),[-0.020,0])),
    f(add(B.pivot,[-0.022,-0.012])),
    P(add(mix(B.pivot,B.shoulder,0.32),[-0.008,0])),
    P(add(mix(B.pivot,B.shoulder,0.72),[-0.004,0])),
    P(add(B.shoulder,[-0.004,-0.035])),
    P([lerp(B.shoulder[0],CORD[0],0.45),CORD[1]-0.012]),
    P(add(CORD,[0.016,-0.003])),                           /* the swelling beside the cord where its cell body sits */
    P(add(CORD,[0.004,0]))
  ];
  const relay=[P(add(CORD,[0.004,0])),P(add(CORD,[-0.002,-0.004])),P(add(CORD,[-0.005,-0.006]))];
  const motor=[
    P(add(CORD,[-0.005,-0.006])),
    P([lerp(B.shoulder[0],CORD[0],0.45)-0.006,CORD[1]-0.020]),
    P(add(B.shoulder,[-0.011,-0.040])),
    entry
  ];
  /* up the cord to the brainstem, then into the top of the brain */
  const up=[P(add(CORD,[0.002,0]))];
  B.canal.filter(c=>c[1]>CORD_Z+0.01).reverse().forEach(c=>up.push(P(c)));
  up.push(P(B.stem));
  up.push(P([(B.brain.y0+B.brain.y1)/2+0.01,B.brain.z1-0.035]));
  return {th,O,I,L,w,n,entry,tipIn,
    sens:curve(sens),relay:polyline(relay),motor:curve(motor),up:curve(up)};
}
const REST=figure(0);
REST_L=REST.L;
/* how long each neurone is ON SCREEN, which sets how long the impulse
   takes along it */
const LEN={sensory:REST.sens.L,motor:REST.motor.L,up:REST.up.L};
/* ...and how long it is IN THE MODEL. Straight lines between the bones
   the nerve follows, so this is if anything an underestimate. */
const CORD3=[0,CORD[0],CORD[1]];
const LEN3={
  sensory:dist3(B.tip3,B.wrist3)+dist3(B.wrist3,B.pivot3)+dist3(B.pivot3,B.shoulder3)+dist3(B.shoulder3,CORD3),
  motor:dist3(CORD3,B.shoulder3)+0.5*dist3(B.shoulder3,B.pivot3)
};
/* Numbers the captions quote. They are derived, not typed in. */
const FACTS={
  sensoryM:LEN3.sensory.toFixed(1),
  motorM:LEN3.motor.toFixed(1),
  synapses:SYNAPSES.length
};

/* --- the baked layers --- */
const IMG={};
(function(){
  if(typeof Image==='undefined')return;
  [['body',['flesh','bone','brain','nerve']],['arm',['flesh','bone','nerve']]].forEach(L=>L[1].forEach(k=>{
    const im=new Image();im.src=B[L[0]][k];IMG[L[0]+'.'+k]=im;
  }));
})();
function layer(L,k,alpha){
  const im=IMG[L+'.'+k];
  if(!im||!im.complete||!im.naturalWidth)return;
  const b=B[L];
  ctx.globalAlpha=alpha;
  ctx.drawImage(im,FX_(b.y0),FY_(b.z1),b.w/B.K*S,b.h/B.K*S);
  ctx.globalAlpha=1;
}
function armLayer(k,alpha,th){
  ctx.save();
  ctx.translate(PV[0],PV[1]);ctx.rotate(th);ctx.translate(-PV[0],-PV[1]);
  layer('arm',k,alpha);
  ctx.restore();
}

/* the stage furniture */
const PB={x:378,y:16,w:1006,h:590};          /* the close-up panel */
const COL={sens:'#2b7bd6',relay:'#2a9d5c',motor:'#d4442e',up:'#8a5cc8',cord:'#f2bcc3',cordEdge:'#c16f7e',muscle:'#c4473f',nerve:'#e2bd5e'};

function hob(t,st){
  const cx=FX_(B.skinTip[0]),top=FY_(HOB_Z),w=0.18*S,h=0.024*S;
  ctx.save();
  /* heat shimmer; the middle wisp only once the hand is off */
  const lifted=ease(st.p.contract);
  for(let i=0;i<5;i++){
    const ph=(t*0.45+i*0.2)%1;
    const x=cx-w*0.38+i*w*0.19;
    ctx.globalAlpha=(1-ph)*0.55*(i===2?lifted:1);
    ctx.strokeStyle='#f08a3a';ctx.lineWidth=2;
    ctx.beginPath();
    for(let k=0;k<=10;k++){
      const yy=top-6-ph*48-k*2.4;
      const xx=x+Math.sin(k*0.9+t*3+i)*3;
      k?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);
    }
    ctx.stroke();
  }
  ctx.globalAlpha=1;
  rr(cx-w/2,top,w,h,4);ctx.fillStyle='#3a3f47';ctx.fill();
  const g=ctx.createLinearGradient(0,top,0,top+5);
  g.addColorStop(0,'#ff7a2a');g.addColorStop(1,'rgba(255,122,42,0)');
  ctx.fillStyle=g;ctx.fillRect(cx-w/2+3,top,w-6,6);
  ctx.restore();
}
function bench(){
  const top=FY_(HOB_Z)+0.024*S;
  ctx.fillStyle='#c7b299';ctx.fillRect(0,top,PB.x-12,SH-top);
  ctx.fillStyle='rgba(0,0,0,.10)';ctx.fillRect(0,top,PB.x-12,4);
}

/* the biceps: a spindle from shoulder to forearm, bulging forwards */
function biceps(G,active){
  const O=G.O,I=G.I,n=G.n,w=G.w;
  const mid=mix(O,I,0.5);
  const a=mix(O,I,0.14),b=mix(O,I,0.86);
  ctx.save();
  line([O,a],'#eee4d6',4);line([b,I],'#eee4d6',4);           /* tendons */
  ctx.beginPath();
  ctx.moveTo(a[0],a[1]);
  ctx.quadraticCurveTo(mid[0]+n[0]*w*1.15,mid[1]+n[1]*w*1.15,b[0],b[1]);
  ctx.quadraticCurveTo(mid[0]-n[0]*w*0.2,mid[1]-n[1]*w*0.2,a[0],a[1]);
  ctx.closePath();
  const g=ctx.createLinearGradient(mid[0]-n[0]*w*0.2,mid[1]-n[1]*w*0.2,mid[0]+n[0]*w,mid[1]+n[1]*w);
  g.addColorStop(0,'#8f2c27');g.addColorStop(0.55,COL.muscle);g.addColorStop(1,'#e07a6e');
  ctx.globalAlpha=0.92;ctx.fillStyle=g;ctx.fill();
  ctx.globalAlpha=1;ctx.lineWidth=1.8;ctx.strokeStyle='#7d241f';ctx.stroke();
  /* fibres, running the length of it */
  ctx.lineWidth=1;ctx.strokeStyle='rgba(255,220,210,.45)';
  for(let k=1;k<4;k++){
    const f=k/4;
    ctx.beginPath();ctx.moveTo(a[0],a[1]);
    ctx.quadraticCurveTo(mid[0]+n[0]*w*lerp(-0.2,1.15,f),mid[1]+n[1]*w*lerp(-0.2,1.15,f),b[0],b[1]);
    ctx.stroke();
  }
  ctx.restore();
  if(active>0)glow(mid[0]+n[0]*w*0.45,mid[1]+n[1]*w*0.45,w*1.1,active*0.5);
}

/* the spinal cord, drawn along the canal the bake traced */
const CORD_LINE=curve([P(B.stem)].concat(B.canal.map(P)));
function cord(){
  line(CORD_LINE.pts,COL.cordEdge,0.013*S,{alpha:0.95});
  line(CORD_LINE.pts,COL.cord,0.013*S-3,{alpha:0.95});
}

/* The whole figure, back to front. */
function drawFigure(t,run,st,ch){
  const th=st.th,G=st.G,p=st.p;
  layer('body','flesh',1);
  armLayer('flesh',1,th);
  layer('body','bone',0.95);
  layer('body','brain',0.9);
  layer('body','nerve',0.55);
  armLayer('bone',0.95,th);
  armLayer('nerve',0.55,th);
  cord();
  /* the brain lights up when the message gets there */
  if(ch.up&&p.up>0.6){
    const a=clamp((p.up-0.6)/0.4,0,1)*(1-0.6*ease((t-run.ph.feel.t1)/2));
    const c=P([(B.brain.y0+B.brain.y1)/2,(B.brain.z0+B.brain.z1)/2+0.02]);
    ctx.save();ctx.globalAlpha=clamp(a,0,1)*0.55;
    const g=ctx.createRadialGradient(c[0],c[1],4,c[0],c[1],0.11*S);
    g.addColorStop(0,'rgba(190,120,255,.9)');g.addColorStop(1,'rgba(190,120,255,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(c[0],c[1],0.11*S,0,TAU);ctx.fill();
    ctx.restore();
  }
  biceps(G,p.contract>0&&p.contract<1?1-Math.abs(p.contract*2-1):0);

  /* the neurones, then the impulses on them */
  if(ch.up)line(G.up.pts,COL.up,3,{halo:3,alpha:0.95});
  line(G.sens.pts,COL.sens,3.4,{halo:3});
  line(G.motor.pts,COL.motor,3.4,{halo:3});
  line(G.relay.pts,COL.relay,4,{halo:2});
  /* the swelling where the sensory neurone's cell body sits */
  const drg=P(add(CORD,[0.016,-0.003]));
  dot(drg[0],drg[1],4.5,COL.sens);

  if(p.heat>0.72&&p.sensory<0.2){
    const a=p.heat<1?(p.heat-0.72)/0.28:1-p.sensory/0.2;
    glow(G.tipIn[0],G.tipIn[1],16,a);
  }
  impulse(G.sens,p.sensory,11);
  if(p.syn1>0&&p.syn1<1){const q=G.relay.pts[0];glow(q[0],q[1],9+4*Math.sin(t*14),0.9);}
  impulse(G.relay,p.relay,9,{trail:false});
  if(p.syn2>0&&p.syn2<1){const q=G.relay.pts[2];glow(q[0],q[1],9+4*Math.sin(t*14),0.9);}
  impulse(G.motor,p.motor,11);
  if(ch.up)impulse(G.up,p.up,10);

  hob(t,st);
  bench();
  /* a warm glow where skin meets metal, while they are touching */
  if(p.contract<=0){
    const q=[FX_(B.skinTip[0]),FY_(HOB_Z)];
    glow(q[0],q[1]-2,10+3*Math.sin(t*5),0.5);
  }
}

/* --- the fingertip: stimulus and receptor --- */
function fingerPath(cx,top,bot,r){
  ctx.beginPath();ctx.moveTo(cx-r,top);ctx.lineTo(cx-r,bot-r);
  ctx.arc(cx,bot-r,r,Math.PI,0,true);ctx.lineTo(cx+r,top);ctx.closePath();

function panelFinger(t,run,st){
  panelBox('Zoomed in: the fingertip on the hot plate');
  const bx=PB.x,by=PB.y,W=PB.w,H=PB.h,p=st.p;
  const lift=ease(p.contract)*170;
  const cx=bx+300,fw=150,top=by+44;
  const plateTop=by+H-132,plateH=74;
  const padY=plateTop-lift;
  ctx.save();
  rr(bx+3,by+40,W-6,H-43,13);ctx.clip();
  /* the hot plate */
  rr(bx+40,plateTop,540,plateH,8);ctx.fillStyle='#3a3f47';ctx.fill();
  const g=ctx.createLinearGradient(0,plateTop,0,plateTop+22);
  g.addColorStop(0,'#ff7a2a');g.addColorStop(1,'rgba(255,122,42,0)');
  ctx.fillStyle=g;ctx.fillRect(bx+44,plateTop,532,22);
  /* the finger, in two layers of skin, with the end of the bone inside */
  fingerPath(cx,top-10,padY,fw);ctx.fillStyle='#f2cdb9';ctx.fill();
  ctx.lineWidth=2.5;ctx.strokeStyle='#c99a85';ctx.stroke();
  fingerPath(cx,top-10,padY-20,fw-20);ctx.fillStyle='#eeb3a5';ctx.fill();
  fingerPath(cx-14,top-10,padY-150,56);ctx.fillStyle='#f3ecdc';ctx.fill();
  ctx.lineWidth=2;ctx.strokeStyle='#cdbf9f';ctx.stroke();
  txt('skin',cx-fw+14,padY-60,{font:'700 14px Nunito, sans-serif',col:'#9b6553'});
  txt('bone',cx-14,padY-210,{font:'700 14px Nunito, sans-serif',col:'#9c8c6a',align:'center'});

  /* heat crossing into the skin, as thermal energy blocks, for as long as
     the finger is on the plate */
  const touching=1-ease(p.contract*3);
  if(touching>0.02){
    [-70,-10,50].forEach((dx,i)=>
      stream([[cx+dx,plateTop+52],[cx+dx+8,padY-40]],t,{speed:44,spacing:40,size:19,phase:i*13,alpha:touching}));
  }
  /* the receptor: bare nerve endings fanning out under the surface */
  const fork=[cx+40,padY-118];
  const fibreTop=[cx+84,top-10];
  const ends=[];
  for(let i=0;i<7;i++){
    const a=lerp(0.28,0.72,i/6)*Math.PI;
    ends.push([cx+(fw-34)*Math.cos(a),padY-fw+(fw-34)*Math.sin(a)]);
  }
  const warm=clamp(p.heat,0,1);
  ends.forEach((e,i)=>{
    const c=[lerp(fork[0],e[0],0.5)+(i-3)*4,lerp(fork[1],e[1],0.3)];
    ctx.save();ctx.lineCap='round';ctx.strokeStyle=COL.sens;ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(fork[0],fork[1]);ctx.quadraticCurveTo(c[0],c[1],e[0],e[1]);ctx.stroke();
    ctx.restore();
    dot(e[0],e[1],4.5,warm>0.7?'#ff7ab8':COL.sens);
  });
  const fp=curve([fork,[cx+70,padY-200],[cx+84,padY-300],fibreTop]);
  fibre(fp,COL.sens,6);
  /* the receptor fires */
  if(p.heat>0.72&&p.sensory<0.25){
    const a=p.heat<1?(p.heat-0.72)/0.28:1-p.sensory/0.25;
    ends.forEach(e=>glow(e[0],e[1],14,a));
  }
  impulse(fp,clamp(p.sensory/0.3,0,1),15);
  ctx.restore();

  /* the words */
  const lx=bx+626;
  pill('STIMULUS',lx,plateTop+18,{bd:'#e5531a',bg:'#fff3e8',col:'#a8500b',font:'800 18px Nunito, sans-serif',h:34});
  txt('heat from the hot plate',lx,plateTop+56,{font:'700 17px Nunito, sans-serif',col:'#3d6480'});
  const ry=by+H*0.46;
  pill('RECEPTOR',lx,ry,{bd:COL.sens,col:COL.sens,font:'800 18px Nunito, sans-serif',h:34});
  txt('nerve endings in the skin',lx,ry+38,{font:'700 17px Nunito, sans-serif',col:'#3d6480'});
  txt('detect the heat',lx,ry+60,{font:'700 17px Nunito, sans-serif',col:'#3d6480'});
  leader(lx-6,ry,ends[0][0]+6,ends[0][1]-4,COL.sens);
  const fired=clamp((p.heat-0.95)/0.05,0,1);
  if(fired>0){
    pill('IMPULSE',lx,by+112,{bd:IMP,col:'#b0186a',bg:'#fff4fa',font:'800 18px Nunito, sans-serif',h:34,alpha:fired});
    ctx.save();ctx.globalAlpha=fired;
    txt('they start an electrical impulse',lx,by+150,{font:'700 17px Nunito, sans-serif',col:'#3d6480'});
    txt('in the sensory neurone',lx,by+172,{font:'700 17px Nunito, sans-serif',col:'#3d6480'});
    txt('↑ to the spinal cord',fibreTop[0]+16,top+36,{font:'800 16px Nunito, sans-serif',col:COL.sens,halo:4});
    ctx.restore();
  }
  if(p.contract>0.6)
    pill('the hand has been pulled away',bx+300,by+H-26,{align:'center',bd:'#ef8a22',font:'800 16px Nunito, sans-serif',alpha:(p.contract-0.6)/0.4});
}

/* --- a slice of the spinal cord, and a synapse --- */
function butterfly(cx,cy,s){
  /* the grey matter: two narrow horns behind, two broader ones in front */
  ctx.beginPath();
  ctx.moveTo(cx,cy-s*0.28);
  ctx.bezierCurveTo(cx+s*0.25,cy-s*0.35,cx+s*0.42,cy-s*0.9,cx+s*0.58,cy-s*0.88);
  ctx.bezierCurveTo(cx+s*0.66,cy-s*0.8,cx+s*0.4,cy-s*0.38,cx+s*0.42,cy-s*0.12);
  ctx.bezierCurveTo(cx+s*0.6,cy+s*0.05,cx+s*0.82,cy+s*0.42,cx+s*0.62,cy+s*0.62);
  ctx.bezierCurveTo(cx+s*0.42,cy+s*0.78,cx+s*0.22,cy+s*0.42,cx,cy+s*0.36);
  ctx.bezierCurveTo(cx-s*0.22,cy+s*0.42,cx-s*0.42,cy+s*0.78,cx-s*0.62,cy+s*0.62);
  ctx.bezierCurveTo(cx-s*0.82,cy+s*0.42,cx-s*0.6,cy+s*0.05,cx-s*0.42,cy-s*0.12);
  ctx.bezierCurveTo(cx-s*0.4,cy-s*0.38,cx-s*0.66,cy-s*0.8,cx-s*0.58,cy-s*0.88);
  ctx.bezierCurveTo(cx-s*0.42,cy-s*0.9,cx-s*0.25,cy-s*0.35,cx,cy-s*0.28);
  ctx.closePath();
}
function panelCord(t,run,st){

  /* the three neurones */
  const S1=[cx+52,cy-54],S2=[cx+60,cy+50],M=[cx+86,cy+74];
  const sens=curve([[ex,jy-8],[jx,jy-8],[bx+516,cy-70],[gang[0]+4,gang[1]+10],[bx+400,cy-120],[cx+104,cy-94],[cx+70,cy-70],S1]);
  const relay=curve([S1,[cx+18,cy-22],[cx+22,cy+22],S2]);
  const motor=curve([M,[cx+150,cy+86],[bx+420,cy+90],[bx+512,cy+62],[jx,jy+8],[ex,jy+8]]);
  fibre(sens,COL.sens,4.5,{halo:2});
  line([[gang[0],gang[1]+6],[gang[0],gang[1]-8]],COL.sens,3.5);
  soma(gang[0],gang[1]-14,10,COL.sens);
  fibre(relay,COL.relay,5,{halo:2});
  for(let i=0;i<5;i++){
    const a=0.6+i*0.75;
    line([M,[M[0]+Math.cos(a)*30,M[1]+Math.sin(a)*30]],COL.motor,3);
  }
  fibre(motor,COL.motor,4.5,{halo:2});
  soma(M[0],M[1],13,COL.motor);
  [S1,S2].forEach((s,i)=>{
    const on=i===0?(p.syn1>0&&p.syn1<1):(p.syn2>0&&p.syn2<1);
    ctx.save();ctx.setLineDash([4,3]);ctx.lineWidth=2.4;ctx.strokeStyle=on?IMP:'#8aa7bb';
    ctx.beginPath();ctx.arc(s[0],s[1],15,0,TAU);ctx.stroke();ctx.restore();
    if(on)glow(s[0],s[1],16+5*Math.sin(t*12),0.85);
  });
  /* labels */
  txt('sensory neurone',bx+400,cy-160,{font:'800 15px Nunito, sans-serif',col:COL.sens,align:'center',halo:4});
  txt('cell body',gang[0]+40,gang[1]-28,{font:'700 13px Nunito, sans-serif',col:COL.sens,halo:4});
  txt('relay neurone',cx-26,cy-14,{font:'800 15px Nunito, sans-serif',col:COL.relay,align:'right',halo:4});
  txt('motor neurone',bx+420,cy+130,{font:'800 15px Nunito, sans-serif',col:COL.motor,align:'center',halo:4});
  txt('synapse',S1[0]+22,S1[1]-14,{font:'700 13.5px Nunito, sans-serif',col:'#5d7f93',halo:4});
  txt('synapse',S2[0]+20,S2[1]+4,{font:'700 13.5px Nunito, sans-serif',col:'#5d7f93',halo:4});
  txt('← from the fingertip',ex-4,jy-26,{font:'800 14px Nunito, sans-serif',col:COL.sens,align:'right',halo:4});
  txt('to the biceps →',ex-4,jy+40,{font:'800 14px Nunito, sans-serif',col:COL.motor,align:'right',halo:4});
  /* the impulses: the last stretch of the sensory one, the relay, the
     first stretch of the motor one */
  impulse(sens,clamp((p.sensory-0.55)/0.45,0,1),13);
  impulse(relay,p.relay,13);
  impulse(motor,clamp(p.motor/0.5,0,1),13);
  synapseInset(t,st,{x:bx+660,y:by+52,w:W-676,h:H-68});
}
function synapseInset(t,st,box){
  const p=st.p;
  const second=p.syn2>0||p.relay>=1;
  const u=second?p.syn2:p.syn1;
  const pre=second?COL.relay:COL.sens,post=second?COL.motor:COL.relay;
  const {x,y,w,h}=box;
  rr(x,y,w,h,14);ctx.fillStyle='#f4f9fc';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#bcd6e4';ctx.stroke();
  txt('Zoomed in again: a synapse',x+w/2,y+26,{font:'800 16px Nunito, sans-serif',col:'#0a5f8f',align:'center'});
  txt(second?'relay → motor':'sensory → relay',x+w/2,y+48,{font:'800 15px Nunito, sans-serif',col:'#5d7f93',align:'center'});
  const cx=x+w/2,gapTop=y+h*0.44,gap=34,gapBot=gapTop+gap;
  /* the end of the first neurone: a swollen knob full of vesicles */
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cx-14,y+62);ctx.lineTo(cx-14,gapTop-130);
  ctx.bezierCurveTo(cx-120,gapTop-110,cx-130,gapTop,cx-110,gapTop);
  ctx.lineTo(cx+110,gapTop);
  ctx.bezierCurveTo(cx+130,gapTop,cx+120,gapTop-110,cx+14,gapTop-130);
  ctx.lineTo(cx+14,y+62);ctx.closePath();
  ctx.fillStyle=pre;ctx.globalAlpha=0.2;ctx.fill();
  ctx.globalAlpha=1;ctx.lineWidth=3;ctx.strokeStyle=pre;ctx.stroke();
  /* the start of the next one */
  ctx.beginPath();
  ctx.moveTo(cx-120,gapBot);ctx.lineTo(cx+120,gapBot);
  ctx.bezierCurveTo(cx+130,gapBot+90,cx+30,gapBot+100,cx+16,gapBot+130);
  ctx.lineTo(cx+16,y+h-96);ctx.lineTo(cx-16,y+h-96);ctx.lineTo(cx-16,gapBot+130);
  ctx.bezierCurveTo(cx-30,gapBot+100,cx-130,gapBot+90,cx-120,gapBot);
  ctx.closePath();
  ctx.fillStyle=post;ctx.globalAlpha=0.2;ctx.fill();
  ctx.globalAlpha=1;ctx.strokeStyle=post;ctx.stroke();
  ctx.restore();
  /* receptor sites on the far side of the gap */
  const sites=[];
  for(let i=0;i<6;i++)sites.push([cx-90+i*36,gapBot]);
  /* vesicles: they move to the edge and empty when the impulse arrives */
  for(let i=0;i<7;i++){
    const hx=cx-78+i*26+(hash(i)-0.5)*10,hy=gapTop-30-hash(i+20)*60;
    const go=ease((u-0.16-i*0.02)/0.2);
    const vy=lerp(hy,gapTop-10,go),a=1-ease((u-0.36-i*0.02)/0.1);
    if(a>0.02){
      ctx.save();ctx.globalAlpha=a;
      ctx.beginPath();ctx.arc(hx,vy,10,0,TAU);ctx.fillStyle='#ffffff';ctx.fill();
      ctx.lineWidth=2;ctx.strokeStyle=pre;ctx.stroke();
      for(let k=0;k<3;k++)dot(hx-4+k*4,vy+(k%2?3:-2),2.2,'#e0a020');
      ctx.restore();
    }
  }
  /* the chemical: released, wandering across the gap, landing on a site */
  for(let i=0;i<24;i++){
    const r0=0.3+hash(i+40)*0.12,r1=r0+0.28+hash(i+60)*0.16;
    if(u<r0)continue;
    const s=[cx-78+(i%7)*26,gapTop-6];
    const tg=sites[i%sites.length];
    const e=ease((u-r0)/(r1-r0));
    const jig=(1-e)*9;
    const px=lerp(s[0],tg[0]+(hash(i+80)-0.5)*14,e)+Math.sin(u*55+i*1.7)*jig;
    const py=lerp(s[1],tg[1]-4,e)+Math.cos(u*47+i*2.3)*jig*0.5;
    dot(px,py,3.2,'#e0a020');
  }
  const bound=clamp((u-0.62)/0.15,0,1);
  sites.forEach(sv=>{
    ctx.fillStyle=bound>0?'rgba(255,61,154,'+(0.3+0.6*bound).toFixed(2)+')':shade(post,0.8);
    ctx.fillRect(sv[0]-7,sv[1],14,6);
  });
  /* the impulse arriving above, and the new one leaving below */
  impulse(polyline([[cx,y+62],[cx,gapTop-20]]),clamp(u/0.18,0,1),16,{trail:false});
  impulse(polyline([[cx,gapBot+12],[cx,y+h-100]]),clamp((u-0.8)/0.2,0,1),16,{trail:false});
  txt('gap',cx+128,gapTop+gap/2+5,{font:'700 13.5px Nunito, sans-serif',col:'#5d7f93'});
  /* the steps, lit in turn */
  const steps=['1  the impulse arrives','2  a chemical is released','3  it diffuses across the gap','4  it starts a new impulse'];
  const k=u<=0?-1:u<0.18?0:u<0.4?1:u<0.78?2:3;
  steps.forEach((s,i)=>txt(s,x+18,y+h-74+i*21,{font:(i===k?'800':'700')+' 15px Nunito, sans-serif',col:i===k?'#b0186a':(i<k?'#3d6480':'#a9c0cf')}));
}

/* --- one motor neurone, and the muscle it works --- */
function panelMotor(t,run,st){
  panelBox('One motor neurone, and the muscle it works (not to scale)');
  const bx=PB.x,by=PB.y,W=PB.w,H=PB.h,p=st.p,my=by+H*0.44;
  rr(bx+22,by+56,196,H-150,18);ctx.fillStyle='#fbe4e7';ctx.fill();
  ctx.lineWidth=2.5;ctx.strokeStyle='#d99aa6';ctx.stroke();
  txt('spinal cord',bx+120,by+84,{font:'800 16px Nunito, sans-serif',col:'#a24a5b',align:'center'});
  const so=[bx+128,my];
  for(let i=0;i<6;i++){
    const a=1.2+i*0.75+hash(i)*0.3,l=48+hash(i+9)*24;
    line([so,[so[0]+Math.cos(a)*l,so[1]+Math.sin(a)*l]],COL.motor,3.5);
  }
  /* the relay neurone's ending, touching one of them */
  const rEnd=[so[0]-52,my-62];
  line([[bx+40,by+110],rEnd],COL.relay,4.5);dot(rEnd[0],rEnd[1],7,COL.relay);
  txt('from the relay neurone',bx+120,by+130,{font:'700 13.5px Nunito, sans-serif',col:COL.relay,align:'center',halo:4});
  /* the muscle: it shortens and fattens, keeping its volume, by exactly
     the ratio the biceps on the figure does */
  const L0=230,ratio=st.G.L/REST_L;
  const Lm=L0*ratio,hm=118/Math.sqrt(ratio);
  const mc=[bx+W-180,my],A=[mc[0]-L0/2-38,my],Bm=[mc[0]+L0/2+38,my];
  const ml=mc[0]-Lm/2,mr=mc[0]+Lm/2;
  line([A,[ml,my]],'#e8dccb',7);line([[mr,my],Bm],'#e8dccb',7);
  rr(A[0]-14,my-34,14,68,4);ctx.fillStyle='#efe6d2';ctx.fill();
  rr(Bm[0],my-34,14,68,4);ctx.fill();
  ctx.beginPath();ctx.ellipse(mc[0],my,Lm/2,hm/2,0,0,TAU);
  const g=ctx.createLinearGradient(0,my-hm/2,0,my+hm/2);
  g.addColorStop(0,'#e07a6e');g.addColorStop(0.5,COL.muscle);g.addColorStop(1,'#8f2c27');
  ctx.fillStyle=g;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#7d241f';ctx.stroke();
  ctx.save();ctx.beginPath();ctx.ellipse(mc[0],my,Lm/2,hm/2,0,0,TAU);ctx.clip();
  ctx.strokeStyle='rgba(255,220,210,.35)';ctx.lineWidth=1.4;
  for(let k=-4;k<=4;k++){ctx.beginPath();ctx.moveTo(ml,my+k*hm/10);ctx.lineTo(mr,my+k*hm/10);ctx.stroke();}
  ctx.restore();
  /* the axon, broken because it is far longer than it is drawn, and its
     endings spread over the muscle */
  const ax0=[so[0]+30,my],ax1=[mc[0]-90,my-hm/2-46];
  const axp=curve([ax0,[bx+430,my],[bx+600,my-6],ax1]);
  fibre(axp,COL.motor,6,{myelin:true,from:120,to:axp.L-40});
  breakMark(bx+430,my,22);
  const ends=[-0.55,-0.1,0.35].map(f=>[mc[0]+f*Lm/2,my-hm/2*Math.sqrt(1-f*f)+3]);
  ends.forEach(e=>{line([ax1,e],COL.motor,3.5);dot(e[0],e[1],6,COL.motor);});
  soma(so[0],so[1],30,COL.motor);
  const imp=polyline(axp.pts.concat([ends[1]]));
  impulse(imp,p.motor,15,{trail:260});
  const act=p.contract>0&&p.contract<1?1-Math.abs(p.contract*2-1):0;
  if(act>0)ends.forEach(e=>glow(e[0],e[1],18,act));
  /* the words */
  txt('cell body',so[0],my+60,{font:'800 15px Nunito, sans-serif',col:COL.motor,align:'center',halo:4});
  txt('axon',bx+330,my-24,{font:'800 16px Nunito, sans-serif',col:COL.motor,align:'center'});
  const ms=alongPoly(axp,250);
  txt('myelin sheath',ms[0]+60,my+54,{font:'800 15px Nunito, sans-serif',col:'#8a6a3a',align:'center'});
  leader(ms[0]+60,my+38,ms[0],my+10,'#8a6a3a');
  pill('about '+FACTS.motorM+' m long, measured on the model',bx+430,my+112,{align:'center',bd:'#ef8a22',font:'800 15px Nunito, sans-serif'});
  pill('EFFECTOR: the biceps muscle',mc[0],my-hm/2-96,{align:'center',bd:COL.muscle,col:'#9b2b22',font:'800 17px Nunito, sans-serif',h:32});
  if(p.contract>0){
    const a=clamp(p.contract*3,0,1);
    ctx.save();ctx.globalAlpha=a;
    txt('it CONTRACTS',mc[0],my+hm/2+34,{font:'800 19px Nunito, sans-serif',col:'#9b2b22',align:'center'});
    txt('→',ml-22,my+8,{font:'800 26px Nunito, sans-serif',col:'#9b2b22',align:'center',halo:4});
    txt('←',mr+22,my+8,{font:'800 26px Nunito, sans-serif',col:'#9b2b22',align:'center',halo:4});
    ctx.restore();
  }
  pill('MOTOR NEURONE: carries the impulse from the spinal cord to the effector',bx+W/2,by+H-70,
    {align:'center',bd:COL.motor,col:'#9b2b22',font:'800 17px Nunito, sans-serif',h:34});
  if(p.contract>0.7)
    pill('RESPONSE: the forearm is pulled up, and the hand comes off the hot plate',bx+W/2,by+H-28,
      {align:'center',bd:'#ef8a22',bg:'#fff3e8',col:'#a8500b',font:'800 17px Nunito, sans-serif',h:34,alpha:(p.contract-0.7)/0.3});
}

/* --- the race: the reflex against the message to the brain --- */
const LANES=[
  {title:'The reflex arc',col:'#ef8a22',ink:'#c25a10',
   chips:[['receptor','heat',COL.sens],['sensory neurone','sensory',COL.sens],['relay neurone','relay',COL.relay],['motor neurone','motor',COL.motor],['biceps contracts','contract',COL.muscle]],
   end:'the hand is pulled away',last:'contract'},
  {title:'The message to the brain',col:COL.up,ink:'#6a3fb0',
   chips:[['receptor','heat',COL.sens],['sensory neurone','sensory',COL.sens],['up the spinal cord','up',COL.up],['the brain makes sense of it','feel',COL.up]],
   end:'you feel the pain',last:'feel'}
];
/* which finishes first comes out of the run, not out of the caption */
function finishOrder(run){
  return LANES.map((L,i)=>({i,t:run.ph[L.last].t1})).sort((a,b)=>a.t-b.t).map(o=>o.i);
}
function panelRace(t,run,st){
  panelBox('Two messages set off from the spinal cord at the same moment');
  const bx=PB.x,by=PB.y,ph=run.ph;
  const order=finishOrder(run);
  LANES.forEach((L,li)=>{
    const y=by+150+li*190;
    txt(L.title,bx+30,y-44,{font:'600 22px Fredoka, sans-serif',col:L.ink});
    let x=bx+30;
    L.chips.forEach((c,i)=>{
      const pr=prog(run,c[1],t);
      ctx.font='800 15px Nunito, sans-serif';
      const w=ctx.measureText(c[0]).width+24;
      if(i){
        const cc=pr>0?'#5d7f93':'#c6dce8';
        line([[x-26,y],[x-10,y]],cc,3);
        ctx.fillStyle=cc;
        ctx.beginPath();ctx.moveTo(x-13,y-6);ctx.lineTo(x-5,y);ctx.lineTo(x-13,y+6);ctx.closePath();ctx.fill();
      }
      const on=pr>0&&pr<1,done=pr>=1;
      rr(x,y-19,w,38,19);
      ctx.fillStyle=done?'#ffffff':(on?'#fff4fa':'rgba(255,255,255,.55)');ctx.fill();
      ctx.lineWidth=on?3.5:2.5;ctx.strokeStyle=on?IMP:(done?c[2]:'#c6dce8');ctx.stroke();
      /* a bar along the bottom of the chip, filling as that part runs */
      if(pr>0){rr(x+10,y+11,(w-20)*pr,4,2);ctx.fillStyle=c[2];ctx.fill();}
      txt(c[0],x+w/2,y,{font:'800 15px Nunito, sans-serif',align:'center',base:'middle',col:pr>0?'#17324d':'#a9c0cf'});
      x+=w+34;
    });
    const fin=clamp((t-ph[L.last].t1)/0.3,0,1);
    if(fin>0)
      pill((order[0]===li?'FIRST':'SECOND')+': '+L.end,bx+30,y+58,{bd:L.col,font:'800 18px Nunito, sans-serif',h:36,alpha:fin});
  });
  const a=clamp((t-Math.max(ph.contract.t1,ph.feel.t1))/0.6,0,1);
  ctx.save();ctx.globalAlpha=0.35+0.65*a;
  txt('The reflex never goes through the conscious part of the brain. That is why it is',bx+30,by+492,{font:'700 18px Nunito, sans-serif',col:'#3d6480'});
  txt('automatic, and so fast that your hand is already moving before you feel the pain.',bx+30,by+518,{font:'700 18px Nunito, sans-serif',col:'#3d6480'});
  txt('It protects you: the sooner the hand comes off, the less it is burned.',bx+30,by+556,{font:'800 18px Nunito, sans-serif',col:'#0a5f8f'});
  ctx.restore();
}

 {kick:'The reflex arc',title:'Touch something hot',panel:'flow',panelTitle:'Touch something hot, and the hand jumps away',run:'fast',speedCtl:true,up:true,labels:['hob','brain','cord','biceps']},

 {kick:'Step 3',title:'Synapses and the relay neurone',panel:'cord',run:'cord',labels:['cord'],focus:'cord'},
 {kick:'Step 4',title:'Motor neurone and effector',panel:'motor',run:'motor',labels:['motor','biceps'],focus:'biceps'},

/* ===================================================================

   =================================================================== */
let cur=0,localT=0,slowmo=false;
const dots=$('#dots');
CH.forEach((c,i)=>{
  const b=document.createElement('button');
  b.setAttribute('aria-label','Go to '+c.title);b.onclick=()=>show(i);dots.appendChild(b);

function show(n){
  cur=clamp(n,0,CH.length-1);

  $('#kicker').textContent=c.kick;$('#title').textContent=c.title;
  [...dots.children].forEach((d,i)=>d.classList.toggle('on',i===cur));

     +'<button class="btn'+(slowmo?' on':' ghost')+'" id="tSlow">Slow motion</button>'
    :'';

    const set=v=>{slowmo=v;localT=0;
      fb.className='btn'+(v?' ghost':' on');sb.className='btn'+(v?' on':' ghost');};

/* ===================================================================
   LAYOUT AND LOOP
   The bar is measured rather than assumed, so changing its padding or
   letting it wrap cannot crop the stage.
   =================================================================== */
function furniture(sel,fallback){const e=$(sel);return (e&&e.offsetHeight)||fallback;}
function resize(){
  dpr=Math.min(devicePixelRatio||1,2);
  const w=innerWidth,h=innerHeight;
  canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
  canvas.style.width=w+'px';canvas.style.height=h+'px';
  const barH=Math.min(furniture('#bar',66),h*0.4)+18;
  const ax=10,ay=10,aw=w-20,ah=Math.max(140,h-20-barH);
  const s=Math.min(aw/SW,ah/SH);
  stage={s,x:ax+(aw-SW*s)/2,y:ay+(ah-SH*s)/2};
}
addEventListener('resize',resize);

function state(run,t){
  const p={};
  PHASES.concat(['up','feel']).forEach(k=>{p[k]=prog(run,k,t);});
  const th=elbow(run,t);
  return {p,th,G:figure(th),step:stepAt(run,t)};
}

function scene(t){
  const c=CH[cur],run=runOf(c);
  const st=state(run,t);
  const g=ctx.createLinearGradient(0,0,0,SH);
  g.addColorStop(0,'#eaf6fc');g.addColorStop(1,'#d3e7f2');
  ctx.fillStyle=g;ctx.fillRect(0,0,SW,SH);

  drawFigure(t,run,st,c);
  figLabels(st,c);
  if(c.up)ouch(t,run);
  if(c.focus==='tip')focusRing(rot(P(B.skinTip),st.th),34);
  if(c.focus==='cord')focusRing(P(CORD),26);
  if(c.focus==='biceps')focusRing(mix(st.G.O,st.G.I,0.5),0.07*S);
  if(c.focus==='brain')focusRing(P([(B.brain.y0+B.brain.y1)/2,(B.brain.z0+B.brain.z1)/2]),0.1*S);

  if(c.panel==='flow')panelFlow(t,run,st,c);
  else if(c.panel==='finger')panelFinger(t,run,st);
  else if(c.panel==='sensory')panelSensory(t,run,st);
  else if(c.panel==='cord')panelCord(t,run,st);
  else if(c.panel==='motor')panelMotor(t,run,st);
  else if(c.panel==='race')panelRace(t,run,st);

  /* where the picture comes from, and what is drawn in */
  txt('Skeleton, nerves and brain: “Neurology” by Z-Anatomy, CC BY-SA 4.0. Body outline, biceps, spinal cord and neurones drawn in; neurones far thicker than life.',
    PB.x+4,SH-20,{font:'700 12.5px Nunito, sans-serif',col:'#5d7f93'});
}

let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,0.05);last=now;
  localT+=reduceMotion?dt*0.35:dt;
  const run=runOf(CH[cur]);
  if(localT>run.end)localT=0;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const g=ctx.createLinearGradient(0,0,0,innerHeight);
  g.addColorStop(0,'#e3f1f9');g.addColorStop(1,'#cfe3ef');
  ctx.fillStyle=g;ctx.fillRect(0,0,innerWidth,innerHeight);
  ctx.save();
  ctx.translate(stage.x,stage.y);ctx.scale(stage.s,stage.s);
  ctx.beginPath();ctx.rect(-4,-4,SW+8,SH+8);ctx.clip();
  scene(localT);
  ctx.restore();
  requestAnimationFrame(frame);
}
resize();show(0);requestAnimationFrame(frame);
})();
</script>
