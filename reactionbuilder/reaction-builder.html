/* ===================== board model =====================
   The board has two sides. Everything left of the arrow channel is a
   reactant, everything right of it is a product. A group always lives
   on one side (g.side) and can never be moved across; the two middle
   columns are the arrow channel and are never occupied.
======================================================== */

let groups = [];
let selection = new Set();
let hoverGid = null;
let lastReaction = null;
let animating = false;
let justAdded = null; // Set of gids to pop in on the next render only

const chargeUnits = sp => Math.abs(sp.charge);
const speciesOf = p => registry[p.spId];

const widthCells = sp => (sp.kind === "electron") ? 1 : TILE_W;
const heightRows = sp => (sp.kind === "ion") ? (chargeUnits(sp) || 1) : 1;

const findGroup = gid => groups.find(g => g.gid === gid);
const allPieces = () => groups.flatMap(g => g.pieces.map(p => ({g, p})));

// [lo, hi) column range for a side
const rangeOf = side => side === "L" ? [0, MID_CELL - 1] : [MID_CELL + 1, COLS];
const sideOf = g => g.side;
const onSide = side => groups.filter(g => g.side === side);
// Left cols run 0..MID_CELL-1, right cols MID_CELL+1..COLS, so a reactant at
// the far right of its side (col MID_CELL-3, the last that fits a 2-wide tile)
// has to land on col COLS-2. That pins the shift at MID_CELL+1 exactly: one
// more and the last column mirrors off the board, where placeCopy gives up on
// the intended spot and scatters the group looking for room.
const mirrorShift = () => MID_CELL + 1;

const mkGroup = (pieces, bonds, side) => ({ gid: nextId("g"), pieces, bonds: bonds || [], side });
const single = (sp, col, row, side) => mkGroup([{ pid: nextId("p"), spId: sp.id, col, row }], [], side);

function cellsOf(p, col, row){
  const sp = speciesOf(p);
  const c0 = col === undefined ? p.col : col, r0 = row === undefined ? p.row : row;
  const out = [];
  for(let c = 0; c < widthCells(sp); c++)
    for(let r = 0; r < heightRows(sp); r++) out.push([c0 + c, r0 + r]);
  return out;
}

function occupancy(ignore = []){
  const m = new Set();
  groups.forEach(g => {
    if(ignore.includes(g.gid)) return;
    g.pieces.forEach(p => cellsOf(p).forEach(([c,r]) => m.add(c + "," + r)));
  });
  return m;
}

function groupBounds(g){
  let minC = Infinity, maxC = -Infinity, minR = Infinity, maxR = -Infinity;
  g.pieces.forEach(p => {
    const sp = speciesOf(p);
    minC = Math.min(minC, p.col); maxC = Math.max(maxC, p.col + widthCells(sp) - 1);
    minR = Math.min(minR, p.row); maxR = Math.max(maxR, p.row + heightRows(sp) - 1);
  });
  return {minC, maxC, minR, maxR};
}

function groupCenter(g){
  const b = groupBounds(g);
  return { x: PAD + (b.minC + b.maxC + 1) / 2 * CELL_W, y: PAD + (b.minR + b.maxR + 1) / 2 * UNIT };
}

// Does g fit, shifted by (dc, dr), entirely within its side?
function groupFits(g, dc, dr, ignore, side){
  const [lo, hi] = rangeOf(side || g.side);
  const occ = occupancy(ignore || [g.gid]);
  for(const p of g.pieces){
    const sp = speciesOf(p);
    const c0 = p.col + dc, r0 = p.row + dr;
    if(c0 < lo || c0 + widthCells(sp) > hi) return false;
    if(r0 < 0 || r0 + heightRows(sp) > ROWS) return false;
    for(const [c,r] of cellsOf(p, c0, r0)) if(occ.has(c + "," + r)) return false;
  }
  return true;
}

const translateGroup = (g, dc, dr) => g.pieces.forEach(p => { p.col += dc; p.row += dr; });

// Nearest free cell for a single species on a given side.
function findFreeSlot(sp, nearCol, nearRow, side, avoid){
  const w = widthCells(sp), h = heightRows(sp);
  const [lo, hi] = rangeOf(side);
  const occ = occupancy();
  (avoid || []).forEach(k => occ.add(k));
  const free = (c, r) => {
    if(c < lo || c + w > hi || r < 0 || r + h > ROWS) return false;
    for(let i = 0; i < w; i++) for(let j = 0; j < h; j++) if(occ.has((c+i)+","+(r+j))) return false;
    return true;
  };
  if(nearCol !== undefined){
    for(let d = 0; d <= COLS + ROWS; d++)
      for(let dc = -d; dc <= d; dc++)
        for(let dr = -d; dr <= d; dr++){
          if(Math.max(Math.abs(dc), Math.abs(dr)) !== d) continue;
          if(free(nearCol + dc, nearRow + dr)) return {col: nearCol + dc, row: nearRow + dr};
        }
  }
  for(let c = lo; c <= hi - w; c++) for(let r = 0; r <= ROWS - h; r++) if(free(c,r)) return {col:c, row:r};
  return null;
}

// Copy a whole group onto a side, ideally shifted by (dc0, dr0), else the
// nearest spot that fits. Returns the new group or null.
function placeCopy(g, side, dc0, dr0){
  const probe = (dc, dr) => ({ gid:"__probe", side,
    pieces: g.pieces.map(p => ({ pid:"__"+p.pid, spId:p.spId, col:p.col+dc, row:p.row+dr })) });
  let placed = null;
  if(groupFits(probe(dc0, dr0), 0, 0, ["__probe"], side)) placed = [dc0, dr0];
  else {
    outer:
    for(let d = 1; d <= COLS + ROWS; d++)
      for(let dc = -d; dc <= d; dc++)
        for(let dr = -d; dr <= d; dr++){
          if(Math.max(Math.abs(dc), Math.abs(dr)) !== d) continue;
          if(groupFits(probe(dc0 + dc, dr0 + dr), 0, 0, ["__probe"], side)){ placed = [dc0 + dc, dr0 + dr]; break outer; }
        }
  }
  if(!placed) return null;
  const pidMap = {};
  const pieces = g.pieces.map(p => {
    const np = { pid: nextId("p"), spId: p.spId, col: p.col + placed[0], row: p.row + placed[1] };
    pidMap[p.pid] = np.pid;
    return np;
  });
  const bonds = (g.bonds || []).map(bd => [pidMap[bd[0]], pidMap[bd[1]], bd[2] || 1])
                               .filter(bd => bd[0] && bd[1]);
  const ng = mkGroup(pieces, bonds, side);
  groups.push(ng);
  return ng;
}

/* --- mirroring: reactants -> products --- */

const mirrorGroup = g => placeCopy(g, "R", mirrorShift(), 0);

// A group's content, ignoring position, so we can tell whether the
// products side is still an untouched copy of the reactants.
const sig = g => g.pieces.map(p => p.spId).sort().join(",") + "#" +
                 (g.bonds || []).map(bd => bd[2] || 1).sort().join("");
const sideSigs = side => onSide(side).map(sig).sort().join("|");
const productsUntouched = () => sideSigs("L") === sideSigs("R");

function resetProducts(){
  groups = onSide("L");
  selection = new Set([...selection].filter(gid => findGroup(gid)));
  onSide("L").forEach(mirrorGroup);
  hoverGid = null;
  resolveBonds(); render();
}

/* ===================== covalent bonds =====================
   g.bonds is a list of [pidA, pidB, order]. Order counts toward each
   atom's valency, so an H (valency 1) can hold exactly one single bond
   and an O (valency 2) can hold one double or two singles.
========================================================== */

const bondKey = (a, b) => [a, b].sort().join("|");
const hasBond = (g, a, b) => (g.bonds || []).some(bd => bondKey(bd[0], bd[1]) === bondKey(a, b));

// Total bond order already used by this atom.
function usedValency(g, pid){
  return (g.bonds || []).reduce((s, bd) =>
    s + ((bd[0] === pid || bd[1] === pid) ? (bd[2] || 1) : 0), 0);
}

function freeValency(g, p){
  const sp = speciesOf(p);
  if(sp.kind !== "atom") return 0;
  const max = VALENCY[sp.sym] || 0;
  return max - usedValency(g, p.pid);
}

function adjacentH(pa, pb){
  if(pa.row !== pb.row) return false;
  const wa = widthCells(speciesOf(pa)), wb = widthCells(speciesOf(pb));
  return pb.col === pa.col + wa || pa.col === pb.col + wb;
}

/* Auto-pairing: ONLY identical atoms of a diatomic element, at the element's
   proper bond order (H–H single, O=O double, N≡N triple). */
function pairDiatomics(){
  let changed = true;
  while(changed){
    changed = false;
    outer:
    for(const g1 of groups){
      for(const p1 of g1.pieces){
        const s1 = speciesOf(p1);
        if(s1.kind !== "atom" || !DIATOMIC[s1.sym]) continue;
        const order = DIATOMIC[s1.sym];
        if(freeValency(g1, p1) < order) continue;

        for(const g2 of groups){
          for(const p2 of g2.pieces){
            if(p2.pid === p1.pid) continue;
            const s2 = speciesOf(p2);
            if(s2.id !== s1.id) continue;
            if(!adjacentH(p1, p2)) continue;
            if(g1.gid === g2.gid && hasBond(g1, p1.pid, p2.pid)) continue;
            if(freeValency(g2, p2) < order) continue;

            if(g1.gid === g2.gid){
              g1.bonds = g1.bonds || [];
              g1.bonds.push([p1.pid, p2.pid, order]);
            } else {
              g1.bonds = (g1.bonds || []).concat(g2.bonds || []);
              g1.pieces.push(...g2.pieces);
              g1.bonds.push([p1.pid, p2.pid, order]);
              groups = groups.filter(x => x.gid !== g2.gid);
              if(selection.has(g2.gid)){ selection.delete(g2.gid); selection.add(g1.gid); }
            }
            lastReaction = { type:"Bonding", text:`2${s1.formula} → ${s1.formula}${subDigits(2)}` };
            changed = true;
            break outer;
          }
        }
      }
    }
  }
}

/* Read a linear chain group back as a formula, e.g. O=C=O -> CO2 */
function chainFormula(g){
  if(g.pieces.length < 2 || !(g.bonds || []).length) return null;
  if(!g.pieces.every(p => speciesOf(p).kind === "atom")) return null;
  if(g.bonds.length !== g.pieces.length - 1) return null;

  const counts = {};
  g.pieces.forEach(p => { const s = speciesOf(p).sym; counts[s] = (counts[s] || 0) + 1; });
  const syms = Object.keys(counts);

  // Single element (H2, O2, N2...) is just the symbol plus a count.
  if(syms.length === 1)
    return syms[0] + (counts[syms[0]] > 1 ? subDigits(counts[syms[0]]) : "");

  // Otherwise lead with the most-bonded atom (the central one: C in O=C=O,
  // S in O=S=O), which matches how these formulas are conventionally written.
  const bondLoad = {};
  g.pieces.forEach(p => {
    const s = speciesOf(p).sym;
    bondLoad[s] = Math.max(bondLoad[s] || 0, usedValency(g, p.pid));
  });
  const order = [...syms].sort((a, b) => {
    if(a === "C") return -1;              // carbon always first (Hill notation)
    if(b === "C") return 1;
    if(a === "H" && b !== "C") return -1; // then hydrogen
    if(b === "H" && a !== "C") return 1;
    const d = (bondLoad[b] || 0) - (bondLoad[a] || 0);
    return d !== 0 ? d : a.localeCompare(b);
  });
  return order.map(s => s + (counts[s] > 1 ? subDigits(counts[s]) : "")).join("");
}

// Is this group a molecule of identical atoms? (for the "2H -> H2" line)
function diatomicOf(g){
  if(g.pieces.length !== 2 || !(g.bonds || []).length) return null;
  const [a, b] = g.pieces;
  const sa = speciesOf(a), sb = speciesOf(b);
  if(sa.kind !== "atom" || sa.id !== sb.id || !DIATOMIC[sa.sym]) return null;
  if(!hasBond(g, a.pid, b.pid)) return null;
  return sa;
}

/* ===================== sockets =====================
   Two families, and they never mix: ionic tab/blank joins a cation to an
   anion, covalent ctab/cblank joins atoms that can share a bond. Keeping
   them apart is what stops a carbon block plugging into a sodium ion.

   Covalent tabs exist so CO₂ can be built by hand. Dragging atoms
   together only ever bonds identical ones (see pairDiatomics), so without
   these there is no route from carbon and oxygen to CO₂. Carbon is the
   block the rest plugs into, so it carries the tabs and oxygen carries
   the matching holes, on both edges — an oxygen can sit either side.

   Each edge is ONE socket, because a socket is matched by grid cell and a
   tile is one row tall. The two bumps drawn per edge are the double bond
   in O=C=O: they say "carbon holds four bonds, two a side" without making
   every O-containing molecule two rows tall and ragged.
==================================================== */

const BOND_TABS = { C: "ctab", O: "cblank" };
const SOCKET_MATE = { tab:"blank", blank:"tab", ctab:"cblank", cblank:"ctab" };

// The covalent tab an atom shows, or null. Ions never have one, so O²⁻
// keeps its ionic tab and the neutral O atom gets the covalent hole.
const bondTabOf = sp => (sp.kind === "atom" && BOND_TABS[sp.sym]) || null;

// `g` is the piece's own group; pass it so an atom that has already used
// up its valency (one inside a finished molecule) stops offering sockets.
function socketsOf(p, g){
  const sp = speciesOf(p);
  if(sp.kind === "ion" || sp.kind === "electron"){
    const out = [], n = chargeUnits(sp);
    for(let k = 0; k < n; k++){
      if(sp.charge > 0) out.push({ pid:p.pid, type:"blank", col: p.col + widthCells(sp), row: p.row + k });
      else              out.push({ pid:p.pid, type:"tab",   col: p.col, row: p.row + k });
    }
    return out;
  }
  const type = bondTabOf(sp);
  if(!type) return [];
  if(g && freeValency(g, p) <= 0) return [];
  return [{ pid:p.pid, type, col: p.col,                   row: p.row },
          { pid:p.pid, type, col: p.col + widthCells(sp),  row: p.row }];
}

function socketPartner(sock, ignore = []){
  for(const {g, p} of allPieces()){
    if(ignore.includes(g.gid) || p.pid === sock.pid) continue;
    for(const s of socketsOf(p, g)){
      if(s.type !== SOCKET_MATE[sock.type]) continue;
      if(s.col === sock.col && s.row === sock.row) return {piece:p, group:g, socket:s};
    }
  }
  return null;
}

function resolveBonds(){
  let merged = true;
  while(merged){
    merged = false;
    outer:
    for(const g of groups){
      for(const p of g.pieces){
        for(const s of socketsOf(p, g)){
          const hit = socketPartner(s);
          if(hit && hit.group.gid !== g.gid){
            g.bonds = (g.bonds || []).concat(hit.group.bonds || []);
            g.pieces.push(...hit.group.pieces);
            groups = groups.filter(x => x.gid !== hit.group.gid);
            if(selection.has(hit.group.gid)){ selection.delete(hit.group.gid); selection.add(g.gid); }
            merged = true;
            break outer;
          }
        }
      }
    }
  }
  pairDiatomics();
}

function isBondedToOther(g){
  for(const p of g.pieces)
    for(const s of socketsOf(p, g)){
      const hit = socketPartner(s);
      if(hit && hit.group.gid !== g.gid) return true;
    }
  return false;
}

function separateAll(gids){
  for(let pass = 0; pass < 14; pass++){
    let moved = false;
    for(const gid of gids){
      const g = findGroup(gid);
      if(!g || !isBondedToOther(g)) continue;
      for(const [dc,dr] of [[0,-2],[0,2],[2,0],[-2,0],[3,0],[-3,0],[0,-3],[0,3],[4,0],[-4,0]]){
        if(!groupFits(g, dc, dr)) continue;
        translateGroup(g, dc, dr);
        if(!isBondedToOther(g)){ moved = true; break; }
        translateGroup(g, -dc, -dr);
      }
    }
    if(!moved) break;
  }
}

/* ===================== dialogs ===================== */

function showDialog(title, msg, buttons){
  const d = document.getElementById("dlg");
  d.querySelector(".dlg-title").textContent = title;
  d.querySelector(".dlg-msg").innerHTML = msg;
  const act = d.querySelector(".dlg-actions");
  act.innerHTML = "";
  buttons.forEach(b => {
    const btn = document.createElement("button");
    btn.textContent = b.label;
    if(b.primary) btn.className = "primary";
    btn.addEventListener("click", () => { d.close(); if(b.action) b.action(); });
    act.appendChild(btn);
  });
  d.showModal();
}
const showError = (title, msg) => showDialog(title, msg, [{label:"OK", primary:true}]);

/* ===================== free electrons & animation ===================== */

// Loose electrons on a side, nearest to the target group first.
function freeElectronsNear(side, target){
  const b = groupBounds(target);
  const tc = (b.minC + b.maxC) / 2, tr = (b.minR + b.maxR) / 2;
  return onSide(side)
    .filter(x => x.pieces.length === 1 && speciesOf(x.pieces[0]).kind === "electron")
    .map(x => { const eb = groupBounds(x);
      return { g: x, d: Math.max(Math.abs(eb.minC - tc), Math.abs(eb.minR - tr)) }; })
    .sort((a, b2) => a.d - b2.d)
    .map(o => o.g);
}

// Returns the n nearest free electrons on the products side, or null
// after showing an error.
function needElectrons(target, n, what){
  const es = freeElectronsNear("R", target);
  if(es.length < n){
    showError("Not enough free electrons",
      `Making ${what} needs ${n} free electron${n > 1 ? "s" : ""} on the products side, and there ` +
      `${es.length === 1 ? "is" : "are"} ${es.length}. Take electrons off another species first: ` +
      `hover a metal atom and use “Turn into its ion”.`);
    return null;
  }
  return es.slice(0, n);
}

// Fly the electron groups into the target, then run commit().
function flyElectrons(eGroups, target, commit){
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const targetEl = grpEl(target.gid);
  if(reduce || !eGroups.length || !targetEl){ commit(); return; }
  animating = true;
  hideTools();
  const t = groupCenter(target);
  const STAGGER = 80, FLIGHT = 450;
  eGroups.forEach((eg, i) => {
    const el = grpEl(eg.gid);
    if(!el) return;
    const c = groupCenter(eg);
    el.classList.add("flying");
    el.style.transitionDelay = (i * STAGGER) + "ms";
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.style.transform = `translate(${t.x - c.x}px,${t.y - c.y}px) scale(.35)`;
      el.style.opacity = "0";
    }));
  });
  const total = FLIGHT + (eGroups.length - 1) * STAGGER;
  setTimeout(() => targetEl.classList.add("pulse"), total - 80);
  setTimeout(() => { animating = false; commit(); }, total + 140);
}

/* ===================== actions (products side) ===================== */

// Cation with all its electrons plugged into its sockets.
function fuseCandidate(g){
  const ions = g.pieces.filter(p => speciesOf(p).kind === "ion");
  const es   = g.pieces.filter(p => speciesOf(p).kind === "electron");
  if(ions.length !== 1 || es.length === 0) return null;
  if(g.pieces.length !== ions.length + es.length) return null;
  const sp = speciesOf(ions[0]);
  if(sp.charge <= 0 || es.length !== chargeUnits(sp)) return null;
  if(!atomFor(sp.sym)) return null;
  return { cat: ions[0], es, sp };
}

// A bare cation on its own, which can pull in free electrons.
function loneCation(g){
  if(g.pieces.length !== 1) return null;
  const sp = speciesOf(g.pieces[0]);
  return (sp.kind === "ion" && sp.charge > 0 && atomFor(sp.sym)) ? sp : null;
}

function fuseGroup(gid){
  if(animating) return;
  const g = findGroup(gid);
  if(!g) return;
  const cand = fuseCandidate(g);
  if(!cand) return;
  const { cat, sp } = cand;
  const n = chargeUnits(sp);
  groups = groups.filter(x => x.gid !== gid);
  selection.delete(gid);
  groups.push(single(atomFor(sp.sym), cat.col, cat.row, g.side));
  lastReaction = { type:"Reduction", text:`${sp.formula}${supCharge(n,1)} + ${n>1?n:""}e⁻ → ${sp.formula}` };
  hoverGid = null; resolveBonds(); render();
}

function fuseFree(gid){
  if(animating) return;
  const g = findGroup(gid);
  if(!g) return;
  const sp = loneCation(g);
  if(!sp) return;
  const n = chargeUnits(sp);
  const es = needElectrons(g, n, sp.formula + supCharge(n, 1) + " into " + sp.formula);
  if(!es) return;
  const p = g.pieces[0], col = p.col, row = p.row;
  flyElectrons(es, g, () => {
    const gone = new Set([gid, ...es.map(e => e.gid)]);
    groups = groups.filter(x => !gone.has(x.gid));
    gone.forEach(id => selection.delete(id));
    groups.push(single(atomFor(sp.sym), col, row, "R"));
    lastReaction = { type:"Reduction", text:`${sp.formula}${supCharge(n,1)} + ${n>1?n:""}e⁻ → ${sp.formula}` };
    hoverGid = null; resolveBonds(); render();
  });
}

function canStrip(g){
  if(g.pieces.length !== 1) return false;
  const sp = speciesOf(g.pieces[0]);
  return sp.kind === "ion" && sp.charge < 0 && sp.monatomic && !!atomFor(sp.sym);
}

function stripAnion(gid){
  if(animating) return;
  const g = findGroup(gid);
  if(!g || !canStrip(g)) return;
  const p = g.pieces[0], sp = speciesOf(p);
  const n = chargeUnits(sp), col = p.col, row = p.row;

  shrinkAway(gid, () => {
    groups = groups.filter(x => x.gid !== gid);
    selection.delete(gid);
    const ng = single(atomFor(sp.sym), col, row, g.side);
    groups.push(ng);
    const newGids = [ng.gid];
    for(let k = 0; k < n; k++){
      const es = findFreeSlot(ELECTRON, col + TILE_W + 1, row + k, g.side);
      if(!es) break;
      const eg = single(ELECTRON, es.col, es.row, g.side);
      groups.push(eg);
      newGids.push(eg.gid);
    }
    lastReaction = { type:"Oxidation", text:`${sp.formula}${supCharge(n,-1)} → ${sp.formula} + ${n>1?n:""}e⁻` };
    hoverGid = null;
    justAdded = new Set(newGids);
    resolveBonds(); render();
  });
}

function reverseOptions(g){
  if(g.pieces.length !== 1) return [];
  const sp = speciesOf(g.pieces[0]);
  if(sp.kind !== "atom") return [];
  return Object.values(registry).filter(s => s.kind === "ion" && s.sym === sp.sym && s.monatomic);
}

function reverseAtom(gid){
  if(animating) return;
  const g = findGroup(gid);
  if(!g) return;
  const opts = reverseOptions(g);
  if(!opts.length) return;
  const ion = opts[0], n = chargeUnits(ion);
  const p = g.pieces[0], col = p.col, row = p.row;
  const side = g.side;

  const placeIon = (ignore) => {
    const probe = { gid:"__p", side, pieces:[{ pid:"__x", spId: ion.id, col, row }] };
    return groupFits(probe, 0, 0, ["__p", ...ignore], side) ? {col, row} : findFreeSlot(ion, col, row, side);
  };

  if(ion.charge > 0){
    // Oxidation: the atom gives up electrons, which appear beside it.
    groups = groups.filter(x => x.gid !== gid);
    selection.delete(gid);
    const slot = placeIon([]);
    if(!slot){ flash("No room to place the ion."); render(); return; }
    groups.push(single(ion, slot.col, slot.row, side));
    // keep the freed electrons out of the ion's own sockets, so they
    // don't plug straight back in
    const sockets = Array.from({length: n}, (_, k) => (slot.col + TILE_W) + "," + (slot.row + k));
    for(let k = 0; k < n; k++){
      const es = findFreeSlot(ELECTRON, slot.col + TILE_W + 1, slot.row + k, side, sockets);
      if(!es) break;
      groups.push(single(ELECTRON, es.col, es.row, side));
    }
    lastReaction = { type:"Oxidation", text:`${ion.formula} → ${ion.formula}${supCharge(n,1)} + ${n>1?n:""}e⁻` };
    hoverGid = null; resolveBonds(); render();
    return;
  }

  // Reduction: the atom needs real electrons from the products side.
  const es = needElectrons(g, n, ion.formula + supCharge(n, -1));
  if(!es) return;
  flyElectrons(es, g, () => {
    const gone = new Set([gid, ...es.map(e => e.gid)]);
    groups = groups.filter(x => !gone.has(x.gid));
    gone.forEach(id => selection.delete(id));
    const slot = placeIon([]);
    if(!slot){ flash("No room to place the ion."); render(); return; }
    groups.push(single(ion, slot.col, slot.row, side));
    lastReaction = { type:"Reduction", text:`${ion.formula} + ${n>1?n:""}e⁻ → ${ion.formula}${supCharge(n,-1)}` };
    hoverGid = null; resolveBonds(); render();
  });
}

/* A 2-D molecule (CH₄, NH₃) is drawn as a single tile, so it has no bonds
   for the scissors to cut. Break it into its atoms instead: CH₄ → C + 4H.
   Without this the tile is a dead end — it can go on the board but never
   take part in anything. */
function moleculeAtoms(g){
  if(g.pieces.length !== 1) return null;
  const sp = speciesOf(g.pieces[0]);
  if(sp.kind !== "molecule") return null;
  const syms = [];
  Object.entries(sp.comp).forEach(([sym, k]) => { for(let i = 0; i < k; i++) syms.push(sym); });
  if(syms.length < 2 || !syms.every(atomFor)) return null;
  const parts = {};
  syms.forEach(x => { parts[x] = (parts[x] || 0) + 1; });
  const rhs = Object.keys(parts).map(x => (parts[x] > 1 ? parts[x] : "") + x).join(" + ");
  return { sp, syms, rhs };
}

function splitMolecule(gid){
  if(animating) return;
  const g = findGroup(gid);
  const m = g && moleculeAtoms(g);
  if(!m) return;

  const p = g.pieces[0], col = p.col, row = p.row, side = g.side;

  shrinkAway(gid, () => {
    groups = groups.filter(x => x.gid !== gid);
    selection.delete(gid);

    const gids = [];
    let cursorCol = col;
    m.syms.forEach((sym, i) => {
      const sp = atomFor(sym);
      const slot = (i === 0) ? { col, row }
        : findFreeSlot(sp, cursorCol + TILE_W + 1, row, side);
      if(!slot) return;
      const ng = single(sp, slot.col, slot.row, side);
      groups.push(ng);
      gids.push(ng.gid);
      cursorCol = slot.col;
    });
    separateAll(gids);

    lastReaction = { type:"Bond broken", text: `${m.sp.formula} → ${m.rhs}` };
    hoverGid = null;
    justAdded = new Set(gids);
    render();
  });
}

// Scissors: rigid group, ALL bonds break at once.
function scissorGroup(gid){
  if(animating) return;
  const g = findGroup(gid);
  if(!g || g.pieces.length < 2) return;

  const dia = diatomicOf(g);
  const chain = chainFormula(g);
  const eq = compoundEquation(g);

  shrinkAway(gid, () => {
    const pieces = [...g.pieces].sort((a,b) => a.col - b.col || a.row - b.row);
    groups = groups.filter(x => x.gid !== gid);
    selection.delete(gid);
    const gids = pieces.map(p => {
      const ng = mkGroup([p], [], g.side);
      groups.push(ng);
      return ng.gid;
    });
    separateAll(gids);

    if(dia) lastReaction = { type:"Bond broken", text:`${dia.formula}${subDigits(2)} → 2${dia.formula}` };
    else if(chain){
      const parts = pieces.map(p => speciesOf(p).formula);
      lastReaction = { type:"Bond broken", text:`${chain} → ${parts.join(" + ")}` };
    }
    else if(eq) lastReaction = { type:"Dissociation", text: eq.split(" → ").reverse().join(" → ") };
    hoverGid = null;
    justAdded = new Set(gids);
    render();
  });
}

/* --- decomposition: table-driven --------------------------------------
   A lone polyatomic ion that breaks into fixed products. Add cases here
   as teachers ask for them. "Reset products" undoes it.
--------------------------------------------------------------------- */

const DECOMPOSE = {
  // carbonate -> oxide + carbon dioxide   (CO3^2-  ->  O^2-  +  CO2)
  "CO3|-2": {
    label: "CO₃²⁻ → O²⁻ + CO₂",
    products: [ {ion:["O", -2]}, {chain:["O",2,"C",2,"O"]} ]
  },
  // sulfite -> oxide + sulfur dioxide   (SO3^2-  ->  O^2-  +  SO2)
  "SO3|-2": {
    label: "SO₃²⁻ → O²⁻ + SO₂",
    products: [ {ion:["O", -2]}, {chain:["O",2,"S",2,"O"]} ]
  },
  // hydrogencarbonate -> hydroxide + carbon dioxide   (HCO3^-  ->  OH^-  +  CO2)
  "HCO3|-1": {
    label: "HCO₃⁻ → OH⁻ + CO₂",
    products: [ {ion:["OH", -1]}, {chain:["O",2,"C",2,"O"]} ]
  }
};

function decomposeKey(g){
  if(g.pieces.length !== 1) return null;
  const sp = speciesOf(g.pieces[0]);
  if(sp.kind !== "ion" || !sp.poly) return null;
  const k = sp.sym + "|" + sp.charge;
  return DECOMPOSE[k] ? k : null;
}

// Shrink+fade the gid's current tile, then run commit() (which should
// mutate `groups`, set `justAdded` to the new gids, and call render()).
// Skips the animation (runs commit synchronously) if reduced motion is
// requested or the element isn't on screen.
function shrinkAway(gid, commit){
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const el = grpEl(gid);
  if(reduce || !el){ commit(); return; }

  animating = true;
  hideTools();
  el.classList.add("reacting");
  requestAnimationFrame(() => requestAnimationFrame(() => {
    el.style.transform = "scale(.4)";
    el.style.opacity = "0";
  }));
  setTimeout(() => { animating = false; commit(); }, 260);
}

function decomposeGroup(gid){
  if(animating) return;
  const g = findGroup(gid);
  if(!g) return;
  const key = decomposeKey(g);
  if(!key) return;

  shrinkAway(gid, () => {
    const rule = DECOMPOSE[key];
    const p = g.pieces[0];
    const col = p.col, row = p.row, side = g.side;

    groups = groups.filter(x => x.gid !== gid);
    selection.delete(gid);

    let cursorCol = col;
    const newGids = [];
    rule.products.forEach((prod, i) => {
      if(prod.ion){
        const sp = ionFor(prod.ion[0], prod.ion[1]);
        if(!sp) return;
        const slot = (i === 0) ? { col, row }
          : findFreeSlot(sp, cursorCol + TILE_W + 1, row, side);
        if(!slot) return;
        const ng = single(sp, slot.col, slot.row, side);
        groups.push(ng);
        newGids.push(ng.gid);
        cursorCol = slot.col;
      } else if(prod.chain){
        const g2 = buildChainGroup(prod.chain, cursorCol + TILE_W + 1, row, side);
        if(g2){ newGids.push(g2.gid); cursorCol = groupBounds(g2).maxC; }
      }
    });

    lastReaction = { type:"Decomposition", text: rule.label };
    hoverGid = null;
    justAdded = new Set(newGids);
    render();
  });
}

/* --- condensation: a neutral group that collapses into a molecule -----
   [H⁺][OH⁻] and 2[H⁺][O²⁻] are the same substance cut into different
   pieces, so both condense into the ONE H₂O molecule rather than living
   on the board as rival forms of water. Matching is by atom tally, which
   is why the carbonate route (CO₃²⁻ → O²⁻ + CO₂, then O²⁻ + 2H⁺) needs
   no case of its own.

   It works on ONE group — whatever the student has already joined up on
   the board. Nothing here reaches across separate groups; if two pieces
   are meant to become a molecule, they have to be plugged together first.

   Allowlisted per molecule, like DECOMPOSE: a general "neutral pieces
   whose atoms spell a molecule" rule would also let [H⁺][Cl⁻] quietly
   become HCl gas, which is not what an acid does in water. Add molecules
   here as teachers ask; the chain must match the MOLECULES entry.
--------------------------------------------------------------------- */

const CONDENSE = {};
[["H2O", ["H",1,"O",1,"H"]],
 ["CO2", ["O",2,"C",2,"O"]]].forEach(([sym, chain]) => {
  const comp = {};
  for(let i = 0; i < chain.length; i += 2) comp[chain[i]] = (comp[chain[i]] || 0) + 1;
  CONDENSE[compKey(comp)] = { sym, chain, formula: toFormulaChars(sym) };
});

// A composition as a stable string: {O:1,H:2} -> "H2O1". Internal only.
function compKey(comp){
  return Object.keys(comp).sort().map(s => s + comp[s]).join("");
}

const gcd = (a, b) => b ? gcd(b, a % b) : a;

/* Does this group add up to a whole number of molecules?

   Only raw material qualifies: pieces must be atoms or ions, and the group
   must carry no covalent bonds — that is what tells a finished H₂O from
   the pieces of one, and stops the tool offering to condense a molecule it
   has already made.

   Returns {rule, n} where n is how many molecules come out, or null. */
function condenseCandidate(g){
  if(!g || (g.bonds || []).length) return null;
  if(g.pieces.length < 2) return null;
  if(!g.pieces.every(p => ["atom", "ion"].includes(speciesOf(p).kind))) return null;
  if(g.pieces.reduce((s, p) => s + speciesOf(p).charge, 0) !== 0) return null;

  const comp = {};
  g.pieces.forEach(p => Object.entries(speciesOf(p).comp)
    .forEach(([sym, k]) => { comp[sym] = (comp[sym] || 0) + k; }));

  const n = Object.values(comp).reduce((a, b) => gcd(a, b));
  const unit = {};
  Object.entries(comp).forEach(([sym, k]) => { unit[sym] = k / n; });

  const rule = CONDENSE[compKey(unit)];
  return rule ? { rule, n } : null;
}

// "2H⁺ + O²⁻ → H₂O", "2O + C → CO₂". compoundEquation covers the all-ion
// case; this one also handles a group of plugged-together atoms.
function condenseEquation(g, cand){
  const counts = {}, order = [];
  [...g.pieces].sort((a, b) => a.col - b.col || a.row - b.row).forEach(p => {
    const sp = speciesOf(p);
    if(!counts[sp.id]){ counts[sp.id] = {sp, n:0}; order.push(sp.id); }
    counts[sp.id].n++;
  });
  const lhs = order.map(k => {
    const {sp, n} = counts[k];
    return (n > 1 ? n : "") + sp.formula +
      (sp.charge ? supCharge(chargeUnits(sp), sp.charge) : "");
  }).join(" + ");
  return lhs + " → " + (cand.n > 1 ? cand.n : "") + cand.rule.formula;
}

function condenseGroup(gid){
  if(animating) return;
  const g = findGroup(gid);
  if(!g) return;
  const cand = condenseCandidate(g);
  if(!cand) return;

  const eq = condenseEquation(g, cand);
  const b = groupBounds(g);
  const side = g.side;

  shrinkAway(gid, () => {
    groups = groups.filter(x => x.gid !== gid);
    selection.delete(gid);

    // Cleared the space first, so the molecule can be built where its
    // pieces were rather than being pushed off to one side.
    const newGids = [];
    for(let i = 0; i < cand.n; i++){
      const ng = buildChainGroup(cand.rule.chain, b.minC, b.minR + i, side);
      if(ng) newGids.push(ng.gid);
    }

    // The Condensation line already states this reaction, so don't let the
    // live logger also announce the new chain's own "H + O + H → H₂O".
    newGids.forEach(id => {
      const ng = findGroup(id);
      const t = ng && (halfEquation(ng) || compoundEquation(ng));
      if(t) loggedLive.add(id + "|" + t);
    });

    lastReaction = { type:"Condensation", text: eq };
    hoverGid = null;
    justAdded = new Set(newGids);
    render();
  });
}

/* --- build a linear chain molecule as a group of bonded atom tiles --- */

function chainFits(chain, c, r, occ, side){
  const [lo, hi] = rangeOf(side);
  const atoms = chain.filter((_, i) => i % 2 === 0);
  for(let i = 0; i < atoms.length; i++){
    const c0 = c + i * TILE_W;
    if(c0 < lo || c0 + TILE_W > hi || r < 0 || r + 1 > ROWS) return false;
    for(let k = 0; k < TILE_W; k++) if(occ.has((c0+k) + "," + r)) return false;
  }
  return true;
}

function buildChainGroup(chain, atCol, atRow, side){
  side = side || "L";
  const occ = occupancy();
  let spot = null;
  const startC = atCol === undefined ? rangeOf(side)[0] : atCol;
  const startR = atRow === undefined ? 1 : atRow;
  if(chainFits(chain, startC, startR, occ, side)) spot = {c: startC, r: startR};
  if(!spot){
    outer:
    for(let d = 0; d <= COLS + ROWS; d++)
      for(let dc = -d; dc <= d; dc++)
        for(let dr = -d; dr <= d; dr++){
          if(Math.max(Math.abs(dc), Math.abs(dr)) !== d) continue;
          const c = startC + dc, r = startR + dr;
          if(chainFits(chain, c, r, occ, side)){ spot = {c, r}; break outer; }
        }
  }
  if(!spot){ flash("No free space on this side of the board."); return null; }

  const pieces = [], bonds = [];
  for(let i = 0; i < chain.length; i += 2){
    const sp = atomFor(chain[i]);
    if(!sp) return null;
    pieces.push({ pid: nextId("p"), spId: sp.id, col: spot.c + (i/2) * TILE_W, row: spot.r });
  }
  for(let i = 1; i < chain.length; i += 2)
    bonds.push([pieces[(i-1)/2].pid, pieces[(i+1)/2].pid, chain[i]]);
  const g = mkGroup(pieces, bonds, side);
  groups.push(g);
  return g;
}

/* ===================== actions (reactants side) ===================== */

// Delete reactants. If the products side is still an untouched copy,
// the matching product goes too; otherwise offer to reset the products.
function requestDelete(gids){
  if(animating) return;
  const left = gids.map(findGroup).filter(g => g && g.side === "L");
  if(!left.length) return;
  const removeLeft = () => left.forEach(g => {
    groups = groups.filter(x => x.gid !== g.gid); selection.delete(g.gid);
  });
  if(productsUntouched()){
    left.forEach(g => {
      const s = sig(g);
      const m = onSide("R").find(x => sig(x) === s);
      if(m){ groups = groups.filter(x => x.gid !== m.gid); selection.delete(m.gid); }
    });
    removeLeft();
    hoverGid = null; render();
    return;
  }
  showDialog("The products have already changed",
    "Removing a reactant now would leave the products side out of step. " +
    "Reset the products side and copy the remaining reactants across again?",
    [ {label:"Cancel"},
      {label:"Delete and reset products", primary:true, action: () => { removeLeft(); resetProducts(); }} ]);
}

// Duplicate reactants; each copy is mirrored to the products side.
function duplicateGroups(gids){
  if(animating) return;
  const left = gids.map(findGroup).filter(g => g && g.side === "L");
  if(!left.length){
    if(gids.length) flash("Products can't be duplicated. Add more reactants on the left instead.");
    return;
  }
  const made = [];
  left.forEach(g => {
    const b = groupBounds(g);
    const ng = placeCopy(g, "L", 0, b.maxR - b.minR + 1);
    if(!ng) return;
    mirrorGroup(ng);
    made.push(ng.gid);
  });
  if(!made.length){ flash("No free space to place the copy."); return; }
  selection = new Set(made);
  hoverGid = null;
  resolveBonds(); render();
}

/* ===================== formulas ===================== */

function tallyOf(g){
  const counts = {}, order = [];
  [...g.pieces].sort((a,b) => a.col - b.col || a.row - b.row).forEach(p => {
    const sp = speciesOf(p);
    if(!counts[sp.id]){ counts[sp.id] = {sp, n:0}; order.push(sp.id); }
    counts[sp.id].n++;
  });
  return {counts, order};
}

function partOf(counts, key){
  const {sp, n} = counts[key];
  const body = (sp.poly && n > 1) ? "(" + sp.formula + ")" : sp.formula;
  return body + (n > 1 ? subDigits(n) : "");
}

function compoundEquation(g){
  const dia = diatomicOf(g);
  if(dia) return `2${dia.formula} → ${dia.formula}${subDigits(2)}`;

  const chain = chainFormula(g);
  if(chain){
    const parts = [...g.pieces].sort((a,b) => a.col - b.col).map(p => speciesOf(p).formula);
    return `${parts.join(" + ")} → ${chain}`;
  }

  const net = g.pieces.reduce((s,p) => s + speciesOf(p).charge, 0);
  if(net !== 0) return "";
  if(g.pieces.some(p => ["electron","atom","molecule"].includes(speciesOf(p).kind))) return "";
  const {counts, order} = tallyOf(g);
  const cats = order.filter(k => counts[k].sp.charge > 0);
  const ans  = order.filter(k => counts[k].sp.charge < 0);
  if(!cats.length || !ans.length) return "";
  const lhs = order.map(k => {
    const {sp, n} = counts[k];
    return (n > 1 ? n : "") + sp.formula + supCharge(chargeUnits(sp), sp.charge);
  }).join(" + ");

  // Ions that add up to a molecule read as that molecule, not as a salt:
  // H⁺ + OH⁻ and 2H⁺ + O²⁻ both give H₂O. See CONDENSE.
  const cond = condenseCandidate(g);
  if(cond) return lhs + " → " + (cond.n > 1 ? cond.n : "") + cond.rule.formula;

  const rhs = cats.map(k => partOf(counts,k)).join("") + ans.map(k => partOf(counts,k)).join("");
  return lhs + " → " + rhs;
}

function halfEquation(g){
  const cand = fuseCandidate(g);
  if(!cand) return "";
  const n = chargeUnits(cand.sp);
  return `${cand.sp.formula}${supCharge(n,1)} + ${n>1?n:""}e⁻ → ${cand.sp.formula}`;
}

/* ===================== products readout =====================
   Atoms are conserved by construction (products can only be rearranged
   reactants), so the useful feedback is: are there loose electrons or
   bare ions still to deal with on the products side?
============================================================= */

function renderStatus(){
  const bar = document.getElementById("status");
  if(!bar) return;
  const L = onSide("L"), R = onSide("R");
  if(!L.length && !R.length){ bar.className = ""; bar.innerHTML = ""; return; }
  bar.className = "on";

  // atom tally (from the reactants; the products always match)
  const el = {};
  L.forEach(g => g.pieces.forEach(p =>
    Object.entries(speciesOf(p).comp).forEach(([s, k]) => { el[s] = (el[s] || 0) + k; })));
  const syms = Object.keys(el).sort((a, b) => {
    if(a === "C") return -1; if(b === "C") return 1;
    if(a === "H") return -1; if(b === "H") return 1;
    return a.localeCompare(b);
  });
  const tally = syms.map(s => s + (el[s] > 1 ? subDigits(el[s]) : "")).join(" ");

  let loose = 0; const bare = [];
  R.forEach(g => {
    g.pieces.forEach(p => { if(speciesOf(p).kind === "electron") loose++; });
    const net = g.pieces.reduce((s, p) => {
      const sp = speciesOf(p); return s + (sp.kind === "electron" ? 0 : sp.charge);
    }, 0);
    if(net !== 0)
      g.pieces.filter(p => speciesOf(p).kind === "ion").forEach(p => {
        const sp = speciesOf(p); bare.push(sp.formula + supCharge(chargeUnits(sp), sp.charge));
      });
  });

  const chips = [`<span class="st tally" title="Atoms are conserved: the products side always contains exactly these atoms">Atoms ${tally}</span>`];
  if(loose) chips.push(`<span class="st bad">${loose} electron${loose > 1 ? "s" : ""} still loose</span>`);
  if(bare.length) chips.push(`<span class="st bad">still charged: ${bare.join(", ")}</span>`);
  if(!loose && !bare.length && R.length) chips.push(`<span class="st ok">Products complete ✓</span>`);
  bar.innerHTML = `<span class="st-lead">Products</span>` + chips.join("");
}

/* ===================== rendering ===================== */

// `tabs` is whether this piece is still offering its covalent sockets; the
// render loop works it out from socketsOf, so an atom inside a finished
// molecule is drawn plain instead of advertising bonds it cannot make.
function pieceSVG(sp, w, h, tabs){
  const n = chargeUnits(sp);
  if(sp.kind === "electron"){
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;overflow:visible;">
      <rect x="0" y="0" width="${w}" height="${h}" rx="6" fill="${sp.color.bg}"/>
      <circle cx="0" cy="${h/2}" r="${R_TAB}" fill="${sp.color.bg}"/>
      <text x="${w/2+4}" y="${h/2}" text-anchor="middle" dominant-baseline="central"
        style="fill:${sp.color.text};font-size:12.5px;font-weight:600;font-style:italic;">e⁻</text></svg>`;
  }
  let shapes = `<rect x="0" y="0" width="${w}" height="${h}" rx="6" fill="${sp.color.bg}"/>`;
  if(sp.kind === "ion"){
    for(let k = 0; k < n; k++){
      const cy = UNIT*k + UNIT/2;
      if(sp.charge > 0) shapes += `<circle cx="${w}" cy="${cy}" r="${R_TAB+1}" fill="var(--surface-1)"/>`;
      else              shapes += `<circle cx="0" cy="${cy}" r="${R_TAB}" fill="${sp.color.bg}"/>`;
    }
  }
  if(sp.kind === "atom" || sp.kind === "molecule"){
    shapes += `<rect x="1.5" y="1.5" width="${w-3}" height="${h-3}" rx="5" fill="none"
      stroke="${sp.color.text}" stroke-width="1.4" stroke-dasharray="4 3" opacity=".5"/>`;
  }
  // Covalent tabs: two a side, reading as the double bond they stand for.
  // Carbon shows bumps, oxygen the holes they drop into.
  if(tabs && bondTabOf(sp)){
    const bump = bondTabOf(sp) === "ctab";
    [h/2 - R_BOND - 2, h/2 + R_BOND + 2].forEach(cy => {
      [0, w].forEach(cx => {
        shapes += bump
          ? `<circle cx="${cx}" cy="${cy}" r="${R_BOND}" fill="${sp.color.bg}"/>`
          : `<circle cx="${cx}" cy="${cy}" r="${R_BOND + 1}" fill="var(--surface-1)"/>`;
      });
    });
  }
  const label = sp.kind === "ion" ? sp.formula + supCharge(n, sp.charge) : sp.formula;
  const tx = sp.kind === "ion" ? (sp.charge > 0 ? w/2 - 5 : w/2 + 5) : w/2;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;overflow:visible;">
    ${shapes}<text x="${tx}" y="${h/2}" text-anchor="middle" dominant-baseline="central"
      style="fill:${sp.color.text};font-size:14.5px;font-weight:500;">${label}</text></svg>`;
}

const SCISSORS = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1a1a19"
  stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/>
  <circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/>
  <line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>`;
const PLUS = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1a7f4b"
  stroke-width="2.6" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/>
  <line x1="5" y1="12" x2="19" y2="12"/></svg>`;
const CROSS = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c23b3b"
  stroke-width="2.6" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/>
  <line x1="18" y1="6" x2="6" y2="18"/></svg>`;
const UNDO = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#55534c"
  stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/>
  <path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>`;
const COPY = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1a1a19"
  stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>`;
// condense: a droplet
const CONDENSE_ICON = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2f7fb5"
  stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 3.5c3.2 3.9 5 6.6 5 9a5 5 0 0 1-10 0c0-2.4 1.8-5.1 5-9z"/></svg>`;
// decompose: an arrow splitting into two
const DECOMP = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8a4f9e"
  stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
  <path d="M4 12h6"/><path d="M14 6h6"/><path d="M14 18h6"/><path d="M10 12l4-6"/><path d="M10 12l4 6"/></svg>`;

function pieceRect(p){
  const sp = speciesOf(p);
  return { left: PAD + p.col * CELL_W, top: PAD + p.row * UNIT,
           w: widthCells(sp) * CELL_W, h: heightRows(sp) * UNIT };
}

const ARROW = `<svg width="68" height="28" viewBox="0 0 68 28"><line x1="6" y1="14" x2="54" y2="14"
  stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="46,7 55,14 46,21" fill="none" stroke="currentColor"
  stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function render(){
  const board = document.getElementById("board");
  board.style.cssText =
    `position:relative;width:${BOARD_W}px;height:${BOARD_H}px;` +
    `background-image:` +
      `linear-gradient(to right,var(--grid-line-major) 1px,transparent 1px),` +
      `linear-gradient(to right,var(--grid-line) 1px,transparent 1px),` +
      `linear-gradient(to bottom,var(--grid-line-major) 1px,transparent 1px);` +
    `background-size:${CELL_W*2}px ${UNIT}px, ${CELL_W}px ${UNIT}px, ${CELL_W}px ${UNIT}px;` +
    `background-position:${PAD}px ${PAD}px;`;

  const midX = PAD + MID_CELL * CELL_W;
  let html = "";
  html += `<div class="divider" style="left:${midX - CELL_W}px;"></div>`;
  html += `<div class="divider" style="left:${midX + CELL_W}px;"></div>`;
  html += `<div class="zone-label" style="left:${PAD + 6}px;">Reactants</div>`;
  html += `<div class="zone-label" style="left:${midX + CELL_W + 10}px;">Products</div>`;
  html += `<button id="arrow-btn" type="button" title="Reset products: clear the right side and copy the reactants across again"
    aria-label="Reset products" style="left:${midX - 34}px;top:${BOARD_H/2 - 23}px;">${ARROW}<span>reset</span></button>`;

  groups.forEach(g => {
    const b = groupBounds(g);
    const left = PAD + b.minC * CELL_W, top = PAD + b.minR * UNIT;
    const w = (b.maxC - b.minC + 1) * CELL_W, h = (b.maxR - b.minR + 1) * UNIT;
    const sel = selection.has(g.gid) ? " sel" : "";
    const popin = justAdded && justAdded.has(g.gid) ? " popin" : "";
    html += `<div class="grp${sel}${popin}" data-gid="${g.gid}" tabindex="0" role="button"
      style="left:${left}px;top:${top}px;width:${w}px;height:${h}px;">`;
    // Pieces that show holes are drawn first so the pieces that show bumps
    // land on top of them: cations before anions, oxygen before carbon.
    const plugLast = sp => (sp.charge < 0 || bondTabOf(sp) === "ctab") ? 1 : 0;
    const ordered = [...g.pieces].sort((a,b2) =>
      plugLast(speciesOf(a)) - plugLast(speciesOf(b2)));
    ordered.forEach(p => {
      const r = pieceRect(p);
      html += `<div style="position:absolute;left:${r.left-left}px;top:${r.top-top}px;width:${r.w}px;
        height:${r.h}px;pointer-events:none;">${pieceSVG(speciesOf(p), r.w, r.h,
          socketsOf(p, g).length > 0)}</div>`;
    });
    html += `<div class="selring"></div>`;

    // covalent bonds: one dash per bond order, stacked vertically
    (g.bonds || []).forEach(bd => {
      const pa = g.pieces.find(p => p.pid === bd[0]);
      const pb = g.pieces.find(p => p.pid === bd[1]);
      if(!pa || !pb) return;
      const order = bd[2] || 1;
      const ra = pieceRect(pa), rb = pieceRect(pb);
      const lp = ra.left < rb.left ? ra : rb;
      const x = lp.left + lp.w;
      const yMid = lp.top + lp.h / 2;
      const GAP = 4.5;
      const first = yMid - ((order - 1) * GAP) / 2;
      for(let i = 0; i < order; i++){
        const y = first + i * GAP;
        html += `<div class="bond" style="left:${x - left - 7}px;top:${y - top - 1.25}px;width:14px;"></div>`;
      }
    });
    html += `</div>`;
  });

  html += `<div id="marquee"></div><div id="tools"></div>`;
  if(!onSide("L").length)
    html += `<span class="zone-hint" style="top:${PAD+4}px;left:${PAD+90}px;">Search above to add your first reactant.</span>`;
  if(!onSide("R").length)
    html += `<span class="zone-hint" style="top:${PAD+4}px;left:${midX + CELL_W + 90}px;">Reactants you add appear here, ready to rearrange into products.</span>`;
  board.innerHTML = html;
  justAdded = null;

  wireBoard(board);
  if(hoverGid && findGroup(hoverGid)) showTools(hoverGid);
  renderEquations();
  renderStatus();
}

function showTools(gid){
  const g = findGroup(gid);
  const tools = document.getElementById("tools");
  if(!g || !tools) return;
  if(animating){ hideTools(); return; }
  const multi = selection.size > 1 && selection.has(gid);
  const acts = [];

  if(multi){
    const allLeft = [...selection].every(id => { const x = findGroup(id); return x && x.side === "L"; });
    if(!allLeft){ hideTools(); return; }
    acts.push(["copy", COPY, `Duplicate ${selection.size} selected`]);
    acts.push(["del", CROSS, "Delete selected"]);
  } else if(g.side === "L"){
    acts.push(["copy", COPY, "Duplicate"]);
    acts.push(["del", CROSS, "Delete"]);
  } else {
    if(g.pieces.length > 1)
      acts.push(["cut", SCISSORS, (diatomicOf(g) || chainFormula(g)) ? "Break the bonds" : "Split apart"]);
    else if(moleculeAtoms(g))
      acts.push(["split", SCISSORS, `Break it into atoms (${moleculeAtoms(g).rhs})`]);
    if(fuseCandidate(g))         acts.push(["fuse", PLUS, "Make a neutral atom"]);
    else if(loneCation(g))       acts.push(["fusefree", PLUS, "Make a neutral atom (pulls in free electrons)"]);
    if(canStrip(g))              acts.push(["strip", SCISSORS, "Take the electrons off"]);
    if(decomposeKey(g))          acts.push(["decomp", DECOMP, DECOMPOSE[decomposeKey(g)].label]);
    const cond = condenseCandidate(g);
    if(cond) acts.push(["condense", CONDENSE_ICON,
      `Combine into ${cond.n > 1 ? cond.n : ""}${cond.rule.formula}`]);
    if(reverseOptions(g).length){
      const ion = reverseOptions(g)[0];
      acts.push(["reverse", UNDO, ion.charge > 0 ? "Turn into its ion (gives up electrons)"
                                                 : "Turn into its ion (takes in free electrons)"]);
    }
    if(!acts.length){ hideTools(); return; }
  }

  const b = multi ? selectionBounds() : groupBounds(g);
  tools.style.left = (PAD + (b.maxC + 1) * CELL_W + 5) + "px";
  tools.style.top  = (PAD + b.minR * UNIT) + "px";
  tools.className = "on";
  tools.innerHTML = acts.map(([k, svg, title]) =>
    `<button class="act ${k==="del"?"danger":""}" data-act="${k}" data-gid="${gid}"
      title="${title}" aria-label="${title}">${svg}</button>`).join("");

  tools.querySelectorAll(".act").forEach(btn => {
    btn.addEventListener("pointerdown", e => e.stopPropagation());
    btn.addEventListener("click", e => {
      e.stopPropagation();
      if(animating) return;
      const id = btn.dataset.gid, act = btn.dataset.act;
      const targets = (selection.size > 1 && selection.has(id)) ? [...selection] : [id];
      if(act === "copy"){ duplicateGroups(targets); return; }
      if(act === "del"){ requestDelete(targets); return; }
      ({cut:scissorGroup, split:splitMolecule, fuse:fuseGroup, fusefree:fuseFree,
        strip:stripAnion, reverse:reverseAtom, decomp:decomposeGroup,
        condense:condenseGroup})[act](id);
    });
  });
  tools.addEventListener("mouseenter", () => { hoverGid = gid; });
  tools.addEventListener("mouseleave", () => { hoverGid = null; hideTools(); });
}

function hideTools(){ const t = document.getElementById("tools"); if(t) t.className = ""; }

function selectionBounds(){
  let minC = Infinity, maxC = -Infinity, minR = Infinity, maxR = -Infinity;
  selection.forEach(gid => {
    const g = findGroup(gid);
    if(!g) return;
    const b = groupBounds(g);
    minC = Math.min(minC, b.minC); maxC = Math.max(maxC, b.maxC);
    minR = Math.min(minR, b.minR); maxR = Math.max(maxR, b.maxR);
  });
  return {minC, maxC, minR, maxR};
}

/* ===================== interaction =====================
   All dragging uses Pointer Events so it works with a mouse, a finger
   or a stylus. A press that moves less than a few pixels is a tap:
   it selects the piece and shows its tools.
======================================================== */

const DRAG_THRESHOLD = 5;
let dragState = null;   // moving groups already on the board
let marquee = null;     // rubber-band selection on empty space
let libDrag = null;     // dragging a search result onto the board

function boardXY(e){
  const r = document.getElementById("board").getBoundingClientRect();
  return { x: e.clientX - r.left - PAD, y: e.clientY - r.top - PAD };
}

function grpEl(gid){
  return document.querySelector(`#board .grp[data-gid="${gid}"]`);
}

function wireBoard(board){
  const arrow = board.querySelector("#arrow-btn");
  if(arrow){
    arrow.addEventListener("pointerdown", e => e.stopPropagation());
    arrow.addEventListener("click", () => {
      if(animating) return;
      if(!onSide("L").length){ flash("Add a reactant first."); return; }
      if(productsUntouched()){ resetProducts(); return; }
      showDialog("Reset the products?",
        "This clears everything on the products side and copies the reactants across again.",
        [ {label:"Cancel"}, {label:"Reset products", primary:true, action: resetProducts} ]);
    });
  }

  board.querySelectorAll(".grp").forEach(el => {
    const gid = el.dataset.gid;
    el.addEventListener("mouseenter", () => { if(dragState || marquee || animating) return; hoverGid = gid; showTools(gid); });
    el.addEventListener("mouseleave", () => { setTimeout(() => { if(hoverGid !== gid) hideTools(); }, 10); });
    el.addEventListener("focus", () => { hoverGid = gid; showTools(gid); });

    el.addEventListener("pointerdown", e => {
      if(e.button !== 0 || animating) return;
      e.stopPropagation();
      if(e.shiftKey){
        e.preventDefault();
        if(selection.has(gid)) selection.delete(gid); else selection.add(gid);
        render();
        return;
      }
      if(!selection.has(gid)){
        selection.clear(); selection.add(gid);
        board.querySelectorAll(".grp.sel").forEach(n => n.classList.remove("sel"));
        el.classList.add("sel");
      }
      const g = findGroup(gid);
      const b = groupBounds(g);
      const {x, y} = boardXY(e);
      const moving = selection.size > 1 ? [...selection] : [gid];
      dragState = { gids: moving, anchor: gid,
        grabCol: x/CELL_W - b.minC, grabRow: y/UNIT - b.minR,
        startX: e.clientX, startY: e.clientY, moved: false };
      el.setPointerCapture(e.pointerId);
      e.preventDefault();
    });

    el.addEventListener("pointermove", e => {
      if(!dragState || dragState.anchor !== gid) return;
      const dx = e.clientX - dragState.startX, dy = e.clientY - dragState.startY;
      if(!dragState.moved){
        if(Math.hypot(dx, dy) < DRAG_THRESHOLD) return;
        dragState.moved = true;
        hideTools();
        dragState.gids.forEach(id => { const n = grpEl(id); if(n) n.classList.add("dragging"); });
      }
      dragState.gids.forEach(id => {
        const n = grpEl(id);
        if(n) n.style.transform = `translate(${dx}px,${dy}px)`;
      });
    });

    const finish = e => {
      if(!dragState || dragState.anchor !== gid) return;
      const ds = dragState; dragState = null;
      if(!ds.moved){ hoverGid = gid; render(); return; }   // tap: select + show tools
      const {x, y} = boardXY(e);
      const anchor = findGroup(ds.anchor);
      if(anchor){
        const b = groupBounds(anchor);
        const dc = Math.round(x/CELL_W - ds.grabCol) - b.minC;
        const dr = Math.round(y/UNIT  - ds.grabRow) - b.minR;
        moveMany(ds.gids, dc, dr);
      }
      hoverGid = null;
      resolveBonds(); render();
    };
    el.addEventListener("pointerup", finish);
    el.addEventListener("pointercancel", () => { dragState = null; render(); });

    el.addEventListener("keydown", e => {
      if(e.key === "Delete" || e.key === "Backspace"){ e.preventDefault(); requestDelete([gid]); }
      if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "d"){
        e.preventDefault();
        duplicateGroups(selection.size && selection.has(gid) ? [...selection] : [gid]);
      }
    });
  });
}

const boardEl = document.getElementById("board");
boardEl.addEventListener("mouseleave", () => { if(dragState) return; hoverGid = null; hideTools(); });

boardEl.addEventListener("pointerdown", e => {
  if(e.button !== 0 || animating) return;
  if(e.target.closest(".grp") || e.target.closest("#tools") || e.target.closest("#arrow-btn")) return;
  const {x, y} = boardXY(e);
  marquee = { x0:x, y0:y, x1:x, y1:y, additive: e.shiftKey };
  boardEl.setPointerCapture(e.pointerId);
  hoverGid = null;
  if(!e.shiftKey){ selection.clear(); }
  render();
  const box = document.getElementById("marquee");
  if(box) box.style.display = "block";
  e.preventDefault();
});

boardEl.addEventListener("pointermove", e => {
  if(!marquee) return;
  const {x, y} = boardXY(e);
  marquee.x1 = x; marquee.y1 = y;
  const box = document.getElementById("marquee");
  if(!box) return;
  const l = Math.min(marquee.x0, marquee.x1), t = Math.min(marquee.y0, marquee.y1);
  box.style.left = (l + PAD) + "px"; box.style.top = (t + PAD) + "px";
  box.style.width = Math.abs(marquee.x1 - marquee.x0) + "px";
  box.style.height = Math.abs(marquee.y1 - marquee.y0) + "px";
});

const endMarquee = () => {
  if(!marquee) return;
  const l = Math.min(marquee.x0, marquee.x1), r = Math.max(marquee.x0, marquee.x1);
  const t = Math.min(marquee.y0, marquee.y1), bm = Math.max(marquee.y0, marquee.y1);
  if(Math.abs(r-l) > 4 && Math.abs(bm-t) > 4){
    if(!marquee.additive) selection.clear();
    groups.forEach(g => {
      const b = groupBounds(g);
      if(b.minC*CELL_W < r && (b.maxC+1)*CELL_W > l &&
         b.minR*UNIT < bm && (b.maxR+1)*UNIT > t) selection.add(g.gid);
    });
  }
  marquee = null;
  const box = document.getElementById("marquee");
  if(box) box.style.display = "none";
  render();
};
boardEl.addEventListener("pointerup", endMarquee);
boardEl.addEventListener("pointercancel", endMarquee);

// Move groups by (dc, dr), nudging to the nearest fit. Groups never
// leave their own side.
function moveMany(gids, dc, dr){
  const gs = gids.map(findGroup).filter(Boolean);
  if(!gs.length) return;
  const crossed = gs.some(g => {
    const b = groupBounds(g), [lo, hi] = rangeOf(g.side);
    return b.minC + dc < lo || b.maxC + 1 + dc > hi;
  });
  if(crossed){
    flash(gs[0].side === "L"
      ? "Reactants stay on the left. A copy is already on the products side."
      : "Products stay on the right. Use the arrow to reset them from the reactants.");
    return;
  }
  const fitsAll = (a, b) => gs.every(g => groupFits(g, a, b, gids));
  const cands = [[dc,dr]];
  for(let k = 1; k <= 3; k++)
    cands.push([dc,dr-k],[dc,dr+k],[dc-k,dr],[dc+k,dr],[dc-k,dr-k],[dc+k,dr+k],[dc-k,dr+k],[dc+k,dr-k]);
  cands.push([0,0]);
  for(const [a,b] of cands) if(fitsAll(a,b)){ gs.forEach(g => translateGroup(g, a, b)); return; }
}

/* ===================== search ===================== */

let cursor = -1;
let shown = [];

function chipHTML(entry){
  if(entry.chain){
    const parts = [];
    for(let i = 0; i < entry.chain.length; i += 2){
      const sp = atomFor(entry.chain[i]);
      if(!sp) continue;
      parts.push(`<span style="display:inline-block;background:${sp.color.bg};color:${sp.color.text};
        border-radius:4px;padding:2px 5px;font-size:11.5px;font-weight:600;
        border:1px dashed ${sp.color.text};">${sp.formula}</span>`);
      if(i + 1 < entry.chain.length){
        const order = entry.chain[i+1];
        // show bond order as 1-3 stacked mini dashes
        const dashes = Array.from({length: order}, () =>
          `<span style="display:block;width:6px;height:1.5px;background:var(--text-primary);opacity:.8;"></span>`).join("");
        parts.push(`<span style="display:inline-flex;flex-direction:column;gap:1.5px;
          justify-content:center;padding:0 1px;">${dashes}</span>`);
      }
    }
    return `<span class="chip-row">${parts.join("")}</span>`;
  }
  return `<span class="chip-row" style="gap:3px;">` + entry.pieces.map(pc => {
    const sp = pc.sp, n = chargeUnits(sp);
    const label = sp.kind === "ion" ? sp.formula + supCharge(n, sp.charge)
                : sp.kind === "electron" ? "e⁻" : sp.formula;
    return `<span style="display:inline-block;background:${sp.color.bg};color:${sp.color.text};
      border-radius:4px;padding:2px 6px;font-size:12px;font-weight:600;${
      sp.kind === "atom" || sp.kind === "molecule" ? "border:1px dashed "+sp.color.text+";" : ""
    }">${label}</span>`;
  }).join("") + `</span>`;
}

function searchLib(q){
  q = q.trim().toLowerCase();
  if(!q) return [];
  const scored = [];
  library.forEach((e, i) => {
    let best = Infinity;
    e.terms.forEach(t => {
      const tl = t.toLowerCase();
      if(tl === q) best = Math.min(best, 0);
      else if(tl.startsWith(q)) best = Math.min(best, 1);
      else if(tl.includes(q)) best = Math.min(best, 2);
    });
    if(e.label.toLowerCase().includes(q)) best = Math.min(best, 2);
    if(best < Infinity) scored.push({i, e, score: best});
  });
  scored.sort((a,b) => a.score - b.score || a.e.label.length - b.e.label.length);
  return scored.slice(0, 12);
}


function renderResults(){
  const box = document.getElementById("results");
  const q = document.getElementById("search").value;
  shown = searchLib(q);
  if(!q.trim()){ box.className = ""; box.innerHTML = ""; return; }
  if(!shown.length){
    box.className = "on";
    box.innerHTML = `<div class="res-empty">Nothing matches “${q}”.</div>`;
    return;
  }
  box.className = "on";
  box.innerHTML = shown.map((s, idx) =>
    `<div class="res${idx===cursor?" cursor":""}" data-i="${s.i}" role="option">
      ${chipHTML(s.e)}<span class="res-name">${s.e.label}</span>
      <span class="res-kind">${s.e.kind}</span></div>`).join("");
  box.querySelectorAll(".res").forEach(el => {
    const i = parseInt(el.dataset.i);

    el.addEventListener("pointerdown", ev => {
      if(ev.button !== 0) return;
      libDrag = { i, startX: ev.clientX, startY: ev.clientY, moved: false, ghost: null };
      el.setPointerCapture(ev.pointerId);
      ev.preventDefault();
    });
    el.addEventListener("pointermove", ev => {
      if(!libDrag || libDrag.i !== i) return;
      const dx = ev.clientX - libDrag.startX, dy = ev.clientY - libDrag.startY;
      if(!libDrag.moved){
        if(Math.hypot(dx, dy) < DRAG_THRESHOLD + 1) return;
        libDrag.moved = true;
        const ghost = document.createElement("div");
        ghost.className = "lib-ghost";
        ghost.innerHTML = chipHTML(library[i]);
        document.body.appendChild(ghost);
        libDrag.ghost = ghost;
      }
      libDrag.ghost.style.left = ev.clientX + "px";
      libDrag.ghost.style.top  = ev.clientY + "px";
    });
    const finish = ev => {
      if(!libDrag || libDrag.i !== i) return;
      const ld = libDrag; libDrag = null;
      if(ld.ghost) ld.ghost.remove();
      if(ev.type === "pointercancel") return;
      if(!ld.moved){ dropEntry(i); closeResults(); return; }      // plain click / tap
      const r = boardEl.getBoundingClientRect();
      if(ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom){
        const x = ev.clientX - r.left - PAD, y = ev.clientY - r.top - PAD;
        const pointerCol = Math.floor(x / CELL_W);
        if(pointerCol >= MID_CELL - 1){
          closeResults();
          showError("Add reactants on the left",
            "New species go on the reactants side. A copy appears on the products side automatically, and that's where you change it.");
          return;
        }
        dropEntry(i, Math.round(x/CELL_W - 1), Math.round(y/UNIT - 0.5));
      }
      closeResults();
    };
    el.addEventListener("pointerup", finish);
    el.addEventListener("pointercancel", finish);
  });
}

function closeResults(){
  const box = document.getElementById("results");
  box.className = ""; box.innerHTML = "";
  cursor = -1;
  const s = document.getElementById("search");
  s.value = ""; s.blur();
}

// Add a library entry to the reactants side and mirror it to the products.
function dropEntry(libIndex, atCol, atRow){
  if(animating) return;
  const entry = library[libIndex];
  if(!entry) return;

  let g = null;
  if(entry.chain){
    g = buildChainGroup(entry.chain, atCol, atRow, "L");
  } else {
    const [lo, hi] = rangeOf("L");
    const fitsAt = (c, r) => {
      const occ = occupancy();
      for(const pc of entry.pieces){
        const c0 = c + (pc.dc || 0), r0 = r + (pc.dr || 0);
        if(c0 < lo || c0 + widthCells(pc.sp) > hi) return false;
        if(r0 < 0 || r0 + heightRows(pc.sp) > ROWS) return false;
        for(let i = 0; i < widthCells(pc.sp); i++)
          for(let j = 0; j < heightRows(pc.sp); j++)
            if(occ.has((c0+i)+","+(r0+j))) return false;
      }
      return true;
    };
    let spot = null;
    if(atCol !== undefined && fitsAt(atCol, atRow)) spot = {c: atCol, r: atRow};
    if(!spot){
      const startC = atCol !== undefined ? atCol : 0;
      const startR = atRow !== undefined ? atRow : 1;
      outer:
      for(let d = 0; d <= COLS + ROWS; d++)
        for(let dc = -d; dc <= d; dc++)
          for(let dr = -d; dr <= d; dr++){
            if(Math.max(Math.abs(dc), Math.abs(dr)) !== d) continue;
            const c = startC + dc, r = startR + dr;
            if(fitsAt(c, r)){ spot = {c, r}; break outer; }
          }
    }
    if(!spot){ flash("No free space on the reactants side."); return; }
    const pieces = entry.pieces.map(pc => ({ pid: nextId("p"), spId: pc.sp.id,
      col: spot.c + (pc.dc || 0), row: spot.r + (pc.dr || 0) }));
    g = mkGroup(pieces, [], "L");
    groups.push(g);
  }
  if(!g) return;
  if(!mirrorGroup(g)) flash("No free space left on the products side for a copy.");
  selection = new Set([g.gid]);
  resolveBonds(); render();
}

const searchEl = document.getElementById("search");
searchEl.addEventListener("input", () => { cursor = -1; renderResults(); });
searchEl.addEventListener("keydown", e => {
  if(e.key === "ArrowDown"){ e.preventDefault(); cursor = Math.min(cursor+1, shown.length-1); renderResults(); }
  else if(e.key === "ArrowUp"){ e.preventDefault(); cursor = Math.max(cursor-1, 0); renderResults(); }
  else if(e.key === "Enter"){
    e.preventDefault();
    const pick = cursor >= 0 ? shown[cursor] : shown[0];
    if(pick){ dropEntry(pick.i); closeResults(); }
  } else if(e.key === "Escape") closeResults();
});
document.addEventListener("click", e => {
  if(!e.target.closest("#search-wrap")){
    const box = document.getElementById("results");
    if(box){ box.className = ""; box.innerHTML = ""; }
  }
});

/* ===================== readouts =====================
   The equation panel is a running log. Each product group's formation
   or half-equation is added the first time it appears, and every action
   (oxidation, bond broken, ...) is appended as it happens.
==================================================== */

let flashMsg = "";
let eqLog = [];                  // [{type, text}]
const loggedLive = new Set();    // gid + "|" + text

function flash(m){ flashMsg = m; renderEquations(); setTimeout(() => { flashMsg = ""; renderEquations(); }, 2600); }

function pushLog(type, text){
  const last = eqLog[eqLog.length - 1];
  // Same equation as the line before it: keep one line and let the newer,
  // more specific event name it. Ions snapping together log a Formation;
  // clicking condense then turns that same line into a Condensation.
  if(last && last.text === text){ last.type = type; return; }
  eqLog.push({type, text});
}

function renderEquations(){
  const panel = document.getElementById("eq-panel");
  if(!panel) return;
  if(lastReaction){
    pushLog(lastReaction.type, lastReaction.text);
    lastReaction = null;
  }
  if(flashMsg){
    panel.className = "";
    panel.innerHTML = `<div class="eq" style="font-size:13px;color:var(--text-danger);">${flashMsg}</div>`;
    return;
  }
  onSide("R").forEach(g => {
    if(g.pieces.length < 2) return;
    const half = halfEquation(g);
    const text = half || compoundEquation(g);
    if(!text) return;
    const key = g.gid + "|" + text;
    if(loggedLive.has(key)) return;
    loggedLive.add(key);
    pushLog(half ? "Half-equation" : "Formation", text);
  });
  if(!eqLog.length){
    panel.className = "";
    panel.innerHTML = `<span class="eq-empty">Change something on the products side and the equation shows up here.</span>`;
    return;
  }
  panel.className = "log";
  panel.innerHTML = eqLog.map(({type, text}, i) =>
    `<div class="eq" style="${i < eqLog.length - 1 ? "opacity:.7;" : ""}"><span class="eq-tag">${type}</span><span>${text}</span></div>`).join("");
  panel.scrollTop = panel.scrollHeight;
}

/* ===================== presets =====================
   Each preset lists reactants as [speciesKey | chain, col, row]. Keys
   use the stable form "Li", "H+1", "Cl-1", "CO3-2", "e". Chains are
   the same arrays used by the molecule library. Products are mirrored.

   The list walks the GCSE reaction types in teaching order. Every entry
   is placed so the ions that belong together already touch (a cation's
   sockets sit at col + 2), and so nothing reaches past column 8 — the
   left side is only 9 columns wide on the narrowest board.

   Water is the [H⁺][OH⁻] pair, not the H₂O molecule, wherever the
   reaction pulls it apart: that is the whole point of "metal + water"
   and of aqueous electrolysis. The condense tool puts it back together.
==================================================== */

const PRESETS = [
  // 2Na + 2H₂O → 2NaOH + H₂
  { name: "Metal + water (Na + H₂O)",
    place: [["Na",0,1], ["Na",0,4], ["H+1",3,1], ["OH-1",5,1], ["H+1",3,4], ["OH-1",5,4]] },

  // Mg + 2HCl → MgCl₂ + H₂
  { name: "Metal + acid (Mg + HCl)",
    place: [["Mg",0,2], ["H+1",3,1], ["Cl-1",5,1], ["H+1",3,4], ["Cl-1",5,4]] },

  // 2Mg + O₂ → 2MgO
  { name: "Metal + oxygen (Mg + O₂)",
    place: [["Mg",0,1], ["Mg",0,4], [["O",2,"O"],3,2]] },

  // 2Na + Cl₂ → 2NaCl
  { name: "Metal + halogen (Na + Cl₂)",
    place: [["Na",0,1], ["Na",0,4], [["Cl",1,"Cl"],3,2]] },

  // Zn + CuSO₄ → ZnSO₄ + Cu   (sulfate is a spectator)
  { name: "Metal displacement (Zn + CuSO₄)",
    place: [["Zn",0,4], ["Cu+2",0,1], ["SO4-2",2,1]] },

  // Cl₂ + 2KBr → 2KCl + Br₂   (potassium is a spectator)
  { name: "Halogen displacement (Cl₂ + KBr)",
    place: [[["Cl",1,"Cl"],0,3], ["K+1",4,1], ["Br-1",6,1], ["K+1",4,5], ["Br-1",6,5]] },

  // HCl + NaOH → NaCl + H₂O
  { name: "Acid + metal hydroxide (HCl + NaOH)",
    place: [["H+1",0,1], ["Cl-1",2,1], ["Na+1",0,4], ["OH-1",2,4]] },

  // H₂SO₄ + CuO → CuSO₄ + H₂O   (the copper sulfate prep)
  { name: "Acid + metal oxide (H₂SO₄ + CuO)",
    place: [["H+1",0,1], ["H+1",0,2], ["SO4-2",2,1], ["Cu+2",0,4], ["O-2",2,4]] },

  // CaCO₃ + 2HCl → CaCl₂ + H₂O + CO₂
  { name: "Acid + metal carbonate (HCl + CaCO₃)",
    place: [["Ca+2",0,1], ["CO3-2",2,1], ["H+1",4,1], ["Cl-1",6,1],
            ["H+1",4,4], ["Cl-1",6,4]] },

  // CaCO₃ → CaO + CO₂
  { name: "Thermal decomposition (CaCO₃)",
    place: [["Ca+2",0,1], ["CO3-2",2,1]] },

  // 2CuO + C → 2Cu + CO₂
  { name: "Metal oxide + carbon (CuO + C)",
    place: [["Cu+2",0,1], ["O-2",2,1], ["Cu+2",0,4], ["O-2",2,4], ["C",5,2]] },

  // PbBr₂ → Pb + Br₂
  { name: "Electrolysis, molten (PbBr₂)",
    place: [["Pb+2",0,1], ["Br-1",2,1], ["Br-1",2,2]] },

  // 2NaCl + 2H₂O → 2NaOH + H₂ + Cl₂   (brine; Na⁺ stays in solution)
  { name: "Electrolysis, aqueous (NaCl solution)",
    place: [["Na+1",0,1], ["Cl-1",2,1], ["Na+1",0,3], ["Cl-1",2,3],
            ["H+1",4,1], ["OH-1",6,1], ["H+1",4,3], ["OH-1",6,3]] },

  // CH₄ + 2O₂ → CO₂ + 2H₂O
  { name: "Combustion (CH₄ + O₂)",
    place: [["CH4",0,1], [["O",2,"O"],3,1], [["O",2,"O"],3,4]] }
];

function resetBoard(){
  groups = []; selection.clear(); hoverGid = null; lastReaction = null;
  eqLog = []; loggedLive.clear();
}

function loadPreset(preset){
  resetBoard();
  preset.place.forEach(([what, col, row]) => {
    if(Array.isArray(what)){ buildChainGroup(what, col, row, "L"); return; }
    const sp = speciesByKey(what);
    if(sp) groups.push(single(sp, col, row, "L"));
  });
  resetProducts();
}

const presetEl = document.getElementById("preset");
PRESETS.forEach((p, i) => {
  const o = document.createElement("option");
  o.value = String(i); o.textContent = p.name;
  presetEl.appendChild(o);
});
presetEl.addEventListener("change", () => {
  const p = PRESETS[parseInt(presetEl.value)];
  if(p) loadPreset(p);
  presetEl.value = "";
});

/* ===================== controls ===================== */

document.getElementById("clear-btn").addEventListener("click", () => { resetBoard(); render(); });

window.addEventListener("keydown", e => {
  if(document.getElementById("dlg").open) return;
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "d" && selection.size){
    e.preventDefault(); duplicateGroups([...selection]);
  }
  if(e.key === "Escape"){ selection.clear(); render(); }
  if((e.key === "Delete" || e.key === "Backspace") && selection.size &&
     document.activeElement === document.body){
    e.preventDefault();
    requestDelete([...selection]);
  }
});

/* ===================== responsive canvas ===================== */

function fitToWidth(){
  const stage = document.getElementById("stage");
  const avail = stage.clientWidth - PAD * 2;
  let cols = Math.floor(avail / CELL_W);
  if(cols % 2) cols--;                  // keep even so the midline is a cell boundary
  const oldMid = MID_CELL;
  COLS = Math.max(18, cols);
  BOARD_W = COLS * CELL_W + PAD * 2;
  MID_CELL = COLS / 2;
  return MID_CELL - oldMid;
}

document.getElementById("stage").style.height = (BOARD_H + 2) + "px";
fitToWidth();
render();

window.addEventListener("resize", () => {
  const shift = fitToWidth();
  groups.forEach(g => {
    if(g.side === "R") translateGroup(g, shift, 0);
    const b = groupBounds(g), [lo, hi] = rangeOf(g.side);
    if(b.maxC >= hi) translateGroup(g, hi - 1 - b.maxC, 0);
    if(b.minC < lo) translateGroup(g, lo - b.minC, 0);
  });
  render();
});
</script>
