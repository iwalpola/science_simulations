<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reaction Builder</title>
<style>
  :root {
    --surface-1: #eceae4;
    --surface-2: #e4e1d9;
    --border-strong: #b8b6ae;
    --text-primary: #1a1a19;
    --text-secondary: #55534c;
    --text-muted: #8a887f;
    --text-success: #1a7f4b;
    --text-danger: #c23b3b;
    --grid-line: rgba(26,26,25,0.05);
    --grid-line-major: rgba(26,26,25,0.10);
    --select: #3a6ff7;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #fff; color: var(--text-primary);
    margin: 0; padding: 20px 24px 40px;
  }
  h1 { font-size: 19px; font-weight: 600; margin: 0; }
  .sub { font-size: 13px; color: var(--text-secondary); margin: 4px 0 0; }
  button, input, select {
    font-family: inherit; font-size: 14px; padding: 6px 12px;
    border-radius: 8px; border: 1px solid var(--border-strong);
    background: #fff; color: var(--text-primary);
  }
  button, select { cursor: pointer; }
  button:hover { background: #f2f2f0; }
  button.primary { background: var(--text-primary); color: #fff; border-color: var(--text-primary); }
  button.primary:hover { background: #333; }

  .topbar { display: flex; align-items: flex-start; gap: 20px; flex-wrap: wrap; }
  #search-wrap { position: relative; flex: 1; min-width: 280px; max-width: 460px; }
  #search {
    width: 100%; padding: 9px 12px 9px 34px; font-size: 14.5px;
    border-radius: 10px; border: 1px solid var(--border-strong);
  }
  #search:focus { outline: 2px solid var(--select); outline-offset: -1px; border-color: transparent; }
  .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); pointer-events: none; opacity: .5; }
  #results {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 80;
    background: #fff; border: 1px solid var(--border-strong); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.13); max-height: 340px; overflow-y: auto;
    padding: 5px; display: none;
  }
  #results.on { display: block; }
  .res {
    display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 7px; cursor: pointer;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .res:hover, .res.cursor { background: #f0f0ee; }
  .res-name { font-size: 13px; color: var(--text-secondary); flex: 1; }
  .res-kind { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); }
  .res-empty { padding: 10px; font-size: 13px; color: var(--text-muted); }
  .chip-row { display: flex; gap: 0; align-items: center; }
  .lib-ghost {
    position: fixed; z-index: 100; pointer-events: none; transform: translate(-50%, -50%);
    opacity: .9; filter: drop-shadow(0 3px 6px rgba(0,0,0,.25));
  }

  #eq-panel {
    border: 1px solid var(--border-strong); border-radius: 10px; background: #fff;
    padding: 8px 14px; min-height: 44px; max-height: 96px; flex: 1; min-width: 260px;
    display: flex; flex-direction: column; gap: 4px; justify-content: center;
    overflow-y: auto; scroll-behavior: smooth;
  }
  #eq-panel.log { justify-content: flex-start; }
  .eq { font-size: 17px; font-weight: 500; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .eq-empty { font-size: 12.5px; color: var(--text-muted); font-weight: 400; }
  .eq-tag {
    font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted);
    border: 1px solid var(--border-strong); border-radius: 4px; padding: 1px 5px; font-weight: 600;
    white-space: nowrap;
  }

  #stage {
    margin-top: 16px; border: 1px solid var(--border-strong); border-radius: 12px;
    background: var(--surface-1); overflow: auto; position: relative;
  }
  #board {
    position: relative; touch-action: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .zone-label {
    position: absolute; top: 8px; font-size: 11px; font-weight: 600; letter-spacing: .1em;
    text-transform: uppercase; color: var(--text-muted); pointer-events: none; user-select: none;
  }
  .zone-hint {
    position: absolute; font-size: 13px; color: var(--text-muted); pointer-events: none;
    user-select: none; max-width: 260px; line-height: 1.4;
  }
  .divider { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--border-strong); opacity: .55; pointer-events: none; }
  #arrow-btn {
    position: absolute; width: 68px; height: 46px; padding: 0; border: none; background: none;
    border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text-secondary);
  }
  #arrow-btn span { font-size: 10px; color: var(--text-muted); margin-top: -2px; }
  #arrow-btn:hover { background: rgba(26,26,25,.07); }
  #arrow-btn:focus-visible { outline: 2px solid var(--select); }

  .grp { position: absolute; cursor: grab; }
  .grp.dragging { opacity: .65; z-index: 50; cursor: grabbing; }
  .grp.flying { pointer-events: none; z-index: 55; }
  @media (prefers-reduced-motion: no-preference) {
    .grp.flying { transition: transform .45s cubic-bezier(.5,0,.9,.4), opacity .45s ease-in; }
    .grp.pulse { animation: pulse .32s ease-out; }
    .grp.reacting { transition: transform .26s ease-in, opacity .26s ease-in; }
    .grp.popin { animation: popin .3s cubic-bezier(.2,.8,.4,1.2); }
  }
  @keyframes pulse { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
  @keyframes popin { 0% { transform: scale(.35); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .selring {
    position: absolute; inset: -3px; border: 2px solid var(--select);
    border-radius: 9px; pointer-events: none; display: none;
  }
  .grp.sel .selring { display: block; }
  .bond {
    position: absolute; height: 2.5px; border-radius: 2px;
    background: var(--text-primary); opacity: .85; pointer-events: none; z-index: 5;
  }
  #marquee {
    position: absolute; border: 1.5px solid var(--select);
    background: rgba(58,111,247,.10); pointer-events: none; display: none; z-index: 40;
  }
  #tools { position: absolute; display: none; z-index: 60; gap: 4px; flex-direction: column; }
  #tools.on { display: flex; }
  .act {
    width: 28px; height: 28px; border-radius: 50%; background: #fff;
    border: 1px solid var(--border-strong); box-shadow: 0 2px 6px rgba(0,0,0,.2);
    display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
  }
  .act:hover { background: #f4f4f2; transform: scale(1.08); }
  .act.danger:hover { background: #fdecec; border-color: var(--text-danger); }
  @media (prefers-reduced-motion: no-preference) { .act { transition: transform .1s; } }

  /* products readout */
  #status {
    display: none; flex-wrap: wrap; align-items: center; gap: 6px;
    margin-top: 10px; font-size: 12.5px;
  }
  #status.on { display: flex; }
  .st-lead { color: var(--text-secondary); margin-right: 4px; }
  .st {
    border: 1px solid var(--border-strong); border-radius: 6px; padding: 2px 8px;
    background: #fff; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .st.ok  { border-color: #9bd3b6; background: #eef8f2; color: var(--text-success); font-weight: 600; }
  .st.bad { border-color: #e9adad; background: #fdf1f1; color: var(--text-danger); }
  .st.tally { color: var(--text-secondary); }

  dialog {
    border: 1px solid var(--border-strong); border-radius: 12px; padding: 18px 20px;
    max-width: 400px; box-shadow: 0 12px 32px rgba(0,0,0,.18); color: var(--text-primary);
  }
  dialog::backdrop { background: rgba(26,26,25,.35); }
  .dlg-title { font-weight: 600; font-size: 15px; margin-bottom: 6px; }
  .dlg-msg { font-size: 13.5px; color: var(--text-secondary); margin: 0 0 14px; line-height: 1.45; }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; }

  .footer { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 10px; flex-wrap: wrap; }
  .hint { font-size: 12.5px; color: var(--text-muted); }
  kbd {
    font-family: inherit; font-size: 11px; background: var(--surface-2);
    border: 1px solid var(--border-strong); border-bottom-width: 2px;
    border-radius: 4px; padding: 0 4px;
  }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div style="display:flex;align-items:center;gap:10px;">
      <h1>Reaction Builder</h1>
      <a href="https://youtu.be/iN1Ocxdx40Y" style="font-size:11px;font-weight:600;color:#fff;background:#e62d0c;border-radius:5px;padding:3px 9px;text-decoration:none;white-space:nowrap;letter-spacing:0.02em;">▶︎ Tutorial Video</a>
    </div>
    <p class="sub">Add reactants on the left. A copy appears on the right, where you rearrange it into the products.</p>
  </div>
  <div id="search-wrap">
    <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1a1a19"
      stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
    <input id="search" type="text" autocomplete="off" spellcheck="false"
      placeholder="Search lithium, carbon dioxide, sulfuric acid, carbonate…" aria-label="Search for a species" />
    <div id="results" role="listbox"></div>
  </div>
  <div id="eq-panel"></div>
</div>

<div id="stage"><div id="board"></div></div>

<div id="status"></div>

<div class="footer">
  <span class="hint">
    Drag on empty space to select · <kbd>Shift</kbd>-click to add · tap or hover a piece for tools ·
    <kbd>Ctrl</kbd>+<kbd>D</kbd> duplicate a reactant · <kbd>Del</kbd> remove a reactant
  </span>
  <span style="display:flex;gap:8px;">
    <select id="preset" aria-label="Load a preset" style="font-size:13px;padding:4px 8px;">
      <option value="">Load a preset…</option>
    </select>
    <button id="clear-btn" style="font-size:13px;padding:4px 10px;">Clear board</button>
  </span>
</div>

<dialog id="dlg">
  <div class="dlg-title"></div>
  <p class="dlg-msg"></p>
  <div class="dlg-actions"></div>
</dialog>

<script>
"use strict";

/* =====================================================================
   REACTION BUILDER — guide for editing this file
   =====================================================================

   WHAT IT IS
   A single-file, static teaching tool. Students add reactants on the
   left of a grid; each one is mirrored to the right, where they turn it
   into products by breaking bonds and moving electrons. Everything is
   plain JS in this one <script>; no build step, no dependencies.

   FILE MAP (search for the "=====" banners)
     geometry / formatting / palette / valency   constants
     species          registry of atoms, ions, molecules; the search library
     board model      groups, sides, fitting, mirroring
     covalent bonds   bond order, valency, auto-pairing of diatomics
     ionic sockets    tab/blank sockets that snap ions and electrons together
     dialogs          modal popups (errors, confirmations)
     free electrons & animation   electron search + fly-in
     actions (products side)      split, ionise, strip, fuse, decompose
     actions (reactants side)     delete, duplicate
     formulas         turn a group into equation text
     products readout the status strip under the board
     rendering        render() rebuilds #board from state; showTools()
     interaction      Pointer Events: drag, tap, marquee
     search           library search box and drag-from-results
     readouts         the equation log
     presets          canned starting boards
     controls / responsive canvas

   DATA MODEL
     registry[spId] -> species {kind:"atom"|"ion"|"molecule"|"electron",
                       sym, formula, charge, comp:{El:count}, color, ...}
     groups[]       -> {gid, side:"L"|"R", pieces:[{pid, spId, col, row}],
                       bonds:[[pidA, pidB, order]]}
       A group is one rigid thing on the board: a lone tile, an ionic
       compound (pieces joined by sockets), or a molecule (pieces joined
       by covalent `bonds`). Everything else (selection, hoverGid, the
       log) is UI state. State is plain JSON; render() is a pure function
       of it, so any change is: mutate state -> resolveBonds() -> render().

   GRID
     Cells are CELL_W x UNIT px. Tiles are TILE_W (2) cells wide; ions are
     |charge| rows tall so each unit of charge has one socket row.
     Columns 0..MID_CELL-2 are the reactants side, MID_CELL-1 and
     MID_CELL are the arrow channel (never occupied), MID_CELL+1..COLS-1
     are the products side. rangeOf(side) gives [lo, hi).

   INVARIANTS (keep these true when you add features)
     1. A group never changes side. Every placement goes through
        groupFits / findFreeSlot / chainFits / placeCopy, which all take
        a side. Do not place pieces by hand-computed columns.
     2. Products are always a rearrangement of the reactants. Species
        enter only via dropEntry (left) and are mirrored by mirrorGroup;
        the products side never adds or deletes matter, only converts it
        (electrons appear only via oxidation and disappear only via
        reduction). Do not add delete/duplicate/add on the right.
     3. Reduction consumes real electrons: use needElectrons() (which
        shows the error dialog) and flyElectrons(es, target, commit),
        and do all state mutation inside commit.
     4. Any action must early-return while `animating` is true.
     5. lastReaction = {type, text} is the only way to write a line into
        the equation log; renderEquations() consumes it.
     6. After mutating groups, call resolveBonds() (merges touching
        sockets and pairs adjacent diatomic atoms) and then render().

   HOW TO EXTEND
     Add an element/ion ....... ELEMENTS table or the "other metals" table
     Add a polyatomic ion ..... the polyatomic ions table (needs comp)
     Add a linear molecule .... MOLECULES with a `chain` ["O",2,"C",2,"O"]
     Add a 2-D molecule ....... the "2D shapes" table (single tile); the
                                 scissors open it via moleculeAtoms
     Give an atom bond tabs ... BOND_TABS (ctab plugs into cblank); pair it
                                 with a CONDENSE entry or it plugs into
                                 something it can never become
     Add an acid / ion pair ... pairEntry(...)
     Add a decomposition ...... DECOMPOSE["SYM|charge"] = {label, products}
     Add a condensation ....... CONDENSE table (a neutral group -> molecule)
     Add a preset ............. PRESETS (keys like "Mg", "H+1", "CO3-2",
                                 or a chain array); products are mirrored
     Add a product-side tool .. write fn(gid) following stripAnion or
                                 reverseAtom, register it in showTools()
                                 (acts list + the act->fn map)
     Add a reactant-side tool . same, but the left branch of showTools()

   THINGS THAT LOOK ODD BUT ARE DELIBERATE
     - render() rebuilds the whole board with innerHTML; that is why
       the fly-in animates the *existing* DOM nodes first and only
       mutates state in commit().
     - Freed electrons are placed outside the ion's own sockets
       (see the `sockets` avoid-list in reverseAtom) so oxidation does
       not immediately undo itself.
     - Search results use touch-action:none so they can be dragged onto
       the board; the list is capped at 12 so it never needs scrolling.
     - Species ids come from a counter (nextId). For anything persisted
       (presets, future share links) use the stable keys accepted by
       speciesByKey(): "Li", "Li+1", "OH-1", "CO3-2", "e".
   ===================================================================== */

/* ===================== geometry ===================== */

const UNIT   = 44;
const CELL_W = 52;
const TILE_W = 2;
const ROWS   = 8;
let   COLS   = 30;          // recomputed by fitToWidth()
const PAD    = 14;
let   BOARD_W = COLS * CELL_W + PAD * 2;
const BOARD_H = ROWS * UNIT + PAD * 2;
const R_TAB  = 10.5;
const R_BOND = 7;           // covalent tabs: two a side, so smaller than R_TAB
let   MID_CELL = COLS / 2;

/* ===================== formatting ===================== */

const SUBS = {"0":"₀","1":"₁","2":"₂","3":"₃","4":"₄","5":"₅","6":"₆","7":"₇","8":"₈","9":"₉"};
const subDigits = n => String(n).split("").map(d => SUBS[d] || d).join("");
const toFormulaChars = s => [...s].map(c => /[0-9]/.test(c) ? SUBS[c] : c).join("");
const supCharge = (m, sign) => ({"1":"","2":"²","3":"³","4":"⁴"}[m] || "") + (sign > 0 ? "⁺" : "⁻");

/* ===================== palette ===================== */

const PAL = {
  alkali:   {bg:"#E8705F", text:"#4A1109"},
  alkaline: {bg:"#EF9F27", text:"#4E2B04"},
  metal:    {bg:"#B4B2A9", text:"#3A3A38"},
  nonmetal: {bg:"#5DCAA5", text:"#07463A"},
  halogen:  {bg:"#85B7EB", text:"#0A3A6B"},
  noble:    {bg:"#AFA9EC", text:"#332B80"},
  poly:     {bg:"#ED93B1", text:"#661F37"},
  hydrogen: {bg:"#F0997B", text:"#652410"},
  carbon:   {bg:"#97C459", text:"#22460A"},
  oxide:    {bg:"#7FC4C0", text:"#0C4340"}
};

/* ===================== valency =====================
   How many covalent bonds an atom of each element can hold, counting
   bond order. Used to stop a third H joining H2, and to work out whether
   O=C=O is complete. Elements not listed take no covalent bonds here.
==================================================== */

const VALENCY = { H:1, C:4, N:3, O:2, S:2, Cl:1, F:1, Br:1, I:1, P:3 };

/* ===================== species ===================== */

let uid = 0;
const nextId = p => p + (uid++);
const registry = {};
const reg = sp => { registry[sp.id] = sp; return sp; };

function defAtom(sym, name, pal, comp){
  return reg({ id: nextId("sp"), kind:"atom", sym, name, formula: toFormulaChars(sym),
    charge: 0, comp: comp || {[sym]:1}, color: PAL[pal], monatomic:true, poly:false });
}
function defIon(sym, name, charge, pal, comp, poly){
  return reg({ id: nextId("sp"), kind:"ion", sym, name, formula: toFormulaChars(sym),
    charge, comp: comp || {[sym]:1}, color: PAL[pal], poly: !!poly, monatomic: !poly });
}
// A molecule tile: used for species we render as ONE tile with subscripts (2D shapes).
function defMolecule(sym, name, pal, comp){
  return reg({ id: nextId("sp"), kind:"molecule", sym, name, formula: toFormulaChars(sym),
    charge: 0, comp, color: PAL[pal], monatomic:false, poly:false });
}

const ELECTRON = reg({ id:"e", kind:"electron", sym:"e", name:"electron", formula:"e",
  charge:-1, comp:{}, color:{bg:"#2f2f2e", text:"#ffffff"}, monatomic:false, poly:false });

const library = [];
const addEntry = e => { library.push(e); return e; };

/* --- elements 1-20 --- */

const ELEMENTS = [
  ["H","Hydrogen","hydrogen",[1]], ["He","Helium","noble",[]],
  ["Li","Lithium","alkali",[1]], ["Be","Beryllium","alkaline",[2]],
  ["B","Boron","nonmetal",[]], ["C","Carbon","carbon",[]],
  ["N","Nitrogen","nonmetal",[-3]], ["O","Oxygen","nonmetal",[-2]],
  ["F","Fluorine","halogen",[-1]], ["Ne","Neon","noble",[]],
  ["Na","Sodium","alkali",[1]], ["Mg","Magnesium","alkaline",[2]],
  ["Al","Aluminium","metal",[3]], ["Si","Silicon","nonmetal",[]],
  ["P","Phosphorus","nonmetal",[-3]], ["S","Sulfur","nonmetal",[-2]],
  ["Cl","Chlorine","halogen",[-1]], ["Ar","Argon","noble",[]],
  ["K","Potassium","alkali",[1]], ["Ca","Calcium","alkaline",[2]]
];

ELEMENTS.forEach(([sym, name, pal, charges]) => {
  const atom = defAtom(sym, name, pal);
  addEntry({ label: name, terms: [name, sym], kind: "atom", pieces: [{sp: atom}] });
  charges.forEach(ch => {
    const ion = defIon(sym, name, ch, pal);
    addEntry({ label: name + " ion (" + sym + supCharge(Math.abs(ch), ch) + ")",
      terms: [name, sym, name + " ion"], kind: "ion", pieces: [{sp: ion}] });
  });
});

/* --- other metals / halogens --- */

[["Zn","Zinc","metal",[2]], ["Fe","Iron","metal",[2,3]], ["Cu","Copper","metal",[2]],
 ["Pb","Lead","metal",[2,4]], ["Ag","Silver","metal",[1]], ["Sn","Tin","metal",[2,4]],
 ["Mn","Manganese","metal",[2]], ["Ni","Nickel","metal",[2]], ["Cr","Chromium","metal",[3]],
 ["Ba","Barium","alkaline",[2]], ["Sr","Strontium","alkaline",[2]],
 ["Br","Bromine","halogen",[-1]], ["I","Iodine","halogen",[-1]]
].forEach(([sym, name, pal, charges]) => {
  const atom = defAtom(sym, name, pal);
  addEntry({ label: name, terms: [name, sym], kind: "atom", pieces: [{sp: atom}] });
  charges.forEach(ch => {
    const ion = defIon(sym, name, ch, pal);
    addEntry({ label: name + " ion (" + sym + supCharge(Math.abs(ch), ch) + ")",
      terms: [name, sym, name + " ion", sym + Math.abs(ch)], kind: "ion", pieces: [{sp: ion}] });
  });
});

/* --- polyatomic ions --- */

const polyBySym = {};
[["OH","Hydroxide",-1,{O:1,H:1}], ["NO3","Nitrate",-1,{N:1,O:3}],
 ["NO2","Nitrite",-1,{N:1,O:2}], ["SO4","Sulfate",-2,{S:1,O:4}],
 ["SO3","Sulfite",-2,{S:1,O:3}], ["CO3","Carbonate",-2,{C:1,O:3}],
 ["HCO3","Hydrogencarbonate",-1,{H:1,C:1,O:3}], ["PO4","Phosphate",-3,{P:1,O:4}],
 ["NH4","Ammonium",1,{N:1,H:4}]
].forEach(([sym, name, ch, comp]) => {
  const ion = defIon(sym, name, ch, "poly", comp, true);
  polyBySym[sym] = ion;
  const alt = sym === "HCO3" ? ["bicarbonate"] : [];
  addEntry({ label: name + " (" + toFormulaChars(sym) + supCharge(Math.abs(ch), ch) + ")",
    terms: [name, sym, ...alt], kind: "ion", pieces: [{sp: ion}] });
});

const ionFor = (sym, charge) =>
  Object.values(registry).find(s => s.kind === "ion" && s.sym === sym && s.charge === charge);
const atomFor = sym =>
  Object.values(registry).find(s => s.kind === "atom" && s.sym === sym);

/* Stable species key -> species, used by presets: "Li", "Li+1", "CO3-2", "e" */
function speciesByKey(key){
  if(key === "e") return ELECTRON;
  const m = /^([A-Za-z0-9]+?)([+-])(\d)$/.exec(key);
  if(m) return ionFor(m[1], (m[2] === "+" ? 1 : -1) * parseInt(m[3]));
  return atomFor(key) || Object.values(registry).find(s => s.kind === "molecule" && s.sym === key);
}

/* --- covalent molecules -----------------------------------------------
   `chain` describes a linear molecule as atoms joined by bonds of a given
   order: ["O", 2, "C", 2, "O"] is O=C=O. Anything that would need a 2D
   layout (CH4, NH3) is defined as a single tile with subscripts instead.
--------------------------------------------------------------------- */

const MOLECULES = [
  // linear chains, drawn as separate atom tiles with bond dashes
  { label:"Carbon dioxide (CO₂)", terms:["carbon dioxide","co2","dioxide"],
    chain:["O",2,"C",2,"O"] },
  { label:"Carbon monoxide (CO)", terms:["carbon monoxide","co","monoxide"],
    chain:["C",3,"O"] },

/* --- diatomic elements set (for auto-pairing) --- */
const DIATOMIC = { H:1, O:2, N:3, Cl:1, F:1, Br:1, I:1 };   // sym -> bond order

/* --- acids & water as ion pairs --- */
