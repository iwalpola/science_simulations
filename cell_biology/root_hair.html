<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Root Hair Cell — 3D Absorption Simulation</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#06100a; height:100%; }
  canvas { display:block; }
  #info {
    position:absolute; top:16px; left:16px; color:#a8c4ae; font-family:'Courier New', monospace;
    font-size:12px; letter-spacing:0.5px; line-height:1.6; pointer-events:none; user-select:none;
    text-shadow:0 0 8px rgba(0,0,0,0.8);
  }
  #info b { color:#e4f4e6; }
  #hud {
    position:absolute; bottom:16px; left:16px; color:#546a58; font-family:'Courier New', monospace;
    font-size:11px; pointer-events:none; user-select:none;
  }

  /* ---- tuning panel ---- */
  #panel {
    position:absolute; top:16px; right:16px; width:268px; max-height:calc(100vh - 32px);
    overflow-y:auto; background:rgba(8,18,12,0.88); border:1px solid #1d3624; border-radius:6px;
    font-family:'Courier New', monospace; font-size:11px; color:#a8c4ae; padding:10px 12px 12px;
    backdrop-filter:blur(4px);
  }
  #panel h2 {
    margin:0 0 8px; font-size:11px; letter-spacing:1.5px; color:#e4f4e6; font-weight:bold;
    display:flex; justify-content:space-between; align-items:center; cursor:pointer;
  }
  #panel.collapsed .body { display:none; }
  #panel .grp {
    margin:12px 0 4px; color:#8fd694; letter-spacing:1px; border-bottom:1px solid #24402c; padding-bottom:3px;
  }
  #panel label { display:block; margin:7px 0 0; }
  #panel .row { display:flex; justify-content:space-between; }
  #panel .val { color:#e4f4e6; }
  #panel input[type=range] {
    width:100%; margin:2px 0 0; height:14px; accent-color:#7fc98a; background:transparent;

<body>
<div id="info"><b>ROOT HAIR CELL</b><br>hair projection / cytoplasm + mitochondria / permanent vacuole</div>
<div id="hud">drag to orbit · scroll to zoom · &#9664; &#9654; to step adaptations</div>

<div id="panel">
  <h2 id="panelHead"><span>PARAMETERS</span><span id="caret">[&ndash;]</span></h2>
  <div class="body" id="panelBody"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="adaptations.js"></script>
<script>
/* Fallback copy of the shared annotation library. adaptations.js is a sibling
   file in the repo; when this page is opened on its own (or that file is
   missing) the <script src> above fails silently and CellAdaptations would be
   undefined, so the page is kept self-sufficient. If adaptations.js DID load,
   its binding already exists and this block is skipped entirely. */
if (typeof CellAdaptations === 'undefined') {
window.CellAdaptations = (() => {
  function init(opts) {
    const { camera, items, heading = 'ADAPTATIONS' } = opts;
    const th = Object.assign({
      accent: '#f2b01e', text: '#b8c2ca', bright: '#eef3f6',
      bg: 'rgba(12,12,16,0.9)', border: '#2a2f38'
    }, opts.theme || {});

    const css = document.createElement('style');
    css.textContent = `
      #adapt {
        position:absolute; left:16px; top:84px; width:290px; max-height:calc(100vh - 130px);
        overflow-y:auto; box-sizing:border-box; background:${th.bg}; border:1px solid ${th.border};
        border-left:3px solid ${th.accent}; border-radius:6px; padding:12px 14px 12px;
        font-family:'Courier New', monospace; color:${th.text}; backdrop-filter:blur(4px);
        z-index:5;
      }
      #adapt .hd { display:flex; justify-content:space-between; font-size:10px; letter-spacing:1.5px; color:${th.accent}; }
      #adapt h3 { margin:8px 0 6px; font-size:14px; color:${th.bright}; letter-spacing:0.5px; line-height:1.3; }
      #adapt p { margin:0; font-size:12px; line-height:1.55; }
      #adapt p b { color:${th.bright}; font-weight:bold; }
      #adapt .ns { margin-top:6px; font-size:10px; font-style:italic; opacity:0.75; }
      #adapt .nav { display:flex; gap:6px; margin-top:12px; }
      #adapt button {
        flex:1; background:transparent; color:${th.bright}; border:1px solid ${th.border};
        border-radius:4px; font-family:inherit; font-size:12px; padding:6px 0; cursor:pointer;
      }
      #adapt button:hover { border-color:${th.accent}; color:${th.accent}; }
      #adapt .dots { display:flex; gap:5px; justify-content:center; margin-top:10px; }
      #adapt .dots span { width:7px; height:7px; border-radius:50%; background:${th.border}; cursor:pointer; }
      #adapt .dots span.on { background:${th.accent}; }
      #adaptSvg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:4; }
      #adaptSvg .pulse { transform-box:fill-box; transform-origin:center; animation:adaptPulse 1.6s ease-out infinite; }
      @keyframes adaptPulse { from { transform:scale(1); opacity:0.9; } to { transform:scale(3.2); opacity:0; } }
    `;
    document.head.appendChild(css);

    const box = document.createElement('div');
    box.id = 'adapt';
    box.innerHTML = `
      <div class="hd"><span>${heading}</span><span id="adaptCount"></span></div>
      <h3 id="adaptTitle"></h3>
      <p id="adaptText"></p>
      <div class="ns" id="adaptNote" hidden>not shown on this model</div>
      <div class="nav"><button id="adaptPrev">&#9664; previous</button><button id="adaptNext">next &#9654;</button></div>
      <div class="dots" id="adaptDots"></div>`;
    document.body.appendChild(box);
    ['mousedown', 'wheel', 'touchstart'].forEach(ev => box.addEventListener(ev, e => e.stopPropagation()));

    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.id = 'adaptSvg';
    svg.innerHTML = `
      <path id="adaptLine" fill="none" stroke="${th.accent}" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.85"/>
      <circle id="adaptRing" class="pulse" r="6" fill="none" stroke="${th.accent}" stroke-width="1.5"/>
      <circle id="adaptDot" r="4" fill="${th.accent}" stroke="#000" stroke-width="1"/>`;
    document.body.appendChild(svg);

    const $ = id => document.getElementById(id);
    const line = $('adaptLine'), ring = $('adaptRing'), dot = $('adaptDot');
    const dots = items.map((_, i) => {
      const d = document.createElement('span');
      d.title = items[i].title;
      d.addEventListener('click', () => show(i));
      $('adaptDots').appendChild(d);
      return d;
    });

    let idx = 0;
    function show(i) {
      idx = (i + items.length) % items.length;
      const it = items[idx];
      $('adaptCount').textContent = `${idx + 1} / ${items.length}`;
      $('adaptTitle').textContent = it.title;
      $('adaptText').innerHTML = it.text;
      $('adaptNote').hidden = !!it.anchor;
      dots.forEach((d, k) => d.classList.toggle('on', k === idx));
    }
    $('adaptPrev').addEventListener('click', () => show(idx - 1));
    $('adaptNext').addEventListener('click', () => show(idx + 1));
    window.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowLeft') show(idx - 1);
      if (e.key === 'ArrowRight') show(idx + 1);
    });
    show(0);

    // registered after the page's own render loop, so it reads this frame's matrices
    function track() {
      requestAnimationFrame(track);
      const it = items[idx];
      let p = null;
      try { p = it.anchor ? it.anchor() : null; } catch (err) { p = null; }
      let visible = false;
      if (p) {
        const v = p.clone().project(camera);
        if (v.z < 1 && v.z > -1) {
          const x = (v.x + 1) / 2 * window.innerWidth;
          const y = (1 - v.y) / 2 * window.innerHeight;
          const r = $('adaptTitle').getBoundingClientRect();
          const sx = box.getBoundingClientRect().right, sy = r.top + r.height / 2;
          line.setAttribute('d', `M${sx},${sy} H${sx + 22} L${x},${y}`);
          dot.setAttribute('cx', x); dot.setAttribute('cy', y);
          ring.setAttribute('cx', x); ring.setAttribute('cy', y);
          visible = true;
        }
      }
      svg.style.display = visible ? '' : 'none';
    }
    track();
  }
  return { init };
})();
}
</script>
<script>
/* ============================================================
   TUNABLE PARAMETERS — every slider writes here and rebuilds
   the cell. These values are the defaults.
   ============================================================ */
const P = {
  cellScale:        1.0,

  /* --- cell body (the boxy part sitting in the root epidermis) --- */
  bodyLength:       3.2,    // along X, toward the hair
  bodyHeight:       2.0,
  bodyDepth:        1.8,
  wallThickness:    0.10,   // cellulose wall drawn as an outer shell
  wallOpacity:      0.20,
  membraneOpacity:  0.30,

  /* --- contents --- */
  vacuoleFill:      0.66,   // fraction of the body the vacuole occupies
  vacuoleOpacity:   0.42,
  nucleusSize:      0.40,
  nucleusX:        -0.52,   // position along the body, -1 = far end, +1 = hair end
  mitoCount:        16,
  mitoSize:         0.125,
  mitoBias:         0.70,   // 0 = spread evenly, 1 = crowded at the hair base

  /* --- the root hair itself --- */
  hairLength:       7.5,    // this is the whole point of the cell
  hairRadius:       0.34,
  hairTaper:        0.55,   // tip radius / base radius
  hairWave:         0.38,   // how much the hair snakes between soil grains
  hairWaves:        1.5,
  hairSegments:     90,
  hairSides:        14,
  hairOpacity:      0.26,

  /* --- uptake --- */
  waterCount:       110,    // water entering by osmosis
  waterSpeed:       0.17,
  waterSize:        0.055,
  ionCount:         30,     // mineral ions entering by active transport
  ionSpeed:         0.095,
  ionSize:          0.080,
  soilCount:        70,     // soil water outside the hair, for context
  soilSpread:       1.9,
  soilDrift:        0.12
};

/* slider definitions: [key, label, min, max, step] — a 1-item row is a heading */
const CONTROLS = [
  ['CELL BODY'],
  ['bodyLength',      'length',              1.0,  6.0,  0.05],
  ['bodyHeight',      'height',              0.8,  4.0,  0.05],
  ['bodyDepth',       'depth',               0.8,  4.0,  0.05],
  ['wallThickness',   'wall thickness',      0.02, 0.40, 0.01],
  ['wallOpacity',     'wall opacity',        0.02, 1.00, 0.01],
  ['membraneOpacity', 'membrane opacity',    0.02, 1.00, 0.01],
  ['CONTENTS'],
  ['vacuoleFill',     'vacuole fill',        0.20, 0.92, 0.01],
  ['vacuoleOpacity',  'vacuole opacity',     0.05, 1.00, 0.01],
  ['nucleusSize',     'nucleus size',        0.10, 0.80, 0.01],
  ['nucleusX',        'nucleus position',   -0.90, 0.90, 0.01],
  ['mitoCount',       'mitochondria',        0,    60,   1   ],
  ['mitoSize',        'mitochondrion size',  0.04, 0.30, 0.005],
  ['mitoBias',        'crowding at hair',    0.00, 1.00, 0.01],
  ['ROOT HAIR'],
  ['hairLength',      'length',              1.0,  16.0, 0.1 ],
  ['hairRadius',      'base radius',         0.08, 1.00, 0.01],
  ['hairTaper',       'tip / base radius',   0.15, 1.00, 0.01],
  ['hairWave',        'waviness',            0.00, 1.20, 0.01],
  ['hairWaves',       'bends',               0.0,  5.0,  0.05],
  ['hairSegments',    'smoothness',          12,   200,  2   ],
  ['hairSides',       'tube sides',          5,    28,   1   ],
  ['hairOpacity',     'hair wall opacity',   0.03, 1.00, 0.01],
  ['UPTAKE'],
  ['waterCount',      'water particles',     0,    400,  5   ],
  ['waterSpeed',      'water speed',         0.00, 0.80, 0.005],
  ['waterSize',       'water size',          0.01, 0.20, 0.005],
  ['ionCount',        'mineral ions',        0,    150,  1   ],
  ['ionSpeed',        'ion speed',           0.00, 0.80, 0.005],
  ['ionSize',         'ion size',            0.01, 0.25, 0.005],
  ['soilCount',       'soil water',          0,    300,  5   ],
  ['soilSpread',      'soil spread',         0.5,  5.0,  0.05],
  ['soilDrift',       'soil drift',          0.00, 0.80, 0.01],
  ['VIEW'],
  ['cellScale',       'cell scale',          0.3,  2.5,  0.05]
];

/* ============================================================
   SCENE / CAMERA / RENDERER
   ============================================================ */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x06100a, 0.010);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 500);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ============================================================
   LIGHTING — soft, no blown-out highlights
   ============================================================ */
scene.add(new THREE.AmbientLight(0x4a5a4e, 0.60));
const key = new THREE.DirectionalLight(0xdff5e2, 0.70);
key.position.set(7, 9, 6);
scene.add(key);
const rim = new THREE.PointLight(0x44cc88, 0.45, 70);
rim.position.set(-9, -4, -7);
scene.add(rim);
const fill = new THREE.PointLight(0xbba05a, 0.22, 70);
fill.position.set(6, -6, 6);
scene.add(fill);

/* ============================================================
   MATERIALS
   Every membrane/wall uses depthWrite:false so the organelles
   inside are never hidden by the shell around them.
   ============================================================ */
const wallMat     = new THREE.MeshPhongMaterial({ color:0x9ad6a4, shininess:10, specular:0x2e4a34, transparent:true, opacity:0.20, side:THREE.DoubleSide, depthWrite:false });
const membraneMat = new THREE.MeshPhongMaterial({ color:0xd8e8a8, shininess:18, specular:0x4a5a35, transparent:true, opacity:0.30, side:THREE.DoubleSide, depthWrite:false });
const cytoMat     = new THREE.MeshPhongMaterial({ color:0x7fae86, shininess:6,  specular:0x233a28, transparent:true, opacity:0.22, side:THREE.DoubleSide, depthWrite:false });
const vacuoleMat  = new THREE.MeshPhongMaterial({ color:0x6fb7d8, shininess:26, specular:0x33566a, transparent:true, opacity:0.42, side:THREE.DoubleSide, depthWrite:false });
const nucleusMat  = new THREE.MeshPhongMaterial({ color:0xb98fd1, shininess:10, specular:0x33254a });
const mitoMat     = new THREE.MeshPhongMaterial({ color:0xe0714f, shininess:26, specular:0x66332a, emissive:0x3d1208, emissiveIntensity:0.40 });
const waterMat    = new THREE.MeshPhongMaterial({ color:0x63c8f0, shininess:40, specular:0x99e8ff, emissive:0x0d3a4c, emissiveIntensity:0.55 });
const ionMat      = new THREE.MeshPhongMaterial({ color:0xf2c141, shininess:40, specular:0xffe9a0, emissive:0x4a3505, emissiveIntensity:0.60 });
const soilMat     = new THREE.MeshPhongMaterial({ color:0x4e6f5c, shininess:8,  specular:0x223328, transparent:true, opacity:0.42, depthWrite:false });

/* small deterministic RNG so a rebuild puts the organelles back
   in the same places instead of reshuffling them every slider tick */
function rng(seed) {
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

/* ============================================================
   TAPERED TUBE — THREE.TubeGeometry has a constant radius, and
   the hair has to thin toward the tip, so the sweep is done by
   hand. The frame uses a fixed up-vector, which is safe here
   because the hair never turns far from the +X axis.
   ============================================================ */
function taperedTube(pointAt, radiusAt, segs, radial) {
  const pos = [], nor = [], idx = [];
  const up = new THREE.Vector3(0, 1, 0);
  const T = new THREE.Vector3(), N = new THREE.Vector3(), B = new THREE.Vector3();

  for (let i = 0; i <= segs; i++) {
    const u = i / segs;
    const p  = pointAt(u);
    const pB = pointAt(Math.min(u + 1e-3, 1));
    const pA = pointAt(Math.max(u - 1e-3, 0));
    T.subVectors(pB, pA).normalize();
    N.crossVectors(T, up).normalize();
    B.crossVectors(N, T).normalize();
    const r = radiusAt(u);

    for (let j = 0; j <= radial; j++) {
      const a = j / radial * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
      const nx = N.x * ca + B.x * sa, ny = N.y * ca + B.y * sa, nz = N.z * ca + B.z * sa;
      pos.push(p.x + nx * r, p.y + ny * r, p.z + nz * r);
      nor.push(nx, ny, nz);
    }
  }
  for (let i = 0; i < segs; i++) {
    for (let j = 0; j < radial; j++) {
      const a = i * (radial + 1) + j, b = a + radial + 1;
      idx.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal',   new THREE.Float32BufferAttribute(nor, 3));
  g.setIndex(idx);
  return g;
}

/* ============================================================
   ROOT HAIR CELL
   Local frame: the body is a box centred on the origin and the
   hair grows along +X out of its front face. Nothing moves
   except the particles, so the geometry is built once per
   rebuild and only the uptake is animated.
   ============================================================ */
class RootHairCell {
  constructor(state = {}) {
    this.group = new THREE.Group();
    this.group.scale.setScalar(P.cellScale);
    scene.add(this.group);

    this.t = state.t || 0;

    this._buildBody();
    this._buildHair();
    this._buildParticles();
  }

  dispose() {
    this.group.traverse(o => { if (o.geometry) o.geometry.dispose(); });
    scene.remove(this.group);
  }

  /* ---- the hair centreline, u = 0 at the cell wall, u = 1 at the tip ---- */
  hairPoint(u) {
    const ang = u * P.hairWaves * Math.PI * 2;
    return new THREE.Vector3(
      P.bodyLength / 2 + u * P.hairLength,
      P.hairWave * u * Math.sin(ang),
      P.hairWave * 0.65 * u * Math.cos(ang * 0.8)
    );
  }
  hairOuter(u) { return P.hairRadius * (1 - (1 - P.hairTaper) * u); }
  hairInner(u) { return Math.max(this.hairOuter(u) - P.wallThickness * 0.6, 0.02); }

  /* ---------------- body: wall, membrane, vacuole, nucleus, mitochondria ---------------- */
  _buildBody() {
    const L = P.bodyLength, H = P.bodyHeight, D = P.bodyDepth, w = P.wallThickness;

    // cellulose cell wall — the rigid outer box
    const wall = new THREE.Mesh(new THREE.BoxGeometry(L, H, D), wallMat);
    this.group.add(wall);
    this.wallMesh = wall;

    // plasma membrane — partially permeable, just inside the wall
    const mem = new THREE.Mesh(new THREE.BoxGeometry(L - w * 2, H - w * 2, D - w * 2), membraneMat);
    this.group.add(mem);

    // cytoplasm — a soft rounded volume filling the space the vacuole leaves
    const cytoGeo = new THREE.SphereGeometry(1, 22, 16);
    cytoGeo.scale((L - w * 2) * 0.49, (H - w * 2) * 0.49, (D - w * 2) * 0.49);
    this.group.add(new THREE.Mesh(cytoGeo, cytoMat));

    // large permanent vacuole — cell sap, pushed slightly away from the hair
    const f = P.vacuoleFill;
    const vacGeo = new THREE.SphereGeometry(1, 26, 18);
    vacGeo.scale(L * 0.5 * f, H * 0.5 * f, D * 0.5 * f);
    const vac = new THREE.Mesh(vacGeo, vacuoleMat);
    vac.position.set(-L * 0.06, 0, 0);
    this.group.add(vac);
    this.vacuole = vac;

    // nucleus
    const nucGeo = new THREE.SphereGeometry(P.nucleusSize, 20, 14);
    const nuc = new THREE.Mesh(nucGeo, nucleusMat);
    nuc.position.set(P.nucleusX * L * 0.5 * 0.8, H * 0.22, D * 0.14);
    this.group.add(nuc);
    this.nucleus = nuc;

    // mitochondria — biased toward the hair end, where the ion pumps are
    this.mitos = [];
    const r = rng(20240607);
    const n = Math.round(P.mitoCount);
    for (let i = 0; i < n; i++) {
      const g = new THREE.SphereGeometry(1, 10, 8);
      g.scale(P.mitoSize * 1.7, P.mitoSize, P.mitoSize);
      const m = new THREE.Mesh(g, mitoMat);
      // push x toward +1 (the hair base) as mitoBias rises
      const raw = r() * 2 - 1;
      const x = THREE.MathUtils.lerp(raw, 0.35 + 0.6 * r(), P.mitoBias);
      const ang = r() * Math.PI * 2;
      const rad = 0.62 + r() * 0.34;
      m.position.set(x * L * 0.42, Math.sin(ang) * rad * H * 0.40, Math.cos(ang) * rad * D * 0.40);
      m.rotation.set(r() * 3, r() * 3, r() * 3);
      this.group.add(m);
      this.mitos.push(m);
    }
  }

  /* ---------------- the hair: wall tube plus the cytoplasm-filled lumen ---------------- */
  _buildHair() {
    const segs = Math.round(P.hairSegments), sides = Math.round(P.hairSides);
    const pt = u => this.hairPoint(u);

    const outerMat = wallMat.clone();
    outerMat.opacity = P.hairOpacity;
    const outer = new THREE.Mesh(taperedTube(pt, u => this.hairOuter(u), segs, sides), outerMat);
    this.group.add(outer);

    const inner = new THREE.Mesh(taperedTube(pt, u => this.hairInner(u), segs, Math.max(5, sides - 2)), cytoMat);
    this.group.add(inner);

    // rounded tip so the hair does not end on an open ring
    const tip = new THREE.Mesh(new THREE.SphereGeometry(this.hairOuter(1), 14, 10), outerMat);
    tip.position.copy(this.hairPoint(1));
    this.group.add(tip);
  }

  /* ---------------- uptake particles ---------------- */
  _buildParticles() {
    const r = rng(991);

    // water and mineral ions travel the same route: in through the hair
    // surface, along the lumen, then out into the cell and the vacuole
    const makeStream = (count, size, mat, speed) => {
      const list = [];
      const geo = new THREE.SphereGeometry(size, 7, 6);
      for (let i = 0; i < count; i++) {
        const m = new THREE.Mesh(geo, mat);
        this.group.add(m);
        list.push({
          mesh: m,
          s:      r(),                       // progress 0 -> 1 along the route
          entry:  0.12 + r() * 0.88,         // where on the hair it crosses the membrane
          ang:    r() * Math.PI * 2,         // radial offset inside the lumen
          rad:    r() * 0.8,
          rate:   speed * (0.7 + r() * 0.6),
          target: new THREE.Vector3(
            (r() * 2 - 1) * P.bodyLength * 0.30,
            (r() * 2 - 1) * P.bodyHeight * 0.30,
            (r() * 2 - 1) * P.bodyDepth  * 0.30)
        });
      }
      return list;
    };

    this.water = makeStream(Math.round(P.waterCount), P.waterSize, waterMat, P.waterSpeed);
    this.ions  = makeStream(Math.round(P.ionCount),  P.ionSize,  ionMat,   P.ionSpeed);

    // free soil water sitting around the hair, drifting slowly
    this.soil = [];
    const sGeo = new THREE.SphereGeometry(P.waterSize * 0.85, 6, 5);
    for (let i = 0; i < Math.round(P.soilCount); i++) {
      const m = new THREE.Mesh(sGeo, soilMat);
      const u = r();
      const base = this.hairPoint(u);
      const ang = r() * Math.PI * 2;
      const rad = this.hairOuter(u) + 0.15 + r() * P.soilSpread;
      m.position.set(base.x + (r() * 2 - 1) * 0.6, base.y + Math.sin(ang) * rad, base.z + Math.cos(ang) * rad);
      this.group.add(m);
      this.soil.push({ mesh: m, home: m.position.clone(), ph: r() * Math.PI * 2, sp: 0.4 + r() * 1.2 });
    }
  }

  /* route a particle: along the hair lumen from its entry point to the
     base (0 -> 0.72 of the journey), then across into the cell interior */
  _route(p, out) {
    if (p.s < 0.72) {
      const u = p.entry * (1 - p.s / 0.72);
      const c = this.hairPoint(u);
      const rr = this.hairInner(u) * p.rad;
      out.set(c.x, c.y + Math.sin(p.ang) * rr, c.z + Math.cos(p.ang) * rr);
    } else {
      const k = (p.s - 0.72) / 0.28;
      const c = this.hairPoint(0);
      out.set(
        THREE.MathUtils.lerp(c.x, p.target.x, k),
        THREE.MathUtils.lerp(c.y, p.target.y, k),
        THREE.MathUtils.lerp(c.z, p.target.z, k)
      );
    }
  }

  update(dt, t) {
    this.t = t;
    const tmp = new THREE.Vector3();

    for (const list of [this.water, this.ions]) {
      for (const p of list) {
        p.s += dt * p.rate;
        if (p.s >= 1) { p.s -= 1; }
        this._route(p, tmp);
        p.mesh.position.copy(tmp);
      }
    }

    for (const s of this.soil) {
      const d = P.soilDrift;
      s.mesh.position.set(
        s.home.x + Math.sin(t * s.sp * 0.6 + s.ph) * d,
        s.home.y + Math.cos(t * s.sp * 0.5 + s.ph) * d,
        s.home.z + Math.sin(t * s.sp * 0.4 + s.ph * 1.7) * d
      );
    }
  }
}

/* ============================================================
   BUILD / REBUILD — a slider change rebuilds the cell but keeps
   the animation clock, so nothing jumps.
   ============================================================ */
let cell = null;

function build() {
  const state = cell ? { t: cell.t } : {};
  if (cell) cell.dispose();

  wallMat.opacity     = P.wallOpacity;
  membraneMat.opacity = P.membraneOpacity;
  vacuoleMat.opacity  = P.vacuoleOpacity;

  cell = new RootHairCell(state);
}

/* ============================================================
   CONTROL PANEL
   ============================================================ */
const panelBody = document.getElementById('panelBody');
const readouts = {};

for (const c of CONTROLS) {
  if (c.length === 1) {
    const h = document.createElement('div');
    h.className = 'grp';
    h.textContent = c[0];
    panelBody.appendChild(h);
    continue;
  }
  const [k, label, min, max, step] = c;
  const wrap = document.createElement('label');
  const row = document.createElement('div');
  row.className = 'row';
  const name = document.createElement('span');
  name.textContent = label;
  const val = document.createElement('span');
  val.className = 'val';
  val.textContent = P[k];
  row.appendChild(name); row.appendChild(val);

  const slider = document.createElement('input');
  slider.type = 'range';
  slider.min = min; slider.max = max; slider.step = step; slider.value = P[k];
  slider.addEventListener('input', () => {
    P[k] = parseFloat(slider.value);
    val.textContent = slider.value;
    build();
    dumpValues();
  });

  wrap.appendChild(row); wrap.appendChild(slider);
  panelBody.appendChild(wrap);
  readouts[k] = { slider, val };
}

const btns = document.createElement('div');
btns.className = 'btns';
const resetBtn = document.createElement('button');
resetBtn.textContent = 'reset';
const copyBtn = document.createElement('button');
copyBtn.textContent = 'copy values';
btns.appendChild(resetBtn); btns.appendChild(copyBtn);
panelBody.appendChild(btns);

const dump = document.createElement('textarea');
dump.id = 'dump';
dump.readOnly = true;
panelBody.appendChild(dump);

// only the values that differ from the defaults, so the paste-back stays short
const DEFAULTS = JSON.parse(JSON.stringify(P));
function dumpValues() {
  const changed = {};
  for (const k in P) if (P[k] !== DEFAULTS[k]) changed[k] = P[k];
  dump.value = Object.keys(changed).length
    ? JSON.stringify(changed, null, 1)
    : '(all defaults)';
}
dumpValues();

resetBtn.addEventListener('click', () => {
  Object.assign(P, DEFAULTS);
  for (const k in readouts) {
    readouts[k].slider.value = P[k];
    readouts[k].val.textContent = P[k];
  }
  build();
  dumpValues();
});

copyBtn.addEventListener('click', () => {
  dump.select();
  if (navigator.clipboard) navigator.clipboard.writeText(dump.value).catch(() => {});
  copyBtn.textContent = 'copied!';
  setTimeout(() => copyBtn.textContent = 'copy values', 900);
});

const panel = document.getElementById('panel');
document.getElementById('panelHead').addEventListener('click', () => {
  panel.classList.toggle('collapsed');
  document.getElementById('caret').textContent = panel.classList.contains('collapsed') ? '[+]' : '[\u2013]';
});
// keep the panel from driving the orbit controls
panel.addEventListener('mousedown', e => e.stopPropagation());
panel.addEventListener('wheel', e => e.stopPropagation());

build();

/* ============================================================
   CAMERA CONTROLS
   ============================================================ */
let isDragging = false, prevX = 0, prevY = 0;
let theta = 0.75, phiAngle = 1.20, camDist = 15;
let autoOrbit = true;
const camTarget = new THREE.Vector3();

function updateCamera() {
  // frame the whole cell, hair included, rather than just the body
  const mid = (P.bodyLength / 2 + P.hairLength * 0.45) * P.cellScale * 0.55;
  camTarget.set(mid, 0, 0);
  camera.position.set(
    camTarget.x + camDist * Math.sin(phiAngle) * Math.sin(theta),
    camTarget.y + camDist * Math.cos(phiAngle),
    camTarget.z + camDist * Math.sin(phiAngle) * Math.cos(theta)
  );
  camera.lookAt(camTarget);
}

renderer.domElement.addEventListener('mousedown', (e) => { isDragging = true; autoOrbit = false; prevX = e.clientX; prevY = e.clientY; });
window.addEventListener('mouseup', () => isDragging = false);
window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - prevX, dy = e.clientY - prevY;
  theta -= dx * 0.006;
  phiAngle = THREE.MathUtils.clamp(phiAngle - dy * 0.006, 0.2, Math.PI - 0.2);
  prevX = e.clientX; prevY = e.clientY;
});
renderer.domElement.addEventListener('wheel', (e) => {
  camDist = THREE.MathUtils.clamp(camDist + e.deltaY * 0.015, 3, 45);
});

let lastTouch = null;
renderer.domElement.addEventListener('touchstart', (e) => { lastTouch = e.touches[0]; autoOrbit = false; });
renderer.domElement.addEventListener('touchmove', (e) => {
  if (!lastTouch) return;
  const t = e.touches[0];
  const dx = t.clientX - lastTouch.clientX, dy = t.clientY - lastTouch.clientY;
  theta -= dx * 0.006;
  phiAngle = THREE.MathUtils.clamp(phiAngle - dy * 0.006, 0.2, Math.PI - 0.2);
  lastTouch = t;
}, { passive:true });
renderer.domElement.addEventListener('touchend', () => lastTouch = null);

/* ============================================================
   RENDER LOOP
   ============================================================ */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  cell.update(dt, t);

  if (autoOrbit) theta += 0.0012;
  updateCamera();

  renderer.render(scene, camera);
}
animate();

/* ============================================================
   ADAPTATIONS — anchors are built in the cell's local frame and
   carried into world space by its group
   ============================================================ */
const rootPoint = (x, y, z) => cell.group.localToWorld(new THREE.Vector3(x, y, z));
CellAdaptations.init({
  camera,
  heading: 'ROOT HAIR CELL ADAPTATIONS',
  theme: { accent:'#8fd694', text:'#a8c4ae', bright:'#e4f4e6', bg:'rgba(8,18,12,0.9)', border:'#2b4a34' },
  items: [
    {
      title: 'Long, narrow hair projection',
      text: 'The hair pushes out between the soil particles, giving the cell a <b>much larger surface area</b>. This means <b>more water and mineral ions can be absorbed</b> at the same time, so uptake is faster.',
      anchor: () => {
        const p = cell.hairPoint(0.55);
        return rootPoint(p.x, p.y + cell.hairOuter(0.55), p.z);
      }
    },
    {
      title: 'Water enters by osmosis',
      text: 'The soil solution is a <b>dilute solution</b> and the cell sap inside is <b>concentrated</b>. Water therefore moves down a <b>water potential gradient</b>, through the partially permeable membrane, <b>by osmosis</b>.',
      anchor: () => {
        const p = cell.hairPoint(0.8);
        return rootPoint(p.x, p.y, p.z);
      }
    },
    {
      title: 'Many mitochondria',
      text: 'Mitochondria carry out <b>aerobic respiration</b> to release the <b>energy (ATP)</b> needed for <b>active transport</b> &mdash; moving mineral ions into the cell <b>against</b> their concentration gradient.',
      anchor: () => {
        const m = cell.mitos[Math.floor(cell.mitos.length * 0.3)];
        return m ? cell.group.localToWorld(m.position.clone()) : null;
      }
    },
    {
      title: 'Large permanent vacuole',
      text: 'The vacuole is full of <b>cell sap</b>, a concentrated solution of sugars and salts. It helps keep the <b>concentration gradient</b> between the cell and the soil steep, so water keeps moving in.',
      anchor: () => rootPoint(cell.vacuole.position.x, cell.vacuole.position.y, cell.vacuole.position.z)
    },
    {
      title: 'Thin wall and membrane',
      text: 'The cellulose wall is <b>thin and freely permeable</b>, and the membrane just inside it is <b>partially permeable</b>. Together they give a <b>short diffusion distance</b> into the cytoplasm.',
      anchor: () => rootPoint(P.bodyLength * 0.5, P.bodyHeight * 0.5, 0)
    },
    {
      title: 'No chloroplasts',
      text: 'Roots are <b>underground in the dark</b>, so photosynthesis is impossible. The cell contains <b>no chloroplasts</b> &mdash; the space is used for cytoplasm and the vacuole instead.',
      anchor: () => rootPoint(-P.bodyLength * 0.25, -P.bodyHeight * 0.32, P.bodyDepth * 0.3)
    },
    {
      title: 'Nucleus',
      text: 'Unlike a xylem vessel, a root hair cell is <b>alive</b>. The nucleus holds the DNA and <b>controls the cell\u2019s activities</b>, including making the carrier proteins used in active transport.',
      anchor: () => cell.group.localToWorld(cell.nucleus.position.clone())
    }
  ]
});
</script>
</body>
</html>
