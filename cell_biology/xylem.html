<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Xylem Vessel — 3D Transpiration Stream Simulation</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#070c12; height:100%; }
  canvas { display:block; }
  #info {
    position:absolute; top:16px; left:16px; color:#9fb4c4; font-family:'Courier New', monospace;
    font-size:12px; letter-spacing:0.5px; line-height:1.6; pointer-events:none; user-select:none;
    text-shadow:0 0 8px rgba(0,0,0,0.8);
  }
  #info b { color:#e6f2fa; }
  #hud {
    position:absolute; bottom:16px; left:16px; color:#4e6070; font-family:'Courier New', monospace;
    font-size:11px; pointer-events:none; user-select:none;
  }

  /* ---- tuning panel ---- */
  #panel {
    position:absolute; top:16px; right:16px; width:268px; max-height:calc(100vh - 32px);
    overflow-y:auto; background:rgba(8,14,20,0.88); border:1px solid #1c2c3a; border-radius:6px;
    font-family:'Courier New', monospace; font-size:11px; color:#9fb4c4; padding:10px 12px 12px;
    backdrop-filter:blur(4px);
  }
  #panel h2 {
    margin:0 0 8px; font-size:11px; letter-spacing:1.5px; color:#e6f2fa; font-weight:bold;
    display:flex; justify-content:space-between; align-items:center; cursor:pointer;
  }
  #panel.collapsed .body { display:none; }
  #panel .grp {
    margin:12px 0 4px; color:#4fa8d8; letter-spacing:1px; border-bottom:1px solid #22384a; padding-bottom:3px;
  }
  #panel label { display:block; margin:7px 0 0; }
  #panel .row { display:flex; justify-content:space-between; }
  #panel .val { color:#e6f2fa; }
  #panel input[type=range] {
    width:100%; margin:2px 0 0; height:14px; accent-color:#4fa8d8; background:transparent;
  }
  #panel .btns { display:flex; gap:6px; margin-top:12px; }
  #panel button {
    flex:1; background:#13212c; color:#b3cadb; border:1px solid #263f52; border-radius:4px;
    font-family:inherit; font-size:11px; padding:5px 0; cursor:pointer;
  }
  #panel button:hover { background:#1a2d3b; color:#e6f2fa; }
  #dump {
    width:100%; box-sizing:border-box; margin-top:8px; height:96px; resize:vertical;
    background:#0a1219; color:#7fb8d8; border:1px solid #22384a; border-radius:4px;
    font-family:inherit; font-size:10px; padding:5px;
  }
</style>
</head>
<body>
<div id="info"><b>XYLEM VESSEL</b><br>lignified wall / hollow lumen / transpiration stream (root &rarr; leaf)</div>
<div id="hud">drag to orbit · scroll to zoom · &#9664; &#9654; to step adaptations</div>

<div id="panel">
  <h2 id="panelHead"><span>PARAMETERS</span><span id="caret">[&ndash;]</span></h2>
  <div class="body" id="panelBody"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="adaptations.js"></script>
<script>
/* Fallback copy of the shared annotation library. adaptations.js is a sibling
   file in the repo; when this page is opened on its own (or that file is
   missing) the <script src> above fails silently and CellAdaptations would be
   undefined, so the page is kept self-sufficient. If adaptations.js DID load,
   its binding already exists and this block is skipped entirely. */
if (typeof CellAdaptations === 'undefined') {
window.CellAdaptations = (() => {
  function init(opts) {
    const { camera, items, heading = 'ADAPTATIONS' } = opts;
    const th = Object.assign({
      accent: '#f2b01e', text: '#b8c2ca', bright: '#eef3f6',
      bg: 'rgba(12,12,16,0.9)', border: '#2a2f38'
    }, opts.theme || {});

    const css = document.createElement('style');
    css.textContent = `
      #adapt {
        position:absolute; left:16px; top:84px; width:290px; max-height:calc(100vh - 130px);
        overflow-y:auto; box-sizing:border-box; background:${th.bg}; border:1px solid ${th.border};
        border-left:3px solid ${th.accent}; border-radius:6px; padding:12px 14px 12px;
        font-family:'Courier New', monospace; color:${th.text}; backdrop-filter:blur(4px);
        z-index:5;
      }
      #adapt .hd { display:flex; justify-content:space-between; font-size:10px; letter-spacing:1.5px; color:${th.accent}; }
      #adapt h3 { margin:8px 0 6px; font-size:14px; color:${th.bright}; letter-spacing:0.5px; line-height:1.3; }
      #adapt p { margin:0; font-size:12px; line-height:1.55; }
      #adapt p b { color:${th.bright}; font-weight:bold; }
      #adapt .ns { margin-top:6px; font-size:10px; font-style:italic; opacity:0.75; }
      #adapt .nav { display:flex; gap:6px; margin-top:12px; }
      #adapt button {
        flex:1; background:transparent; color:${th.bright}; border:1px solid ${th.border};
        border-radius:4px; font-family:inherit; font-size:12px; padding:6px 0; cursor:pointer;
      }
      #adapt button:hover { border-color:${th.accent}; color:${th.accent}; }
      #adapt .dots { display:flex; gap:5px; justify-content:center; margin-top:10px; }
      #adapt .dots span { width:7px; height:7px; border-radius:50%; background:${th.border}; cursor:pointer; }
      #adapt .dots span.on { background:${th.accent}; }
      #adaptSvg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:4; }
      #adaptSvg .pulse { transform-box:fill-box; transform-origin:center; animation:adaptPulse 1.6s ease-out infinite; }
      @keyframes adaptPulse { from { transform:scale(1); opacity:0.9; } to { transform:scale(3.2); opacity:0; } }
    `;
    document.head.appendChild(css);

    const box = document.createElement('div');
    box.id = 'adapt';
    box.innerHTML = `
      <div class="hd"><span>${heading}</span><span id="adaptCount"></span></div>
      <h3 id="adaptTitle"></h3>
      <p id="adaptText"></p>
      <div class="ns" id="adaptNote" hidden>not shown on this model</div>
      <div class="nav"><button id="adaptPrev">&#9664; previous</button><button id="adaptNext">next &#9654;</button></div>
      <div class="dots" id="adaptDots"></div>`;
    document.body.appendChild(box);
    ['mousedown', 'wheel', 'touchstart'].forEach(ev => box.addEventListener(ev, e => e.stopPropagation()));

    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.id = 'adaptSvg';
    svg.innerHTML = `
      <path id="adaptLine" fill="none" stroke="${th.accent}" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.85"/>
      <circle id="adaptRing" class="pulse" r="6" fill="none" stroke="${th.accent}" stroke-width="1.5"/>
      <circle id="adaptDot" r="4" fill="${th.accent}" stroke="#000" stroke-width="1"/>`;
    document.body.appendChild(svg);

    const $ = id => document.getElementById(id);
    const line = $('adaptLine'), ring = $('adaptRing'), dot = $('adaptDot');
    const dots = items.map((_, i) => {
      const d = document.createElement('span');
      d.title = items[i].title;
      d.addEventListener('click', () => show(i));
      $('adaptDots').appendChild(d);
      return d;
    });

    let idx = 0;
    function show(i) {
      idx = (i + items.length) % items.length;
      const it = items[idx];
      $('adaptCount').textContent = `${idx + 1} / ${items.length}`;
      $('adaptTitle').textContent = it.title;
      $('adaptText').innerHTML = it.text;
      $('adaptNote').hidden = !!it.anchor;
      dots.forEach((d, k) => d.classList.toggle('on', k === idx));
    }
    $('adaptPrev').addEventListener('click', () => show(idx - 1));
    $('adaptNext').addEventListener('click', () => show(idx + 1));
    window.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowLeft') show(idx - 1);
      if (e.key === 'ArrowRight') show(idx + 1);
    });
    show(0);

    // registered after the page's own render loop, so it reads this frame's matrices
    function track() {
      requestAnimationFrame(track);
      const it = items[idx];
      let p = null;
      try { p = it.anchor ? it.anchor() : null; } catch (err) { p = null; }
      let visible = false;
      if (p) {
        const v = p.clone().project(camera);
        if (v.z < 1 && v.z > -1) {
          const x = (v.x + 1) / 2 * window.innerWidth;
          const y = (1 - v.y) / 2 * window.innerHeight;
          const r = $('adaptTitle').getBoundingClientRect();
          const sx = box.getBoundingClientRect().right, sy = r.top + r.height / 2;
          line.setAttribute('d', `M${sx},${sy} H${sx + 22} L${x},${y}`);
          dot.setAttribute('cx', x); dot.setAttribute('cy', y);
          ring.setAttribute('cx', x); ring.setAttribute('cy', y);
          visible = true;
        }
      }
      svg.style.display = visible ? '' : 'none';
    }
    track();
  }
  return { init };
})();
}
</script>
<script>
/* ============================================================
   TUNABLE PARAMETERS — every slider writes here and rebuilds
   the vessel. These values are the defaults.
   ============================================================ */
const P = {
  cellScale:        1.0,

  /* --- the vessel as a whole: a stack of dead vessel elements --- */
  elements:         4,      // how many cells fused end to end
  elementLength:    3.4,
  vesselRadius:     1.15,
  wallThickness:    0.20,
  wallOpacity:      0.26,
  innerOpacity:     0.18,

  /* --- lignin: the secondary thickening that stiffens the wall --- */
  spiralTurns:      2.6,    // turns of spiral thickening per element
  spiralRadius:     0.085,  // tube radius of the spiral cord
  spiralSides:      8,
  spiralSegments:   50,     // samples per element (raise if it looks faceted)
  ringsPerElement:  2,      // annular thickenings
  ringThickness:    0.075,
  endRingSize:      0.10,   // remnant rim where the end wall broke down

  /* --- pits: unlignified gaps for sideways movement --- */
  pitCount:         10,
  pitSize:          0.20,
  pitTube:          0.045,

  /* --- the water column --- */
  columnOpacity:    0.16,
  waterCount:       190,
  flowSpeed:        1.35,   // set to 0 to freeze the stream for inspection
  waterSize:        0.070,
  waterSpread:      0.88,   // how much of the lumen radius the stream fills
  wobble:           0.05,   // slight jitter so the column does not look rigid

  /* --- view --- */
  spin:             0.0     // slow turn of the vessel itself
};

/* slider definitions: [key, label, min, max, step] — a 1-item row is a heading */
const CONTROLS = [
  ['VESSEL'],
  ['elements',        'vessel elements',     1,    8,    1   ],
  ['elementLength',   'element length',      1.0,  8.0,  0.1 ],
  ['vesselRadius',    'radius',              0.3,  3.0,  0.05],
  ['wallThickness',   'wall thickness',      0.04, 0.80, 0.01],
  ['wallOpacity',     'wall opacity',        0.02, 1.00, 0.01],
  ['innerOpacity',    'inner face opacity',  0.00, 1.00, 0.01],
  ['LIGNIN'],
  ['spiralTurns',     'spiral turns / cell', 0.0,  10.0, 0.1 ],
  ['spiralRadius',    'spiral thickness',    0.01, 0.30, 0.005],
  ['spiralSides',     'spiral tube sides',   3,    16,   1   ],
  ['spiralSegments',  'spiral smoothness',   8,    200,  2   ],
  ['ringsPerElement', 'rings / cell',        0,    8,    1   ],
  ['ringThickness',   'ring thickness',      0.01, 0.30, 0.005],
  ['endRingSize',     'end-wall remnant',    0.00, 0.35, 0.005],
  ['PITS'],
  ['pitCount',        'pits',                0,    40,   1   ],
  ['pitSize',         'pit radius',          0.05, 0.60, 0.01],
  ['pitTube',         'pit rim thickness',   0.01, 0.15, 0.005],
  ['WATER'],
  ['columnOpacity',   'column opacity',      0.00, 1.00, 0.01],
  ['waterCount',      'water particles',     0,    600,  5   ],
  ['flowSpeed',       'flow speed',          0.00, 6.00, 0.05],
  ['waterSize',       'particle size',       0.01, 0.25, 0.005],
  ['waterSpread',     'column width',        0.10, 1.00, 0.01],
  ['wobble',          'wobble',              0.00, 0.40, 0.005],
  ['VIEW'],
  ['cellScale',       'scale',               0.3,  2.5,  0.05],
  ['spin',            'spin',                0.0,  2.0,  0.02]
];

/* ============================================================
   SCENE / CAMERA / RENDERER
   ============================================================ */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x070c12, 0.012);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 500);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ============================================================
   LIGHTING
   ============================================================ */
scene.add(new THREE.AmbientLight(0x46525e, 0.58));
const key = new THREE.DirectionalLight(0xdfeeff, 0.75);
key.position.set(6, 10, 7);
scene.add(key);
const rim = new THREE.PointLight(0x3f8fd8, 0.50, 70);
rim.position.set(-10, -2, -6);
scene.add(rim);
const fill = new THREE.PointLight(0xc08a4a, 0.22, 70);
fill.position.set(6, -7, 5);
scene.add(fill);

/* ============================================================
   MATERIALS
   ============================================================ */
const wallMat   = new THREE.MeshPhongMaterial({ color:0xb8c9d6, shininess:14, specular:0x40505e, transparent:true, opacity:0.26, side:THREE.DoubleSide, depthWrite:false });
const innerMat  = new THREE.MeshPhongMaterial({ color:0x8fa6b8, shininess:10, specular:0x33424e, transparent:true, opacity:0.18, side:THREE.DoubleSide, depthWrite:false });
const ligninMat = new THREE.MeshPhongMaterial({ color:0xc99a55, shininess:26, specular:0x6b4d24, emissive:0x3a2609, emissiveIntensity:0.32 });
const ringMat   = new THREE.MeshPhongMaterial({ color:0xdcae64, shininess:30, specular:0x7a5a2c, emissive:0x402a0a, emissiveIntensity:0.30 });
const endRingMat= new THREE.MeshPhongMaterial({ color:0x7fd8c0, shininess:28, specular:0x88ffee, emissive:0x0d4a3d, emissiveIntensity:0.45 });
const pitMat    = new THREE.MeshPhongMaterial({ color:0x5fd0e8, shininess:30, specular:0x99f0ff, emissive:0x0d3c48, emissiveIntensity:0.45 });
const columnMat = new THREE.MeshPhongMaterial({ color:0x4aa8e0, shininess:30, specular:0x88d8ff, transparent:true, opacity:0.16, side:THREE.DoubleSide, depthWrite:false });
const waterMat  = new THREE.MeshPhongMaterial({ color:0x63c8f0, shininess:45, specular:0xaaeeff, emissive:0x0d3a4c, emissiveIntensity:0.55 });

/* deterministic RNG so rebuilding does not reshuffle the pits */
function rng(seed) {
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

/* ============================================================
   XYLEM VESSEL
   Local frame: the vessel runs along +Y (up, toward the leaf).
   It is a stack of dead elements whose end walls have gone, so
   the lumen is one continuous pipe. Only the water moves.
   ============================================================ */
class XylemVessel {
  constructor(state = {}) {
    this.group = new THREE.Group();
    this.group.scale.setScalar(P.cellScale);
    scene.add(this.group);

    this.t = state.t || 0;
    this.yaw = state.yaw || 0;

    this.n = Math.max(1, Math.round(P.elements));
    this.total = this.n * P.elementLength;
    this.bottom = -this.total / 2;
    this.top = this.total / 2;
    this.lumen = Math.max(P.vesselRadius - P.wallThickness, 0.05);

    this._buildWall();
    this._buildLignin();
    this._buildPits();
    this._buildWater();
  }

  dispose() {
    this.group.traverse(o => { if (o.geometry) o.geometry.dispose(); });
    scene.remove(this.group);
  }

  /* ---------------- wall: open-ended outer and inner cylinders ---------------- */
  _buildWall() {
    const R = P.vesselRadius, r = this.lumen, L = this.total;

    // outer face of the thick lignified wall
    const outer = new THREE.Mesh(
      new THREE.CylinderGeometry(R, R, L, 40, 1, true), wallMat);
    this.group.add(outer);

    // inner face — the two together read as a wall with real thickness
    const inner = new THREE.Mesh(
      new THREE.CylinderGeometry(r, r, L, 36, 1, true), innerMat);
    this.group.add(inner);

    // thin annuli close the wall off at the very top and bottom of the model
    const capGeo = new THREE.RingGeometry(r, R, 40);
    for (const y of [this.bottom, this.top]) {
      const cap = new THREE.Mesh(capGeo.clone(), wallMat);
      cap.rotation.x = Math.PI / 2;
      cap.position.y = y;
      this.group.add(cap);
    }
  }

  /* ---------------- lignin: spiral cord, annular rings, end-wall remnants ---------------- */
  _buildLignin() {
    const R = P.vesselRadius, r = this.lumen;
    // the thickening sits on the inside face of the wall
    const lr = Math.max(r - P.spiralRadius * 0.4, 0.04);

    // spiral thickening — one continuous helix up the whole vessel
    if (P.spiralTurns > 0.01 && P.spiralRadius > 0.005) {
      const segs = Math.max(8, Math.round(P.spiralSegments) * this.n);
      const turns = P.spiralTurns * this.n;
      const pts = [];
      for (let i = 0; i <= segs; i++) {
        const t = i / segs;
        const a = t * turns * Math.PI * 2;
        pts.push(new THREE.Vector3(Math.cos(a) * lr, this.bottom + t * this.total, Math.sin(a) * lr));
      }
      const geo = new THREE.TubeGeometry(
        new THREE.CatmullRomCurve3(pts), segs, P.spiralRadius, Math.round(P.spiralSides), false);
      this.group.add(new THREE.Mesh(geo, ligninMat));
    }

    // annular thickenings — complete hoops of lignin
    this.rings = [];
    const rpe = Math.round(P.ringsPerElement);
    if (rpe > 0 && P.ringThickness > 0.005) {
      const ringGeo = new THREE.TorusGeometry(lr, P.ringThickness, 10, 40);
      for (let e = 0; e < this.n; e++) {
        for (let k = 0; k < rpe; k++) {
          const y = this.bottom + (e + (k + 1) / (rpe + 1)) * P.elementLength;
          const ring = new THREE.Mesh(ringGeo.clone(), ringMat);
          ring.rotation.x = Math.PI / 2;
          ring.position.y = y;
          this.group.add(ring);
          this.rings.push(ring);
        }
      }
    }

    // end-wall remnants — a rim marks each junction where the end wall
    // between two vessel elements has broken down and disappeared
    this.joints = [];
    if (this.n > 1 && P.endRingSize > 0.004) {
      const jGeo = new THREE.TorusGeometry(r, P.endRingSize, 10, 44);
      for (let e = 1; e < this.n; e++) {
        const y = this.bottom + e * P.elementLength;
        const j = new THREE.Mesh(jGeo.clone(), endRingMat);
        j.rotation.x = Math.PI / 2;
        j.position.y = y;
        this.group.add(j);
        this.joints.push(j);
      }
    }
    this.wallR = R;
  }

  /* ---------------- pits: unlignified gaps in the wall ---------------- */
  _buildPits() {
    this.pits = [];
    const n = Math.round(P.pitCount);
    if (n === 0 || P.pitSize < 0.01) return;

    const rnd = rng(4711);
    const geo = new THREE.TorusGeometry(P.pitSize, P.pitTube, 8, 20);
    const R = P.vesselRadius;

    for (let i = 0; i < n; i++) {
      const a = rnd() * Math.PI * 2;
      const y = this.bottom + (0.06 + rnd() * 0.88) * this.total;
      const pit = new THREE.Mesh(geo.clone(), pitMat);
      // rotating by 'a' about Y sends the torus axis (+Z) to (sin a, 0, cos a),
      // so the pit lies flat against the curved wall and faces outward
      pit.position.set(Math.sin(a) * R, y, Math.cos(a) * R);
      pit.rotation.y = a;
      this.group.add(pit);
      this.pits.push(pit);
    }
  }

  /* ---------------- the water column ---------------- */
  _buildWater() {
    // a faint continuous column: water in xylem is one unbroken thread
    if (P.columnOpacity > 0.004) {
      const col = new THREE.Mesh(
        new THREE.CylinderGeometry(this.lumen * 0.94, this.lumen * 0.94, this.total, 30, 1, true),
        columnMat);
      this.group.add(col);
    }

    this.water = [];
    const rnd = rng(1301);
    const geo = new THREE.SphereGeometry(P.waterSize, 7, 6);
    const count = Math.round(P.waterCount);
    for (let i = 0; i < count; i++) {
      const m = new THREE.Mesh(geo, waterMat);
      const a = rnd() * Math.PI * 2;
      const rad = Math.sqrt(rnd()) * this.lumen * P.waterSpread;   // even area fill
      const p = {
        mesh: m,
        ang: a,
        rad: rad,
        y: this.bottom + rnd() * this.total,
        rate: 0.82 + rnd() * 0.36,
        ph: rnd() * Math.PI * 2
      };
      this.group.add(m);
      this.water.push(p);
    }
  }

  update(dt, t) {
    this.t = t;

    for (const p of this.water) {
      // one-way flow: the transpiration stream only ever goes up
      p.y += dt * P.flowSpeed * p.rate;
      if (p.y > this.top) p.y = this.bottom + (p.y - this.top) % this.total;

      const w = P.wobble;
      const rad = p.rad + Math.sin(t * 1.7 + p.ph) * w;
      p.mesh.position.set(
        Math.cos(p.ang + Math.sin(t * 0.6 + p.ph) * w) * rad,
        p.y,
        Math.sin(p.ang + Math.sin(t * 0.6 + p.ph) * w) * rad
      );
    }

    this.yaw += dt * P.spin;
    this.group.rotation.y = this.yaw;
  }
}

/* ============================================================
   BUILD / REBUILD
   ============================================================ */
let cell = null;

function build() {
  const state = cell ? { t: cell.t, yaw: cell.yaw } : {};
  if (cell) cell.dispose();

  wallMat.opacity   = P.wallOpacity;
  innerMat.opacity  = P.innerOpacity;
  columnMat.opacity = P.columnOpacity;

  cell = new XylemVessel(state);
}

/* ============================================================
   CONTROL PANEL
   ============================================================ */
const panelBody = document.getElementById('panelBody');
const readouts = {};

for (const c of CONTROLS) {
  if (c.length === 1) {
    const h = document.createElement('div');
    h.className = 'grp';
    h.textContent = c[0];
    panelBody.appendChild(h);
    continue;
  }
  const [k, label, min, max, step] = c;
  const wrap = document.createElement('label');
  const row = document.createElement('div');
  row.className = 'row';
  const name = document.createElement('span');
  name.textContent = label;
  const val = document.createElement('span');
  val.className = 'val';
  val.textContent = P[k];
  row.appendChild(name); row.appendChild(val);

  const slider = document.createElement('input');
  slider.type = 'range';
  slider.min = min; slider.max = max; slider.step = step; slider.value = P[k];
  slider.addEventListener('input', () => {
    P[k] = parseFloat(slider.value);
    val.textContent = slider.value;
    build();
    dumpValues();
  });

  wrap.appendChild(row); wrap.appendChild(slider);
  panelBody.appendChild(wrap);
  readouts[k] = { slider, val };
}

const btns = document.createElement('div');
btns.className = 'btns';
const resetBtn = document.createElement('button');
resetBtn.textContent = 'reset';
const copyBtn = document.createElement('button');
copyBtn.textContent = 'copy values';
btns.appendChild(resetBtn); btns.appendChild(copyBtn);
panelBody.appendChild(btns);

const dump = document.createElement('textarea');
dump.id = 'dump';
dump.readOnly = true;
panelBody.appendChild(dump);

const DEFAULTS = JSON.parse(JSON.stringify(P));
function dumpValues() {
  const changed = {};
  for (const k in P) if (P[k] !== DEFAULTS[k]) changed[k] = P[k];
  dump.value = Object.keys(changed).length
    ? JSON.stringify(changed, null, 1)
    : '(all defaults)';
}
dumpValues();

resetBtn.addEventListener('click', () => {
  Object.assign(P, DEFAULTS);
  for (const k in readouts) {
    readouts[k].slider.value = P[k];
    readouts[k].val.textContent = P[k];
  }
  build();
  dumpValues();
});

copyBtn.addEventListener('click', () => {
  dump.select();
  if (navigator.clipboard) navigator.clipboard.writeText(dump.value).catch(() => {});
  copyBtn.textContent = 'copied!';
  setTimeout(() => copyBtn.textContent = 'copy values', 900);
});

const panel = document.getElementById('panel');
document.getElementById('panelHead').addEventListener('click', () => {
  panel.classList.toggle('collapsed');
  document.getElementById('caret').textContent = panel.classList.contains('collapsed') ? '[+]' : '[\u2013]';
});
panel.addEventListener('mousedown', e => e.stopPropagation());
panel.addEventListener('wheel', e => e.stopPropagation());

build();

/* ============================================================
   CAMERA CONTROLS
   ============================================================ */
let isDragging = false, prevX = 0, prevY = 0;
let theta = 0.6, phiAngle = 1.45, camDist = 20;
let autoOrbit = true;
const camTarget = new THREE.Vector3();

function updateCamera() {
  camTarget.set(0, 0, 0);
  camera.position.set(
    camTarget.x + camDist * Math.sin(phiAngle) * Math.sin(theta),
    camTarget.y + camDist * Math.cos(phiAngle),
    camTarget.z + camDist * Math.sin(phiAngle) * Math.cos(theta)
  );
  camera.lookAt(camTarget);
}

renderer.domElement.addEventListener('mousedown', (e) => { isDragging = true; autoOrbit = false; prevX = e.clientX; prevY = e.clientY; });
window.addEventListener('mouseup', () => isDragging = false);
window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - prevX, dy = e.clientY - prevY;
  theta -= dx * 0.006;
  phiAngle = THREE.MathUtils.clamp(phiAngle - dy * 0.006, 0.2, Math.PI - 0.2);
  prevX = e.clientX; prevY = e.clientY;
});
renderer.domElement.addEventListener('wheel', (e) => {
  camDist = THREE.MathUtils.clamp(camDist + e.deltaY * 0.015, 3, 60);
});

let lastTouch = null;
renderer.domElement.addEventListener('touchstart', (e) => { lastTouch = e.touches[0]; autoOrbit = false; });
renderer.domElement.addEventListener('touchmove', (e) => {
  if (!lastTouch) return;
  const t = e.touches[0];
  const dx = t.clientX - lastTouch.clientX, dy = t.clientY - lastTouch.clientY;
  theta -= dx * 0.006;
  phiAngle = THREE.MathUtils.clamp(phiAngle - dy * 0.006, 0.2, Math.PI - 0.2);
  lastTouch = t;
}, { passive:true });
renderer.domElement.addEventListener('touchend', () => lastTouch = null);

/* ============================================================
   RENDER LOOP
   ============================================================ */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  cell.update(dt, t);

  if (autoOrbit) theta += 0.0012;
  updateCamera();

  renderer.render(scene, camera);
}
animate();

/* ============================================================
   ADAPTATIONS
   ============================================================ */
const xyPoint = (x, y, z) => cell.group.localToWorld(new THREE.Vector3(x, y, z));
CellAdaptations.init({
  camera,
  heading: 'XYLEM ADAPTATIONS',
  theme: { accent:'#4fa8d8', text:'#9fb4c4', bright:'#e6f2fa', bg:'rgba(8,14,20,0.9)', border:'#263f52' },
  items: [
    {
      title: 'Dead, hollow cells',
      text: 'Xylem vessels are <b>dead</b>. There is <b>no cytoplasm, nucleus or organelles</b> left inside, so the lumen is completely hollow and water can move through <b>without obstruction</b>.',
      anchor: () => xyPoint(0, cell.total * 0.18, 0)
    },
    {
      title: 'No end walls',
      text: 'The end walls between neighbouring cells have <b>broken down</b>, joining the cells into <b>one continuous open tube</b> running from the roots to the leaves &mdash; like sections of drainpipe fitted together.',
      anchor: () => {
        const j = cell.joints[Math.floor(cell.joints.length / 2)];
        return j ? cell.group.localToWorld(j.position.clone()) : xyPoint(0, 0, 0);
      }
    },
    {
      title: 'Walls thickened with lignin',
      text: 'Lignin is laid down in <b>spirals and rings</b>. This makes the vessel <b>strong</b> so it does not <b>collapse inwards</b> under the low pressure created as water is pulled up, and it helps <b>support the plant</b>.',
      anchor: () => {
        const r = cell.rings[Math.floor(cell.rings.length / 2)];
        return r ? cell.group.localToWorld(new THREE.Vector3(cell.lumen, r.position.y, 0))
                 : xyPoint(cell.lumen, 0, 0);
      }
    },
    {
      title: 'Lignin is waterproof',
      text: 'As well as being strong, lignin is <b>impermeable to water</b>. Water cannot leak out sideways through the wall, so the <b>whole column is carried upward</b> to the leaves instead of being lost on the way.',
      anchor: () => xyPoint(P.vesselRadius, -cell.total * 0.22, 0)
    },
    {
      title: 'Pits in the wall',
      text: 'Small unlignified <b>pits</b> are left in the wall. These let water move <b>sideways out of the vessel</b> into neighbouring cells, for example into the mesophyll cells once it reaches the leaf.',
      anchor: () => {
        const p = cell.pits[0];
        return p ? cell.group.localToWorld(p.position.clone()) : null;
      }
    },
    {
      title: 'Narrow tube',
      text: 'The vessel is <b>very narrow</b>. Water molecules are <b>cohesive</b> (they stick to each other) and <b>adhesive</b> to the walls, so in a narrow tube the column stays <b>unbroken</b> as it is pulled up.',
      anchor: () => xyPoint(0, -cell.total * 0.40, 0)
    },
    {
      title: 'One-way transpiration stream',
      text: 'Water evaporating from the leaves creates a <b>pull (tension)</b> that drags the column up. Flow in xylem is always <b>upward only</b> &mdash; unlike phloem, it never reverses.',
      anchor: () => xyPoint(0, cell.total * 0.44, 0)
    }
  ]
});
</script>
