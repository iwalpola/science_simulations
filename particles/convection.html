<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convection — the 3D story</title>
<style>
  :root{
    --ink:#eef2f7;
    --dim:#93a2b6;
    --panel:rgba(10,14,21,.78);
    --line:rgba(147,162,182,.22);
    --side:360px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:#080b11;color:var(--ink);overflow:hidden;
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}

  #stage{position:fixed;top:0;right:0;bottom:0;left:var(--side);}
  canvas{display:block;}
  #fade{position:fixed;top:0;right:0;bottom:0;left:var(--side);background:#080b11;
    opacity:0;pointer-events:none;z-index:2;}

  #side{
    position:fixed;top:0;left:0;bottom:0;width:var(--side);
    background:var(--panel);backdrop-filter:blur(16px);
    border-right:1px solid var(--line);
    padding:20px 22px 16px;
    display:flex;flex-direction:column;gap:14px;
    overflow-y:auto;
  }
  #side h1{
    margin:0;
    font-family:"Iowan Old Style","Charter","Palatino Linotype",Georgia,serif;
    font-weight:600;font-size:19px;letter-spacing:.2px;line-height:1.25;
  }
  #side .byline{margin:4px 0 0;font-size:12px;line-height:1.5;color:var(--dim);}
  #side a{color:var(--dim);text-decoration:none;font-size:12px;
    border-bottom:1px solid rgba(147,162,182,.3);}
  #side a:hover{color:var(--ink);}
  .links{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;}

  .story{flex:1;min-height:0;}
  .story .step{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;}
  .story h2{
    margin:3px 0 0;font-family:"Iowan Old Style","Charter",Georgia,serif;
    font-size:17px;font-weight:600;letter-spacing:.2px;
  }
  .story p{margin:8px 0 0;font-size:13.5px;line-height:1.62;color:#cbd5e1;}
  .story p b{color:#ffd9a0;font-weight:600;}
  .story .look{
    margin-top:10px;font-size:12.5px;line-height:1.5;color:#a9c7ee;
    border-left:2px solid rgba(127,176,255,.45);padding-left:10px;
  }
  .story .scale{
    margin-top:10px;font-size:12px;line-height:1.5;color:#c9b8e0;
    border-left:2px solid rgba(190,150,240,.45);padding-left:10px;
  }
  .terms{
    margin:12px 0 0;padding:10px 12px;
    background:rgba(255,217,160,.05);border:1px solid rgba(255,217,160,.18);border-radius:10px;
  }
  .terms .hd{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#d9b98a;font-weight:700;margin-bottom:6px;}
  .terms dt{font-size:12.5px;font-weight:700;color:#ffd9a0;}
  .terms dd{margin:1px 0 7px;font-size:12.5px;line-height:1.5;color:#cbd5e1;}
  .terms dd:last-child{margin-bottom:0;}

  .nav{
    position:fixed;left:var(--side);right:0;bottom:20px;z-index:5;
    margin:0 auto;width:fit-content;max-width:calc(100% - var(--side) - 32px);
    display:flex;align-items:center;gap:8px;flex-wrap:nowrap;justify-content:center;
    background:var(--panel);backdrop-filter:blur(16px);
    border:1px solid var(--line);border-radius:999px;
    padding:9px 12px;white-space:nowrap;
  }
  .nav button{
    font:inherit;font-size:12.5px;font-weight:500;color:var(--dim);
    background:rgba(255,255,255,.05);border:1px solid var(--line);
    border-radius:999px;padding:7px 14px;cursor:pointer;
    transition:background .15s ease,color .15s ease,opacity .15s ease;
  }
  .nav button:hover:not(:disabled){background:rgba(255,255,255,.12);color:var(--ink);}
  .nav button:disabled{opacity:.32;cursor:default;}
  .nav button.primary{background:rgba(127,176,255,.2);color:#dce9ff;border-color:rgba(127,176,255,.35);}
  .dots{display:flex;gap:6px;padding:0 4px;}
  .dots i{
    width:7px;height:7px;border-radius:50%;background:rgba(147,162,182,.3);
    cursor:pointer;transition:background .2s ease,transform .2s ease;
  }
  .dots i.on{background:var(--ink);transform:scale(1.25);}

  #key{
    position:fixed;top:18px;right:20px;z-index:5;
    background:var(--panel);backdrop-filter:blur(16px);
    border:1px solid var(--line);border-radius:12px;
    padding:11px 14px;
    font-size:11.5px;line-height:1.75;color:var(--dim);
  }

  .dot{width:11px;height:11px;border-radius:50%;flex:none;
    box-shadow:inset -2px -2px 3px rgba(0,0,0,.45);}
  .sq{width:11px;height:11px;border-radius:2px;flex:none;}
  .grad{width:22px;height:5px;border-radius:3px;flex:none;
    background:linear-gradient(90deg,#ff5a3c,#4f8fff);}

  .hint{
    position:fixed;right:20px;bottom:20px;z-index:3;
    font-size:11px;color:#5a687d;pointer-events:none;
  }

  @media (max-width:860px){
    :root{--side:0px;}
    #stage,#fade{left:0;bottom:44vh;}
    #side{
      top:auto;left:0;right:0;bottom:0;width:auto;height:44vh;
      border-right:none;border-top:1px solid var(--line);
      padding:14px 16px;gap:11px;
    }
    #side h1{font-size:16px;}
    #side .byline{display:none;}
    .nav{
      left:0;right:0;bottom:44vh;
      width:auto;max-width:none;margin:0;
      border-radius:0;border-width:1px 0 0;
      flex-wrap:wrap;white-space:normal;justify-content:center;
    }
    #key{top:14px;right:14px;padding:8px 10px;font-size:11px;line-height:1.6;}
    .hint{display:none;}
  }
</style>

<body>

<div id="stage"></div>
<div id="fade"></div>

<div id="side">
  <div>
    <h1>Convection</h1>

<!-- outside #side: its backdrop-filter would otherwise pin fixed children to the column -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===========================================================================
   CONVECTION — the 3D story

   A glass pan of cold water on a gas ring, a crystal of potassium
   permanganate on the bottom over the flame, and five chapters:

     0  the hob          — the flame lights; only the water over it warms
     1  zoom in          — 125 particles heat up, speed up and spread out:
                           same mass, bigger volume, density decreases
     2  hot beside cold  — two boxes the same size; the hot one holds fewer
                           particles, so it is less dense, so it rises
     3  back to the pan  — the dye leaves the crystal and goes up the middle
     4  the current      — curved arrows draw themselves round the loop

   TWO WORLDS. The pan is at the origin; the particles are parked at
   MICRO_Y. The camera teleports between them behind a fade.

   EVERYTHING IS A PURE FUNCTION OF THE CHAPTER'S OWN CLOCK t. frame(t) can be
   called with any t in any order and draws the same picture, so Replay and
   scrubbing are exact.

   THE FLOW. The water moves on the streamlines of one closed-form stream
   function, psi = sin(pi r/R) sin(pi y/H): up the middle, out along the top,
   down the wall, back along the bottom. Following a streamline needs
   integrating, so it is done ONCE, at build, for a set of levels
   (traceLoop), and what is left behind is a lookup: a dye puff is a level, a
   starting phase and an age.

   THE NUMBERS. The two densities are real water at 20 °C and 80 °C, out of
   WATER. Real water only expands a few percent over that range, far too
   little to see, so the spreading is exaggerated EXAG times — and the page
   says so. Every figure the particles and the captions use comes out of
   those three constants: how much the parcel grows, and how many particles
   fit in the hot box.
=========================================================================== */

/* ------------------------------------------------------------ the numbers */
const WATER = {
  cold:{T:20, rho:998.2},     // kg/m³, data book
  hot :{T:80, rho:971.8}
};
const EXAG = 20;                                            // how much the spreading is exaggerated
const REAL_EXPANSION = WATER.cold.rho/WATER.hot.rho - 1;    // extra volume, as a fraction
const VOL_RATIO = 1 + EXAG*REAL_EXPANSION;                  // what the picture shows
const KH = Math.cbrt(VOL_RATIO);                            // the gaps grow by this much
const NC = 125;                                             // particles in a box of cold water
const NH = Math.round(NC/VOL_RATIO);                        // ...and in the same box of hot water

const pct = x => (x*100).toFixed(1) + '%';

/* ----------------------------------------------------------------- helpers */
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const lerp  = (a,b,u) => a + (b-a)*u;
const ss = (a,b,x) => { const u = clamp((x-a)/(b-a),0,1); return u*u*(3-2*u); };
const hexCss = n => '#'+n.toString(16).padStart(6,'0');

/* the integral of ss(a,b,t) from -infinity to t, so that anything whose RATE
   ramps up smoothly still has a closed-form position */
function ssInt(a, b, t){
  if(t <= a) return 0;
  const w = b - a, x = (t - a)/w;
  return x < 1 ? w*(x*x*x - x*x*x*x/2) : w*0.5 + (t - b);
}

function rng(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash(i){
  let x = Math.imul(i|0, 0x9E3779B1);
  x ^= x >>> 16; x = Math.imul(x, 0x85EBCA6B);
  x ^= x >>> 13; x = Math.imul(x, 0xC2B2AE35);
  x ^= x >>> 16;
  return (x >>> 0)/4294967296;
}

/* =========================================================================
   THE FLOW  (no three.js in here, so the tests can run it)
========================================================================= */
const POT = {R:1.55, yb:0.53, H:1.3};          // inside of the pan: radius, floor, water depth
const FLOW = {R:POT.R - 0.05, H:POT.H - 0.04}; // the region the water circulates in

function flowPsi(r, y){ return Math.sin(Math.PI*r/FLOW.R)*Math.sin(Math.PI*y/FLOW.H); }
/* velocity in the (r, y) half-plane: u_r = -dpsi/dy, u_y = dpsi/dr */
function flowVel(r, y){
  const kr = Math.PI/FLOW.R, ky = Math.PI/FLOW.H;
  return [-ky*Math.sin(kr*r)*Math.cos(ky*y), kr*Math.cos(kr*r)*Math.sin(ky*y)];
}

/* Follow the streamline psi = c once round, and resample it evenly in time.
   Starts at the bottom of the loop (mid radius, below mid height) and stops
   when the angle round the loop's centre has turned a full circle. */
const LOOP_N = 256;
function traceLoop(c){
  const cr = FLOW.R/2, cy = FLOW.H/2;
  let r = cr, y = FLOW.H/Math.PI*Math.asin(c);
  const dt = 0.002;
  const rs = [r], ys = [y];
  let prev = Math.atan2(y-cy, r-cr), turned = 0, before = 0, steps = 0;
  while(turned > -2*Math.PI && steps < 200000){
    before = turned;
    const k1 = flowVel(r, y);
    const k2 = flowVel(r + k1[0]*dt/2, y + k1[1]*dt/2);
    const k3 = flowVel(r + k2[0]*dt/2, y + k2[1]*dt/2);
    const k4 = flowVel(r + k3[0]*dt, y + k3[1]*dt);
    r += dt*(k1[0] + 2*k2[0] + 2*k3[0] + k4[0])/6;
    y += dt*(k1[1] + 2*k2[1] + 2*k3[1] + k4[1])/6;
    const a = Math.atan2(y-cy, r-cr);
    let da = a - prev;
    if(da >  Math.PI) da -= 2*Math.PI;
    if(da < -Math.PI) da += 2*Math.PI;
    turned += da; prev = a;
    rs.push(r); ys.push(y); steps++;
  }
  /* the last step overshoots the full turn; find where in it the loop closed */
  const span = (steps - 1) + (-2*Math.PI - before)/(turned - before);
  const T = span*dt;
  const R = new Float32Array(LOOP_N), Y = new Float32Array(LOOP_N);
  for(let i=0;i<LOOP_N;i++){
    const f = i/LOOP_N*span, j = Math.floor(f), u = f - j;
    const j1 = Math.min(j+1, steps);
    R[i] = lerp(rs[j], rs[j1], u); Y[i] = lerp(ys[j], ys[j1], u);
  }
  return {c, T, r:R, y:Y};
}

function loopAt(L, phase, out){
  const f = (phase - Math.floor(phase))*LOOP_N;
  const i = Math.floor(f), u = f - i, j = (i+1) % LOOP_N;
  out[0] = lerp(L.r[i], L.r[j], u);
  out[1] = lerp(L.y[i], L.y[j], u);
  return out;
}

/* The dye travels on a spread of levels. Small c hugs the walls and the
   surface; larger c cuts the corners. Each puff starts at the point on its
   loop nearest the crystal. */
const DYE_LEVELS = 24;
const CRYSTAL = {r:0.05, y:0.05};
const LOOPS = [];
for(let i=0;i<DYE_LEVELS;i++){
  const c = 0.02 + 0.43*Math.pow(i/(DYE_LEVELS-1), 1.6);
  const L = traceLoop(c);
  let best = 0, bd = Infinity;
  for(let k=0;k<LOOP_N;k++){
    const d = Math.hypot(L.r[k]-CRYSTAL.r, L.y[k]-CRYSTAL.y);
    if(d < bd){ bd = d; best = k; }
  }
  L.src = best/LOOP_N;
  LOOPS.push(L);
}

/* one full-strength second of flow carries the middle level this far round */
const LOOP_SECONDS = 11;
const FLOW_RATE = LOOPS[DYE_LEVELS>>1].T/LOOP_SECONDS;

/* the dye */
const EMIT_DT = 0.035, DYE_LIFE = 24;
const DYE_MAX = Math.ceil(DYE_LIFE/EMIT_DT) + 1;

/* seconds of full-strength flow that have happened by dye time tau */
function flowSeconds(cfg, tau){ return ssInt(cfg.flow, cfg.flow + cfg.ramp, tau); }

/* Where puff k is at dye time tau, in the (r, y) half-plane plus an angle
   round the pan. Returns false if it has not been released or has faded. */
function puffAt(cfg, k, tau, out){
  const te = cfg.emit + k*EMIT_DT;
  const age = tau - te;
  if(age < 0 || age > DYE_LIFE) return false;
  const h1 = hash(k*5+1), h2 = hash(k*5+2), h3 = hash(k*5+3), h4 = hash(k*5+4);
  const L = LOOPS[Math.min(DYE_LEVELS-1, Math.floor(h1*h1*DYE_LEVELS))];
  const adv = (flowSeconds(cfg, tau) - flowSeconds(cfg, te))*FLOW_RATE/L.T;  // loops travelled
  loopAt(L, L.src + adv, out);
  /* leaving the crystal: slide from it onto the streamline over the first
     part of the journey, so nothing appears out of nowhere */
  const b = ss(0, 0.12, adv);
  let r = lerp(CRYSTAL.r, out[0], b), y = lerp(CRYSTAL.y, out[1], b);
  /* it spreads as it goes — a random walk whose size grows as sqrt(age) */
  const sig = 0.03 + 0.055*Math.sqrt(age);
  r += sig*(h2*2-1);
  y += sig*(h3*2-1)*0.7;
  out[0] = clamp(Math.abs(r), 0, FLOW.R);
  out[1] = clamp(y, 0.012, FLOW.H);
  out[2] = h4*Math.PI*2;
  out[3] = age;
  return true;
}

/* =========================================================================
   THE PARTICLES  (no three.js here either)

   A box of liquid is n particles packed at random into a cube of side L:
   dropped in anywhere, then pushed apart until nobody is closer than the
   average spacing. Done once, at build, from a fixed seed.
========================================================================= */
const MICRO_Y = 400;
const BOX_L = 2.0;             // side of a sample box
const PR = 0.16;               // particle radius — the same hot or cold

function relaxBox(n, L, seed){
  const R = rng(seed), P = new Float32Array(n*3);
  const d = L/Math.cbrt(n), lim = L/2 - d/2;
  for(let i=0;i<n*3;i++) P[i] = (R()*2-1)*lim;
  for(let it=0; it<500; it++){
    for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){
      const dx = P[j*3]-P[i*3], dy = P[j*3+1]-P[i*3+1], dz = P[j*3+2]-P[i*3+2];
      const r2 = dx*dx+dy*dy+dz*dz;
      if(r2 >= d*d) continue;
      const r = Math.sqrt(r2) || 1e-6, push = (d - r)*0.25/r;
      P[i*3] -= dx*push; P[i*3+1] -= dy*push; P[i*3+2] -= dz*push;
      P[j*3] += dx*push; P[j*3+1] += dy*push; P[j*3+2] += dz*push;
    }
    for(let i=0;i<n*3;i++) P[i] = clamp(P[i], -lim, lim);
  }
  return P;
}

const COLD_BOX = relaxBox(NC, BOX_L, 11);
const HOT_BOX  = relaxBox(NH, BOX_L, 23);

/* per-particle jiggle: three phases and three rates each, fixed by index */
function jiggleTable(n, off){
  const J = new Float32Array(n*6);
  for(let i=0;i<n;i++) for(let k=0;k<3;k++){
    J[i*6+k]   = hash(off + i*9 + k)*6.283;
    J[i*6+3+k] = 0.7 + 0.6*hash(off + i*9 + 3 + k);
  }
  return J;
}
const JIG_C = jiggleTable(NC, 1000), JIG_H = jiggleTable(NH, 5000);

/* Particle i of a box at time t: its place, scaled by the spacing k, plus a
   jiggle whose size and speed grow with temperature. phi is the jiggle's
   phase — the integral of its rate, so a rate that ramps up never jumps. */
function particleAt(base, jig, i, k, amp, phi, out){
  const s = 0.35*phi;                 // the slow drift of a liquid
  for(let a=0;a<3;a++){
    out[a] = base[i*3+a]*k
           + amp*Math.sin(phi*jig[i*6+3+a] + jig[i*6+a])
           + amp*0.8*Math.sin(s*jig[i*6+3+((a+1)%3)] + jig[i*6+((a+2)%3)]);
  }
  return out;
}

/* chapter 1's heating: 20 °C to 80 °C, smoothly, between these times */
const HEAT0 = 3.2, HEAT1 = 9.2;
const JIG_W = 7.0;                    // jiggle rate at 20 °C, radians a second
const JIG_HOT = 1.25;                 // extra rate at 80 °C, as a fraction
const AMP_COLD = 0.028, AMP_HOT = 0.055;
function parcelState(t){
  const u = ss(HEAT0, HEAT1, t);
  return {
    u,
    tempC: lerp(WATER.cold.T, WATER.hot.T, u),
    k:     lerp(1, KH, u),
    amp:   lerp(AMP_COLD, AMP_HOT, u),
    phi:   JIG_W*(t + JIG_HOT*ssInt(HEAT0, HEAT1, t))
  };
}

/* =========================================================================
   THREE
========================================================================= */
const stage = document.getElementById('stage');
const fadeEl = document.getElementById('fade');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080b11);
scene.fog = new THREE.Fog(0x080b11, 40, 90);
const camera = new THREE.PerspectiveCamera(44, 1, 0.03, 200);

scene.add(new THREE.HemisphereLight(0x9fb4d0, 0x0a0d13, 0.6));
const keyL  = new THREE.DirectionalLight(0xffffff, 0.95); keyL.position.set(6,11,8); scene.add(keyL);
const fillL = new THREE.DirectionalLight(0x9ec3ff, 0.40); fillL.position.set(-8,4,-6); scene.add(fillL);
const rimL  = new THREE.DirectionalLight(0xffd9b0, 0.32); rimL.position.set(0,3,-10); scene.add(rimL);

(function environment(){
  const env = new THREE.Scene();
  const box = new THREE.BoxGeometry(1,1,1);
  env.add(new THREE.Mesh(new THREE.BoxGeometry(30,18,30),
    new THREE.MeshBasicMaterial({color:0x1d2634, side:THREE.BackSide})));
  const panel=(hex,gain,x,y,z,sx,sy,sz)=>{
    const m=new THREE.Mesh(box,new THREE.MeshBasicMaterial({color:hex}));
    m.material.color.multiplyScalar(gain);
    m.position.set(x,y,z); m.scale.set(sx,sy,sz); env.add(m);
  };
  panel(0xffffff,1.1,  0, 8.4,  0, 14,0.1,14);
  panel(0xbcd6ff,1.3,-11, 1.5,  0, 0.1,11,20);
  panel(0xffd7b0,0.9, 11, 1.5,  2, 0.1,11,20);
  panel(0x8fb0e0,0.5,  0, 0.0,-12, 22,11,0.1);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(env, 0.04).texture;
  pmrem.dispose();
})();

const SPH  = new THREE.SphereGeometry(1,20,14);
const CYL  = new THREE.CylinderGeometry(1,1,1,16);
const CONE = new THREE.ConeGeometry(1,1,20);
const BOX  = new THREE.BoxGeometry(1,1,1);

function linearise(root){
  root.traverse(o=>{
    if(!o.material) return;
    (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{
      if(!m || m.userData.__lin) return;
      m.userData.__lin = true;
      if(m.color)    m.color.convertSRGBToLinear();
      if(m.emissive) m.emissive.convertSRGBToLinear();
    });
  });
}

/* a soft radial falloff, for anything big and flat */
function falloffMap(stops){
  const S = 512, c = document.createElement('canvas');
  c.width = c.height = S;
  const x = c.getContext('2d');
  x.fillStyle = '#000'; x.fillRect(0,0,S,S);
  const g = x.createRadialGradient(S/2,S/2,0, S/2,S/2,S*0.5);
  stops.forEach(s=>g.addColorStop(s[0], s[1]));
  x.fillStyle = g; x.fillRect(0,0,S,S);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  return t;
}

/* ------------------------------------------------------------------ labels */
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}
function makeLabel(text, opt){
  opt = opt || {};
  const size = opt.size || 54, pad = opt.bg ? 26 : 18;
  const c = document.createElement('canvas'), ctx = c.getContext('2d');
  const font = (opt.weight || 600)+' '+size+'px "Iowan Old Style", Charter, Georgia, serif';
  ctx.font = font;
  const w = Math.ceil(ctx.measureText(text).width) + pad*2, h = size + pad*2;
  c.width = w; c.height = h;
  if(opt.bg){
    roundRect(ctx, 3, 3, w-6, h-6, (h-6)/2);
    ctx.fillStyle = opt.bg; ctx.fill();
    if(opt.border){ ctx.lineWidth = 4; ctx.strokeStyle = opt.border; ctx.stroke(); }
  }
  ctx.font = font; ctx.textAlign='center'; ctx.textBaseline='middle';
  if(!opt.bg){ ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 14; }
  ctx.fillStyle = opt.color || '#eef2f7';
  ctx.fillText(text, w/2, h/2 + size*0.04);
  const tex = new THREE.CanvasTexture(c); tex.anisotropy = 4;
  tex.encoding = THREE.sRGBEncoding;
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({
    map:tex, transparent:true, depthTest:false, depthWrite:false}));
  spr.renderOrder = 30;
  const scale = opt.scale || 0.3;
  spr.scale.set(w/h*scale, scale, 1);
  spr.userData.opt = opt; spr.userData.text = text;
  return spr;
}
function setLabel(spr, text){
  const fresh = makeLabel(text, spr.userData.opt);
  if(spr.material.map) spr.material.map.dispose();
  spr.material.map = fresh.material.map;
  spr.material.needsUpdate = true;
  spr.scale.copy(fresh.scale); spr.userData.text = text;
  fresh.material.dispose();
}

/* a thin line from a label to the thing it names */
function leader(parent, a, b, col){
  const g = new THREE.BufferGeometry().setFromPoints([a, b]);
  const l = new THREE.Line(g, new THREE.LineBasicMaterial({
    color:col || 0xb8c4d4, transparent:true, depthTest:false, depthWrite:false}));
  l.renderOrder = 29;
  parent.add(l);
  return l;
}

/* a straight arrow along +y, base at the origin */
function makeArrow(len, col, rad){
  rad = rad || 0.06;
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({color:col, roughness:0.4, transparent:true,
    emissive:new THREE.Color(col).multiplyScalar(0.45)});
  const head = Math.min(len*0.4, rad*4.2);
  const shaft = new THREE.Mesh(CYL, mat);
  shaft.scale.set(rad, len-head, rad); shaft.position.y = (len-head)/2;
  const tip = new THREE.Mesh(CONE, mat);
  tip.scale.set(rad*2.6, head, rad*2.6); tip.position.y = len - head/2;
  g.add(shaft, tip);
  return g;
}

/* ---------------------------------------------------------- the cue sheet */
/* Everything that fades in on time is a cue: an object, the chapter it
   belongs to, when it arrives, optionally when it leaves, and how far it
   drifts upward as it arrives. */
const CUES = [];
function cue(ch, obj, t0, o){
  o = o || {};
  obj.traverse(m=>{ if(m.material){ m.material.transparent = true; m.userData.op = m.userData.op || m.material.opacity; }});
  CUES.push({ch, obj, t0, t1:o.t1, rise:o.rise || 0, base:obj.position.clone()});
  obj.visible = false;
  return obj;
}
function setOpacity(obj, a){
  obj.traverse(m=>{ if(m.material) m.material.opacity = a*(m.userData.op != null ? m.userData.op : 1); });
}
function runCues(ch, t){
  for(const c of CUES){
    if(c.ch !== ch){ c.obj.visible = false; continue; }
    let a = ss(c.t0, c.t0 + 0.6, t);
    if(c.t1 != null) a *= 1 - ss(c.t1, c.t1 + 0.5, t);
    c.obj.visible = a > 0.002;
    if(!c.obj.visible) continue;
    setOpacity(c.obj, a);
    c.obj.position.y = c.base.y + c.rise*ss(c.t0, c.t0 + 1.8, t);
  }
}

const dyeGeo = new THREE.BufferGeometry();

dyeGeo.setAttribute('position', new THREE.BufferAttribute(dyePos, 3));
dyeGeo.setAttribute('aSize',    new THREE.BufferAttribute(dyeSize, 1));
dyeGeo.setAttribute('aAlpha',   new THREE.BufferAttribute(dyeAlpha, 1));
const dyeMat = new THREE.ShaderMaterial({
  uniforms:{uScale:{value:600}, uCol:{value:new THREE.Vector3(0.55,0.10,0.62)}},
  vertexShader:[
    'attribute float aSize; attribute float aAlpha; uniform float uScale; varying float vA;',
    'void main(){',
    '  vec4 mv = modelViewMatrix*vec4(position,1.0);',
    '  gl_PointSize = aSize*uScale/max(0.05,-mv.z);',
    '  gl_Position = projectionMatrix*mv; vA = aAlpha;',
    '}'].join('\n'),
  fragmentShader:[
    'uniform vec3 uCol; varying float vA;',
    'void main(){',
    '  vec2 d = gl_PointCoord - 0.5; float r2 = dot(d,d)*4.0;',
    '  if(r2 > 1.0) discard;',
    '  float f = 1.0 - r2;',
    '  gl_FragColor = vec4(uCol, vA*f*f);',
    '}'].join('\n'),
  transparent:true, depthWrite:false
});

/* how many puffs are drawn and where, for the tests */
const dyeState = {live:0, maxY:0, maxR:0, nearWall:0};
const _p = [0,0,0,0];
function updateDye(cfg, tau){
  let live = 0, maxY = 0, maxR = 0, nearWall = 0;
  const kLast = Math.floor((tau - cfg.emit)/EMIT_DT);
  for(let s=0;s<DYE_MAX;s++){
    /* slot s holds the newest puff k with k ≡ s (mod DYE_MAX) */
    const k = kLast - ((((kLast - s) % DYE_MAX) + DYE_MAX) % DYE_MAX);
    if(kLast < 0 || k < 0 || !puffAt(cfg, k, tau, _p)){
      dyeAlpha[s] = 0; dyeSize[s] = 0;
      dyePos[s*3] = 0; dyePos[s*3+1] = POT.yb; dyePos[s*3+2] = 0;
      continue;
    }
    const r = _p[0], y = _p[1], th = _p[2], age = _p[3];
    dyePos[s*3]   = r*Math.cos(th);
    dyePos[s*3+1] = POT.yb + y;
    dyePos[s*3+2] = r*Math.sin(th);
    dyeSize[s]  = 0.09 + 0.05*Math.pow(age, 0.6);
    dyeAlpha[s] = 0.55*ss(0, 0.5, age)*Math.pow(1 - age/DYE_LIFE, 1.5)/(1 + 0.1*age);
    live++;
    if(y > maxY) maxY = y;
    if(r > maxR) maxR = r;
    if(r > 0.8*FLOW.R && y < 0.6*FLOW.H) nearWall++;
  }
  dyeGeo.attributes.position.needsUpdate = true;
  dyeGeo.attributes.aSize.needsUpdate = true;
  dyeGeo.attributes.aAlpha.needsUpdate = true;
  dyeState.live = live; dyeState.maxY = maxY; dyeState.maxR = maxR; dyeState.nearWall = nearWall;
}

/* ------------------------------------------------------- the curved arrows */
/* Four arcs on each side of the cross-section, all cut from one streamline
   of the same flow the dye rides on, so the arrows and the dye cannot
   disagree. Coloured by how warm the water is at that point in the loop:
   hottest just after it passes over the flame, coolest after the wall. */
const ARC_LEVEL = 0.5, ARC_GAP = 0.26;
const ARCS = [];
const warmthAt = (r, y) => 0.5 + 0.5*Math.cos(Math.atan2(y - FLOW.H/2, r - FLOW.R/2) - 3*Math.PI/4);
const C_HOT = new THREE.Color(COL.hot), C_COLD = new THREE.Color(COL.cold);

(function buildArcs(){
  const L = traceLoop(ARC_LEVEL);
  const cr = FLOW.R/2, cy = FLOW.H/2, A0 = -3*Math.PI/4;
  const ang = i => Math.atan2(L.y[i]-cy, L.r[i]-cr);
  /* start at the bottom-left of the loop, then unwrap the angle as it turns */
  let start = 0, bd = Infinity;
  for(let i=0;i<LOOP_N;i++){
    let d = Math.abs(ang(i) - A0); d = Math.min(d, 2*Math.PI - d);
    if(d < bd){ bd = d; start = i; }
  }
  const pts = [];
  let prev = ang(start), acc = prev;
  for(let n=0;n<=LOOP_N;n++){
    const i = (start + n) % LOOP_N, a = ang(i);
    let da = a - prev;
    if(da >  Math.PI) da -= 2*Math.PI;
    if(da < -Math.PI) da += 2*Math.PI;
    acc += n ? da : 0; prev = a;
    pts.push({r:L.r[i], y:L.y[i], a:acc});
  }
  const up = new THREE.Vector3(0,1,0);
  for(let k=0;k<4;k++){
    const hi = A0 - k*Math.PI/2 - ARC_GAP, lo = A0 - (k+1)*Math.PI/2 + ARC_GAP;
    const arc = pts.filter(p=>p.a <= hi && p.a >= lo);
    for(const side of [1,-1]){
      const v = arc.map(p=>new THREE.Vector3(side*p.r, POT.yb + p.y, 0));
      const curve = new THREE.CatmullRomCurve3(v);
      const TS = 48, RS = 8;
      const geo = new THREE.TubeGeometry(curve, TS, 0.042, RS, false);
      const cols = new Float32Array(geo.attributes.position.count*3);
      const c = new THREE.Color();
      for(let i=0;i<=TS;i++){
        const p = curve.getPointAt(i/TS);
        c.copy(C_COLD).lerp(C_HOT, warmthAt(Math.abs(p.x), p.y - POT.yb));
        for(let j=0;j<=RS;j++){
          const q = i*(RS+1) + j;
          cols[q*3] = c.r; cols[q*3+1] = c.g; cols[q*3+2] = c.b;
        }
      }
      /* vertex colours are read as linear */
      for(let i=0;i<cols.length;i+=3){
        c.setRGB(cols[i], cols[i+1], cols[i+2]).convertSRGBToLinear();
        cols[i] = c.r; cols[i+1] = c.g; cols[i+2] = c.b;
      }
      geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
      const mat = new THREE.MeshBasicMaterial({vertexColors:true, transparent:true,
        depthTest:false, depthWrite:false});
      const tube = new THREE.Mesh(geo, mat);
      tube.renderOrder = 20; macro.add(tube);

      const end = curve.getPointAt(1), tan = curve.getTangentAt(1);
      const endCol = new THREE.Color().copy(C_COLD).lerp(C_HOT, warmthAt(Math.abs(end.x), end.y - POT.yb));
      const head = new THREE.Mesh(CONE, new THREE.MeshBasicMaterial({color:endCol,
        transparent:true, depthTest:false, depthWrite:false}));
      head.scale.set(0.11, 0.2, 0.11);
      head.quaternion.setFromUnitVectors(up, tan);
      head.position.copy(end).addScaledVector(tan, 0.1);
      head.renderOrder = 21; macro.add(head);

      ARCS.push({k, side, tube, head, curve, TS, RS,
                 dirMid:curve.getTangentAt(0.5), mid:curve.getPointAt(0.5)});
    }
  }
})();
const ARC_T0 = 1.8, ARC_STEP = 1.7, ARC_GROW = 1.2;
function updateArcs(on, t){
  for(const A of ARCS){
    const t0 = ARC_T0 + A.k*ARC_STEP;
    const g = on ? ss(t0, t0 + ARC_GROW, t) : 0;
    const segs = Math.round(g*A.TS);
    A.tube.visible = segs > 0;
    A.tube.geometry.setDrawRange(0, segs*A.RS*6);
    A.tube.material.opacity = 0.95;
    A.head.visible = g >= 0.999;
    A.head.material.opacity = 0.95;
  }
}

function boxEdges(col, op){
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(BOX_L, BOX_L, BOX_L)),
    new THREE.LineBasicMaterial({color:col, transparent:true, opacity:op}));
  return e;
}
function instanced(n, col){
  const mat = new THREE.MeshStandardMaterial({color:col, roughness:0.35, metalness:0.1,
    emissive:new THREE.Color(col).multiplyScalar(0.12)});
  const m = new THREE.InstancedMesh(SPH, mat, n);
  m.frustumCulled = false;
  linearise(m);
  return m;
}
const _q = [0,0,0];
function placeBox(mesh, base, jig, n, k, amp, phi){
  const A = mesh.instanceMatrix.array;
  for(let i=0;i<n;i++){
    particleAt(base, jig, i, k, amp, phi, _q);
    const o = i*16;
    A[o]=PR; A[o+1]=0; A[o+2]=0; A[o+3]=0;
    A[o+4]=0; A[o+5]=PR; A[o+6]=0; A[o+7]=0;
    A[o+8]=0; A[o+9]=0; A[o+10]=PR; A[o+11]=0;
    A[o+12]=_q[0]; A[o+13]=_q[1]; A[o+14]=_q[2]; A[o+15]=1;
  }
  mesh.instanceMatrix.needsUpdate = true;
}

/* ------------------------------------------------------------- the camera */
const FADE = 0.32;
function shotAt(C, t){
  let s0 = 0;
  for(let i=0;i<C.shots.length;i++){
    const sh = C.shots[i], end = sh.until != null ? sh.until : Infinity;
    if(t < end || i === C.shots.length-1){
      const u = ss(0, sh.dur, t - s0);
      let fade = 1 - clamp((t - s0)/FADE, 0, 1);                 // fading in at its start
      if(isFinite(end)) fade = Math.max(fade, 1 - clamp((end - t)/FADE, 0, 1));
      return {world:sh.world, cam:lerpCam(sh.from, sh.to, u), fade, index:i};
    }
    s0 = end;
  }
}
function lerpCam(a, b, u){
  return {
    dist: Math.exp(lerp(Math.log(a.dist), Math.log(b.dist), u)),   // a zoom feels even in log distance
    az: lerp(a.az, b.az, u), el: lerp(a.el, b.el, u),
    look:[lerp(a.look[0],b.look[0],u), lerp(a.look[1],b.look[1],u), lerp(a.look[2],b.look[2],u)]
  };
}
function worldAt(ch, t){ return shotAt(CH[ch], t).world; }

let dragAz = 0, dragEl = 0, zoomAdj = 0;
function applyCamera(c){
  const az = c.az + dragAz, el = clamp(c.el + dragEl, -0.4, 1.2);
  const d = Math.max(0.4, c.dist*Math.exp(zoomAdj));
  camera.position.set(
    c.look[0] + d*Math.cos(el)*Math.sin(az),
    c.look[1] + d*Math.sin(el),
    c.look[2] + d*Math.cos(el)*Math.cos(az));
  camera.lookAt(c.look[0], c.look[1], c.look[2]);
}

/* ---------------------------------------------------------------- a frame */
let cur = 0, shownTemp = null;
const cPart = new THREE.Color();

function frame(t){
  const C = CH[cur];
  const shot = shotAt(C, t);
  applyCamera(shot.cam);
  fadeEl.style.opacity = shot.fade.toFixed(3);

  const inMacro = shot.world === 'macro';
  macro.visible = inMacro;
  micro.visible = !inMacro;

  if(inMacro){
    updateFlame(C.flame ? C.flame(t) : 0, t);
    const g = C.glow ? C.glow(t) : [0.1, 0];
    setGlow(g[0], g[1]);
    dye.visible = !!C.dye;
    if(C.dye) updateDye(C.dye, C.dye.tau0 + t);
    updateArcs(!!C.arrows, t);
  }

  parcel.visible = C.micro === 'parcel';
  pair.visible   = C.micro === 'pair';

  if(C.micro === 'parcel'){
    const s = parcelState(t);
    placeBox(parcelMesh, COLD_BOX, JIG_C, NC, s.k, s.amp, s.phi);
    parcelEdges.scale.setScalar(s.k);
    cPart.set(COL.pCold).lerp(new THREE.Color(COL.pHot), s.u).convertSRGBToLinear();
    parcelMesh.material.color.copy(cPart);
    parcelMesh.material.emissive.copy(cPart).multiplyScalar(0.12);
    const on = ss(HEAT0 - 0.4, HEAT0, t)*(1 - ss(HEAT1, HEAT1 + 0.6, t));
    heater.visible = on > 0.01;
    plate.material.emissive.set(COL.warm).convertSRGBToLinear().multiplyScalar(0.25 + 0.6*on);
    heatArrows.forEach((a, i)=>{
      const f = ((t*0.9 + i*0.37) % 1 + 1) % 1;
      a.position.y = -1.66 + 0.25*f;
      setOpacity(a, on*Math.sin(Math.PI*f));
    });
    const T = Math.round(s.tempC);
    if(T !== shownTemp){ shownTemp = T; setLabel(thermoLbl, T+' °C'); }
  }
  if(C.micro === 'pair'){
    placeBox(coldMesh, COLD_BOX, JIG_C, NC, 1, AMP_COLD, JIG_W*t);
    placeBox(hotMesh,  HOT_BOX,  JIG_H, NH, 1, AMP_HOT,  JIG_W*(1 + JIG_HOT)*t);
    const m = ss(MOVE0, MOVE1, t);
    coldGrp.position.y = -RISE*m;
    hotGrp.position.y  =  RISE*m;
  }

  runCues(cur, t);
  renderer.render(scene, camera);
}

/* --------------------------------------------------------------- chapters */
let chStart = null;
function enterChapter(i){
  cur = i; chStart = null; shownTemp = null;
  dragAz = dragEl = zoomAdj = 0;
  const C = CH[i];
  document.getElementById('sStep').textContent = (i+1)+' / '+CH.length+' · '+C.part;
  document.getElementById('sTitle').innerHTML = C.title;
  document.getElementById('sText').innerHTML = C.text;
  const lk = document.getElementById('sLook');
  lk.textContent = C.look ? 'Watch for: '+C.look : ''; lk.hidden = !C.look;
  const sc = document.getElementById('sScale');
  sc.textContent = C.scale || ''; sc.hidden = !C.scale;
  const tm = document.getElementById('sTerms');
  tm.innerHTML = C.terms.length
    ? '<div class="hd">Key words</div>' + C.terms.map(x=>'<dt>'+x[0]+'</dt><dd>'+x[1]+'</dd>').join('')
    : '';
  tm.hidden = !C.terms.length;
  document.getElementById('key').innerHTML = C.key.map(k=>KEY[k]).join('');
  document.getElementById('back').disabled = i === 0;
  document.getElementById('next').disabled = i === CH.length-1;
  document.querySelectorAll('#dots i').forEach((d,k)=>d.classList.toggle('on', k === i));
}

function animate(now){
  requestAnimationFrame(animate);
  if(chStart === null) chStart = now;
  frame((now - chStart)/1000);
}

/* ------------------------------------------------------------------ wiring */
const cv = renderer.domElement;
cv.style.touchAction = 'none';
cv.style.cursor = 'grab';
let dragging = false, lastX = 0, lastY = 0;
cv.addEventListener('pointerdown', e=>{
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  cv.style.cursor = 'grabbing';
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e=>{
  if(!dragging) return;
  dragAz += (e.clientX - lastX)*0.006;
  dragEl = clamp(dragEl + (e.clientY - lastY)*0.004, -0.5, 1.0);
  lastX = e.clientX; lastY = e.clientY;
});
['pointerup','pointercancel'].forEach(ev=>
  cv.addEventListener(ev, ()=>{ dragging = false; cv.style.cursor = 'grab'; }));
cv.addEventListener('wheel', e=>{
  e.preventDefault();
  zoomAdj = clamp(zoomAdj + e.deltaY*0.001, -0.9, 0.9);
}, {passive:false});

const dotsEl = document.getElementById('dots');
CH.forEach((c,i)=>{
  const d = document.createElement('i');
  d.title = c.title;
  d.addEventListener('click', ()=>enterChapter(i));
  dotsEl.appendChild(d);
});
document.getElementById('next').addEventListener('click', ()=>{ if(cur < CH.length-1) enterChapter(cur+1); });
document.getElementById('back').addEventListener('click', ()=>{ if(cur > 0) enterChapter(cur-1); });
document.getElementById('replay').addEventListener('click', ()=>enterChapter(cur));
window.addEventListener('keydown', e=>{
  if(e.key === 'ArrowRight' && cur < CH.length-1) enterChapter(cur+1);
  if(e.key === 'ArrowLeft'  && cur > 0) enterChapter(cur-1);
});

function resize(){
  const w = stage.clientWidth || window.innerWidth;
  const h = stage.clientHeight || window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w/h;
  camera.fov = (w/h < 1.1) ? 62 : 44;
  camera.updateProjectionMatrix();
  const pr = Math.min(2, window.devicePixelRatio||1);
  dyeMat.uniforms.uScale.value = h*pr/(2*Math.tan(camera.fov*Math.PI/360));
}
window.addEventListener('resize', resize);
resize();

enterChapter(0);
requestAnimationFrame(animate);
</script>
