<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Energy and temperature — the 3D story</title>
<style>
  :root{
    --ink:#eef2f7;
    --dim:#93a2b6;
    --panel:rgba(10,14,21,.78);
    --line:rgba(147,162,182,.22);
    --side:376px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:#080b11;color:var(--ink);overflow:hidden;
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}

  #stage{position:fixed;top:0;right:0;bottom:0;left:var(--side);}
  canvas{display:block;}

  #side{
    position:fixed;top:0;left:0;bottom:0;width:var(--side);
    background:var(--panel);backdrop-filter:blur(16px);
    border-right:1px solid var(--line);
    padding:20px 22px 16px;
    display:flex;flex-direction:column;gap:14px;
    overflow-y:auto;
  }
  #side h1{
    margin:0;
    font-family:"Iowan Old Style","Charter","Palatino Linotype",Georgia,serif;
    font-weight:600;font-size:19px;letter-spacing:.2px;line-height:1.25;
  }
  #side .byline{margin:4px 0 0;font-size:12px;line-height:1.5;color:var(--dim);}
  #side a{color:var(--dim);text-decoration:none;font-size:12px;
    border-bottom:1px solid rgba(147,162,182,.3);}
  #side a:hover{color:var(--ink);}
  .links{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;}

  .cards{display:flex;flex-direction:column;gap:8px;}
  .card{
    background:rgba(255,255,255,.04);
    border:1px solid var(--line);border-radius:11px;
    padding:8px 12px;
  }
  .card .who{font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;}
  .card .nums{display:flex;gap:12px;flex-wrap:wrap;margin-top:5px;}
  .card .n{font-size:10px;color:var(--dim);line-height:1.2;}
  .card .n b{display:block;color:var(--ink);font-size:15px;font-weight:600;
    font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap;}
  .card .n.hot b{color:#ffb07a;}

  .story{flex:1;min-height:0;}
  .story .step{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;}
  .story h2{
    margin:3px 0 0;font-family:"Iowan Old Style","Charter",Georgia,serif;
    font-size:17px;font-weight:600;letter-spacing:.2px;
  }
  .story p{margin:8px 0 0;font-size:13px;line-height:1.62;color:#cbd5e1;}
  .story p b{color:#ffd9a0;font-weight:600;}
  .story .look{
    margin-top:10px;font-size:12px;line-height:1.5;color:#a9c7ee;
    border-left:2px solid rgba(127,176,255,.45);padding-left:10px;
  }
  .terms{
    margin:12px 0 0;padding:10px 12px;
    background:rgba(255,217,160,.05);border:1px solid rgba(255,217,160,.18);border-radius:10px;
  }
  .terms .hd{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#d9b98a;font-weight:700;margin-bottom:6px;}
  .terms dt{font-size:12.5px;font-weight:700;color:#ffd9a0;}
  .terms dd{margin:1px 0 7px;font-size:12.5px;line-height:1.5;color:#cbd5e1;}
  .terms dd:last-child{margin-bottom:0;}

  table.sum{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px;}
  table.sum th,table.sum td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top;}
  table.sum th{color:var(--dim);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;}
  table.sum td{color:#cbd5e1;}
  table.sum td:first-child{color:var(--ink);font-weight:600;}

  .nav{
    position:fixed;left:var(--side);right:0;bottom:20px;z-index:5;
    margin:0 auto;width:fit-content;max-width:calc(100% - var(--side) - 32px);
    display:flex;align-items:center;gap:8px;flex-wrap:nowrap;justify-content:center;
    background:var(--panel);backdrop-filter:blur(16px);
    border:1px solid var(--line);border-radius:999px;
    padding:9px 12px;white-space:nowrap;
  }
  .nav button{
    font:inherit;font-size:12.5px;font-weight:500;color:var(--dim);
    background:rgba(255,255,255,.05);border:1px solid var(--line);
    border-radius:999px;padding:7px 14px;cursor:pointer;
    transition:background .15s ease,color .15s ease,opacity .15s ease;
  }
  .nav button:hover:not(:disabled){background:rgba(255,255,255,.12);color:var(--ink);}
  .nav button:disabled{opacity:.32;cursor:default;}
  .nav button.primary{background:rgba(127,176,255,.2);color:#dce9ff;border-color:rgba(127,176,255,.35);}
  .dots{display:flex;gap:6px;padding:0 4px;}
  .dots i{
    width:7px;height:7px;border-radius:50%;background:rgba(147,162,182,.3);
    cursor:pointer;transition:background .2s ease,transform .2s ease;
  }
  .dots i.on{background:var(--ink);transform:scale(1.25);}

  #key{
    position:fixed;top:18px;right:20px;z-index:5;
    background:var(--panel);backdrop-filter:blur(16px);
    border:1px solid var(--line);border-radius:12px;
    padding:11px 14px;
    font-size:11.5px;line-height:1.75;color:var(--dim);
  }
  #key div{display:flex;align-items:center;gap:8px;}
  .dot{width:11px;height:11px;border-radius:50%;flex:none;
    box-shadow:inset -2px -2px 3px rgba(0,0,0,.45);}
  .sq{width:11px;height:11px;border-radius:2px;flex:none;}

  .hint{
    position:fixed;right:20px;bottom:20px;z-index:3;
    font-size:11px;color:#5a687d;pointer-events:none;
  }

  @media (max-width:860px){
    :root{--side:0px;}
    #stage{left:0;bottom:44vh;}
    #side{
      top:auto;left:0;right:0;bottom:0;width:auto;height:44vh;
      border-right:none;border-top:1px solid var(--line);
      padding:14px 16px;gap:11px;
    }
    #side h1{font-size:16px;}
    #side .byline{display:none;}
    .cards{flex-direction:row;}
    .card{flex:1;min-width:0;}
    .card .nums{gap:8px;}
    .card .n b{font-size:13px;}
    .nav{
      left:0;right:0;bottom:44vh;
      width:auto;max-width:none;margin:0;
      border-radius:0;border-width:1px 0 0;
      flex-wrap:wrap;white-space:normal;justify-content:center;
    }
    #key{top:14px;right:14px;padding:8px 10px;font-size:11px;line-height:1.6;}
    .hint{display:none;}
  }
</style>
</head>
<body>

<div id="stage"></div>

<div id="side">
  <div>
    <h1>Energy and temperature</h1>
    <p class="byline">Two different things — and why a spark is hotter than a bath</p>
    <div class="links">
      <a href="../index.html">← All simulations</a>
    </div>
  </div>

  <div class="cards" id="cards"></div>

  <div class="story">
    <div class="step" id="sStep"></div>
    <h2 id="sTitle"></h2>
    <p id="sText"></p>
    <div class="look" id="sLook"></div>
    <dl class="terms" id="sTerms"></dl>
  </div>
</div>

<!-- outside #side: its backdrop-filter would otherwise pin fixed children to the column -->
<div class="nav">
  <button id="back">← Back</button>
  <button id="next" class="primary">Next →</button>
  <button id="replay">Replay</button>
  <div class="dots" id="dots"></div>
</div>

<div id="key"></div>

<div class="hint">drag to orbit · scroll to zoom</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===========================================================================
   ENERGY AND TEMPERATURE — the 3D story

   Every scene is one or more samples of matter. A sample is a box of particles
   plus a thermometer and a bar showing its thermal energy store.

   Two quantities, kept strictly apart:

     temperature  — how fast the particles move ON AVERAGE. Nothing to do with
                    how many there are. Drives the thermometer.
     energy store — the total energy of all the particles:
                    (number of particles) x (average energy of one)
                    so it grows with the amount of material as well as with
                    the temperature. Drives the orange bar.

   Nothing is scripted: the thermometer reads the particle speeds, the bar
   reads the count and the speeds, and heating just hands energy to particles
   one orange dot at a time.
=========================================================================== */

const K0   = 273;      // 0 degrees C in kelvin
const REF  = 293;      // room temperature in kelvin — the speed reference
const EPP  = 0.02;     // kJ of energy in one particle per kelvin (a fixed lump of matter)

/* average speed of the particles, in units where room temperature = 1.00 */
const spFactor = TK => Math.sqrt(Math.max(20, TK)/REF);
const energyOf = s => s.n * (s.tempC + K0) * EPP;

const COL = {
  particle : 0x7fb0ff,
  cold     : 0x5f9cff,
  hot      : 0xff7a3c,
  energy   : 0xffae2b,
  mercury  : 0xff4d4d,
  glassT   : 0xdfe8f5,
  heater   : 0xff6a2b,
  slow     : 0x4f8fff,
  fast     : 0xff5a4a
};

const hexCss = n => '#'+n.toString(16).padStart(6,'0');
const rand = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const fmtKJ = v => (v>=1000 ? Math.round(v).toLocaleString('en-GB') : v.toFixed(0)) + ' kJ';

/* ------------------------------------------------------------------ three */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080b11);
scene.fog = new THREE.Fog(0x080b11, 46, 96);
const camera = new THREE.PerspectiveCamera(44, 1, 0.1, 200);

scene.add(new THREE.HemisphereLight(0x9fb4d0, 0x0a0d13, 0.6));
const keyL  = new THREE.DirectionalLight(0xffffff, 0.95); keyL.position.set(6,11,8); scene.add(keyL);
const fillL = new THREE.DirectionalLight(0x9ec3ff, 0.40); fillL.position.set(-8,4,-6); scene.add(fillL);
const rimL  = new THREE.DirectionalLight(0xffd9b0, 0.32); rimL.position.set(0,3,-10); scene.add(rimL);

(function environment(){
  const env = new THREE.Scene();
  const box = new THREE.BoxGeometry(1,1,1);
  env.add(new THREE.Mesh(new THREE.BoxGeometry(30,18,30),
    new THREE.MeshBasicMaterial({color:0x1d2634, side:THREE.BackSide})));
  const panel=(hex,gain,x,y,z,sx,sy,sz)=>{
    const m=new THREE.Mesh(box,new THREE.MeshBasicMaterial({color:hex}));
    m.material.color.multiplyScalar(gain);
    m.position.set(x,y,z); m.scale.set(sx,sy,sz); env.add(m);
  };
  panel(0xffffff,1.1,  0, 8.4,  0, 14,0.1,14);
  panel(0xbcd6ff,1.3,-11, 1.5,  0, 0.1,11,20);
  panel(0xffd7b0,0.9, 11, 1.5,  2, 0.1,11,20);
  panel(0x8fb0e0,0.5,  0, 0.0,-12, 22,11,0.1);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(env, 0.04).texture;
  pmrem.dispose();
})();

const benchMap = (function(){
  const S = 512, c = document.createElement('canvas');
  c.width = c.height = S;
  const x = c.getContext('2d');
  x.fillStyle = '#000'; x.fillRect(0,0,S,S);
  const g = x.createRadialGradient(S/2,S/2,0, S/2,S/2,S*0.5);
  g.addColorStop(0.00,'rgba(255,255,255,1)');
  g.addColorStop(0.16,'rgba(226,232,242,0.78)');
  g.addColorStop(0.32,'rgba(140,152,172,0.24)');
  g.addColorStop(0.44,'rgba(56,64,78,0.06)');
  g.addColorStop(0.50,'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0,0,S,S);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  return t;
})();
const bench = new THREE.Mesh(
  new THREE.CylinderGeometry(26,26,0.4,64),
  new THREE.MeshStandardMaterial({color:0x4a515d, map:benchMap,
    roughness:0.94, metalness:0, envMapIntensity:0.10})
);
bench.position.y = -0.3; scene.add(bench);

/* ------------------------------------------------------------- shared bits */
const SPH  = new THREE.SphereGeometry(1,20,14);
const BOX  = new THREE.BoxGeometry(1,1,1);
const CYL  = new THREE.CylinderGeometry(1,1,1,16);
const CONE = new THREE.ConeGeometry(1,1,20);
const SHARED = new Set([SPH, BOX, CYL, CONE]);

function linearise(root){
  root.traverse(o=>{
    if(!o.material) return;
    (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{
      if(!m || m.userData.__lin) return;
      m.userData.__lin = true;
      if(m.color)    m.color.convertSRGBToLinear();
      if(m.emissive) m.emissive.convertSRGBToLinear();
    });
  });
}

function makeLabel(text, opt){
  opt = opt || {};
  const size = opt.size || 54, pad = 18;
  const c = document.createElement('canvas'), ctx = c.getContext('2d');
  const font = '600 '+size+'px "Iowan Old Style", Charter, Georgia, serif';
  ctx.font = font;
  const w = Math.ceil(ctx.measureText(text).width) + pad*2, h = size + pad*2;
  c.width = w; c.height = h;
  ctx.font = font; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 14;
  ctx.fillStyle = opt.color || '#eef2f7';
  ctx.fillText(text, w/2, h/2 + size*0.04);
  const tex = new THREE.CanvasTexture(c); tex.anisotropy = 4;
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({
    map:tex, transparent:true, depthTest:false, depthWrite:false}));
  spr.renderOrder = 10;
  const scale = opt.scale || 0.62;
  spr.scale.set(w/h*scale, scale, 1);
  spr.userData.opt = opt;
  return spr;
}
function setLabel(spr, text, opt){
  opt = opt || spr.userData.opt || {};
  const fresh = makeLabel(text, opt);
  if(spr.material.map) spr.material.map.dispose();
  spr.material.map = fresh.material.map;
  spr.scale.copy(fresh.scale);
  spr.userData.opt = opt;
  fresh.material.dispose();
}

function disposeTree(root){
  root.traverse(o=>{
    if(o.geometry && !o.isSprite && !SHARED.has(o.geometry)) o.geometry.dispose();
    if(o.material){
      if(o.material.map) o.material.map.dispose();
      o.material.dispose();
    }
  });
}

function makeArrow(dir, col){
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({color:col, roughness:0.4,
    emissive:new THREE.Color(col).multiplyScalar(0.3)});
  const shaft = new THREE.Mesh(CYL, mat);
  shaft.scale.set(0.07, 1.2, 0.07); shaft.rotation.z = Math.PI/2; shaft.position.x = -0.25*dir;
  const head = new THREE.Mesh(CONE, mat);
  head.scale.set(0.21, 0.45, 0.21); head.rotation.z = -dir*Math.PI/2; head.position.x = 0.6*dir;
  g.add(shaft, head);
  return g;
}

/* --------------------------------------------------------------- a sample */
/* cfg: x, name, nameCol, caption, w,h,d, n, state, tempC, tScale,
        heat:{rate, dT|q, stopAfter}, target, col, tempColour, speedColour,
        flash, thermo, bar                                                   */
function buildSample(cfg){
  const g = new THREE.Group();
  g.position.set(cfg.x||0, 0, cfg.z||0);
  scene.add(g);

  const w = cfg.w || 3.6, h = cfg.h || 3.0, d = cfg.d || 2.6;
  const s = {
    cfg, group:g, w, h, d,
    n: cfg.n, state: cfg.state || 'gas',
    tempC: cfg.tempC, tempC0: cfg.tempC,
    tScale: cfg.tScale || [0,100],
    target: cfg.target != null ? cfg.target : Infinity,
    parts: [], dots: [],
    heat: cfg.heat || null, heatT: 0, heatOn: !!cfg.heat, spawnAcc: 0,
    ownMats: !!(cfg.speedColour || cfg.tempColour || cfg.flash || cfg.heat) && cfg.n <= 220,
    shownT: null, shownE: null
  };
  s.E0 = energyOf(s);

  /* the container */
  const glassGeo = new THREE.BoxGeometry(w+0.08, h+0.08, d+0.08);
  const glass = new THREE.Mesh(glassGeo, new THREE.MeshStandardMaterial({
    color:0xbfd6e8, roughness:0.08, transparent:true, opacity:0.06,
    side:THREE.DoubleSide, depthWrite:false}));
  glass.position.y = h/2; g.add(glass);
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(glassGeo),
    new THREE.LineBasicMaterial({color:0x9fb4cc, transparent:true, opacity:0.45}));
  edges.position.y = h/2; g.add(edges);

  /* particles */
  const baseCol = cfg.col != null ? cfg.col : COL.particle;
  s.sharedMat = new THREE.MeshStandardMaterial({
    color:baseCol, roughness:0.35, metalness:0.15,
    emissive:new THREE.Color(baseCol).multiplyScalar(0.12)});
  fillSample(s, baseCol);

  /* heater underneath */
  if(s.heat){
    const plate = new THREE.Mesh(BOX, new THREE.MeshStandardMaterial({
      color:COL.heater, roughness:0.5,
      emissive:new THREE.Color(COL.heater).multiplyScalar(0.8)}));
    plate.scale.set(w*0.9, 0.12, d*0.9);
    plate.position.y = -0.12;
    g.add(plate);
    s.plate = plate;
    const l = makeLabel('heater', {scale:0.32, color:hexCss(COL.energy)});
    l.position.set(0, -0.62, d/2+0.1); g.add(l);
  }

  if(cfg.thermo !== false) buildThermo(s);
  if(cfg.bar !== false)    buildBar(s);

  if(cfg.name){
    const nl = makeLabel(cfg.name, {scale:0.5, color:cfg.nameCol || '#eef2f7'});
    nl.position.set(0, h+1.9, 0); g.add(nl);
  }
  if(cfg.caption){
    const cl = makeLabel(cfg.caption, {scale:0.34, color:'#b8c4d4'});
    cl.position.set(0, -0.95, d/2+0.15); g.add(cl);
  }

  linearise(g);
  return s;
}

/* lay the particles out: a lattice for a solid, loose for a liquid or gas */
function fillSample(s, baseCol){
  const w = s.w, h = s.h, d = s.d;
  const mk = () => {
    const m = new THREE.Mesh(SPH, s.ownMats
      ? new THREE.MeshStandardMaterial({color:baseCol, roughness:0.35, metalness:0.15,
          emissive:new THREE.Color(baseCol).multiplyScalar(0.12)})
      : s.sharedMat);
    s.group.add(m);
    return m;
  };
  if(s.state === 'solid'){ fillSolid(s, mk); return; }

  const r = s.cfg.r || 0.115;
  const top = s.state === 'liquid' ? h*0.62 : h;   // a liquid sits in the bottom of its container
  for(let i=0;i<s.n;i++){
    const mesh = mk(); mesh.scale.setScalar(r);
    const pos = new THREE.Vector3(rand(-w/2+r, w/2-r), rand(r+0.03, top-r), rand(-d/2+r, d/2-r));
    mesh.position.copy(pos);
    s.parts.push({mesh, pos, r, top,
      vel:new THREE.Vector3(rand(-1,1), rand(-1,1), rand(-1,1)).normalize(),
      sf: rollSpeed(), reroll: rand(0,0.8), flash:0});
  }
}

/* The regular, close-packed pattern a solid is drawn with: a face-centred
   cubic lattice, four particles to a cell, the same arrangement (and the same
   sphere size relative to the spacing) as the ice in melting-snowman.html.
   The lattice is offset a quarter of a cell from each wall, so the pattern
   would continue if the block carried on past the glass.

   Scene counts are chosen to fill whole cells; anything left over is taken off
   the top layer, which is where a real block would have its free surface. */
const FCC_BASIS = [[0,0,0],[0.5,0.5,0],[0.5,0,0.5],[0,0.5,0.5]];
const VIB_MAX = 0.15;        // the widest swing a particle takes, as a fraction of the spacing

function fillSolid(s, mk){
  const w = s.w, h = s.h, d = s.d;

  const a = Math.cbrt(4*w*h*d/s.n);              // 4 particles per cell
  let nx = Math.max(1, Math.round(w/a)),
      ny = Math.max(1, Math.round(h/a)),
      nz = Math.max(1, Math.round(d/a));
  while(4*nx*ny*nz < s.n){                       // grow the roomiest direction
    const gap = [w/nx, h/ny, d/nz];
    const i = gap.indexOf(Math.max.apply(null, gap));
    if(i === 0) nx++; else if(i === 1) ny++; else nz++;
  }
  const ax = w/nx, ay = h/ny, az = d/nz;

  const sites = [];
  for(let i=0;i<nx;i++) for(let j=0;j<ny;j++) for(let k=0;k<nz;k++)
    for(let b=0;b<4;b++)
      sites.push(new THREE.Vector3(
        -w/2 + (i + FCC_BASIS[b][0] + 0.25)*ax,
               (j + FCC_BASIS[b][1] + 0.25)*ay,
        -d/2 + (k + FCC_BASIS[b][2] + 0.25)*az));

  // trim any surplus off the top, outside edges first, so the block stays square
  if(sites.length > s.n){
    sites.sort((p,q)=> (q.y - p.y) || ((q.x*q.x+q.z*q.z) - (p.x*p.x+p.z*p.z)));
    sites.splice(0, sites.length - s.n);
  }

  /* nearest neighbours in an fcc lattice sit across the face diagonals */
  let nn = 0.5*Math.min(Math.hypot(ax,ay), Math.hypot(ax,az), Math.hypot(ay,az));
  let r = 0.48*nn;                               // just short of touching

  /* Shrink the whole block — spacing, spheres and swing together, so the
     pattern is untouched — until the outermost particles sit inside the glass
     even at the top of their vibration. */
  const pad = () => r + VIB_MAX*nn;
  let reach = 0;
  sites.forEach(p=>{
    reach = Math.max(reach, (Math.abs(p.x) + pad())/(w/2),
                            (Math.abs(p.y - h/2) + pad())/(h/2),
                            (Math.abs(p.z) + pad())/(d/2));
  });
  if(reach > 1){
    const k = 1/reach;
    sites.forEach(p=>{ p.x *= k; p.y = h/2 + (p.y - h/2)*k; p.z *= k; });
    nn *= k; r *= k;
  }

  sites.forEach(home=>{
    const mesh = mk(); mesh.scale.setScalar(r);
    mesh.position.copy(home);
    s.parts.push({mesh, home, pos:home.clone(), r, amp:nn,
      ph:new THREE.Vector3(rand(0,6.3), rand(0,6.3), rand(0,6.3)),
      fr:new THREE.Vector3(rand(0.8,1.25), rand(0.9,1.4), rand(0.7,1.2)),
      sf:rollSpeed(), reroll:rand(0,1), flash:0});
  });
}

/* a spread of speeds around the average — most near it, a few much faster */
function rollSpeed(){
  const u = Math.max(1e-4, Math.random());
  return clamp(Math.sqrt(-2*Math.log(u))*0.72, 0.22, 2.3);
}

function buildThermo(s){
  const grp = new THREE.Group();
  grp.position.set((s.cfg.thermoSide === -1 ? -1 : 1) * (s.w/2 + 0.95), 0, 0);
  s.group.add(grp);

  const glassMat = new THREE.MeshStandardMaterial({
    color:COL.glassT, roughness:0.12, metalness:0.05,
    transparent:true, opacity:0.3, depthWrite:false});
  const TH = 2.9;
  const stem = new THREE.Mesh(CYL, glassMat);
  stem.scale.set(0.11, TH, 0.11); stem.position.y = 0.5 + TH/2; grp.add(stem);
  const bulb = new THREE.Mesh(SPH, glassMat);
  bulb.scale.setScalar(0.23); bulb.position.y = 0.5; grp.add(bulb);

  const mercMat = new THREE.MeshStandardMaterial({color:COL.mercury, roughness:0.3,
    emissive:new THREE.Color(COL.mercury).multiplyScalar(0.3)});
  const merc = new THREE.Mesh(CYL, mercMat);
  merc.scale.set(0.062, 0.1, 0.062); merc.position.y = 0.5; grp.add(merc);
  const mbulb = new THREE.Mesh(SPH, mercMat);
  mbulb.scale.setScalar(0.17); mbulb.position.y = 0.5; grp.add(mbulb);

  for(let i=0;i<=4;i++){                       // scale marks
    const tick = new THREE.Mesh(BOX, new THREE.MeshBasicMaterial({color:0x8aa0bb}));
    tick.scale.set(0.16, 0.014, 0.014);
    tick.position.set(0.15, 0.5 + TH*i/4, 0);
    grp.add(tick);
  }

  const rd = makeLabel('0 °C', {scale:0.46, color:'#ffb4b4'});
  rd.position.set(0, 0.5 + TH + 0.45, 0); grp.add(rd);

  s.thermo = {grp, merc, TH, read:rd};
}

function buildBar(s){
  const grp = new THREE.Group();
  grp.position.set(-s.w/2 - 0.95, 0, 0);
  s.group.add(grp);

  const BH = 3.2;
  const frame = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(0.42, BH, 0.42)),
    new THREE.LineBasicMaterial({color:0x7d8ca1, transparent:true, opacity:0.55}));
  frame.position.y = 0.4 + BH/2; grp.add(frame);

  const fill = new THREE.Mesh(BOX, new THREE.MeshStandardMaterial({
    color:COL.energy, roughness:0.4,
    emissive:new THREE.Color(COL.energy).multiplyScalar(0.35)}));
  fill.scale.set(0.38, 0.01, 0.38); fill.position.y = 0.4; grp.add(fill);

  const rd = makeLabel('0 kJ', {scale:0.44, color:hexCss(COL.energy)});
  rd.position.set(0, 0.4 + BH + 0.45, 0); grp.add(rd);

  s.bar = {grp, fill, BH, read:rd};
}
/* ------------------------------------------------------- energy, arriving */
/* one orange dot = one small parcel of energy, on its way into a particle */
function buildDot(s, x, y, z){
  const g = new THREE.Group();
  const core = new THREE.Mesh(SPH, new THREE.MeshStandardMaterial({
    color:COL.energy, emissive:COL.energy, roughness:0.3}));
  core.scale.setScalar(0.085);
  const halo = new THREE.Mesh(SPH, new THREE.MeshBasicMaterial({
    color:COL.energy, transparent:true, opacity:0.32,
    blending:THREE.AdditiveBlending, depthWrite:false}));
  halo.scale.setScalar(0.26);
  g.add(core, halo);
  g.position.set(x, y, z);
  s.group.add(g);
  linearise(g);
  return g;
}

function spawnHeatDot(s){
  const p = s.parts[(Math.random()*s.parts.length)|0];
  if(!p) return;
  const g = buildDot(s, rand(-s.w/2+0.2, s.w/2-0.2), -0.35, rand(-s.d/2+0.2, s.d/2-0.2));
  s.dots.push({g, target:p, sp:3.2, warms:true});
}

/* a decorative dot crossing from one sample to another — the transfer itself
   is worked out from the temperature difference, not from these */
function spawnCrossDot(from, to){
  const p = to.parts[(Math.random()*to.parts.length)|0];
  if(!p) return;
  const dx = from.group.position.x - to.group.position.x;
  const edge = dx < 0 ? from.w/2 : -from.w/2;
  const g = buildDot(to, dx + edge, rand(0.4, from.h-0.3), rand(-from.d/2+0.2, from.d/2-0.2));
  to.dots.push({g, target:p, sp:2.6, warms:false});
}

const _v = new THREE.Vector3();
function updateDots(s, dt){
  for(let i=s.dots.length-1;i>=0;i--){
    const dot = s.dots[i];
    const tp = dot.target.pos;
    _v.set(tp.x-dot.g.position.x, tp.y-dot.g.position.y, tp.z-dot.g.position.z);
    const len = _v.length(), step = dot.sp*dt;
    if(len <= step + 0.02){
      dot.target.flash = 1;
      if(dot.warms) addEnergy(s, 1);
      disposeTree(dot.g); s.group.remove(dot.g);
      s.dots.splice(i,1);
    } else {
      dot.g.position.addScaledVector(_v.multiplyScalar(1/len), step);
    }
  }
}

/* how much hotter one dot from this sample's heater makes it */
function dotRise(s){
  if(!s.heat) return 0;
  return s.heat.dT != null ? s.heat.dT : s.heat.q/(s.n*EPP);
}
function addEnergy(s, dots){
  s.tempC += dotRise(s)*dots;
  if(s.tempC >= s.target){ s.tempC = s.target; s.heatOn = false; }
}

/* ---------------------------------------------------------- the particles */
const GAS_SP = 1.85;
const C_HOT = new THREE.Color(COL.hot), C_FAST = new THREE.Color(COL.fast);

function updateParticles(s, dt){
  const TK = s.tempC + K0;
  const f  = spFactor(TK);
  const avgCol = new THREE.Color();

  if(s.cfg.tempColour){
    const t = clamp((s.tempC - s.tScale[0])/(s.tScale[1]-s.tScale[0]), 0, 1);
    avgCol.set(COL.cold).lerp(C_HOT, t).convertSRGBToLinear();
    if(!s.ownMats) s.sharedMat.color.copy(avgCol);
  }

  for(let i=0;i<s.parts.length;i++){
    const p = s.parts[i];

    p.reroll -= dt;
    if(p.reroll <= 0){ p.sf = rollSpeed(); p.reroll = rand(0.35, 0.9); }

    if(s.state === 'solid'){
      // held in place by the ones around it — all it can do is vibrate
      const rate = 5.2*f*p.sf;
      p.ph.x += rate*p.fr.x*dt; p.ph.y += rate*p.fr.y*dt; p.ph.z += rate*p.fr.z*dt;
      const a = Math.min(VIB_MAX, 0.065*f*f) * p.amp;
      p.pos.set(p.home.x + a*Math.sin(p.ph.x),
                p.home.y + a*Math.sin(p.ph.y),
                p.home.z + a*Math.sin(p.ph.z));
    } else {
      const sp = GAS_SP*f*p.sf*(s.state === 'liquid' ? 0.55 : 1);
      p.vel.x += (Math.random()-0.5)*(s.state === 'liquid' ? 9 : 3.2)*dt;
      p.vel.y += (Math.random()-0.5)*(s.state === 'liquid' ? 9 : 3.2)*dt;
      p.vel.z += (Math.random()-0.5)*(s.state === 'liquid' ? 9 : 3.2)*dt;
      p.vel.normalize();
      const r = p.r;
      p.pos.addScaledVector(p.vel, sp*dt);
      if(p.pos.x < -s.w/2+r){ p.pos.x = -s.w/2+r; p.vel.x =  Math.abs(p.vel.x); }
      if(p.pos.x >  s.w/2-r){ p.pos.x =  s.w/2-r; p.vel.x = -Math.abs(p.vel.x); }
      if(p.pos.z < -s.d/2+r){ p.pos.z = -s.d/2+r; p.vel.z =  Math.abs(p.vel.z); }
      if(p.pos.z >  s.d/2-r){ p.pos.z =  s.d/2-r; p.vel.z = -Math.abs(p.vel.z); }
      if(p.pos.y < r+0.03){ p.pos.y = r+0.03; p.vel.y = Math.abs(p.vel.y); }
      if(p.pos.y > p.top-r){ p.pos.y = p.top-r; p.vel.y = -Math.abs(p.vel.y); }
    }
    p.mesh.position.copy(p.pos);

    /* colour */
    if(s.ownMats){
      const m = p.mesh.material;
      if(s.cfg.speedColour){
        const t = clamp((p.sf - 0.55)/0.95, 0, 1);
        m.color.set(COL.slow).lerp(C_FAST, t).convertSRGBToLinear();
      } else if(s.cfg.tempColour){
        m.color.copy(avgCol);
      }
      if(p.flash > 0){
        p.flash = Math.max(0, p.flash - dt*1.5);
        m.emissive.set(COL.energy).convertSRGBToLinear().multiplyScalar(0.15 + p.flash*1.4);
      } else {
        m.emissive.copy(m.color).multiplyScalar(0.12);
      }
    }
  }
}

function updateReadouts(s, barMax){
  // most bars show the whole store; in the "same energy in" scene they show
  // only what the heater has delivered, so the two can be compared directly
  const E = s.cfg.barOf === 'added' ? energyOf(s) - s.E0 : energyOf(s);
  if(s.thermo){
    const frac = clamp((s.tempC - s.tScale[0])/(s.tScale[1]-s.tScale[0]), 0, 1);
    const hgt = Math.max(0.05, frac*s.thermo.TH);
    s.thermo.merc.scale.y = hgt;
    s.thermo.merc.position.y = 0.5 + hgt/2;
    const shown = Math.round(s.tempC);
    if(shown !== s.shownT){
      s.shownT = shown;
      setLabel(s.thermo.read, shown + ' °C');
    }
  }
  if(s.bar){
    const frac = clamp(E/barMax, 0, 1);
    const hgt = Math.max(0.02, frac*s.bar.BH);
    s.bar.fill.scale.y = hgt;
    s.bar.fill.position.y = 0.4 + hgt/2;
    const shown = Math.round(E);
    if(shown !== s.shownE){
      s.shownE = shown;
      setLabel(s.bar.read, fmtKJ(E));
    }
  }
  if(s.plate){
    const on = s.heatOn ? 0.8 + 0.25*Math.sin(performance.now()/120) : 0.05;
    s.plate.material.emissive.set(COL.heater).convertSRGBToLinear().multiplyScalar(on);
  }
}

    look:'"Hot" and "has a lot of energy" are two different claims. Energy still flows from the spark to you, because it is the hotter one.',
    terms:[]
  }
];
/* ------------------------------------------------------------ scene state */
let sceneIdx = 0, samples = [], cardRefs = [], metricKeys = DEFAULT_METRICS;
let barMax = 1, crossAcc = 0, xtra = null, eqLabel = null, eqArrow = null;

/* the highest the bar will have to show in this scene, so the bars stay
   comparable with each other and do not jump about as things heat up */
function peakBarValue(s){
  let t = s.tempC;
  if(isFinite(s.target)) t = Math.max(t, s.target);
  if(s.heat && s.heat.stopAfter) t = Math.max(t, s.tempC + s.heat.rate*dotRise(s)*s.heat.stopAfter);
  return s.cfg.barOf === 'added' ? Math.max(1, s.n*(t - s.tempC0)*EPP) : s.n*(t + K0)*EPP;
}

function enterScene(i){
  sceneIdx = i;
  const sc = SCENES[i];

  samples.forEach(s=>{ scene.remove(s.group); disposeTree(s.group); });
  if(xtra){ scene.remove(xtra); disposeTree(xtra); xtra = null; }
  eqLabel = eqArrow = null;
  crossAcc = 0;

  samples = sc.samples.map(buildSample);
  metricKeys = sc.metrics || DEFAULT_METRICS;
  barMax = Math.max.apply(null, samples.map(peakBarValue)) * 1.08;

  if(sc.transfer){
    xtra = new THREE.Group(); scene.add(xtra);
    eqArrow = makeArrow(1, COL.energy);
    eqArrow.position.set(0, 1.5, 0); eqArrow.scale.setScalar(1.3);
    xtra.add(eqArrow);
    eqLabel = makeLabel('energy transferred', {scale:0.4, color:hexCss(COL.energy)});
    eqLabel.position.set(0, 2.5, 0); xtra.add(eqLabel);
    linearise(xtra);
  }

  document.getElementById('sStep').textContent = (i+1)+' / '+SCENES.length+' · '+sc.part;
  document.getElementById('sTitle').innerHTML = sc.title;
  document.getElementById('sText').innerHTML = sc.text;
  const lookEl = document.getElementById('sLook');
  lookEl.textContent = sc.look ? 'Watch for: '+sc.look : '';
  lookEl.hidden = !sc.look;
  const termsEl = document.getElementById('sTerms');
  termsEl.innerHTML = sc.terms.length
    ? '<div class="hd">Key words</div>' + sc.terms.map(t=>'<dt>'+t[0]+'</dt><dd>'+t[1]+'</dd>').join('')
    : '';
  termsEl.hidden = !sc.terms.length;

  document.getElementById('back').disabled = (i === 0);
  document.getElementById('next').disabled = (i === SCENES.length-1);
  document.querySelectorAll('#dots i').forEach((d,k)=>d.classList.toggle('on', k === i));

  desired.dist = sc.cam.dist; desired.az = sc.cam.az; desired.el = sc.cam.el;
  desired.look.set(sc.cam.look[0], sc.cam.look[1], sc.cam.look[2]);

  buildCards();
  buildKey();
}

function buildCards(){
  const box = document.getElementById('cards');
  box.innerHTML = '';
  cardRefs = samples.map(s=>{
    const c = s.cfg, card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="who" style="color:'+(c.nameCol || '#eef2f7')+'">'+(c.name || 'Sample')+'</div>'+
      '<div class="nums">'+
      metricKeys.map(k=>'<div class="n'+(M[k].hot?' hot':'')+'">'+M[k].label+'<b>—</b></div>').join('')+
      '</div>';
    box.appendChild(card);
    return Array.prototype.slice.call(card.querySelectorAll('b'));
  });
}

function buildKey(){
  const sc = SCENES[sceneIdx];
  let html = '';
  if(samples.some(s=>s.cfg.speedColour)){
    html += '<div><span class="dot" style="background:'+hexCss(COL.fast)+'"></span>fast particle</div>';
    html += '<div><span class="dot" style="background:'+hexCss(COL.slow)+'"></span>slow particle</div>';
  } else {
    html += '<div><span class="dot" style="background:'+hexCss(COL.particle)+'"></span>particle</div>';
  }
  if(samples.some(s=>s.heat) || sc.transfer)
    html += '<div><span class="dot" style="background:'+hexCss(COL.energy)+'"></span>energy arriving</div>';
  if(samples.some(s=>s.thermo))
    html += '<div><span class="sq" style="background:'+hexCss(COL.mercury)+'"></span>thermometer · °C</div>';
  if(samples.some(s=>s.bar))
    html += '<div><span class="sq" style="background:'+hexCss(COL.energy)+'"></span>'+
            (samples.some(s=>s.cfg.barOf === 'added') ? 'energy put in · kJ' : 'thermal energy store · kJ')+'</div>';
  document.getElementById('key').innerHTML = html;
}

/* ------------------------------------------------------------ camera orbit */
const desired = {dist:14, az:0, el:0.26, look:new THREE.Vector3(0,1.6,0)};
const cur     = {dist:14, az:0, el:0.26, look:new THREE.Vector3(0,1.6,0)};
let dragAz = 0, dragEl = 0, zoomAdj = 0;
let dragging = false, lastX = 0, lastY = 0;

const cv = renderer.domElement;
cv.style.touchAction = 'none';
cv.style.cursor = 'grab';
cv.addEventListener('pointerdown', e=>{
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  cv.style.cursor = 'grabbing';
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e=>{
  if(!dragging) return;
  dragAz += (e.clientX - lastX) * 0.006;
  dragEl = Math.max(-0.4, Math.min(1.05, dragEl + (e.clientY - lastY) * 0.004));
  lastX = e.clientX; lastY = e.clientY;
});
['pointerup','pointercancel'].forEach(ev=>
  cv.addEventListener(ev, ()=>{ dragging = false; cv.style.cursor = 'grab'; }));
cv.addEventListener('wheel', e=>{
  e.preventDefault();
  zoomAdj = Math.max(-9, Math.min(24, zoomAdj + e.deltaY*0.008));
}, {passive:false});

function placeCamera(dt){
  const k = Math.min(1, dt*2.6);
  cur.dist += (desired.dist - cur.dist)*k;
  cur.az   += (desired.az   - cur.az)*k;
  cur.el   += (desired.el   - cur.el)*k;
  cur.look.lerp(desired.look, k);
  const az = cur.az + dragAz, el = cur.el + dragEl;
  const d = Math.max(4, cur.dist + zoomAdj);
  camera.position.set(
    cur.look.x + d*Math.cos(el)*Math.sin(az),
    cur.look.y + d*Math.sin(el),
    cur.look.z + d*Math.cos(el)*Math.cos(az)
  );
  camera.lookAt(cur.look);
}

/* ------------------------------------------------------------------- loop */
const TR_K = 0.2;          // kJ per second for every degree of difference

let lastT = performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - lastT)/1000);
  lastT = now;

  /* energy crossing between two objects in contact */
  if(SCENES[sceneIdx].transfer && samples.length >= 2){
    const A = samples[0], B = samples[1];
    const dT = A.tempC - B.tempC;
    if(Math.abs(dT) > 0.12){
      const q = TR_K*dT*dt;
      A.tempC -= q/(A.n*EPP);
      B.tempC += q/(B.n*EPP);
      crossAcc += dt * 9 * Math.min(1, Math.abs(dT)/45);
      while(crossAcc >= 1){
        crossAcc -= 1;
        spawnCrossDot(dT > 0 ? A : B, dT > 0 ? B : A);
      }
    }
    if(eqArrow){
      const settled = Math.abs(dT) < 0.9;
      eqArrow.visible = !settled;
      if(settled !== eqArrow.userData.settled){
        eqArrow.userData.settled = settled;
        setLabel(eqLabel, settled ? 'equilibrium — no more net transfer' : 'energy transferred',
          {scale:0.4, color: settled ? '#7fe0a8' : hexCss(COL.energy)});
      }
    }
  }

  samples.forEach((s, si)=>{
    if(s.heatOn){
      s.heatT += dt;
      if(s.heat.stopAfter && s.heatT >= s.heat.stopAfter){
        s.heatOn = false;
      } else {
        s.spawnAcc += dt*s.heat.rate;
        while(s.spawnAcc >= 1){ s.spawnAcc -= 1; spawnHeatDot(s); }
      }
    }
    updateDots(s, dt);
    updateParticles(s, dt);
    updateReadouts(s, barMax);

    const refs = cardRefs[si];
    if(refs) metricKeys.forEach((k, mi)=>{
      const v = M[k].fmt(s);
      if(refs[mi].textContent !== String(v)) refs[mi].textContent = v;
    });
  });

  placeCamera(dt);
  renderer.render(scene, camera);
}

/* ------------------------------------------------------------------ wiring */
const dotsEl = document.getElementById('dots');
SCENES.forEach((s,i)=>{
  const d = document.createElement('i');
  d.title = s.title;
  d.addEventListener('click', ()=>enterScene(i));
  dotsEl.appendChild(d);
});
document.getElementById('next').addEventListener('click', ()=>{
  if(sceneIdx < SCENES.length-1) enterScene(sceneIdx+1);
});
document.getElementById('back').addEventListener('click', ()=>{
  if(sceneIdx > 0) enterScene(sceneIdx-1);
});
document.getElementById('replay').addEventListener('click', ()=>enterScene(sceneIdx));
window.addEventListener('keydown', e=>{
  if(e.key === 'ArrowRight' && sceneIdx < SCENES.length-1) enterScene(sceneIdx+1);
  if(e.key === 'ArrowLeft'  && sceneIdx > 0) enterScene(sceneIdx-1);
});

function resize(){
  const w = stage.clientWidth || window.innerWidth;
  const h = stage.clientHeight || window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w/h;
  camera.fov = (w/h < 1.1) ? 62 : 44;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

enterScene(0);
requestAnimationFrame(animate);
</script>
</body>
</html>
