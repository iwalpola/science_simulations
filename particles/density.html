<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Density — the 3D story</title>
<style>
  :root{
    --ink:#eef2f7;
    --dim:#93a2b6;
    --panel:rgba(10,14,21,.78);
    --line:rgba(147,162,182,.22);
    --side:376px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:#080b11;color:var(--ink);overflow:hidden;
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}

  #stage{position:fixed;top:0;right:0;bottom:0;left:var(--side);}
  canvas{display:block;}
  #fade{position:fixed;top:0;right:0;bottom:0;left:var(--side);background:#080b11;
    opacity:0;pointer-events:none;z-index:2;}

  #side{
    position:fixed;top:0;left:0;bottom:0;width:var(--side);
    background:var(--panel);backdrop-filter:blur(16px);
    border-right:1px solid var(--line);
    padding:20px 22px 16px;
    display:flex;flex-direction:column;gap:14px;
    overflow-y:auto;
  }
  #side h1{
    margin:0;
    font-family:"Iowan Old Style","Charter","Palatino Linotype",Georgia,serif;
    font-weight:600;font-size:19px;letter-spacing:.2px;line-height:1.25;
  }
  #side .byline{margin:4px 0 0;font-size:12px;line-height:1.5;color:var(--dim);}
  #side a{color:var(--dim);text-decoration:none;font-size:12px;
    border-bottom:1px solid rgba(147,162,182,.3);}
  #side a:hover{color:var(--ink);}
  .links{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;}

  .cards{display:flex;flex-direction:column;gap:8px;}
  .card{
    background:rgba(255,255,255,.04);
    border:1px solid var(--line);border-radius:11px;
    padding:8px 12px;
  }
  .card .who{font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;}
  .card .nums{display:flex;gap:12px;flex-wrap:wrap;margin-top:5px;}
  .card .n{font-size:10px;color:var(--dim);line-height:1.2;}
  .card .n b{display:block;color:var(--ink);font-size:15px;font-weight:600;
    font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap;}
  .card .n.hot b{color:#ffd27a;}

  .story{flex:1;min-height:0;}
  .story .step{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;}
  .story h2{
    margin:3px 0 0;font-family:"Iowan Old Style","Charter",Georgia,serif;
    font-size:17px;font-weight:600;letter-spacing:.2px;
  }
  .story p{margin:8px 0 0;font-size:13px;line-height:1.62;color:#cbd5e1;}
  .story p b{color:#ffd9a0;font-weight:600;}
  .story .look{
    margin-top:10px;font-size:12px;line-height:1.5;color:#a9c7ee;
    border-left:2px solid rgba(127,176,255,.45);padding-left:10px;
  }
  .story .scale{
    margin-top:10px;font-size:12px;line-height:1.5;color:#c9b8e0;
    border-left:2px solid rgba(190,150,240,.45);padding-left:10px;
  }
  .formula{
    margin:10px 0 0;padding:10px 12px;text-align:center;
    font-family:"Iowan Old Style","Charter",Georgia,serif;font-size:16px;color:#ffe2a8;
    background:rgba(255,210,122,.07);border:1px solid rgba(255,210,122,.3);border-radius:10px;
  }
  .formula small{display:block;font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:11.5px;color:#cbb88f;margin-top:4px;}
  .terms{
    margin:12px 0 0;padding:10px 12px;
    background:rgba(255,217,160,.05);border:1px solid rgba(255,217,160,.18);border-radius:10px;
  }
  .terms .hd{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#d9b98a;font-weight:700;margin-bottom:6px;}
  .terms dt{font-size:12.5px;font-weight:700;color:#ffd9a0;}
  .terms dd{margin:1px 0 7px;font-size:12.5px;line-height:1.5;color:#cbd5e1;}
  .terms dd:last-child{margin-bottom:0;}

  table.sum{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px;}
  table.sum th,table.sum td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);}
  table.sum th{color:var(--dim);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;}
  table.sum td{color:#cbd5e1;font-variant-numeric:tabular-nums;}
  table.sum td:first-child{color:var(--ink);font-weight:600;}
  table.sum td:last-child{text-align:right;}

  .nav{
    position:fixed;left:var(--side);right:0;bottom:20px;z-index:5;
    margin:0 auto;width:fit-content;max-width:calc(100% - var(--side) - 32px);
    display:flex;align-items:center;gap:8px;flex-wrap:nowrap;justify-content:center;
    background:var(--panel);backdrop-filter:blur(16px);
    border:1px solid var(--line);border-radius:999px;
    padding:9px 12px;white-space:nowrap;
  }
  .nav button{
    font:inherit;font-size:12.5px;font-weight:500;color:var(--dim);
    background:rgba(255,255,255,.05);border:1px solid var(--line);
    border-radius:999px;padding:7px 14px;cursor:pointer;
    transition:background .15s ease,color .15s ease,opacity .15s ease;
  }
  .nav button:hover:not(:disabled){background:rgba(255,255,255,.12);color:var(--ink);}
  .nav button:disabled{opacity:.32;cursor:default;}
  .nav button.primary{background:rgba(127,176,255,.2);color:#dce9ff;border-color:rgba(127,176,255,.35);}
  .dots{display:flex;gap:6px;padding:0 4px;}
  .dots i{
    width:7px;height:7px;border-radius:50%;background:rgba(147,162,182,.3);
    cursor:pointer;transition:background .2s ease,transform .2s ease;
  }
  .dots i.on{background:var(--ink);transform:scale(1.25);}

  #key{
    position:fixed;top:18px;right:20px;z-index:5;
    background:var(--panel);backdrop-filter:blur(16px);
    border:1px solid var(--line);border-radius:12px;
    padding:11px 14px;
    font-size:11.5px;line-height:1.75;color:var(--dim);
  }
  #key:empty{display:none;}
  #key div{display:flex;align-items:center;gap:8px;}
  .dot{width:11px;height:11px;border-radius:50%;flex:none;
    box-shadow:inset -2px -2px 3px rgba(0,0,0,.45);}

  .hint{
    position:fixed;right:20px;bottom:20px;z-index:3;
    font-size:11px;color:#5a687d;pointer-events:none;
  }

  @media (max-width:860px){
    :root{--side:0px;}
    #stage,#fade{left:0;bottom:44vh;}
    #side{
      top:auto;left:0;right:0;bottom:0;width:auto;height:44vh;
      border-right:none;border-top:1px solid var(--line);
      padding:14px 16px;gap:11px;
    }
    #side h1{font-size:16px;}
    #side .byline{display:none;}
    .cards{flex-direction:row;}
    .card{flex:1;min-width:0;}
    .card .nums{gap:8px;}
    .card .n b{font-size:13px;}
    .nav{
      left:0;right:0;bottom:44vh;
      width:auto;max-width:none;margin:0;
      border-radius:0;border-width:1px 0 0;
      flex-wrap:wrap;white-space:normal;justify-content:center;
    }
    #key{top:14px;right:14px;padding:8px 10px;font-size:11px;line-height:1.6;}
    .hint{display:none;}
  }
</style>
</head>
<body>

<div id="stage"></div>
<div id="fade"></div>

<div id="side">
  <div>
    <h1>Density</h1>
    <p class="byline">How much mass is packed into each bit of space</p>
    <div class="links">
      <a href="./index.html">← Particle model</a>
      <a href="../index.html">All simulations</a>
    </div>
  </div>

  <div class="cards" id="cards"></div>

  <div class="story">
    <div class="step" id="sStep"></div>
    <h2 id="sTitle"></h2>
    <p id="sText"></p>
    <div class="formula" id="sFormula"></div>
    <div class="look" id="sLook"></div>
    <div class="scale" id="sScale"></div>
    <dl class="terms" id="sTerms"></dl>
  </div>
</div>

<!-- outside #side: its backdrop-filter would otherwise pin fixed children to the column -->
<div class="nav">
  <button id="back">← Back</button>
  <button id="next" class="primary">Next →</button>
  <button id="replay">Replay</button>
  <div class="dots" id="dots"></div>
</div>

<div id="key"></div>

<div class="hint">drag to orbit · scroll to zoom</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===========================================================================
   DENSITY — the 3D story

   Nine chapters, from the kitchen to the definition and back to the particles:

     0  sugar into candy floss  — the same 20 g on the same scale the whole
                                  time, while its volume grows hundreds of
                                  times
     1  zoom in                 — the same molecules, spread out into threads
                                  with air between them
     2  cake and brownie        — two slices the same size, very different
                                  masses
     3  same volume             — three 10 cm cubes weighed: density is the
                                  mass in each bit of volume
     4  same mass               — a kilogram of each: the denser, the smaller
     5  heavier atoms           — inside aluminium and iron: iron's atoms are
                                  about twice as heavy and a little closer
     6  solid, liquid, gas      — the same gold atoms packed three ways
     7  water is unusual        — solid wax sinks in melted wax; ice floats
     8  the ladder              — everything so far on one scale, with air and
                                  water for reference

   One scene unit is 10 cm, so every object is drawn at its real size: the
   floss cloud is the size its volume says, and every cube is cut to the side
   its volume says.

   EVERY NUMBER IS DERIVED. The tables below hold masses and densities; the
   volumes, the cube sides, the scale readings, the cards and every figure in
   a caption are worked out from them, and test-render.js checks that.

   EVERYTHING IS A PURE FUNCTION OF THE CHAPTER'S OWN CLOCK t, as in
   convection.html and conduction.html.
=========================================================================== */

/* ------------------------------------------------------------ the numbers */
const UNIT_CM = 10;                     // one scene unit, in centimetres

/* the kitchen: grams, cm³, g/cm³ */
const SUGAR = {mass:20, rho:1.59};      // the crystals themselves (sucrose), g/cm³
const FLOSS_V = 5000;                   // cm³: a cone of floss about 21 cm across
const SLICE = {w:8, d:6, h:5};          // cm
const CAKE_RHO = 0.35, BROWNIE_RHO = 0.95;   // g/cm³, typical — every recipe differs

const SUGAR_V   = SUGAR.mass/SUGAR.rho;            // cm³
const FLOSS_RHO = SUGAR.mass/FLOSS_V;              // g/cm³
const SLICE_V   = SLICE.w*SLICE.d*SLICE.h;         // cm³
const CAKE_M    = Math.round(CAKE_RHO*SLICE_V);    // g
const BROWNIE_M = Math.round(BROWNIE_RHO*SLICE_V); // g

/* the lab: kilograms, m³, kg/m³ */
const SOLIDS = {
  wood     :{name:'pine wood', rho:500,  col:0xd9b27c},
  aluminium:{name:'aluminium', rho:2700, col:0xc9cfd6},
  iron     :{name:'iron',      rho:7870, col:0x8f9298}   // the iron of 3dreactionscenes/
};
const SOLID_KEYS = ['wood','aluminium','iron'];
const CUBE_CM = 10;                                 // chapter 3: every cube 10 cm along a side
const CUBE_V_M3 = Math.pow(CUBE_CM, 3)/1e6;          // 0.001 m³ (from cm³, so it prints exactly)
const SAME_M = 1;                                   // chapter 4: a kilogram of each
const massOfCube = k => SOLIDS[k].rho*CUBE_V_M3;                  // kg
const volOfKilo  = k => SAME_M/SOLIDS[k].rho*1e6;                 // cm³
const sideOfKilo = k => Math.cbrt(volOfKilo(k));                  // cm

const CH_LADDER = 8;                                // the chapter the ladder belongs to
const AIR_RHO = 1.2, WATER_RHO = 1000;              // kg/m³, for the ladder

/* the ladder, in kg/m³: food goes from g/cm³ to kg/m³ by ×1000 */
const LADDER = [
  {name:'air',         rho:AIR_RHO,            col:0x9aa8b8},
  {name:'candy floss', rho:FLOSS_RHO*1000,     col:0xf7a8cf},
  {name:'sponge cake', rho:CAKE_RHO*1000,      col:0xe9c27a},
  {name:'pine wood',   rho:SOLIDS.wood.rho,    col:SOLIDS.wood.col},
  {name:'brownie',     rho:BROWNIE_RHO*1000,   col:0x6a3a22},
  {name:'water',       rho:WATER_RHO,          col:0x5aa9ff},
  {name:'sugar',       rho:SUGAR.rho*1000,     col:0xf1ede4},
  {name:'aluminium',   rho:SOLIDS.aluminium.rho, col:SOLIDS.aluminium.col},
  {name:'iron',        rho:SOLIDS.iron.rho,    col:SOLIDS.iron.col}
];

/* ----------------------------------------------------------------- helpers */
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const lerp  = (a,b,u) => a + (b-a)*u;
const ss = (a,b,x) => { const u = clamp((x-a)/(b-a),0,1); return u*u*(3-2*u); };
const hexCss = n => '#'+n.toString(16).padStart(6,'0');
const sig = (x, n) => String(Number(x.toPrecision(n)));          // 0.004, 0.35, 1.59
const grp = x => Math.round(x).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');

function rng(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash(i){
  let x = Math.imul(i|0, 0x9E3779B1);
  x ^= x >>> 16; x = Math.imul(x, 0x85EBCA6B);
  x ^= x >>> 13; x = Math.imul(x, 0xC2B2AE35);
  x ^= x >>> 16;
  return (x >>> 0)/4294967296;
}

/* the figures the captions quote */
const FIG = {
  flossTimes: Number((SUGAR.rho/FLOSS_RHO).toPrecision(1)),          // how many times less dense
  flossAir:   ((1 - FLOSS_RHO/SUGAR.rho)*100).toFixed(1),            // % of the floss that is air
  flossVolTimes: Number((FLOSS_V/SUGAR_V).toPrecision(1))
};

/* =========================================================================
   THE SCALE READING
========================================================================= */
/* A load arrives at time `at`. The display jumps, overshoots a little and
   settles, like a real kitchen scale. */
const SETTLE = 1.1;
function settle(s){ return s <= 0 ? 0 : 1 - Math.exp(-6*s)*Math.cos(10*s); }
const readingAt = (m, at, t) => m*settle(t - at);
const settledAt = (at, t) => t - at >= SETTLE;

/* ----- chapter 0: the sugar ----- */
const N_CRY = 260;
const POUR0 = 0.8, POUR1 = 2.2, FALL = 0.35;       // crystals land between these
const SPIN0 = 3.6, SPIN1 = 8.6, RISE = 0.9;         // and are spun into floss between these
/* crystal order: the bottom of the heap lands first, the top is spun first */
const CRY = (function(){
  const R = rng(5), out = [];
  const r = 0.3, h = 3*(SUGAR_V/1000)/(Math.PI*r*r);   // a cone holding the sugar's volume, in units
  while(out.length < N_CRY){
    const x = (R()*2-1)*r, z = (R()*2-1)*r, y = R()*h;
    if(Math.hypot(x, z) > r*(1 - y/h)) continue;
    out.push({x, y, z, rx:R()*6.3, ry:R()*6.3, ang:R()*6.3, fr:R(), fy:R()});
  }
  out.sort((a,b)=>a.y - b.y);
  out.forEach((c,i)=>{
    c.land = POUR0 + (POUR1 - POUR0)*i/(N_CRY-1);
    c.rise = SPIN0 + (SPIN1 - SPIN0 - RISE)*(N_CRY-1-i)/(N_CRY-1);
  });
  return {list:out, h, r};
})();
/* how much of the sugar has landed, and how much has been spun into floss */
function sugarState(t){
  let landed = 0, spun = 0;
  for(const c of CRY.list){
    if(t >= c.land) landed++;
    spun += ss(c.rise, c.rise + RISE, t);
  }
  landed /= N_CRY; spun /= N_CRY;
  const mass = SUGAR.mass*landed;                              // spinning does not change the mass
  const vol  = SUGAR_V*(landed - spun) + FLOSS_V*spun;         // what is left as crystals + the floss
  return {landed, spun, mass, vol, rho: vol > 0 ? mass/vol : 0};
}

/* ----- chapter 1: the molecules ----- */
const MOL = (function(){
  const R = rng(17), A = 0.42, nx = 6, ny = 5, nz = 4, n = nx*ny*nz;
  const home = [], slot = [];
  for(let i=0;i<nx;i++) for(let j=0;j<ny;j++) for(let k=0;k<nz;k++)
    home.push([(i - (nx-1)/2)*A, (j - (ny-1)/2)*A - 0.6, (k - (nz-1)/2)*A]);
  /* six threads, each a pair of rows of molecules, wandering across a box
     much bigger than the crystal */
  const TH = 6, per = n/TH;
  for(let j=0;j<TH;j++){
    const y0 = -2.1 + j*0.84, z0 = (j % 2 ? 0.7 : -0.7), ph = R()*6.3, x0 = -4 + R()*1.2;
    for(let k=0;k<per;k++){
      const u = Math.floor(k/2)/(per/2 - 1), side = k % 2 ? 1 : -1;
      slot.push([x0 + 6.6*u, y0 + 0.35*Math.sin(6.3*u + ph) + side*0.2, z0 + 0.45*Math.cos(4.4*u + ph)]);
    }
  }
  /* send each molecule to a nearby slot: sort both by x */
  const hi = home.map((p,i)=>i).sort((a,b)=>home[a][0]-home[b][0] || home[b][1]-home[a][1]);
  const si = slot.map((p,i)=>i).sort((a,b)=>slot[a][0]-slot[b][0]);
  const go = new Array(n);
  hi.forEach((h,k)=>{ go[h] = si[k]; });
  /* the top of the crystal goes first */
  const order = home.map((p,i)=>i).sort((a,b)=>home[b][1]-home[a][1]);
  const start = new Array(n);
  order.forEach((m,k)=>{ start[m] = 1.6 + 5.4*k/(n-1); });
  return {n, A, home, slot, go, start, box0:[nx*A, ny*A, nz*A], box1:[9.4, 5.8, 3.0]};
})();
const MOL_DUR = 1.3, MOL_R = 0.17;
function moleculeAt(i, t, out){
  const h = MOL.home[i], s = MOL.slot[MOL.go[i]];
  const u = ss(MOL.start[i], MOL.start[i] + MOL_DUR, t);
  for(let a=0;a<3;a++) out[a] = lerp(h[a], s[a], u);
  out[1] += 0.9*Math.sin(Math.PI*u);                 // up and over
  const jig = 0.025;
  for(let a=0;a<3;a++) out[a] += jig*Math.sin(9*(1 + 0.3*hash(i*3+a))*t + 6.3*hash(i*7+a));
  return u;
}
const molSpread = t => { let s = 0; for(let i=0;i<MOL.n;i++) s += ss(MOL.start[i], MOL.start[i] + MOL_DUR, t); return s/MOL.n; };

/* =========================================================================
   THREE
========================================================================= */
const stage = document.getElementById('stage');
const fadeEl = document.getElementById('fade');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080b11);
scene.fog = new THREE.Fog(0x080b11, 40, 90);
const camera = new THREE.PerspectiveCamera(44, 1, 0.03, 200);

scene.add(new THREE.HemisphereLight(0x9fb4d0, 0x0a0d13, 0.6));
const keyL  = new THREE.DirectionalLight(0xffffff, 0.95); keyL.position.set(6,11,8); scene.add(keyL);
const fillL = new THREE.DirectionalLight(0x9ec3ff, 0.40); fillL.position.set(-8,4,-6); scene.add(fillL);
const rimL  = new THREE.DirectionalLight(0xffd9b0, 0.32); rimL.position.set(0,3,-10); scene.add(rimL);

(function environment(){
  const env = new THREE.Scene();
  const box = new THREE.BoxGeometry(1,1,1);
  env.add(new THREE.Mesh(new THREE.BoxGeometry(30,18,30),
    new THREE.MeshBasicMaterial({color:0x1d2634, side:THREE.BackSide})));
  const panel=(hex,gain,x,y,z,sx,sy,sz)=>{
    const m=new THREE.Mesh(box,new THREE.MeshBasicMaterial({color:hex}));
    m.material.color.multiplyScalar(gain);
    m.position.set(x,y,z); m.scale.set(sx,sy,sz); env.add(m);
  };
  panel(0xffffff,1.1,  0, 8.4,  0, 14,0.1,14);
  panel(0xbcd6ff,1.3,-11, 1.5,  0, 0.1,11,20);
  panel(0xffd7b0,0.9, 11, 1.5,  2, 0.1,11,20);
  panel(0x8fb0e0,0.5,  0, 0.0,-12, 22,11,0.1);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(env, 0.04).texture;
  pmrem.dispose();
})();

const SPH = new THREE.SphereGeometry(1,20,14);
const CYL = new THREE.CylinderGeometry(1,1,1,16);
const BOX = new THREE.BoxGeometry(1,1,1);

function linearise(root){
  root.traverse(o=>{
    if(!o.material) return;
    (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{
      if(!m || m.userData.__lin) return;
      m.userData.__lin = true;
      if(m.color)    m.color.convertSRGBToLinear();
      if(m.emissive) m.emissive.convertSRGBToLinear();
    });
  });
}
function canvasTex(w, h, paint){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  paint(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  return t;
}

/* the bench: a pool of light fading into the dark */
const bench = new THREE.Mesh(new THREE.CylinderGeometry(26,26,0.4,64),
  new THREE.MeshStandardMaterial({color:0x4a515d, roughness:0.94, metalness:0, envMapIntensity:0.10,
    map:canvasTex(512, 512, (x,S)=>{
      x.fillStyle = '#000'; x.fillRect(0,0,S,S);
      const g = x.createRadialGradient(S/2,S/2,0, S/2,S/2,S*0.5);

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}
function makeLabel(text, opt){
  opt = opt || {};
  const size = opt.size || 54, pad = opt.bg ? 26 : 18;
  const c = document.createElement('canvas'), ctx = c.getContext('2d');
  const font = (opt.weight || 600)+' '+size+'px "Iowan Old Style", Charter, Georgia, serif';
  ctx.font = font;
  const w = Math.ceil(ctx.measureText(text).width) + pad*2, h = size + pad*2;
  c.width = w; c.height = h;
  if(opt.bg){
    roundRect(ctx, 3, 3, w-6, h-6, (h-6)/2);
    ctx.fillStyle = opt.bg; ctx.fill();
    if(opt.border){ ctx.lineWidth = 4; ctx.strokeStyle = opt.border; ctx.stroke(); }
  }
  ctx.font = font; ctx.textAlign='center'; ctx.textBaseline='middle';
  if(!opt.bg){ ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 14; }
  ctx.fillStyle = opt.color || '#eef2f7';
  ctx.fillText(text, w/2, h/2 + size*0.04);
  const tex = new THREE.CanvasTexture(c); tex.anisotropy = 4;
  tex.encoding = THREE.sRGBEncoding;
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({
    map:tex, transparent:true, depthTest:false, depthWrite:false}));
  spr.renderOrder = 30;
  const scale = opt.scale || 0.3;
  spr.scale.set(w/h*scale, scale, 1);
  spr.userData.opt = opt; spr.userData.text = text;
  return spr;
}

const CUES = [];
function cue(ch, obj, t0, o){
  o = o || {};
  obj.traverse(m=>{ if(m.material){ m.material.transparent = true; if(m.userData.op == null) m.userData.op = m.material.opacity; }});
  CUES.push({ch, obj, t0, t1:o.t1, rise:o.rise || 0, base:obj.position.clone()});
  obj.visible = false;
  return obj;
}
function setOpacity(obj, a){
  obj.traverse(m=>{ if(m.material) m.material.opacity = a*(m.userData.op != null ? m.userData.op : 1); });
}
function runCues(ch, t){
  for(const c of CUES){
    if(c.ch !== ch){ c.obj.visible = false; continue; }
    let a = ss(c.t0, c.t0 + 0.6, t);
    if(c.t1 != null) a *= 1 - ss(c.t1, c.t1 + 0.5, t);
    c.obj.visible = a > 0.002;
    if(!c.obj.visible) continue;
    setOpacity(c.obj, a);
    c.obj.position.y = c.base.y + c.rise*ss(c.t0, c.t0 + 1.8, t);
  }
}

function lumpy(radius, seed, op){
  const geo = new THREE.IcosahedronGeometry(1, 4);
  const p = geo.attributes.position, v = new THREE.Vector3();
  for(let i=0;i<p.count;i++){
    v.fromBufferAttribute(p, i).normalize();
    const n = 1 + 0.08*Math.sin(5*v.x + seed) + 0.07*Math.sin(6*v.y + 2*seed) + 0.06*Math.sin(7*v.z + 3*seed)
                + 0.04*Math.sin(13*(v.x + v.y) + seed);
    p.setXYZ(i, v.x*radius*n, v.y*radius*n*0.92, v.z*radius*n);
  }
  geo.computeVertexNormals();
  return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color:0xf7a8cf, roughness:0.95,
    transparent:true, opacity:op, depthWrite:false, envMapIntensity:0.3}));
}

const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _v = new THREE.Vector3(), _s = new THREE.Vector3();
function updateSugar(t){
  const st = sugarState(t);
  CRY.list.forEach((c, i)=>{
    const hx = HEAP.x + c.x, hy = PLAT_TOP + c.y + CRY_S/2, hz = HEAP.z + c.z;
    let x, y, z, s = CRY_S;
    if(t < c.land - FALL){ s = 0; x = hx; y = hy; z = hz; }
    else if(t < c.land){
      /* falling from the spoon */
      const u = (t - (c.land - FALL))/FALL;
      x = lerp(HEAP.x, hx, u); z = lerp(HEAP.z, hz, u);
      y = lerp(PLAT_TOP + 1.3, hy, u*u);
    } else {
      /* spiralling up the stick into the floss */
      const u = ss(c.rise, c.rise + RISE, t);
      const fx = FLOSS_C.x + Math.cos(c.ang)*FLOSS_R*0.6*c.fr, fz = FLOSS_C.z + Math.sin(c.ang)*FLOSS_R*0.6*c.fr;
      const fy = FLOSS_C.y + (c.fy - 0.5)*FLOSS_R;
      const a = c.ang + u*Math.PI*3, rr = 0.35*Math.sin(Math.PI*u);
      x = lerp(hx, fx, u) + Math.cos(a)*rr;
      z = lerp(hz, fz, u) + Math.sin(a)*rr;
      y = lerp(hy, fy, u);
      s = CRY_S*(1 - ss(0.7, 1, u));
    }
    _e.set(c.rx + (t > c.rise ? t*4 : 0), c.ry, 0);
    _m4.compose(_v.set(x, y, z), _q.setFromEuler(_e), _s.set(s, s, s));
    cryMesh.setMatrixAt(i, _m4);
  });
  cryMesh.instanceMatrix.needsUpdate = true;

  const k = Math.cbrt(st.spun);
  floss.visible = st.spun > 1e-4;
  floss.scale.setScalar(Math.max(1e-3, k));
  threads.rotation.y = 2.2*t*(1 - ss(SPIN1, SPIN1 + 1, t)) + 2.2*SPIN1*ss(SPIN1, SPIN1 + 1, t);
  setScreen(sugarScale, fmtG(st.mass));
  sugarScale.plat.position.y = PLAT_TOP - 0.025 - 0.006*st.landed;
  return st;
}

/* n whole cells of a pattern filling a cube of side L, centred on the origin,
   offset a quarter of a cell so no atom sits on a face of the box */
function lattice(kind, n, L){
  const a = L/n, out = [];
  for(let i=0;i<n;i++) for(let j=0;j<n;j++) for(let k=0;k<n;k++) for(const b of BASIS[kind])
    out.push((i + b[0] + 0.25)*a - L/2, (j + b[1] + 0.25)*a - L/2, (k + b[2] + 0.25)*a - L/2);
  return new Float32Array(out);
}

const GOLD_RHO = {solid:19.3, liquid:17.3};                     // g/cm³

/* the liquid: the same atoms, jumbled and a little further apart — pushed
   apart from random starting places until none is closer than the spacing */
function relax(n, L, seed){
  const R = rng(seed), P = new Float32Array(n*3);
  const d = L/Math.cbrt(n), lim = L/2 - d/2;
  for(let i=0;i<n*3;i++) P[i] = (R()*2-1)*lim;
  for(let it=0; it<400; it++){
    for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){
      const dx = P[j*3]-P[i*3], dy = P[j*3+1]-P[i*3+1], dz = P[j*3+2]-P[i*3+2];
      const r2 = dx*dx+dy*dy+dz*dz;
      if(r2 >= d*d) continue;
      const r = Math.sqrt(r2) || 1e-6, push = (d - r)*0.25/r;
      P[i*3] -= dx*push; P[i*3+1] -= dy*push; P[i*3+2] -= dz*push;
      P[j*3] += dx*push; P[j*3+1] += dy*push; P[j*3+2] += dz*push;
    }
    for(let i=0;i<n*3;i++) P[i] = clamp(P[i], -lim, lim);
  }
  return P;
}

  return lerp(SURF + FCUBE/2, waxRest, ss(0, SINK, s - fall));
}
function iceY(t){
  const y0 = SURF + FCUBE/2 + DROP_H, fall = Math.sqrt(2*DROP_H/G_FALL);
  const s = t - ICE_AT;
  if(s < 0) return y0;
  if(s < fall) return y0 - 0.5*G_FALL*s*s;
  const u = s - fall, start = SURF + FCUBE/2;
  return iceRest + (start - iceRest)*Math.exp(-2.2*u)*Math.cos(6*u);
}
function updateFloat(t){
  waxCube.position.set(BEAK_X.wax, waxY(t), 0);
  waxCube.rotation.y = 0.3;
  iceCube.position.set(BEAK_X.water, iceY(t), 0);
  iceCube.rotation.y = -0.4;
}

/* ------------------------------------------------------------- the camera */
const FADE = 0.32;
function shotAt(Ch, t){
  let s0 = 0;
  for(let i=0;i<Ch.shots.length;i++){
    const sh = Ch.shots[i], end = sh.until != null ? sh.until : Infinity;
    if(t < end || i === Ch.shots.length-1){
      const u = ss(0, sh.dur, t - s0);
      let fade = 1 - clamp((t - s0)/FADE, 0, 1);
      if(isFinite(end)) fade = Math.max(fade, 1 - clamp((end - t)/FADE, 0, 1));
      return {world:sh.world, cam:lerpCam(sh.from, sh.to, u), fade, index:i};
    }
    s0 = end;
  }
}
function lerpCam(a, b, u){
  return {
    dist: Math.exp(lerp(Math.log(a.dist), Math.log(b.dist), u)),
    az: lerp(a.az, b.az, u), el: lerp(a.el, b.el, u),
    look:[lerp(a.look[0],b.look[0],u), lerp(a.look[1],b.look[1],u), lerp(a.look[2],b.look[2],u)]
  };
}
function worldAt(ch, t){ return shotAt(CH[ch], t).world; }

let dragAz = 0, dragEl = 0, zoomAdj = 0;
function applyCamera(c){
  const az = c.az + dragAz, el = clamp(c.el + dragEl, -0.4, 1.2);
  const d = Math.max(0.4, c.dist*Math.exp(zoomAdj));
  camera.position.set(
    c.look[0] + d*Math.cos(el)*Math.sin(az),
    c.look[1] + d*Math.sin(el),
    c.look[2] + d*Math.cos(el)*Math.cos(az));
  camera.lookAt(c.look[0], c.look[1], c.look[2]);
}

/* ---------------------------------------------------------------- a frame */
let cur = 0, cardRefs = [];

function frame(t){
  const Ch = CH[cur];
  const shot = shotAt(Ch, t);
  applyCamera(shot.cam);
  fadeEl.style.opacity = shot.fade.toFixed(3);

  const inMacro = shot.world === 'macro';
  micro.visible = !inMacro;
  bench.visible = inMacro;
  G.forEach((g, i)=>{ g.visible = inMacro && i === Ch.group; });

  if(inMacro){
    const tg = Ch.groupT ? Ch.groupT(t) : t;
    if(Ch.group === 0) updateSugar(tg);
    if(Ch.group === 6) updateFloat(t);
    if(Ch.group === 2){
      [[cake, CAKE_X, CAKE_AT, CAKE_M, cakeScale], [brownie, BROWNIE_X, BROWNIE_AT, BROWNIE_M, brownieScale]].forEach(s=>{
        place(s[0], s[1], SLICE.h/UNIT_CM, s[2], t);
        const r = readingAt(s[3], s[2] + DROP, t);
        setScreen(s[4], fmtG(r));
        s[4].plat.position.y = PLAT_TOP - 0.025 - 0.006*clamp(r/s[3], 0, 1.2);
      });
    }
    if(Ch.group === 3 || Ch.group === 4){
      const set = Ch.group === 3 ? SAME_V : SAME_MASS;
      set.forEach((c, i)=>{
        place(c.mesh, CUBE_X[i], c.side, CUBE_AT[i], tg);
        const m = Ch.group === 3 ? massOfCube(c.k) : SAME_M;
        const r = readingAt(m, CUBE_AT[i] + DROP, tg);
        setScreen(c.sc, fmtKg(r));
        c.sc.plat.position.y = PLAT_TOP - 0.025 - 0.008*clamp(r/m, 0, 1.2);
      });
    }
  } else {
    sugarMicro.forEach(o=>{ o.visible = Ch.micro === 'sugar'; });
    atomsG.visible  = Ch.micro === 'atoms';
    statesG.visible = Ch.micro === 'states';
    if(Ch.micro === 'sugar')  updateMolecules(t);
    if(Ch.micro === 'atoms')  updateAtoms(t);
    if(Ch.micro === 'states') updateStates(t);
  }

  /* the cards */
  const cards = cardsAt(cur, t);
  cards.forEach((c, i)=>{
    const r = cardRefs[i];
    if(!r) return;
    c.fields.forEach((f, k)=>{ if(r[k] && r[k].textContent !== f[1]) r[k].textContent = f[1]; });
  });

  runCues(cur, t);
  renderer.render(scene, camera);
}

let chStart = null;
function buildCards(i){
  const box = document.getElementById('cards');
  box.innerHTML = '';
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text) e.textContent = text;
    return e;
  };
  cardRefs = cardsAt(i, 0).map(c=>{
    const card = el('div', 'card'), who = el('div', 'who', c.name), nums = el('div', 'nums');
    who.style.color = c.col;
    const refs = c.fields.map(q=>{
      const n = el('div', 'n'+(q[2] ? ' hot' : ''), q[0]), b = el('b', '', '—');
      n.appendChild(b); nums.appendChild(n);
      return b;
    });
    card.appendChild(who); card.appendChild(nums);
    box.appendChild(card);
    return refs;
  });
}
function enterChapter(i){
  cur = i; chStart = null;
  dragAz = dragEl = zoomAdj = 0;
  const Ch = CH[i];
  document.getElementById('sStep').textContent = (i+1)+' / '+CH.length+' · '+Ch.part;

  const sc = document.getElementById('sScale');
  sc.textContent = Ch.scale || ''; sc.hidden = !Ch.scale;
  const tm = document.getElementById('sTerms');

    ? '<div class="hd">Key words</div>' + Ch.terms.map(x=>'<dt>'+x[0]+'</dt><dd>'+x[1]+'</dd>').join('')
    : '';
  tm.hidden = !Ch.terms.length;
  document.getElementById('key').innerHTML = Ch.key.map(k=>KEY[k]).join('');
  document.getElementById('back').disabled = i === 0;
  document.getElementById('next').disabled = i === CH.length-1;
  document.querySelectorAll('#dots i').forEach((d,k)=>d.classList.toggle('on', k === i));
  buildCards(i);
}

function animate(now){
  requestAnimationFrame(animate);
  if(chStart === null) chStart = now;

}

const dotsEl = document.getElementById('dots');
CH.forEach((c,i)=>{
  const d = document.createElement('i');
  d.title = c.title;
  d.addEventListener('click', ()=>enterChapter(i));
  dotsEl.appendChild(d);
});
document.getElementById('next').addEventListener('click', ()=>{ if(cur < CH.length-1) enterChapter(cur+1); });
document.getElementById('back').addEventListener('click', ()=>{ if(cur > 0) enterChapter(cur-1); });
document.getElementById('replay').addEventListener('click', ()=>enterChapter(cur));
window.addEventListener('keydown', e=>{
  if(e.key === 'ArrowRight' && cur < CH.length-1) enterChapter(cur+1);
  if(e.key === 'ArrowLeft'  && cur > 0) enterChapter(cur-1);
});

function resize(){
  const w = stage.clientWidth || window.innerWidth;
  const h = stage.clientHeight || window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w/h;
  camera.fov = (w/h < 1.1) ? 62 : 44;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

enterChapter(0);
requestAnimationFrame(animate);
</script>
</body>
</html>
