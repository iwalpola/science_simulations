<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===========================================================================
   CONDUCTION — the 3D story

   The same glass pan on the same gas ring as convection.html, and six
   chapters:

     0  the pan          — the flame only ever touches the solid glass bottom
     1  into the glass   — particles in fixed places; the ones by the flame
                           vibrate harder, and it creeps up layer by layer
     2  pass it on       — one chain picked out: each kick is a collision
                           with the particle above
     3  two rods         — copper and glass across the ring, drawing pins
                           stuck on with wax; the copper's drop, the glass's
                           do not
     4  inside the rods  — the same heating, side by side: the copper's front
                           races, the glass's barely moves
     5  free electrons   — why: electrons pick energy up at the hot end and
                           carry it a long way before they hit an ion

   TWO WORLDS. The kitchen is at the origin; the particles are parked at
   MICRO_Y. The camera teleports between them behind a fade.

   EVERYTHING IS A PURE FUNCTION OF THE CHAPTER'S OWN CLOCK t. Temperatures
   are the closed-form solution of the heat equation for a bar whose end is
   suddenly held hot:

       T(x, t) = T0 + (Th - T0) erfc( x / (2 sqrt(alpha t)) )

   which is also what places the pins: a pin drops at the moment T at its
   distance reaches the melting point of the wax, found by inverting erfc.
   alpha = k / (rho c) for each material comes out of MAT, so the copper
   timings, the glass timings and the difference between the two rods in
   chapter 4 are all worked out from data-book values.

   It ignores the energy a rod loses to the air. For copper over a couple of
   minutes that hardly matters; for glass it is the whole story (in practice
   the pins never drop at all), and the caption says so.
=========================================================================== */

/* ------------------------------------------------------------ the numbers */
const MAT = {
  copper:{name:'copper', k:401, rho:8960, c:385},   // W/m K, kg/m³, J/kg °C
  glass :{name:'glass',  k:1.0, rho:2500, c:840}
};
for(const m of Object.values(MAT)) m.alpha = m.k/(m.rho*m.c);   // thermal diffusivity, m²/s

const T_ROOM = 20, T_HOT = 300;        // °C: the room, and the end held in the flame
const T_WAX  = 60;                     // °C: the wax lets go
const UNIT_M = 0.1;                    // one scene unit is 10 cm (the pan is 31 cm across)
const SPEEDUP = 6;                     // the rod chapter runs six times faster than life

/* ----------------------------------------------------------------- helpers */
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const lerp  = (a,b,u) => a + (b-a)*u;
const ss = (a,b,x) => { const u = clamp((x-a)/(b-a),0,1); return u*u*(3-2*u); };
const hexCss = n => '#'+n.toString(16).padStart(6,'0');

function rng(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash(i){
  let x = Math.imul(i|0, 0x9E3779B1);
  x ^= x >>> 16; x = Math.imul(x, 0x85EBCA6B);
  x ^= x >>> 13; x = Math.imul(x, 0xC2B2AE35);
  x ^= x >>> 16;
  return (x >>> 0)/4294967296;
}

/* erfc to about 1e-7 (Numerical Recipes, erfcc) */
function erfc(x){
  const z = Math.abs(x), t = 1/(1 + 0.5*z);
  const r = t*Math.exp(-z*z - 1.26551223 + t*(1.00002368 + t*(0.37409196 + t*(0.09678418 +
            t*(-0.18628806 + t*(0.27886807 + t*(-1.13520398 + t*(1.48851587 +
            t*(-0.82215223 + t*0.17087277)))))))));
  return x >= 0 ? r : 2 - r;
}
/* erfc is decreasing, so bisection is enough */
function erfcinv(f){
  let lo = -6, hi = 6;
  for(let i=0;i<80;i++){ const m = (lo+hi)/2; if(erfc(m) > f) lo = m; else hi = m; }
  return (lo+hi)/2;
}

/* how hot, as a fraction from room (0) to the held end (1), at distance x
   from the heated end after time t, when the diffusivity is D. Any units, as
   long as they agree. */
function heatFrac(x, t, D){
  if(x <= 0) return 1;
  if(t <= 0) return 0;
  return erfc(x/(2*Math.sqrt(D*t)));
}

/* =========================================================================
   THE RODS  (no three.js in here — the tests run it)
========================================================================= */
const ROD = {r0:0.1, r1:3.0, hot:0.55, y:0.54, rad:0.06};   // along the rod, from the middle of the ring
const PINS = [0.85, 1.25, 1.65, 2.05, 2.45];                 // where the pins are stuck on
const WAX_F = (T_WAX - T_ROOM)/(T_HOT - T_ROOM);             // the fraction at which the wax melts
const ROD_HEAT0 = 1.2;                                       // chapter time at which the flame lights
/* The experiment clock stops at ROD_MAX real seconds, however long the
   chapter is left on screen: long after the last copper pin, long before the
   model would let a glass pin go (and in real life it never would). */
const ROD_MAX = 150;
const rodClock = t => Math.min(t, ROD_HEAT0 + ROD_MAX/SPEEDUP);

/* real seconds for the wax at distance s (metres) past the flame to melt */
function meltSeconds(s, alpha){
  if(s <= 0) return 0;
  const z = erfcinv(WAX_F);
  return s*s/(4*alpha*z*z);
}
/* the same, in chapter time */
const pinDropAt = (r, mat) => ROD_HEAT0 + meltSeconds((r - ROD.hot)*UNIT_M, MAT[mat].alpha)/SPEEDUP;
/* the rod's temperature in °C at r, at chapter time t */
function rodTemp(r, t, mat){
  const real = (t - ROD_HEAT0)*SPEEDUP;
  return T_ROOM + (T_HOT - T_ROOM)*heatFrac((r - ROD.hot)*UNIT_M, real, MAT[mat].alpha);
}

const fmtTime = s => {
  s = Math.max(0, Math.floor(s));
  return Math.floor(s/60) + ':' + String(s % 60).padStart(2,'0');
};

/* the figures the captions quote, worked out rather than typed */
const FIG = {
  lastCopper: Math.round(meltSeconds((PINS[PINS.length-1] - ROD.hot)*UNIT_M, MAT.copper.alpha)),
  firstGlassMin: Math.floor(meltSeconds((PINS[0] - ROD.hot)*UNIT_M, MAT.glass.alpha)/60),
  kRatio: Math.round(MAT.copper.k/MAT.glass.k/100)*100,
  alphaRatio: MAT.copper.alpha/MAT.glass.alpha
};

/* =========================================================================
   THE PARTICLES  (no three.js here either)
========================================================================= */
const MICRO_Y = 400;

/* n particles dropped at random into an Lx by Ly by Lz box, then pushed apart
   until nobody is closer than the average spacing: a solid with no pattern,
   which is what glass is. Done once, from a fixed seed. */
function relax(n, Lx, Ly, Lz, seed){
  const R = rng(seed), P = new Float32Array(n*3);
  const d = Math.cbrt(Lx*Ly*Lz/n);
  const lim = [Lx/2 - d/2, Ly/2 - d/2, Lz/2 - d/2];
  for(let i=0;i<n;i++) for(let a=0;a<3;a++) P[i*3+a] = (R()*2-1)*lim[a];
  for(let it=0; it<500; it++){
    for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){
      const dx = P[j*3]-P[i*3], dy = P[j*3+1]-P[i*3+1], dz = P[j*3+2]-P[i*3+2];
      const r2 = dx*dx+dy*dy+dz*dz;
      if(r2 >= d*d) continue;
      const r = Math.sqrt(r2) || 1e-6, push = (d - r)*0.25/r;
      P[i*3] -= dx*push; P[i*3+1] -= dy*push; P[i*3+2] -= dz*push;
      P[j*3] += dx*push; P[j*3+1] += dy*push; P[j*3+2] += dz*push;
    }
    for(let i=0;i<n;i++) for(let a=0;a<3;a++) P[i*3+a] = clamp(P[i*3+a], -lim[a], lim[a]);
  }
  return {n, P, d};
}

/* neighbours: every pair closer than f times the spacing */
function bondsOf(B, f){
  const out = [], lim = B.d*f;
  for(let i=0;i<B.n;i++) for(let j=i+1;j<B.n;j++){
    const dx = B.P[j*3]-B.P[i*3], dy = B.P[j*3+1]-B.P[i*3+1], dz = B.P[j*3+2]-B.P[i*3+2];
    if(dx*dx+dy*dy+dz*dz < lim*lim) out.push(i, j);
  }
  return out;
}

/* per-particle vibration: three phases and three rates, fixed by index */
function vibTable(n, off){
  const J = new Float32Array(n*6);
  for(let i=0;i<n;i++) for(let k=0;k<3;k++){
    J[i*6+k]   = hash(off + i*9 + k)*6.283;
    J[i*6+3+k] = 0.8 + 0.5*hash(off + i*9 + 3 + k);
  }
  return J;
}
/* A particle in a solid vibrates about a fixed place. Hotter means a bigger
   swing at much the same rate — so it moves faster. zk limits the swing
   across the rod, where the free electrons have to get past. */
const VIB_W = 11;
function vibrate(home, J, i, amp, t, out, zk){
  for(let a=0;a<3;a++)
    out[a] = home[i*3+a] + amp*(a === 2 && zk != null ? zk : 1)*Math.sin(VIB_W*J[i*6+3+a]*t + J[i*6+a]);
  return out;
}

/* ---------- the glass bottom of the pan ---------- */
const SLAB = {Lx:6.2, Ly:3.1, Lz:1.24, R:0.2};
const SLAB_B = relax(100, SLAB.Lx, SLAB.Ly, SLAB.Lz, 7);
const SLAB_BONDS = bondsOf(SLAB_B, 1.3);
const SLAB_J = vibTable(SLAB_B.n, 100);
const SLAB_D = 0.7;                    // display diffusivity: the front crosses the slab in ~8 s
const SLAB_HEAT0 = 2.5;                // chapter 1: when the flame starts heating the bottom
const AMP0 = 0.025, AMP1 = 0.13;       // swing at room temperature, and right by the flame

/* how hot a particle at height y (slab-centred) is, chapter 1's clock */
const slabFrac = (y, t) => heatFrac(y + SLAB.Ly/2, t - SLAB_HEAT0, SLAB_D);

/* the chain picked out in chapter 2: start at the bottom, near the middle and
   near the front, and keep stepping to the nearest particle above */
const CHAIN = (function(){
  const P = SLAB_B.P, n = SLAB_B.n, d = SLAB_B.d;
  let best = -1, bs = Infinity;
  for(let i=0;i<n;i++){
    const s = P[i*3+1] + 2*Math.abs(P[i*3]) - 1.2*P[i*3+2];
    if(s < bs){ bs = s; best = i; }
  }
  const chain = [best];
  for(;;){
    const c = chain[chain.length-1];
    let nx = -1, nd = Infinity;
    for(let j=0;j<n;j++){
      const dy = P[j*3+1] - P[c*3+1];
      if(dy < 0.25*d) continue;
      const dist = Math.hypot(P[j*3]-P[c*3], dy, P[j*3+2]-P[c*3+2]);
      if(dist > 1.5*d) continue;
      const score = dist + 1.2*Math.abs(P[j*3]) - 0.6*P[j*3+2];
      if(score < nd){ nd = score; nx = j; }
    }
    if(nx < 0) break;
    chain.push(nx);
  }
  return chain;
})();

/* A kick travels up the chain. Particle j swings towards particle j+1 for
   PULSE_TAU seconds; halfway through, at the top of its swing, it touches
   j+1 — and that is the moment j+1 starts its own swing. So each link starts
   PULSE_TAU/2 after the one below, and nothing ever moves before it is hit. */
const PULSE0 = 2.0, PULSE_P = 2.4, PULSE_TAU = 0.5, PULSE_B = 0.2, PULSE_DECAY = 0.8;
const pulseStart = (k, j) => PULSE0 + k*PULSE_P + j*PULSE_TAU/2;

/* the swing of chain link j at time t (0 when not being kicked), and the
   latest pulse that reached it */
function chainSwing(j, t){
  const k = Math.floor((t - PULSE0 - j*PULSE_TAU/2)/PULSE_P);
  if(k < 0) return 0;
  const s = t - pulseStart(k, j);
  if(s < 0 || s > PULSE_TAU) return 0;
  return PULSE_B*Math.pow(PULSE_DECAY, j)*Math.sin(Math.PI*s/PULSE_TAU);
}

/* ---------- inside the two rods ---------- */
const PIECE = {Lx:12, Ly:2.4, Lz:1.2};
const GLASS_B = relax(145, PIECE.Lx, PIECE.Ly, PIECE.Lz, 31);
const GLASS_BONDS = bondsOf(GLASS_B, 1.3);
const GLASS_J = vibTable(GLASS_B.n, 3000);

/* Copper is a face-centred cubic lattice, 10 cells by 2 by 1, offset a
   quarter of a cell from each face (the same arrangement as the wire in
   electricity/wire-resistance.html). Every ion sits in one of two layers,
   at z = -0.3 or +0.3. The free electrons fly in the three planes between
   and outside those layers, so they never pass through an ion — the gap to
   the nearest layer is bigger than an ion and an electron together, even at
   the widest cross-rod swing. */
const LAT_A = 1.2, R_ION = 0.17, R_EL = 0.065;
const CU = (function(){
  const F = [[0,0,0],[0.5,0.5,0],[0.5,0,0.5],[0,0.5,0.5]];
  const nx = 10, ny = 2, nz = 1, P = [];
  for(let i=0;i<nx;i++) for(let j=0;j<ny;j++) for(let k=0;k<nz;k++) for(const b of F)
    P.push(-PIECE.Lx/2 + (i + b[0] + 0.25)*LAT_A,
           -PIECE.Ly/2 + (j + b[1] + 0.25)*LAT_A,
           -PIECE.Lz/2 + (k + b[2] + 0.25)*LAT_A);
  return {n:P.length/3, P:new Float32Array(P)};
})();
const CU_J = vibTable(CU.n, 7000);
const EL_PLANES = [-0.6, 0, 0.6];
const CU_AMP0 = 0.02, CU_AMP1 = 0.09, CU_ZK = 0.5;   // the cross-rod swing is capped at 0.045

const N_EL = 36, EL_SPEED = 2.3;
const EL = (function(){
  const R = rng(99), e = [];
  for(let i=0;i<N_EL;i++){
    const a = R()*Math.PI*2;
    e.push({z:EL_PLANES[i % 3],
            x0:(R()*2-1)*5.8, y0:(R()*2-1)*1.0,
            vx:Math.cos(a)*EL_SPEED*(0.8 + 0.4*R()), vy:Math.sin(a)*EL_SPEED*0.5});
  }
  return e;
})();
const EL_X = PIECE.Lx/2 - 0.12, EL_Y = PIECE.Ly/2 - 0.12;

/* a straight line folded back into [-h, h]: a ball bouncing between walls */
function tri(u, h){
  const L = 2*h, w = ((u + h) % (2*L) + 2*L) % (2*L);
  return -h + (w < L ? w : 2*L - w);
}
function electronAt(e, t, out){
  out[0] = tri(e.x0 + e.vx*t, EL_X);
  out[1] = tri(e.y0 + e.vy*t, EL_Y);
  out[2] = e.z;
  return out;
}

/* display diffusivities for chapter 4: copper's front crosses its piece in
   about nine seconds; glass's is copper's divided by the real ratio */
const CU_D = 5.2;
const GL_D = CU_D/FIG.alphaRatio;
const ROD_MICRO_HEAT0 = 1.5;
const pieceFrac = (x, t, D) => heatFrac(x + PIECE.Lx/2, t - ROD_MICRO_HEAT0, D);

/* chapter 5 holds the copper as it was a few seconds into chapter 4 */
const CH5_T = ROD_MICRO_HEAT0 + 3;

/* the energy an electron carries: the average of how hot the rod was where
   it has been over the last second — so a hot electron stays hot for a while
   after it has left the hot end */
const _e = [0,0,0];
function electronHeat(e, t, fieldT){
  let s = 0;
  for(let k=0;k<5;k++){
    const tb = t - k*0.3;
    electronAt(e, tb, _e);
    s += pieceFrac(_e[0], fieldT(tb), CU_D);
  }
  return s/5;
}

/* ---------- chapter 5: three electrons followed ---------- */
/* Each leaves the hot end, flies straight to an ion far down the rod, hits
   it, and comes back more slowly having given most of its energy away. */
const TR_P = 4.2, TR_FLY = 1.5;
const TRACERS = [
  {off:0.6, y:-0.55, z:0,    ion:null},
  {off:2.0, y: 0.35, z:0.6,  ion:null},
  {off:3.4, y: 0.0,  z:-0.6, ion:null}
];
(function aimTracers(){
  /* each aims at an ion in the right-hand third, next to its plane */
  const used = new Set();
  TRACERS.forEach((tr, i)=>{
    let best = -1, bs = Infinity;
    for(let m=0;m<CU.n;m++){
      if(used.has(m)) continue;
      const x = CU.P[m*3], y = CU.P[m*3+1], z = CU.P[m*3+2];
      if(Math.abs(Math.abs(z - tr.z) - 0.3) > 1e-6) continue;
      const s = Math.abs(x - (2.2 + i*1.1)) + Math.abs(y - tr.y);
      if(s < bs){ bs = s; best = m; }
    }
    used.add(best);
    tr.ion = best;
    tr.start = [-5.5, tr.y, tr.z];
    /* the point in the electron's plane right beside the ion: contact */
    tr.hit = [CU.P[best*3], CU.P[best*3+1], tr.z];
    tr.back = [CU.P[best*3] - 2.2, clamp(tr.y + 0.5, -1.0, 1.0), tr.z];
  });
})();
/* where tracer i is, how much energy it has (1 = fresh from the hot end), and
   the time since its last hit, or -1 */
function tracerAt(tr, t, out){
  const c = t - tr.off;
  if(c < 0){ out.visible = false; return out; }
  const s = c % TR_P;
  out.visible = true;
  if(s < TR_FLY){
    const u = s/TR_FLY;
    for(let a=0;a<3;a++) out.p[a] = lerp(tr.start[a], tr.hit[a], u);
    out.energy = 1; out.since = -1;
  } else {
    const u = ss(0, TR_P - TR_FLY, s - TR_FLY);
    for(let a=0;a<3;a++) out.p[a] = lerp(tr.hit[a], tr.back[a], u);
    out.energy = 0.2; out.since = s - TR_FLY;
  }
  out.fadeIn  = ss(0, 0.25, s);
  out.fadeOut = 1 - ss(TR_P - 0.4, TR_P, s);
  return out;
}
/* how much extra an ion is swinging because a tracer has just hit it */
function ionKick(m, t){
  let k = 0;
  for(const tr of TRACERS){
    if(tr.ion !== m) continue;
    const c = t - tr.off - TR_FLY;
    if(c < 0) continue;
    const s = c % TR_P;
    k = Math.max(k, Math.exp(-s/0.7));
  }
  return k;
}

function linearise(root){

    if(!o.material) return;
    (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{
      if(!m || m.userData.__lin) return;
      m.userData.__lin = true;
      if(m.color)    m.color.convertSRGBToLinear();
      if(m.emissive) m.emissive.convertSRGBToLinear();

  });
}

/* ------------------------------------------------------------------ labels */
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}
function makeLabel(text, opt){
  opt = opt || {};
  const size = opt.size || 54, pad = opt.bg ? 26 : 18;
  const c = document.createElement('canvas'), ctx = c.getContext('2d');
  const font = (opt.weight || 600)+' '+size+'px "Iowan Old Style", Charter, Georgia, serif';
  ctx.font = font;
  const w = Math.ceil(ctx.measureText(text).width) + pad*2, h = size + pad*2;
  c.width = w; c.height = h;
  if(opt.bg){
    roundRect(ctx, 3, 3, w-6, h-6, (h-6)/2);
    ctx.fillStyle = opt.bg; ctx.fill();
    if(opt.border){ ctx.lineWidth = 4; ctx.strokeStyle = opt.border; ctx.stroke(); }
  }
  ctx.font = font; ctx.textAlign='center'; ctx.textBaseline='middle';
  if(!opt.bg){ ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 14; }
  ctx.fillStyle = opt.color || '#eef2f7';
  ctx.fillText(text, w/2, h/2 + size*0.04);
  const tex = new THREE.CanvasTexture(c); tex.anisotropy = 4;
  tex.encoding = THREE.sRGBEncoding;
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({
    map:tex, transparent:true, depthTest:false, depthWrite:false}));
  spr.renderOrder = 30;
  const scale = opt.scale || 0.3;
  spr.scale.set(w/h*scale, scale, 1);
  spr.userData.opt = opt; spr.userData.text = text;
  return spr;
}
function setLabel(spr, text){
  const fresh = makeLabel(text, spr.userData.opt);
  if(spr.material.map) spr.material.map.dispose();
  spr.material.map = fresh.material.map;
  spr.material.needsUpdate = true;
  spr.scale.copy(fresh.scale); spr.userData.text = text;
  fresh.material.dispose();
}
function leader(parent, a, b, col){
  const g = new THREE.BufferGeometry().setFromPoints([a, b]);
  const l = new THREE.Line(g, new THREE.LineBasicMaterial({
    color:col || 0xb8c4d4, transparent:true, depthTest:false, depthWrite:false}));
  l.renderOrder = 29;
  parent.add(l);
  return l;
}
function makeArrow(len, col, rad){
  rad = rad || 0.06;
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({color:col, roughness:0.4, transparent:true,
    emissive:new THREE.Color(col).multiplyScalar(0.45)});
  const head = Math.min(len*0.4, rad*4.2);
  const shaft = new THREE.Mesh(CYL, mat);
  shaft.scale.set(rad, len-head, rad); shaft.position.y = (len-head)/2;
  const tip = new THREE.Mesh(CONE, mat);
  tip.scale.set(rad*2.6, head, rad*2.6); tip.position.y = len - head/2;
  g.add(shaft, tip);
  return g;
}

/* ---------------------------------------------------------- the cue sheet */
const CUES = [];
function cue(ch, obj, t0, o){
  o = o || {};
  obj.traverse(m=>{ if(m.material){ m.material.transparent = true; if(m.userData.op == null) m.userData.op = m.material.opacity; }});
  CUES.push({ch, obj, t0, t1:o.t1, rise:o.rise || 0, base:obj.position.clone()});
  obj.visible = false;
  return obj;
}
function setOpacity(obj, a){
  obj.traverse(m=>{ if(m.material) m.material.opacity = a*(m.userData.op != null ? m.userData.op : 1); });
}
function runCues(ch, t){
  for(const c of CUES){
    if(c.ch !== ch){ c.obj.visible = false; continue; }
    let a = ss(c.t0, c.t0 + 0.6, t);
    if(c.t1 != null) a *= 1 - ss(c.t1, c.t1 + 0.5, t);
    c.obj.visible = a > 0.002;
    if(!c.obj.visible) continue;
    setOpacity(c.obj, a);
    c.obj.position.y = c.base.y + c.rise*ss(c.t0, c.t0 + 1.8, t);
  }
}

/* A rod lies along its own +x, from ROD.r0 to ROD.r1, in a group turned to

const rodGrp = new THREE.Group(); macro.add(rodGrp);
const RODS = {};
const HEAT_RAMP = [[0,0x000000],[0.25,0x5a0a00],[0.55,0xd8400a],[0.8,0xff9a1a],[1,0xffe27a]];
const _hc = new THREE.Color(), _hc2 = new THREE.Color();
function heatColour(f, out){
  f = clamp(f, 0, 1);
  for(let i=1;i<HEAT_RAMP.length;i++){
    if(f <= HEAT_RAMP[i][0]){
      const a = HEAT_RAMP[i-1], b = HEAT_RAMP[i];
      _hc.set(a[1]); _hc2.set(b[1]);
      return out.copy(_hc).lerp(_hc2, (f - a[0])/(b[0] - a[0])).convertSRGBToLinear();
    }
  }
  return out.set(HEAT_RAMP[HEAT_RAMP.length-1][1]).convertSRGBToLinear();
}
const SEGS = 48;
function buildRod(mat){
  const g = new THREE.Group();
  g.rotation.y = -ROD_ANG[mat];
  g.position.y = ROD.y;
  rodGrp.add(g);
  const len = ROD.r1 - ROD.r0;
  const body = new THREE.Mesh(new THREE.CylinderGeometry(ROD.rad, ROD.rad, len, 24),
    mat === 'copper'
      ? new THREE.MeshStandardMaterial({color:COL.copper, roughness:0.3, metalness:0.9, envMapIntensity:0.9})
      : new THREE.MeshStandardMaterial({color:0xd8e8f2, roughness:0.05, transparent:true, opacity:0.45,
          depthWrite:false, envMapIntensity:1.4}));
  body.rotation.z = Math.PI/2; body.position.x = (ROD.r0 + ROD.r1)/2;
  g.add(body);

  const sleeve = new THREE.InstancedMesh(new THREE.CylinderGeometry(1,1,1,16,1,true),
    new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, blending:THREE.AdditiveBlending,
      depthWrite:false}), SEGS);

/* a pin that has let go falls, and lies on the hob. The hob top is y = 0,
   which in the rod's own frame is -ROD.y. */
const G_FALL = 9;
function placePin(p, t){
  const s = t - p.drop;
  if(s <= 0){ p.pin.position.y = p.hang; p.pin.rotation.set(0,0,0); return; }
  const rest = -ROD.y + 0.012;
  const land = Math.sqrt(2*(p.hang - rest)/G_FALL);
  if(s < land){
    p.pin.position.y = p.hang - 0.5*G_FALL*s*s;
    p.pin.rotation.set(0, 0, 0.6*s/land);
  } else {
    p.pin.position.y = rest;
    p.pin.rotation.set(0, 0, Math.PI/2);
  }
}
const _c = new THREE.Color();
function updateRods(t, show){
  rodGrp.visible = show;
  if(!show) return;
  for(const mat of ['copper','glass']){
    const R = RODS[mat], seg = (ROD.r1 - ROD.r0)/SEGS;
    for(let i=0;i<SEGS;i++){
      const f = (rodTemp(ROD.r0 + (i+0.5)*seg, t, mat) - T_ROOM)/(T_HOT - T_ROOM);
      R.sleeve.setColorAt(i, heatColour(f, _c));
    }
    R.sleeve.instanceColor.needsUpdate = true;
    for(const p of R.pins){
      placePin(p, t);
      /* the wax softens over the last moments before it lets go */
      const melt = ss(p.drop - 0.5, p.drop, t);
      p.wax.scale.set(0.055*(1 - 0.5*melt), 0.035*(1 - 0.6*melt), 0.055*(1 - 0.5*melt));
      p.wax.material.opacity = 1 - 0.6*melt;
    }
  }
}

function instanced(n, rad, col, geo){
  const mat = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.35, metalness:0.1});
  const m = new THREE.InstancedMesh(geo || SPH, mat, n);
  m.frustumCulled = false;
  m.userData.rad = rad;
  const c = lin(col);
  for(let i=0;i<n;i++) m.setColorAt(i, c);
  return m;
}
function setInst(mesh, i, p, r){
  const A = mesh.instanceMatrix.array, o = i*16;
  A[o]=r; A[o+1]=0; A[o+2]=0; A[o+3]=0;
  A[o+4]=0; A[o+5]=r; A[o+6]=0; A[o+7]=0;
  A[o+8]=0; A[o+9]=0; A[o+10]=r; A[o+11]=0;
  A[o+12]=p[0]; A[o+13]=p[1]; A[o+14]=p[2]; A[o+15]=1;
}
function bondLines(bonds, col, op){
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(bonds.length*3), 3));
  const l = new THREE.LineSegments(g, new THREE.LineBasicMaterial({color:col, transparent:true, opacity:op}));
  l.frustumCulled = false;
  return l;
}
function updateBonds(lines, bonds, pos){
  const A = lines.geometry.attributes.position.array;
  for(let k=0;k<bonds.length;k++){
    const i = bonds[k];
    A[k*3] = pos[i*3]; A[k*3+1] = pos[i*3+1]; A[k*3+2] = pos[i*3+2];
  }
  lines.geometry.attributes.position.needsUpdate = true;
}
/* a strip of heat under or beside a piece, with small arrows of energy */
function heaterStrip(w, d, vertical){
  const g = new THREE.Group();
  const plate = new THREE.Mesh(BOX, new THREE.MeshStandardMaterial({color:COL.warm, roughness:0.5,
    emissive:new THREE.Color(COL.warm).multiplyScalar(0.7)}));
  plate.scale.set(vertical ? 0.08 : w, vertical ? w : 0.08, d);
  g.add(plate);
  const arrows = [];
  for(let i=0;i<5;i++){
    const a = makeArrow(0.32, COL.energy, 0.035);
    const u = (i - 2)/2*w*0.38;
    if(vertical){ a.rotation.z = -Math.PI/2; a.position.set(0.05, u, d/2 + 0.1); }
    else        { a.position.set(u, 0.05, d/2 + 0.1); }
    g.add(a); arrows.push(a);
  }
  linearise(g);
  g.userData = {plate, arrows, vertical};
  return g;
}
function runHeater(h, on, t){
  h.visible = on > 0.01;
  if(!h.visible) return;
  h.userData.plate.material.emissive.set(COL.warm).convertSRGBToLinear().multiplyScalar(0.25 + 0.7*on);
  h.userData.arrows.forEach((a, i)=>{
    const f = ((t*0.9 + i*0.37) % 1 + 1) % 1;
    if(h.userData.vertical) a.position.x = 0.05 + 0.3*f; else a.position.y = 0.05 + 0.3*f;
    a.traverse(m=>{ if(m.material) m.material.opacity = on*Math.sin(Math.PI*f); });
  });
}

const CHAIN_AT = new Map(CHAIN.map((m,j)=>[m,j]));
function updateSlab(ch, t){
  /* chapter 2 holds the glass as it was late in chapter 1 */
  const tf = ch === 1 ? t : SLAB_HEAT0 + 8;
  const P = SLAB_B.P, chainAt = CHAIN_AT;
  for(let i=0;i<SLAB_B.n;i++){
    const f = slabFrac(P[i*3+1], tf);
    vibrate(P, SLAB_J, i, lerp(AMP0, AMP1, f), t, _pp);
    let col = _c.copy(C.cold).lerp(C.hot, f);
    if(ch === 2){
      const j = chainAt.get(i);
      if(j === undefined){
        col.lerp(C.dim, 0.7);
      } else {
        /* a chain link swings towards the next one when it is kicked */
        const sw = chainSwing(j, t);
        const nx = CHAIN[j+1];
        let ux = 0, uy = 1, uz = 0;
        if(nx !== undefined){
          ux = P[nx*3]-P[i*3]; uy = P[nx*3+1]-P[i*3+1]; uz = P[nx*3+2]-P[i*3+2];
          const l = Math.hypot(ux,uy,uz); ux/=l; uy/=l; uz/=l;
        }
        _pp[0] += ux*sw; _pp[1] += uy*sw; _pp[2] += uz*sw;
        col.lerp(C.white, clamp(sw/(PULSE_B*0.6), 0, 1)*0.8);
      }
    }
    slabPos[i*3] = _pp[0]; slabPos[i*3+1] = _pp[1]; slabPos[i*3+2] = _pp[2];
    setInst(slabMesh, i, _pp, SLAB.R);
    slabMesh.setColorAt(i, col);
  }
  slabMesh.instanceMatrix.needsUpdate = true;
  slabMesh.instanceColor.needsUpdate = true;
  updateBonds(slabBonds, SLAB_BONDS, slabPos);
  slabBonds.material.opacity = ch === 2 ? 0.14 : 0.35;

  /* the flashes: where link j touches link j+1 */
  flashes.forEach((fl, j)=>{
    fl.visible = false;
    if(ch !== 2 || j >= CHAIN.length-1) return;
    const k = Math.floor((t - PULSE0 - j*PULSE_TAU/2)/PULSE_P);
    if(k < 0) return;
    const s = t - pulseStart(k, j) - PULSE_TAU/2;
    if(s < 0 || s > 0.35) return;
    const a = CHAIN[j], b = CHAIN[j+1];
    fl.position.set((slabPos[a*3]+slabPos[b*3])/2, (slabPos[a*3+1]+slabPos[b*3+1])/2, (slabPos[a*3+2]+slabPos[b*3+2])/2);
    fl.material.opacity = (1 - s/0.35)*Math.pow(PULSE_DECAY, j);
    fl.scale.setScalar(0.35 + 0.5*s);
    fl.visible = true;
  });

  /* the water on top */
  const wf = waterFrac(tf);
  const wc = _c.copy(C.water).lerp(C.waterH, wf);
  if(ch === 2) wc.lerp(C.dim, 0.6);
  for(let i=0;i<WATER_B.n;i++){
    const B = WATER_B.P, J = WATER_J;
    for(let a=0;a<3;a++){
      _pp[a] = B[i*3+a] + (0.06 + 0.06*wf)*Math.sin(6*J[i*6+3+a]*t + J[i*6+a])
                        + 0.12*Math.sin(0.9*J[i*6+3+((a+1)%3)]*t + J[i*6+((a+2)%3)]);
    }
    _pp[1] += WATER_Y;
    setInst(waterMesh, i, _pp, 0.19);
    waterMesh.setColorAt(i, wc);
  }
  waterMesh.instanceMatrix.needsUpdate = true;
  waterMesh.instanceColor.needsUpdate = true;

  runHeater(slabHeat, ch === 1 ? ss(SLAB_HEAT0 - 0.4, SLAB_HEAT0, t) : 1, t);
}

function updateCopper(ch, t, fieldT){
  const tf = fieldT(t);
  for(let m=0;m<CU.n;m++){
    const f = pieceFrac(CU.P[m*3], tf, CU_D);

    vibrate(CU.P, CU_J, m, lerp(CU_AMP0, CU_AMP1, Math.max(f, kick)), t, _pp, CU_ZK);
    ionPos[m*3] = _pp[0]; ionPos[m*3+1] = _pp[1]; ionPos[m*3+2] = _pp[2];
    setInst(ionMesh, m, _pp, R_ION);
    const col = _c.copy(C.ion).lerp(C.ionHot, Math.max(f, kick));
    if(kick > 0) col.lerp(C.white, 0.6*kick);

  cue(3, lbl(macro, 'glass',  at('glass',  2.4, 1.05), {scale:0.32, color:'#cfe3f0'}), 0.8);
  cue(3, lbl(macro, 'drawing pins, stuck on with wax', at('glass', 2.2, 0.12).add(V(0,0,0.9)), {scale:0.22, color:DIM}), 1.6, {t1:ROD_HEAT0 + 4});

}
cue(3, lbl(macro, 'colour shows how hot — like a thermal camera', V(0, -0.45, 2.0), NOTE), 1.0);
cue(3, lbl(macro, 'copper is a much better conductor', V(0, 2.75, 0), Object.assign({scale:0.3}, PILL_GOLD)),
    ROD_HEAT0 + FIG.lastCopper/SPEEDUP + 0.8, {rise:0.08});

/* chapter 4 — inside the rods */
cue(4, lbl(glassPiece, 'glass', V(-PIECE.Lx/2 + 0.2, PIECE.Ly/2 + 0.45, 0), {scale:0.34, color:'#cfe3f0'}), 0.4);
cue(4, lbl(cuPiece, 'copper', V(-PIECE.Lx/2 + 0.3, PIECE.Ly/2 + 0.45, 0), {scale:0.34, color:hexCss(COL.copper)}), 0.4);
cue(4, lbl(glassPiece, 'vibrations only — passed from neighbour to neighbour', V(1.3, PIECE.Ly/2 + 0.45, 0), Object.assign({scale:0.24}, PILL_DARK)), 2.5);

/* chapter 5 — free electrons */
cue(5, lbl(cuPiece, 'free electrons gain energy at the hot end', V(-3.2, PIECE.Ly/2 + 0.5, 0), Object.assign({scale:0.24}, PILL_DARK, {color:'#ffe9a0'})), 1.0);
cue(5, lbl(cuPiece, '…travel a long way through the metal…', V(0.4, -PIECE.Ly/2 - 0.5, 0.6), Object.assign({scale:0.24}, PILL_DARK)), TRACERS[0].off + 0.8);
cue(5, lbl(cuPiece, '…and hit an ion, which vibrates harder', V(3.3, PIECE.Ly/2 + 0.5, 0), Object.assign({scale:0.24}, PILL_DARK, {color:'#ffb08a'})), TRACERS[0].off + TR_FLY + 0.2);

linearise(macro);
linearise(micro);

/* =========================================================================
   THE CHAPTERS
========================================================================= */

const KEY = {

  pHot    :'<div><span class="dot" style="background:'+hexCss(COL.hot)+'"></span>glass particle, hot</div>',
  water   :'<div><span class="dot" style="background:'+hexCss(COL.water)+'"></span>water particle</div>',
  energy  :'<div><span class="sq" style="background:'+hexCss(COL.energy)+'"></span>energy from the flame</div>',
  flash   :'<div><span class="dot" style="background:'+hexCss(COL.energy)+'"></span>a collision</div>',
  heat    :'<div><span class="grad" style="background:linear-gradient(90deg,#5a0a00,#d8400a,#ff9a1a,#ffe27a)"></span>how hot the rod is</div>',

};

/* ------------------------------------------------------------- the camera */
const FADE = 0.32;
function shotAt(Ch, t){
  let s0 = 0;
  for(let i=0;i<Ch.shots.length;i++){
    const sh = Ch.shots[i], end = sh.until != null ? sh.until : Infinity;
    if(t < end || i === Ch.shots.length-1){
      const u = ss(0, sh.dur, t - s0);
      let fade = 1 - clamp((t - s0)/FADE, 0, 1);
      if(isFinite(end)) fade = Math.max(fade, 1 - clamp((end - t)/FADE, 0, 1));
      return {world:sh.world, cam:lerpCam(sh.from, sh.to, u), fade, index:i};
    }
    s0 = end;
  }
}
function lerpCam(a, b, u){
  return {
    dist: Math.exp(lerp(Math.log(a.dist), Math.log(b.dist), u)),
    az: lerp(a.az, b.az, u), el: lerp(a.el, b.el, u),
    look:[lerp(a.look[0],b.look[0],u), lerp(a.look[1],b.look[1],u), lerp(a.look[2],b.look[2],u)]
  };
}
function worldAt(ch, t){ return shotAt(CH[ch], t).world; }

let dragAz = 0, dragEl = 0, zoomAdj = 0;
function applyCamera(c){
  const az = c.az + dragAz, el = clamp(c.el + dragEl, -0.4, 1.2);
  const d = Math.max(0.4, c.dist*Math.exp(zoomAdj));
  camera.position.set(
    c.look[0] + d*Math.cos(el)*Math.sin(az),
    c.look[1] + d*Math.sin(el),
    c.look[2] + d*Math.cos(el)*Math.cos(az));
  camera.lookAt(c.look[0], c.look[1], c.look[2]);
}

/* ---------------------------------------------------------------- a frame */
let cur = 0, shownClock = null;

function frame(t){
  const Ch = CH[cur];
  const shot = shotAt(Ch, t);
  applyCamera(shot.cam);
  fadeEl.style.opacity = shot.fade.toFixed(3);

  const inMacro = shot.world === 'macro';
  macro.visible = inMacro;
  micro.visible = !inMacro;

  if(inMacro){
    updateFlame(Ch.flame ? Ch.flame(t) : 0, t);
    panGrp.visible = !!Ch.pan;
    bottomGlow.material.opacity = Ch.bottom ? Ch.bottom(t) : 0;
    updateRods(Ch.rodT ? Ch.rodT(t) : rodClock(t), !!Ch.rods);
    if(cur === 3){
      const txt = fmtTime((rodClock(t) - ROD_HEAT0)*SPEEDUP);
      if(txt !== shownClock){ shownClock = txt; setLabel(clockLbl, txt); }
    }
  }

  slab.visible = Ch.micro === 'slab';
  glassPiece.visible = Ch.micro === 'pieces';
  cuPiece.visible = Ch.micro === 'pieces' || Ch.micro === 'copper';

  if(!inMacro){
    if(Ch.micro === 'slab') updateSlab(cur, t);
    if(Ch.micro === 'pieces'){
      updateGlassPiece(t, t);
      updateCopper(4, t, x => x);
    }
    if(Ch.micro === 'copper') updateCopper(5, t, () => CH5_T);
    runHeater(glassHeat, ss(ROD_MICRO_HEAT0 - 0.4, ROD_MICRO_HEAT0, t), t);
    runHeater(cuHeat, Ch.micro === 'copper' ? 1 : ss(ROD_MICRO_HEAT0 - 0.4, ROD_MICRO_HEAT0, t), t);
  }

  runCues(cur, t);
  renderer.render(scene, camera);
}

/* --------------------------------------------------------------- chapters */
let chStart = null;
function enterChapter(i){
  cur = i; chStart = null; shownClock = null;
  dragAz = dragEl = zoomAdj = 0;
  const Ch = CH[i];
  document.getElementById('sStep').textContent = (i+1)+' / '+CH.length+' · '+Ch.part;
  document.getElementById('sTitle').innerHTML = Ch.title;
  document.getElementById('sText').innerHTML = Ch.text;
  const lk = document.getElementById('sLook');
  lk.innerHTML = Ch.look ? 'Watch for: '+Ch.look : ''; lk.hidden = !Ch.look;
  const sc = document.getElementById('sScale');
  sc.textContent = Ch.scale || ''; sc.hidden = !Ch.scale;
  const tm = document.getElementById('sTerms');
  tm.innerHTML = Ch.terms.length
    ? '<div class="hd">Key words</div>' + Ch.terms.map(x=>'<dt>'+x[0]+'</dt><dd>'+x[1]+'</dd>').join('')
    : '';
  tm.hidden = !Ch.terms.length;
  document.getElementById('key').innerHTML = Ch.key.map(k=>KEY[k]).join('');
  document.getElementById('back').disabled = i === 0;
  document.getElementById('next').disabled = i === CH.length-1;
  document.querySelectorAll('#dots i').forEach((d,k)=>d.classList.toggle('on', k === i));
}

function animate(now){
  requestAnimationFrame(animate);
  if(chStart === null) chStart = now;
  frame((now - chStart)/1000);
}

/* ------------------------------------------------------------------ wiring */
const cv = renderer.domElement;
cv.style.touchAction = 'none';
cv.style.cursor = 'grab';
let dragging = false, lastX = 0, lastY = 0;
cv.addEventListener('pointerdown', e=>{
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  cv.style.cursor = 'grabbing';
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e=>{
  if(!dragging) return;
  dragAz += (e.clientX - lastX)*0.006;
  dragEl = clamp(dragEl + (e.clientY - lastY)*0.004, -0.5, 1.0);
  lastX = e.clientX; lastY = e.clientY;
});
['pointerup','pointercancel'].forEach(ev=>
  cv.addEventListener(ev, ()=>{ dragging = false; cv.style.cursor = 'grab'; }));
cv.addEventListener('wheel', e=>{
  e.preventDefault();
  zoomAdj = clamp(zoomAdj + e.deltaY*0.001, -0.9, 0.9);
}, {passive:false});

const dotsEl = document.getElementById('dots');
CH.forEach((c,i)=>{
  const d = document.createElement('i');
  d.title = c.title;
  d.addEventListener('click', ()=>enterChapter(i));
  dotsEl.appendChild(d);
});
document.getElementById('next').addEventListener('click', ()=>{ if(cur < CH.length-1) enterChapter(cur+1); });
document.getElementById('back').addEventListener('click', ()=>{ if(cur > 0) enterChapter(cur-1); });
document.getElementById('replay').addEventListener('click', ()=>enterChapter(cur));
window.addEventListener('keydown', e=>{
  if(e.key === 'ArrowRight' && cur < CH.length-1) enterChapter(cur+1);
  if(e.key === 'ArrowLeft'  && cur > 0) enterChapter(cur-1);
});

function resize(){
  const w = stage.clientWidth || window.innerWidth;
  const h = stage.clientHeight || window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w/h;
  camera.fov = (w/h < 1.1) ? 62 : 44;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

enterChapter(0);
requestAnimationFrame(animate);
</script>
